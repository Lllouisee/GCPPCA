理虛擬機器——可以想成比 Compute Engine 更簡化、不需要包成容器的選擇。這題裡 App Engine 就是跑著音樂分享網站後端、提供使用者瀏覽網頁的地方。"}, {"heading": "核心概念：Signed URL（簽署網址）", "body": "由後端用自己服務帳戶的私鑰，對「特定操作、特定檔案、有效期限」做數位簽章後產生的一個特殊網址（例如指向 storage.googleapis.com）。拿到這個網址的人，在有效期限內可以執行該網址授權的單一特定操作（例如上傳一個檔案），不需要任何 GCP 身分或 IAM 權限——授權是綁在「這把有時效的鑰匙」上，不是綁在使用者身分上。這題的「POST URL」指的是這個網址只接受 HTTP POST（上傳/提交）方法，是程式（瀏覽器 JS）用來發送上傳請求的目標位址，不是給人點閱讀的一般網頁連結。"}, {"heading": "核心概念：WRITER 角色 = IAM", "body": "Cloud Storage 的 WRITER 角色是 IAM（身分與存取管理）底下的一種權限，綁定在「已知、已註冊的身分」（使用者帳號或服務帳戶）上，授予長期的寫入權限。公開網站的匿名訪客沒有 GCP 身分，沒辦法採用這種做法，這也是選項 B/D 錯誤的根本原因。"}, {"heading": "核心概念：CORS 是什麼、什麼時候會被觸發", "body": "CORS（跨來源資源共享）是瀏覽器內建的安全機制：瀏覽器裡的 JavaScript 程式碼（用 fetch/XHR）呼叫跟目前網頁不同來源（協定+網域+port 三者需完全一致才算同源）的服務時，瀏覽器預設會擋下這個請求，除非目標伺服器明確用 CORS 設定『允許』這個來源。\n\n判斷重點只看「JS 呼叫的對象，是否跟目前網頁同一個來源」，與對方是前端還是後端服務無關：JS 呼叫自己家的後端（同源，例如網頁跟 API 都在 your-app.appspot.com 底下）→ 不會觸發 CORS；JS 呼叫別人家的服務（跨源，例如本題網頁在 appspot.com、卻要打 storage.googleapis.com）→ 才會觸發 CORS 檢查。\n\n另外，就算是跨網域，以下情況也不受 CORS 限制：使用者點連結做整頁跳轉（非 JS 發起）、用 <img>/<link>/<script> 標籤載入別人家的靜態資源（JS 沒有要讀取回應內容）、傳統 HTML form 直接提交並整頁跳轉。CORS 限制的核心是『JS 主動發送請求、且想讀取回應內容』這個行為。\n\n這題之所以需要 CORS：題目要求『繞過後端，讓瀏覽器直接打 Cloud Storage』，這個設計本身就讓瀏覽器（來源 = appspot.com）直接呼叫另一個網域（storage.googleapis.com），觸發了跨來源檢查——這是從『App Engine 和 Cloud Storage 是兩個各自有固定網域的獨立 GCP 服務』這個背景知識推導出來的，題目本身沒有明講『跨網域』三個字，需要自行判斷架構。"}, {"heading": "延伸澄清：選項 C 第二步「用 App Engine 預設憑證簽署請求」是什麼意思", "body": "Signed URL 需要用私鑰做數位簽章才能產生。常見有兩種取得簽章能力的方式：① 匯出服務帳戶的 JSON 金鑰檔案，自己保管私鑰來簽；② 直接用執行環境本身的身分（例如 App Engine 自動配置的『預設服務帳戶』），呼叫 Google IAM 的 signBlob API，請 Google 用這個身分背後的金鑰代為簽署，程式碼完全不用碰到任何私鑰檔案——這就是 C 選項第二步在講的做法，本身是比『自己匯出金鑰檔案存在程式碼裡』更安全的習慣。\n\n但這不是 C 選項錯誤的原因：C 錯在完全漏掉『設定 CORS』這一步。不管用哪種方式簽出 Signed URL，只要 Cloud Storage bucket 沒有 CORS 允許 App Engine 的來源，瀏覽器就會在請求送達前直接擋下這個跨網域請求，使 Signed URL 再安全也無法發揮作用。"}]}}, {"id": "T1-Q193", "topic": 1, "qnum": 193, "question": "You are configuring the cloud network architecture for a newly created project in Google Cloud that will host applications in Compute Engine. Compute Engine virtual machine instances will be created in two different subnets (sub-a and sub-b) within a single region:• Instances in sub-a will have public IP addresses.• Instances in sub-b will have only private IP addresses.To download updated packages, instances must connect to a public repository outside the boundaries of Google Cloud. You need to allow sub-b to access the external repository. What should you do?", "options": [{"letter": "A", "text": "Enable Private Google Access on sub-b."}, {"letter": "B", "text": "Configure Cloud NAT and select sub-b in the NAT mapping section."}, {"letter": "C", "text": "Configure a bastion host instance in sub-a to connect to instances in sub-b."}, {"letter": "D", "text": "Enable Identity-Aware Proxy for TCP forwarding for instances in sub-b."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121322-exam-professional-cloud-architect-topic-1-question-193/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["VPC/網路"], "keywords": ["instances must connect to a public repository outside the boundaries of Google Cloud", "allow sub-b to access the external repository"], "explanation": {"questionZh": "你正在為一個新建立的 Google Cloud 專案設定雲端網路架構，這個專案會在 Compute Engine 上跑應用程式。虛擬機器實例會建立在同一個區域（region）內的兩個不同子網路（sub-a 和 sub-b）：sub-a 裡的實例有公開 IP 位址；sub-b 裡的實例只有私有 IP 位址。為了下載更新的軟體套件，實例必須連到 Google Cloud 範圍之外的公開套件庫。你需要讓 sub-b 能存取這個外部套件庫。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Private Google Access 只能讓沒有公開 IP 的 VM 存取「Google 自己的 API/服務」（例如 Cloud Storage、BigQuery），完全不適用於存取 Google Cloud 範圍以外、一般網際網路上的公開套件庫。", "zh": "在 sub-b 上啟用 Private Google Access。"}, {"letter": "B", "analysis": "正確：Cloud NAT 是讓「只有私有 IP」的 VM 能夠對外連到整個網際網路的標準做法，VM 本身不需要配公開 IP，由 Cloud NAT 代為做位址轉換，完全符合題目需求。", "zh": "設定 Cloud NAT，並在 NAT mapping 區段選取 sub-b。"}, {"letter": "C", "analysis": "錯誤：Bastion host 解決的是反方向的問題——讓外部管理者能安全連進來管理私有 IP 的 VM（inbound 存取），跟這題「VM 自己要連出去網路」（outbound 存取）完全是不同方向的需求。", "zh": "在 sub-a 設定一台堡壘主機（bastion host）實例，連到 sub-b 的實例。"}, {"letter": "D", "analysis": "錯誤：IAP TCP forwarding 一樣是用來安全地從外部連進私有 IP 的 VM（例如不開公開 IP 也能 SSH 進去），同樣是 inbound 方向，不是讓 VM 自己連到外部網路。", "zh": "對 sub-b 的實例啟用 Identity-Aware Proxy 的 TCP 轉發。"}], "notes": [{"heading": "題目在問什麼", "body": "同一個 VPC 裡有兩個子網路，sub-a 的 VM 有公開 IP，sub-b 的 VM 只有私有 IP。sub-b 需要連到 Google Cloud 範圍外的公開套件庫下載更新，要選出正確的做法。"}, {"heading": "答案驗證：B", "body": "Cloud NAT 是 GCP 專門解決「只有私有 IP 的 VM 要連到外部網際網路」這個需求的服務，不需要幫 VM 額外配公開 IP，由 Cloud NAT 代為做位址轉換（見下方核心概念）。A 的 Private Google Access 只能連 Google 自己的服務；C 的 bastion host 和 D 的 IAP TCP forwarding 解決的都是「外部連進來」（inbound）的問題，方向跟題目要求的「VM 自己連出去」（outbound）相反。"}, {"heading": "核心概念：NAT、NAT Gateway、Cloud NAT 的關係", "body": "NAT（Network Address Translation，網路位址轉換）是一種技術概念，指「把一個 IP 位址轉換成另一個 IP 位址」這個動作。NAT Gateway 是真正執行這個轉換工作的服務/設備——NAT 是概念，NAT Gateway 是實作這個概念的東西。Cloud NAT 就是 Google Cloud 提供的 NAT Gateway 服務，讓只有私有 IP 的 VM 能在發出對外連線時，暫時把私有 IP 轉換成一個共用的公開 IP 送出去，回應封包回來時再轉換回正確的 VM。VM 本身全程沒有公開 IP（更安全，外部無法主動連進來），只解決 outbound（VM 主動連出去）的需求，不提供 inbound（外部連進 VM）的能力。"}, {"heading": "核心概念：Bastion Host（堡壘主機／跳板機）", "body": "當一堆 VM 只有私有 IP、沒有公開 IP 時，管理者平常無法直接 SSH 連進去維護。Bastion host 的做法是：先 SSH 連到一台唯一有公開 IP、被嚴格加固保護的中繼站機器，再從這台中繼站跳進真正要管理的私有 VM，因此也叫「jump box」。這樣只有這一台中繼站對外暴露（可以套用更嚴格的防火牆規則、登入監控），大幅縮小攻擊面，其他私有 VM 完全不暴露在外。Bastion host 解決的是『外部管理者連進私有 VM』（inbound）的問題，跟 Cloud NAT 解決的『VM 自己連出去外部網路』（outbound）方向相反，兩者不能互相取代。"}, {"heading": "延伸澄清：私有 IP 到底能不能被連、能不能連出去", "body": "私有 IP（如 10.x.x.x、172.16.x.x、192.168.x.x）在全球網際網路上不具唯一性、也不可路由（全世界有無數網路同時使用同一段私有 IP，網際網路上的路由器不知道該送到『哪一個』）。因此對公開網際網路來說，兩個方向都不行：① 外部連進來（inbound）：路由器不知道怎麼把封包送到私有 IP，做不到，這是 bastion host／IAP 解決的問題；② VM 自己連出去（outbound）：即使能送出封包，對方的回應因為目標是私有 IP 一樣送不回來，等於連線失敗，這是 Cloud NAT 解決的問題（把來源位址轉換成可路由的公開 IP）。但在同一個 VPC 內部，私有 IP 之間互相溝通完全正常，因為封包全程走在自己的內部網路、不需要經過公開網際網路的路由，不受『私有 IP 不可路由』這個限制影響。"}, {"heading": "延伸澄清：「在 VPC 內」不等於「只有私有 IP」", "body": "VPC 內的每一台 VM 一定會有私有 IP（強制配備，用於 VPC 內部溝通），但「要不要額外加裝一個公開 IP」是開機時可自行選擇的獨立選項，私有 IP 和公開 IP 可以同時存在同一台 VM 上，兩者不互斥。Q193 裡 sub-a 和 sub-b 其實是同一個 VPC（同一個 region）裡的兩個子網路，兩邊的 VM 都一定有私有 IP，差別只在於 sub-a 的 VM 額外多裝了公開 IP，而 sub-b 沒有——不是『sub-a 在 VPC 外、sub-b 在 VPC 內』這種誤解。"}]}}, {"id": "T1-Q194", "topic": 1, "qnum": 194, "question": "Your company is planning to migrate their Windows Server 2022 from their on-premises data center to Google Cloud. You need to bring the licenses that are currently in use in on-premises virtual machines into the target cloud environment. What should you do?", "options": [{"letter": "A", "text": "1. Create an image of the on-premises virtual machines and upload into Cloud Storage.2. Import the image as a virtual disk on Compute Engine."}, {"letter": "B", "text": "1. Create standard instances on Compute Engine.2. Select as the OS the same Microsoft Windows version that is currently in use in the on-premises environment."}, {"letter": "C", "text": "1. Create an image of the on-premises virtual machine.2. Import the image as a virtual disk on Compute Engine.3. Create a standard instance on Compute Engine, selecting as the OS the same Microsoft Windows version that is currently in use in the on-premises environment.4. Attach a data disk that includes data that matches the created image."}, {"letter": "D", "text": "1. Create an image of the on-premises virtual machines.2. Import the image as a virtual disk on Compute Engine using --os=windows-2022-dc-v.3. Create a sole-tenancy instance on Compute Engine that uses the imported disk as a boot disk."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121314-exam-professional-cloud-architect-topic-1-question-194/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["Compute Engine", "資料遷移"], "keywords": ["bring the licenses that are currently in use in on-premises virtual machines into the target cloud environment"], "explanation": {"questionZh": "你的公司打算把 Windows Server 2022 從自有機房（on-premises）遷移到 Google Cloud。你需要把目前在地端虛擬機器上使用中的授權一併帶到雲端環境。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：只做了『搬資料』這一半，建立映像檔並匯入成虛擬磁碟，但完全沒處理授權怎麼帶過來這個題目的真正重點，也沒有建立任何可執行的 instance。", "zh": "1. 建立地端虛擬機器的映像檔並上傳到 Cloud Storage。2. 把映像檔匯入成 Compute Engine 的虛擬磁碟。"}, {"letter": "B", "analysis": "錯誤：這是直接用 GCP 自己賣的 Windows 授權（透過官方 Windows 映像檔，按使用量付費），等於重新跟 Google 買一份新授權，完全沒有用到公司自己已經買好的授權，不符合『把既有授權帶過來』的需求。", "zh": "1. 在 Compute Engine 建立標準 instance。2. OS 選擇跟地端環境目前使用中相同的 Microsoft Windows 版本。"}, {"letter": "C", "analysis": "錯誤：流程繞了一大圈卻方向錯誤，用的還是『標準 instance』（預設走 GCP 自己的授權計費），而且多此一舉地另外掛載一顆跟映像檔資料相符的資料磁碟，不符合這題的授權遷移需求。", "zh": "1. 建立地端虛擬機器的映像檔。2. 把映像檔匯入成 Compute Engine 的虛擬磁碟。3. 在 Compute Engine 建立標準 instance，OS 選擇跟地端環境目前使用中相同的 Microsoft Windows 版本。4. 掛載一顆資料磁碟，內容與建立的映像檔相符。"}, {"letter": "D", "analysis": "正確：用 --os=windows-2022-dc-v 參數匯入磁碟，標記這台機器的 Windows 授權是『自帶』（BYOL），不要讓 GCP 重複計費；再搭配單租戶（sole-tenancy）instance，滿足微軟授權條款要求『自帶授權的虛擬機器必須跑在專屬硬體上、不能與其他客戶共用實體機器』的規定，兩個條件同時滿足才能合法沿用既有授權。", "zh": "1. 建立地端虛擬機器的映像檔。2. 使用 --os=windows-2022-dc-v 參數，把映像檔匯入成 Compute Engine 的虛擬磁碟。3. 在 Compute Engine 建立單租戶（sole-tenancy）instance，用匯入的磁碟作為開機磁碟。"}], "notes": [{"heading": "題目在問什麼", "body": "公司要把地端的 Windows Server 2022 遷移到 GCP，並且想沿用公司已經買好、目前在地端使用中的 Windows 授權，而不是重新向 GCP 購買新的授權，要選出正確做法。"}, {"heading": "答案驗證：D", "body": "正確做法需要同時滿足兩個條件：① 匯入磁碟時用 --os=windows-2022-dc-v 標記這台機器的授權是自帶（BYOL），避免 GCP 重複計費一份新授權；② 用單租戶 instance 部署，滿足微軟授權條款對 BYOL 的硬體要求。B/C 都是直接用 GCP 官方映像檔建立標準 instance，等於重新買一份新授權，完全沒有沿用既有授權；A 只做了搬資料，沒有處理授權與部署。"}, {"heading": "核心概念：這題講的「授權」是什麼", "body": "Windows 不是免費軟體，微軟要求每一台跑 Windows Server 的機器都要有合法授權才能使用。公司在地端機房已經有 Windows Server 2022 在跑，代表公司早就已經付錢買好了這些授權。遷移到雲端時，公司不想再額外付一次錢重新買新授權，而是想把『自己已經擁有的授權』帶到雲端繼續用，這個做法叫 BYOL（Bring Your Own License，自帶授權）。選項 B/C 錯的原因是：它們用 GCP 官方 Windows 映像檔開機，等於直接跟 Google 租一份全新授權（費用算在 VM 帳單裡），完全沒用到公司自己已經買好的那份授權，等於錢付了兩次。"}, {"heading": "核心概念：什麼是單租戶（Sole-Tenancy）", "body": "GCP 的實體伺服器硬體，平常是多個不同客戶共用的（多租戶，multi-tenancy）——不同客戶的虛擬機器可能被安排在同一台實體機器上跑，彼此用虛擬化技術隔離，但實體硬體資源是共享的。單租戶（sole-tenancy）則是：花錢包下整台實體伺服器，只有自己的虛擬機器可以跑在這台機器上，不會有任何其他 GCP 客戶的機器被安排進來共用這台硬體。\n\n之所以 BYOL 一定要搭配單租戶，不是 Google 的技術限制，而是微軟自己對 Windows Server 授權條款的規定：如果要把自己買的授權帶到公有雲環境繼續用，這些虛擬機器必須跑在『完全只屬於你』的實體硬體上，不能跟其他客戶共用同一台機器，這樣授權歸屬才清楚、合規。"}]}}, {"id": "T1-Q195", "topic": 1, "qnum": 195, "question": "You are deploying an application to Google Cloud. The application is part of a system. The application in Google Cloud must communicate over a private network with applications in a non-Google Cloud environment. The expected average throughput is 200 kbps. The business requires:• 99.99% system availability• cost optimizationYou need to design the connectivity between the locations to meet the business requirements. What should you provision?", "options": [{"letter": "A", "text": "An HA Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway."}, {"letter": "B", "text": "A Classic Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway."}, {"letter": "C", "text": "Two HA Cloud VPN gateways connected to two on-premises VPN gateways. Configure each HA Cloud VPN gateway to have two tunnels, each connected to different on-premises VPN gateways."}, {"letter": "D", "text": "A Classic Cloud VPN gateway connected with one tunnel to an on-premises VPN gateway."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121313-exam-professional-cloud-architect-topic-1-question-195/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["Interconnect/VPN", "高可用性/災難復原", "成本優化"], "keywords": ["99.99% system availability", "cost optimization"], "explanation": {"questionZh": "你正在把一個應用程式部署到 Google Cloud，這個應用程式是某個系統的一部分。GCP 上的應用程式必須透過私有網路跟一個非 Google Cloud 環境裡的應用程式溝通。預期平均吞吐量是 200 kbps。業務需求是：99.99% 系統可用性、成本優化。你需要設計符合這些業務需求的據點連線方式。該採用哪種方案？", "optionTable": [{"letter": "A", "analysis": "正確：HA VPN 搭配兩條 tunnel 的標準架構，本身就能達到 99.99% SLA，規模剛好符合題目的低流量需求（200kbps），成本也最省，同時滿足可用性和成本優化兩項要求。", "zh": "一個 HA Cloud VPN gateway，用兩條 tunnel 連到一個地端 VPN gateway。"}, {"letter": "B", "analysis": "錯誤：Classic VPN 的官方 SLA 上限只有 99.9%，不管接幾條 tunnel 都達不到題目要求的 99.99%。", "zh": "一個 Classic Cloud VPN gateway，用兩條 tunnel 連到一個地端 VPN gateway。"}, {"letter": "C", "analysis": "錯誤：這是把 A 的架構再複製一份（兩組 HA VPN gateway、兩個地端據點、共 4 條 tunnel），可用性確實更高，但遠超過題目需求（99.99% 用一組 HA VPN 就夠），加上流量只有 200kbps 這麼小，多一倍硬體和據點純屬浪費，違反成本優化要求。", "zh": "兩個 HA Cloud VPN gateway，各自連到兩個地端 VPN gateway。將每個 HA Cloud VPN gateway 都設定成有兩條 tunnel，分別連到不同的地端 VPN gateway。"}, {"letter": "D", "analysis": "錯誤：Classic VPN 本身 SLA 上限就只有 99.9%，再加上只接一條 tunnel 沒有任何備援，可用性是四個選項中最低的，完全達不到題目要求。", "zh": "一個 Classic Cloud VPN gateway，只用一條 tunnel 連到一個地端 VPN gateway。"}], "notes": [{"heading": "題目在問什麼", "body": "GCP 上的應用程式要跟非 GCP 環境（地端或其他雲）的應用程式透過私有網路溝通，流量很小（200kbps），業務要求 99.99% 可用性且要成本優化，要選出符合需求、不多花錢的連線方案。"}, {"heading": "答案驗證：A", "body": "要達到 99.99% SLA，一定要用 HA VPN（Classic VPN 上限只有 99.9%），直接排除 B、D。A 和 C 都是 HA VPN，差別在規模：A 用一組 HA VPN gateway（兩條 tunnel）就能達到 99.99%，規模剛好符合題目的低流量需求；C 把整個架構複製一份變成雙重備援，可用性雖然更高但遠超過需求，不符合成本優化的要求。"}, {"heading": "核心概念：VPC 是什麼", "body": "VPC（Virtual Private Cloud，虛擬私有雲）是你在 Google Cloud 裡擁有的一個獨立私有網路空間，用來放置你的 VM、資料庫等資源，自行規劃子網路、IP 範圍、防火牆規則。可以想成「你在雲端租下的那層樓」，是資源實際『住』的地方，定義了哪些資源屬於你、彼此怎麼溝通。"}, {"heading": "核心概念：VPN 是什麼", "body": "VPN（Virtual Private Network，虛擬私有網路）是一種讓兩個私有網路透過公開網際網路安全互連的技術：雙方各架一個 VPN Gateway，中間建立一條加密通道（tunnel），資料實際上走公開網路但內容全程加密，邏輯上就像兩邊用私有專線直接連接。VPN 不是只能連 VPC——它的本質只在乎『兩端各有一個支援 VPN 協定的閘道設備』，完全不在乎對方是什麼性質的網路，因此可以是地端機房 ↔ GCP VPC（本題情境）、GCP VPC ↔ AWS VPC/Azure VNet（多雲架構）、甚至兩個完全沒有雲端參與的公司機房互連（VPN 最早、最傳統的用途）。\n\n但要注意：VPN 連接的兩端，必須是『私有網路』對『私有網路』，不是『兩個公開服務』。如果兩個服務本身就有公開 IP、能被任何人直接存取，要互相溝通直接透過網際網路呼叫對方的公開網址即可（搭配 HTTPS、API 金鑰等應用層安全機制），不需要 VPN——VPN 要解決的是『原本連不到的私有網路之間如何安全互連』這個問題，一旦任一端已經是公開可直接存取的服務，就不是 VPN 要處理的場景。"}, {"heading": "核心概念：HA VPN 的「兩個介面＋兩條 tunnel」架構", "body": "HA（High Availability）VPN 是 GCP 專門設計用來達成 99.99% SLA 的 VPN Gateway 類型，相對地 Classic VPN 架構較簡單、沒有內建備援設計，SLA 上限只有 99.9%。\n\n建立 HA VPN Gateway 時，Google 自動會配置兩個對外 IP（兩個介面，interface 0 和 interface 1），Google 建議（也是拿到 99.99% SLA 的前提）讓這兩個介面各自獨立建立一條 tunnel，分別連到地端 VPN Gateway。因為兩條 tunnel 是彼此獨立的路徑，其中一條斷線（維護、線路故障等）時，另一條仍正常運作，連線不會整個中斷。"}, {"heading": "延伸澄清：兩條 tunnel 傳輸時是同時用、還是壞了才切換", "body": "預設且建議的架構是 active-active（同時在用），不是 active-passive（平常只用一條、壞了才切到另一條）。搭配 Cloud Router 用 BGP 動態路由時，兩條 tunnel 各自建立獨立的 BGP 連線，只要兩條路徑成本相同，GCP 會用 ECMP（Equal-Cost Multi-Path）機制把流量同時分散到兩條 tunnel 上，等於直接把頻寬也加倍利用。當其中一條真的斷線時，BGP 偵測到異常、自動把這條路徑的路由撤下，所有流量才會全部收斂到還活著的那一條，切換通常在幾秒內完成，使用端幾乎感覺不到中斷。"}]}}, {"id": "T1-Q196", "topic": 1, "qnum": 196, "question": "Your company wants to migrate their 10-TB on-premises database export into Cloud Storage. You want to minimize the time it takes to complete this activity and the overall cost. The bandwidth between the on-premises environment and Google Cloud is 1 Gbps. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Develop a Dataflow job to read data directly from the database and write it into Cloud Storage."}, {"letter": "B", "text": "Use the Data Transfer appliance to perform an offline migration."}, {"letter": "C", "text": "Use a commercial partner ETL solution to extract the data from the on-premises database and upload it into Cloud Storage."}, {"letter": "D", "text": "Upload the data with gcloud storage cp."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121324-exam-professional-cloud-architect-topic-1-question-196/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["Cloud Storage", "資料遷移"], "keywords": ["minimize the time it takes to complete this activity and the overall cost", "follow Google-recommended practices"], "explanation": {"questionZh": "公司想把一個 10TB 的地端資料庫匯出檔案遷移到 Cloud Storage。你想把完成這件事的時間和整體成本都降到最低。地端環境和 Google Cloud 之間的頻寬是 1 Gbps。你想採用 Google 建議的做法。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：題目講的是『資料庫匯出檔案』，資料已經是一個現成的檔案，不需要即時連資料庫做擷取和轉換。用 Dataflow 建立完整的 ETL pipeline 處理單純的檔案搬移，是殺雞用牛刀，增加不必要的開發與運算成本。", "zh": "開發一個 Dataflow job，直接從資料庫讀取資料並寫入 Cloud Storage。"}, {"letter": "B", "analysis": "錯誤：Transfer Appliance 是給網路頻寬不足、線上傳輸要花太久（通常數週以上）的大型資料遷移準備的實體設備。這題頻寬有 1Gbps，10TB 大約 22 小時就能線上傳完，完全不需要訂實體設備再寄送這種額外時間與流程成本。", "zh": "使用 Data Transfer appliance 執行離線遷移。"}, {"letter": "C", "analysis": "錯誤：單純的檔案搬移不需要引入第三方 ETL 工具的額外成本和複雜度，一樣是殺雞用牛刀。", "zh": "使用商業夥伴的 ETL 解決方案，從地端資料庫擷取資料並上傳到 Cloud Storage。"}, {"letter": "D", "analysis": "正確：這是 Google 官方建議、內建免費的指令工具，單純直接地把檔案複製進 Cloud Storage。先確認頻寬足夠（10TB 在 1Gbps 下約 22 小時可完成，遠低於『線上傳輸需花超過一週才考慮用 Transfer Appliance』的門檻），完全匹配『最省時間、最省成本』的需求，不需要任何額外工具或服務。", "zh": "使用 gcloud storage cp 上傳資料。"}], "notes": [{"heading": "題目在問什麼", "body": "公司要把一個 10TB 的地端資料庫匯出檔案遷移到 Cloud Storage，頻寬 1Gbps，要在時間和成本都最省、且符合 Google 建議做法的前提下完成遷移。"}, {"heading": "答案驗證：D", "body": "先算頻寬夠不夠：10TB 在 1Gbps（約 125MB/s）下，約 10,000,000MB ÷ 125MB/s ≈ 80,000 秒 ≈ 22 小時，完全在線上傳輸可接受的範圍內（Google 建議的門檻通常是線上傳輸預估要花超過一週以上，才考慮用 Transfer Appliance 這種實體寄送的離線方案）。既然線上傳輸一天內就能搞定，直接用最簡單、免費的 gcloud storage cp 指令就是最省時間又最省成本的做法。A、C 把單純的檔案搬移當成需要 Extract-Transform-Load 的資料管線處理，B 把規模想得太大才需要的實體設備方案套用到這個頻寬完全足夠的情境，都是用力過猛。"}, {"heading": "核心概念：ETL 是什麼", "body": "ETL 是資料處理的三個標準步驟縮寫：Extract（擷取，從來源系統把資料撈出來，例如連資料庫讀取）、Transform（轉換，清理、重新格式化、計算衍生欄位）、Load（載入，把處理好的資料寫進目標系統）。這是資料工程裡最經典的思考框架，幾乎每個資料處理情境都會套用。"}, {"heading": "核心概念：Dataflow 是什麼", "body": "GCP 提供的全代管資料處理服務（底層基礎是開源的 Apache Beam 框架），專門用來跑資料處理管線，可處理批次（batch，一次性處理一大批現有資料）或串流（streaming，即時處理持續湧入的資料）。跟 Dataproc（還需要自己管理 Hadoop/Spark 叢集）不同，Dataflow 完全不用管理伺服器，只要寫好處理邏輯，Google 自動配置運算資源並依資料量自動擴縮。\n\n選項 A 描述的『用 Dataflow 連資料庫讀取、寫入 Cloud Storage』正是一個典型的 ETL pipeline（Extract 資料庫、Load 到 GCS），但題目的資料早已是現成檔案，不需要 Extract 和 Transform 這兩道手續，用 Dataflow 這種重型工具處理單純的檔案複製，是不必要的複雜度和成本，這正是 A 錯誤的原因。"}]}}, {"id": "T1-Q197", "topic": 1, "qnum": 197, "question": "You are working at a financial institution that stores mortgage loan approval documents on Cloud Storage. Any change to these approval documents must be uploaded as a separate approval file. You need to ensure that these documents cannot be deleted or overwritten for the next 5 years. What should you do?", "options": [{"letter": "A", "text": "Create a retention policy on the bucket for the duration of 5 years. Create a lock on the retention policy."}, {"letter": "B", "text": "Create a retention policy organizational constraint constraints/storage.retentionPolicySeconds at the organization level. Set the duration to 5 years."}, {"letter": "C", "text": "Use a customer-managed key for the encryption of the bucket. Rotate the key after 5 years."}, {"letter": "D", "text": "Create a retention policy organizational constraint constraints/storage.retentionPolicySeconds at the project level. Set the duration to 5 years."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/138677-exam-professional-cloud-architect-topic-1-question-197/", "postedDate": "2024-04-14", "postedYear": 2024, "tags": ["Cloud Storage", "合規性"], "keywords": ["ensure that these documents cannot be deleted or overwritten for the next 5 years"], "explanation": {"questionZh": "你在一家金融機構工作，公司在 Cloud Storage 上存放房貸核准文件。任何對這些核准文件的異動，都必須上傳成另一份獨立的核准檔案。你需要確保這些文件在接下來的 5 年內，都不能被刪除或覆寫。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：直接把保護套在這個放房貸文件的 bucket 本身上，設定 5 年保留期並鎖定這個設定，讓它無法被任何人事後更改或移除，是立即、具體、主動產生保護效果的動作，完全符合『5 年內不能刪除或覆寫』的要求。", "zh": "在 bucket 上建立一個期限為 5 年的保留政策。對這個保留政策做鎖定。"}, {"letter": "B", "analysis": "錯誤：這是一個被動的檢查規則，只有當有人主動嘗試設定/變更某個 bucket 的保留政策時才會被觸發去檢查數值是否達標。如果這個 bucket 目前沒有保留政策，而且沒有人去觸碰它的保留政策設定，這條組織規則永遠不會被觸發，bucket 依然完全沒有被保護到，跟沒設這條規則是一樣的結果。", "zh": "在組織層級建立一個名為 constraints/storage.retentionPolicySeconds 的保留政策組織限制。期限設定為 5 年。"}, {"letter": "C", "analysis": "錯誤：金鑰輪替管的是換一把新金鑰來加密之後新寫入的資料，跟阻止物件被刪除/覆寫完全是不同層面的問題，加密管的是資料的機密性，不是資料的不可變性，工具用錯了，完全沒有達成題目要求的效果。", "zh": "使用客戶自管金鑰為 bucket 做加密。5 年後輪替這把金鑰。"}, {"letter": "D", "analysis": "錯誤：跟 B 概念完全一樣，只是把範圍從整個組織換成單一專案，一樣是被動的檢查規則，只在有人主動設定/變更保留政策時才會被觸發，無法主動對現有、還沒被保護的 bucket 產生任何保護效果。", "zh": "在專案層級建立一個名為 constraints/storage.retentionPolicySeconds 的保留政策組織限制。期限設定為 5 年。"}], "notes": [{"heading": "題目在問什麼", "body": "金融機構在 Cloud Storage 上存放房貸核准文件，任何異動都要上傳成另一份獨立的核准檔案。需要確保這些文件在接下來 5 年內都不能被刪除或覆寫。"}, {"heading": "答案驗證：A", "body": "看到『某個特定 bucket 裡的文件，因為法規要求，必須在 N 年內完全不能被刪除或修改』，直接鎖定 Retention Policy（保留政策）+ Lock（鎖定），也就是 Bucket Lock，直接套用在那個特定的 bucket 上——而 Organization Policy 約束是給要求組織內所有未來的 bucket 都符合某個最低保留標準這種更大範圍的治理需求用的，不是用來直接保護某一個已知、特定的 bucket。信心高。"}, {"heading": "服務介紹：Bucket Lock（Retention Policy + Lock）", "body": "Retention Policy（保留政策）：可以設定在 Cloud Storage bucket 上的規則，指定裡面的物件在這段時間內不能被刪除或覆寫，相當於給整個儲存桶套上一層強制性的不可變保護罩。\nLock（鎖定）：再往上加一道保障，一旦把保留政策鎖定，這個政策本身就不能再被縮短、移除或關閉，不管是誰（哪怕是專案擁有者）都不能，確保這個保護是真正不可逆、無法被繞過的。\n這整套機制 Google 官方稱為 Bucket Lock，專門為『法規要求某類文件必須保留不可變 N 年』這種情境設計。\n常見程度：GCP 考試中『合規保存/文件不可變』情境的標準核心機制。"}, {"heading": "延伸澄清：為什麼組織政策約束（B、D）無法達成這題的目標——主動設定 vs 被動檢查", "body": "`constraints/storage.retentionPolicySeconds` 這個組織政策約束，管的只是『當有人主動去設定某個 bucket 的保留政策時，這個數值不能低於規定的下限』。它不會自動幫任何 bucket（不管新建的還是舊有的）加上保留政策，也不會強制規定每個 bucket 必須有保留政策——它只是一個被動的檢查點，只有當有人主動做出『設定保留政策』這個動作時才會被觸發去檢查數值是否達標。\n順序不是關鍵：就算先設定好這條組織規則、再建立這個 bucket，如果建立 bucket 時沒有另外明確去設定它的保留政策（也就是沒有執行 A 選項的動作），這個新 bucket 依然處於沒有保留政策、可以被刪除/覆寫的狀態，組織規則不會自動偷偷幫忙補上保留政策。\n如果從來沒有人去嘗試設定保留政策，這條組織規則就完全不會被觸發，等於形同虛設，bucket 依然處於完全沒有保護的狀態——這條規則單獨存在時，對『保護這個 bucket』這個目標本身貢獻是零，它是一個『必要但不充分』的配套工具：只有在搭配 A（真的有人主動設定了保留政策）一起使用時，才能發揮『確保設定的期限至少要有 5 年，不能設得更短』的把關作用。\n一句話總結：組織政策約束本身不會主動『做』任何保護動作，它只負責在別人動手做的那一刻『檢查做得夠不夠好』——如果沒有人動手，它就完全派不上用場。這正是為什麼題目要的『確保文件接下來 5 年不能被刪除或覆寫』這個明確、立即、具體的保護目標，答案必須是真正主動執行保護動作的 A 選項，而不是被動等待、可能永遠不會被觸發的 B 或 D。"}]}}, {"id": "T1-Q198", "topic": 1, "qnum": 198, "question": "Your company has decided to make a major revision of their API in order to create better experiences for their developers. They need to keep the old version of the API available and deployable, while allowing new customers and testers to try out the new API. They want to keep the same SSL and DNS records in place to serve both APIs.What should they do?", "options": [{"letter": "A", "text": "Configure a new load balancer for the new version of the API"}, {"letter": "B", "text": "Reconfigure old clients to use a new endpoint for the new API"}, {"letter": "C", "text": "Have the old API forward traffic to the new API based on the path"}, {"letter": "D", "text": "Use separate backend pools for each API path behind the load balancer"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/146571-exam-professional-cloud-architect-topic-1-question-198/", "postedDate": "2024-08-27", "postedYear": 2024, "tags": ["Load Balancing", "VPC/網路"]}, {"id": "T1-Q199", "topic": 1, "qnum": 199, "question": "You have a Compute Engine application that you want to autoscale when total memory usage exceeds 80%. You have installed the Cloud Monitoring agent and configured the autoscaling policy as follows:\n\nYou observe that the application does not scale under high load. You want to resolve this. What should you do?", "options": [{"letter": "A", "text": "Change the Target type to DELTA_PER_MINUTE."}, {"letter": "B", "text": "Change the Metric identifier to agent.googleapis.com/memory/bytes_used."}, {"letter": "C", "text": "Change the filter to metric.label.state = ‘used’."}, {"letter": "D", "text": "Change the filter to metric.label.state = ‘free’ and the Target utilization to 20."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/146572-exam-professional-cloud-architect-topic-1-question-199/", "postedDate": "2024-08-27", "postedYear": 2024, "tags": ["Compute Engine", "自動擴縮", "效能調校"], "questionImage": "images/t1-q199.png", "keywords": ["autoscale when total memory usage exceeds 80%", "does not scale under high load"], "explanation": {"questionZh": "你有一個 Compute Engine 應用程式，想在記憶體總用量超過 80% 時自動擴增（autoscale）。你已安裝 Cloud Monitoring agent，並設定了以下的自動擴增政策：\n\nMetric identifier（指標）：agent.googleapis.com/memory/percent_used\nFilter（篩選條件）：metric.label.state = 'used' AND metric.label.state = 'buffered' AND metric.label.state = 'cached' AND metric.label.state = 'slab'\nTarget utilization level（目標使用率）：80\nTarget type（目標類型）：GAUGE\n\n你發現在高負載下應用程式沒有自動擴增。你該怎麼解決？", "optionTable": [{"letter": "A", "analysis": "Target type is already correctly set to GAUGE, which matches the instantaneous-percentage nature of the percent_used metric. Switching to DELTA_PER_MINUTE (a rate-of-change type meant for cumulative/counter metrics) would break the semantics and does not address the filter bug causing the scaling failure.", "zh": "原本的 Target type 已經是 GAUGE，這本來就正確（因為 percent_used 是『當下比例』型指標，不是累積量）。改成 DELTA_PER_MINUTE 是用在速率型指標上，不但語意錯誤，也沒解決真正造成無法擴增的 filter 問題"}, {"letter": "B", "analysis": "The metric is already correctly percent_used, which pairs with Target utilization=80 to mean '80%'. Switching to bytes_used (an absolute byte count) would make the existing Target=80 meaningless, and still does not fix the broken filter.", "zh": "原本的 metric 已經是 percent_used，搭配 Target=80 剛好代表『80%』。換成 bytes_used（絕對位元組數）會讓 Target=80 這個數字失去意義，而且一樣沒修正壞掉的 filter"}, {"letter": "C", "analysis": "The original filter ANDs together four mutually exclusive values of the same label (state). Since a single time series can only have one state value at a time, this filter can never match any data — it is logically an empty set. With no matching time series, the autoscaler has no data to evaluate against the 80% target, so it never scales regardless of actual load. Changing the filter to the single condition state='used' fixes this: it matches the real 'used memory' time series, and combined with the already-correct Target=80 and Target type=GAUGE, correctly triggers scaling when used memory exceeds 80%.", "zh": "原本的 filter 把同一個 label（state）的四個互斥數值用 AND 疊加在一起。因為一筆時間序列在同一時間點的 state 只能有一個值，這個 filter 邏輯上永遠比對不到任何資料（等於空集合）。沒有資料可比對，autoscaler 就無法判斷是否超過 80% 門檻，所以不管負載多高都不會擴增。把 filter 改成單一條件 state='used'，就能正確比對到『已使用記憶體』這筆真實存在的時間序列，搭配原本就正確的 Target=80 和 GAUGE 類型，就能在用量超過 80% 時正確觸發擴增"}, {"letter": "D", "analysis": "Mathematically plausible (free memory below 20% roughly corresponds to used memory above 80%, since all states sum to 100%), but it requires changing two settings (filter AND target) when the target=80 was already correct for the stated 80% requirement. Option C is the more direct, minimal fix.", "zh": "方向邏輯上也說得通（因為所有狀態加總是 100%，空閒<20% 約等於用量>80%），但這個做法需要同時改動兩個設定（filter 和 target），而原本的 Target=80 本來就已經正確對應題目要求的『80%』，不需要動它。選項 C 才是更直接、改動最少的修法"}], "notes": [{"heading": "題目在問什麼", "body": "應用程式設定了根據記憶體使用率自動擴增的政策，目標是『用量超過 80% 時擴增』，但實際測試高負載時卻沒有觸發擴增，要找出設定錯在哪裡並修正。"}, {"heading": "答案驗證：C（有原始截圖佐證，非推論）", "body": "使用者提供了原始題目的設定截圖，確認原始 filter 是：state='used' AND state='buffered' AND state='cached' AND state='slab'。這是邏輯錯誤——同一個 label（state）在同一筆時間序列中只能有一個值，四個互斥值用 AND 疊加等於永遠比對不到任何資料，autoscaler 因此拿不到任何指標數值可供比較，無論負載多高都不會觸發擴增。選項 C 把 filter 簡化成單一的 state='used'，直接修好這個邏輯錯誤，搭配原本就正確的 Target=80、GAUGE 類型，完整達成『用量超過 80% 觸發擴增』的需求。"}, {"heading": "延伸澄清：AI 一開始的推論錯誤", "body": "我一開始在沒有看到原始設定截圖的情況下，自行『反推』假設原始 filter 是看 free 狀態、搭配 80% 門檻（邏輯方向顛倒型錯誤），並把這個假設講得像是從題目讀出來的事實，被使用者指出『這從題目哪裡看出來的』而糾正。實際上原始題目文字裡只有『...configured the autoscaling policy as follows:』後面接一張截圖，純文字資料並未包含截圖內容，我不該把推論講得像是確定的事實。後來使用者提供截圖後，才確認真正的錯誤是『AND 疊加互斥的 state 值』，而不是『方向顛倒』——兩種錯誤的表現結果類似（都會讓 autoscaler 沒資料可用），但根本原因不同，必須以實際截圖為準。"}, {"heading": "延伸補充：題目圖片已嵌入網頁", "body": "原始文字資料中缺少設定截圖，已將使用者提供的截圖存為 images/t1-q199.png 並透過新增的 questionImage 欄位嵌入到題目卡片中（網頁已新增 .question-image 的 CSS 樣式與對應渲染邏輯），瀏覽器實測顯示正常。另外發現題庫中已存在的 T1-Q190 是同一題的重複收錄，但其題目敘述與選項 C 的文字疑似互相對調（題目敘述寫著單一的 state='used'，選項 C 卻寫著壞掉的 AND 疊加版本），屬於原始資料的既有瑕疵，待使用者確認是否一併修正。"}]}}, {"id": "T1-Q200", "topic": 1, "qnum": 200, "question": "Your company has a Google Cloud project that uses BigOuery for data warehousing. The VPN tunnel between the on-premises environment and Google Cloud is configured with Cloud VPN. Your security team wants to avoid data exfiltration by malicious insiders, compromised code, and accidental oversharing. What should you do?", "options": [{"letter": "A", "text": "Configure Private Service Connect."}, {"letter": "B", "text": "Configure VPC Service Controls and configure Private Google Access for on-promises hosts."}, {"letter": "C", "text": "Create a service account, grant the BigQuery JobUser role and Storage Object Viewer role to the service account, and remove all other Identity and Access Management (IAM) access from the project."}, {"letter": "D", "text": "Configure Private Google Access."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/169213-exam-professional-cloud-architect-topic-1-question-200/", "postedDate": "2025-03-17", "postedYear": 2025, "tags": ["BigQuery", "VPC/網路", "安全性"], "keywords": ["avoid data exfiltration by malicious insiders, compromised code, and accidental oversharing"], "explanation": {"questionZh": "你的公司有一個使用 BigQuery 做資料倉儲的 Google Cloud 專案。地端環境和 Google Cloud 之間的 VPN 通道，是用 Cloud VPN 設定的。你的安全團隊想要避免惡意的內部人員、被入侵的程式碼、以及不小心的過度分享造成資料外洩。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Private Service Connect 解決的是『怎麼用內部私有 IP 私密連到某個服務』這個連線問題，本身不是設計來防止資料外洩的安全管控機制，跟題目核心訴求不對應。", "zh": "設定 Private Service Connect。"}, {"letter": "B", "analysis": "正確：VPC Service Controls 是專門用來防止資料外洩的機制，在 BigQuery 周圍畫一條邊界，邊界內可以正常查詢存取，但資料不能被搬到邊界外，不管是內部人員手滑、程式碼被入侵、還是不小心分享，都會被這道邊界擋下來；搭配地端主機的 Private Google Access，確保公司既有透過 Cloud VPN 的地端存取方式依然暢通、走私有路徑，不受影響也不用被迫改走公開網路。", "zh": "設定 VPC Service Controls，並為地端主機設定 Private Google Access。"}, {"letter": "C", "analysis": "錯誤：移除專案裡所有其他 IAM 存取，代表幾乎沒有人能用自己的身分正常存取這個專案，所有操作都要擠在同一個共用的服務帳戶上，會嚴重打亂日常營運，不是一個能實際運作的解決方案，是為了安全而完全犧牲可用性的極端做法。", "zh": "建立一個服務帳戶，授予它 BigQuery JobUser 角色和 Storage Object Viewer 角色，並移除專案裡所有其他的 IAM 存取權。"}, {"letter": "D", "analysis": "錯誤：只解決了 VPC 內部、沒有外部 IP 的 VM 要怎麼私密連到 Google API 這個連線問題，本身完全沒有任何防止資料外洩的機制，跟題目要求的核心安全訴求不對應，只是連線層面的優化。", "zh": "設定 Private Google Access。"}], "notes": [{"heading": "題目在問什麼", "body": "公司有個 GCP 專案用 BigQuery 做資料倉儲，地端環境跟 GCP 之間用 Cloud VPN 建了一條 VPN 通道。安全團隊想要防止資料外洩——包括惡意的內部人員、被入侵的程式碼、以及不小心的過度分享。"}, {"heading": "答案驗證：B", "body": "看到『防止資料外洩（內部人員、被入侵程式碼、誤分享）』這種敘述，直接鎖定 VPC Service Controls（GCP 處理資料外洩防護的標準核心機制）；如果題目情境裡同時存在地端混合架構（像這題的 Cloud VPN），通常還要搭配設定地端主機的 Private Google Access，確保設了安全邊界之後，既有的地端連線方式依然暢通、不受影響。信心高。"}, {"heading": "關鍵澄清：VPC Service Controls 防的是「存取」還是「資料搬出邊界」", "body": "精確講，不是『避免被存取（查詢）』，而是『允許正常存取/查詢，但防止資料被搬出這個受保護的範圍』。\n可以做的事（防護罩內的正常存取）：分析師登入對 BigQuery 下 SQL 查詢、看查詢結果——完全允許，這是日常業務本來就該做的事；透過 Cloud VPN 從地端連進來查資料——完全允許（這正是題目要保留的功能）。\n要擋下來的事（資料離開防護罩範圍）：把查詢結果匯出/複製到防護罩範圍以外的地方（例如外部的 Cloud Storage bucket、別的雲平台）——被擋下來；用服務帳戶金鑰或盜用的憑證，想從防護罩外部的網路位置呼叫 BigQuery 的 API——被擋下來（VPC Service Controls 也會檢查請求是從哪裡發出的）。\n一句話更正確的講法：VPC Service Controls 防的不是『誰能不能看資料』（那是 IAM 權限管的事），而是『資料本身能不能跨越這個安全邊界、被搬到邊界外』——就算一個人原本就有權限查詢 BigQuery，他也無法把資料複製/匯出到這道邊界以外的任何地方。這也是為什麼題目特別提到三種情境（惡意員工、被入侵程式碼、不小心分享）都能被同一套機制擋下，因為不管是誰、不管是故意還是意外，只要想把資料送出邊界，都一樣會被擋，防的是『資料的移動方向』，不是『誰有沒有存取資格』。"}, {"heading": "服務介紹：Private Google Access", "body": "是什麼：一台 Compute Engine VM 要連到網際網路或 Google 的各種 API 服務，正常情況下需要一個外部 IP，但這也代表這台機器直接暴露在公開網際網路上，多了一個被攻擊的風險面。Private Google Access 讓沒有外部 IP 的 VM，依然能透過 Google 內部的私有網路路徑，直接存取 Google 自己的 API 和服務（BigQuery、Cloud Storage、Pub/Sub 等），完全不需要經過公開網際網路，也不需要配外部 IP。\n解決什麼問題：很多 VM 其實只需要單向呼叫 Google 自己的服務，根本不需要被外部主動連進來，這種情況下給它配外部 IP 是多餘的風險，Private Google Access 讓這類 VM 可以兼顧安全性（不暴露在外）和功能性（還是能呼叫 Google API）。\n延伸版本（Q200 用到的）：這個概念還能延伸到地端（on-premises）的機器——如果地端機房已經透過 Cloud VPN 或 Cloud Interconnect 跟 GCP 連起來，可以設定讓地端的伺服器也透過這條既有的私有連線，直接存取 Google 的 API 服務（像 BigQuery），不需要讓這些請求跑去公開網際網路上繞一圈才能到達 Google。\n跟 VPC Service Controls 的關係：兩者是互補但不同層面的機制——Private Google Access 管『怎麼連進來才安全/私密』（連線層面），VPC Service Controls 管『連進來之後資料能不能被搬出去』（資料外洩防護層面），這題需要兩者搭配才能同時滿足安全要求和既有連線方式的可用性。\n常見程度：GCP 考試中『VM/地端主機要私密存取 Google API』情境的標準核心服務。"}, {"heading": "服務介紹：VPC Service Controls 與地端混合架構的搭配", "body": "情境示意：地端機房透過 Cloud VPN 連到 GCP 專案裡的 BigQuery，資料分析師平常就是透過這條既有連線查詢資料。設定 VPC Service Controls 之後，在 BigQuery 周圍畫一道防護邊界（Service Perimeter），邊界內可以正常查詢，但資料不能被複製/匯出到邊界外。\n為什麼還要加地端主機的 Private Google Access：設了這道防護罩後，要確保地端辦公室的員工原本透過 VPN 連進來查詢 BigQuery 的這條既有管道，依然能正常、私密地連到 BigQuery，不會被防護罩誤擋，也不會被迫改走公開網際網路這種比較不安全的路徑。\n白話總結：VPC Service Controls = 防止資料被偷搬出去的那道牆；地端主機的 Private Google Access = 確保公司原本透過 VPN 連進來查資料的員工，不會因為多了這道牆而連不上、或被迫走比較危險的路線。兩個搭配起來，才是安全防護+日常運作都兼顧的完整答案。"}, {"heading": "延伸澄清：為什麼 C 選項（縮小 IAM 權限）還是防不住資料外洩", "body": "C 選項的邏輯是『把能碰這個專案的人縮到最少』——只留一個服務帳戶，給它 BigQuery JobUser（跑查詢）和 Storage Object Viewer（讀取檔案）兩個小角色，其他人的 IAM 權限全部拔掉。但這個僅存的服務帳戶依然有讀取資料的能力（Storage Object Viewer 可以下載檔案），只要持有這組服務帳戶金鑰的人（不管是正常使用的程式、還是偷到金鑰的駭客），依然可以合法地用這個身分讀取資料，再把讀出來的內容複製、下載、傳到任何地方——IAM 角色只管『你有沒有資格做這個動作（讀取）』，完全管不到『讀出來的資料接下來要被送去哪裡』。\n對應題目的三個威脅情境：惡意內部人員如果就是那個唯一還留著權限的服務帳戶操作者，本人就能直接把資料搬出去，縮減權限範圍擋不住本來就有權限的那個人；被入侵的程式碼如果用的正是這個服務帳戶，駭客就是冒用這組仍然有效、仍然有讀取權限的身分偷資料，一樣能把資料送到 GCP 外部；不小心的過度分享一樣防不住。\n這正是 IAM 跟 VPC Service Controls 的本質差異：IAM（C 選項做的事）管的是『誰（哪個身分）有沒有資格執行某個動作』，是身分/權限範圍的控制；VPC Service Controls（B 選項）管的是『資料本身能不能被送到這個安全邊界以外的地方』，是資料流向/網路邊界的控制，而且不管是誰、用什麼身分在操作，只要想把資料送出邊界，都一樣會被擋下來。不管把 IAM 權限縮得多小，只要那個僅存的身分依然有讀取資料的能力，持有這個身分的人就依然能把資料搬出去——縮小誰能存取、跟阻止資料外流，是兩個不同維度的問題，C 選項完全沒有碰到後者，這就是它不符合題目要求的根本原因。"}]}}, {"id": "T1-Q201", "topic": 1, "qnum": 201, "question": "You are managing a few hundred Ubuntu and Red Hat Enterprise Linux virtual machines running on Google Compute Engine (GCE). You need to patch the operating systems for those VMs periodically in a secure and scalable way. What should you do?", "options": [{"letter": "A", "text": "Create a Cloud Scheduler job to run a Bash script that securely connects to each VM and applies the patches."}, {"letter": "B", "text": "Configure Config Sync, and install the Ops Agent on each VM. Schedule a patch job to apply patches on each VM."}, {"letter": "C", "text": "Schedule a Cloud Build job, and use Cloud Deploy to run a patch job that applies patches on each VM."}, {"letter": "D", "text": "Set up VM Manager, and install the OS Config agent on each VM. Schedule a patch job to apply patches on each VM."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381829-exam-professional-cloud-architect-topic-1-question-201/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Compute Engine", "安全性", "監控與可觀測性"], "keywords": ["patch the operating systems for those VMs periodically in a secure and scalable way"], "explanation": {"questionZh": "你正在管理幾百台跑在 Google Compute Engine（GCE）上的 Ubuntu 和 Red Hat Enterprise Linux 虛擬機。你需要用安全且可擴展的方式，定期為這些 VM 的作業系統套用修補程式。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：這是自己手刻的方案，要自己寫腳本、自己處理怎麼安全地連進幾百台機器、自己確保每台都成功套用補丁、自己處理失敗重試，隨 VM 數量增加維護負擔和出錯風險會線性增加，不符合 scalable 的要求。", "zh": "建立一個 Cloud Scheduler 工作，執行一個安全連到每台 VM 並套用補丁的 Bash 腳本。"}, {"letter": "B", "analysis": "錯誤：Config Sync 是用來把 Kubernetes 設定從 Git 倉庫同步到叢集的工具，跟 VM 的作業系統打補丁完全無關；Ops Agent 是用來收集 VM 的日誌和監控指標的代理程式，不負責套用修補程式，兩個工具角色都不對應需求。", "zh": "設定 Config Sync，在每台 VM 上安裝 Ops Agent，排程一個補丁工作來為每台 VM 套用補丁。"}, {"letter": "C", "analysis": "錯誤：Cloud Build 和 Cloud Deploy 是用來建置和部署應用程式程式碼/容器的工具，不是用來管理 VM 作業系統層級的補丁，角色不對應。", "zh": "排程一個 Cloud Build 工作，並用 Cloud Deploy 執行一個為每台 VM 套用補丁的補丁工作。"}, {"letter": "D", "analysis": "正確：VM Manager 是 Google 官方為管理大量 Compute Engine VM 打造的工具組，涵蓋 OS 修補、OS 政策執行、資源盤點，搭配在每台 VM 安裝的 OS Config agent，可以集中管理、排程修補任務並自動套用到所有指定的 VM 上（支援跨不同作業系統），天生為大量 VM、定期修補、安全、可擴展這個情境設計。", "zh": "設定 VM Manager，在每台 VM 上安裝 OS Config agent，排程一個補丁工作來為每台 VM 套用補丁。"}], "notes": [{"heading": "題目在問什麼", "body": "管理幾百台跑在 Compute Engine 上的 Ubuntu 和 RHEL 虛擬機，需要定期幫這些 VM 的作業系統打補丁，而且要安全、可擴展。"}, {"heading": "答案驗證：D", "body": "看到『大量 Compute Engine VM 需要定期打補丁/修補作業系統，要安全又可擴展』，直接鎖定 VM Manager + OS Config agent——這是 Google 官方現成的 VM 修補管理產品，不需要自己拼湊 Cloud Scheduler+腳本，也不要被 Config Sync（管 Kubernetes 設定的）、Ops Agent（管監控日誌的）、Cloud Build/Deploy（管應用程式部署的）這些名字聽起來好像有關、但實際角色完全不對應的工具混淆。信心高。"}, {"heading": "服務介紹：VM Manager", "body": "是什麼：GCP 專門為管理大量 Compute Engine VM 打造的一套工具組，核心功能包括 OS 修補（patch management，集中排程、集中執行作業系統的安全更新）、OS 政策（policy enforcement，強制套用某些設定規範到所有 VM 上）、資源盤點（inventory management，集中查看所有 VM 裝了哪些套件、什麼版本）。\n解決什麼問題：不用自己寫腳本、自己管理連線安全性，就能大規模、安全地對大量 VM 執行修補作業。\n在這題的應用：要使用它的功能，需要在每台 VM 上安裝 OS Config agent，讓中控台能跟每台 VM 溝通、下達修補指令，支援 Ubuntu、RHEL 等不同作業系統。\n常見程度：GCP 考試中『大量 VM 的修補/合規管理』情境的標準核心服務。"}]}}, {"id": "T1-Q202", "topic": 1, "qnum": 202, "question": "Your company uses Salesforce for customer relationship management (CRM). ServiceNow for IT service management, and a Cloud SQL database to store customer transaction data You need to seamlessly connect, map. and transform data between these systems to ensure data consistency and enable real-time reporting. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Leverage Workflows to connect the services and transform the data."}, {"letter": "B", "text": "Leverage Application Integration to connect the services and transform the data."}, {"letter": "C", "text": "Leverage Pub/Sub and BigQuery to connect the services and transform the data."}, {"letter": "D", "text": "Leverage Pub/Sub and Datastream to connect the services and transform the data."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381815-exam-professional-cloud-architect-topic-1-question-202/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["混合雲"], "keywords": ["seamlessly connect, map, and transform data between these systems"], "explanation": {"questionZh": "你的公司用 Salesforce 做客戶關係管理（CRM），用 ServiceNow 做 IT 服務管理，並用一個 Cloud SQL 資料庫來儲存客戶交易資料。你需要在這些系統之間無縫地連接、對應、轉換資料，確保資料一致性並支援即時報表。你想要遵循 Google 建議的做法。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Workflows 是輕量級的無伺服器流程編排服務，可以用設定檔定義一連串步驟，適合簡單的流程串接，但沒有內建針對 Salesforce、ServiceNow 這類企業 SaaS 系統的現成連接器，也沒有視覺化的資料對應/轉換工具，不是 Google 為這種企業應用程式整合情境推出的專門產品。", "zh": "善用 Workflows 來連接服務並轉換資料。"}, {"letter": "B", "analysis": "正確：Application Integration 是 GCP 的企業應用程式整合平台（iPaaS），內建連接器直接對接 Salesforce、ServiceNow，配合資料對應/轉換功能，完全符合題目所有要求，是 Google 官方針對這種多系統整合場景的標準推薦產品。", "zh": "善用 Application Integration 來連接服務並轉換資料。"}, {"letter": "C", "analysis": "錯誤：Pub/Sub 是訊息/事件傳遞系統，BigQuery 是分析用的資料倉儲，這個組合適合事件串流+資料分析情境，但沒有現成的方式讓 Salesforce、ServiceNow 這類 SaaS 應用程式直接把資料送進 Pub/Sub，得自己額外開發串接層，不是開箱即用的企業整合解決方案。", "zh": "善用 Pub/Sub 和 BigQuery 來連接服務並轉換資料。"}, {"letter": "D", "analysis": "錯誤：Datastream 是專門用來把資料庫的異動資料即時同步複製到別處的工具，設計對象是資料庫，不支援連接 Salesforce、ServiceNow 這類 SaaS 應用程式，這個組合最多只能處理 Cloud SQL 那一部分，完全沒辦法處理 Salesforce 和 ServiceNow 的整合需求。", "zh": "善用 Pub/Sub 和 Datastream 來連接服務並轉換資料。"}], "notes": [{"heading": "題目在問什麼", "body": "公司用 Salesforce（CRM）、ServiceNow（ITSM）、Cloud SQL（客戶交易資料）。需要在這些系統之間無縫連接、對應、轉換資料，確保資料一致性並支援即時報表，要遵循 Google 建議做法。"}, {"heading": "答案驗證：B", "body": "看到『要連接多個不同的企業應用程式/SaaS 系統（像 CRM、ITSM 這類帶有品牌名稱的商業軟體），需要做資料對應和轉換』，優先想到 Application Integration（Google 官方的 iPaaS 產品，內建這些系統的連接器）；Pub/Sub、BigQuery、Datastream、Workflows 這些都是更通用/底層的建構元件，適合用在自己架一套客製化的資料管線，但不是 Google 官方針對連接知名企業 SaaS 系統這種特定需求推出的開箱即用解決方案。信心高。"}, {"heading": "服務介紹：Application Integration", "body": "是什麼：GCP 的企業應用程式整合平台（業界術語叫 iPaaS，Integration Platform as a Service），專門設計來連接各種不同的企業應用程式，提供現成的連接器（直接內建對接 Salesforce、ServiceNow 這類常見企業 SaaS 系統的接口）、視覺化的資料對應/轉換工具、觸發條件和流程編排。\n解決什麼問題：不用自己寫程式碼去串接各個 SaaS 系統的 API、處理資料格式轉換，用現成的連接器和視覺化工具快速完成企業系統間的整合。\n在這題的應用：精準對應題目描述的連接、對應、轉換多個企業系統間資料這個標準企業整合情境。\n常見程度：GCP 考試中『連接知名企業 SaaS 系統（CRM/ITSM/ERP 等）』情境的標準正解服務。"}]}}, {"id": "T1-Q203", "topic": 1, "qnum": 203, "question": "You are designing the architecture for a global social media site on Google Cloud. The site serves dynamic API content, static assets such as CSS. JS. images, and user-uploaded videos for streaming. You need to minimize latency for all content types for users worldwide. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Use an external Application Load Balancer to serve your application APIs."}, {"letter": "B", "text": "Use Cloud CDN to serve static assets of your application."}, {"letter": "C", "text": "Use Media CDN to serve static assets of your application"}, {"letter": "D", "text": "Use Memorystore to serve your web application."}, {"letter": "E", "text": "Use a multi-region Cloud Storage bucket to serve your entire web application."}], "answer": "AB", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381822-exam-professional-cloud-architect-topic-1-question-203/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Load Balancing", "多區域架構", "效能調校", "Cloud CDN"], "keywords": ["minimize latency for all content types for users worldwide"], "explanation": {"questionZh": "你正在為一個全球性的社群媒體網站設計 Google Cloud 架構。這個網站要提供動態 API 內容、靜態資源（像 CSS、JS、圖片），以及供串流的使用者上傳影片。你需要讓全球使用者對所有內容類型的延遲都最小化。你該怎麼做？（請選擇兩項）", "optionTable": [{"letter": "A", "analysis": "正確：全域外部 Application Load Balancer 會把使用者的 API 請求自動導向離他最近、且健康的後端伺服器，這正是動態內容（回應會因使用者/時間而變化，不能被快取）降低延遲的標準做法——讓請求走最短路徑到達最近的伺服器。", "zh": "使用外部 Application Load Balancer 來服務你的應用程式 API。"}, {"letter": "B", "analysis": "正確：Cloud CDN 把 CSS、JS、圖片這類不常變動的靜態檔案，複製到全球各地離使用者更近的邊緣節點，使用者直接就近下載，對應靜態資源降低延遲的要求。", "zh": "使用 Cloud CDN 來服務你應用程式的靜態資源。"}, {"letter": "C", "analysis": "錯誤：Media CDN 其實是 Google 專門為大規模影片/媒體串流打造的進階 CDN 產品，不是用來服務一般靜態資源（CSS/JS/圖片）的，這個選項把 Media CDN 錯誤地跟靜態資源綁在一起，如果寫的是用 Media CDN 服務影片串流那會是正確做法，但它跟靜態資源配對，跟 Media CDN 真正的設計用途不符。", "zh": "使用 Media CDN 來服務你應用程式的靜態資源。"}, {"letter": "D", "analysis": "錯誤：Memorystore 是用來加速資料庫查詢的快取層，不是用來直接服務使用者的前端內容，它加速的是伺服器內部處理請求的速度，不是使用者連到伺服器的網路傳輸距離，角色不對應降低全球使用者存取延遲的需求。", "zh": "使用 Memorystore 來服務你的網頁應用程式。"}, {"letter": "E", "analysis": "錯誤：Cloud Storage 只能存放靜態檔案，沒辦法執行程式碼處理動態 API 內容，說它能服務整個網頁應用程式技術上不成立；而且 multi-region 的範圍通常只涵蓋同一大洲內的幾個區域，不等於真正全球性的邊緣節點網路。", "zh": "使用一個多區域 Cloud Storage bucket 來服務你整個網頁應用程式。"}], "notes": [{"heading": "題目在問什麼", "body": "全球性社群媒體網站，提供動態 API 內容、靜態資源（CSS/JS/圖片）、使用者上傳影片串流。要讓所有內容類型對全球使用者的延遲都最小化。這是複選題，答案有兩個字母。"}, {"heading": "答案驗證：A+B", "body": "不同內容類型要用不同工具處理延遲——動態 API 用 Global LB（找最近的伺服器）、一般靜態資源用 Cloud CDN（邊緣快取）、大規模影片串流本該用 Media CDN（但這題選項故意把它跟靜態資源配錯，當作陷阱）。題目明確提到影片串流需求，但給定選項裡沒有一個正確把 Media CDN 跟影片串流配對，所以在剩下選項裡 A+B 是邏輯最一致的答案。信心高。"}, {"heading": "延遲的兩種成因：網路傳輸距離 vs 伺服器處理速度", "body": "延遲可以拆成兩段：①使用者到伺服器的網路傳輸距離延遲——如果使用者在台灣、伺服器在美國，光是訊號在網路上跑一趟的物理距離就會造成延遲，跟後端程式或資料庫查得多快完全無關，純粹是地理距離問題，這正是題目要解決的核心問題；②伺服器查詢資料庫的處理速度延遲——伺服器收到請求後查資料庫要花的時間，這是 Memorystore 加速的部分。\nMemorystore 本身部署在某一個特定區域裡，它能讓伺服器處理某個請求時查資料的速度變快，但使用者從他所在地連到伺服器所在那個區域所需要的網路傳輸時間，Memorystore 完全幫不上忙——就算資料庫查詢瞬間完成，一個在巴西的使用者連到放在美國的伺服器，光是網路傳輸本身還是要花上好幾十甚至上百毫秒，這段時間不管後端多快都省不掉。\nCDN 跟 Global Load Balancer 解決的正是使用者離內容有多遠的問題——CDN 把內容預先複製到離使用者更近的地方，Global LB 把請求導向離使用者最近的伺服器區域，兩者都是在縮短地理距離，這才是題目真正要解決的那種延遲。\n一句話總結：Memorystore 加速的是伺服器內部處理一個請求要花多久，但這題要解決的是使用者的請求要花多久才能跑到伺服器、內容要花多久才能跑回使用者——這是兩種完全不同成因的延遲，Memorystore 對後者無能為力，是這題 D 選項的誤答陷阱。"}, {"heading": "服務介紹：Media CDN vs Cloud CDN", "body": "Cloud CDN：GCP 的一般用途內容傳遞網路，搭配外部 HTTP(S) 負載平衡器使用，適合快取一般網頁的靜態資源（CSS、JS、圖片）。\nMedia CDN：Google 專門為大規模影片/媒體串流打造的進階 CDN 產品，基於 YouTube 等級的全球邊緣網路，服務對象是媒體/娛樂產業的超大規模串流需求（例如直播、長影片點播）。\n記憶重點：看到題目要服務『一般靜態資源』選 Cloud CDN；看到『大規模影片串流』才考慮 Media CDN，兩者不能互相替代，要看清楚選項到底把哪個工具配對到哪種內容類型。"}]}}, {"id": "T1-Q204", "topic": 1, "qnum": 204, "question": "You are creating a migration plan to move your organization’s infrastructure from on-premises to Google Cloud. You want to understand and manage costs effectively after the migration is complete. Which strategies should you include in the migration plan? (Choose two.)", "options": [{"letter": "A", "text": "Enable Backup and DR Service."}, {"letter": "B", "text": "Configure labels and tags for the resources provisioned in Google Cloud."}, {"letter": "C", "text": "Create a Cloud Scheduler job to export billing data to Cloud SQL."}, {"letter": "D", "text": "Create service alerts using Cloud Monitoring."}, {"letter": "E", "text": "Adopt infrastructure as code (IaC) for the cloud resources."}], "answer": "BE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381813-exam-professional-cloud-architect-topic-1-question-204/", "postedDate": "2025-12-21", "postedYear": 2025, "tags": ["成本優化", "Terraform/IaC", "資料遷移"], "keywords": ["understand and manage costs effectively after the migration is complete"], "explanation": {"questionZh": "你正在制定一份遷移計畫，要把組織的基礎設施從地端搬到 Google Cloud。你希望在遷移完成之後，能有效理解並管理成本。遷移計畫裡應該包含哪些策略？（請選擇兩項）", "optionTable": [{"letter": "A", "analysis": "錯誤：Backup and DR Service 是用來處理資料備份/復原的，跟理解/管理成本完全是不同的議題，答非所問。", "zh": "啟用 Backup and DR Service。"}, {"letter": "B", "analysis": "正確：Labels（標籤）是可以貼在每個 GCP 資源上的自訂標記（例如團隊、環境、成本中心），在帳單報表裡可以依照這些標籤分類篩選，清楚看到到底是哪個團隊/哪個專案/哪個環境花了多少錢，是理解成本最基礎也最關鍵的做法，沒有標籤帳單上只會看到一堆資源名稱，完全看不出成本是誰花的。", "zh": "為在 Google Cloud 佈建的資源設定 labels 和 tags。"}, {"letter": "C", "analysis": "錯誤：GCP 原生就有帳單匯出（Billing Export）功能，可以直接、自動、持續地把帳單明細資料匯出到 BigQuery（不是 Cloud SQL），讓你用 SQL 查詢分析成本。這個選項卻要自己額外寫 Cloud Scheduler 工作手動匯出到 Cloud SQL，是自己造輪子，且目的地也不是 Google 設計給大量帳單分析用的工具，不是 Google 建議的標準做法。", "zh": "建立一個 Cloud Scheduler 工作，把帳單資料匯出到 Cloud SQL。"}, {"letter": "D", "analysis": "錯誤：Cloud Monitoring 的服務警報關心的是系統健康狀況（CPU 使用率、錯誤率、延遲），不是用來監控花了多少錢的工具。GCP 真正用來做花費超過預算就通知的功能是 Billing Budgets & Alerts（帳單預算警示），跟這個選項講的服務警報是不同的機制，答非所問。", "zh": "用 Cloud Monitoring 建立服務警報。"}, {"letter": "E", "analysis": "正確：IaC 讓你用程式碼明確定義每個資源該有的規格、數量，而不是讓人手動、隨意地在主控台點來點去建立資源。每個資源的存在都有程式碼紀錄可查，容易審查、容易一致性地套用規範（例如規定開發環境只能用小規格機型），也更容易找出並清除忘記關掉、沒人在用卻一直在燒錢的孤兒資源，是長期有效管理雲端成本的重要基礎實踐。", "zh": "為雲端資源採用基礎設施即程式碼（IaC）。"}], "notes": [{"heading": "題目在問什麼", "body": "制定一份遷移計畫，把組織的基礎設施從地端搬到 GCP。希望遷移完成之後，能有效理解並管理成本。這是複選題，答案有兩個字母。"}, {"heading": "答案驗證：B+E", "body": "這題考的是『遷移後要怎麼讓成本看得懂、管得住』——Labels（B）負責讓你事後看帳單時能分類歸因（誰花的、花在哪），IaC（E）負責讓資源的建立過程本身就透明、可控、可審查，從源頭減少亂建資源造成浪費的問題。兩者是互補的『事後歸因分析+事前治理控管』組合。要留意題目裡看起來好像也跟成本有關但其實是用錯工具的陷阱選項（C 用錯資料庫目的地、D 混淆了服務健康警報跟帳單預算警示）。信心高。"}, {"heading": "延伸澄清：E 選項的 IaC 指的是什麼時機點", "body": "E 指的不是『搬遷資料本身用什麼工具搬過去』（那是像 Transfer Appliance、Storage Transfer Service 這類一次性的搬運資料工具），而是『遷移完成之後，往後要怎麼管理這些雲端資源』的長期做法——遷移完成、東西都搬到 GCP 之後，往後新增、修改任何雲端資源（不管是不是跟這次遷移有關），都應該透過 IaC 的方式來管理，而不是繼續用手動點擊主控台的方式，這是一個長期、持續性的資源管理習慣，目的是讓成本變得透明、可控、可審查。\n更精確地說：E 不是『搬遷時用 IaC 搬』，而是『搬遷完成後，往後對這些雲端資源的建立/變更/管理，都要用 IaC 的方式做，而不是手動操作』——重點在治理習慣，不是搬遷技術本身。"}, {"heading": "基礎知識：Labels（標籤）如何幫助成本歸因", "body": "是什麼：可以貼在每個 GCP 資源上的自訂鍵值標記（例如 team:marketing、env:production、cost-center:1234）。\n解決什麼問題：帳單報表預設只會顯示資源層級的花費明細，無法直接看出『哪個團隊/專案/環境』花了多少錢；貼上標籤後，可以在帳單分析工具（例如帳單匯出到 BigQuery 後用 SQL 查詢）裡依標籤分組、篩選、加總，清楚拆解出每個維度的花費。\n在這題的應用：是遷移計畫裡最基礎、也最必要的成本治理步驟之一，沒有這一步，之後想做任何精細的成本分析都無從下手。\n常見程度：GCP 考試中『雲端成本治理』情境幾乎必考的基礎實踐。"}]}}, {"id": "T1-Q205", "topic": 1, "qnum": 205, "question": "A Cloud Run service running your serverless application is unable to connect to an AlloyDB database created with default configurations. You need to troubleshoot and resolve the issue as quickly as possible. What should you do?", "options": [{"letter": "A", "text": "Verify that the Cloud Run service and AlloyDB instance are in the same region."}, {"letter": "B", "text": "Enable Direct VPC egress for the Cloud Run service, and send traffic directly to a VPC."}, {"letter": "C", "text": "Disable the default public IP address of the AlloyDB instance, and use the private IP address in the connection string."}, {"letter": "D", "text": "Create a Cloud SQL instance, and migrate the AlloyDB database to PostgreSQL on Cloud SQL."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381825-exam-professional-cloud-architect-topic-1-question-205/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Run/Cloud Functions", "VPC/網路"], "keywords": ["unable to connect to an AlloyDB database created with default configurations"], "explanation": {"questionZh": "一個跑著你無伺服器應用程式的 Cloud Run 服務，無法連接到一個用預設設定建立的 AlloyDB 資料庫。你需要盡快排查並解決這個問題。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：GCP 的 VPC 網路本身是全域的（跨區域互通），是不是同一個區域不是決定連不連得通的關鍵因素（頂多影響延遲），這個檢查找錯方向。", "zh": "確認 Cloud Run 服務和 AlloyDB 執行個體位於同一個區域。"}, {"letter": "B", "analysis": "正確：Direct VPC egress 讓 Cloud Run 這種無伺服器服務，不需要額外建立 VPC 連接器這個中間資源，就能直接把流量送進指定的 VPC 網路裡，正好補上 Cloud Run 本來不在 VPC 裡這個根本缺口，設定起來也簡單快速，完全對應題目要盡快解決的要求。", "zh": "為 Cloud Run 服務啟用 Direct VPC egress，把流量直接送進一個 VPC。"}, {"letter": "C", "analysis": "錯誤：這個選項的前提本身就有問題——AlloyDB 預設就沒有公開 IP（私有 IP 才是預設值），而且就算真的切去用私有 IP，Cloud Run 依然沒有連進 VPC 的路徑，問題根本沒解決。", "zh": "關閉 AlloyDB 執行個體預設的公開 IP 位址，並在連線字串中使用私有 IP 位址。"}, {"letter": "D", "analysis": "錯誤：這是用換一個資料庫、搬整套資料這種超級誇張、曠日廢時的方式，去解決一個其實只是網路設定沒串好的小問題，完全不符合盡快解決的要求，是殺雞用牛刀的典型錯誤。", "zh": "建立一個 Cloud SQL 執行個體，把 AlloyDB 資料庫遷移到 Cloud SQL for PostgreSQL。"}], "notes": [{"heading": "題目在問什麼", "body": "跑在 Cloud Run 上的無伺服器應用程式，連不到一個用預設設定建立的 AlloyDB 資料庫。要盡快排查並解決問題。"}, {"heading": "答案驗證：B", "body": "根本原因：AlloyDB 預設只開放私有 IP 存取，不會自動給公開 IP；Cloud Run 預設情況下根本不在任何 VPC 網路裡面，等於浮在外面，跟 AlloyDB 住的 VPC 完全沒有連通路徑。真正的問題是 Cloud Run 沒有辦法連進 VPC 內部，是網路連通性的根本缺口。看到『Cloud Run（或其他無伺服器服務）連不到 VPC 裡的資源（像私有 IP 的資料庫）』，第一個該想到的是它有沒有連進這個 VPC 的路徑——標準解法是啟用 Direct VPC egress（或較舊的 Serverless VPC Access 連接器），而不是去改資料庫的 IP 設定、換資料庫，或檢查跟連通性其實無關的區域問題。信心高。"}, {"heading": "服務介紹：Direct VPC egress", "body": "是什麼：讓 Cloud Run 這種無伺服器服務，不需要額外建立獨立的 VPC 連接器（Serverless VPC Access connector）資源，就能直接把流量送進指定的 VPC 網路，存取裡面的私有資源（像只開放私有 IP 的資料庫）。\n解決什麼問題：無伺服器服務預設運作在 GCP 管理的網路環境裡，不在客戶自己的 VPC 內，無法直接碰到 VPC 裡的私有資源；這個功能補上這段連通性缺口，而且設定比舊版的 VPC 連接器更簡單直接。\n在這題的應用：是解決 Cloud Run 連不到私有 IP 的 AlloyDB 這個問題最直接、最快速的方法。\n常見程度：GCP 考試中『無伺服器服務要存取 VPC 內私有資源』情境的標準核心解法。"}, {"heading": "基礎知識：AlloyDB 預設網路設定", "body": "AlloyDB 建立時預設只開放私有 IP（private IP）存取，不會自動配置公開 IP——這跟題目選項 C 的前提（『預設的公開 IP』）不符，是這題的一個事實性陷阱，提醒要注意選項描述的前提是否真的成立。"}]}}, {"id": "T1-Q206", "topic": 1, "qnum": 206, "question": "Your company is building containerized applications as part of their CI/CD pipeline. To improve the security and maintainability of the build process, you need to:• Identify potential vulnerabilities within your container images.• Generate verifiable metadata about the builds for auditing and compliance.• Create a comprehensive inventory of your application’s dependenciesWhat should you do?", "options": [{"letter": "A", "text": "Use Cloud Build to build container images, and then trigger Artifact Analysis on images pushed to Artifact Registry."}, {"letter": "B", "text": "Use Cloud Build to build container images, trigger Binary Authorization, and use Cloud Asset Inventory for tracking and analysis."}, {"letter": "C", "text": "Use Cloud Build to build container images, push the images to Artifact Registry, and use Security Command Center for tracking and analysis."}, {"letter": "D", "text": "Use Cloud Build to build container images, trigger Binary Authorization, and use Security Command Center for tracking and analysis."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381816-exam-professional-cloud-architect-topic-1-question-206/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["CI/CD", "容器化", "安全性", "Security Command Center"], "keywords": ["Identify potential vulnerabilities within your container images", "Generate verifiable metadata about the builds for auditing and compliance", "Create a comprehensive inventory of your application's dependencies"], "explanation": {"questionZh": "你的公司正在 CI/CD 管線中建置容器化應用程式。為了提升建置流程的安全性和可維護性，你需要：找出容器映像檔裡的潛在漏洞；產生可驗證的建置元資料，供稽核與合規使用；建立應用程式相依套件的完整清單。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：Artifact Analysis 不只做漏洞掃描（對應需求①），還能產生建置來源證明（provenance，可驗證、不能造假，對應需求②）以及軟體物料清單（SBOM，列出相依套件及版本，對應需求③），一個服務同時覆蓋三個需求，整合流程直接（Cloud Build 建置→Artifact Registry 存放→Artifact Analysis 掃描分析）。", "zh": "使用 Cloud Build 建置容器映像檔，然後對推送到 Artifact Registry 的映像檔觸發 Artifact Analysis。"}, {"letter": "B", "analysis": "錯誤：Binary Authorization 是部署時的政策把關工具，本身不會去掃描漏洞；Cloud Asset Inventory 是用來盤點 GCP 資源本身（VM、資料庫等基礎設施資產）的工具，不是用來列出容器映像檔裡軟體相依套件清單的，兩個工具都對不上題目的三個具體需求。", "zh": "使用 Cloud Build 建置容器映像檔，觸發 Binary Authorization，並使用 Cloud Asset Inventory 做追蹤和分析。"}, {"letter": "C", "analysis": "錯誤：Security Command Center 是 GCP 集中彙整各種安全發現結果的儀表板，本身不負責做實際的漏洞掃描、也不產生建置來源證明或 SBOM，這個選項完全沒有提到任何實際做掃描/產生元資料的服務，漏了 Artifact Analysis 這個關鍵環節。", "zh": "使用 Cloud Build 建置容器映像檔，把映像檔推送到 Artifact Registry，並使用 Security Command Center 做追蹤和分析。"}, {"letter": "D", "analysis": "錯誤：跟 B、C 犯了類似的問題——Binary Authorization 不做掃描，Security Command Center 只是彙整結果的儀表板不做掃描，整個流程裡沒有任何環節負責產生漏洞掃描結果、建置來源證明或 SBOM，三個核心需求通通沒被實際滿足。", "zh": "使用 Cloud Build 建置容器映像檔，觸發 Binary Authorization，並使用 Security Command Center 做追蹤和分析。"}], "notes": [{"heading": "題目在問什麼", "body": "公司在 CI/CD 管線裡建置容器化應用程式。為了提升建置流程的安全性和可維護性，需要：找出容器映像檔裡的潛在漏洞；產生可驗證的建置元資料供稽核合規用；建立應用程式相依套件的完整清單。"}, {"heading": "答案驗證：A", "body": "這題考的是認出 Artifact Analysis 是唯一真正負責『掃描漏洞+產生可驗證建置元資料+產出相依套件清單』這三件事的服務——Binary Authorization 是部署關卡（管能不能部署，不是掃描工具），Security Command Center 是彙整儀表板（管把結果呈現出來，不是產生結果的工具），Cloud Asset Inventory 管的是 GCP 資源本身（不是容器內部的軟體相依套件）。看到『漏洞掃描+建置元資料/SBOM』這種組合需求，直接鎖定 Artifact Analysis。信心高。"}, {"heading": "基礎知識：建置來源證明（Provenance）與 SBOM（軟體物料清單）", "body": "建置來源證明（Provenance）：記錄一個容器映像檔是從哪個原始碼、哪次建置、用什麼流程產生的，具有可驗證性（不能被竄改偽造），常用於稽核和合規，證明『這個映像檔確實是經過受信任的流程產生的』。\nSBOM（Software Bill of Materials，軟體物料清單）：列出一個軟體/容器映像檔裡包含哪些相依套件及其版本，就像食品包裝上的成分表，讓你清楚知道裡面到底用了哪些第三方元件，一旦某個套件被發現有漏洞，可以快速查出哪些映像檔受影響。\n在這題的應用：Artifact Analysis 能同時產生這兩種資訊，直接對應題目的②③需求。\n常見程度：近年軟體供應鏈安全（software supply chain security）主題的核心概念，GCP 考試中『容器安全/CI/CD 強化』情境常考。"}, {"heading": "名詞快速對照：Binary Authorization vs Security Command Center vs Artifact Analysis", "body": "Artifact Analysis：實際執行漏洞掃描、產生建置元資料和 SBOM 的服務，是『生產』資安資訊的源頭。\nBinary Authorization：部署時的政策把關工具，根據既有的證明/簽署資訊決定要不要放行部署，自己不做掃描。\nSecurity Command Center：集中彙整顯示各種安全發現結果的儀表板，是『呈現』資訊的終端，自己不做掃描也不產生元資料。\n記憶重點：題目要『找出漏洞+產生元資料+相依套件清單』這種『生產資訊』的需求，答案要選真正做這件事的服務（Artifact Analysis），不要被『聽起來也跟安全有關』的 Binary Authorization 或 Security Command Center 混淆。"}]}}, {"id": "T1-Q207", "topic": 1, "qnum": 207, "question": "Your team is running applications on a Google Kubernetes Engine (GKE) cluster with a private endpoint. You've set up a Cloud Deploy pipeline, but deployments to the GKE cluster are failing. You need to resolve the issue. What should you do?", "options": [{"letter": "A", "text": "Use VPC Service Controls with Cloud Build Update the Cloud pipeline to use Cloud Build as its execution environment."}, {"letter": "B", "text": "Create a Cloud Build private pool in the default VPC. Use Cloud Build to deploy the applications to the GKE cluster."}, {"letter": "C", "text": "Create a Cloud Build private pool that is peered with the same VPC network as your GKE cluster. Update the Cloud Deploy pipeline to use this private pool as its execution environment."}, {"letter": "D", "text": "Create a custom target in Cloud Deploy Update the deploy pipeline to use the custom target for the application deployment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381827-exam-professional-cloud-architect-topic-1-question-207/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["GKE/Kubernetes", "CI/CD", "VPC/網路"], "keywords": ["deployments to the GKE cluster are failing"], "explanation": {"questionZh": "你的團隊在一個擁有私有端點的 Google Kubernetes Engine（GKE）叢集上執行應用程式。你已經設定好一個 Cloud Deploy 管線，但部署到 GKE 叢集一直失敗。你需要解決這個問題。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：VPC Service Controls 解決的是防止資料被搬出邊界的問題，跟執行環境能不能連進 VPC 內部這個連通性問題完全不是同一件事，工具選錯了。", "zh": "搭配 Cloud Build 使用 VPC Service Controls。把 Cloud Deploy 管線更新為使用 Cloud Build 作為其執行環境。"}, {"letter": "B", "analysis": "錯誤：私有集區的概念方向對了，但指定的是 default VPC（預設 VPC），而不是明確跟 GKE 叢集所在的那個 VPC 配對——如果 GKE 叢集其實跑在另一個自訂的 VPC 裡，這個私有集區還是連不到 GKE 的私有端點，問題沒有真正解決。", "zh": "在預設 VPC 中建立一個 Cloud Build 私有集區。使用 Cloud Build 把應用程式部署到 GKE 叢集。"}, {"letter": "C", "analysis": "正確：明確指定私有集區要跟 GKE 叢集所在的那個 VPC 網路對等連線，確保執行部署動作的環境真的有路可以連到 GKE 的私有端點，再把 Cloud Deploy 管線設定成使用這個私有集區來執行部署動作，完整解決執行環境連不進 VPC 這個根本問題，且保留 Cloud Deploy 本身的部署流程。", "zh": "建立一個跟你 GKE 叢集同一個 VPC 網路做對等連線的 Cloud Build 私有集區。把 Cloud Deploy 管線更新為使用這個私有集區作為其執行環境。"}, {"letter": "D", "analysis": "錯誤：Custom target 是用來支援 Cloud Deploy 原本不支援的部署目的地類型，但 GKE 本身就是 Cloud Deploy 原生就支援的標準部署目標，這題的問題不是目標類型支不支援，而是網路連不連得到，用錯概念解決問題。", "zh": "在 Cloud Deploy 建立一個自訂目標（custom target）。把部署管線更新為使用這個自訂目標來做應用程式部署。"}], "notes": [{"heading": "題目在問什麼", "body": "團隊在一個有私有端點的 GKE 叢集上跑應用程式，已經設好 Cloud Deploy 管線，但部署到 GKE 叢集一直失敗，要解決這個問題。"}, {"heading": "答案驗證：C", "body": "根本原因：GKE 叢集設定私有端點，代表叢集的控制平面只能從 VPC 內部的私有網路存取，完全不對公開網際網路開放。Cloud Deploy 預設執行部署動作時，背後用的是 Cloud Build 的『預設集區』，運作在客戶 VPC 之外，連不到那個只開放私有存取的 GKE API server，這是部署一直失敗的根本原因，是網路連通性問題。看到『Cloud Deploy/Cloud Build 要部署到一個只開放私有存取（private endpoint）的目標』，核心解法是確認執行部署動作的環境本身是不是真的能連進那個目標所在的 VPC——標準做法是用 Cloud Build 私有集區，且一定要明確跟目標資源所在的那個 VPC 網路對等連線（不能隨便用 default VPC 交差），再讓 Cloud Deploy 管線指定使用這個私有集區當執行環境。信心高。"}, {"heading": "服務介紹：Cloud Build 私有集區（Private Pool）", "body": "是什麼：Cloud Build 執行建置/部署任務時使用的一組專屬運算資源，跟 Google 管理的『預設集區（運作在客戶 VPC 之外的共用資源）』不同，私有集區可以設定跟客戶指定的 VPC 網路對等連線（peering），讓執行環境真正擁有進到該 VPC 內部、存取私有資源的網路路徑。\n解決什麼問題：當建置/部署任務需要存取只開放私有網路存取的資源（例如私有端點的 GKE 叢集、私有 IP 的資料庫），預設集區因為不在客戶 VPC 內會連不到，私有集區解決這個連通性缺口。\n在這題的應用：關鍵是私有集區要跟『正確的那個 VPC』（也就是 GKE 叢集所在的 VPC）對等連線，不能隨便指定一個不相關的 VPC（像選項 B 的 default VPC）。\n常見程度：GCP 考試中『CI/CD 管線要存取私有網路資源』情境的標準核心解法。"}, {"heading": "什麼是 Cloud Deploy 的 Custom Target", "body": "是什麼：Cloud Deploy 原生內建支援的部署目標類型包括 GKE、Cloud Run、Anthos clusters 等，Custom Target 讓你能擴充 Cloud Deploy，支援清單外的任何部署目的地（例如完全獨立、未被 Anthos 納管的地端 Kubernetes 叢集、其他雲端供應商的 Kubernetes 服務如 AWS EKS、或完全自訂的部署流程），透過 Skaffold 的自訂動作機制告訴 Cloud Deploy 遇到這個目標時該執行哪些指令/腳本來完成部署。\n解決什麼問題：當部署目的地不在 Google 原生支援清單裡時，提供擴充機制。\n在這題的應用：GKE 已經是 Cloud Deploy 原生支援的標準目標類型，不需要也不應該建立自訂目標，這題的問題是網路連通性，不是目標類型支援度，D 選項解決的是一個根本不存在的問題。\n常見程度：Cloud Deploy 的進階擴充功能，考試中常用來跟『原生支援的目標類型』做對比混淆。"}]}}, {"id": "T1-Q208", "topic": 1, "qnum": 208, "question": "You are planning to migrate your on-premises compute and SAP workloads to Google Cloud. You want to follow Google-recommended practices to quickly create a cost estimate for running these workloads in Google Cloud. What should you do?", "options": [{"letter": "A", "text": "Leverage Cloud Asset Inventory to gather data and generate a cost estimate."}, {"letter": "B", "text": "Use the Google Cloud pricing calculator, and input the estimated resource to generate a cost estimate."}, {"letter": "C", "text": "Engage with a Google Cloud partner to perform a comprehensive assessment and provide a customized cost estimate."}, {"letter": "D", "text": "Gather data about your current environment, and leverage Google Cloud Migration Center to generate a cost estimate."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381828-exam-professional-cloud-architect-topic-1-question-208/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["成本優化", "資料遷移"], "keywords": ["quickly create a cost estimate for running these workloads in Google Cloud"], "explanation": {"questionZh": "你正在規劃把地端的運算和 SAP 工作負載遷移到 Google Cloud。你想要遵循 Google 建議的做法，快速建立這些工作負載在 Google Cloud 上運行的成本估算。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Cloud Asset Inventory 是用來盤點已經在 GCP 上的資源的工具，不是用來分析地端環境、也不是設計來做遷移成本估算的工具，角色用錯。", "zh": "善用 Cloud Asset Inventory 收集資料並產生成本估算。"}, {"letter": "B", "analysis": "錯誤：這是通用計算器，要自己手動猜測/估計需要多少運算資源再輸入進去計算，不會自動分析實際的地端環境，完全依賴人工猜測，對於像 SAP 這種複雜企業級系統容易估算失準。", "zh": "使用 Google Cloud 定價計算器，輸入估計的資源規格來產生成本估算。"}, {"letter": "C", "analysis": "錯誤：找合作夥伴做全面評估確實能拿到精準估算，但這個過程需要人員介入、進行完整顧問式評估，通常要花不少時間才能完成，跟題目要求的快速直接衝突。", "zh": "找 Google Cloud 合作夥伴做全面評估，提供客製化的成本估算。"}, {"letter": "D", "analysis": "正確：Migration Center 是 Google 專門為遷移評估打造的免費官方工具，可以自動收集/匯入現有地端環境的實際資料（支援 VMware 環境、SAP 系統、裸機伺服器等），根據真實數據自動產生合理規格建議和成本估算，不用自己憑空猜測，完全對應題目快速+根據 Google 建議做法的要求。", "zh": "收集現有環境的資料，善用 Google Cloud Migration Center 產生成本估算。"}], "notes": [{"heading": "題目在問什麼", "body": "打算把地端的運算和 SAP 工作負載遷移到 GCP，想要遵循 Google 建議做法，快速產生這些工作負載在 GCP 上運行的成本估算。"}, {"heading": "答案驗證：D", "body": "看到『規劃從地端遷移到 GCP，想快速、根據 Google 建議做法產生成本估算』，直接鎖定 Migration Center——它能根據實際環境的資料自動產生估算，比起手動輸入猜測值到定價計算器（較不精準）或找合作夥伴做全面評估（較耗時），是又快又準的標準做法；Cloud Asset Inventory 管的是 GCP 裡已有的資源，跟地端環境遷移評估是完全不同的情境，角色別搞混。信心高。"}, {"heading": "服務介紹：Google Cloud Migration Center", "body": "是什麼：Google 專門為遷移評估打造的免費官方工具，可以透過各種收集器自動收集/匯入現有地端環境的實際資料（支援 VMware 環境、SAP 系統、裸機伺服器等各種工作負載類型）。\n解決什麼問題：傳統上要估算遷移到雲端的成本，得靠人工盤點現有系統規模再手動估算，容易失準且耗時；Migration Center 根據自動收集到的真實環境數據，自動產生合理的資源規格建議和成本估算，既快速又準確。\n在這題的應用：題目特別提到『SAP 工作負載』，Migration Center 原生支援 SAP 系統的資料收集，是精準對應這個情境的官方工具。\n常見程度：GCP 考試中『地端遷移規劃/成本評估』情境的標準推薦工具。"}]}}, {"id": "T1-Q209", "topic": 1, "qnum": 209, "question": "Your organization has a significant amount of log data stored in Cloud Logging. The data engineering team is accustomed to using SQL for analysis and wants the ability to create insightful dashboards for visualizing log trends and patterns. You want to follow the recommendations of the Google Cloud Well-Architected Framework to provide a solution for the data engineering team. What should you do?", "options": [{"letter": "A", "text": "Create a log sink, and export the data to BigQuery using Pub/Sub. Run queries and visualize the data with Cloud Monitoring dashboards."}, {"letter": "B", "text": "Enable log analytics and run queries in Cloud Monitoring. Visualize the data using Vertex AI workbench."}, {"letter": "C", "text": "Enable log analytics and run queries in the linked log dataset in BigQuery. Visualize the data with Looker Studio dashboards."}, {"letter": "D", "text": "Create a log sink, and export the data to a storage bucket. Create an external table in BigQuery for the data in the bucket. Run queries and visualize the data with Cloud Monitoring dashboards."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381814-exam-professional-cloud-architect-topic-1-question-209/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Monitoring/Logging", "BigQuery", "監控與可觀測性"], "keywords": ["create insightful dashboards for visualizing log trends and patterns"], "explanation": {"questionZh": "你的組織在 Cloud Logging 裡存了大量日誌資料。資料工程團隊習慣用 SQL 做分析，想要能建立有洞察力的儀表板來視覺化日誌趨勢和模式。你想要遵循 Google Cloud Well-Architected Framework 的建議，為資料工程團隊提供解決方案。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Log sink 其實可以直接把日誌匯出到 BigQuery，不需要多繞一層 Pub/Sub（Pub/Sub 適合需要即時事件處理的情境，單純把日誌搬到 BigQuery 不需要這個中間層）；而且 Cloud Monitoring 儀表板是設計給監控指標用的，不是為了對 BigQuery 資料做一般商業智慧儀表板視覺化設計的工具。", "zh": "建立一個 log sink，透過 Pub/Sub 把資料匯出到 BigQuery。用 Cloud Monitoring 儀表板跑查詢並視覺化資料。"}, {"letter": "B", "analysis": "錯誤：Log Analytics 的 SQL 查詢其實是在 Cloud Logging（或連結的 BigQuery 資料集）裡執行，不是在 Cloud Monitoring 裡，這個選項把兩個不同產品搞混了；而且 Vertex AI Workbench 是給機器學習工程師寫程式訓練模型用的開發環境，不是用來做一般商業儀表板視覺化的工具。", "zh": "啟用 log analytics，在 Cloud Monitoring 裡跑查詢。用 Vertex AI Workbench 視覺化資料。"}, {"letter": "C", "analysis": "正確：Log Analytics 把日誌資料連結到 BigQuery（不用額外架設匯出管線），資料工程團隊可以直接用熟悉的 SQL 在這個連結資料集裡查詢分析；Looker Studio 是 Google 自己的免費商業智慧/儀表板工具，可以直接連接 BigQuery 資料源，負責產出視覺化的儀表板。這個組合最直接、最精簡，是 Google 官方針對這個情境專門設計的標準做法。", "zh": "啟用 log analytics，在連結的 BigQuery 日誌資料集裡跑查詢。用 Looker Studio 儀表板視覺化資料。"}, {"letter": "D", "analysis": "錯誤：這個流程比 C 多了好幾個步驟（先匯出到 Cloud Storage，再手動建立外部資料表連過去查詢），相較於 Log Analytics 的直接連結方式明顯更繞路、更複雜；而且一樣用 Cloud Monitoring 儀表板做一般的資料視覺化，不是正確的工具選擇。", "zh": "建立一個 log sink，把資料匯出到一個儲存空間 bucket。在 BigQuery 為 bucket 裡的資料建立一個外部表格。用 Cloud Monitoring 儀表板跑查詢並視覺化資料。"}], "notes": [{"heading": "題目在問什麼", "body": "組織在 Cloud Logging 裡存了大量日誌資料。資料工程團隊習慣用 SQL 做分析，想要建立有洞察力的儀表板來視覺化日誌趨勢和模式。要遵循 Google Cloud Well-Architected Framework 的建議。"}, {"heading": "答案驗證：C", "body": "看到『日誌資料要用 SQL 分析+要做視覺化儀表板』這種組合需求，優先想到 Log Analytics 的連結式 BigQuery 資料集（不用自己架匯出管線，直接查詢）+ Looker Studio（Google 官方的儀表板/BI 工具，專門用來做這種連接資料源、產出視覺化報表的工作）——不要被 Cloud Monitoring 儀表板（監控指標用，不是通用 BI 工具）或 Vertex AI Workbench（機器學習開發環境，不是儀表板工具）這些聽起來也有視覺化功能，但實際用途不對應的工具混淆。信心高。"}, {"heading": "基礎知識：Log Analytics vs Log Sink 的本質差異", "body": "Log Analytics（連結式資料集）：讓你直接在原本的日誌資料上用 SQL 查詢分析，重點是『連結（link）』，不是『複製一份』。資料還是待在原來的日誌儲存桶裡，Log Analytics 只是開了一個用 BigQuery SQL 引擎去讀取它的窗口，沒有真的另外存一份拷貝。\nLog Sink（接收器）：把日誌真正複製/搬送一份到別的地方——目的地可以是拿去做分析（BigQuery）、長期儲存（Cloud Storage）、或轉送給其他系統即時處理（Pub/Sub）。重點是真的產生了一份新的、獨立存在的拷貝，搬過去之後跟原本 Cloud Logging 裡的日誌，是兩份各自獨立的資料。\n這個差異什麼時候重要：如果只是想用 SQL 查詢分析日誌，用 Log Analytics 的連結資料集就夠了，更輕量、不用額外管理一份複製的資料、設定也更簡單（這是 Q209 選 C 的原因）。如果需要真正把資料搬出去——例如 Cloud Logging 的日誌保留期限到了要被自動刪除，但想長期保存；或想把日誌餵給 Cloud Logging 本身不支援的其他外部系統/工具——這時候才需要用 Log Sink 真正複製一份出去。\n一句話總結：Log Analytics = 不複製資料，直接在原地開窗查詢；Log Sink = 真的複製一份資料，搬到別的地方（可能是為了分析，也可能純粹是為了長期儲存）。"}, {"heading": "服務介紹：Log Sink", "body": "是什麼：Cloud Logging 的功能，可以設定把符合特定條件的日誌（例如某個專案、某個嚴重等級以上）自動持續地轉送到指定目的地（BigQuery、Cloud Storage、Pub/Sub）。\n解決什麼問題：Cloud Logging 本身的日誌有保留期限，而且不是所有分析/應用場景都適合直接在 Cloud Logging 裡做，Log Sink 讓你把日誌持續、自動地複製一份到更適合的地方長期保存或做進一步處理，不用自己寫程式定期把日誌抓出來搬走。\n在這題的應用：如果單純想把日誌送進 BigQuery 做分析，Log Sink 可以直接指定 BigQuery 當目的地，不需要經過 Pub/Sub 這一層（那是給需要即時事件觸發反應的場景用的）；而這題用 Log Analytics 的連結資料集，甚至連 Log Sink 都不用設，更直接。\n常見程度：GCP 考試中『日誌要匯出到其他服務長期保存或處理』情境的標準核心服務。"}, {"heading": "服務介紹：Looker Studio", "body": "是什麼：Google 的免費商業智慧（BI）/儀表板工具，可以直接連接 BigQuery 等多種資料源，用拖拉的方式快速做出視覺化報表和儀表板。\n解決什麼問題：讓非工程背景的人也能快速把資料變成圖表、報表，不需要寫程式碼。\n在這題的應用：負責把 BigQuery 裡查詢出來的日誌趨勢資料，做成『有洞察力的儀表板』，對應題目的視覺化需求。\n常見程度：GCP 考試中『資料視覺化/儀表板』情境的標準正確工具，常跟 Cloud Monitoring 儀表板（監控指標專用，不是通用 BI 工具）做對比混淆。"}]}}, {"id": "T1-Q210", "topic": 1, "qnum": 210, "question": "You are designing the storage architecture for a financial analytics platform. The platform ingests and stores terabytes of transactional data daily, which is used for both real-time fraud detection and long-term historical analysis. Transaction data from the last 30 days must be accessible with very low latency for the fraud detection engine. Data older than 30 days is accessed infrequently for quarterly reports, where retrieval times of a few seconds are acceptable. All data must be retained for five years to meet compliance regulations. You need to design a solution as cost-effective as possible. What should you do?", "options": [{"letter": "A", "text": "Store all transaction data in a Cloud Storage bucket using the Standard storage class for the entire five-year retention period."}, {"letter": "B", "text": "Ingest all data into BigQuery using time-partitioned tables, and rely on BigQuery’s automatic long-term storage pricing for data older than 90 days."}, {"letter": "C", "text": "Configure a Cloud Storage bucket with an Object Lifecycle Management policy to transition data from the Standard class to the Archive class after 30 days."}, {"letter": "D", "text": "Configure a Cloud Storage bucket with an Object Lifecycle Management policy to transition data from the Standard class to the Coldline class after 30 days."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381819-exam-professional-cloud-architect-topic-1-question-210/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Storage", "成本優化", "合規性"], "keywords": ["very low latency for the fraud detection engine", "as cost-effective as possible"], "explanation": {"questionZh": "你正在為一個金融分析平台設計儲存架構。這個平台每天收進並儲存數 TB 的交易資料，同時用於即時詐欺偵測和長期歷史分析。最近 30 天的交易資料，必須能以非常低的延遲供詐欺偵測引擎存取。超過 30 天的資料，存取頻率很低，只用於每季報表，檢索時間可以接受幾秒鐘。所有資料必須保留五年以符合合規法規。你需要設計一套盡可能符合成本效益的方案。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Standard 是最貴的儲存類別，專門設計給經常被存取的資料用。超過 30 天的資料存取頻率很低（只是每季看一次做報表），整整 5 年都用最貴的類別存，完全沒有利用冷資料用便宜類別存這個基本的成本優化手法，不符合成本效益的要求。", "zh": "在整整五年的保留期間，把所有交易資料存在一個使用 Standard 儲存類別的 Cloud Storage bucket 裡。"}, {"letter": "B", "analysis": "錯誤：題目明確說 30 天是門檻，這個選項卻用 90 天當分界點，跟題目描述的時間點不吻合；而且 BigQuery 是分析型資料倉儲，擅長大規模的複雜 SQL 查詢分析，但不是專門為即時詐欺偵測需要的超低延遲單筆交易查詢設計的服務，拿它當即時查詢後端不是最適合的工具選擇。", "zh": "把所有資料匯入 BigQuery，用時間分區表，並依靠 BigQuery 針對超過 90 天的資料自動套用的長期儲存定價機制。"}, {"letter": "C", "analysis": "錯誤：Archive 類別是設計給大約一年存取一次甚至更少的資料用的。這題超過 30 天的資料每季都要被拿出來做報表（一年大概存取 4 次），存取頻率明顯比 Archive 設計的目標頻率高。雖然 Archive 的儲存費用最便宜，但它的單次讀取費用也最貴，以每季都要讀一次的實際使用模式去算，頻繁讀取費用加總起來反而不是整體最划算的選擇。", "zh": "設定一個 Cloud Storage bucket 的物件生命週期管理政策，在 30 天後把資料從 Standard 類別轉換到 Archive 類別。"}, {"letter": "D", "analysis": "正確：Coldline 類別正是設計給大約每季存取一次的資料用的，這跟題目描述的超過 30 天的資料用於每季報表完全精準對應。用生命週期政策自動把超過 30 天的資料從 Standard（貴但存取快，服務即時詐欺偵測）轉成 Coldline（便宜，存取頻率剛好符合每季報表需求），兩種需求各自配對到最合適、最省錢的儲存類別。", "zh": "設定一個 Cloud Storage bucket 的物件生命週期管理政策，在 30 天後把資料從 Standard 類別轉換到 Coldline 類別。"}], "notes": [{"heading": "題目在問什麼", "body": "金融分析平台每天收進大量交易資料，用於即時詐欺偵測和長期歷史分析。最近 30 天的資料給詐欺偵測引擎用時延遲要非常低。超過 30 天的資料存取頻率低，只用於每季報表，檢索時間可接受幾秒。所有資料要保留 5 年合規。要設計盡可能符合成本效益的方案。"}, {"heading": "答案驗證：D", "body": "這題考的核心是『依照實際存取頻率，把資料放進設計頻率最吻合的儲存類別，才是真正的成本效益最佳化』，不是『越便宜的類別一定越好』。要記住 Cloud Storage 幾個類別對應的大概存取頻率：Standard（常用）→ Nearline（約每月）→ Coldline（約每季）→ Archive（約每年或更少）；而且它們的讀取速度其實都差不多快，差別主要在費用結構，看實際存取頻率去挑最省錢的那一檔，而不是無差別選最便宜的。信心高。"}, {"heading": "基礎知識：Cloud Storage 儲存類別的設計頻率與費用結構", "body": "Standard：經常存取，儲存費用貴，單次讀取便宜。\nNearline：大約每月一次，儲存費用便宜一點，單次讀取稍貴。\nColdline：大約每季一次，儲存費用更便宜，單次讀取更貴。\nArchive：大約每年一次或更少，儲存費用最便宜，單次讀取最貴。\n一個常被誤解的重點：這幾個類別的讀取速度其實都一樣快（都是毫秒等級的首次位元回應時間）——不像某些其他雲平台（例如 AWS Glacier 真的要花幾個小時才能把資料取出來），GCP 的 Archive 類別並沒有要等很久才能拿到資料這種限制。差異純粹是費用：存得越冷門（Archive），單次儲存越便宜，但真的要讀它時，每次讀取要付的錢就比較貴。\n在這題的應用：資料每季存取一次（4次/年）剛好對應 Coldline 的設計頻率，而非更低頻率的 Archive，選錯類別會導致頻繁讀取費用超過省下的儲存費用。"}, {"heading": "延伸澄清：為什麼 BigQuery 不適合即時詐欺偵測的低延遲查詢", "body": "BigQuery 擅長的是對巨量資料做複雜的聚合/統計分析，背後是分散式系統，收到查詢後要先規劃執行計畫、把工作分配給很多台機器平行處理、再彙整結果，整個過程就算很快也通常要幾百毫秒到幾秒，因為設計目標是處理大量資料的吞吐量，不是單筆資料的極速回應。\n即時詐欺偵測需要的是單筆、高頻率、極低延遲的查詢（point lookup）——例如使用者刷卡付款的瞬間，系統要在極短時間內（整個授權流程預算通常只有幾百毫秒）查這個使用者最近的交易紀錄並比對特徵，這跟 BigQuery 擅長的一次掃過一大批資料做統計是完全不同的查詢模式。這種情境 GCP 官方建議用 Bigtable、Spanner，或 Memorystore 這類專門為低延遲單筆查詢設計的服務。\nBigQuery 並非完全不能用在詐欺偵測相關工作上，只是用在不同階段：適合訓練詐欺偵測模型用的歷史資料分析、事後批次報表這類不急、一次處理大量資料的工作；不適合的是交易發生當下、要用極低延遲查到資料的即時服務（serving）需求。BigQuery 的強是指它能快速處理巨量資料的統計分析，不等於它能做到單筆資料的極速查詢回應，這才是選項 B 不適合的根本原因，不是分析能力不夠強。"}]}}, {"id": "T1-Q211", "topic": 1, "qnum": 211, "question": "You are architecting a new application feature for a healthcare provider based in Qatar. The feature needs to summarize sensitive patient notes that are submitted by clinicians. A critical requirement is that the content of these patient notes must never be processed outside of Qatar's borders. You want to use a powerful, pre-trained generative model for the summarization task while strictly adhering to the data residency constraint. What should you do?", "options": [{"letter": "A", "text": "Write application code that sends the patient notes explicitly to the Gemini API endpoint in Qatar for summarization. Protect the API by VPC-Service Controls."}, {"letter": "B", "text": "Use Vertex AI Model Garden to select a Gemma model. Deploy this model to a Vertex AI Endpoint within a Google Cloud region located in Qatar."}, {"letter": "C", "text": "Use the Cloud Natural Language API to analyze the text and configure it to generate a summary of the patient notes."}, {"letter": "D", "text": "Gather a large, anonymized dataset of medical notes. Use Vertex AI Training to train a custom summarization model from scratch, deploying it in a Qatar region."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381823-exam-professional-cloud-architect-topic-1-question-211/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Vertex AI/AI-ML", "合規性", "安全性"], "keywords": ["the content of these patient notes must never be processed outside of Qatar's borders"], "explanation": {"questionZh": "你正在為一家位於卡達的醫療機構設計一項新的應用程式功能。這項功能需要摘要由臨床醫師提交的敏感病患筆記。一項關鍵要求是：這些病患筆記的內容絕對不能在卡達國境以外被處理。你想要使用一個強大、預訓練好的生成式模型來做摘要任務，同時嚴格遵守資料落地（data residency）限制。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：這個選項假設卡達有一個 Gemini API 端點，但 Gemini 這類旗艦級閉源託管模型，Google 通常只在少數幾個特定區域開放服務端點，不保證在每個 GCP 區域都能用，卡達這個區域很可能根本沒有開放 Gemini 端點，這個前提本身很可能不成立。", "zh": "撰寫應用程式程式碼，明確把病患筆記傳送到位於卡達的 Gemini API 端點做摘要。用 VPC Service Controls 保護這個 API。"}, {"letter": "B", "analysis": "正確：Gemma 是開放權重模型，可以把整套模型檔案下載下來，自己部署到指定的任何 Vertex AI 區域（包括卡達的區域），運算完全在自己選的地方執行，確保資料不會離開卡達境內，同時依然是強大、預訓練好的模型（只是部署它，不是從零訓練）。", "zh": "使用 Vertex AI Model Garden 選擇一個 Gemma 模型。把這個模型部署到位於卡達的 Google Cloud 區域裡的一個 Vertex AI Endpoint。"}, {"letter": "C", "analysis": "錯誤：Cloud Natural Language API 是通用的文字分析工具（抓關鍵字、情緒分析等），不是專門為生成式摘要設計，也沒有明確的指定處理區域保證。", "zh": "使用 Cloud Natural Language API 分析文字，並設定它來產生病患筆記的摘要。"}, {"letter": "D", "analysis": "錯誤：直接違反題目要求的使用預訓練好的模型，從零訓練一個生成式摘要模型是極其龐大、不切實際的工程，完全答非所問。", "zh": "收集一份大型、已匿名化的醫療筆記資料集。使用 Vertex AI Training 從零訓練一個自訂的摘要模型，部署在卡達區域。"}], "notes": [{"heading": "題目在問什麼", "body": "卡達醫療機構要做摘要病患筆記的功能。關鍵要求：內容絕對不能在卡達國境以外被處理。要用強大、預訓練好的生成式模型，同時嚴格遵守資料落地限制。"}, {"heading": "答案驗證：B", "body": "Gemini 是閉源託管模型，可用區域有限（不保證卡達有開放端點）；Gemma 是開放權重模型，可以自己部署到任何指定區域（包括卡達），確保運算真的發生在境內，同時依然是預訓練好的強大模型。信心高。"}, {"heading": "基礎知識：Gemini vs Gemma", "body": "Gemini：Google 的旗艦級、閉源託管生成式模型，透過呼叫 Google 管理的 API 端點使用，不能自己決定它實際在哪個機房運算，Google 通常只在少數幾個特定區域開放服務端點。\nGemma：Google 推出的開放權重（open weights）模型，可以把整套模型檔案下載下來，自己部署到指定的任何 Vertex AI 區域，運算完全在自己選的地方執行。\n在這題的應用：資料落地（data residency）這種『處理地點必須被嚴格控制在某個國家/區域』的要求，開放權重模型（可自由選擇部署區域）比閉源託管 API（可用區域受限、不透明）更適合。\n常見程度：GCP 考試中『資料主權/落地合規』結合『使用生成式 AI』情境逐漸常見的新興題型。"}]}}, {"id": "T1-Q212", "topic": 1, "qnum": 212, "question": "You are migrating a critical on-premises inventory management application to Google Cloud. The application is a monolith with a traditional relational database, and the immediate business goal is a rapid data center exit. The monolith is exposing an API to other business critical applications.The long-term vision is to modernize the application into globally distributed, cloud-native services to support the company’s expansion. You need to design the initial cloud architecture to ensure that future modernization causes the least possible disruption to other applications that depend on inventory data. The future modernization might require the API to change structure. What should you do?", "options": [{"letter": "A", "text": "Use Service Directory to register the monolith's endpoint, allowing dependent applications to look up its address and connect directly."}, {"letter": "B", "text": "Implement a managed API facade with Apigee to handle all requests from dependent applications on behalf of the monolith’s backend."}, {"letter": "C", "text": "Use an internal load balancer to provide a stable IP for dependent applications to connect directly to the monolith's native API."}, {"letter": "D", "text": "Provide dependent applications with direct database access by creating secured SQL VIEWs on Cloud SQL for them to query."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381830-exam-professional-cloud-architect-topic-1-question-212/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Apigee", "資料遷移"], "keywords": ["ensure that future modernization causes the least possible disruption to other applications"], "explanation": {"questionZh": "你正在把一個關鍵的地端庫存管理應用程式遷移到 Google Cloud。這個應用程式是一個搭配傳統關聯式資料庫的單體式架構，當前的業務目標是快速撤出資料中心。這個單體系統對外提供一個 API，給其他業務關鍵應用程式使用。長期願景是把這個應用程式現代化成全球分散的雲原生服務，以支援公司的擴張。你需要設計初始的雲端架構，確保未來現代化時，對依賴庫存資料的其他應用程式造成的衝擊盡可能最小。未來的現代化可能需要改變 API 的結構。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：讓其他應用程式直接查詢單體端點位址並直接連線，等於直接接上單體原本的 API，未來 API 結構一改，所有依賴它的應用程式都要同時跟著改，衝擊很大。", "zh": "使用 Service Directory 註冊單體系統的端點，讓依賴的應用程式可以查詢它的位址並直接連線。"}, {"letter": "B", "analysis": "正確：Apigee 是 API 管理/閘道平台，放在單體系統前面，其他應用程式只跟 Apigee 暴露出來、穩定不變的外觀 API 溝通，未來不管後端怎麼現代化、API 結構怎麼改，只要讓 Apigee 吸收這些變化，外部依賴的應用程式就完全不會感受到任何變化。", "zh": "用 Apigee 實作一個受管理的 API 外觀層（facade），代表單體的後端處理所有來自依賴應用程式的請求。"}, {"letter": "C", "analysis": "錯誤：跟 A 一樣讓其他應用程式直接連到單體的原生 API，只是多了一個穩定的 IP，但 API 結構本身的變化依然會直接衝擊所有依賴的應用程式，沒有真正的解耦。", "zh": "使用內部負載平衡器提供一個穩定的 IP，讓依賴的應用程式直接連線到單體的原生 API。"}, {"letter": "D", "analysis": "錯誤：讓其他應用程式直接綁死在資料庫的結構上，耦合程度比 API 層級更深，而且現代化成雲原生服務幾乎必然意味著換掉或大改這個資料庫，一旦資料庫結構改變，所有依賴 SQL VIEW 的應用程式會直接壞掉，完全背離衝擊最小的目標。", "zh": "透過在 Cloud SQL 上建立安全的 SQL VIEW，讓依賴的應用程式可以直接查詢資料庫來取得存取權。"}], "notes": [{"heading": "題目在問什麼", "body": "把地端的庫存管理單體系統遷移到 GCP，當前目標是快速撤出資料中心。這個單體系統對外提供 API 給其他業務關鍵應用程式用。長期願景是現代化成全球分散的雲原生服務。要設計初始架構，確保未來現代化對依賴庫存資料的其他應用程式造成的衝擊最小，未來現代化可能會改變 API 結構。"}, {"heading": "答案驗證：B", "body": "看到『單體要現代化，但要保護現有依賴者不受未來改動影響』，標準答案方向是在單體前面架一層穩定的 API 外觀/閘道（Apigee），把外部看到的介面和內部實際實作解耦——這跟 Q246 提過的『微服務化+事件驅動解耦』是同一種設計哲學的不同應用場景。信心高。"}, {"heading": "什麼是 SQL VIEW", "body": "是什麼：資料庫裡的一種虛擬查詢結果表，本身不儲存真正的資料，而是事先定義好一條 SQL 查詢，每次查詢這個 VIEW 時，資料庫會即時重新執行底層那條定義好的查詢，把結果當成一張表回傳。\n解決什麼問題：可以用來過濾/簡化給外部存取的資料範圍（例如隱藏敏感欄位），不用開放整張原始表。\n在這題的應用：選項 D 用安全的 SQL VIEW 讓其他應用程式查詢資料，仍然是直接存取資料庫，一旦未來資料庫結構改變，VIEW 可能失效或要重寫，其他應用程式一樣會被牽連，是這題最緊密耦合、最脆弱的做法。\n常見程度：資料庫層級常見的存取控制手法，但不適合用在『未來架構會大改』的情境。"}, {"heading": "服務介紹：Apigee", "body": "是什麼：Google 的 API 管理/閘道平台，可以放在後端服務（不管是單體還是微服務）前面，對外暴露一個穩定、受控的 API 介面，並能在這一層做請求轉換、流量控管、身分驗證、監控分析等。\n解決什麼問題：讓後端系統的實作細節（包括 API 結構本身）可以自由演進，不會直接衝擊外部依賴的客戶端，因為 Apigee 這一層可以吸收/轉換結構上的變化。\n在這題的應用：作為單體系統對外的穩定外觀層，未來現代化時把後端變化隔離在 Apigee 之後，外部依賴應用程式感受不到變化。\n常見程度：GCP 考試中『單體現代化/API 治理』情境的標準核心服務。"}]}}, {"id": "T1-Q213", "topic": 1, "qnum": 213, "question": "Your organization uses separate Google Cloud projects for shared services, development, testing, and production.• The shared services project hosts your private CI/CD runners and a central Artifact Registry• The development, testing, and production projects host the GKE clusters where applications are deployed.You need to design an architecture that allows the CI/CD runners to connect to the GKE clusters and the clusters to pull images from Artifact Registry, all using private IP addresses. However, direct network traffic between the development, testing, and production environments must be strictly prohibited. What should you do?", "options": [{"letter": "A", "text": "Create a separate VPC in each of the four projects. Connect each environment's VPC to the shared services VPC through VPC Network Peering."}, {"letter": "B", "text": "Expose the resources in the shared services project using an external load balancer. Implement a firewall rule to limit access."}, {"letter": "C", "text": "Create a separate VPC in each project. Use VPC Network Peering to create a full mesh, connecting every VPC directly to every other VPC."}, {"letter": "D", "text": "Configure the shared services project as a Shared VPC host. Create a single VPC in this host project and attach the environment projects as service projects."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381820-exam-professional-cloud-architect-topic-1-question-213/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["VPC/網路", "GKE/Kubernetes", "安全性"], "keywords": ["direct network traffic between the development, testing, and production environments must be strictly prohibited"], "explanation": {"questionZh": "你的組織為共用服務、開發、測試、正式環境分別使用獨立的 Google Cloud 專案：共用服務專案裡放了你的私有 CI/CD 執行器和一個中央 Artifact Registry；開發、測試、正式環境專案則各自跑著部署應用程式的 GKE 叢集。你需要設計一套架構，讓 CI/CD 執行器能連到 GKE 叢集，叢集也能從 Artifact Registry 拉取映像檔，全部都要用私有 IP 位址完成。但是，開發、測試、正式環境之間的直接網路流量必須被嚴格禁止。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：這是軸輻式（hub-and-spoke）架構，共用服務是中心，開發/測試/正式環境是輪輻，每個輪輻只跟中心 Peering，輪輻之間彼此沒有連線。VPC Network Peering 不具轉移性（non-transitive），A 跟 B Peering、B 跟 C Peering 不代表 A 能透過 B 連到 C，所以環境之間天生就連不通，完全符合環境間嚴格禁止直連的要求。", "zh": "在四個專案中各自建立一個獨立的 VPC。透過 VPC Network Peering，把每個環境的 VPC 連接到共用服務的 VPC。"}, {"letter": "B", "analysis": "錯誤：外部負載平衡器會把資源暴露在公開網際網路上，直接違反題目要求的全部用私有 IP。", "zh": "用外部負載平衡器公開共用服務專案裡的資源。實作一條防火牆規則來限制存取。"}, {"letter": "C", "analysis": "錯誤：全連通網狀（full mesh）讓每個 VPC 直接連到其他所有 VPC，開發、測試、正式環境的 VPC 彼此之間也都直接 Peering，等於直接違反環境間嚴格禁止直連的核心要求，是跟正確答案完全相反的做法。", "zh": "在每個專案中建立一個獨立的 VPC。使用 VPC Network Peering 建立一個全連通網狀，把每個 VPC 直接連到其他每一個 VPC。"}, {"letter": "D", "analysis": "錯誤：如果開發、測試、正式環境全部共用同一個 VPC 網路，預設情況下它們彼此之間其實是互通的（同一個網路內的資源本來就能互相連線），要做到環境間禁止直連還要額外疊加很多防火牆規則去人工切開，這題選項沒有描述加上這些額外隔離規則，相對正確答案來說是更脆弱、更容易出錯的設計。", "zh": "把共用服務專案設定為 Shared VPC 主機專案。在這個主機專案中建立一個單一的 VPC，並把各環境專案以服務專案的身分掛接上去。"}], "notes": [{"heading": "題目在問什麼", "body": "4 個獨立專案：共用服務（CI/CD 執行器+中央 Artifact Registry）、開發、測試、正式環境（各自跑 GKE 叢集）。需要讓 CI/CD 執行器連到 GKE 叢集、叢集能從 Artifact Registry 拉取映像檔，全部用私有 IP 完成。但開發、測試、正式環境彼此之間的直接網路流量必須被嚴格禁止。"}, {"heading": "答案驗證：A", "body": "看到『多個環境都要連到一個共用的中心，但環境之間彼此要完全隔離』，標準答案是軸輻式 VPC Peering（只跟中心連，不跟彼此連），利用 Peering 不具轉移性這個特性天生達成隔離；全連通網狀 Peering 跟 Shared VPC（單一網路）這兩種做法都會讓環境間預設互通，跟題目的隔離要求相反或需要額外補強。信心高。"}, {"heading": "什麼是 Artifact Registry", "body": "是什麼：GCP 用來集中存放、管理各種建置產出物的倉庫服務，最常見用途是存容器映像檔，也能存其他格式（Maven、npm 套件等）。\n解決什麼問題：CI/CD 管線建置完一個應用程式的容器映像檔後存進這個倉庫，之後任何地方（像 GKE 叢集）要跑這個應用程式時直接從這個倉庫把映像檔拉下來使用，不用每次都重新建置。\n在這題的應用：題目的共用服務專案裡放了一個中央 Artifact Registry，代表所有環境共用同一個映像檔倉庫，每個環境的 GKE 叢集都要能連到這個倉庫去拉取映像檔，這是為什麼共用服務的 VPC 要跟每個環境的 VPC 互通（Peering 架構裡『共用服務』這個中心節點本來就要跟每個輪輻都連通）。\n常見程度：GCP 考試中容器化/CI/CD 情境的核心基礎服務。"}, {"heading": "基礎知識：VPC Network Peering 的「不具轉移性」特性", "body": "VPC Network Peering 讓兩個不同的 VPC 網路直接互通，但這種連通性不會『轉移』——如果 A 跟 B 做了 Peering，B 又跟 C 做了 Peering，並不代表 A 可以透過 B 連到 C，A 和 C 之間必須自己直接建立 Peering 才能互通。\n解決什麼問題：這個特性剛好可以用來設計軸輻式架構，讓多個環境都能連到一個共用的中心，但環境之間天生彼此隔離，不需要額外加防火牆規則去阻擋。\n在這題的應用：共用服務（hub）分別跟開發、測試、正式環境（spoke）做 Peering，但開發跟正式環境之間沒有直接 Peering，所以天生連不通。\n常見程度：GCP 網路架構設計的核心基礎知識，是『
