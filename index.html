 they want to be able to update and roll back quickly. Mountkirk Games has the following requirements:✑ Services are deployed redundantly across multiple regions in the US and Europe✑ Only frontend services are exposed on the public internet✑ They can provide a single frontend IP for their fleet of services✑ Deployment artifacts are immutableWhich set of products should they use?", "options": [{"letter": "A", "text": "Google Cloud Storage, Google Cloud Dataflow, Google Compute Engine"}, {"letter": "B", "text": "Google Cloud Storage, Google App Engine, Google Network Load Balancer"}, {"letter": "C", "text": "Google Kubernetes Registry, Google Container Engine, Google HTTP(S) Load Balancer"}, {"letter": "D", "text": "Google Cloud Functions, Google Cloud Pub/Sub, Google Cloud Deployment Manager"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6549-exam-professional-cloud-architect-topic-5-question-3/", "postedDate": "2019-10-14", "postedYear": 2019, "tags": ["GKE/Kubernetes", "Load Balancing", "CI/CD", "多區域架構"]}, {"id": "T5-Q4", "topic": 5, "qnum": 4, "question": "Mountkirk Games' gaming servers are not automatically scaling properly. Last month, they rolled out a new feature, which suddenly became very popular. A record number of users are trying to use the service, but many of them are getting 503 errors and very slow response times. What should they investigate first?", "options": [{"letter": "A", "text": "Verify that the database is online"}, {"letter": "B", "text": "Verify that the project quota hasn't been exceeded"}, {"letter": "C", "text": "Verify that the new feature code did not introduce any performance bugs"}, {"letter": "D", "text": "Verify that the load-testing team is not running their tool against production"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9253-exam-professional-cloud-architect-topic-5-question-4/", "postedDate": "2019-11-28", "postedYear": 2019, "tags": ["自動擴縮", "監控與可觀測性"]}, {"id": "T5-Q5", "topic": 5, "qnum": 5, "question": "Mountkirk Games needs to create a repeatable and configurable mechanism for deploying isolated application environments. Developers and testers can access each other's environments and resources, but they cannot access staging or production resources. The staging environment needs access to some services from production.What should you do to isolate development environments from staging and production?", "options": [{"letter": "A", "text": "Create a project for development and test and another for staging and production"}, {"letter": "B", "text": "Create a network for development and test and another for staging and production"}, {"letter": "C", "text": "Create one subnetwork for development and another for staging and production"}, {"letter": "D", "text": "Create one project for development, a second for staging and a third for production"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9191-exam-professional-cloud-architect-topic-5-question-5/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["IAM", "Organization Policy"]}, {"id": "T5-Q6", "topic": 5, "qnum": 6, "question": "Mountkirk Games wants to set up a real-time analytics platform for their new game. The new platform must meet their technical requirements.Which combination of Google technologies will meet all of their requirements?", "options": [{"letter": "A", "text": "Kubernetes Engine, Cloud Pub/Sub, and Cloud SQL"}, {"letter": "B", "text": "Cloud Dataflow, Cloud Storage, Cloud Pub/Sub, and BigQuery"}, {"letter": "C", "text": "Cloud SQL, Cloud Storage, Cloud Pub/Sub, and Cloud Dataflow"}, {"letter": "D", "text": "Cloud Dataproc, Cloud Pub/Sub, Cloud SQL, and Cloud Dataflow"}, {"letter": "E", "text": "Cloud Pub/Sub, Compute Engine, Cloud Storage, and Cloud Dataproc"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11831-exam-professional-cloud-architect-topic-5-question-6/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["Dataflow/Dataproc", "Pub/Sub", "BigQuery", "Cloud Storage"]}, {"id": "T6-Q1", "topic": 6, "qnum": 1, "question": "Mountkirk Games wants to migrate from their current analytics and statistics reporting model to one that meets their technical requirements on Google Cloud Platform.Which two steps should be part of their migration plan? (Choose two.)", "options": [{"letter": "A", "text": "Evaluate the impact of migrating their current batch ETL code to Cloud Dataflow."}, {"letter": "B", "text": "Write a schema migration plan to denormalize data for better performance in BigQuery."}, {"letter": "C", "text": "Draw an architecture diagram that shows how to move from a single MySQL database to a MySQL cluster."}, {"letter": "D", "text": "Load 10 TB of analytics data from a previous game into a Cloud SQL instance, and run test queries against the full dataset to confirm that they complete successfully."}, {"letter": "E", "text": "Integrate Cloud Armor to defend against possible SQL injection attacks in analytics files uploaded to Cloud Storage."}], "answer": "AB", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/11888-exam-professional-cloud-architect-topic-6-question-1/", "postedDate": "2020-01-13", "postedYear": 2020, "tags": ["Dataflow/Dataproc", "BigQuery", "資料遷移", "案例研究題"]}, {"id": "T6-Q2", "topic": 6, "qnum": 2, "question": "You need to analyze and define the technical architecture for the compute workloads for your company, Mountkirk Games. Considering the Mountkirk Games business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Create network load balancers. Use preemptible Compute Engine instances."}, {"letter": "B", "text": "Create network load balancers. Use non-preemptible Compute Engine instances."}, {"letter": "C", "text": "Create a global load balancer with managed instance groups and autoscaling policies. Use preemptible Compute Engine instances."}, {"letter": "D", "text": "Create a global load balancer with managed instance groups and autoscaling policies. Use non-preemptible Compute Engine instances."}], "answer": "D", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/8500-exam-professional-cloud-architect-topic-6-question-2/", "postedDate": "2019-11-18", "postedYear": 2019, "tags": ["Load Balancing", "自動擴縮", "Compute Engine", "案例研究題"]}, {"id": "T6-Q3", "topic": 6, "qnum": 3, "question": "Mountkirk Games wants to design their solution for the future in order to take advantage of cloud and technology improvements as they become available. Which two steps should they take? (Choose two.)", "options": [{"letter": "A", "text": "Store as much analytics and game activity data as financially feasible today so it can be used to train machine learning models to predict user behavior in the future."}, {"letter": "B", "text": "Begin packaging their game backend artifacts in container images and running them on Google Kubernetes Engine to improve the ability to scale up or down based on game activity."}, {"letter": "C", "text": "Set up a CI/CD pipeline using Jenkins and Spinnaker to automate canary deployments and improve development velocity."}, {"letter": "D", "text": "Adopt a schema versioning tool to reduce downtime when adding new game features that require storing additional player data in the database."}, {"letter": "E", "text": "Implement a weekly rolling maintenance process for the Linux virtual machines so they can apply critical kernel patches and package updates and reduce the risk of 0-day vulnerabilities."}], "answer": "AB", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/8501-exam-professional-cloud-architect-topic-6-question-3/", "postedDate": "2019-11-18", "postedYear": 2019, "tags": ["GKE/Kubernetes", "容器化", "CI/CD", "案例研究題"]}, {"id": "T6-Q4", "topic": 6, "qnum": 4, "question": "Mountkirk Games wants you to design a way to test the analytics platform's resilience to changes in mobile network latency. What should you do?", "options": [{"letter": "A", "text": "Deploy failure injection software to the game analytics platform that can inject additional latency to mobile client analytics traffic."}, {"letter": "B", "text": "Build a test client that can be run from a mobile phone emulator on a Compute Engine virtual machine, and run multiple copies in Google Cloud Platform regions all over the world to generate realistic traffic."}, {"letter": "C", "text": "Add the ability to introduce a random amount of delay before beginning to process analytics files uploaded from mobile devices."}, {"letter": "D", "text": "Create an opt-in beta of the game that runs on players' mobile devices and collects response times from analytics endpoints running in Google Cloud Platform regions all over the world."}], "answer": "A", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/12204-exam-professional-cloud-architect-topic-6-question-4/", "postedDate": "2020-01-17", "postedYear": 2020, "tags": ["高可用性/災難復原", "多區域架構", "案例研究題"]}, {"id": "T6-Q5", "topic": 6, "qnum": 5, "question": "You need to analyze and define the technical architecture for the database workloads for your company, Mountkirk Games. Considering the business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Use Cloud SQL for time series data, and use Cloud Bigtable for historical data queries."}, {"letter": "B", "text": "Use Cloud SQL to replace MySQL, and use Cloud Spanner for historical data queries."}, {"letter": "C", "text": "Use Cloud Bigtable to replace MySQL, and use BigQuery for historical data queries."}, {"letter": "D", "text": "Use Cloud Bigtable for time series data, use Cloud Spanner for transactional data, and use BigQuery for historical data queries."}], "answer": "D", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/7236-exam-professional-cloud-architect-topic-6-question-5/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Bigtable", "Cloud Spanner", "BigQuery", "資料庫Schema設計", "案例研究題"]}, {"id": "T6-Q6", "topic": 6, "qnum": 6, "question": "Which managed storage option meets Mountkirk's technical requirement for storing game activity in a time series database service?", "options": [{"letter": "A", "text": "Cloud Bigtable"}, {"letter": "B", "text": "Cloud Spanner"}, {"letter": "C", "text": "BigQuery"}, {"letter": "D", "text": "Cloud Datastore"}], "answer": "A", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/7237-exam-professional-cloud-architect-topic-6-question-6/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Bigtable", "資料庫Schema設計", "案例研究題"]}, {"id": "T6-Q7", "topic": 6, "qnum": 7, "question": "You are in charge of the new Game Backend Platform architecture. The game communicates with the backend over a REST API.You want to follow Google-recommended practices. How should you design the backend?", "options": [{"letter": "A", "text": "Create an instance template for the backend. For every region, deploy it on a multi-zone managed instance group. Use an L4 load balancer."}, {"letter": "B", "text": "Create an instance template for the backend. For every region, deploy it on a single-zone managed instance group. Use an L4 load balancer."}, {"letter": "C", "text": "Create an instance template for the backend. For every region, deploy it on a multi-zone managed instance group. Use an L7 load balancer."}, {"letter": "D", "text": "Create an instance template for the backend. For every region, deploy it on a single-zone managed instance group. Use an L7 load balancer."}], "answer": "C", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/7238-exam-professional-cloud-architect-topic-6-question-7/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Load Balancing", "Compute Engine", "高可用性/災難復原", "案例研究題"]}, {"id": "T7-Q1", "topic": 7, "qnum": 1, "question": "You need to optimize batch file transfers into Cloud Storage for Mountkirk Games' new Google Cloud solution. The batch files contain game statistics that need to be staged in Cloud Storage and be processed by an extract transform load (ETL) tool. What should you do?", "options": [{"letter": "A", "text": "Use gsutil to batch move files in sequence."}, {"letter": "B", "text": "Use gsutil to batch copy the files in parallel."}, {"letter": "C", "text": "Use gsutil to extract the files as the first part of ETL."}, {"letter": "D", "text": "Use gsutil to load the files as the last part of ETL."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56977-exam-professional-cloud-architect-topic-7-question-1/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Cloud Storage", "效能調校"]}, {"id": "T7-Q2", "topic": 7, "qnum": 2, "question": "You are implementing Firestore for Mountkirk Games. Mountkirk Games wants to give a new game programmatic access to a legacy game's Firestore database.Access should be as restricted as possible. What should you do?", "options": [{"letter": "A", "text": "Create a service account (SA) in the legacy game's Google Cloud project, add a second SA in the new game's IAM page, and then give the Organization Admin role to both SAs."}, {"letter": "B", "text": "Create a service account (SA) in the legacy game's Google Cloud project, give the SA the Organization Admin role, and then give it the Firebase Admin role in both projects."}, {"letter": "C", "text": "Create a service account (SA) in the legacy game's Google Cloud project, add this SA in the new game's IAM page, and then give it the Firebase Admin role in both projects."}, {"letter": "D", "text": "Create a service account (SA) in the legacy game's Google Cloud project, give it the Firebase Admin role, and then migrate the new game to the legacy game's project."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56978-exam-professional-cloud-architect-topic-7-question-2/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Datastore/Firestore", "IAM", "安全性"]}, {"id": "T7-Q3", "topic": 7, "qnum": 3, "question": "Mountkirk Games wants to limit the physical location of resources to their operating Google Cloud regions. What should you do?", "options": [{"letter": "A", "text": "Configure an organizational policy which constrains where resources can be deployed."}, {"letter": "B", "text": "Configure IAM conditions to limit what resources can be configured."}, {"letter": "C", "text": "Configure the quotas for resources in the regions not being used to 0."}, {"letter": "D", "text": "Configure a custom alert in Cloud Monitoring so you can disable resources as they are created in other regions."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56732-exam-professional-cloud-architect-topic-7-question-3/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Organization Policy", "合規性"]}, {"id": "T7-Q4", "topic": 7, "qnum": 4, "question": "You need to implement a network ingress for a new game that meets the defined business and technical requirements. Mountkirk Games wants each regional game instance to be located in multiple Google Cloud regions. What should you do?", "options": [{"letter": "A", "text": "Configure a global load balancer connected to a managed instance group running Compute Engine instances."}, {"letter": "B", "text": "Configure kubemci with a global load balancer and Google Kubernetes Engine."}, {"letter": "C", "text": "Configure a global load balancer with Google Kubernetes Engine."}, {"letter": "D", "text": "Configure Ingress for Anthos with a global load balancer and Google Kubernetes Engine."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56734-exam-professional-cloud-architect-topic-7-question-4/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Load Balancing", "多區域架構"]}, {"id": "T7-Q5", "topic": 7, "qnum": 5, "question": "Your development teams release new versions of games running on Google Kubernetes Engine (GKE) daily. You want to create service level indicators (SLIs) to evaluate the quality of the new versions from the user's perspective. What should you do?", "options": [{"letter": "A", "text": "Create CPU Utilization and Request Latency as service level indicators."}, {"letter": "B", "text": "Create GKE CPU Utilization and Memory Utilization as service level indicators."}, {"letter": "C", "text": "Create Request Latency and Error Rate as service level indicators."}, {"letter": "D", "text": "Create Server Uptime and Error Rate as service level indicators."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56735-exam-professional-cloud-architect-topic-7-question-5/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "監控與可觀測性"]}, {"id": "T7-Q6", "topic": 7, "qnum": 6, "question": "Mountkirk Games wants you to secure the connectivity from the new gaming application platform to Google Cloud. You want to streamline the process and followGoogle-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Configure Workload Identity and service accounts to be used by the application platform."}, {"letter": "B", "text": "Use Kubernetes Secrets, which are obfuscated by default. Configure these Secrets to be used by the application platform."}, {"letter": "C", "text": "Configure Kubernetes Secrets to store the secret, enable Application-Layer Secrets Encryption, and use Cloud Key Management Service (Cloud KMS) to manage the encryption keys. Configure these Secrets to be used by the application platform."}, {"letter": "D", "text": "Configure HashiCorp Vault on Compute Engine, and use customer managed encryption keys and Cloud Key Management Service (Cloud KMS) to manage the encryption keys. Configure these Secrets to be used by the application platform."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56645-exam-professional-cloud-architect-topic-7-question-6/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["IAM", "安全性", "GKE/Kubernetes"]}, {"id": "T7-Q7", "topic": 7, "qnum": 7, "question": "Your development team has created a mobile game app. You want to test the new mobile app on Android and iOS devices with a variety of configurations. You need to ensure that testing is efficient and cost-effective. What should you do?", "options": [{"letter": "A", "text": "Upload your mobile app to the Firebase Test Lab, and test the mobile app on Android and iOS devices."}, {"letter": "B", "text": "Create Android and iOS VMs on Google Cloud, install the mobile app on the VMs, and test the mobile app."}, {"letter": "C", "text": "Create Android and iOS containers on Google Kubernetes Engine (GKE), install the mobile app on the containers, and test the mobile app."}, {"letter": "D", "text": "Upload your mobile app with different configurations to Firebase Hosting and test each configuration."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56798-exam-professional-cloud-architect-topic-7-question-7/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["CI/CD", "成本優化"]}, {"id": "T8-Q2", "topic": 8, "qnum": 2, "question": "The TerramEarth development team wants to create an API to meet the company's business requirements. You want the development team to focus their development effort on business value versus creating a custom framework.Which method should they use?", "options": [{"letter": "A", "text": "Use Google App Engine with Google Cloud Endpoints. Focus on an API for dealers and partners"}, {"letter": "B", "text": "Use Google App Engine with a JAX-RS Jersey Java-based framework. Focus on an API for the public"}, {"letter": "C", "text": "Use Google App Engine with the Swagger (Open API Specification) framework. Focus on an API for the public"}, {"letter": "D", "text": "Use Google Container Engine with a Django Python container. Focus on an API for the public"}, {"letter": "E", "text": "Use Google Container Engine with a Tomcat container with the Swagger (Open API Specification) framework. Focus on an API for dealers and partners"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11085-exam-professional-cloud-architect-topic-8-question-2/", "postedDate": "2019-12-30", "postedYear": 2019, "tags": ["App Engine", "Apigee"]}, {"id": "T8-Q3", "topic": 8, "qnum": 3, "question": "Your development team has created a structured API to retrieve vehicle data. They want to allow third parties to develop tools for dealerships that use this vehicle event data. You want to support delegated authorization against this data.What should you do?", "options": [{"letter": "A", "text": "Build or leverage an OAuth-compatible access control system"}, {"letter": "B", "text": "Build SAML 2.0 SSO compatibility into your authentication system"}, {"letter": "C", "text": "Restrict data access based on the source IP address of the partner systems"}, {"letter": "D", "text": "Create secondary credentials for each dealer that can be given to the trusted third party"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9449-exam-professional-cloud-architect-topic-8-question-3/", "postedDate": "2019-11-30", "postedYear": 2019, "tags": ["安全性", "IAM"]}, {"id": "T8-Q4", "topic": 8, "qnum": 4, "question": "TerramEarth plans to connect all 20 million vehicles in the field to the cloud. This increases the volume to 20 million 600 byte records a second for 40 TB an hour.How should you design the data ingestion?", "options": [{"letter": "A", "text": "Vehicles write data directly to GCS"}, {"letter": "B", "text": "Vehicles write data directly to Google Cloud Pub/Sub"}, {"letter": "C", "text": "Vehicles stream data directly to Google BigQuery"}, {"letter": "D", "text": "Vehicles continue to write data using the existing system (FTP)"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6657-exam-professional-cloud-architect-topic-8-question-4/", "postedDate": "2019-10-16", "postedYear": 2019, "tags": ["Pub/Sub", "效能調校"]}, {"id": "T8-Q5", "topic": 8, "qnum": 5, "question": "You analyzed TerramEarth's business requirement to reduce downtime, and found that they can achieve a majority of time saving by reducing customer's wait time for parts. You decided to focus on reduction of the 3 weeks aggregate reporting time.Which modifications to the company's processes should you recommend?", "options": [{"letter": "A", "text": "Migrate from CSV to binary format, migrate from FTP to SFTP transport, and develop machine learning analysis of metrics"}, {"letter": "B", "text": "Migrate from FTP to streaming transport, migrate from CSV to binary format, and develop machine learning analysis of metrics"}, {"letter": "C", "text": "Increase fleet cellular connectivity to 80%, migrate from FTP to streaming transport, and develop machine learning analysis of metrics"}, {"letter": "D", "text": "Migrate from FTP to SFTP transport, develop machine learning analysis of metrics, and increase dealer local inventory by a fixed factor"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8687-exam-professional-cloud-architect-topic-8-question-5/", "postedDate": "2019-11-20", "postedYear": 2019, "tags": ["Dataflow/Dataproc", "效能調校"]}, {"id": "T8-Q6", "topic": 8, "qnum": 6, "question": "Which of TerramEarth's legacy enterprise processes will experience significant change as a result of increased Google Cloud Platform adoption?", "options": [{"letter": "A", "text": "Opex/capex allocation, LAN changes, capacity planning"}, {"letter": "B", "text": "Capacity planning, TCO calculations, opex/capex allocation"}, {"letter": "C", "text": "Capacity planning, utilization measurement, data center expansion"}, {"letter": "D", "text": "Data Center expansion, TCO calculations, utilization measurement"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/12205-exam-professional-cloud-architect-topic-8-question-6/", "postedDate": "2020-01-17", "postedYear": 2020, "tags": ["成本優化"]}, {"id": "T8-Q7", "topic": 8, "qnum": 7, "question": "To speed up data retrieval, more vehicles will be upgraded to cellular connections and be able to transmit data to the ETL process. The current FTP process is error-prone and restarts the data transfer from the start of the file when connections fail, which happens often. You want to improve the reliability of the solution and minimize data transfer time on the cellular connections.What should you do?", "options": [{"letter": "A", "text": "Use one Google Container Engine cluster of FTP servers. Save the data to a Multi-Regional bucket. Run the ETL process using data in the bucket"}, {"letter": "B", "text": "Use multiple Google Container Engine clusters running FTP servers located in different regions. Save the data to Multi-Regional buckets in US, EU, and Asia. Run the ETL process using the data in the bucket"}, {"letter": "C", "text": "Directly transfer the files to different Google Cloud Multi-Regional Storage bucket locations in US, EU, and Asia using Google APIs over HTTP(S). Run the ETL process using the data in the bucket"}, {"letter": "D", "text": "Directly transfer the files to a different Google Cloud Regional Storage bucket location in US, EU, and Asia using Google APIs over HTTP(S). Run the ETL process to retrieve the data from each Regional bucket"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6485-exam-professional-cloud-architect-topic-8-question-7/", "postedDate": "2019-10-12", "postedYear": 2019, "tags": ["Cloud Storage", "效能調校", "高可用性/災難復原"]}, {"id": "T8-Q8", "topic": 8, "qnum": 8, "question": "TerramEarth's 20 million vehicles are scattered around the world. Based on the vehicle's location, its telemetry data is stored in a Google Cloud Storage (GCS) regional bucket (US, Europe, or Asia). The CTO has asked you to run a report on the raw telemetry data to determine why vehicles are breaking down after 100 K miles. You want to run this job on all the data.What is the most cost-effective way to run this job?", "options": [{"letter": "A", "text": "Move all the data into 1 zone, then launch a Cloud Dataproc cluster to run the job"}, {"letter": "B", "text": "Move all the data into 1 region, then launch a Google Cloud Dataproc cluster to run the job"}, {"letter": "C", "text": "Launch a cluster in each region to preprocess and compress the raw data, then move the data into a multi-region bucket and use a Dataproc cluster to finish the job"}, {"letter": "D", "text": "Launch a cluster in each region to preprocess and compress the raw data, then move the data into a region bucket and use a Cloud Dataproc cluster to finish the job"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8248-exam-professional-cloud-architect-topic-8-question-8/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Dataflow/Dataproc", "Cloud Storage", "成本優化", "多區域架構"]}, {"id": "T8-Q9", "topic": 8, "qnum": 9, "question": "TerramEarth has equipped all connected trucks with servers and sensors to collect telemetry data. Next year they want to use the data to train machine learning models. They want to store this data in the cloud while reducing costs.What should they do?", "options": [{"letter": "A", "text": "Have the vehicle's computer compress the data in hourly snapshots, and store it in a Google Cloud Storage (GCS) Nearline bucket"}, {"letter": "B", "text": "Push the telemetry data in real-time to a streaming dataflow job that compresses the data, and store it in Google BigQuery"}, {"letter": "C", "text": "Push the telemetry data in real-time to a streaming dataflow job that compresses the data, and store it in Cloud Bigtable"}, {"letter": "D", "text": "Have the vehicle's computer compress the data in hourly snapshots, and store it in a GCS Coldline bucket"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8249-exam-professional-cloud-architect-topic-8-question-9/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Cloud Storage", "成本優化"]}, {"id": "T8-Q10", "topic": 8, "qnum": 10, "question": "Your agricultural division is experimenting with fully autonomous vehicles. You want your architecture to promote strong security during vehicle operation.Which two architectures should you consider? (Choose two.)", "options": [{"letter": "A", "text": "Treat every micro service call between modules on the vehicle as untrusted."}, {"letter": "B", "text": "Require IPv6 for connectivity to ensure a secure address space."}, {"letter": "C", "text": "Use a trusted platform module (TPM) and verify firmware and binaries on boot."}, {"letter": "D", "text": "Use a functional programming language to isolate code execution cycles."}, {"letter": "E", "text": "Use multiple connectivity subsystems for redundancy."}, {"letter": "F", "text": "Enclose the vehicle's drive electronics in a Faraday cage to isolate chips."}], "answer": "AC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/12751-exam-professional-cloud-architect-topic-8-question-10/", "postedDate": "2020-01-26", "postedYear": 2020, "tags": ["安全性", "Confidential Computing"]}, {"id": "T8-Q11", "topic": 8, "qnum": 11, "question": "Operational parameters such as oil pressure are adjustable on each of TerramEarth's vehicles to increase their efficiency, depending on their environmental conditions. Your primary goal is to increase the operating efficiency of all 20 million cellular and unconnected vehicles in the field.How can you accomplish this goal?", "options": [{"letter": "A", "text": "Have you engineers inspect the data for patterns, and then create an algorithm with rules that make operational adjustments automatically"}, {"letter": "B", "text": "Capture all operating data, train machine learning models that identify ideal operations, and run locally to make operational adjustments automatically"}, {"letter": "C", "text": "Implement a Google Cloud Dataflow streaming job with a sliding window, and use Google Cloud Messaging (GCM) to make operational adjustments automatically"}, {"letter": "D", "text": "Capture all operating data, train machine learning models that identify ideal operations, and host in Google Cloud Machine Learning (ML) Platform to make operational adjustments automatically"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8250-exam-professional-cloud-architect-topic-8-question-11/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Vertex AI/AI-ML"]}, {"id": "T9-Q1", "topic": 9, "qnum": 1, "question": "To be compliant with European GDPR regulation, TerramEarth is required to delete data generated from itsEuropean customers after a period of 36 months when it contains personal data. In the new architecture, this data will be stored in both Cloud Storage andBigQuery. What should you do?", "options": [{"letter": "A", "text": "Create a BigQuery table for the European data, and set the table retention period to 36 months. For Cloud Storage, use gsutil to enable lifecycle management using a DELETE action with an Age condition of 36 months."}, {"letter": "B", "text": "Create a BigQuery table for the European data, and set the table retention period to 36 months. For Cloud Storage, use gsutil to create a SetStorageClass to NONE action when with an Age condition of 36 months."}, {"letter": "C", "text": "Create a BigQuery time-partitioned table for the European data, and set the partition expiration period to 36 months. For Cloud Storage, use gsutil to enable lifecycle management using a DELETE action with an Age condition of 36 months."}, {"letter": "D", "text": "Create a BigQuery time-partitioned table for the European data, and set the partition expiration period to 36 months. For Cloud Storage, use gsutil to create a SetStorageClass to NONE action with an Age condition of 36 months."}], "answer": "C", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/6489-exam-professional-cloud-architect-topic-9-question-1/", "postedDate": "2019-10-12", "postedYear": 2019, "tags": ["BigQuery", "Cloud Storage", "合規性", "案例研究題"]}, {"id": "T9-Q2", "topic": 9, "qnum": 2, "question": "TerramEarth has decided to store data files in Cloud Storage. You need to configure Cloud Storage lifecycle rule to store 1 year of data and minimize file storage cost.Which two actions should you take?", "options": [{"letter": "A", "text": "Create a Cloud Storage lifecycle rule with Age: ג€30ג€, Storage Class: ג€Standardג€, and Action: ג€Set to Coldlineג€, and create a second GCS life-cycle rule with Age: ג€365ג€, Storage Class: ג€Coldlineג€, and Action: ג€Deleteג€."}, {"letter": "B", "text": "Create a Cloud Storage lifecycle rule with Age: ג€30ג€, Storage Class: ג€Coldlineג€, and Action: ג€Set to Nearlineג€, and create a second GCS life-cycle rule with Age: ג€91ג€, Storage Class: ג€Coldlineג€, and Action: ג€Set to Nearlineג€."}, {"letter": "C", "text": "Create a Cloud Storage lifecycle rule with Age: ג€90ג€, Storage Class: ג€Standardג€, and Action: ג€Set to Nearlineג€, and create a second GCS life-cycle rule with Age: ג€91ג€, Storage Class: ג€Nearlineג€, and Action: ג€Set to Coldlineג€."}, {"letter": "D", "text": "Create a Cloud Storage lifecycle rule with Age: ג€30ג€, Storage Class: ג€Standardג€, and Action: ג€Set to Coldlineג€, and create a second GCS life-cycle rule with Age: ג€365ג€, Storage Class: ג€Nearlineג€, and Action: ג€Deleteג€."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/57128-exam-professional-cloud-architect-topic-9-question-2/", "postedDate": "2021-07-05", "postedYear": 2021, "tags": ["Cloud Storage", "成本優化", "案例研究題"]}, {"id": "T9-Q3", "topic": 9, "qnum": 3, "question": "You need to implement a reliable, scalable GCP solution for the data warehouse for your company,TerramEarth.Considering the TerramEarth business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Replace the existing data warehouse with BigQuery. Use table partitioning."}, {"letter": "B", "text": "Replace the existing data warehouse with a Compute Engine instance with 96 CPUs."}, {"letter": "C", "text": "Replace the existing data warehouse with BigQuery. Use federated data sources."}, {"letter": "D", "text": "Replace the existing data warehouse with a Compute Engine instance with 96 CPUs. Add an additional Compute Engine preemptible instance with 32 CPUs."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/7260-exam-professional-cloud-architect-topic-9-question-3/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["BigQuery", "資料庫Schema設計", "案例研究題"]}, {"id": "T9-Q4", "topic": 9, "qnum": 4, "question": "A new architecture that writes all incoming data to BigQuery has been introduced. You notice that the data is dirty, and want to ensure data quality on an automated daily basis while managing cost.What should you do?", "options": [{"letter": "A", "text": "Set up a streaming Cloud Dataflow job, receiving data by the ingestion process. Clean the data in a Cloud Dataflow pipeline."}, {"letter": "B", "text": "Create a Cloud Function that reads data from BigQuery and cleans it. Trigger the Cloud Function from a Compute Engine instance."}, {"letter": "C", "text": "Create a SQL statement on the data in BigQuery, and save it as a view. Run the view daily, and save the result to a new table."}, {"letter": "D", "text": "Use Cloud Dataprep and configure the BigQuery tables as the source. Schedule a daily job to clean the data."}], "answer": "D", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/13467-exam-professional-cloud-architect-topic-9-question-4/", "postedDate": "2020-02-05", "postedYear": 2020, "tags": ["Dataflow/Dataproc", "BigQuery", "成本優化", "案例研究題"]}, {"id": "T9-Q5", "topic": 9, "qnum": 5, "question": "Considering the technical requirements, how should you reduce the unplanned vehicle downtime in GCP?", "options": [{"letter": "A", "text": "Use BigQuery as the data warehouse. Connect all vehicles to the network and stream data into BigQuery using Cloud Pub/Sub and Cloud Dataflow. Use Google Data Studio for analysis and reporting."}, {"letter": "B", "text": "Use BigQuery as the data warehouse. Connect all vehicles to the network and upload gzip files to a Multi-Regional Cloud Storage bucket using gcloud. Use Google Data Studio for analysis and reporting."}, {"letter": "C", "text": "Use Cloud Dataproc Hive as the data warehouse. Upload gzip files to a Multi-Regional Cloud Storage bucket. Upload this data into BigQuery using gcloud. Use Google Data Studio for analysis and reporting."}, {"letter": "D", "text": "Use Cloud Dataproc Hive as the data warehouse. Directly stream data into partitioned Hive tables. Use Pig scripts to analyze data."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/14729-exam-professional-cloud-architect-topic-9-question-5/", "postedDate": "2020-02-23", "postedYear": 2020, "tags": ["BigQuery", "Pub/Sub", "Dataflow/Dataproc", "案例研究題"]}, {"id": "T9-Q6", "topic": 9, "qnum": 6, "question": "You are asked to design a new architecture for the ingestion of the data of the 200,000 vehicles that are connected to a cellular network. You want to follow Google-recommended practices.Considering the technical requirements, which components should you use for the ingestion of the data?", "options": [{"letter": "A", "text": "Google Kubernetes Engine with an SSL Ingress"}, {"letter": "B", "text": "Cloud IoT Core with public/private key pairs"}, {"letter": "C", "text": "Compute Engine with project-wide SSH keys"}, {"letter": "D", "text": "Compute Engine with specific SSH keys"}], "answer": "B", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/6785-exam-professional-cloud-architect-topic-9-question-6/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["安全性", "案例研究題"]}, {"id": "T10-Q1", "topic": 10, "qnum": 1, "question": "You start to build a new application that uses a few Cloud Functions for the backend. One use case requires a Cloud Function func_display to invoke another Cloud Function func_query. You want func_query only to accept invocations from func_display. You also want to follow Google's recommended best practices. What should you do?", "options": [{"letter": "A", "text": "Create a token and pass it in as an environment variable to func_display. When invoking func_query, include the token in the request. Pass the same token to func_query and reject the invocation if the tokens are different."}, {"letter": "B", "text": "Make func_query 'Require authentication.' Create a unique service account and associate it to func_display. Grant the service account invoker role for func_query. Create an id token in func_display and include the token to the request when invoking func_query."}, {"letter": "C", "text": "Make func_query 'Require authentication' and only accept internal traffic. Create those two functions in the same VPC. Create an ingress firewall rule for func_query to only allow traffic from func_display."}, {"letter": "D", "text": "Create those two functions in the same project and VPC. Make func_query only accept internal traffic. Create an ingress firewall for func_query to only allow traffic from func_display. Also, make sure both functions use the same service account."}], "answer": "B", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60524-exam-professional-cloud-architect-topic-10-question-1/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "IAM", "安全性", "案例研究題"]}, {"id": "T10-Q2", "topic": 10, "qnum": 2, "question": "You have broken down a legacy monolithic application into a few containerized RESTful microservices.You want to run those microservices on Cloud Run. You also want to make sure the services are highly available with low latency to your customers. What should you do?", "options": [{"letter": "A", "text": "Deploy Cloud Run services to multiple availability zones. Create Cloud Endpoints that point to the services. Create a global HTTP(S) Load Balancing instance and attach the Cloud Endpoints to its backend."}, {"letter": "B", "text": "Deploy Cloud Run services to multiple regions. Create serverless network endpoint groups pointing to the services. Add the serverless NEGs to a backend service that is used by a global HTTP(S) Load Balancing instance."}, {"letter": "C", "text": "Deploy Cloud Run services to multiple regions. In Cloud DNS, create a latency-based DNS name that points to the services."}, {"letter": "D", "text": "Deploy Cloud Run services to multiple availability zones. Create a TCP/IP global load balancer. Add the Cloud Run Endpoints to its backend service."}], "answer": "B", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60525-exam-professional-cloud-architect-topic-10-question-2/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "Load Balancing", "高可用性/災難復原", "多區域架構", "案例研究題"]}, {"id": "T10-Q3", "topic": 10, "qnum": 3, "question": "You are migrating a Linux-based application from your private data center to Google Cloud. TheTerramEarth security team sent you several recent Linux vulnerabilities published by Common Vulnerabilities and Exposures (CVE). You need assistance in understanding how these vulnerabilities could impact your migration. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Open a support case regarding the CVE and chat with the support engineer."}, {"letter": "B", "text": "Read the CVEs from the Google Cloud Status Dashboard to understand the impact."}, {"letter": "C", "text": "Read the CVEs from the Google Cloud Platform Security Bulletins to understand the impact."}, {"letter": "D", "text": "Post a question regarding the CVE in Stack Overflow to get an explanation."}, {"letter": "E", "text": "Post a question regarding the CVE in a Google Cloud discussion group to get an explanation."}], "answer": "AC", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60557-exam-professional-cloud-architect-topic-10-question-3/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["安全性", "案例研究題"]}, {"id": "T10-Q4", "topic": 10, "qnum": 4, "question": "TerramEarth has a legacy web application that you cannot migrate to cloud. However, you still want to build a cloud-native way to monitor the application. If the application goes down, you want the URL to point to a &quot;Site is unavailable&quot; page as soon as possible. You also want your Ops team to receive a notification for the issue. You need to build a reliable solution for minimum cost. What should you do?", "options": [{"letter": "A", "text": "Create a scheduled job in Cloud Run to invoke a container every minute. The container will check the application URL. If the application is down, switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}, {"letter": "B", "text": "Create a cron job on a Compute Engine VM that runs every minute. The cron job invokes a Python program to check the application URL. If the application is down, switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}, {"letter": "C", "text": "Create a Cloud Monitoring uptime check to validate the application URL. If it fails, put a message in a Pub/Sub queue that triggers a Cloud Function to switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}, {"letter": "D", "text": "Use Cloud Error Reporting to check the application URL. If the application is down, switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}], "answer": "C", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60562-exam-professional-cloud-architect-topic-10-question-4/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "Cloud Run/Cloud Functions", "監控與可觀測性", "案例研究題"]}, {"id": "T10-Q5", "topic": 10, "qnum": 5, "question": "You are building a microservice-based application for TerramEarth. The application is based on Docker containers. You want to follow Google-recommended practices to build the application continuously and store the build artifacts. What should you do?", "options": [{"letter": "A", "text": "Configure a trigger in Cloud Build for new source changes. Invoke Cloud Build to build container images for each microservice, and tag them using the code commit hash. Push the images to the Container Registry."}, {"letter": "B", "text": "Configure a trigger in Cloud Build for new source changes. The trigger invokes build jobs and build container images for the microservices. Tag the images with a version number, and push them to Cloud Storage."}, {"letter": "C", "text": "Create a Scheduler job to check the repo every minute. For any new change, invoke Cloud Build to build container images for the microservices. Tag the images using the current timestamp, and push them to the Container Registry."}, {"letter": "D", "text": "Configure a trigger in Cloud Build for new source changes. Invoke Cloud Build to build one container image, and tag the image with the label 'latest.' Push the image to the Container Registry."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60563-exam-professional-cloud-architect-topic-10-question-5/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["CI/CD", "容器化", "案例研究題"]}, {"id": "T10-Q6", "topic": 10, "qnum": 6, "question": "TerramEarth has about 1 petabyte (PB) of vehicle testing data in a private data center. You want to move the data to Cloud Storage for your machine learning team. Currently, a 1-Gbps interconnect link is available for you. The machine learning team wants to start using the data in a month. What should you do?", "options": [{"letter": "A", "text": "Request Transfer Appliances from Google Cloud, export the data to appliances, and return the appliances to Google Cloud."}, {"letter": "B", "text": "Configure the Storage Transfer service from Google Cloud to send the data from your data center to Cloud Storage."}, {"letter": "C", "text": "Make sure there are no other users consuming the 1Gbps link, and use multi-thread transfer to upload the data to Cloud Storage."}, {"letter": "D", "text": "Export files to an encrypted USB device, send the device to Google Cloud, and request an import of the data to Cloud Storage."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60483-exam-professional-cloud-architect-topic-10-question-6/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移", "案例研究題"]}, {"id": "T11-Q1", "topic": 11, "qnum": 1, "question": "The Dress4Win security team has disabled external SSH access into production virtual machines (VMs) on Google Cloud Platform (GCP).The operations team needs to remotely manage the VMs, build and push Docker containers, and manage Google Cloud Storage objects.What can they do?", "options": [{"letter": "A", "text": "Grant the operations engineer access to use Google Cloud Shell."}, {"letter": "B", "text": "Configure a VPN connection to GCP to allow SSH access to the cloud VMs."}, {"letter": "C", "text": "Develop a new access request process that grants temporary SSH access to cloud VMs when an operations engineer needs to perform a task."}, {"letter": "D", "text": "Have the development team build an API service that allows the operations team to execute specific remote procedure calls to accomplish their tasks."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6660-exam-professional-cloud-architect-topic-11-question-1/", "postedDate": "2019-10-16", "postedYear": 2019, "tags": ["安全性"]}, {"id": "T11-Q2", "topic": 11, "qnum": 2, "question": "At Dress4Win, an operations engineer wants to create a tow-cost solution to remotely archive copies of database backup files.The database files are compressed tar files stored in their current data center.How should he proceed?", "options": [{"letter": "A", "text": "Create a cron script using gsutil to copy the files to a Coldline Storage bucket."}, {"letter": "B", "text": "Create a cron script using gsutil to copy the files to a Regional Storage bucket."}, {"letter": "C", "text": "Create a Cloud Storage Transfer Service Job to copy the files to a Coldline Storage bucket."}, {"letter": "D", "text": "Create a Cloud Storage Transfer Service job to copy the files to a Regional Storage bucket."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/14731-exam-professional-cloud-architect-topic-11-question-2/", "postedDate": "2020-02-23", "postedYear": 2020, "tags": ["Cloud Storage", "成本優化"]}, {"id": "T11-Q3", "topic": 11, "qnum": 3, "question": "Dress4Win has asked you to recommend machine types they should deploy their application servers to.How should you proceed?", "options": [{"letter": "A", "text": "Perform a mapping of the on-premises physical hardware cores and RAM to the nearest machine types in the cloud."}, {"letter": "B", "text": "Recommend that Dress4Win deploy application servers to machine types that offer the highest RAM to CPU ratio available."}, {"letter": "C", "text": "Recommend that Dress4Win deploy into production with the smallest instances available, monitor them over time, and scale the machine type up until the desired performance is reached."}, {"letter": "D", "text": "Identify the number of virtual cores and RAM associated with the application server virtual machines align them to a custom machine type in the cloud, monitor performance, and scale the machine types up until the desired performance is reached."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7261-exam-professional-cloud-architect-topic-11-question-3/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Compute Engine", "成本優化", "效能調校"]}, {"id": "T11-Q4", "topic": 11, "qnum": 4, "question": "As part of Dress4Win's plans to migrate to the cloud, they want to be able to set up a managed logging and monitoring system so they can handle spikes in their traffic load.They want to ensure that:* The infrastructure can be notified when it needs to scale up and down to handle the ebb and flow of usage throughout the day* Their administrators are notified automatically when their application reports errors.* They can filter their aggregated logs down in order to debug one piece of the application across many hostsWhich Google StackDriver features should they use?", "options": [{"letter": "A", "text": "Logging, Alerts, Insights, Debug"}, {"letter": "B", "text": "Monitoring, Trace, Debug, Logging"}, {"letter": "C", "text": "Monitoring, Logging, Alerts, Error Reporting"}, {"letter": "D", "text": "Monitoring, Logging, Debug, Error Report"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6617-exam-professional-cloud-architect-topic-11-question-4/", "postedDate": "2019-10-15", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "自動擴縮"]}, {"id": "T11-Q5", "topic": 11, "qnum": 5, "question": "Dress4Win would like to become familiar with deploying applications to the cloud by successfully deploying some applications quickly, as is. They have asked for your recommendation.What should you advise?", "options": [{"letter": "A", "text": "Identify self-contained applications with external dependencies as a first move to the cloud."}, {"letter": "B", "text": "Identify enterprise applications with internal dependencies and recommend these as a first move to the cloud."}, {"letter": "C", "text": "Suggest moving their in-house databases to the cloud and continue serving requests to on-premise applications."}, {"letter": "D", "text": "Recommend moving their message queuing servers to the cloud and continue handling requests to on-premise applications."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6968-exam-professional-cloud-architect-topic-11-question-5/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["資料遷移"]}, {"id": "T11-Q6", "topic": 11, "qnum": 6, "question": "Dress4Win has asked you for advice on how to migrate their on-premises MySQL deployment to the cloud.They want to minimize downtime and performance impact to their on-premises solution during the migration.Which approach should you recommend?", "options": [{"letter": "A", "text": "Create a dump of the on-premises MySQL master server, and then shut it down, upload it to the cloud environment, and load into a new MySQL cluster."}, {"letter": "B", "text": "Setup a MySQL replica server/slave in the cloud environment, and configure it for asynchronous replication from the MySQL master server on-premises until cutover."}, {"letter": "C", "text": "Create a new MySQL cluster in the cloud, configure applications to begin writing to both on premises and cloud MySQL masters, and destroy the original cluster at cutover."}, {"letter": "D", "text": "Create a dump of the MySQL replica server into the cloud environment, load it into: Google Cloud Datastore, and configure applications to read/write to Cloud Datastore at cutover."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9198-exam-professional-cloud-architect-topic-11-question-6/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["Cloud SQL", "資料遷移", "高可用性/災難復原"]}, {"id": "T11-Q7", "topic": 11, "qnum": 7, "question": "Dress4Win has configured a new uptime check with Google Stackdriver for several of their legacy services. The Stackdriver dashboard is not reporting the services as healthy.What should they do?", "options": [{"letter": "A", "text": "Install the Stackdriver agent on all of the legacy web servers."}, {"letter": "B", "text": "In the Cloud Platform Console download the list of the uptime servers' IP addresses and create an inbound firewall rule"}, {"letter": "C", "text": "Configure their load balancer to pass through the User-Agent HTTP header when the value matches GoogleStackdriverMonitoring-UptimeChecks (https:// cloud.google.com/monitoring)"}, {"letter": "D", "text": "Configure their legacy web servers to allow requests that contain user-Agent HTTP header when the value matches GoogleStackdriverMonitoring- UptimeChecks (https://cloud.google.com/monitoring)"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7263-exam-professional-cloud-architect-topic-11-question-7/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "VPC/網路"]}, {"id": "T11-Q8", "topic": 11, "qnum": 8, "question": "As part of their new application experience, Dress4Wm allows customers to upload images of themselves.The customer has exclusive control over who may view these images.Customers should be able to upload images with minimal latency and also be shown their images quickly on the main application page when they log in.Which configuration should Dress4Win use?", "options": [{"letter": "A", "text": "Store image files in a Google Cloud Storage bucket. Use Google Cloud Datastore to maintain metadata that maps each customer's ID and their image files."}, {"letter": "B", "text": "Store image files in a Google Cloud Storage bucket. Add custom metadata to the uploaded images in Cloud Storage that contains the customer's unique ID."}, {"letter": "C", "text": "Use a distributed file system to store customers' images. As storage needs increase, add more persistent disks and/or nodes. Assign each customer a unique ID, which sets each file's owner attribute, ensuring privacy of images."}, {"letter": "D", "text": "Use a distributed file system to store customers' images. As storage needs increase, add more persistent disks and/or nodes. Use a Google Cloud SQL database to maintain metadata that maps each customer's ID to their image files."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8251-exam-professional-cloud-architect-topic-11-question-8/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Cloud Storage", "Datastore/Firestore", "效能調校"]}, {"id": "T11-Q9", "topic": 11, "qnum": 9, "question": "Dress4Win has end-to-end tests covering 100% of their endpoints.They want to ensure that the move to the cloud does not introduce any new bugs.Which additional testing methods should the developers employ to prevent an outage?", "options": [{"letter": "A", "text": "They should enable Google Stackdriver Debugger on the application code to show errors in the code."}, {"letter": "B", "text": "They should add additional unit tests and production scale load tests on their cloud staging environment."}, {"letter": "C", "text": "They should run the end-to-end tests in the cloud staging environment to determine if the code is working as intended."}, {"letter": "D", "text": "They should add canary tests so developers can measure how much of an impact the new release causes to latency."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/14735-exam-professional-cloud-architect-topic-11-question-9/", "postedDate": "2020-02-23", "postedYear": 2020, "tags": ["CI/CD"]}, {"id": "T11-Q10", "topic": 11, "qnum": 10, "question": "You want to ensure Dress4Win's sales and tax records remain available for infrequent viewing by auditors for at least 10 years.Cost optimization is your top priority.Which cloud services should you choose?", "options": [{"letter": "A", "text": "Google Cloud Storage Coldline to store the data, and gsutil to access the data."}, {"letter": "B", "text": "Google Cloud Storage Nearline to store the data, and gsutil to access the data."}, {"letter": "C", "text": "Google Bigtabte with US or EU as location to store the data, and gcloud to access the data."}, {"letter": "D", "text": "BigQuery to store the data, and a web server cluster in a managed instance group to access the data. Google Cloud SQL mirrored across two distinct regions to store the data, and a Redis cluster in a managed instance group to access the data."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9199-exam-professional-cloud-architect-topic-11-question-10/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["Cloud Storage", "成本優化", "合規性"]}, {"id": "T11-Q11", "topic": 11, "qnum": 11, "question": "The current Dress4Win system architecture has high latency to some customers because it is located in one data center.As of a future evaluation and optimizing for performance in the cloud, Dresss4Win wants to distribute its system architecture to multiple locations when Google cloud platform.Which approach should they use?", "options": [{"letter": "A", "text": "Use regional managed instance groups and a global load balancer to increase performance because the regional managed instance group can grow instances in each region separately based on traffic."}, {"letter": "B", "text": "Use a global load balancer with a set of virtual machines that forward the requests to a closer group of virtual machines managed by your operations team."}, {"letter": "C", "text": "Use regional managed instance groups and a global load balancer to increase reliability by providing automatic failover between zones in different regions."}, {"letter": "D", "text": "Use a global load balancer with a set of virtual machines that forward the requests to a closer group of virtual machines as part of a separate managed instance groups."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6802-exam-professional-cloud-architect-topic-11-question-11/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Load Balancing", "Compute Engine", "多區域架構", "效能調校"]}, {"id": "T12-Q1", "topic": 12, "qnum": 1, "question": "Dress4Win is expected to grow to 10 times its size in 1 year with a corresponding growth in data and traffic that mirrors the existing patterns of usage. The CIO has set the target of migrating production infrastructure to the cloud within the next 6 months. How will you configure the solution to scale for this growth without making major application changes and still maximize the ROI?", "options": [{"letter": "A", "text": "Migrate the web application layer to App Engine, and MySQL to Cloud Datastore, and NAS to Cloud Storage. Deploy RabbitMQ, and deploy Hadoop servers using Deployment Manager."}, {"letter": "B", "text": "Migrate RabbitMQ to Cloud Pub/Sub, Hadoop to BigQuery, and NAS to Compute Engine with Persistent Disk storage. Deploy Tomcat, and deploy Nginx using Deployment Manager."}, {"letter": "C", "text": "Implement managed instance groups for Tomcat and Nginx. Migrate MySQL to Cloud SQL, RabbitMQ to Cloud Pub/Sub, Hadoop to Cloud Dataproc, and NAS to Compute Engine with Persistent Disk storage."}, {"letter": "D", "text": "Implement managed instance groups for the Tomcat and Nginx. Migrate MySQL to Cloud SQL, RabbitMQ to Cloud Pub/Sub, Hadoop to Cloud Dataproc, and NAS to Cloud Storage."}], "answer": "D", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/6803-exam-professional-cloud-architect-topic-12-question-1/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Compute Engine", "Cloud SQL", "Pub/Sub", "Dataflow/Dataproc", "自動擴縮", "案例研究題"]}, {"id": "T12-Q2", "topic": 12, "qnum": 2, "question": "Considering the given business requirements, how would you automate the deployment of web and transactional data layers?", "options": [{"letter": "A", "text": "Deploy Nginx and Tomcat using Cloud Deployment Manager to Compute Engine. Deploy a Cloud SQL server to replace MySQL. Deploy Jenkins using Cloud Deployment Manager."}, {"letter": "B", "text": "Deploy Nginx and Tomcat using Cloud Launcher. Deploy a MySQL server using Cloud Launcher. Deploy Jenkins to Compute Engine using Cloud Deployment Manager scripts."}, {"letter": "C", "text": "Migrate Nginx and Tomcat to App Engine. Deploy a Cloud Datastore server to replace the MySQL server in a high-availability configuration. Deploy Jenkins to Compute Engine using Cloud Launcher."}, {"letter": "D", "text": "Migrate Nginx and Tomcat to App Engine. Deploy a MySQL server using Cloud Launcher. Deploy Jenkins to Compute Engine using Cloud Launcher."}], "answer": "A", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/7265-exam-professional-cloud-architect-topic-12-question-2/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Terraform/IaC", "Cloud SQL", "CI/CD", "案例研究題"]}, {"id": "T12-Q3", "topic": 12, "qnum": 3, "question": "Which of the compute services should be migrated as-is and would still be an optimized architecture for performance in the cloud?", "options": [{"letter": "A", "text": "Web applications deployed using App Engine standard environment"}, {"letter": "B", "text": "RabbitMQ deployed using an unmanaged instance group"}, {"letter": "C", "text": "Hadoop/Spark deployed using Cloud Dataproc Regional in High Availability mode"}, {"letter": "D", "text": "Jenkins, monitoring, bastion hosts, security scanners services deployed on custom machine types"}], "answer": "C", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/7266-exam-professional-cloud-architect-topic-12-question-3/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Dataflow/Dataproc", "高可用性/災難復原", "案例研究題"]}, {"id": "T12-Q4", "topic": 12, "qnum": 4, "question": "To be legally compliant during an audit, Dress4Win must be able to give insights in all administrative actions that modify the configuration or metadata of resources on Google Cloud.What should you do?", "options": [{"letter": "A", "text": "Use Stackdriver Trace to create a Trace list analysis."}, {"letter": "B", "text": "Use Stackdriver Monitoring to create a dashboard on the project's activity."}, {"letter": "C", "text": "Enable Cloud Identity-Aware Proxy in all projects, and add the group of Administrators as a member."}, {"letter": "D", "text": "Use the Activity page in the GCP Console and Stackdriver Logging to provide the required insight."}], "answer": "D", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/6805-exam-professional-cloud-architect-topic-12-question-4/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "合規性", "監控與可觀測性", "案例研究題"]}, {"id": "T12-Q5", "topic": 12, "qnum": 5, "question": "You are responsible for the security of data stored in Cloud Storage for your company, Dress4Win. You have already created a set of Google Groups and assigned the appropriate users to those groups. You should use Google best practices and implement the simplest design to meet the requirements.Considering Dress4Win's business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Assign custom IAM roles to the Google Groups you created in order to enforce security requirements. Encrypt data with a customer-supplied encryption key when storing files in Cloud Storage."}, {"letter": "B", "text": "Assign custom IAM roles to the Google Groups you created in order to enforce security requirements. Enable default storage encryption before storing files in Cloud Storage."}, {"letter": "C", "text": "Assign predefined IAM roles to the Google Groups you created in order to enforce security requirements. Utilize Google's default encryption at rest when storing files in Cloud Storage."}, {"letter": "D", "text": "Assign predefined IAM roles to the Google Groups you created in order to enforce security requirements. Ensure that the default Cloud KMS key is set before storing files in Cloud Storage."}], "answer": "C", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/8252-exam-professional-cloud-architect-topic-12-question-5/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Cloud Storage", "IAM", "安全性", "案例研究題"]}, {"id": "T12-Q6", "topic": 12, "qnum": 6, "question": "You want to ensure that your on-premises architecture meets business requirements before you migrate your solution.What change in the on-premises architecture should you make?", "options": [{"letter": "A", "text": "Replace RabbitMQ with Google Pub/Sub."}, {"letter": "B", "text": "Downgrade MySQL to v5.7, which is supported by Cloud SQL for MySQL."}, {"letter": "C", "text": "Resize compute resources to match predefined Compute Engine machine types."}, {"letter": "D", "text": "Containerize the micro-services and host them in Google Kubernetes Engine."}], "answer": "D", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/6807-exam-professional-cloud-architect-topic-12-question-6/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Pub/Sub", "資料遷移", "案例研究題"]}], "caseStudies": {"Altostrat Media": "Company Overview -Altostrat is a prominent player in the media industry, with an extensive collection of audio and video content that comprises podcasts, interviews, news broadcasts, and documentaries. Their success in delivering premium content to a diverse audience requires a content management system that can keep pace with the dynamic media landscape.Solution Concept -Altostrat seeks to modernize its content management and user engagement strategies using Google Cloud's generative AI. They want a platform that empowers customers with personalized recommendations, natural language interactions and seamless self-service support. Simultaneously, they want to drive revenue growth through dynamic pricing targeted marketing, and personalized product suggestions.The seamless integration of AI-powered tools into the existing Google Cloud environment will enable Altostrat to efficiently manage their vast media library, enhance user experiences, and unlock new revenue streams. Google Cloud's generative AI will solidify their leadership in the media industry.Existing Technical Environment -Altostrat’s content management and delivery platform leverages GKE for scalability and high availability, essential for handling their vast media library. Their extensive media library spanning various documents, audio and video formats is stored in Cloud Storage. To gain valuable insights into user behavior, content consumption patterns, and audience demographics, Altostrat leverages BigQuery as their primary data warehouse. Additionally, they use Cloud Run functions for serverless execution of event-driven tasks such as video transcoding metadata extraction, and personalized content recommendations.While Altostrat has made significant strides in cloud adoption, they also maintain some legacy on-premises systems for specific workflows like content ingestion and archival. These systems are slated for modernization and migration to Google Cloud in the near future. User management and authentication are currently handled through a combination of Google Identity and third-party identity providers. For monitoring and observability, Altostrat relies on a mix of native Google Cloud tools like Cloud Monitoring and open-source solutions like Prometheus, with alerts primarily delivered via email notifications.Business Requirements -• Accelerate and enhance the reliability of operational workflows across all environments. [Google Cloud + On-premises]• Simplify infrastructure management for rapid application deployment.• Optimize cloud storage costs while maintaining high availability and scalability for media content.• Enable natural language interaction with the platform with 24/7 user support.• Automatically generate concise summaries of media content.• Extract rich metadata from media assets using NLP and computer vision.• Detect and filter inappropriate content.• Analyze media content to identify trends and extract insights.• Inform content strategy and decision making with data.Technical Requirements -• Modernize CI/CD for containerized deployments with a centralized management platform.• Secure, high-performance hybrid cloud connectivity for data ingestion.• Provide scalable, performant kubernetes environments both on-premises and in the cloud.• Optimize cloud storage costs for growing media volumes.• Design AI-powered detection of harmful content.• Ensure that AI systems are auditable and their decisions can be explained.• Leverage LLMs and conversational AI for personalized experiences and content virality.• Develop advanced chatbots with natural language understanding to provide personalized assistance.• Automated summarization for diverse media.Executive Statement -At Altostrat, we are embracing the next frontier of artificial intelligence to revolutionize our content strategy. By harnessing the power of generative AI, we will create an unparalleled user experience by empowering our audience with intelligent toots for content discovery, personalized recommendations, and seamless interaction. Reliability and cost management are our top priorities. This strategic initiative will deepen engagement, foster customer loyalty, and unlock new revenue streams through targeted marketing and tailored content offerings. We see a future where Al-driven innovation is central to our business, leading to greater success for our company and delivering exceptional value to our customers.", "KnightMotives Automotive": "Company Overview -KnightMotives is a car manufacturer specializing in autonomous, self-driving vehicles, including Battery Electric Vehicles (BEVs), hybrids and traditional internal combustion engine (ICE) vehicles. While KnightMotives has made strides with the in-vehicle experience in their BEV fleet, the hybrid and ICE vehicles have yet to implement these new systems and are viewed poorly by critics and drivers. The lack of modern in-vehicle technology in hybrid and ICE vehicles has resulted in declining sales and customer satisfaction.KnightMotives wants to modernize the consumer experience across all vehicles within five years Artificial Intelligence offers a unique opportunity to revolutionize the in-vehicle experience, as well as the shopping buying and service/maintenance experience. Investment in this new technology will require a shift in financial priorities on a global scale.KnightMotives also wants to improve their online ordering system, which is unreliable. Systems for customers to build their vehicle online for acquisition through a dealer are not delivering the data or reliability that dealers need, causing. A strain in the relationship between KnightMotives and dealers. Service technicians and sales staff need better tooling to enhance dealer successes, including built-to-order vehicles.Solution Concept -KnightMotives wants to shift from manufacturing cars to creating a complete and compelling “automotive experience.” Then strategy prioritizes delivering a consistent experience across all models, developing AI-powered features, generating new revenue from data monetization, adopting a digital focus to differentiate their brand from competitors, and developing better tools for mechanics and salespeople.Existing Technical Environment -KnightMotives's IT is largely on-premises with some applications on major cloud platforms. Their supply chain runs on an outdated mainframe, and Enterprise Resource Planning (ERP) is also outdated, making new promotions and dealer discounts difficult to implement. Dealers have no budget for new equipment. There is fragmentation across vehicles with multiple code bases, and significant technical debt from supporting backwards compatibility. Network connectivity to manufacturing plants and vehicle connectivity in rural areas are challenges.Business Requirements -Key business requirements include fostering a personalized relationship with the driver and delivering a cohesive experience across all models. Creating a better build-to-order model will reduce time on the lot and provide transparency for both dealers and customers. Additionally, KnightMotives seeks to monetize corporate data to finance new technology investments, as their current AI infrastructure is obsolete and corporate data remains siloed. Security is a paramount concern due to past data breaches Adherence to European Union (EU) data protection regulations, especially for emerging autonomous platforms, is critical.KnightMotives plans to make significant investments in fully autonomous driving capabilities, with initial implementation targeting regions with favorable regulatory environments. Prioritizing employee upskilling, attracting top-tier talent, and fostering better communication between business and technical teams are also critical objectives.Technical Requirements -• Modernizing the in-vehicle experience includes developing a consistent user experience (UX) that seamlessly integrates AI-powered features across all models, updating in-vehicle hardware and software in legacy models to support new UX features and AI capabilities, and ensuring reliable network connectivity, especially in rural areas, to support real-time AI features and data transmission.• Network upgrades are necessary to support increased data traffic and improve connectivity between plants and headquarters.• IT infrastructure modernization requires adopting a hybrid cloud strategy to leverage the benefits of both on-premises and cloud infrastructure, and gradually modernizing or replacing legacy systems to improve efficiency and agility.• Autonomous vehicle development and testing requires investing in cutting-edge AI and machine learning technologies, building a robust simulation environment, and ensuring compliance with evolving regulations related to autonomous vehicles.• Data monetization and insights requires implementing a robust data management platform, strict data security and privacy measures, and a scalable AI/ML infrastructure.• Increased focus on security and risk management involves implementing a comprehensive security framework to protect against cyber threats and data breaches, developing an incident response plan, and providing security awareness training to employees.• Providing a delightful experience for dealers and customers requires improving the online build-to-order system; developing modern dealer tools to streamline dealer operations, including sales, service, and inventory management; and implementing a comprehensive Customer Relationship Management (CRM) system to track customer interactions personalize experiences, and improve customer satisfaction.Executive Statement -KnightMotives is committed to enhancing safety and saving lives by leveraging an extensive body of data — encompassing driving, road conditions, behavioral studies, and crash safety statistics — to create compelling digital experiences for drivers. Our AI consistently outperforms national safety statistics, ensuring the unique and coveted KnightMotives experience is aligned across all our vehicle models.Michael Knight, KnightMotives CEO", "EHR Healthcare": "Company Overview -EHR Healthcare is a leading provider of electronic health record software to the healthcare industry. EHR Healthcare provides their software as a service to multi-national medical offices, hospitals, and insurance providers.Company Background -EHR Healthcare started as a small software company and has grown rapidly, acquiring companies and customers around the world. Due to this growth, much of the software they have acquired does not integrate, resulting in incompatible systems with duplicate functionality. EHR wants to leverage the cloud to make their new overarching platform available, unifying the varying degrees of complexity across every subsidiary's technology stacks into one consistent experience. They are hoping to speed up this move to the cloud as they are starting to experience outages in their current on-premises environment, due to insufficient resources. Along with the cloud migration, they are redesigning only the pieces of their software that need to be optimized for performance reasons; the majority of the software will be migrated as-is (lift and shift) to meet their timeline goals.Solution Concept -Due to the complex nature of their software platform, EHR Healthcare will take a staged approach to migration, allowing time to re-architect, modernize, and optimize throughout the process, starting with their user-facing applications and working towards their back-office/support systems.Existing Technical Environment -EHR's software is currently hosted across multiple colocation facilities, with the biggest footprint in the Western United States. Due to this legacy, monolithic architecture, EHR has experienced significant customer impact from downtime. EHR Healthcare has several additional data centers that provide some application redundancy. The data centers connect to each other through th
