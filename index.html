essional-cloud-architect-topic-1-question-34/", "postedDate": "2021-06-04", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性"], "keywords": ["Linux kernel module", "batch servers failed", "collect details on the failure", "serial console", "activity log"], "explanation": {"questionZh": "開發團隊在 Google Compute Engine（GCE）虛擬機器上的批次處理伺服器裝了一個新的 Linux kernel 模組，想加速夜間批次作業。安裝兩天後，50% 的批次伺服器在夜間批次執行時失敗了。你想收集失敗的細節資訊回報給開發團隊。該採取哪三個行動？", "optionTable": [{"letter": "A", "analysis": "正確。如果這個 kernel 模組有寫 log，直接在 Cloud Logging（原 Stackdriver Logging）搜尋跟這個模組相關的訊息，是最直接找線索的方式。", "zh": "使用 Stackdriver Logging 搜尋該模組的 log 記錄"}, {"letter": "B", "analysis": "Activity Log（Admin Activity 稽核記錄）只記錄「對這台 VM 做了什麼管理操作」，例如誰建立/啟動/停止/修改/刪除了這台 VM，是基礎設施層級的 API 操作記錄，不會記錄 VM 內部作業系統、kernel 模組崩潰或批次程式失敗這類內部執行細節，兩者層次完全不同，對診斷這個問題沒有幫助。", "zh": "使用 API 或 Cloud Console 讀取 debug GCE Activity log"}, {"letter": "C", "analysis": "正確。Serial console 可以看到 VM 開機、kernel 層級的輸出訊息（包括 kernel panic、模組載入失敗等），是診斷 kernel 模組問題最直接的管道之一，尤其當 VM 可能連 SSH 都連不上時，serial console 常常是唯一還能看到系統層級訊息的地方。", "zh": "使用 gcloud 或 Cloud Console 連到 serial console 觀察 log"}, {"letter": "D", "analysis": "Live migration 是 GCE 在底層硬體維護時把 VM 搬到別台主機、VM 本身不會中斷服務的機制，跟這次因為裝了新 kernel 模組而造成的批次失敗沒有邏輯關聯，是干擾選項。", "zh": "用 activity log 確認失敗的伺服器是否發生了 live migration 事件"}, {"letter": "E", "analysis": "正確。把監控（Stackdriver/Cloud Monitoring）的時間軸對準失敗發生的時間點，觀察 CPU、記憶體、磁碟等伺服器指標在失敗前後有沒有異常（例如記憶體暴增、CPU 卡死），能幫助還原失敗當下系統發生了什麼事。", "zh": "調整 Stackdriver 的時間軸對準失敗時間，觀察批次伺服器的指標（metrics）"}, {"letter": "F", "analysis": "把整個 debug VM 匯出成 image、搬到本機伺服器上跑，既耗時又不保證能重現雲端環境的問題，而且 GCP 已經有 serial console 可以直接看 kernel 輸出，根本不需要這麼迂迴麻煩的步驟。", "zh": "把 debug VM 匯出成 image，在本機伺服器上跑該 image，讓 kernel log 顯示在實體螢幕上"}], "notes": [{"heading": "題目在問什麼", "body": "要找出能收集到「VM 內部發生了什麼事」的管道，而不是「有誰對這台 VM 做了什麼操作」，兩者是完全不同層次的資訊。"}, {"heading": "答案驗證：A、C、E", "body": "三者分別覆蓋不同層次的診斷資訊：Cloud Logging（應用/模組層級的 log）、Serial Console（kernel/開機層級的輸出）、Monitoring 指標時間軸（系統資源異常），三者互補，不需要大費周章把 VM 搬出去（F）或查錯誤的記錄類型（B、D）。"}, {"heading": "核心概念：GCE vs GKE，這題跟 Kubernetes 無關", "body": "GCE（Compute Engine）是單純的虛擬機器服務（IaaS）：拿到一台 VM，作業系統、kernel 模組都自己管，就像自己買電腦灌 Linux。GKE（Kubernetes Engine）則是容器調度平台，底層其實也是用 GCE VM 當作「Node」，但使用者通常是操作更小單位的「Pod」，不直接碰 Node 的作業系統。這題的 kernel 模組是直接裝在 GCE VM 的 Linux 系統核心裡，影響整台 VM 的運作，跟 Node/Pod 的概念完全無關——這題根本沒有 Kubernetes，純粹是「VM 上的 Linux 系統壞了」的故事。"}, {"heading": "核心概念：Activity Log 記錄的是「管理操作」不是「內部狀態」", "body": "Activity Log（Admin Activity 稽核記錄）只記錄從外部對 GCP 資源下的 API 指令，例如誰建立、啟動、停止、修改、刪除了這台 VM，類似大樓的門禁刷卡記錄。而 VM 裡面的 kernel 模組崩潰、批次程式失敗，是發生在 VM 內部的事情，沒有人對它下任何管理操作，所以 Activity Log 完全看不到這類內部執行細節，必須改用 Cloud Logging、Serial Console 或 Monitoring 指標（類似房間裡的監視器畫面）才能看到實際發生的狀況。"}]}}, {"id": "T1-Q35", "topic": 1, "qnum": 35, "question": "Your company wants to try out the cloud with low risk. They want to archive approximately 100 TB of their log data to the cloud and test the analytics features available to them there, while also retaining that data as a long-term disaster recovery backup.Which two steps should you take? (Choose two.)", "options": [{"letter": "A", "text": "Load logs into Google BigQuery"}, {"letter": "B", "text": "Load logs into Google Cloud SQL"}, {"letter": "C", "text": "Import logs into Google Stackdriver"}, {"letter": "D", "text": "Insert logs into Google Cloud Bigtable"}, {"letter": "E", "text": "Upload log files into Google Cloud Storage"}], "answer": "AE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54534-exam-professional-cloud-architect-topic-1-question-35/", "postedDate": "2021-06-04", "postedYear": 2021, "tags": ["Cloud Storage", "BigQuery", "成本優化"]}, {"id": "T1-Q36", "topic": 1, "qnum": 36, "question": "You created a pipeline that can deploy your source code changes to your infrastructure in instance groups for self-healing. One of the changes negatively affects your key performance indicator. You are not sure how to fix it, and investigation could take up to a week.What should you do?", "options": [{"letter": "A", "text": "Log in to a server, and iterate on the fox locally"}, {"letter": "B", "text": "Revert the source code change, and rerun the deployment pipeline"}, {"letter": "C", "text": "Log into the servers with the bad code change, and swap in the previous code"}, {"letter": "D", "text": "Change the instance group template to the previous one, and delete all instances"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10522-exam-professional-cloud-architect-topic-1-question-36/", "postedDate": "2019-12-17", "postedYear": 2019, "tags": ["CI/CD"]}, {"id": "T1-Q37", "topic": 1, "qnum": 37, "question": "Your organization wants to control IAM policies for different departments independently, but centrally.Which approach should you take?", "options": [{"letter": "A", "text": "Multiple Organizations with multiple Folders"}, {"letter": "B", "text": "Multiple Organizations, one for each department"}, {"letter": "C", "text": "A single Organization with Folders for each department"}, {"letter": "D", "text": "A single Organization with multiple projects, each with a central owner"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7208-exam-professional-cloud-architect-topic-1-question-37/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["IAM", "Organization Policy"]}, {"id": "T1-Q38", "topic": 1, "qnum": 38, "question": "You deploy your custom Java application to Google App Engine. It fails to deploy and gives you the following stack trace.What should you do?", "options": [{"letter": "A", "text": "Upload missing JAR files and redeploy your application."}, {"letter": "B", "text": "Digitally sign all of your JAR files and redeploy your application"}, {"letter": "C", "text": "Recompile the CLoakedServlet class using and MD5 hash instead of SHA1"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7209-exam-professional-cloud-architect-topic-1-question-38/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["App Engine"]}, {"id": "T1-Q39", "topic": 1, "qnum": 39, "question": "You are designing a mobile chat application. You want to ensure people cannot spoof chat messages, by providing a message were sent by a specific user.What should you do?", "options": [{"letter": "A", "text": "Tag messages client side with the originating user identifier and the destination user."}, {"letter": "B", "text": "Encrypt the message client side using block-based encryption with a shared key."}, {"letter": "C", "text": "Use public key infrastructure (PKI) to encrypt the message client side using the originating user's private key."}, {"letter": "D", "text": "Use a trusted certificate authority to enable SSL connectivity between the client application and the server."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6844-exam-professional-cloud-architect-topic-1-question-39/", "postedDate": "2019-10-20", "postedYear": 2019, "tags": ["Cloud KMS/加密", "安全性"]}, {"id": "T1-Q40", "topic": 1, "qnum": 40, "question": "As part of implementing their disaster recovery plan, your company is trying to replicate their production MySQL database from their private data center to theirGCP project using a Google Cloud VPN connection. They are experiencing latency issues and a small amount of packet loss that is disrupting the replication.What should they do?", "options": [{"letter": "A", "text": "Configure their replication to use UDP."}, {"letter": "B", "text": "Configure a Google Cloud Dedicated Interconnect."}, {"letter": "C", "text": "Restore their database daily using Google Cloud SQL."}, {"letter": "D", "text": "Add additional VPN connections and load balance them."}, {"letter": "E", "text": "Send the replicated transaction to Google Cloud Pub/Sub."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7211-exam-professional-cloud-architect-topic-1-question-40/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["Interconnect/VPN", "高可用性/災難復原"]}, {"id": "T1-Q41", "topic": 1, "qnum": 41, "question": "Your customer support tool logs all email and chat conversations to Cloud Bigtable for retention and analysis. What is the recommended approach for sanitizing this data of personally identifiable information or payment card information before initial storage?", "options": [{"letter": "A", "text": "Hash all data using SHA256"}, {"letter": "B", "text": "Encrypt all data using elliptic curve cryptography"}, {"letter": "C", "text": "De-identify the data with the Cloud Data Loss Prevention API"}, {"letter": "D", "text": "Use regular expressions to find and redact phone numbers, email addresses, and credit card numbers"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11803-exam-professional-cloud-architect-topic-1-question-41/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["Bigtable", "Sensitive Data Protection(DLP)", "安全性"]}, {"id": "T1-Q42", "topic": 1, "qnum": 42, "question": "You are using Cloud Shell and need to install a custom utility for use in a few weeks. Where can you store the file so it is in the default execution path and persists across sessions?", "options": [{"letter": "A", "text": "~/bin"}, {"letter": "B", "text": "Cloud Storage"}, {"letter": "C", "text": "/google/scripts"}, {"letter": "D", "text": "/usr/local/bin"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7212-exam-professional-cloud-architect-topic-1-question-42/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["Compute Engine"]}, {"id": "T1-Q43", "topic": 1, "qnum": 43, "question": "You want to create a private connection between your instances on Compute Engine and your on-premises data center. You require a connection of at least 20Gbps. You want to follow Google-recommended practices. How should you set up the connection?", "options": [{"letter": "A", "text": "Create a VPC and connect it to your on-premises data center using Dedicated Interconnect."}, {"letter": "B", "text": "Create a VPC and connect it to your on-premises data center using a single Cloud VPN."}, {"letter": "C", "text": "Create a Cloud Content Delivery Network (Cloud CDN) and connect it to your on-premises data center using Dedicated Interconnect."}, {"letter": "D", "text": "Create a Cloud Content Delivery Network (Cloud CDN) and connect it to your on-premises datacenter using a single Cloud VPN."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11804-exam-professional-cloud-architect-topic-1-question-43/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["Interconnect/VPN", "VPC/網路"]}, {"id": "T1-Q44", "topic": 1, "qnum": 44, "question": "You are analyzing and defining business processes to support your startup's trial usage of GCP, and you don't yet know what consumer demand for your product will be. Your manager requires you to minimize GCP service costs and adhere to Google best practices. What should you do?", "options": [{"letter": "A", "text": "Utilize free tier and sustained use discounts. Provision a staff position for service cost management."}, {"letter": "B", "text": "Utilize free tier and sustained use discounts. Provide training to the team about service cost management."}, {"letter": "C", "text": "Utilize free tier and committed use discounts. Provision a staff position for service cost management."}, {"letter": "D", "text": "Utilize free tier and committed use discounts. Provide training to the team about service cost management."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7190-exam-professional-cloud-architect-topic-1-question-44/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["成本優化"]}, {"id": "T1-Q45", "topic": 1, "qnum": 45, "question": "You are building a continuous deployment pipeline for a project stored in a Git source repository and want to ensure that code changes can be verified before deploying to production. What should you do?", "options": [{"letter": "A", "text": "Use Spinnaker to deploy builds to production using the red/black deployment strategy so that changes can easily be rolled back."}, {"letter": "B", "text": "Use Spinnaker to deploy builds to production and run tests on production deployments."}, {"letter": "C", "text": "Use Jenkins to build the staging branches and the master branch. Build and deploy changes to production for 10% of users before doing a complete rollout."}, {"letter": "D", "text": "Use Jenkins to monitor tags in the repository. Deploy staging tags to a staging environment for testing. After testing, tag the repository for production and deploy that to the production environment."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8197-exam-professional-cloud-architect-topic-1-question-45/", "postedDate": "2019-11-14", "postedYear": 2019, "tags": ["CI/CD"]}, {"id": "T1-Q46", "topic": 1, "qnum": 46, "question": "You have an outage in your Compute Engine managed instance group: all instances keep restarting after 5 seconds. You have a health check configured, but autoscaling is disabled. Your colleague, who is a Linux expert, offered to look into the issue. You need to make sure that he can access the VMs. What should you do?", "options": [{"letter": "A", "text": "Grant your colleague the IAM role of project Viewer"}, {"letter": "B", "text": "Perform a rolling restart on the instance group"}, {"letter": "C", "text": "Disable the health check for the instance group. Add his SSH key to the project-wide SSH Keys"}, {"letter": "D", "text": "Disable autoscaling for the instance group. Add his SSH key to the project-wide SSH Keys"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6953-exam-professional-cloud-architect-topic-1-question-46/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["Compute Engine", "自動擴縮"]}, {"id": "T1-Q47", "topic": 1, "qnum": 47, "question": "Your company is migrating its on-premises data center into the cloud. As part of the migration, you want to integrate Google Kubernetes Engine (GKE) for workload orchestration. Parts of your architecture must also be PCI DSS-compliant. Which of the following is most accurate?", "options": [{"letter": "A", "text": "App Engine is the only compute platform on GCP that is certified for PCI DSS hosting."}, {"letter": "B", "text": "GKE cannot be used under PCI DSS because it is considered shared hosting."}, {"letter": "C", "text": "GKE and GCP provide the tools you need to build a PCI DSS-compliant environment."}, {"letter": "D", "text": "All Google Cloud services are usable because Google Cloud Platform is certified PCI-compliant."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54735-exam-professional-cloud-architect-topic-1-question-47/", "postedDate": "2021-06-06", "postedYear": 2021, "tags": ["GKE/Kubernetes", "合規性"]}, {"id": "T1-Q48", "topic": 1, "qnum": 48, "question": "Your company has multiple on-premises systems that serve as sources for reporting. The data has not been maintained well and has become degraded over time.You want to use Google-recommended practices to detect anomalies in your company data. What should you do?", "options": [{"letter": "A", "text": "Upload your files into Cloud Storage. Use Cloud Datalab to explore and clean your data."}, {"letter": "B", "text": "Upload your files into Cloud Storage. Use Cloud Dataprep to explore and clean your data."}, {"letter": "C", "text": "Connect Cloud Datalab to your on-premises systems. Use Cloud Datalab to explore and clean your data."}, {"letter": "D", "text": "Connect Cloud Dataprep to your on-premises systems. Use Cloud Dataprep to explore and clean your data."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7267-exam-professional-cloud-architect-topic-1-question-48/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Dataflow/Dataproc"]}, {"id": "T1-Q49", "topic": 1, "qnum": 49, "question": "Google Cloud Platform resources are managed hierarchically using organization, folders, and projects. When Cloud Identity and Access Management (IAM) policies exist at these different levels, what is the effective policy at a particular node of the hierarchy?", "options": [{"letter": "A", "text": "The effective policy is determined only by the policy set at the node"}, {"letter": "B", "text": "The effective policy is the policy set at the node and restricted by the policies of its ancestors"}, {"letter": "C", "text": "The effective policy is the union of the policy set at the node and policies inherited from its ancestors"}, {"letter": "D", "text": "The effective policy is the intersection of the policy set at the node and policies inherited from its ancestors"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6846-exam-professional-cloud-architect-topic-1-question-49/", "postedDate": "2019-10-20", "postedYear": 2019, "tags": ["IAM", "Organization Policy"]}, {"id": "T1-Q50", "topic": 1, "qnum": 50, "question": "You are migrating your on-premises solution to Google Cloud in several phases. You will use Cloud VPN to maintain a connection between your on-premises systems and Google Cloud until the migration is completed. You want to make sure all your on-premise systems remain reachable during this period. How should you organize your networking in Google Cloud?", "options": [{"letter": "A", "text": "Use the same IP range on Google Cloud as you use on-premises"}, {"letter": "B", "text": "Use the same IP range on Google Cloud as you use on-premises for your primary IP range and use a secondary range that does not overlap with the range you use on-premises"}, {"letter": "C", "text": "Use an IP range on Google Cloud that does not overlap with the range you use on-premises"}, {"letter": "D", "text": "Use an IP range on Google Cloud that does not overlap with the range you use on-premises for your primary IP range and use a secondary range with the same IP range as you use on-premises"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7042-exam-professional-cloud-architect-topic-1-question-50/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["Interconnect/VPN", "VPC/網路", "資料遷移"]}, {"id": "T1-Q51", "topic": 1, "qnum": 51, "question": "You have found an error in your App Engine application caused by missing Cloud Datastore indexes. You have created a YAML file with the required indexes and want to deploy these new indexes to Cloud Datastore. What should you do?", "options": [{"letter": "A", "text": "Point gcloud datastore create-indexes to your configuration file"}, {"letter": "B", "text": "Upload the configuration file to App Engine's default Cloud Storage bucket, and have App Engine detect the new indexes"}, {"letter": "C", "text": "In the GCP Console, use Datastore Admin to delete the current indexes and upload the new configuration file"}, {"letter": "D", "text": "Create an HTTP request to the built-in python module to send the index configuration file to your application"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7231-exam-professional-cloud-architect-topic-1-question-51/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Datastore/Firestore", "App Engine"]}, {"id": "T1-Q52", "topic": 1, "qnum": 52, "question": "You have an application that will run on Compute Engine. You need to design an architecture that takes into account a disaster recovery plan that requires your application to fail over to another region in case of a regional outage. What should you do?", "options": [{"letter": "A", "text": "Deploy the application on two Compute Engine instances in the same project but in a different region. Use the first instance to serve traffic, and use the HTTP load balancing service to fail over to the standby instance in case of a disaster."}, {"letter": "B", "text": "Deploy the application on a Compute Engine instance. Use the instance to serve traffic, and use the HTTP load balancing service to fail over to an instance on your premises in case of a disaster."}, {"letter": "C", "text": "Deploy the application on two Compute Engine instance groups, each in the same project but in a different region. Use the first instance group to serve traffic, and use the HTTP load balancing service to fail over to the standby instance group in case of a disaster."}, {"letter": "D", "text": "Deploy the application on two Compute Engine instance groups, each in a separate project and a different region. Use the first instance group to serve traffic, and use the HTTP load balancing service to fail over to the standby instance group in case of a disaster."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7273-exam-professional-cloud-architect-topic-1-question-52/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Compute Engine", "Load Balancing", "高可用性/災難復原", "多區域架構"]}, {"id": "T1-Q53", "topic": 1, "qnum": 53, "question": "You are deploying an application on App Engine that needs to integrate with an on-premises database. For security purposes, your on-premises database must not be accessible through the public internet. What should you do?", "options": [{"letter": "A", "text": "Deploy your application on App Engine standard environment and use App Engine firewall rules to limit access to the open on-premises database."}, {"letter": "B", "text": "Deploy your application on App Engine standard environment and use Cloud VPN to limit access to the on-premises database."}, {"letter": "C", "text": "Deploy your application on App Engine flexible environment and use App Engine firewall rules to limit access to the on-premises database."}, {"letter": "D", "text": "Deploy your application on App Engine flexible environment and use Cloud VPN to limit access to the on-premises database."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6314-exam-professional-cloud-architect-topic-1-question-53/", "postedDate": "2019-10-09", "postedYear": 2019, "tags": ["App Engine", "Interconnect/VPN", "安全性"]}, {"id": "T1-Q54", "topic": 1, "qnum": 54, "question": "You are working in a highly secured environment where public Internet access from the Compute Engine VMs is not allowed. You do not yet have a VPN connection to access an on-premises file server. You need to install specific software on a Compute Engine instance. How should you install the software?", "options": [{"letter": "A", "text": "Upload the required installation files to Cloud Storage. Configure the VM on a subnet with a Private Google Access subnet. Assign only an internal IP address to the VM. Download the installation files to the VM using gsutil."}, {"letter": "B", "text": "Upload the required installation files to Cloud Storage and use firewall rules to block all traffic except the IP address range for Cloud Storage. Download the files to the VM using gsutil."}, {"letter": "C", "text": "Upload the required installation files to Cloud Source Repositories. Configure the VM on a subnet with a Private Google Access subnet. Assign only an internal IP address to the VM. Download the installation files to the VM using gcloud."}, {"letter": "D", "text": "Upload the required installation files to Cloud Source Repositories and use firewall rules to block all traffic except the IP address range for Cloud Source Repositories. Download the files to the VM using gsutil."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7180-exam-professional-cloud-architect-topic-1-question-54/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["VPC/網路", "Cloud Storage", "安全性"]}, {"id": "T1-Q55", "topic": 1, "qnum": 55, "question": "Your company is moving 75 TB of data into Google Cloud. You want to use Cloud Storage and follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Move your data onto a Transfer Appliance. Use a Transfer Appliance Rehydrator to decrypt the data into Cloud Storage."}, {"letter": "B", "text": "Move your data onto a Transfer Appliance. Use Cloud Dataprep to decrypt the data into Cloud Storage."}, {"letter": "C", "text": "Install gsutil on each server that contains data. Use resumable transfers to upload the data into Cloud Storage."}, {"letter": "D", "text": "Install gsutil on each server containing data. Use streaming transfers to upload the data into Cloud Storage."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7043-exam-professional-cloud-architect-topic-1-question-55/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["Cloud Storage", "資料遷移"]}, {"id": "T1-Q56", "topic": 1, "qnum": 56, "question": "You have an application deployed on Google Kubernetes Engine using a Deployment named echo-deployment. The deployment is exposed using a Service called echo-service. You need to perform an update to the application with minimal downtime to the application. What should you do?", "options": [{"letter": "A", "text": "Use kubectl set image deployment/echo-deployment <!-- raw HTML omitted -->"}, {"letter": "B", "text": "Use the rolling update functionality of the Instance Group behind the Kubernetes cluster"}, {"letter": "C", "text": "Update the deployment yaml file with the new container image. Use kubectl delete deployment/echo-deployment and kubectl create ג€\"f <!-- raw HTML omitted -->"}, {"letter": "D", "text": "Update the service yaml file which the new container image. Use kubectl delete service/echo-service and kubectl create ג€\"f <!-- raw HTML omitted -->"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7184-exam-professional-cloud-architect-topic-1-question-56/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["GKE/Kubernetes", "容器化"]}, {"id": "T1-Q57", "topic": 1, "qnum": 57, "question": "Your company is using BigQuery as its enterprise data warehouse. Data is distributed over several Google Cloud projects. All queries on BigQuery need to be billed on a single project. You want to make sure that no query costs are incurred on the projects that contain the data. Users should be able to query the datasets, but not edit them.How should you configure users' access roles?", "options": [{"letter": "A", "text": "Add all users to a group. Grant the group the role of BigQuery user on the billing project and BigQuery dataViewer on the projects that contain the data."}, {"letter": "B", "text": "Add all users to a group. Grant the group the roles of BigQuery dataViewer on the billing project and BigQuery user on the projects that contain the data."}, {"letter": "C", "text": "Add all users to a group. Grant the group the roles of BigQuery jobUser on the billing project and BigQuery dataViewer on the projects that contain the data."}, {"letter": "D", "text": "Add all users to a group. Grant the group the roles of BigQuery dataViewer on the billing project and BigQuery jobUser on the projects that contain the data."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68708-exam-professional-cloud-architect-topic-1-question-57/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["BigQuery", "IAM", "成本優化"], "keywords": ["BigQuery billed on a single project", "no query costs incurred on the projects that contain the data", "query but not edit", "jobUser", "dataViewer"], "explanation": {"questionZh": "公司使用 BigQuery 作為企業資料倉儲，資料分散在好幾個 GCP 專案裡。所有 BigQuery 的查詢都必須統一記到「一個」專案做計費。你要確保存放資料的那些專案完全不會產生查詢費用，使用者應該能查詢資料集，但不能編輯。該如何設定使用者的存取角色？", "optionTable": [{"letter": "A", "analysis": "方向大致對，但 billing 專案給的是 user 角色而非 jobUser。user 角色除了能建立查詢工作外，還多包含「在該專案建立新資料集」的權限，等同多給了一種編輯能力，超出題目「不能編輯」的要求，不符合最小權限原則。", "zh": "將所有使用者加入一個群組，在 billing 專案授予該群組 BigQuery user 角色，在存放資料的專案授予 BigQuery dataViewer 角色"}, {"letter": "B", "analysis": "方向完全反了，且有嚴重問題：資料專案被授予 user 角色，其中包含「建立查詢工作」的權限，代表使用者可以直接在資料專案裡執行查詢並產生計費，直接違反「資料專案不能產生查詢費用」的要求；billing 專案給 dataViewer 也沒有意義，因為 billing 專案通常本身沒有資料需要讀取。", "zh": "將所有使用者加入一個群組，在 billing 專案授予該群組 BigQuery dataViewer 角色，在存放資料的專案授予 BigQuery user 角色"}, {"letter": "C", "analysis": "正確。jobUser 只有「建立並執行查詢工作」的權限，沒有任何讀取資料的能力；dataViewer 只有「讀取資料」的權限，沒有任何建立查詢工作的能力。兩者分別授予在不同專案上，查詢工作只能在 billing 專案建立（所有費用記在這裡），資料專案完全沒有建立工作的權限，因此不可能在資料專案產生任何查詢費用。", "zh": "將所有使用者加入一個群組，在 billing 專案授予該群組 BigQuery jobUser 角色，在存放資料的專案授予 BigQuery dataViewer 角色"}, {"letter": "D", "analysis": "資料專案被授予 jobUser，代表可以在資料專案裡建立查詢工作並計費，違反「資料專案不能產生查詢費用」的要求；billing 專案給 dataViewer 同樣沒有意義。", "zh": "將所有使用者加入一個群組，在 billing 專案授予該群組 BigQuery dataViewer 角色，在存放資料的專案授予 BigQuery jobUser 角色"}], "notes": [{"heading": "題目在問什麼", "body": "要把「查詢費用的計費歸屬」和「資料的讀取權限」分開配置：費用必須永遠記在指定的單一 billing 專案，資料所在的專案完全不能有任何計費行為發生，同時使用者不能有編輯資料的能力。"}, {"heading": "核心概念：在 BigQuery 裡，「誰付錢」跟「資料放在哪」是分開的兩件事", "body": "可以想成要查別家公司檔案室的文件，但希望查詢的工時費記在自己公司帳上，不讓對方公司付錢。需要兩張不同的通行證：「進檔案室看文件的通行證」（dataViewer，給在資料專案，只能看、不能動，本身不產生費用）和「開工作單、費用記到自己公司帳上的授權」（jobUser，給在 billing 專案，這才是真正執行查詢並決定記帳位置的動作）。查詢時用 billing 專案的 jobUser 開工作單，工作單裡讀取資料專案的表，因為也有該資料專案的 dataViewer，所以能讀到資料，但費用只會記在開工作單的 billing 專案，跟資料放在哪個專案無關。"}, {"heading": "核心概念：jobUser 和 dataViewer 完全獨立、互不重疊，缺一不可", "body": "jobUser 只包含「建立/查看查詢工作」的權限（bigquery.jobs.create 等），完全沒有讀取資料表內容的權限；dataViewer 只包含「讀取資料表/資料集內容」的權限（bigquery.tables.getData 等），完全沒有建立查詢工作的權限。只有 jobUser 沒有 dataViewer，查詢工作建立後會因為沒有讀取權限被拒絕；只有 dataViewer 沒有 jobUser，則連「開始查詢」這個動作都做不到。因此跨專案查詢架構必須同時持有兩張通行證，缺一不可。"}, {"heading": "為什麼 A 選項不行：user 角色範圍比 jobUser 大", "body": "BigQuery user 角色除了具備 jobUser 的「建立查詢工作」權限外，還額外包含「在該專案建立新資料集」（bigquery.datasets.create）等權限。建立資料集本身是一種編輯/寫入行為，超出題目「使用者不能編輯」的限制，屬於權限範圍過大，不符合最小權限原則，因此即使方向（billing 歸 billing、資料歸資料）是對的，角色選得不夠精確也會被判定錯誤。"}, {"heading": "延伸補充：「查詢」不等於「列出/查看資料集」，是兩個不同層次", "body": "查看/列出資料集只是看「有哪些資料集、表的結構（schema）」這類目錄資訊，不會啟動運算，幾乎不產生費用，對應 dataViewer 權限；查詢（query）則是真正啟動一個會掃描、運算資料的工作（job），這才是會產生費用的動作，需要額外的 bigquery.jobs.create 權限（在 jobUser 裡）。即使有 dataViewer 能看到資料的實際內容，仍然沒有「執行查詢」的能力，兩者是完全獨立的權限維度。"}, {"heading": "延伸補充：user 角色的「列出/查看」只到基本資訊層，讀不到資料實際內容", "body": "user 角色雖然也包含「列出/查看資料集」的能力，但那只是「知道有哪些資料集/表存在、schema 是什麼」這種目錄層級的資訊（第一層），並不包含 bigquery.tables.getData 這種能真正讀到資料表「裡面實際內容」的權限（第二層）。只有 dataViewer 才具備第二層的讀取能力。這也是為什麼 Q57 正確答案一定要額外在資料專案給 dataViewer，光靠 billing 專案的 user 或 jobUser 都無法讀到查詢結果裡真正的資料數值。"}, {"heading": "延伸補充：三個角色的重疊關係與 IAM 疊加機制", "body": "user 角色完全包含 jobUser 的全部權限（建立查詢工作），再加碼「建立新資料集」與「看到資料集基本資訊」，所以 user 是 jobUser 的加強版，兩者疊加沒有意義。user 和 dataViewer 在「看到資料集基本資訊」上有重疊，但各自有獨有能力：dataViewer 獨有「讀取資料實際內容」，user 獨有「建立新資料集/查詢工作」。GCP IAM 的權限本質是疊加（additive）：一個使用者最終的權限等於所有被賦予角色的權限聯集，角色之間不互斥。可以在同一個資源上疊加多個角色，也可以像 Q57 一樣，在不同資源（不同專案）上分別給予不同角色，組合出剛好符合需求的精準權限範圍。"}]}}, {"id": "T1-Q58", "topic": 1, "qnum": 58, "question": "You have developed an application using Cloud ML Engine that recognizes famous paintings from uploaded images. You want to test the application and allow specific people to upload images for the next 24 hours. Not all users have a Google Account. How should you have users upload images?", "options": [{"letter": "A", "text": "Have users upload the images to Cloud Storage. Protect the bucket with a password that expires after 24 hours."}, {"letter": "B", "text": "Have users upload the images to Cloud Storage using a signed URL that expires after 24 hours."}, {"letter": "C", "text": "Create an App Engine web application where users can upload images. Configure App Engine to disable the application after 24 hours. Authenticate users via Cloud Identity."}, {"letter": "D", "text": "Create an App Engine web application where users can upload images for the next 24 hours. Authenticate users via Cloud Identity."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6889-exam-professional-cloud-architect-topic-1-question-58/", "postedDate": "2019-10-21", "postedYear": 2019, "tags": ["Cloud Storage", "安全性"]}, {"id": "T1-Q59", "topic": 1, "qnum": 59, "question": "Your web application must comply with the requirements of the European Union's General Data Protection Regulation (GDPR). You are responsible for the technical architecture of your web application. What should you do?", "options": [{"letter": "A", "text": "Ensure that your web application only uses native features and services of Google Cloud Platform, because Google already has various certifications and provides ג€pass-onג€ compliance when you use native features."}, {"letter": "B", "text": "Enable the relevant GDPR compliance setting within the GCPConsole for each of the services in use within your application."}, {"letter": "C", "text": "Ensure that Cloud Security Scanner is part of your test planning strategy in order to pick up any compliance gaps."}, {"letter": "D", "text": "Define a design for the security of data in your web application that meets GDPR requirements."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7285-exam-professional-cloud-architect-topic-1-question-59/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["合規性", "安全性"]}, {"id": "T1-Q60", "topic": 1, "qnum": 60, "question": "You need to set up Microsoft SQL Server on GCP. Management requires that there's no downtime in case of a data center outage in any of the zones within aGCP region. What should you do?", "options": [{"letter": "A", "text": "Configure a Cloud SQL instance with high availability enabled."}, {"letter": "B", "text": "Configure a Cloud Spanner instance with a regional instance configuration."}, {"letter": "C", "text": "Set up SQL Server on Compute Engine, using Always On Availability Groups using Windows Failover Clustering. Place nodes in different subnets."}, {"letter": "D", "text": "Set up SQL Server Always On Availability Groups using Windows Failover Clustering. Place nodes in different zones."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6443-exam-professional-cloud-architect-topic-1-question-60/", "postedDate": "2019-10-11", "postedYear": 2019, "tags": ["Compute Engine", "Cloud SQL", "高可用性/災難復原"]}, {"id": "T1-Q61", "topic": 1, "qnum": 61, "question": "The development team has provided you with a Kubernetes Deployment file. You have no infrastructure yet and need to deploy the application. What should you do?", "options": [{"letter": "A", "text": "Use gcloud to create a Kubernetes cluster. Use Deployment Manager to create the deployment."}, {"letter": "B", "text": "Use gcloud to create a Kubernetes cluster. Use kubectl to create the deployment."}, {"letter": "C", "text": "Use kubectl to create a Kubernetes cluster. Use Deployment Manager to create the deployment."}, {"letter": "D", "text": "Use kubectl to create a Kubernetes cluster. Use kubectl to create the deployment."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6330-exam-professional-cloud-architect-topic-1-question-61/", "postedDate": "2019-10-09", "postedYear": 2019, "tags": ["GKE/Kubernetes", "容器化"]}, {"id": "T1-Q62", "topic": 1, "qnum": 62, "question": "You need to evaluate your team readiness for a new GCP project. You must perform the evaluation and create a skills gap plan which incorporates the business goal of cost optimization. Your team has deployed two GCP projects successfully to date. What should you do?", "options": [{"letter": "A", "text": "Allocate budget for team training. Set a deadline for the new GCP project."}, {"letter": "B", "text": "Allocate budget for team training. Create a roadmap for your team to achieve Google Cloud certification based on job role."}, {"letter": "C", "text": "Allocate budget to hire skilled external consultants. Set a deadline for the new GCP project."}, {"letter": "D", "text": "Allocate budget to hire skilled external consultants. Create a roadmap for your team to achieve Google Cloud certification based on job role."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8373-exam-professional-cloud-architect-topic-1-question-62/", "postedDate": "2019-11-17", "postedYear": 2019, "tags": ["成本優化"]}, {"id": "T1-Q63", "topic": 1, "qnum": 63, "question": "You are designing an application for use only during business hours. For the minimum viable product release, you'd like to use a managed product that automatically <code>scales to zero</code> so you don't incur costs when there is no activity.Which primary compute resource should you choose?", "options": [{"letter": "A", "text": "Cloud Functions"}, {"letter": "B", "text": "Compute Engine"}, {"letter": "C", "text": "Google Kubernetes Engine"}, {"letter": "D", "text": "AppEngine flexible environment"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68714-exam-professional-cloud-architect-topic-1-question-63/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "無伺服器", "自動擴縮"]}, {"id": "T1-Q64", "topic": 1, "qnum": 64, "question": "You are creating an App Engine application that uses Cloud Datastore as its persistence layer. You need to retrieve several root entities for which you have the identifiers. You want to minimize the overhead in operations performed by Cloud Datastore. What should you do?", "options": [{"letter": "A", "text": "Create the Key object for each Entity and run a batch get operation"}, {"letter": "B", "text": "Create the Key object for each Entity and run multiple get operations, one operation for each entity"}, {"letter": "C", "text": "Use the identifiers to create a query filter and run a batch query operation"}, {"letter": "D", "text": "Use the identifiers to create a query filter and run multiple query operations, one operation for each entity"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7290-exam-professional-cloud-architect-topic-1-question-64/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Datastore/Firestore", "效能調校"]}, {"id": "T1-Q65", "topic": 1, "qnum": 65, "question": "You need to upload files from your on-premises environment to Cloud Storage. You want the files to be encrypted on Cloud Storage using customer-supplied encryption keys. What should you do?", "options": [{"letter": "A", "text": "Supply the encryption key in a .boto configuration file. Use gsutil to upload the files."}, {"letter": "B", "text": "Supply the encryption key using gcloud config. Use gsutil to upload the files to that bucket."}, {"letter": "C", "text": "Use gsutil to upload the files, and use the flag --encryption-key to supply the encryption key."}, {"letter": "D", "text": "Use gsutil to create a bucket, and use the flag --encryption-key to supply the encryption key. Use gsutil to upload the files to that bucket."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6308-exam-professional-cloud-architect-topic-1-question-65/", "postedDate": "2019-10-09", "postedYear": 2019, "tags": ["Cloud Storage", "Cloud KMS/加密", "安全性"]}, {"id": "T1-Q66", "topic": 1, "qnum": 66, "question": "Your customer wants to capture multiple GBs of aggregate real-time key performance indicators (KPIs) from their game servers running on Google Cloud Platform and monitor the KPIs with low latency. How should they capture the KPIs?", "options": [{"letter": "A", "text": "Store time-series data from the game servers in Google Bigtable, and view it using Google Data Studio."}, {"letter": "B", "text": "Output custom metrics to Stackdriver from the game servers, and create a Dashboard in Stackdriver Monitoring Console to view them."}, {"letter": "C", "text": "Schedule BigQuery load jobs to ingest analytics files uploaded to Cloud Storage every ten minutes, and visualize the results in Google Data Studio."}, {"letter": "D", "text": "Insert the KPIs into Cloud Datastore entities, and run ad hoc analysis and visualizations of them in Cloud Datalab."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9222-exam-professional-cloud-architect-topic-1-question-66/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q67", "topic": 1, "qnum": 67, "question": "You have a Python web application with many dependencies that requires 0.1 CPU cores and 128 MB of memory to operate in production. You want to monitor and maximize machine utilization. You also want to reliably deploy new versions of the application. Which set of steps should you take?", "options": [{"letter": "A", "text": "Perform the following: 1. Create a managed instance group with f1-micro type machines. 2. Use a startup script to clone the repository, check out the production branch, install the dependencies, and start the Python app. 3. Restart the instances to automatically deploy new production releases."}, {"letter": "B", "text": "Perform the following: 1. Create a managed instance group with n1-standard-1 type machines. 2. Build a Compute Engine image from the production branch that contains all of the dependencies and automatically starts the Python app. 3. Rebuild the Compute Engine image, and update the instance template to deploy new production releases."}, {"letter": "C", "text": "Perform the following: 1. Create a Google Kubernetes Engine (GKE) cluster with n1-standard-1 type machines. 2. Build a Docker image from the production branch with all of the dependencies, and tag it with the version number. 3. Create a Kubernetes Deployment with the imagePullPolicy set to 'IfNotPresent' in the staging namespace, and then promote it to the production namespace after testing."}, {"letter": "D", "text": "Perform the following: 1. Create a GKE cluster with n1-standard-4 type machines. 2. Build a Docker image from the master branch with all of the dependencies, and tag it with 'latest'. 3. Create a Kubernetes Deployment in the default namespace with the imagePullPolicy set to 'Always'. Restart the pods to automatically deploy new production releases."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6890-exam-professional-cloud-architect-topic-1-question-67/", "postedDate": "2019-10-21", "postedYear": 2019, "tags": ["GKE/Kubernetes", "容器化", "CI/CD", "效能調校"]}, {"id": "T1-Q68", "topic": 1, "qnum": 68, "question": "Your company wants to start using Google Cloud resources but wants to retain their on-premises Active Directory domain controller for identity management.What should you do?", "options": [{"letter": "A", "text": "Use the Admin Directory API to authenticate against the Active Directory domain controller."}, {"letter": "B", "text": "Use Google Cloud Directory Sync to synchronize Active Directory usernames with cloud identities and configure SAML SSO."}, {"letter": "C", "text": "Use Cloud Identity-Aware Proxy configured to use the on-premises Active Directory domain controller as an identity provider."}, {"letter": "D", "text": "Use Compute Engine to create an Active Directory (AD) domain controller that is a replica of the on-premises AD domain controller using Google Cloud Directory Sync."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6528-exam-professional-cloud-architect-topic-1-question-68/", "postedDate": "2019-10-13", "postedYear": 2019, "tags": ["IAM", "混合雲", "安全性"]}, {"id": "T1-Q69", "topic": 1, "qnum": 69, "question": "You are running a cluster on Kubernetes Engine (GKE) to serve a web application. Users are reporting that a specific part of the application is not responding anymore. You notice that all pods of your deployment keep restarting after 2 seconds. The application writes logs to standard output. You want to inspect the logs to find the cause of the issue. Which approach can you take?", "options": [{"letter": "A", "text": "Review the Stackdriver logs for each Compute Engine instance that is serving as a node in the cluster."}, {"letter": "B", "text": "Review the Stackdriver logs for the specific GKE container that is serving the unresponsive part of the application."}, {"letter": "C", "text": "Connect to the cluster using gcloud credentials and connect to a container in one of the pods to read the logs."}, {"letter": "D", "text": "Review the Serial Port logs for each Compute Engine instance that is serving as a node in the cluster."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6892-exam-professional-cloud-architect-topic-1-question-69/", "postedDate": "2019-10-21", "postedYear": 2019, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q70", "topic": 1, "qnum": 70, "question": "You are using a single Cloud SQL instance to serve your application from a specific zone. You want to introduce high availability. What should you do?", "options": [{"letter": "A", "text": "Create a read replica instance in a different region"}, {"letter": "B", "text": "Create a failover replica instance in a different region"}, {"letter": "C", "text": "Create a read replica instance in the same region, but in a different zone"}, {"letter": "D", "text": "Create a failover replica instance in the same region, but in a different zone"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11815-exam-professional-cloud-architect-topic-1-question-70/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["Cloud SQL", "高可用性/災難復原"]}, {"id": "T1-Q71", "topic": 1, "qnum": 71, "question": "Your company is running a stateless application on a Compute Engine instance. The application is used heavily during regular business hours and lightly outside of business hours. Users are reporting that the application is slow during peak hours. You need to optimize the application's performance. What should you do?", "options": [{"letter": "A", "text": "Create a snapshot of the existing disk. Create an instance template from the snapshot. Create an autoscaled managed instance group from the instance template."}, {"letter": "B", "text": "Create a snapshot of the existing disk. Create a custom image from the snapshot. Create an autoscaled managed instance group from the custom image."}, {"letter": "C", "text": "Create a custom image from the existing disk. Create an instance template from the custom image. Create an autoscaled managed instance group from the instance template."}, {"letter": "D", "text": "Create an instance template from the existing disk. Create a custom image from the instance template. Create an autoscaled managed instance group from the custom image."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11301-exam-professional-cloud-architect-topic-1-question-71/", "postedDate": "2020-01-03", "postedYear": 2020, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q72", "topic": 1, "qnum": 72, "question": "Your web application has several VM instances running within a VPC. You want to restrict communications between instances to only the paths and ports you authorize, but you don't want to rely on static IP addresses or subnets because the app can autoscale. How should you restrict communications?", "options": [{"letter": "A", "text": "Use separate VPCs to restrict traffic"}, {"letter": "B", "text": "Use firewall rules based on network tags attached to the compute instances"}, {"letter": "C", "text": "Use Cloud DNS and only allow connections from authorized hostnames"}, {"letter": "D", "text": "Use service accounts and configure the web application to authorize particular service accounts to have access"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11816-exam-professional-cloud-architect-topic-1-question-72/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["VPC/網路", "安全性"]}, {"id": "T1-Q73", "topic": 1, "qnum": 73, "question": "You are using Cloud SQL as the database backend for a large CRM deployment. You want to scale as usage increases and ensure that you don't run out of storage, maintain 75% CPU usage cores, and keep replication lag below 60 seconds. What are the correct steps to meet your requirements?", "options": [{"letter": "A", "text": "1. Enable automatic storage increase for the instance. 2. Create a Stackdriver alert when CPU usage exceeds 75%, and change the instance type to reduce CPU usage. 3. Create a Stackdriver alert for replication lag, and shard the database to reduce replication time."}, {"letter": "B", "text": "1. Enable automatic storage increase for the instance. 2. Change the instance type to a 32-core machine type to keep CPU usage below 75%. 3. Create a Stackdriver alert for replication lag, and deploy memcache to reduce load on the master."}, {"letter": "C", "text": "1. Create a Stackdriver alert when storage exceeds 75%, and increase the available storage on the instance to create more space. 2. Deploy memcached to reduce CPU load. 3. Change the instance type to a 32-core machine type to reduce replication lag."}, {"letter": "D", "text": "1. Create a Stackdriver alert when storage exceeds 75%, and increase the available storage on the instance to create more space. 2. Deploy memcached to reduce CPU load. 3. Create a Stackdriver alert for replication lag, and change the instance type to a 32-core machine type to reduce replication lag."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6529-exam-professional-cloud-architect-topic-1-question-73/", "postedDate": "2019-10-13", "postedYear": 2019, "tags": ["Cloud SQL", "監控與可觀測性", "自動擴縮"]}, {"id": "T1-Q74", "topic": 1, "qnum": 74, "question": "You are tasked with building an online analytical processing (OLAP) marketing analytics and reporting tool. This requires a relational database that can operate on hundreds of terabytes of data. What is the Google-recommended tool for such applications?", "options": [{"letter": "A", "text": "Cloud Spanner, because it is globally distributed"}, {"letter": "B", "text": "Cloud SQL, because it is a fully managed relational database"}, {"letter": "C", "text": "Cloud Firestore, because it offers real-time synchronization across devices"}, {"letter": "D", "text": "BigQuery, because it is designed for large-scale processing of tabular data"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11817-exam-professional-cloud-architect-topic-1-question-74/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["BigQuery", "資料庫Schema設計"]}, {"id": "T1-Q75", "topic": 1, "qnum": 75, "question": "You have deployed an application to Google Kubernetes Engine (GKE), and are using the Cloud SQL proxy container to make the Cloud SQL database available to the services running on Kubernetes. You are notified that the application is reporting database connection issues. Your company policies require a post- mortem. What should you do?", "options": [{"letter": "A", "text": "Use gcloud sql instances restart."}, {"letter": "B", "text": "Validate that the Service Account used by the Cloud SQL proxy container still has the Cloud Build Editor role."}, {"letter": "C", "text": "In the GCP Console, navigate to Stackdriver Logging. Consult logs for (GKE) and Cloud SQL."}, {"letter": "D", "text": "In the GCP Console, navigate to Cloud SQL. Restore the latest backup. Use kubectl to restart all pods."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6452-exam-professional-cloud-architect-topic-1-question-75/", "postedDate": "2019-10-11", "postedYear": 2019, "tags": ["GKE/Kubernetes", "Cloud SQL", "Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q76", "topic": 1, "qnum": 76, "question": "Your company pushes batches of sensitive transaction data from its application server VMs to Cloud Pub/Sub for processing and storage. What is the Google- recommended way for your application to authenticate to the required Google Cloud services?", "options": [{"letter": "A", "text": "Ensure that VM service accounts are granted the appropriate Cloud Pub/Sub IAM roles."}, {"letter": "B", "text": "Ensure that VM service accounts do not have access to Cloud Pub/Sub, and use VM access scopes to grant the appropriate Cloud Pub/Sub IAM roles."}, {"letter": "C", "text": "Generate an OAuth2 access token for accessing Cloud Pub/Sub, encrypt it, and store it in Cloud Storage for access from each VM."}, {"letter": "D", "text": "Create a gateway to Cloud Pub/Sub using a Cloud Function, and grant the Cloud Function service account the appropriate Cloud Pub/Sub IAM roles."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11818-exam-professional-cloud-architect-topic-1-question-76/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["Pub/Sub", "IAM", "安全性"]}, {"id": "T1-Q77", "topic": 1, "qnum": 77, "question": "You want to establish a Compute Engine application in a single VPC across two regions. The application must communicate over VPN to an on-premises network.How should you deploy the VPN?", "options": [{"letter": "A", "text": "Use VPC Network Peering between the VPC and the on-premises network."}, {"letter": "B", "text": "Expose the VPC to the on-premises network using IAM and VPC Sharing."}, {"letter": "C", "text": "Create a global Cloud VPN Gateway with VPN tunnels from each region to the on-premises peer gateway."}, {"letter": "D", "text": "Deploy Cloud VPN Gateway in each region. Ensure that each region has at least one VPN tunnel to the on-premises peer gateway."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11819-exam-professional-cloud-architect-topic-1-question-77/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["Interconnect/VPN", "VPC/網路", "多區域架構"]}, {"id": "T1-Q78", "topic": 1, "qnum": 78, "question": "Your applications will be writing their logs to BigQuery for analysis. Each application should have its own table. Any logs older than 45 days should be removed.You want to optimize storage and follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Configure the expiration time for your tables at 45 days"}, {"letter": "B", "text": "Make the tables time-partitioned, and configure the partition expiration at 45 days"}, {"letter": "C", "text": "Rely on BigQuery's default behavior to prune application logs older than 45 days"}, {"letter": "D", "text": "Create a script that uses the BigQuery command line tool (bq) to remove records older than 45 days"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6455-exam-professional-cloud-architect-topic-1-question-78/", "postedDate": "2019-10-11", "postedYear": 2019, "tags": ["BigQuery", "成本優化"]}, {"id": "T1-Q79", "topic": 1, "qnum": 79, "question": "You want your Google Kubernetes Engine cluster to automatically add or remove nodes based on CPU load.What should you do?", "options": [{"letter": "A", "text": "Configure a HorizontalPodAutoscaler with a target CPU usage. Enable the Cluster Autoscaler from the GCP Console."}, {"letter": "B", "text": "Configure a HorizontalPodAutoscaler with a target CPU usage. Enable autoscaling on the managed instance group for the cluster using the gcloud command."}, {"letter": "C", "text": "Create a deployment and set the maxUnavailable and maxSurge properties. Enable the Cluster Autoscaler using the gcloud command."}, {"letter": "D", "text": "Create a deployment and set the maxUnavailable and maxSurge properties. Enable autoscaling on the cluster managed instance group from the GCP Console."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7323-exam-professional-cloud-architect-topic-1-question-79/", "postedDate": "2019-10-27", "postedYear": 2019, "tags": ["GKE/Kubernetes", "自動擴縮"]}, {"id": "T1-Q80", "topic": 1, "qnum": 80, "question": "You need to develop procedures to verify resilience of disaster recovery for remote recovery using GCP. Your production environment is hosted on-premises. You need to establish a secure, redundant connection between your on-premises network and the GCP network.What should you do?", "options": [{"letter": "A", "text": "Verify that Dedicated Interconnect can replicate files to GCP. Verify that direct peering can establish a secure connection between your networks if Dedicated Interconnect fails."}, {"letter": "B", "text": "Verify that Dedicated Interconnect can replicate files to GCP. Verify that Cloud VPN can establish a secure connection between your networks if Dedicated Interconnect fails."}, {"letter": "C", "text": "Verify that the Transfer Appliance can replicate files to GCP. Verify that direct peering can establish a secure connection between your networks if the Transfer Appliance fails."}, {"letter": "D", "text": "Verify that the Transfer Appliance can replicate files to GCP. Verify that Cloud VPN can establish a secure connection between your networks if the Transfer Appliance fails."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6399-exam-professional-cloud-architect-topic-1-question-80/", "postedDate": "2019-10-10", "postedYear": 2019, "tags": ["Interconnect/VPN", "高可用性/災難復原"]}, {"id": "T1-Q81", "topic": 1, "qnum": 81, "question": "Your company operates nationally and plans to use GCP for multiple batch workloads, including some that are not time-critical. You also need to use GCP services that are HIPAA-certified and manage service costs.How should you design to meet Google best practices?", "options": [{"letter": "A", "text": "Provision preemptible VMs to reduce cost. Discontinue use of all GCP services and APIs that are not HIPAA-compliant."}, {"letter": "B", "text": "Provision preemptible VMs to reduce cost. Disable and then discontinue use of all GCP services and APIs that are not HIPAA-compliant."}, {"letter": "C", "text": "Provision standard VMs in the same region to reduce cost. Discontinue use of all GCP services and APIs that are not HIPAA-compliant."}, {"letter": "D", "text": "Provision standard VMs to the same region to reduce cost. Disable and then discontinue use of all GCP services and APIs that are not HIPAA-compliant."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6896-exam-professional-cloud-architect-topic-1-question-81/", "postedDate": "2019-10-21", "postedYear": 2019, "tags": ["Compute Engine", "合規性", "成本優化"]}, {"id": "T1-Q82", "topic": 1, "qnum": 82, "question": "Your customer wants to do resilience testing of their authentication layer. This consists of a regional managed instance group serving a public REST API that reads from and writes to a Cloud SQL instance.What should you do?", "options": [{"letter": "A", "text": "Engage with a security company to run web scrapers that look your for users' authentication data om malicious websites and notify you if any is found."}, {"letter": "B", "text": "Deploy intrusion detection software to your virtual machines to detect and log unauthorized access."}, {"letter": "C", "text": "Schedule a disaster simulation exercise during which you can shut off all VMs in a zone to see how your application behaves."}, {"letter": "D", "text": "Configure a read replica for your Cloud SQL instance in a different zone than the master, and then manually trigger a failover while monitoring KPIs for our REST API."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6709-exam-professional-cloud-architect-topic-1-question-82/", "postedDate": "2019-10-17", "postedYear": 2019, "tags": ["Cloud SQL", "高可用性/災難復原"]}, {"id": "T1-Q83", "topic": 1, "qnum": 83, "question": "Your BigQuery project has several users. For audit purposes, you need to see how many queries each user ran in the last month. What should you do?", "options": [{"letter": "A", "text": "Connect Google Data Studio to BigQuery. Create a dimension for the users and a metric for the amount of queries per user."}, {"letter": "B", "text": "In the BigQuery interface, execute a query on the JOBS table to get the required information."}, {"letter": "C", "text": "Use 'bq show' to list all jobs. Per job, use 'bq ls' to list job information and get the required information."}, {"letter": "D", "text": "Use Cloud Audit Logging to view Cloud Audit Logs, and create a filter on the query operation to get the required information."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8378-exam-professional-cloud-architect-topic-1-question-83/", "postedDate": "2019-11-17", "postedYear": 2019, "tags": ["BigQuery", "Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q84", "topic": 1, "qnum": 84, "question": "You want to automate the creation of a managed instance group. The VMs have many OS package dependencies. You want to minimize the startup time for newVMs in the instance group.What should you do?", "options": [{"letter": "A", "text": "Use Terraform to create the managed instance group and a startup script to install the OS package dependencies."}, {"letter": "B", "text": "Create a custom VM image with all OS package dependencies. Use Deployment Manager to create the managed instance group with the VM image."}, {"letter": "C", "text": "Use Puppet to create the managed instance group and install the OS package dependencies."}, {"letter": "D", "text": "Use Deployment Manager to create the managed instance group and Ansible to install the OS package dependencies."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6873-exam-professional-cloud-architect-topic-1-question-84/", "postedDate": "2019-10-21", "postedYear": 2019, "tags": ["Compute Engine", "Terraform/IaC", "效能調校"]}, {"id": "T1-Q85", "topic": 1, "qnum": 85, "question": "Your company captures all web traffic data in Google Analytics 360 and stores it in BigQuery. Each country has its own dataset. Each dataset has multiple tables.You want analysts from each country to be able to see and query only the data for their respective countries.How should you configure the access rights?", "options": [{"letter": "A", "text": "Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all_analysts' group the IAM role of BigQuery jobUser. Share the appropriate dataset with view access with each respective analyst country-group."}, {"letter": "B", "text": "Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all_analysts' group the IAM role of BigQuery jobUser. Share the appropriate tables with view access with each respective analyst country-group."}, {"letter": "C", "text": "Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all_analysts' group the IAM role of BigQuery dataViewer. Share the appropriate dataset with view access with each respective analyst country- group."}, {"letter": "D", "text": "Create a group per country. Add analysts to their respective country-groups. Create a single group 'all_analysts', and add all country-groups as members. Grant the 'all_analysts' group the IAM role of BigQuery dataViewer. Share the appropriate table with view access with each respective analyst country-group."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6457-exam-professional-cloud-architect-topic-1-question-85/", "postedDate": "2019-10-11", "postedYear": 2019, "tags": ["BigQuery", "IAM", "安全性"]}, {"id": "T1-Q86", "topic": 1, "qnum": 86, "question": "You have been engaged by your client to lead the migration of their application infrastructure to GCP. One of their current problems is that the on-premises high performance SAN is requiring frequent and expensive upgrades to keep up with the variety of workloads that are identified as follows: 20 TB of log archives retained for legal reasons; 500 GB of VM boot/data volumes and templates; 500 GB of image thumbnails; 200 GB of customer session state data that allows customers to restart sessions even if off-line for several days.Which of the following best reflects your recommendations for a cost-effective storage allocation?", "options": [{"letter": "A", "text": "Local SSD for customer session state data. Lifecycle-managed Cloud Storage for log archives, thumbnails, and VM boot/data volumes."}, {"letter": "B", "text": "Memcache backed by Cloud Datastore for the customer session state data. Lifecycle-managed Cloud Storage for log archives, thumbnails, and VM boot/data volumes."}, {"letter": "C", "text": "Memcache backed by Cloud SQL for customer session state data. Assorted local SSD-backed instances for VM boot/data volumes. Cloud Storage for log archives and thumbnails."}, {"letter": "D", "text": "Memcache backed by Persistent Disk SSD storage for customer session state data. Assorted local SSD-backed instances for VM boot/data volumes. Cloud Storage for log archives and thumbnails."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7468-exam-professional-cloud-architect-topic-1-question-86/", "postedDate": "2019-10-30", "postedYear": 2019, "tags": ["Cloud Storage", "成本優化"]}, {"id": "T1-Q87", "topic": 1, "qnum": 87, "question": "Your web application uses Google Kubernetes Engine to manage several workloads. One workload requires a consistent set of hostnames even after pod scaling and relaunches.Which feature of Kubernetes should you use to accomplish this?", "options": [{"letter": "A", "text": "StatefulSets"}, {"letter": "B", "text": "Role-based access control"}, {"letter": "C", "text": "Container environment variables"}, {"letter": "D", "text": "Persistent Volumes"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7328-exam-professional-cloud-architect-topic-1-question-87/", "postedDate": "2019-10-27", "postedYear": 2019, "tags": ["GKE/Kubernetes", "容器化"]}, {"id": "T1-Q88", "topic": 1, "qnum": 88, "question": "You are using Cloud CDN to deliver static HTTP(S) website content hosted on a Compute Engine instance group. You want to improve the cache hit ratio.What should you do?", "options": [{"letter": "A", "text": "Customize the cache keys to omit the protocol from the key."}, {"letter": "B", "text": "Shorten the expiration time of the cached objects."}, {"letter": "C", "text": "Make sure the HTTP(S) header ג€Cache-Regionג€ points to the closest region of your users."}, {"letter": "D", "text": "Replicate the static content in a Cloud Storage bucket. Point CloudCDN toward a load balancer on that bucket."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9188-exam-professional-cloud-architect-topic-1-question-88/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["Load Balancing", "效能調校", "Cloud CDN"]}, {"id": "T1-Q89", "topic": 1, "qnum": 89, "question": "Your architecture calls for the centralized collection of all admin activity and VM system logs within your project.How should you collect these logs from both VMs and services?", "options": [{"letter": "A", "text": "All admin and VM system logs are automatically collected by Stackdriver."}, {"letter": "B", "text": "Stackdriver automatically collects admin activity logs for most services. The Stackdriver Logging agent must be installed on each instance to collect system logs."}, {"letter": "C", "text": "Launch a custom syslogd compute instance and configure your GCP project and VMs to forward all logs to it."}, {"letter": "D", "text": "Install the Stackdriver Logging agent on a single compute instance and let it collect all audit and access logs for your environment."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6712-exam-professional-cloud-architect-topic-1-question-89/", "postedDate": "2019-10-17", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q90", "topic": 1, "qnum": 90, "question": "You have an App Engine application that needs to be updated. You want to test the update with production traffic before replacing the current application version.What should you do?", "options": [{"letter": "A", "text": "Deploy the update using the Instance Group Updater to create a partial rollout, which allows for canary testing."}, {"letter": "B", "text": "Deploy the update as a new version in the App Engine application, and split traffic between the new and current versions."}, {"letter": "C", "text": "Deploy the update in a new VPC, and use Google's global HTTP load balancing to split traffic between the update and current applications."}, {"letter": "D", "text": "Deploy the update as a new App Engine application, and use Google's global HTTP load balancing to split traffic between the new and current applications."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6462-exam-professional-cloud-architect-topic-1-question-90/", "postedDate": "2019-10-11", "postedYear": 2019, "tags": ["App Engine", "CI/CD"]}, {"id": "T1-Q91", "topic": 1, "qnum": 91, "question": "All Compute Engine instances in your VPC should be able to connect to an Active Directory server on specific ports. Any other traffic emerging from your instances is not allowed. You want to enforce this using VPC firewall rules.How should you configure the firewall rules?", "options": [{"letter": "A", "text": "Create an egress rule with priority 1000 to deny all traffic for all instances. Create another egress rule with priority 100 to allow the Active Directory traffic for all instances."}, {"letter": "B", "text": "Create an egress rule with priority 100 to deny all traffic for all instances. Create another egress rule with priority 1000 to allow the Active Directory traffic for all instances."}, {"letter": "C", "text": "Create an egress rule with priority 1000 to allow the Active Directory traffic. Rely on the implied deny egress rule with priority 100 to block all traffic for all instances."}, {"letter": "D", "text": "Create an egress rule with priority 100 to allow the Active Directory traffic. Rely on the implied deny egress rule with priority 1000 to block all traffic for all instances."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6817-exam-professional-cloud-architect-topic-1-question-91/", "postedDate": "2019-10-20", "postedYear": 2019, "tags": ["VPC/網路", "安全性"]}, {"id": "T1-Q92", "topic": 1, "qnum": 92, "question": "Your customer runs a web service used by e-commerce sites to offer product recommendations to users. The company has begun experimenting with a machine learning model on Google Cloud Platform to improve the quality of results.What should the customer do to improve their model's results over time?", "options": [{"letter": "A", "text": "Export Cloud Machine Learning Engine performance metrics from Stackdriver to BigQuery, to be used to analyze the efficiency of the model."}, {"letter": "B", "text": "Build a roadmap to move the machine learning model training from Cloud GPUs to Cloud TPUs, which offer better results."}, {"letter": "C", "text": "Monitor Compute Engine announcements for availability of newer CPU architectures, and deploy the model to them as soon as they are available for additional performance."}, {"letter": "D", "text": "Save a history of recommendations and results of the recommendations in BigQuery, to be used as training data."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68718-exam-professional-cloud-architect-topic-1-question-92/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Vertex AI/AI-ML", "BigQuery"]}, {"id": "T1-Q93", "topic": 1, "qnum": 93, "question": "A development team at your company has created a dockerized HTTPS web application. You need to deploy the application on Google Kubernetes Engine (GKE) and make sure that the application scales automatically.How should you deploy to GKE?", "options": [{"letter": "A", "text": "Use the Horizontal Pod Autoscaler and enable cluster autoscaling. Use an Ingress resource to load-balance the HTTPS traffic."}, {"letter": "B", "text": "Use the Horizontal Pod Autoscaler and enable cluster autoscaling on the Kubernetes cluster. Use a Service resource of type LoadBalancer to load-balance the HTTPS traffic."}, {"letter": "C", "text": "Enable autoscaling on the Compute Engine instance group. Use an Ingress resource to load-balance the HTTPS traffic."}, {"letter": "D", "text": "Enable autoscaling on the Compute Engine instance group. Use a Service resource of type LoadBalancer to load-balance the HTTPS traffic."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7123-exam-professional-cloud-architect-topic-1-question-93/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["GKE/Kubernetes", "自動擴縮", "容器化"]}, {"id": "T1-Q94", "topic": 1, "qnum": 94, "question": "You need to design a solution for global load balancing based on the URL path being requested. You need to ensure operations reliability and end-to-end in- transit encryption based on Google best practices.What should you do?", "options": [{"letter": "A", "text": "Create a cross-region load balancer with URL Maps."}, {"letter": "B", "text": "Create an HTTPS load balancer with URL Maps."}, {"letter": "C", "text": "Create appropriate instance groups and instances. Configure SSL proxy load balancing."}, {"letter": "D", "text": "Create a global forwarding rule. Configure SSL proxy load balancing."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10289-exam-professional-cloud-architect-topic-1-question-94/", "postedDate": "2019-12-13", "postedYear": 2019, "tags": ["Load Balancing", "安全性"]}, {"id": "T1-Q95", "topic": 1, "qnum": 95, "question": "You have an application that makes HTTP requests to Cloud Storage. Occasionally the requests fail with HTTP status codes of 5xx and 429.How should you handle these types of errors?", "options": [{"letter": "A", "text": "Use gRPC instead of HTTP for better performance."}, {"letter": "B", "text": "Implement retry logic using a truncated exponential backoff strategy."}, {"letter": "C", "text": "Make sure the Cloud Storage bucket is multi-regional for geo-redundancy."}, {"letter": "D", "text": "Monitor https://status.cloud.google.com/feed.atom and only make requests if Cloud Storage is not reporting an incident."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7962-exam-professional-cloud-architect-topic-1-question-95/", "postedDate": "2019-11-11", "postedYear": 2019, "tags": ["Cloud Storage", "效能調校"]}, {"id": "T1-Q96", "topic": 1, "qnum": 96, "question": "You need to develop procedures to test a disaster plan for a mission-critical application. You want to use Google-recommended practices and native capabilities within GCP.What should you do?", "options": [{"letter": "A", "text": "Use Deployment Manager to automate service provisioning. Use Activity Logs to monitor and debug your tests."}, {"letter": "B", "text": "Use Deployment Manager to automate service provisioning. Use Stackdriver to monitor and debug your tests."}, {"letter": "C", "text": "Use gcloud scripts to automate service provisioning. Use Activity Logs to monitor and debug your tests."}, {"letter": "D", "text": "Use gcloud scripts to automate service provisioning. Use Stackdriver to monitor and debug your tests."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7125-exam-professional-cloud-architect-topic-1-question-96/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Terraform/IaC", "高可用性/災難復原", "監控與可觀測性"]}, {"id": "T1-Q97", "topic": 1, "qnum": 97, "question": "Your company creates rendering software which users can download from the company website. Your company has customers all over the world. You want to minimize latency for all your customers. You want to follow Google-recommended practices.How should you store the files?", "options": [{"letter": "A", "text": "Save the files in a Multi-Regional Cloud Storage bucket."}, {"letter": "B", "text": "Save the files in a Regional Cloud Storage bucket, one bucket per zone of the region."}, {"letter": "C", "text": "Save the files in multiple Regional Cloud Storage buckets, one bucket per zone per region."}, {"letter": "D", "text": "Save the files in multiple Multi-Regional Cloud Storage buckets, one bucket per multi-region."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6466-exam-professional-cloud-architect-topic-1-question-97/", "postedDate": "2019-10-11", "postedYear": 2019, "tags": ["Cloud Storage", "多區域架構", "效能調校"]}, {"id": "T1-Q98", "topic": 1, "qnum": 98, "question": "Your company acquired a healthcare startup and must retain its customers' medical information for up to 4 more years, depending on when it was created. Your corporate policy is to securely retain this data, and then delete it as soon as regulations allow.Which approach should you take?", "options": [{"letter": "A", "text": "Store the data in Google Drive and manually delete records as they expire."}, {"letter": "B", "text": "Anonymize the data using the Cloud Data Loss Prevention API and store it indefinitely."}, {"letter": "C", "text": "Store the data in Cloud Storage and use lifecycle management to delete files when they expire."}, {"letter": "D", "text": "Store the data in Cloud Storage and run a nightly batch script that deletes all expired data."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7376-exam-professional-cloud-architect-topic-1-question-98/", "postedDate": "2019-10-28", "postedYear": 2019, "tags": ["Cloud Storage", "合規性"]}, {"id": "T1-Q99", "topic": 1, "qnum": 99, "question": "You are deploying a PHP App Engine Standard service with Cloud SQL as the backend. You want to minimize the number of queries to the database.What should you do?", "options": [{"letter": "A", "text": "Set the memcache service level to dedicated. Create a key from the hash of the query, and return database values from memcache before issuing a query to Cloud SQL."}, {"letter": "B", "text": "Set the memcache service level to dedicated. Create a cron task that runs every minute to populate the cache with keys containing query results."}, {"letter": "C", "text": "Set the memcache service level to shared. Create a cron task that runs every minute to save all expected queries to a key called ג€cached_queriesג€."}, {"letter": "D", "text": "Set the memcache service level to shared. Create a key called ג€cached_queriesג€, and return database values from the key before using a query to Cloud SQL."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7377-exam-professional-cloud-architect-topic-1-question-99/", "postedDate": "2019-10-28", "postedYear": 2019, "tags": ["App Engine", "Cloud SQL", "效能調校"]}, {"id": "T1-Q100", "topic": 1, "qnum": 100, "question": "You need to ensu
