nd grant the respective group the required IAM permissions at the folder level. Add the projects under the respective folders."}, {"letter": "C", "text": "Create a folder per department and grant the respective members of the department the required IAM permissions at the folder level. Structure all projects for each department under the respective folders."}, {"letter": "D", "text": "Create a Google Group per department and add all department members to their respective groups. Grant each group the required IAM permissions for their respective projects."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60743-exam-professional-cloud-architect-topic-1-question-144/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["IAM", "Organization Policy"]}, {"id": "T1-Q145", "topic": 1, "qnum": 145, "question": "Your company has an application running as a Deployment in a Google Kubernetes Engine (GKE) cluster. You have separate clusters for development, staging, and production. You have discovered that the team is able to deploy a Docker image to the production cluster without first testing the deployment in development and then staging. You want to allow the team to have autonomy but want to prevent this from happening. You want a Google Cloud solution that can be implemented quickly with minimal effort. What should you do?", "options": [{"letter": "A", "text": "Configure a Kubernetes lifecycle hook to prevent the container from starting if it is not approved for usage in the given environment."}, {"letter": "B", "text": "Implement a corporate policy to prevent teams from deploying Docker images to an environment unless the Docker image was tested in an earlier environment."}, {"letter": "C", "text": "Configure binary authorization policies for the development, staging, and production clusters. Create attestations as part of the continuous integration pipeline."}, {"letter": "D", "text": "Create a Kubernetes admissions controller to prevent the container from starting if it is not approved for usage in the given environment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60438-exam-professional-cloud-architect-topic-1-question-145/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["GKE/Kubernetes", "CI/CD", "安全性"]}, {"id": "T1-Q146", "topic": 1, "qnum": 146, "question": "Your company wants to migrate their 10-TB on-premises database export into Cloud Storage. You want to minimize the time it takes to complete this activity, the overall cost, and database load. The bandwidth between the on-premises environment and Google Cloud is 1 Gbps. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Develop a Dataflow job to read data directly from the database and write it into Cloud Storage."}, {"letter": "B", "text": "Use the Data Transfer appliance to perform an offline migration."}, {"letter": "C", "text": "Use a commercial partner ETL solution to extract the data from the on-premises database and upload it into Cloud Storage."}, {"letter": "D", "text": "Compress the data and upload it with gsutil -m to enable multi-threaded copy."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60720-exam-professional-cloud-architect-topic-1-question-146/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移"]}, {"id": "T1-Q147", "topic": 1, "qnum": 147, "question": "Your company has an enterprise application running on Compute Engine that requires high availability and high performance. The application has been deployed on two instances in two zones in the same region in active-passive mode. The application writes data to a persistent disk. In the case of a single zone outage, that data should be immediately made available to the other instance in the other zone. You want to maximize performance while minimizing downtime and data loss.What should you do?", "options": [{"letter": "A", "text": "1. Attach a persistent SSD disk to the first instance. 2. Create a snapshot every hour. 3. In case of a zone outage, recreate a persistent SSD disk in the second instance where data is coming from the created snapshot."}, {"letter": "B", "text": "1. Create a Cloud Storage bucket. 2. Mount the bucket into the first instance with gcs-fuse. 3. In case of a zone outage, mount the Cloud Storage bucket to the second instance with gcs-fuse."}, {"letter": "C", "text": "1. Attach a regional SSD persistent disk to the first instance. 2. In case of a zone outage, force-attach the disk to the other instance."}, {"letter": "D", "text": "1. Attach a local SSD to the first instance disk. 2. Execute an rsync command every hour where the target is a persistent SSD disk attached to the second instance. 3. In case of a zone outage, use the second instance."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60583-exam-professional-cloud-architect-topic-1-question-147/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["Compute Engine", "高可用性/災難復原"]}, {"id": "T1-Q148", "topic": 1, "qnum": 148, "question": "You are designing a Data Warehouse on Google Cloud and want to store sensitive data in BigQuery. Your company requires you to generate the encryption keys outside of Google Cloud. You need to implement a solution. What should you do?", "options": [{"letter": "A", "text": "Generate a new key in Cloud Key Management Service (Cloud KMS). Store all data in Cloud Storage using the customer-managed key option and select the created key. Set up a Dataflow pipeline to decrypt the data and to store it in a new BigQuery dataset."}, {"letter": "B", "text": "Generate a new key in Cloud KMS. Create a dataset in BigQuery using the customer-managed key option and select the created key."}, {"letter": "C", "text": "Import a key in Cloud KMS. Store all data in Cloud Storage using the customer-managed key option and select the created key. Set up a Dataflow pipeline to decrypt the data and to store it in a new BigQuery dataset."}, {"letter": "D", "text": "Import a key in Cloud KMS. Create a dataset in BigQuery using the customer-supplied key option and select the created key."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60439-exam-professional-cloud-architect-topic-1-question-148/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["BigQuery", "Cloud KMS/加密", "安全性"]}, {"id": "T1-Q149", "topic": 1, "qnum": 149, "question": "Your organization has stored sensitive data in a Cloud Storage bucket. For regulatory reasons, your company must be able to rotate the encryption key used to encrypt the data in the bucket. The data will be processed in Dataproc. You want to follow Google-recommended practices for security. What should you do?", "options": [{"letter": "A", "text": "Create a key with Cloud Key Management Service (KMS). Encrypt the data using the encrypt method of Cloud KMS."}, {"letter": "B", "text": "Create a key with Cloud Key Management Service (KMS). Set the encryption key on the bucket to the Cloud KMS key."}, {"letter": "C", "text": "Generate a GPG key pair. Encrypt the data using the GPG key. Upload the encrypted data to the bucket."}, {"letter": "D", "text": "Generate an AES-256 encryption key. Encrypt the data in the bucket using the customer-supplied encryption keys feature."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60440-exam-professional-cloud-architect-topic-1-question-149/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Storage", "Cloud KMS/加密", "安全性"]}, {"id": "T1-Q150", "topic": 1, "qnum": 150, "question": "Your team needs to create a Google Kubernetes Engine (GKE) cluster to host a newly built application that requires access to third-party services on the internet.Your company does not allow any Compute Engine instance to have a public IP address on Google Cloud. You need to create a deployment strategy that adheres to these guidelines. What should you do?", "options": [{"letter": "A", "text": "Configure the GKE cluster as a private cluster, and configure Cloud NAT Gateway for the cluster subnet."}, {"letter": "B", "text": "Configure the GKE cluster as a private cluster. Configure Private Google Access on the Virtual Private Cloud (VPC)."}, {"letter": "C", "text": "Configure the GKE cluster as a route-based cluster. Configure Private Google Access on the Virtual Private Cloud (VPC)."}, {"letter": "D", "text": "Create a Compute Engine instance, and install a NAT Proxy on the instance. Configure all workloads on GKE to pass through this proxy to access third-party services on the Internet."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60441-exam-professional-cloud-architect-topic-1-question-150/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["GKE/Kubernetes", "VPC/網路", "安全性"]}, {"id": "T1-Q151", "topic": 1, "qnum": 151, "question": "Your company has a support ticketing solution that uses App Engine Standard. The project that contains the App Engine application already has a Virtual PrivateCloud (VPC) network fully connected to the company's on-premises environment through a Cloud VPN tunnel. You want to enable the App Engine application to communicate with a database that is running in the company's on-premises environment. What should you do?", "options": [{"letter": "A", "text": "Configure private Google access for on-premises hosts only."}, {"letter": "B", "text": "Configure private Google access."}, {"letter": "C", "text": "Configure private services access."}, {"letter": "D", "text": "Configure serverless VPC access."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60436-exam-professional-cloud-architect-topic-1-question-151/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["App Engine", "無伺服器", "Interconnect/VPN"]}, {"id": "T1-Q152", "topic": 1, "qnum": 152, "question": "Your company is planning to upload several important files to Cloud Storage. After the upload is completed, they want to verify that the uploaded content is identical to what they have on-premises. You want to minimize the cost and effort of performing this check. What should you do?", "options": [{"letter": "A", "text": "1. Use Linux shasum to compute a digest of files you want to upload. 2. Use gsutil -m to upload all the files to Cloud Storage. 3. Use gsutil cp to download the uploaded files. 4. Use Linux shasum to compute a digest of the downloaded files. 5. Compare the hashes."}, {"letter": "B", "text": "1. Use gsutil -m to upload the files to Cloud Storage. 2. Develop a custom Java application that computes CRC32C hashes. 3. Use gsutil ls -L gs://[YOUR_BUCKET_NAME] to collect CRC32C hashes of the uploaded files. 4. Compare the hashes."}, {"letter": "C", "text": "1. Use gsutil -m to upload all the files to Cloud Storage. 2. Use gsutil cp to download the uploaded files. 3. Use Linux diff to compare the content of the files."}, {"letter": "D", "text": "1. Use gsutil -m to upload the files to Cloud Storage. 2. Use gsutil hash -c FILE_NAME to generate CRC32C hashes of all on-premises files. 3. Use gsutil ls -L gs://[YOUR_BUCKET_NAME] to collect CRC32C hashes of the uploaded files. 4. Compare the hashes."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60415-exam-professional-cloud-architect-topic-1-question-152/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移"]}, {"id": "T1-Q153", "topic": 1, "qnum": 153, "question": "You have deployed an application on Anthos clusters (formerly Anthos GKE). According to the SRE practices at your company, you need to be alerted if request latency is above a certain threshold for a specified amount of time. What should you do?", "options": [{"letter": "A", "text": "Install Anthos Service Mesh on your cluster. Use the Google Cloud Console to define a Service Level Objective (SLO), and create an alerting policy based on this SLO."}, {"letter": "B", "text": "Enable the Cloud Trace API on your project, and use Cloud Monitoring Alerts to send an alert based on the Cloud Trace metrics."}, {"letter": "C", "text": "Use Cloud Profiler to follow up the request latency. Create a custom metric in Cloud Monitoring based on the results of Cloud Profiler, and create an Alerting policy in case this metric exceeds the threshold."}, {"letter": "D", "text": "Configure Anthos Config Management on your cluster, and create a yaml file that defines the SLO and alerting policy you want to deploy in your cluster."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60624-exam-professional-cloud-architect-topic-1-question-153/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["GKE/Kubernetes", "監控與可觀測性"]}, {"id": "T1-Q154", "topic": 1, "qnum": 154, "question": "Your company has a stateless web API that performs scientific calculations. The web API runs on a single Google Kubernetes Engine (GKE) cluster. The cluster is currently deployed in us-central1. Your company has expanded to offer your API to customers in Asia. You want to reduce the latency for users in Asia.What should you do?", "options": [{"letter": "A", "text": "Create a second GKE cluster in asia-southeast1, and expose both APIs using a Service of type LoadBalancer. Add the public IPs to the Cloud DNS zone."}, {"letter": "B", "text": "Use a global HTTP(s) load balancer with Cloud CDN enabled."}, {"letter": "C", "text": "Create a second GKE cluster in asia-southeast1, and use kubemci to create a global HTTP(s) load balancer."}, {"letter": "D", "text": "Increase the memory and CPU allocated to the application in the cluster."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60627-exam-professional-cloud-architect-topic-1-question-154/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Load Balancing", "多區域架構", "效能調校", "Cloud CDN"]}, {"id": "T1-Q155", "topic": 1, "qnum": 155, "question": "You are migrating third-party applications from optimized on-premises virtual machines to Google Cloud. You are unsure about the optimum CPU and memory options. The applications have a consistent usage pattern across multiple weeks. You want to optimize resource usage for the lowest cost. What should you do?", "options": [{"letter": "A", "text": "Create an instance template with the smallest available machine type, and use an image of the third-party application taken from a current on-premises virtual machine. Create a managed instance group that uses average CPU utilization to autoscale the number of instances in the group. Modify the average CPU utilization threshold to optimize the number of instances running."}, {"letter": "B", "text": "Create an App Engine flexible environment, and deploy the third-party application using a Dockerfile and a custom runtime. Set CPU and memory options similar to your application's current on-premises virtual machine in the app.yaml file."}, {"letter": "C", "text": "Create multiple Compute Engine instances with varying CPU and memory options. Install the Cloud Monitoring agent, and deploy the third-party application on each of them. Run a load test with high traffic levels on the application, and use the results to determine the optimal settings."}, {"letter": "D", "text": "Create a Compute Engine instance with CPU and memory options similar to your application's current on-premises virtual machine. Install the Cloud Monitoring agent, and deploy the third-party application. Run a load test with normal traffic levels on the application, and follow the Rightsizing Recommendations in the Cloud Console."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60494-exam-professional-cloud-architect-topic-1-question-155/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Compute Engine", "成本優化"]}, {"id": "T1-Q156", "topic": 1, "qnum": 156, "question": "Your company has a Google Cloud project that uses BigQuery for data warehousing. They have a VPN tunnel between the on-premises environment and GoogleCloud that is configured with Cloud VPN. The security team wants to avoid data exfiltration by malicious insiders, compromised code, and accidental oversharing.What should they do?", "options": [{"letter": "A", "text": "Configure Private Google Access for on-premises only."}, {"letter": "B", "text": "Perform the following tasks: 1. Create a service account. 2. Give the BigQuery JobUser role and Storage Reader role to the service account. 3. Remove all other IAM access from the project."}, {"letter": "C", "text": "Configure VPC Service Controls and configure Private Google Access."}, {"letter": "D", "text": "Configure Private Google Access."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60416-exam-professional-cloud-architect-topic-1-question-156/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["BigQuery", "VPC/網路", "安全性"]}, {"id": "T1-Q157", "topic": 1, "qnum": 157, "question": "You are working at an institution that processes medical data. You are migrating several workloads onto Google Cloud. Company policies require all workloads to run on physically separated hardware, and workloads from different clients must also be separated. You created a sole-tenant node group and added a node for each client. You need to deploy the workloads on these dedicated hosts. What should you do?", "options": [{"letter": "A", "text": "Add the node group name as a network tag when creating Compute Engine instances in order to host each workload on the correct node group."}, {"letter": "B", "text": "Add the node name as a network tag when creating Compute Engine instances in order to host each workload on the correct node."}, {"letter": "C", "text": "Use node affinity labels based on the node group name when creating Compute Engine instances in order to host each workload on the correct node group."}, {"letter": "D", "text": "Use node affinity labels based on the node name when creating Compute Engine instances in order to host each workload on the correct node."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60495-exam-professional-cloud-architect-topic-1-question-157/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Compute Engine", "合規性", "安全性"]}, {"id": "T1-Q158", "topic": 1, "qnum": 158, "question": "Your company's test suite is a custom C++ application that runs tests throughout each day on Linux virtual machines. The full test suite takes several hours to complete, running on a limited number of on-premises servers reserved for testing. Your company wants to move the testing infrastructure to the cloud, to reduce the amount of time it takes to fully test a change to the system, while changing the tests as little as possible.Which cloud infrastructure should you recommend?", "options": [{"letter": "A", "text": "Google Compute Engine unmanaged instance groups and Network Load Balancer"}, {"letter": "B", "text": "Google Compute Engine managed instance groups with auto-scaling"}, {"letter": "C", "text": "Google Cloud Dataproc to run Apache Hadoop jobs to process each test"}, {"letter": "D", "text": "Google App Engine with Google StackDriver for logging"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8340-exam-professional-cloud-architect-topic-1-question-158/", "postedDate": "2019-11-16", "postedYear": 2019, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q159", "topic": 1, "qnum": 159, "question": "A lead software engineer tells you that his new application design uses websockets and HTTP sessions that are not distributed across the web servers. You want to help him ensure his application will run properly on Google Cloud Platform.What should you do?", "options": [{"letter": "A", "text": "Help the engineer to convert his websocket code to use HTTP streaming"}, {"letter": "B", "text": "Review the encryption requirements for websocket connections with the security team"}, {"letter": "C", "text": "Meet with the cloud operations team and the engineer to discuss load balancer options"}, {"letter": "D", "text": "Help the engineer redesign the application to use a distributed user session service that does not rely on websockets and HTTP sessions."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8341-exam-professional-cloud-architect-topic-1-question-159/", "postedDate": "2019-11-16", "postedYear": 2019, "tags": ["Load Balancing", "自動擴縮"]}, {"id": "T1-Q160", "topic": 1, "qnum": 160, "question": "The application reliability team at your company this added a debug feature to their backend service to send all server events to Google Cloud Storage for eventual analysis. The event records are at least 50 KB and at most 15 MB and are expected to peak at 3,000 events per second. You want to minimize data loss.Which process should you implement?", "options": [{"letter": "A", "text": "ג€¢ Append metadata to file body ג€¢ Compress individual files ג€¢ Name files with serverName ג€\" Timestamp ג€¢ Create a new bucket if bucket is older than 1 hour and save individual files to the new bucket. Otherwise, save files to existing bucket."}, {"letter": "B", "text": "ג€¢ Batch every 10,000 events with a single manifest file for metadata ג€¢ Compress event files and manifest file into a single archive file ג€¢ Name files using serverName ג€\" EventSequence ג€¢ Create a new bucket if bucket is older than 1 day and save the single archive file to the new bucket. Otherwise, save the single archive file to existing bucket."}, {"letter": "C", "text": "ג€¢ Compress individual files ג€¢ Name files with serverName ג€\" EventSequence ג€¢ Save files to one bucket ג€¢ Set custom metadata headers for each object after saving"}, {"letter": "D", "text": "ג€¢ Append metadata to file body ג€¢ Compress individual files ג€¢ Name files with a random prefix pattern ג€¢ Save files to one bucket"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54369-exam-professional-cloud-architect-topic-1-question-160/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["Cloud Storage", "效能調校"]}, {"id": "T1-Q161", "topic": 1, "qnum": 161, "question": "A recent audit revealed that a new network was created in your GCP project. In this network, a GCE instance has an SSH port open to the world. You want to discover this network's origin.What should you do?", "options": [{"letter": "A", "text": "Search for Create VM entry in the Stackdriver alerting console"}, {"letter": "B", "text": "Navigate to the Activity page in the Home section. Set category to Data Access and search for Create VM entry"}, {"letter": "C", "text": "In the Logging section of the console, specify GCE Network as the logging section. Search for the Create Insert entry"}, {"letter": "D", "text": "Connect to the GCE instance using project SSH keys. Identify previous logins in system logs, and match these with the project owners list"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7016-exam-professional-cloud-architect-topic-1-question-161/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "安全性", "監控與可觀測性"]}, {"id": "T1-Q162", "topic": 1, "qnum": 162, "question": "You want to make a copy of a production Linux virtual machine in the US-Central region. You want to manage and replace the copy easily if there are changes on the production virtual machine. You will deploy the copy as a new instance in a different project in the US-East region.What steps must you take?", "options": [{"letter": "A", "text": "Use the Linux dd and netcat commands to copy and stream the root disk contents to a new virtual machine instance in the US-East region."}, {"letter": "B", "text": "Create a snapshot of the root disk and select the snapshot as the root disk when you create a new virtual machine instance in the US-East region."}, {"letter": "C", "text": "Create an image file from the root disk with Linux dd command, create a new virtual machine instance in the US-East region"}, {"letter": "D", "text": "Create a snapshot of the root disk, create an image file in Google Cloud Storage from the snapshot, and create a new virtual machine instance in the US-East region using the image file the root disk."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7018-exam-professional-cloud-architect-topic-1-question-162/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["Compute Engine", "多區域架構"]}, {"id": "T1-Q163", "topic": 1, "qnum": 163, "question": "Your company runs several databases on a single MySQL instance. They need to take backups of a specific database at regular intervals. The backup activity needs to complete as quickly as possible and cannot be allowed to impact disk performance.How should you configure the storage?", "options": [{"letter": "A", "text": "Configure a cron job to use the gcloud tool to take regular backups using persistent disk snapshots."}, {"letter": "B", "text": "Mount a Local SSD volume as the backup location. After the backup is complete, use gsutil to move the backup to Google Cloud Storage."}, {"letter": "C", "text": "Use gcsfise to mount a Google Cloud Storage bucket as a volume directly on the instance and write backups to the mounted location using mysqldump."}, {"letter": "D", "text": "Mount additional persistent disk volumes onto each virtual machine (VM) instance in a RAID10 array and use LVM to create snapshots to send to Cloud Storage"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7020-exam-professional-cloud-architect-topic-1-question-163/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["Compute Engine", "Cloud SQL", "效能調校"]}, {"id": "T1-Q164", "topic": 1, "qnum": 164, "question": "You are helping the QA team to roll out a new load-testing tool to test the scalability of your primary cloud services that run on Google Compute Engine with CloudBigtable.Which three requirements should they include? (Choose three.)", "options": [{"letter": "A", "text": "Ensure that the load tests validate the performance of Cloud Bigtable"}, {"letter": "B", "text": "Create a separate Google Cloud project to use for the load-testing environment"}, {"letter": "C", "text": "Schedule the load-testing tool to regularly run against the production environment"}, {"letter": "D", "text": "Ensure all third-party systems your services use is capable of handling high load"}, {"letter": "E", "text": "Instrument the production services to record every transaction for replay by the load-testing tool"}, {"letter": "F", "text": "Instrument the load-testing tool and the target services with detailed logging and metrics collection"}], "answer": "ABF", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54371-exam-professional-cloud-architect-topic-1-question-164/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["Bigtable", "效能調校", "監控與可觀測性"]}, {"id": "T1-Q165", "topic": 1, "qnum": 165, "question": "Your customer is moving their corporate applications to Google Cloud Platform. The security team wants detailed visibility of all projects in the organization. You provision the Google Cloud Resource Manager and set up yourself as the org admin.What Google Cloud Identity and Access Management (Cloud IAM) roles should you give to the security team?", "options": [{"letter": "A", "text": "Org viewer, project owner"}, {"letter": "B", "text": "Org viewer, project viewer"}, {"letter": "C", "text": "Org admin, project browser"}, {"letter": "D", "text": "Project owner, network admin"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7068-exam-professional-cloud-architect-topic-1-question-165/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["IAM"]}, {"id": "T1-Q166", "topic": 1, "qnum": 166, "question": "Your company places a high value on being responsive and meeting customer needs quickly. Their primary business objectives are release speed and agility. You want to reduce the chance of security errors being accidentally introduced.Which two actions can you take? (Choose two.)", "options": [{"letter": "A", "text": "Ensure every code check-in is peer reviewed by a security SME"}, {"letter": "B", "text": "Use source code security analyzers as part of the CI/CD pipeline"}, {"letter": "C", "text": "Ensure you have stubs to unit test all interfaces between components"}, {"letter": "D", "text": "Enable code signing and a trusted binary repository integrated with your CI/CD pipeline"}, {"letter": "E", "text": "Run a vulnerability security scanner as part of your continuous-integration /continuous-delivery (CI/CD) pipeline"}], "answer": "BE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54372-exam-professional-cloud-architect-topic-1-question-166/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["CI/CD", "安全性"]}, {"id": "T1-Q167", "topic": 1, "qnum": 167, "question": "You want to enable your running Google Kubernetes Engine cluster to scale as demand for your application changes.What should you do?", "options": [{"letter": "A", "text": "Add additional nodes to your Kubernetes Engine cluster using the following command: gcloud container clusters resize CLUSTER_Name ג€\" -size 10"}, {"letter": "B", "text": "Add a tag to the instances in the cluster with the following command: gcloud compute instances add-tags INSTANCE - -tags enable- autoscaling max-nodes-10"}, {"letter": "C", "text": "Update the existing Kubernetes Engine cluster with the following command: gcloud alpha container clusters update mycluster - -enable- autoscaling - -min-nodes=1 - -max-nodes=10"}, {"letter": "D", "text": "Create a new Kubernetes Engine cluster with the following command: gcloud alpha container clusters create mycluster - -enable- autoscaling - -min-nodes=1 - -max-nodes=10 and redeploy your application"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7073-exam-professional-cloud-architect-topic-1-question-167/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["GKE/Kubernetes", "自動擴縮"]}, {"id": "T1-Q168", "topic": 1, "qnum": 168, "question": "Your marketing department wants to send out a promotional email campaign. The development team wants to minimize direct operation management. They project a wide range of possible customer responses, from 100 to 500,000 click-through per day. The link leads to a simple website that explains the promotion and collects user information and preferences.Which infrastructure should you recommend? (Choose two.)", "options": [{"letter": "A", "text": "Use Google App Engine to serve the website and Google Cloud Datastore to store user data."}, {"letter": "B", "text": "Use a Google Container Engine cluster to serve the website and store data to persistent disk."}, {"letter": "C", "text": "Use a managed instance group to serve the website and Google Cloud Bigtable to store user data."}, {"letter": "D", "text": "Use a single Compute Engine virtual machine (VM) to host a web server, backend by Google Cloud SQL."}], "answer": "AC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54373-exam-professional-cloud-architect-topic-1-question-168/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["App Engine", "Bigtable", "自動擴縮", "無伺服器"]}, {"id": "T1-Q169", "topic": 1, "qnum": 169, "question": "Your company just finished a rapid lift and shift to Google Compute Engine for your compute needs. You have another 9 months to design and deploy a more cloud-native solution. Specifically, you want a system that is no-ops and auto-scaling.Which two compute products should you choose? (Choose two.)", "options": [{"letter": "A", "text": "Compute Engine with containers"}, {"letter": "B", "text": "Google Kubernetes Engine with containers"}, {"letter": "C", "text": "Google App Engine Standard Environment"}, {"letter": "D", "text": "Compute Engine with custom instance types"}, {"letter": "E", "text": "Compute Engine with managed instance groups"}], "answer": "BC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54374-exam-professional-cloud-architect-topic-1-question-169/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["GKE/Kubernetes", "App Engine", "自動擴縮", "無伺服器"]}, {"id": "T1-Q170", "topic": 1, "qnum": 170, "question": "One of your primary business objectives is being able to trust the data stored in your application. You want to log all changes to the application data.How can you design your logging system to verify authenticity of your logs?", "options": [{"letter": "A", "text": "Write the log concurrently in the cloud and on premises"}, {"letter": "B", "text": "Use a SQL database and limit who can modify the log table"}, {"letter": "C", "text": "Digitally sign each timestamp and log entry and store the signature"}, {"letter": "D", "text": "Create a JSON dump of each log entry and store it in Google Cloud Storage"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7082-exam-professional-cloud-architect-topic-1-question-170/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["Cloud KMS/加密", "安全性"]}, {"id": "T1-Q171", "topic": 1, "qnum": 171, "question": "Your company has a Google Workspace account and Google Cloud Organization. Some developers in the company have created Google Cloud projects outside of the Google Cloud Organization.You want to create an Organization structure that allows developers to create projects, but prevents them from modifying production projects. You want to manage policies for all projects centrally and be able to set more restrictive policies for production projects.You want to minimize disruption to users and developers when business needs change in the future. You want to follow Google-recommended practices. Now should you design the Organization structure?", "options": [{"letter": "A", "text": "1. Create a second Google Workspace account and Organization. 2. Grant all developers the Project Creator IAM role on the new Organization. 3. Move the developer projects into the new Organization. 4. Set the policies for all projects on both Organizations. 5. Additionally, set the production policies on the original Organization."}, {"letter": "B", "text": "1. Create a folder under the Organization resource named ג€Production.ג€ 2. Grant all developers the Project Creator IAM role on the new Organization. 3. Move the developer projects into the new Organization. 4. Set the policies for all projects on the Organization. 5. Additionally, set the production policies on the ג€Productionג€ folder."}, {"letter": "C", "text": "1. Create folders under the Organization resource named ג€Developmentג€ and ג€Production.ג€ 2. Grant all developers the Project Creator IAM role on the ג€Developmentג€ folder. 3. Move the developer projects into the ג€Developmentג€ folder. 4. Set the policies for all projects on the Organization. 5. Additionally, set the production policies on the ג€Productionג€ folder."}, {"letter": "D", "text": "1. Designate the Organization for production projects only. 2. Ensure that developers do not have the Project Creator IAM role on the Organization. 3. Create development projects outside of the Organization using the developer Google Workspace accounts. 4. Set the policies for all projects on the Organization. 5. Additionally, set the production policies on the individual production projects."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68682-exam-professional-cloud-architect-topic-1-question-171/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Organization Policy", "IAM"]}, {"id": "T1-Q172", "topic": 1, "qnum": 172, "question": "Your company has an application running on Compute Engine that allows users to play their favorite music. There are a fixed number of instances. Files are stored in Cloud Storage, and data is streamed directly to users. Users are reporting that they sometimes need to attempt to play popular songs multiple times before they are successful. You need to improve the performance of the application. What should you do?", "options": [{"letter": "A", "text": "1. Mount the Cloud Storage bucket using gcsfuse on all backend Compute Engine instances. 2. Serve music files directly from the backend Compute Engine instance."}, {"letter": "B", "text": "1. Create a Cloud Filestore NFS volume and attach it to the backend Compute Engine instances. 2. Download popular songs in Cloud Filestore. 3. Serve music files directly from the backend Compute Engine instance."}, {"letter": "C", "text": "1. Copy popular songs into CloudSQL as a blob. 2. Update application code to retrieve data from CloudSQL when Cloud Storage is overloaded."}, {"letter": "D", "text": "1. Create a managed instance group with Compute Engine instances. 2. Create a global load balancer and configure it with two backends: ג—‹ Managed instance group ג—‹ Cloud Storage bucket 3. Enable Cloud CDN on the bucket backend."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68683-exam-professional-cloud-architect-topic-1-question-172/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Load Balancing", "效能調校", "Cloud CDN"]}, {"id": "T1-Q173", "topic": 1, "qnum": 173, "question": "The operations team in your company wants to save Cloud VPN log events for one year. You need to configure the cloud infrastructure to save the logs. What should you do?", "options": [{"letter": "A", "text": "Set up a filter in Cloud Logging and a Cloud Storage bucket as an export target for the logs you want to save."}, {"letter": "B", "text": "Enable the Compute Engine API, and then enable logging on the firewall rules that match the traffic you want to save."}, {"letter": "C", "text": "Set up a Cloud Logging Dashboard titled Cloud VPN Logs, and then add a chart that queries for the VPN metrics over a one-year time period."}, {"letter": "D", "text": "Set up a filter in Cloud Logging and a topic in Pub/Sub to publish the logs."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68684-exam-professional-cloud-architect-topic-1-question-173/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Interconnect/VPN", "Cloud Monitoring/Logging", "合規性"]}, {"id": "T1-Q174", "topic": 1, "qnum": 174, "question": "You are working with a data warehousing team that performs data analysis. The team needs to process data from external partners, but the data contains personally identifiable information (PII). You need to process and store the data without storing any of the PIIE data. What should you do?", "options": [{"letter": "A", "text": "Create a Dataflow pipeline to retrieve the data from the external sources. As part of the pipeline, use the Cloud Data Loss Prevention (Cloud DLP) API to remove any PII data. Store the result in BigQuery."}, {"letter": "B", "text": "Create a Dataflow pipeline to retrieve the data from the external sources. As part of the pipeline, store all non-PII data in BigQuery and store all PII data in a Cloud Storage bucket that has a retention policy set."}, {"letter": "C", "text": "Ask the external partners to upload all data on Cloud Storage. Configure Bucket Lock for the bucket. Create a Dataflow pipeline to read the data from the bucket. As part of the pipeline, use the Cloud Data Loss Prevention (Cloud DLP) API to remove any PII data. Store the result in BigQuery."}, {"letter": "D", "text": "Ask the external partners to import all data in your BigQuery dataset. Create a dataflow pipeline to copy the data into a new table. As part of the Dataflow bucket, skip all data in columns that have PII data"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68685-exam-professional-cloud-architect-topic-1-question-174/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Dataflow/Dataproc", "Sensitive Data Protection(DLP)", "BigQuery", "安全性"]}, {"id": "T1-Q175", "topic": 1, "qnum": 175, "question": "You want to allow your operations team to store logs from all the production projects in your Organization, without including logs from other projects. All of the production projects are contained in a folder. You want to ensure that all logs for existing and new production projects are captured automatically. What should you do?", "options": [{"letter": "A", "text": "Create an aggregated export on the Production folder. Set the log sink to be a Cloud Storage bucket in an operations project."}, {"letter": "B", "text": "Create an aggregated export on the Organization resource. Set the log sink to be a Cloud Storage bucket in an operations project."}, {"letter": "C", "text": "Create log exports in the production projects. Set the log sinks to be a Cloud Storage bucket in an operations project."}, {"letter": "D", "text": "Create log exports in the production projects. Set the log sinks to be BigQuery datasets in the production projects, and grant IAM access to the operations team to run queries on the datasets."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68686-exam-professional-cloud-architect-topic-1-question-175/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "Organization Policy"]}, {"id": "T1-Q176", "topic": 1, "qnum": 176, "question": "Your company has an application that is running on multiple instances of Compute Engine. It generates 1 TB per day of logs. For compliance reasons, the logs need to be kept for at least two years. The logs need to be available for active query for 30 days. After that, they just need to be retained for audit purposes. You want to implement a storage solution that is compliant, minimizes costs, and follows Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "1. Install a Cloud Logging agent on all instances. 2. Create a sink to export logs into a regional Cloud Storage bucket. 3. Create an Object Lifecycle rule to move files into a Coldline Cloud Storage bucket after one month. 4. Configure a retention policy at the bucket level using bucket lock."}, {"letter": "B", "text": "1. Write a daily cron job, running on all instances, that uploads logs into a Cloud Storage bucket. 2. Create a sink to export logs into a regional Cloud Storage bucket. 3. Create an Object Lifecycle rule to move files into a Coldline Cloud Storage bucket after one month."}, {"letter": "C", "text": "1. Install a Cloud Logging agent on all instances. 2. Create a sink to export logs into a partitioned BigQuery table. 3. Set a time_partitioning_expiration of 30 days."}, {"letter": "D", "text": "1. Create a daily cron job, running on all instances, that uploads logs into a partitioned BigQuery table. 2. Set a time_partitioning_expiration of 30 days."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68688-exam-professional-cloud-architect-topic-1-question-176/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Cloud Storage", "Cloud Monitoring/Logging", "合規性", "成本優化"]}, {"id": "T1-Q177", "topic": 1, "qnum": 177, "question": "Your company has just recently activated Cloud Identity to manage users. The Google Cloud Organization has been configured as well. The security team needs to secure projects that will be part of the Organization. They want to prohibit IAM users outside the domain from gaining permissions from now on. What should they do?", "options": [{"letter": "A", "text": "Configure an organization policy to restrict identities by domain."}, {"letter": "B", "text": "Configure an organization policy to block creation of service accounts."}, {"letter": "C", "text": "Configure Cloud Scheduler to trigger a Cloud Function every hour that removes all users that don't belong to the Cloud Identity domain from all projects."}, {"letter": "D", "text": "Create a technical user (e.g., [email protected]), and give it the project owner role at root organization level. Write a bash script that: ג€¢ Lists all the IAM rules of all projects within the organization. ג€¢ Deletes all users that do not belong to the company domain. Create a Compute Engine instance in a project within the Organization and configure gcloud to be executed with technical user credentials. Configure a cron job that executes the bash script every hour."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68690-exam-professional-cloud-architect-topic-1-question-177/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Organization Policy", "IAM", "安全性"]}, {"id": "T1-Q178", "topic": 1, "qnum": 178, "question": "Your company has an application running on Google Cloud that is collecting data from thousands of physical devices that are globally distributed. Data is published to Pub/Sub and streamed in real time into an SSD Cloud Bigtable cluster via a Dataflow pipeline. The operations team informs you that your CloudBigtable cluster has a hotspot, and queries are taking longer than expected. You need to resolve the problem and prevent it from happening in the future. What should you do?", "options": [{"letter": "A", "text": "Advise your clients to use HBase APIs instead of NodeJS APIs."}, {"letter": "B", "text": "Delete records older than 30 days."}, {"letter": "C", "text": "Review your RowKey strategy and ensure that keys are evenly spread across the alphabet."}, {"letter": "D", "text": "Double the number of nodes you currently have."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68691-exam-professional-cloud-architect-topic-1-question-178/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Bigtable", "效能調校", "資料庫Schema設計"]}, {"id": "T1-Q179", "topic": 1, "qnum": 179, "question": "Your company has a Google Cloud project that uses BigQuery for data warehousing. There are some tables that contain personally identifiable information (PII).Only the compliance team may access the PII. The other information in the tables must be available to the data science team. You want to minimize cost and the time it takes to assign appropriate access to the tables. What should you do?", "options": [{"letter": "A", "text": "1. From the dataset where you have the source data, create views of tables that you want to share, excluding PII. 2. Assign an appropriate project-level IAM role to the members of the data science team. 3. Assign access controls to the dataset that contains the view."}, {"letter": "B", "text": "1. From the dataset where you have the source data, create materialized views of tables that you want to share, excluding PII. 2. Assign an appropriate project-level IAM role to the members of the data science team. 3. Assign access controls to the dataset that contains the view."}, {"letter": "C", "text": "1. Create a dataset for the data science team. 2. Create views of tables that you want to share, excluding PII. 3. Assign an appropriate project-level IAM role to the members of the data science team. 4. Assign access controls to the dataset that contains the view. 5. Authorize the view to access the source dataset."}, {"letter": "D", "text": "1. Create a dataset for the data science team. 2. Create materialized views of tables that you want to share, excluding PII. 3. Assign an appropriate project-level IAM role to the members of the data science team. 4. Assign access controls to the dataset that contains the view. 5. Authorize the view to access the source dataset."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68692-exam-professional-cloud-architect-topic-1-question-179/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["BigQuery", "IAM", "安全性"]}, {"id": "T1-Q180", "topic": 1, "qnum": 180, "question": "Your operations team currently stores 10 TB of data in an object storage service from a third-party provider. They want to move this data to a Cloud Storage bucket as quickly as possible, following Google-recommended practices. They want to minimize the cost of this data migration. Which approach should they use?", "options": [{"letter": "A", "text": "Use the gsutil mv command to move the data."}, {"letter": "B", "text": "Use the Storage Transfer Service to move the data."}, {"letter": "C", "text": "Download the data to a Transfer Appliance, and ship it to Google."}, {"letter": "D", "text": "Download the data to the on-premises data center, and upload it to the Cloud Storage bucket."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68693-exam-professional-cloud-architect-topic-1-question-180/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移", "成本優化"]}, {"id": "T1-Q181", "topic": 1, "qnum": 181, "question": "You have a Compute Engine managed instance group that adds and removes Compute Engine instances from the group in response to the load on your application. The instances have a shutdown script that removes REDIS database entries associated with the instance. You see that many database entries have not been removed, and you suspect that the shutdown script is the problem. You need to ensure that the commands in the shutdown script are run reliably every time an instance is shut down. You create a Cloud Function to remove the database entries. What should you do next?", "options": [{"letter": "A", "text": "Modify the shutdown script to wait for 30 seconds before triggering the Cloud Function."}, {"letter": "B", "text": "Do not use the Cloud Function. Modify the shutdown script to restart if it has not completed in 30 seconds."}, {"letter": "C", "text": "Set up a Cloud Monitoring sink that triggers the Cloud Function after an instance removal log message arrives in Cloud Logging."}, {"letter": "D", "text": "Modify the shutdown script to wait for 30 seconds and then publish a message to a Pub/Sub queue."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80034-exam-professional-cloud-architect-topic-1-question-181/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["Pub/Sub", "Compute Engine", "高可用性/災難復原"], "keywords": ["ensure that the commands in the shutdown script are run reliably every time an instance is shut down"], "explanation": {"questionZh": "你有一個 Compute Engine 代管執行個體群組（managed instance group），會根據應用程式負載自動增減執行個體。這些執行個體有一個關機腳本（shutdown script），負責移除跟該執行個體相關的 REDIS 資料庫項目。你發現許多資料庫項目沒有被正確移除，懷疑是這個關機腳本有問題。你需要確保關機腳本裡的指令，在每次執行個體關機時都能可靠地執行。你建立了一個 Cloud Function 來移除資料庫項目。接下來該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：還是依賴關機腳本本身要可靠執行完畢，而腳本能不能可靠執行完，正是題目懷疑出問題的根源。多等 30 秒並沒有解決『腳本可能根本沒機會執行完』這個根本問題。", "zh": "修改關機腳本，等待 30 秒後再觸發 Cloud Function。"}, {"letter": "B", "analysis": "錯誤：同樣完全依賴關機腳本本身，而且『沒完成就重啟』的邏輯在 VM 正在關機的情境下也不合理——VM 都要被關閉了，重啟腳本沒有意義。", "zh": "不要使用 Cloud Function，改為修改關機腳本，使其在 30 秒內沒有完成時重新啟動。"}, {"letter": "C", "analysis": "正確：完全繞過不可靠的關機腳本，改用 GCP 控制平面自己產生、保證可靠發生的『執行個體移除』稽核日誌作為觸發來源。這筆日誌是代管執行個體群組真正移除 VM 時，由 GCP 管理系統自動產生的，不受那台正在關機、可能被強制終止的 VM 本身影響，因此能可靠地觸發 Cloud Function。", "zh": "設定一個 Cloud Monitoring 的 sink，在『執行個體移除』的日誌訊息出現在 Cloud Logging 後，觸發 Cloud Function。"}, {"letter": "D", "analysis": "錯誤：一樣是從關機腳本內部觸發後續動作，沒有解決『關機腳本本身執行不可靠』這個根本原因，只是把下游動作換成 Pub/Sub，上游觸發點還是那個有問題的腳本。", "zh": "修改關機腳本，等待 30 秒後發送一則訊息到 Pub/Sub 佇列。"}], "notes": [{"heading": "題目在問什麼", "body": "代管執行個體群組自動增減 VM 時，VM 上的關機腳本負責清理 REDIS 資料庫項目，但清理經常沒有確實發生，需要找出一個能可靠觸發清理動作的方法。"}, {"heading": "答案驗證：C", "body": "A、B、D 都還是把『可靠執行』寄託在關機腳本本身身上，改的只是腳本內部的等待時間、重啟邏輯或下游發送目標，但觸發起點依然是那台正在關機、執行環境不穩定的 VM 本身，沒有解決根本問題。C 改成監看 GCP 控制平面自動產生的『執行個體移除』稽核日誌，這筆日誌的產生不受該 VM 自身執行狀況影響，是可靠的外部事件來源，因此 Cloud Function 能被確實觸發。"}, {"heading": "核心概念：為什麼 Compute Engine 的關機腳本本身不可靠", "body": "VM 要被關閉時（不管是代管執行個體群組自動縮減、還是被搶占式刪除），GCP 只會給關機腳本一段有限的時間視窗去執行。如果腳本在這段時間內還沒執行完，VM 就會被強制終止，腳本後面沒執行到的部分就直接消失——這解釋了題目觀察到『許多資料庫項目沒有被移除』的現象。不要相信『即將被關閉的東西，自己能可靠地回報自己被關閉了』，應該改成相信『關閉這個動作的外部管理者（GCP 控制平面）』留下的紀錄，從可靠的來源去觸發後續動作——這正是選項 C 的設計邏輯，也是這題考的核心概念。"}]}}, {"id": "T1-Q182", "topic": 1, "qnum": 182, "question": "You are managing several projects on Google Cloud and need to interact on a daily basis with BigQuery, Bigtable, and Kubernetes Engine using the gcloud CL tool. You are travelling a lot and work on different workstations during the week. You want to avoid having to manage the gcloud CLI manually. What should you do?", "options": [{"letter": "A", "text": "Use Google Cloud Shell in the Google Cloud Console to interact with Google Cloud."}, {"letter": "B", "text": "Create a Compute Engine instance and install gcloud on the instance. Connect to this instance via SSH to always use the same gcloud installation when interacting with Google Cloud."}, {"letter": "C", "text": "Install gcloud on all of your workstations. Run the command gcloud components auto-update on each workstation"}, {"letter": "D", "text": "Use a package manager to install gcloud on your workstations instead of installing it manually."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80035-exam-professional-cloud-architect-topic-1-question-182/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["CI/CD"], "keywords": ["avoid having to manage the gcloud CLI manually"], "explanation": {"questionZh": "你同時管理著 Google Cloud 上的好幾個專案，每天都需要用 gcloud 指令列工具跟 BigQuery、Bigtable、Kubernetes Engine 互動。你經常出差，每週會在不同的工作站上工作。你想避免自己手動維護管理 gcloud CLI。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：Cloud Shell 是瀏覽器內建的終端機，完全不用在任何電腦上安裝任何東西，內建 gcloud 並由 Google 負責自動更新，不管用哪台電腦登入都是同一套環境，完全脫鉤於具體的實體工作站，徹底解決經常換電腦工作的痛點。", "zh": "使用 Google Cloud Console 裡的 Google Cloud Shell 來跟 Google Cloud 互動。"}, {"letter": "B", "analysis": "錯誤：看似統一了環境，但依然要自己管理一整台 VM（作業系統更新、安全性修補、運作成本、SSH 金鑰管理），不是避免管理，而是把管理負擔換了個地方，還多了一層基礎設施要維護。", "zh": "建立一個 Compute Engine 執行個體並在上面安裝 gcloud，透過 SSH 連接這個執行個體，確保每次跟 Google Cloud 互動時都使用同一套 gcloud 安裝。"}, {"letter": "C", "analysis": "錯誤：雖然加了自動更新，但前提是得先在每一台工作站上手動安裝一次，還要自己確保每台電腦上的安裝狀態一致，管理負擔依然在使用者身上。", "zh": "在你所有的工作站上安裝 gcloud，在每台工作站上執行 gcloud components auto-update 指令。"}, {"letter": "D", "analysis": "錯誤：只是讓安裝這個動作變簡單一點，但每一台工作站依然需要個別安裝、個別維護，沒有從根本解決『要在多台機器上管理 gcloud』這個問題。", "zh": "改用套件管理工具在你的工作站上安裝 gcloud，取代手動安裝。"}], "notes": [{"heading": "題目在問什麼", "body": "使用者經常換工作站，想找一個不用自己手動安裝、維護 gcloud CLI 的方式，來跟多個 GCP 專案互動。"}, {"heading": "答案驗證：A", "body": "B、C、D 的共同問題是：不管用什麼方式，使用者（或某台特定的 VM）依然要負責安裝或維護 gcloud 這件事本身，只是維護的方式或地點不同。A 選項的 Cloud Shell 從根本上跳脫這個問題——它是 Google 全代管、瀏覽器內建的終端機，零安裝、自動更新、環境跟具體電腦完全脫鉤，完全符合『避免手動管理』的需求。"}, {"heading": "核心概念：Cloud Shell 是什麼", "body": "Google Cloud Console 內建的瀏覽器內終端機（browser-based shell）。特性：零安裝，只要打開瀏覽器登入 Console 就有現成終端機可用；已內建 gcloud、kubectl 等常用工具，由 Google 負責自動更新版本；環境一致，不管用哪台電腦、哪個瀏覽器登入，打開的都是同一套環境設定（甚至有一塊持久化的個人儲存空間保留設定檔）。B 選項雖然也把環境集中到單一地方（一台固定 VM），立意類似，但差別在於 Cloud Shell 是免費全代管服務，VM 則需要自己負責維運、付費、管理安全性——用一台自己要管理的 VM 去解決『不想自己管理東西』的需求，邏輯上是矛盾的。"}]}}, {"id": "T1-Q183", "topic": 1, "qnum": 183, "question": "Your company recently acquired a company that has infrastructure in Google Cloud. Each company has its own Google Cloud organization. Each company is using a Shared Virtual Private Cloud (VPC) to provide network connectivity for its applications. Some of the subnets used by both companies overlap. In order for both businesses to integrate, the applications need to have private network connectivity. These applications are not on overlapping subnets. You want to provide connectivity with minimal re-engineering. What should you do?", "options": [{"letter": "A", "text": "Set up VPC peering and peer each Shared VPC together."}, {"letter": "B", "text": "Migrate the projects from the acquired company into your company's Google Cloud organization. Re-launch the instances in your companies Shared VPC."}, {"letter": "C", "text": "Set up a Cloud VPN gateway in each Shared VPC and peer Cloud VPNs."}, {"letter": "D", "text": "Configure SSH port forwarding on each application to provide connectivity between applications in the different Shared VPCs."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80075-exam-professional-cloud-architect-topic-1-question-183/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["VPC/網路"], "keywords": ["Some of the subnets used by both companies overlap", "minimal re-engineering"], "explanation": {"questionZh": "你的公司最近併購了一家已經在 Google Cloud 上有基礎設施的公司。兩家公司各自擁有自己的 Google Cloud organization，各自都用一個 Shared VPC 來提供應用程式的網路連線。兩家公司有部分子網路的 IP 範圍是重疊的。為了讓雙方業務整合，雙方的應用程式需要有私有網路連線——而這些需要互連的應用程式本身不在重疊的子網路上。你想用最少的重新工程來提供這個連線。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：VPC Peering 是把兩個 VPC 的整個網路空間對等連接起來，效果接近把兩個網路合併成一個，只要雙方任何地方有子網路 IP 範圍重疊，整個 Peering 關係就會失敗，沒辦法只挑沒有衝突的子網路連、跳過重疊的部分。", "zh": "設定 VPC Peering，把兩個 Shared VPC 互相對等連接。"}, {"letter": "B", "analysis": "錯誤：這是大規模遷移——搬專案、重新部署執行個體，很可能還要處理 IP 重新規劃，完全不符合『最少重新工程』的要求。", "zh": "把被併購公司的專案遷移到你公司的 Google Cloud organization。在你公司的 Shared VPC 裡重新啟動這些執行個體。"}, {"letter": "C", "analysis": "正確：VPN 建立的是兩個獨立網路之間的一條特定管道，不是把兩個網路合併成一個。具體要讓哪些 IP 範圍能通過這條管道，是用路由設定一條一條指定的，可以只設定讓沒有重疊的子網路之間互連，完全不去碰重疊的子網路，兩個 Shared VPC 本身維持完全獨立，不需要處理重疊衝突。", "zh": "在每個 Shared VPC 裡各設一個 Cloud VPN gateway，把兩邊的 Cloud VPN 互相對接。"}, {"letter": "D", "analysis": "錯誤：這是手動、逐一應用程式設定的克難做法，不是正規的網路層級連線方案，無法規模化，也不符合『私有網路連線』這種整體基礎設施層級的需求。", "zh": "在每個應用程式上設定 SSH port forwarding，提供不同 Shared VPC 裡的應用程式之間的連線。"}], "notes": [{"heading": "題目在問什麼", "body": "併購後兩家公司各自有獨立的 Google Cloud organization 和 Shared VPC，部分子網路 IP 範圍重疊，但真正需要互連的應用程式不在重疊的子網路上，要用最少的改動提供雙方私有網路連線。"}, {"heading": "答案驗證：C", "body": "核心陷阱在於『部分子網路重疊』：VPC Peering（A）會把整個 VPC 網路空間對等連接，只要任何地方有重疊就整個失敗，無法只挑沒有衝突的部分連接。Cloud VPN（C）則不同，它只是在兩個獨立網路之間開一條特定管道，透過路由設定精準指定只讓沒有重疊的子網路互通，重疊的子網路完全不設路由、不受影響。B 是大規模遷移、D 是不可規模化的手動做法，都不符合最少重新工程的要求。"}, {"heading": "核心概念：什麼是「子網路 IP 範圍重疊」", "body": "每個子網路會被分配一段連續的 IP 位址範圍（CIDR，例如 10.0.1.0/24）。『重疊』指兩個不同公司／VPC 的子網路，用了完全一樣或有交集的 IP 範圍（例如 A 公司的 subnet-a1 和 B 公司的 subnet-b1 都用 10.0.1.0/24）。這通常是因為兩家公司在併購前是互相獨立的組織，各自設計網路時不知道對方的存在，剛好用到同一段常見的私有 IP 慣例範圍所致。如果把兩邊網路直接合併（像 VPC Peering 做的事），系統會分不清楚某個重疊範圍內的位址到底屬於哪一邊，造成路由衝突；即使真正要連線的子網路本身沒有重疊，只要整個 VPC 裡任何地方有重疊，Peering 整體就會受影響。"}, {"heading": "核心概念：VPC Peering vs VPN 的本質差異", "body": "VPC Peering 效果接近『把兩個網路整個合併成一個』，牽一髮動全身，只要任何地方 IP 重疊就整個失敗。VPN 則是在兩個保持完全獨立的網路之間，建立一條點對點的加密管道，管道裡具體要放行哪些 IP 範圍的流量，由路由設定（靜態路由或 BGP）一條一條指定——可以只設定讓沒有重疊的子網路（例如 subnet-a2 10.0.2.0/24 ↔ subnet-b2 10.0.3.0/24）互通，重疊的子網路（subnet-a1/subnet-b1 都是 10.0.1.0/24）則完全不設路由，彼此碰不到也不需要碰到，自然不會因為 IP 重疊產生衝突。兩個 Shared VPC 本身維持各自獨立管理，不是合併成同一個網路。"}]}}, {"id": "T1-Q184", "topic": 1, "qnum": 184, "question": "You are managing several internal applications that are deployed on Compute Engine. Business users inform you that an application has become very slow over the past few days. You want to find the underlying cause in order to solve the problem. What should you do first?", "options": [{"letter": "A", "text": "Inspect the logs and metrics from the instances in Cloud Logging and Cloud Monitoring."}, {"letter": "B", "text": "Change the Compute Engine Instances behind the application to a machine type with more CPU and memory."}, {"letter": "C", "text": "Restore a backup of the application database from a time before the application became slow."}, {"letter": "D", "text": "Deploy the applications on a managed instance group with autoscaling enabled. Add a load balancer in front of the managed instance group, and have the users connect to the IP of the load balancer."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/79697-exam-professional-cloud-architect-topic-1-question-184/", "postedDate": "2022-09-03", "postedYear": 2022, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "效能調校"], "keywords": ["want to find the underlying cause in order to solve the problem", "What should you do first"], "explanation": {"questionZh": "你負責管理好幾個部署在 Compute Engine 上的內部應用程式。業務使用者反映，某個應用程式在過去幾天變得非常緩慢。你想找出根本原因來解決這個問題。你首先應該做什麼？", "optionTable": [{"letter": "A", "analysis": "正確：在還不知道真正原因之前，先到 Cloud Logging 和 Cloud Monitoring 蒐集日誌與效能指標證據，才能判斷問題實際出在哪裡（CPU、記憶體、磁碟 I/O、錯誤率、外部依賴等），是系統化除錯的第一步。", "zh": "到 Cloud Logging 和 Cloud Monitoring 檢查執行個體的日誌和指標。"}, {"letter": "B", "analysis": "錯誤：在不知道真正原因的情況下，直接假設問題是資源不足就動手換機型，但變慢的原因可能完全不是 CPU/記憶體問題，沒診斷就下藥可能根本沒解決問題，還多花了錢。", "zh": "把應用程式背後的 Compute Engine 執行個體換成 CPU 和記憶體更大的機型。"}, {"letter": "C", "analysis": "錯誤：這是有風險、會造成資料遺失的激進動作，而且同樣是在不確定資料庫是否就是問題根源的情況下貿然執行。", "zh": "把應用程式的資料庫還原到變慢之前某個時間點的備份。"}, {"letter": "D", "analysis": "錯誤：這是架構層級的重大改動，不是在診斷問題，而且隱含假設問題是流量太大，但題目根本還沒確認原因是什麼。", "zh": "把應用程式部署到有啟用自動擴增的代管執行個體群組上，在前面加一個負載平衡器，讓使用者連到負載平衡器的 IP。"}], "notes": [{"heading": "題目在問什麼", "body": "應用程式變慢，業務使用者反映，要找出根本原因來解決問題，問的是「首先」該做什麼。"}, {"heading": "答案驗證：A", "body": "這題本質在考系統化除錯的基本原則，不是特定服務細節：先觀察、蒐集證據（日誌、指標），從證據找出根本原因，再針對根本原因對症下藥。B、C、D 都是在還不知道原因的情況下，直接採取猜測性的動作（換機型、還原備份、重新架構），可能完全沒打中真正的問題，還可能帶來新的風險（例如還原備份會遺失最近的資料）。"}, {"heading": "核心概念：Cloud Logging 和 Cloud Monitoring 的分工", "body": "Cloud Logging 記錄應用程式和系統實際發生的事件（錯誤訊息、請求記錄等文字化紀錄）；Cloud Monitoring 記錄數值型的效能指標（CPU 使用率、記憶體用量、磁碟 I/O、網路流量等隨時間變化的數據）。把這兩者放在一起看，才能具體判斷問題出在哪裡（CPU 真的滿載？記憶體不夠？某個時間點開始大量出錯？還是外部服務拖慢回應？），有了具體證據才能決定下一步該用哪種解法，而不是用猜的。"}]}}, {"id": "T1-Q185", "topic": 1, "qnum": 185, "question": "Your company has an application running as a Deployment in a Google Kubernetes Engine (GKE) cluster. When releasing new versions of the application via a rolling deployment, the team has been causing outages. The root cause of the outages is misconfigurations with parameters that are only used in production. You want to put preventive measures for this in the platform to prevent outages. What should you do?", "options": [{"letter": "A", "text": "Configure liveness and readiness probes in the Pod specification."}, {"letter": "B", "text": "Configure health checks on the managed instance group."}, {"letter": "C", "text": "Create a Scheduled Task to check whether the application is available."}, {"letter": "D", "text": "Configure an uptime alert in Cloud Monitoring."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/79702-exam-professional-cloud-architect-topic-1-question-185/", "postedDate": "2022-09-03", "postedYear": 2022, "tags": ["GKE/Kubernetes", "CI/CD", "高可用性/災難復原"], "keywords": ["The root cause of the outages is misconfigurations with parameters that are only used in production", "put preventive measures for this in the platform to prevent outages"], "explanation": {"questionZh": "你的公司有一個應用程式，以 Deployment 的形式跑在 Google Kubernetes Engine（GKE）叢集上。團隊在透過滾動式部署（rolling deployment）發布新版本時，已經造成過好幾次服務中斷。根本原因是只有在正式環境（production）才會用到的參數設定錯誤。你想在平台層面加上預防性措施，避免這種中斷再發生。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：readiness probe 持續檢查新 Pod 裡的應用程式是否真的準備好接收流量。如果正式環境專屬的參數設錯，導致 Pod 啟動後應用程式運作異常，readiness probe 會持續回報『還沒準備好』，Kubernetes 因此不會把流量導向這個壞掉的 Pod，也不會繼續汰換更多健康的舊 Pod，讓有問題的版本完全沒機會影響到使用者，從源頭預防中斷。", "zh": "在 Pod 規格裡設定 liveness 和 readiness probes。"}, {"letter": "B", "analysis": "錯誤：用錯層級。代管執行個體群組（MIG）健康檢查是 Compute Engine VM 層級的機制，GKE 的應用程式健康狀態是透過 Kubernetes 自己的 probe 機制管理的，不是透過 MIG 負責。", "zh": "在代管執行個體群組上設定健康檢查。"}, {"letter": "C", "analysis": "錯誤：這是事後偵測（問題發生之後才發現），不是預防性措施，而且是外部、獨立於部署流程的做法，沒辦法阻止有問題的版本先造成中斷。", "zh": "建立一個排程任務，檢查應用程式是否可用。"}, {"letter": "D", "analysis": "錯誤：同樣是事後偵測，警報只會在服務已經掛掉之後通知你，沒辦法在部署當下就擋下有問題的版本。", "zh": "在 Cloud Monitoring 設定正常執行時間警報。"}], "notes": [{"heading": "題目在問什麼", "body": "GKE 上的應用程式透過滾動式部署發布新版本時，因為正式環境專屬的參數設錯，多次造成服務中斷，要在平台層面加上「預防性」措施（不是事後發現，而是從源頭不讓問題影響使用者）。"}, {"heading": "答案驗證：A", "body": "B 用錯層級（MIG 健康檢查管的是 VM，不是 GKE 應用程式層級）；C、D 都是事後偵測，問題已經發生才被動發現，無法預防中斷本身。只有 A 的 readiness probe 能在滾動更新過程中，主動擋下還沒準備好（可能因設定錯誤而異常）的新 Pod，不讓它接收使用者流量，真正做到『預防』。"}, {"heading": "延伸澄清：正式環境專屬參數設錯，跟 Pod 有什麼關係", "body": "應用程式在不同環境（開發、測試、正式環境）執行時，常需要用到不同的設定值（資料庫連線字串、外部服務金鑰、feature flag 等），這些參數通常透過 ConfigMap 或 Secret，在 Pod 啟動時注入到容器裡。Pod 就是應用程式真正被執行的地方——滾動更新時，Kubernetes 實際上是在建立一個個新的 Pod，每個新 Pod 啟動時會讀取正式環境專屬的那組參數。\n\n如果這組參數本身設錯，這個錯誤只有在 Pod 真正用「正式環境的這組參數」啟動時才會被觸發——這解釋了為什麼開發/測試階段測不出問題（測試環境用的是另一套參數，根本沒用到有問題的那組），只有部署到正式環境、新 Pod 用正式環境參數啟動時，應用程式才會因讀到錯誤設定而運作異常（啟動失敗、連不上資料庫等）。這個異常正好會被 readiness probe 偵測到：Pod 容器本身可能還在跑（沒有直接 crash），但裡面的應用程式其實是壞的，readiness probe 持續檢查後回報『還沒準備好』，Kubernetes 因此不會把流量導向這個壞掉的 Pod。"}, {"heading": "延伸澄清：Readiness probe 是 GKE 的機制嗎", "body": "不是 GKE 專屬發明的，而是 Kubernetes 這個開源專案本身的原生機制，屬於 Pod 規格（Pod spec）裡定義的標準欄位。不管叢集是跑在 GKE、AWS 的 EKS、Azure 的 AKS、還是自己架設的 Kubernetes，readiness probe 的設定方式和運作邏輯都完全一樣，因為這是 Kubernetes 技術規格本身定義的功能。GKE 的角色是代管、執行這套標準的 Kubernetes（幫忙顧好控制平面、節點維運），readiness probe 的邏輯和規則則是 Kubernetes 本身的設計，GKE 只是照著標準去執行它。"}]}}, {"id": "T1-Q186", "topic": 1, "qnum": 186, "question": "Your company uses Google Kubernetes Engine (GKE) as a platform for all workloads. Your company has a single large GKE cluster that contains batch, stateful, and stateless workloads. The GKE cluster is configured with a single node pool with 200 nodes. Your company needs to reduce the cost of this cluster but does not want to compromise availability. What should you do?", "options": [{"letter": "A", "text": "Create a second GKE cluster for the batch workloads only. Allocate the 200 original nodes across both clusters."}, {"letter": "B", "text": "Configure CPU and memory limits on the namespaces in the cluster. Configure all Pods to have a CPU and memory limits."}, {"letter": "C", "text": "Configure a HorizontalPodAutoscaler for all stateless workloads and for all compatible stateful workloads. Configure the cluster to use node auto scaling."}, {"letter": "D", "text": "Change the node pool to use preemptible VMs."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/79736-exam-professional-cloud-architect-topic-1-question-186/", "postedDate": "2022-09-03", "postedYear": 2022, "tags": ["GKE/Kubernetes", "成本優化", "自動擴縮"], "keywords": ["needs to reduce the cost of this cluster but does not want to compromise availability"], "explanation": {"questionZh": "你的公司用 Google Kubernetes Engine（GKE）作為所有工作負載的平台。公司有一個單一的大型 GKE 叢集，裡面混合跑著批次、有狀態、無狀態三種工作負載。這個 GKE 叢集設定成單一節點集區，固定有 200 個節點。公司需要降低這個叢集的成本，但不想犧牲可用性。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：只是把同樣數量的節點重新分配到兩個叢集，總節點數沒有減少，沒有解決『固定 200 個節點、不管實際負載多少都要付這麼多錢』的根本問題，無法降低成本。", "zh": "另外建立第二個 GKE 叢集，只放批次工作負載。把原本的 200 個節點拆分配置到兩個叢集。"}, {"letter": "B", "analysis": "錯誤：這是資源治理措施（避免某個 Pod 過度佔用資源），有助於穩定性，但單獨這樣做不會讓節點數量減少，沒有搭配自動擴縮機制，叢集還是固定 200 個節點，成本不會降低。", "zh": "在叢集的 namespace 上設定 CPU 和記憶體限制。讓所有 Pod 都設定 CPU 和記憶體限制。"}, {"letter": "C", "analysis": "正確：同時從 Pod 數量（HorizontalPodAutoscaler）和節點數量（Cluster Autoscaler）兩個層面做到按需調整——負載低時自動減少 Pod、閒置節點被自動移除以省錢；負載高時自動增加 Pod、自動新增節點以維持可用性，兼顧成本降低和可用性不受損。", "zh": "對所有無狀態工作負載、以及相容的有狀態工作負載設定 HorizontalPodAutoscaler，並讓叢集使用節點自動擴縮。"}, {"letter": "D", "analysis": "錯誤：先佔式虛擬機器便宜，但隨時可能被 Google 強制回收（最長跑 24 小時，且可能提前被中斷）。這個叢集還跑著有狀態的工作負載，節點隨時可能消失會直接犧牲可用性，違反題目要求。", "zh": "把節點集區改成使用先佔式虛擬機器（preemptible VMs）。"}], "notes": [{"heading": "題目在問什麼", "body": "混合跑批次、有狀態、無狀態工作負載的大型 GKE 叢集，固定 200 個節點，要在不犧牲可用性的前提下降低成本。"}, {"heading": "答案驗證：C", "body": "根本問題是固定 200 個節點不管實際負載高低都要付全額費用。正確解法需要兩個層面同時動起來：HorizontalPodAutoscaler（HPA）根據實際負載自動增減 Pod 數量；Cluster Autoscaler 根據 Pod 對資源的實際需求自動增減節點數量。負載低時 HPA 減少 Pod、節點變閒置、Cluster Autoscaler 移除閒置節點省錢；負載高時 HPA 增加 Pod、Cluster Autoscaler 新增節點維持可用性。A 只是重新分配節點不減少總數；B 只做資源治理沒有自動擴縮；D 用先佔式 VM 會因隨時被回收而直接犧牲有狀態工作負載的可用性。"}, {"heading": "延伸澄清：Node、Pod、Cluster、Node Pool 的層級關係", "body": "Kubernetes 架構由上到下：叢集（Cluster）→ 節點集區（Node Pool，一群設定相同的節點）→ 節點（Node，實際上就是一台虛擬機器，在 GKE 裡是一台 Compute Engine VM，提供 CPU/記憶體等底層運算資源）→ Pod（Kubernetes 最小部署單位，裡面裝著一個或多個容器，容器裡跑的才是真正的應用程式）。Pod 必須被排程到某一個 Node 上才能執行，一台 Node 上可以同時跑好幾個 Pod（只要資源夠分）。對應回 Q186：HPA 調整的是『Pod 的數量』（要開幾個 Pod 處理目前負載），Cluster Autoscaler 調整的是『Node 的數量』（要準備幾台機器容納這些 Pod），兩者作用在不同層級，合起來才能讓整個叢集容量跟著實際需求伸縮。"}]}}, {"id": "T1-Q187", "topic": 1, "qnum": 187, "question": "Your company has a Google Cloud project that uses BigQuery for data warehousing on a pay-per-use basis. You want to monitor queries in real time to discover the most costly queries and which users spend the most. What should you do?", "options": [{"letter": "A", "text": "1. In the BigQuery dataset that contains all the tables to be queried, add a label for each user that can launch a query. 2. Open the Billing page of the project. 3. Select Reports. 4. Select BigQuery as the product and filter by the user you want to check."}, {"letter": "B", "text": "1. Create a Cloud Logging sink to export BigQuery data access logs to BigQuery. 2. Perform a BigQuery query on the generated table to extract the information you need."}, {"letter": "C", "text": "1. Create a Cloud Logging sink to export BigQuery data access logs to Cloud Storage. 2. Develop a Dataflow pipeline to compute the cost of queries split by users."}, {"letter": "D", "text": "1. Activate billing export into BigQuery. 2. Perform a BigQuery query on the billing table to extract the information you need."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80112-exam-professional-cloud-architect-topic-1-question-187/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["BigQuery", "成本優化", "監控與可觀測性"], "keywords": ["monitor queries in real time to discover the most costly queries and which users spend the most"], "explanation": {"questionZh": "你的公司有一個 Google Cloud 專案，用 BigQuery 做資料倉儲，採用按使用量付費的方式。你想要即時監控查詢，找出哪些查詢最貴、哪些使用者花最多錢。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Billing 報表是聚合層級的資料（通常按專案/服務/SKU 彙總），沒有單筆查詢這麼細的顆粒度，而且 Billing 資料本身不是即時的。幫資料集標籤使用者，也沒辦法把實際花費精準歸因到每一次查詢、每一個使用者身上。", "zh": "1. 在包含所有要被查詢的資料表的 BigQuery 資料集上，為每個能發出查詢的使用者加上標籤。2. 打開專案的 Billing 頁面。3. 選擇 Reports。4. 選擇 BigQuery 作為產品，並依你想檢查的使用者篩選。"}, {"letter": "B", "analysis": "正確：BigQuery 的資料存取稽核日誌本身就包含每筆查詢的詳細資訊（誰查的、處理了多少資料量即對應成本、查詢時間與內容），匯出成 BigQuery 表後直接用 SQL 分析，是最直接、顆粒度最細、也最即時的做法。", "zh": "1. 建立一個 Cloud Logging sink，把 BigQuery 的資料存取日誌匯出到 BigQuery。2. 對產生的資料表執行 BigQuery 查詢，取得你需要的資訊。"}, {"letter": "C", "analysis": "錯誤：功能上可行，但做法過度複雜——多繞了一圈（先進 Cloud Storage、再自己寫 Dataflow pipeline 計算），增加開發與維運成本、拉長延遲，而 B 選項已能用更簡單直接的方式達成同樣效果，沒必要多此一舉。", "zh": "1. 建立一個 Cloud Logging sink，把 BigQuery 的資料存取日誌匯出到 Cloud Storage。2. 開發一個 Dataflow pipeline，依使用者分別計算查詢成本。"}, {"letter": "D", "analysis": "錯誤：帳單匯出資料的顆粒度通常是彙總層級（按日期/專案/服務/SKU），沒有記錄到是哪一筆具體查詢、查詢的 SQL 內容等細節，沒辦法精準找出哪些查詢最貴，而且帳單資料本身也不是即時產生的。", "zh": "1. 啟用帳單匯出到 BigQuery。2. 對帳單資料表執行查詢，取得你需要的資訊。"}], "notes": [{"heading": "題目在問什麼", "body": "要即時監控 BigQuery 的查詢，找出最貴的查詢和花最多錢的使用者，要選出顆粒度最細、最即時、最不費工的做法。"}, {"heading": "答案驗證：B", "body": "要分析『每一筆查詢』的成本和使用者，最精準的資料來源是 BigQuery 自己產生的稽核日誌，不是帳單資料（帳單資料只是彙總層級，看不到單筆查詢細節）。B 把稽核日誌直接匯出到 BigQuery、用 SQL 分析，是最自然快速的做法；C 功能上也可行但多繞一圈到 Cloud Storage 再自建 Dataflow pipeline，是不必要的額外複雜度；A、D 都停留在帳單/billing 層級，顆粒度不夠細。"}, {"heading": "核心概念：BigQuery 的資料存取稽核日誌（Data Access Audit Logs）", "body": "當有人對 BigQuery 下查詢時，GCP 會自動記錄一筆詳細的稽核日誌，包含：是誰（哪個使用者/服務帳戶）發出查詢、查詢實際掃描/處理了多少資料量（直接對應 BigQuery 的計費依據，因為 BigQuery 按掃描資料量計費）、查詢執行時間與 SQL 內容等。這些資訊比帳單資料細緻得多——帳單資料只會告訴你『這個專案今天在 BigQuery 上總共花了多少錢』，不會告訴你『是哪一筆 SQL、誰下的、花了多少』。把這些日誌直接匯出成 BigQuery 資料表後，可以直接用 SQL 查詢分析（依使用者分組加總、依查詢排序找出最貴的前幾名），是最自然、最快、最少額外工程的做法。"}]}}, {"id": "T1-Q188", "topic": 1, "qnum": 188, "question": "Your company and one of its partners each have a Google Cloud project in separate organizations. Your company's project (prj-a) runs in Virtual Private Cloud(vpc-a). The partner's project (prj-b) runs in vpc-b. There are two instances running on vpc-a and one instance running on vpc-b. Subnets defined in both VPCs are not overlapping. You need to ensure that all instances communicate with each other via internal IPs, minimizing latency and maximizing throughput. What should you do?", "options": [{"letter": "A", "text": "Set up a network peering between vpc-a and vpc-b."}, {"letter": "B", "text": "Set up a VPN between vpc-a and vpc-b using Cloud VPN."}, {"letter": "C", "text": "Configure IAP TCP forwarding on the instance in vpc-b, and then launch the following gcloud command from one of the instances in vpc-a gcloud: gcloud compute start-iap-tunnel INSTANCE_NAME_IN_VPC_8 22 \\ --local-host-port=localhost:22"}, {"letter": "D", "text": "1. Create an additional instance in vpc-a. 2. Create an additional instance in vpc-b. 3. Install OpenVPN in newly created instances. 4. Configure a VPN tunnel between vpc-a and vpc-b with the help of OpenVPN."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80000-exam-professional-cloud-architect-topic-1-question-188/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["VPC/網路"]}, {"id": "T1-Q189", "topic": 1, "qnum": 189, "question": "You want to store critical business information in Cloud Storage buckets. The information is regularly changed, but previous versions need to be referenced on a regular basis. You want to ensure that there is a record of all changes to any information in these buckets. You want to ensure that accidental edits or deletions can be easily rolled back. Which feature should you enable?", "options": [{"letter": "A", "text": "Bucket Lock"}, {"letter": "B", "text": "Object Versioning"}, {"letter": "C", "text": "Object change notification"}, {"letter": "D", "text": "Object Lifecycle Management"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80304-exam-professional-cloud-architect-topic-1-question-189/", "postedDate": "2022-09-05", "postedYear": 2022, "tags": ["Cloud Storage", "高可用性/災難復原"]}, {"id": "T1-Q190", "topic": 1, "qnum": 190, "question": "You have a Compute Engine application that you want to autoscale when total memory usage exceeds 80%. You have installed the Cloud Monitoring agent and configured the autoscaling policy as follows:✑ Metric identifier: agent.googleapis.com/memory/percent_used✑ Filter: metric.label.state = 'used'✑ Target utilization level: 80✑ Target type: GAUGEYou observe that the application does not scale under high load. You want to resolve this. What should you do?", "options": [{"letter": "A", "text": "Change the Target type to DELTA_PER_MINUTE."}, {"letter": "B", "text": "Change the Metric identifier to agent.googleapis.com/memory/bytes_used."}, {"letter": "C", "text": "Change the filter to metric.label.state = 'used' AND metric.label.state = 'buffered' AND metric.label.state = 'cached' AND metric.label.state = 'slab'."}, {"letter": "D", "text": "Change the filter to metric.label.state = 'free' and the Target utilization to 20."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80040-exam-professional-cloud-architect-topic-1-question-190/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q191", "topic": 1, "qnum": 191, "question": "You are deploying an application to Google Cloud. The application is part of a system. The application in Google Cloud must communicate over a private network with applications in a non-Google Cloud environment. The expected average throughput is 200 kbps. The business requires:✑ as close to 100% system availability as possible✑ cost optimizationYou need to design the connectivity between the locations to meet the business requirements. What should you provision?", "options": [{"letter": "A", "text": "An HA Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway"}, {"letter": "B", "text": "Two Classic Cloud VPN gateways connected to two on-premises VPN gateways Configure each Classic Cloud VPN gateway to have two tunnels, each connected to different on-premises VPN gateways"}, {"letter": "C", "text": "Two HA Cloud VPN gateways connected to two on-premises VPN gateways Configure each HA Cloud VPN gateway to have two tunnels, each connected to different on-premises VPN gateways"}, {"letter": "D", "text": "A single Cloud VPN gateway connected to an on-premises VPN gateway"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80419-exam-professional-cloud-architect-topic-1-question-191/", "postedDate": "2022-09-05", "postedYear": 2022, "tags": ["Interconnect/VPN", "高可用性/災難復原", "成本優化"]}, {"id": "T1-Q192", "topic": 1, "qnum": 192, "question": "Your company has an application running on App Engine that allows users to upload music files and share them with other people. You want to allow users to upload files directly into Cloud Storage from their browser session. The payload should not be passed through the backend. What should you do?", "options": [{"letter": "A", "text": "1. Set a CORS configuration in the target Cloud Storage bucket where the base URL of the App Engine application is an allowed origin.2. Use the Cloud Storage Signed URL feature to generate a POST URL."}, {"letter": "B", "text": "1. Set a CORS configuration in the target Cloud Storage bucket where the base URL of the App Engine application is an allowed origin.2. Assign the Cloud Storage WRITER role to users who upload files."}, {"letter": "C", "text": "1. Use the Cloud Storage Signed URL feature to generate a POST URL.2. Use App Engine default credentials to sign requests against Cloud Storage."}, {"letter": "D", "text": "1. Assign the Cloud Storage WRITER role to users who upload files.2. Use App Engine default credentials to sign requests against Cloud Storage."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121240-exam-professional-cloud-architect-topic-1-question-192/", "postedDate": "2023-09-23", "postedYear": 2023, "tags": ["App Engine", "Cloud Storage", "安全性"], "keywords": ["allow users to upload files directly into Cloud Storage from their browser session", "The payload should not be passed through the backend"], "explanation": {"questionZh": "公司有一個跑在 App Engine 上的應用程式，讓使用者可以上傳音樂檔案並分享給其他人。你希望使用者能直接從瀏覽器端上傳檔案到 Cloud Storage，檔案內容（payload）不應該經過後端。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：兩個步驟缺一不可。Signed URL 讓沒有 GCP 身分的匿名瀏覽器使用者，也能取得一次性、有時效的上傳授權；CORS 設定則讓瀏覽器允許這個跨網域（App Engine 網頁 → Cloud Storage）的請求真正送達，不會被瀏覽器自己擋下來。兩者搭配，完整達成『繞過後端、直接從瀏覽器上傳』的需求。", "zh": "1. 在目標 Cloud Storage bucket 設定 CORS，允許 App Engine 應用程式的網址作為合法來源。2. 使用 Cloud Storage 的 Signed URL 功能產生一個 POST URL。"}, {"letter": "B", "analysis": "錯誤：WRITER 角色屬於 IAM 權限，只能指派給已知、已註冊的 GCP 身分（使用者或服務帳戶）。公開音樂分享網站的訪客通常沒有 GCP 身分，不可能也不應該為每個訪客個別指派 IAM 角色，而且這會給予長期、無時效的寫入權限，不符合『單次上傳授權』的需求。", "zh": "1. 在目標 Cloud Storage bucket 設定 CORS，允許 App Engine 應用程式的網址作為合法來源。2. 把 Cloud Storage 的 WRITER 角色指派給上傳檔案的使用者。"}, {"letter": "C", "analysis": "錯誤：有做 Signed URL，但漏掉 CORS 設定這一步。沒有 CORS 允許 App Engine 的來源，瀏覽器會在請求送達 Cloud Storage 之前，就直接擋下這個跨網域請求，不管 Signed URL 本身多麼有效都沒用。", "zh": "1. 使用 Cloud Storage 的 Signed URL 功能產生一個 POST URL。2. 使用 App Engine 預設憑證對 Cloud Storage 簽署請求。"}, {"letter": "D", "analysis": "錯誤：同時犯了 B 和 C 的錯誤——既用不可行的方式把 IAM 角色指派給匿名使用者，也完全沒有設定 CORS，兩個必要條件都沒滿足。", "zh": "1. 把 Cloud Storage 的 WRITER 角色指派給上傳檔案的使用者。2. 使用 App Engine 預設憑證對 Cloud Storage 簽署請求。"}], "notes": [{"heading": "題目在問什麼", "body": "音樂分享網站想讓使用者直接從瀏覽器上傳檔案到 Cloud Storage，檔案內容不能先流過 App Engine 後端（避免後端變成頻寬瓶頸），要選出正確的架構做法。"}, {"heading": "答案驗證：A", "body": "正確做法分兩步：① 用 Signed URL 產生一個有時效、限定用途（POST 上傳）的授權網址，讓匿名訪客不需要 GCP 身分也能完成單次上傳；② 在 Cloud Storage bucket 設定 CORS，允許 App Engine 應用程式的來源，讓瀏覽器放行這個跨網域的上傳請求。兩者缺一不可，B/C/D 都各自漏掉其中一塊。"}, {"heading": "核心概念：App Engine 是什麼", "body": "Google Cloud 最早期的全代管網頁應用程式平台。開發者只要上傳程式碼，Google 就自動處理伺服器數量、自動擴縮、作業系統維運，不需要自己管
