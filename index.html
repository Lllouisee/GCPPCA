re reliability for your application and operations by supporting reliable task scheduling for compute on GCP. Leveraging Google best practices, what should you do?", "options": [{"letter": "A", "text": "Using the Cron service provided by App Engine, publish messages directly to a message-processing utility service running on Compute Engine instances."}, {"letter": "B", "text": "Using the Cron service provided by App Engine, publish messages to a Cloud Pub/Sub topic. Subscribe to that topic using a message-processing utility service running on Compute Engine instances."}, {"letter": "C", "text": "Using the Cron service provided by Google Kubernetes Engine (GKE), publish messages directly to a message-processing utility service running on Compute Engine instances."}, {"letter": "D", "text": "Using the Cron service provided by GKE, publish messages to a Cloud Pub/Sub topic. Subscribe to that topic using a message-processing utility service running on Compute Engine instances."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7233-exam-professional-cloud-architect-topic-1-question-100/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Pub/Sub", "高可用性/災難復原"]}, {"id": "T1-Q101", "topic": 1, "qnum": 101, "question": "Your company is building a new architecture to support its data-centric business focus. You are responsible for setting up the network. Your company's mobile and web-facing applications will be deployed on-premises, and all data analysis will be conducted in GCP. The plan is to process and load 7 years of archived .csv files totaling 900 TB of data and then continue loading 10 TB of data daily. You currently have an existing 100-MB internet connection.What actions will meet your company's needs?", "options": [{"letter": "A", "text": "Compress and upload both archived files and files uploaded daily using the gsutil ג€\"m option."}, {"letter": "B", "text": "Lease a Transfer Appliance, upload archived files to it, and send it to Google to transfer archived data to Cloud Storage. Establish a connection with Google using a Dedicated Interconnect or Direct Peering connection and use it to upload files daily."}, {"letter": "C", "text": "Lease a Transfer Appliance, upload archived files to it, and send it to Google to transfer archived data to Cloud Storage. Establish one Cloud VPN Tunnel to VPC networks over the public internet, and compress and upload files daily using the gsutil ג€\"m option."}, {"letter": "D", "text": "Lease a Transfer Appliance, upload archived files to it, and send it to Google to transfer archived data to Cloud Storage. Establish a Cloud VPN Tunnel to VPC networks over the public internet, and compress and upload files daily."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6306-exam-professional-cloud-architect-topic-1-question-101/", "postedDate": "2019-10-09", "postedYear": 2019, "tags": ["Cloud Storage", "Interconnect/VPN", "資料遷移"]}, {"id": "T1-Q102", "topic": 1, "qnum": 102, "question": "You are developing a globally scaled frontend for a legacy streaming backend data API. This API expects events in strict chronological order with no repeat data for proper processing.Which products should you deploy to ensure guaranteed-once FIFO (first-in, first-out) delivery of data?", "options": [{"letter": "A", "text": "Cloud Pub/Sub alone"}, {"letter": "B", "text": "Cloud Pub/Sub to Cloud Dataflow"}, {"letter": "C", "text": "Cloud Pub/Sub to Stackdriver"}, {"letter": "D", "text": "Cloud Pub/Sub to Cloud SQL"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6747-exam-professional-cloud-architect-topic-1-question-102/", "postedDate": "2019-10-18", "postedYear": 2019, "tags": ["Pub/Sub", "Dataflow/Dataproc"]}, {"id": "T1-Q103", "topic": 1, "qnum": 103, "question": "Your company is planning to perform a lift and shift migration of their Linux RHEL 6.5+ virtual machines. The virtual machines are running in an on-premisesVMware environment. You want to migrate them to Compute Engine following Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "1. Define a migration plan based on the list of the applications and their dependencies. 2. Migrate all virtual machines into Compute Engine individually with Migrate for Compute Engine."}, {"letter": "B", "text": "1. Perform an assessment of virtual machines running in the current VMware environment. 2. Create images of all disks. Import disks on Compute Engine. 3. Create standard virtual machines where the boot disks are the ones you have imported."}, {"letter": "C", "text": "1. Perform an assessment of virtual machines running in the current VMware environment. 2. Define a migration plan, prepare a Migrate for Compute Engine migration RunBook, and execute the migration."}, {"letter": "D", "text": "1. Perform an assessment of virtual machines running in the current VMware environment. 2. Install a third-party agent on all selected virtual machines. 3. Migrate all virtual machines into Compute Engine."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56841-exam-professional-cloud-architect-topic-1-question-103/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Compute Engine", "資料遷移"]}, {"id": "T1-Q104", "topic": 1, "qnum": 104, "question": "You need to deploy an application to Google Cloud. The application receives traffic via TCP and reads and writes data to the filesystem. The application does not support horizontal scaling. The application process requires full control over the data on the file system because concurrent access causes corruption. The business is willing to accept a downtime when an incident occurs, but the application must be available 24/7 to support their business operations. You need to design the architecture of this application on Google Cloud. What should you do?", "options": [{"letter": "A", "text": "Use a managed instance group with instances in multiple zones, use Cloud Filestore, and use an HTTP load balancer in front of the instances."}, {"letter": "B", "text": "Use a managed instance group with instances in multiple zones, use Cloud Filestore, and use a network load balancer in front of the instances."}, {"letter": "C", "text": "Use an unmanaged instance group with an active and standby instance in different zones, use a regional persistent disk, and use an HTTP load balancer in front of the instances."}, {"letter": "D", "text": "Use an unmanaged instance group with an active and standby instance in different zones, use a regional persistent disk, and use a network load balancer in front of the instances."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56360-exam-professional-cloud-architect-topic-1-question-104/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "Load Balancing", "高可用性/災難復原"], "keywords": ["does not support horizontal scaling", "full control over the data on the file system", "concurrent access causes corruption", "accept downtime", "available 24/7", "TCP traffic"], "explanation": {"questionZh": "你需要把一個應用程式部署到 Google Cloud。這個應用程式透過 TCP 接收流量，並對檔案系統讀寫資料。這個應用程式不支援水平擴展。因為並行存取（concurrent access）會造成資料損毀，所以應用程式處理程序必須對檔案系統上的資料擁有完全的控制權。業務上可以接受發生事故時的停機，但應用程式必須 24/7 可用以支援其營運。你需要為這個應用程式設計 Google Cloud 上的架構，該怎麼做？", "optionTable": [{"letter": "A", "analysis": "Managed instance group（MIG）設計的目的是水平擴展，會讓多台一模一樣的實例同時運作，直接違反「不支援水平擴展」的限制；Cloud Filestore 是共享式網路檔案系統，可被多台 VM 同時掛載存取，跟「並行存取會造成資料損毀，需要完全控制權」的要求衝突。另外 HTTP Load Balancer 只認得 HTTP(S) 流量，題目只說是 TCP，不保證是 HTTP。", "zh": "使用跨多個 zone 的 managed instance group，搭配 Cloud Filestore，並在前面使用 HTTP load balancer"}, {"letter": "B", "analysis": "同樣使用 MIG 和 Cloud Filestore，犯了跟 A 一樣「違反不支援水平擴展」與「共享檔案系統無法保證獨佔控制權」的問題。", "zh": "使用跨多個 zone 的 managed instance group，搭配 Cloud Filestore，並在前面使用 network load balancer"}, {"letter": "C", "analysis": "Unmanaged instance group 主備架構和 regional persistent disk 的部分符合「不支援水平擴展」與「需要獨佔資料控制權」的要求，但使用 HTTP Load Balancer 不對：HTTP LB 運作在應用層（L7），只能代理 HTTP/HTTPS 流量，題目講的是泛用的 TCP 流量，不保證是 HTTP，HTTP LB 無法處理非 HTTP 的 TCP 連線。", "zh": "使用跨不同 zone 的主備（active/standby）unmanaged instance group，搭配 regional persistent disk，並在前面使用 HTTP load balancer"}, {"letter": "D", "analysis": "正確。Unmanaged instance group 的主備架構符合「不支援水平擴展」且「可接受故障切換時的短暫停機」；regional persistent disk 同一時間只能被一台 VM 以讀寫模式掛載，結構上保證獨佔控制權，符合「並行存取會造成損毀」的限制；network load balancer 運作在傳輸層（L4），單純轉送 TCP 封包，不要求流量是 HTTP，並能依健康檢查把流量導向目前存活的實例。", "zh": "使用跨不同 zone 的主備（active/standby）unmanaged instance group，搭配 regional persistent disk，並在前面使用 network load balancer"}], "notes": [{"heading": "題目在問什麼", "body": "要把四個限制條件（不支援水平擴展、需要獨佔檔案系統控制權、可接受故障時的短暫停機、流量是泛用 TCP 而非一定是 HTTP）精準對應到正確的架構元件組合，而不是看到「高可用」就直覺選擴展性最強的方案。"}, {"heading": "答案驗證：D", "body": "Unmanaged instance group 主備架構對應「不支援水平擴展＋可接受故障切換停機」；regional persistent disk 的單一掛載特性對應「獨佔資料控制權，避免並行存取損毀」；network load balancer 對應「泛用 TCP 流量，不限 HTTP」。三個元件分別精準解決三個限制條件。"}, {"heading": "核心概念：什麼是水平擴展（Horizontal Scaling）", "body": "水平擴展是遇到流量變大時，不把單一機器變強（垂直擴展），而是多開幾台一模一樣、可互換、可同時運作的機器分攤流量。這個做法的前提是「多台機器同時處理同一份工作也不會互相干擾」。"}, {"heading": "核心概念：Managed Instance Group（MIG）與水平擴展的關係", "body": "MIG 是 GCP 用來實現水平擴展的機制：依照範本自動開出多台一模一樣、互相可替換的 VM，依流量自動增減數量（autoscaling），並自動修復壞掉的實例（auto-healing），這些機器全部同時在線上運作、分攤流量。MIG 的設計前提是「多台機器可以同時處理同一份工作，彼此互不衝突」，這跟本題「不支援水平擴展，且並行存取會造成資料損毀」的限制直接衝突，所以不能用 MIG。"}, {"heading": "核心概念：Unmanaged Instance Group 與主備架構的關係", "body": "Unmanaged instance group 只是把幾台手動建立、設定可能不同的 VM 分組起來，方便讓 Load Balancer 認得它們，GCP 不會自動幫忙做擴縮、自動修復或統一範本管理。這剛好適合「主備（active-standby）」架構：平常只有一台（active）真正處理流量，另一台（standby）待命，不會有兩台同時搶著讀寫同一份資料的情況，故障時才切換到 standby，符合題目「可接受故障切換時的短暫停機」的設定。"}, {"heading": "核心概念：Regional Persistent Disk 的單一掛載特性", "body": "Regional persistent disk 的資料會跨兩個 zone 同步複寫以提供容錯能力，但同一時間只能被「一台」VM 以讀寫模式掛載，這個結構性限制剛好符合題目「應用程式處理程序必須對資料擁有完全控制權，並行存取會造成損毀」的要求。故障發生時，可以把這顆磁碟強制切換掛載到 standby 實例上，完成容錯移轉。"}, {"heading": "核心概念：Network Load Balancer vs HTTP Load Balancer", "body": "Network Load Balancer 運作在傳輸層（L4），單純轉送 TCP/UDP 封包，不理解應用層協定內容，因此可以處理任意的 TCP 流量；HTTP(S) Load Balancer 運作在應用層（L7），只能解析並代理 HTTP/HTTPS 協定的流量。題目只說應用程式「透過 TCP 接收流量」，沒有明確說是 HTTP，所以必須選擇不限定協定種類的 Network Load Balancer，才能保證各種 TCP 流量都能被正確轉送。"}]}}, {"id": "T1-Q105", "topic": 1, "qnum": 105, "question": "Your company has an application running on multiple Compute Engine instances. You need to ensure that the application can communicate with an on-premises service that requires high throughput via internal IPs, while minimizing latency. What should you do?", "options": [{"letter": "A", "text": "Use OpenVPN to configure a VPN tunnel between the on-premises environment and Google Cloud."}, {"letter": "B", "text": "Configure a direct peering connection between the on-premises environment and Google Cloud."}, {"letter": "C", "text": "Use Cloud VPN to configure a VPN tunnel between the on-premises environment and Google Cloud."}, {"letter": "D", "text": "Configure a Cloud Dedicated Interconnect connection between the on-premises environment and Google Cloud."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56368-exam-professional-cloud-architect-topic-1-question-105/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Interconnect/VPN", "效能調校"], "keywords": ["high throughput via internal IPs", "minimizing latency", "on-premises service"], "explanation": {"questionZh": "公司有一個應用程式跑在多台 Compute Engine 執行個體上。你需要確保這個應用程式能透過內部 IP、以高吞吐量跟地端（on-premises）服務通訊，同時盡量降低延遲。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "OpenVPN 是第三方開源 VPN 軟體，需要自己架設維護伺服器，頻寬和效能受限於軟體本身的加解密運算能力，無法達到高吞吐量、低延遲的要求。", "zh": "使用 OpenVPN 在地端環境與 Google Cloud 之間設定 VPN 通道"}, {"letter": "B", "analysis": "Direct Peering 是用來跟 Google 的公開服務（如 Google Search、YouTube）做網路層級對接的機制，走的是公開 IP，不是用來連到自己 GCP 專案內部資源的管道，不符合「透過內部 IP」的要求。", "zh": "在地端環境與 Google Cloud 之間設定直接對等互連（direct peering connection）"}, {"letter": "C", "analysis": "Cloud VPN 是 IPsec 加密 VPN，每條 tunnel 因為加密/解密運算有頻寬上限（約 3 Gbps），且流量仍須經過公開網際網路傳輸，延遲會受公網壅塞與路由跳轉影響，不穩定也不可預測，無法達到高吞吐量、低延遲的要求。", "zh": "使用 Cloud VPN 在地端環境與 Google Cloud 之間設定 VPN 通道"}, {"letter": "D", "analysis": "正確。Cloud Dedicated Interconnect 是一條實體專線，直接在共置設施把地端路由器與 Google 網路邊界用實體線路連接，完全不經過公開網際網路，也不需要加密運算，單條連線可達 10 Gbps 或 100 Gbps，延遲低且穩定，連線建立後地端與 GCP VPC 之間可直接用內部 IP 互通，剛好同時滿足高吞吐量、低延遲、內部 IP 三個要求。", "zh": "在地端環境與 Google Cloud 之間設定 Cloud Dedicated Interconnect 連線"}], "notes": [{"heading": "題目在問什麼", "body": "關鍵字「高吞吐量」+「盡量降低延遲」+「內部 IP」，要聯想到這已經超出一般 VPN 方案能穩定達成的量級，需要實體專線。"}, {"heading": "答案驗證：D", "body": "Dedicated Interconnect 用實體專線直接連接地端與 Google 網路邊界，完全不經過公開網際網路，提供 10G/100G 等級的頻寬與低延遲，連線建立後可直接用內部 IP 通訊。"}, {"heading": "核心概念：為什麼 Cloud VPN（C）無法滿足高吞吐量與低延遲", "body": "Cloud VPN 是 IPsec 加密 VPN，每條 tunnel 因為要做加密/解密運算，天生有頻寬上限（約 3 Gbps），即使疊加多條 tunnel 也還是受限於單條通道的物理天花板。更重要的是，流量實際傳輸路徑仍然要走公開網際網路，經過多個網路節點才到達 Google 網路，延遲會受公網壅塞、路由跳轉次數影響，不穩定也無法保證專屬頻寬。"}, {"heading": "延伸補充：Dedicated Interconnect 如何結構性解決這兩個痛點", "body": "Dedicated Interconnect 是在共置設施（colocation facility）把客戶的路由器用實體線路直接接到 Google 的網路邊界，完全不經過公開網際網路，也不需要做加密運算（因為是私有實體連線）。沒有加解密瓶頸，頻寬可以做到 10 Gbps 或 100 Gbps；完全繞過公網，延遲低且穩定，不受網際網路壅塞影響。"}, {"heading": "延伸補充：「內部 IP」不是用來區分 C 和 D 的關鍵", "body": "Cloud VPN 搭配 Cloud Router（BGP）其實也能做到用內部 IP 互通，所以「內部 IP」這個條件主要是用來排除選項 B（Direct Peering，走公開 IP，用於連接 Google 對外公開服務，不是用來連通自己 VPC 內部資源）。真正讓 C 被排除的關鍵，是題目要求的「高吞吐量」與「盡量降低延遲」，這是 VPN 因加密運算瓶頸與公網傳輸不確定性而結構上難以穩定達成的，Dedicated Interconnect 的實體專線特性正好針對性解決這兩個痛點。"}]}}, {"id": "T1-Q106", "topic": 1, "qnum": 106, "question": "You are managing an application deployed on Cloud Run for Anthos, and you need to define a strategy for deploying new versions of the application. You want to evaluate the new code with a subset of production traffic to decide whether to proceed with the rollout. What should you do?", "options": [{"letter": "A", "text": "Deploy a new revision to Cloud Run with the new version. Configure traffic percentage between revisions."}, {"letter": "B", "text": "Deploy a new service to Cloud Run with the new version. Add a Cloud Load Balancing instance in front of both services."}, {"letter": "C", "text": "In the Google Cloud Console page for Cloud Run, set up continuous deployment using Cloud Build for the development branch. As part of the Cloud Build trigger, configure the substitution variable TRAFFIC_PERCENTAGE with the percentage of traffic you want directed to a new version."}, {"letter": "D", "text": "In the Google Cloud Console, configure Traffic Director with a new Service that points to the new version of the application on Cloud Run. Configure Traffic Director to send a small percentage of traffic to the new version of the application."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56373-exam-professional-cloud-architect-topic-1-question-106/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "CI/CD", "無伺服器"], "keywords": ["Cloud Run for Anthos", "evaluate new code with a subset of production traffic", "canary deployment", "revision traffic percentage"], "explanation": {"questionZh": "你在管理一個部署在 Cloud Run for Anthos 上的應用程式，需要制定部署新版本的策略。你想用一小部分正式環境（production）流量來評估新程式碼，再決定是否要繼續推出（rollout）。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確。Cloud Run 每次部署新版本都會產生一個新的 Revision，原生支援把流量依百分比分配到不同 Revision（例如 90% 給舊版、10% 給新版），這就是標準的金絲雀部署（Canary Deployment）方式，不需要額外引入其他服務。", "zh": "部署一個新的 revision 到 Cloud Run，使用新版本。設定不同 revision 之間的流量百分比"}, {"letter": "B", "analysis": "把新版本當成獨立的新 Cloud Run 服務，而不是同一服務底下的新 revision，等於變成兩個分開的服務，需要自己額外接 Load Balancer 做流量分配，做法迂迴，不是 Cloud Run 原生支援的方式，過度複雜。", "zh": "部署一個新的 Cloud Run 服務，使用新版本，並在兩個服務前面加一個 Cloud Load Balancing"}, {"letter": "C", "analysis": "Cloud Build 觸發器並沒有叫 TRAFFIC_PERCENTAGE 這種標準替換變數可以直接控制 Cloud Run 的流量分配，這是捏造出來、實際不存在的功能，是干擾選項。", "zh": "在 Cloud Run 的 Console 頁面設定用 Cloud Build 對開發分支做持續部署，並在 Cloud Build 觸發器中設定 TRAFFIC_PERCENTAGE 替換變數來指定要導向新版本的流量百分比"}, {"letter": "D", "analysis": "Traffic Director 是服務網格（Service Mesh）控制平面，設計給大量微服務之間透過 Envoy sidecar 代理程式做複雜流量管理的場景，通常搭配 GKE 或 Compute Engine VM 使用。Cloud Run 是全託管無伺服器平台，不會讓使用者插入 Envoy 代理程式，用 Traffic Director 管理 Cloud Run 流量不是其原生設計的典型用法，架構上過度複雜，等於額外架一整套服務網格基礎設施去做 Cloud Run 本身就內建支援的事。", "zh": "在 Google Cloud Console 設定 Traffic Director，建立一個指向新版本應用程式的新 Service，並設定 Traffic Director 把一小部分流量導向新版本"}], "notes": [{"heading": "題目在問什麼", "body": "要在正式環境裡，只讓一小部分真實流量碰到新版本程式碼，觀察表現是否正常，再決定要不要讓所有流量都切換過去，這個做法叫做金絲雀部署（Canary Deployment）。"}, {"heading": "核心概念：什麼是金絲雀部署", "body": "名稱來自礦工帶金絲雀下礦井偵測毒氣的做法：先讓一小群敏感的測試對象（一小部分流量）先碰到新版本，如果出問題，影響範圍很小，還能及時喊停，不會波及所有使用者。"}, {"heading": "答案驗證：A", "body": "Cloud Run 每次部署新版本都會產生一個新的 Revision（修訂版），可以直接在 Revision 層級設定流量百分比，原生內建支援金絲雀部署，不需要額外的 Load Balancer、Cloud Build 變數或服務網格工具。"}, {"heading": "核心概念：Cloud Run 的 Revision 機制", "body": "Cloud Run 把每次部署都視為一個新的 Revision，同一個服務底下可以同時存在多個 Revision，並直接在這些 Revision 之間設定流量分配比例（例如 90/10），這是服務內建的功能，不需要額外架設任何東西。"}, {"heading": "延伸補充：為什麼 D（Traffic Director）不行", "body": "Traffic Director 是 Google Cloud 的服務網格控制平面，設計給一大群微服務之間互相呼叫、需要精細流量控制的複雜場景使用，底層運作方式是在每個服務旁邊放一個 Envoy sidecar 代理程式，通常搭配 GKE 或 Compute Engine VM，因為這些環境才能讓使用者插入這個代理程式。Cloud Run 是無伺服器平台，刻意把底層基礎設施抽象化、藏起來，不會讓使用者插入 Envoy 代理程式，所以用 Traffic Director 管理 Cloud Run 流量不是其原生典型用法。更重要的是，這題要做的事（流量分配給新版本）Cloud Run 本身就內建支援，用 Traffic Director 等於多架一整套服務網格基礎設施去做一件已經有現成簡單解法的事，是過度設計（overkill）。"}]}}, {"id": "T1-Q107", "topic": 1, "qnum": 107, "question": "You are monitoring Google Kubernetes Engine (GKE) clusters in a Cloud Monitoring workspace. As a Site Reliability Engineer (SRE), you need to triage incidents quickly. What should you do?", "options": [{"letter": "A", "text": "Navigate the predefined dashboards in the Cloud Monitoring workspace, and then add metrics and create alert policies."}, {"letter": "B", "text": "Navigate the predefined dashboards in the Cloud Monitoring workspace, create custom metrics, and install alerting software on a Compute Engine instance."}, {"letter": "C", "text": "Write a shell script that gathers metrics from GKE nodes, publish these metrics to a Pub/Sub topic, export the data to BigQuery, and make a Data Studio dashboard."}, {"letter": "D", "text": "Create a custom dashboard in the Cloud Monitoring workspace for each incident, and then add metrics and create alert policies."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56365-exam-professional-cloud-architect-topic-1-question-107/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "監控與可觀測性"], "keywords": ["triage incidents quickly", "Cloud Monitoring workspace", "SRE", "predefined dashboards"], "explanation": {"questionZh": "你在 Cloud Monitoring workspace 裡監控 Google Kubernetes Engine（GKE）叢集。作為 SRE，你需要快速排查（triage）事故。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確。GKE 在 Cloud Monitoring 裡本來就有現成的預設儀表板（涵蓋叢集、節點、Pod 等層級指標），可以直接使用，再依實際需求新增自訂指標、建立警示政策，是最快速、最直接善用現有工具的做法。", "zh": "瀏覽 Cloud Monitoring workspace 裡的預設儀表板，然後新增指標並建立警示政策"}, {"letter": "B", "analysis": "Cloud Monitoring 本身就內建告警（Alerting）功能，完全沒必要額外在 Compute Engine 上另外安裝一套獨立的告警軟體，這只會增加不必要的維運負擔與複雜度。", "zh": "瀏覽預設儀表板，建立自訂指標，並在 Compute Engine 執行個體上安裝告警軟體"}, {"letter": "C", "analysis": "這整套流程是重新打造一套監控管線（自己收集指標、發布到 Pub/Sub、匯出到 BigQuery、用 Data Studio 視覺化），而 GCP 已經有現成整合好的監控服務可直接使用，這樣做既耗時又不切實際，對「快速排查事故」的目標是反效果。", "zh": "寫一個 shell script 從 GKE 節點收集指標，發布到 Pub/Sub 主題，匯出資料到 BigQuery，再做一個 Data Studio 儀表板"}, {"letter": "D", "analysis": "每次事故都重新建立一個全新的自訂儀表板太耗時、沒有效率，SRE 要的是快速排查，而不是每次事故發生時先花時間搭建新的監控畫面。", "zh": "針對每個事故在 Cloud Monitoring workspace 建立一個自訂儀表板，然後新增指標並建立警示政策"}], "notes": [{"heading": "題目在問什麼", "body": "SRE 要「快速」排查事故，核心是要善用現成、已經整合好的工具，而不是重新打造監控系統或每次事故都重新搭建畫面。"}, {"heading": "答案驗證：A", "body": "直接使用 Cloud Monitoring 內建的 GKE 預設儀表板，再依需要補強自訂指標與警示政策，是最快、最直接的做法，不需要額外的外部工具或每次重新建置。"}, {"heading": "核心概念：善用現成工具而非重新造輪子", "body": "GCP 的 Cloud Monitoring 已經為 GKE 提供了現成的預設儀表板和內建告警機制，涵蓋叢集、節點、Pod 等常見監控維度。排除其他選項的共同邏輯：B 多裝了一套本來就內建的功能；C 自己重新打造一整套監控管線；D 每次事故都重新建置儀表板。三者都違反「快速排查」的核心目標，唯有直接沿用現成工具、再做必要補強（A）才符合效率要求。"}]}}, {"id": "T1-Q108", "topic": 1, "qnum": 108, "question": "You are implementing a single Cloud SQL MySQL second-generation database that contains business-critical transaction data. You want to ensure that the minimum amount of data is lost in case of catastrophic failure. Which two features should you implement? (Choose two.)", "options": [{"letter": "A", "text": "Sharding"}, {"letter": "B", "text": "Read replicas"}, {"letter": "C", "text": "Binary logging"}, {"letter": "D", "text": "Automated backups"}, {"letter": "E", "text": "Semisynchronous replication"}], "answer": "CD", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56369-exam-professional-cloud-architect-topic-1-question-108/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Cloud SQL", "高可用性/災難復原"], "keywords": ["minimum amount of data is lost", "catastrophic failure", "Cloud SQL MySQL second-generation", "point-in-time recovery"], "explanation": {"questionZh": "你正在實作一個單一的 Cloud SQL MySQL（第二代）資料庫，裡面存放業務關鍵的交易資料。你想確保發生重大故障（catastrophic failure）時，遺失的資料量降到最少。該實作哪兩個功能？", "optionTable": [{"letter": "A", "analysis": "Sharding（資料分片）是把資料拆成多個區塊分散到不同資料庫，目的是擴展效能/容量，跟故障時減少資料遺失完全無關。", "zh": "資料分片（Sharding）"}, {"letter": "B", "analysis": "Read replica 預設是非同步複寫，主庫寫入後不會等副本確認收到才算完成，主副庫之間永遠存在時間差。如果主庫在這段時間差內發生重大故障，最後那一小段還沒同步過去的交易會永遠遺失。Read Replica 的設計目的是分散讀取流量、提升效能，不是保證故障時資料不遺失，是兩個不同的問題。", "zh": "讀取副本（Read replicas）"}, {"letter": "C", "analysis": "正確。二進位日誌會記錄資料庫裡每一筆寫入/變更操作，是做時間點還原（Point-in-Time Recovery, PITR）的必要條件，能把資料庫還原到故障發生前的某一刻，而不是只能還原到上一次完整備份的時間點。", "zh": "二進位日誌（Binary logging）"}, {"letter": "D", "analysis": "正確。定期自動備份整個資料庫，是做任何還原動作的基礎，沒有備份，二進位日誌也無從套用還原。", "zh": "自動備份（Automated backups）"}, {"letter": "E", "analysis": "半同步複寫是 MySQL 資料庫本身的機制（主庫寫入時等待至少一個副本確認收到日誌才算提交完成），但 Cloud SQL 是 Google 代管的服務，底層複寫機制由 Google 自己管理，不會把這種底層 MySQL 參數開放給使用者自己調整，在 Cloud SQL 裡根本沒有這個設定入口，不是使用者可以實作的功能。", "zh": "半同步複寫（Semisynchronous replication）"}], "notes": [{"heading": "題目在問什麼", "body": "要找出能讓資料庫發生重大故障時，遺失資料的時間範圍降到最小的兩個功能，核心概念是「時間點還原（Point-in-Time Recovery）」。"}, {"heading": "答案驗證：C、D", "body": "自動備份提供「定期的完整還原基準點」，二進位日誌則記錄備份之後發生的每一筆變更，兩者搭配起來就能做到時間點還原，把故障發生時遺失的資料範圍縮小到「最後一次日誌紀錄之後」那一小段時間，而不是「最後一次完整備份之後」那段較長的時間。"}, {"heading": "延伸補充：為什麼 B（Read replica）不行", "body": "Cloud SQL 的 Read Replica 預設是非同步複寫，主庫與副本之間存在時間差（lag），如果主庫在這段時間差內故障，還沒同步過去的交易會永遠遺失。Read Replica 解決的是「分散讀取流量、提升效能」，跟「保證故障時資料不遺失」是完全不同的問題。"}, {"heading": "延伸補充：為什麼 E（Semisynchronous replication）不行", "body": "半同步複寫確實是能降低資料遺失風險的 MySQL 機制（等待至少一個副本確認收到才提交），但這是自架 MySQL（self-managed）才能調整的底層參數。Cloud SQL 是 Google 代管服務，不會把這類底層複寫設定開放給使用者調整，所以它不是 Cloud SQL 使用者能「實作」的功能選項。"}, {"heading": "延伸補充：Cloud SQL 是什麼", "body": "Cloud SQL 是 GCP 的關聯式資料庫（RDB）全託管代管服務，支援 MySQL、PostgreSQL、SQL Server 三種引擎。全託管代表 Google 幫忙處理底層機器、備份、修補更新、複寫設定等維運工作，使用者只需專注在資料庫的表、資料與查詢邏輯。這題底層跑的就是真正的 MySQL 引擎，所以才會出現「二進位日誌」這種 MySQL 原生機制。對比 GCP 的非關聯式資料庫服務：Bigtable（高吞吐量 NoSQL）、Firestore（文件型 NoSQL）、Spanner（水平擴展且具交易一致性的特殊關聯式資料庫）。"}]}}, {"id": "T1-Q109", "topic": 1, "qnum": 109, "question": "You are working at a sports association whose members range in age from 8 to 30. The association collects a large amount of health data, such as sustained injuries. You are storing this data in BigQuery. Current legislation requires you to delete such information upon request of the subject. You want to design a solution that can accommodate such a request. What should you do?", "options": [{"letter": "A", "text": "Use a unique identifier for each individual. Upon a deletion request, delete all rows from BigQuery with this identifier."}, {"letter": "B", "text": "When ingesting new data in BigQuery, run the data through the Data Loss Prevention (DLP) API to identify any personal information. As part of the DLP scan, save the result to Data Catalog. Upon a deletion request, query Data Catalog to find the column with personal information."}, {"letter": "C", "text": "Create a BigQuery view over the table that contains all data. Upon a deletion request, exclude the rows that affect the subject's data from this view. Use this view instead of the source table for all analysis tasks."}, {"letter": "D", "text": "Use a unique identifier for each individual. Upon a deletion request, overwrite the column with the unique identifier with a salted SHA256 of its value."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56381-exam-professional-cloud-architect-topic-1-question-109/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["BigQuery", "Sensitive Data Protection(DLP)", "合規性"], "keywords": ["delete such information upon request of the subject", "health data", "right to be forgotten", "BigQuery"], "explanation": {"questionZh": "你在一個運動協會工作，會員年齡從 8 到 30 歲，協會收集大量健康資料（例如運動傷害紀錄），存在 BigQuery 裡。現行法規要求在資料主體（本人）提出請求時刪除這些資訊。你要設計一個能滿足這類請求的解決方案，該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確。每個人都用唯一識別碼標記，收到刪除請求時，直接把 BigQuery 裡所有帶這個識別碼的資料列刪除，是直接且徹底的真正刪除動作，完全對應法規要求的「刪除」本身。", "zh": "為每個人使用一個唯一識別碼。收到刪除請求時，刪除 BigQuery 裡所有帶這個識別碼的資料列"}, {"letter": "B", "analysis": "這個方案做的是「找出哪些欄位是個人資料」（透過 DLP API 掃描並記錄到 Data Catalog），但沒有明確說明找到之後要如何真正執行刪除，整套流程過度複雜，重點放在辨識而非法規真正要求的刪除動作。", "zh": "資料寫入 BigQuery 時先用 DLP API 掃描找出個人資訊，掃描結果存進 Data Catalog，收到刪除請求時查詢 Data Catalog 找出含個資的欄位"}, {"letter": "C", "analysis": "資料實際上完全沒有被刪除，只是從檢視畫面（view）裡被排除隱藏，底層原始資料表裡那筆健康資料依然完整存在，沒有達到法規要求的「刪除」，只是視覺上看不到而已。", "zh": "在包含所有資料的資料表上建立一個 BigQuery view，收到刪除請求時把該筆資料從這個 view 中排除，之後所有分析任務都用這個 view 取代原始資料表"}, {"letter": "D", "analysis": "這做的是把識別碼欄位匿名化（覆寫成加鹽 SHA256 雜湊值），讓人無法反查出這是誰，但實際的健康資料本身（例如傷害紀錄）完全沒有被刪除，仍原封不動留在資料庫裡。法規要求的是「刪除」，不是單純讓資料難以辨識身分，兩者處理程度不同，不符合刪除要求。", "zh": "為每個人使用一個唯一識別碼。收到刪除請求時，把帶有該唯一識別碼的欄位覆寫成其值的加鹽 SHA256 雜湊"}], "notes": [{"heading": "題目在問什麼", "body": "要分辨「真正刪除資料」跟「讓資料看不到/認不出來」的差別，法規要求的是字面上的「刪除」，不是遮蔽或去識別化。"}, {"heading": "答案驗證：A", "body": "用唯一識別碼標記每個人的所有資料列，收到刪除請求時直接執行刪除動作，把底層資料表裡的資料列真正移除，是唯一貨真價實符合「刪除」字面要求的做法。"}, {"heading": "核心概念：遮蔽（View）、去識別化（Hashing）都不等於刪除", "body": "C 選項用 view 排除資料列，只是在查詢層面「看不到」，底層原始資料表的資料依然完整保留；D 選項把識別碼雜湊化，只是切斷「這筆資料是誰」的連結，但健康資料本身（傷害紀錄等）仍完整存在資料庫裡，沒有被移除。兩者都只是讓資料「難以被使用/辨識」，不是法規要求的「刪除」動作本身，一旦有稽核或資料外洩，底層資料依然存在、依然是風險。"}]}}, {"id": "T1-Q110", "topic": 1, "qnum": 110, "question": "Your company has announced that they will be outsourcing operations functions. You want to allow developers to easily stage new versions of a cloud-based application in the production environment and allow the outsourced operations team to autonomously promote staged versions to production. You want to minimize the operational overhead of the solution. Which Google Cloud product should you migrate to?", "options": [{"letter": "A", "text": "App Engine"}, {"letter": "B", "text": "GKE On-Prem"}, {"letter": "C", "text": "Compute Engine"}, {"letter": "D", "text": "Google Kubernetes Engine"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56840-exam-professional-cloud-architect-topic-1-question-110/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["App Engine", "CI/CD"], "keywords": ["stage new versions", "autonomously promote staged versions to production", "minimize operational overhead", "outsourcing operations"], "explanation": {"questionZh": "公司宣布將外包維運（operations）職能。你想讓開發人員能輕鬆地在正式環境（production）部署新版本（staging），並讓外包的維運團隊能自主地把暫存版本（staged version）推上線成正式版，同時盡量降低這個解決方案的維運負擔（operational overhead）。該遷移到哪個 GCP 產品？", "optionTable": [{"letter": "A", "analysis": "正確。App Engine 原生內建「版本（Version）」機制：開發人員可以部署新版本但不導流量（相當於 staging），之後只需要在 Console 或用一個指令把流量切換到新版本即可上線，整個過程不需要管理底層伺服器或叢集，完全符合開發者輕鬆部署、維運團隊自主推上線、低維運負擔三個要求。", "zh": "App Engine"}, {"letter": "B", "analysis": "GKE On-Prem 是把 Kubernetes 架在自己機房的方案，需要自行管理底層硬體與叢集維運，維運負擔反而更高，完全違背題目降低維運負擔的要求。", "zh": "GKE On-Prem"}, {"letter": "C", "analysis": "純虛擬機器，部署新版本、切換流量都需要自己手動設計整套流程（例如自行架設 blue-green 部署邏輯），維運負擔高，不是低維運負擔的方案。", "zh": "Compute Engine"}, {"letter": "D", "analysis": "雖然比自架機房輕鬆，但仍然需要管理叢集、Deployment、Service 等 Kubernetes 資源，對於只是想輕鬆部署版本、讓維運團隊按一下就能上線的需求來說，比 App Engine 複雜、維運負擔更高。", "zh": "Google Kubernetes Engine"}], "notes": [{"heading": "題目在問什麼", "body": "要找出維運負擔最低、同時內建「部署新版本（staging）」與「推上線（promote to production）」機制的運算平台。"}, {"heading": "答案驗證：A", "body": "App Engine 的「版本（Version）+ 流量分割（Traffic Splitting）」機制剛好對應題目要的兩個動作：開發者部署新版（不導流量）、維運團隊再把流量切換過去上線，完全不需要額外的部署管線或叢集管理知識。"}, {"heading": "核心概念：App Engine、Cloud Functions、Cloud Run 三者定位比較", "body": "三者都是 GCP 的無伺服器平台，差異在於「你提供什麼、平台怎麼執行它」：App Engine 要求提供完整的原始程式碼（整個應用程式，多個路由），平台直接執行，不需要懂容器；Cloud Functions 只需要寫一段單一函式，由事件觸發（HTTP、Pub/Sub、Storage 等），平台自動包裝執行環境；Cloud Run 則要求提供一個標準容器（Docker image），不限制語言，只要求容器監聽 HTTP port。App Engine 是 GCP 最早推出的無伺服器平台，概念上同時涵蓋了後來 Cloud Functions（簡單事件邏輯）和 Cloud Run（完整應用程式）想解決的問題，但彈性與擴縮效能不如這兩個後來專精化的服務。新版 Cloud Functions（第二代）底層其實直接架在 Cloud Run 的基礎設施上。"}, {"heading": "延伸補充：App Engine Standard vs Flexible", "body": "App Engine Standard 完全不需要碰容器、不寫 Dockerfile，直接推程式碼上去就跑，擴縮速度快（包括縮到 0）；App Engine Flexible 概念上跟 Cloud Run 類似（都用容器），但底層是跑在 Compute Engine VM 上，擴縮較慢、不會縮到 0，現在基本上已被 Cloud Run 取代，Google 官方建議新專案優先選用 Cloud Run。"}, {"heading": "延伸補充：對應 AWS 的服務", "body": "App Engine 較接近 AWS 的 Elastic Beanstalk（PaaS，部署程式碼，平台管理底層）；Cloud Functions 對應 AWS Lambda（事件驅動的單一函式）；Cloud Run 較接近 AWS App Runner 或 Fargate（無伺服器容器）。Lambda 的真正對應物是 Cloud Functions，不是 App Engine——兩者運算模型不同：Lambda/Cloud Functions 是事件觸發、短生命週期的單一函式，App Engine 是持續監聽請求的完整應用程式。"}]}}, {"id": "T1-Q111", "topic": 1, "qnum": 111, "question": "Your company is running its application workloads on Compute Engine. The applications have been deployed in production, acceptance, and development environments. The production environment is business-critical and is used 24/7, while the acceptance and development environments are only critical during office hours. Your CFO has asked you to optimize these environments to achieve cost savings during idle times. What should you do?", "options": [{"letter": "A", "text": "Create a shell script that uses the gcloud command to change the machine type of the development and acceptance instances to a smaller machine type outside of office hours. Schedule the shell script on one of the production instances to automate the task."}, {"letter": "B", "text": "Use Cloud Scheduler to trigger a Cloud Function that will stop the development and acceptance environments after office hours and start them just before office hours."}, {"letter": "C", "text": "Deploy the development and acceptance applications on a managed instance group and enable autoscaling."}, {"letter": "D", "text": "Use regular Compute Engine instances for the production environment, and use preemptible VMs for the acceptance and development environments."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56686-exam-professional-cloud-architect-topic-1-question-111/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Compute Engine", "成本優化", "Cloud Run/Cloud Functions"], "keywords": ["optimize these environments to achieve cost savings during idle times", "production acceptance development environments", "critical during office hours"], "explanation": {"questionZh": "公司的應用程式工作負載跑在 Compute Engine 上，分別部署在正式環境（production）、驗收環境（acceptance）、開發環境（development）三種環境。正式環境是業務關鍵、24/7 都在用，驗收和開發環境只有上班時間才需要。CFO 要求你在閒置時段優化這些環境以節省成本，該怎麼做？", "optionTable": [{"letter": "A", "analysis": "改變機器類型只是降級規格，機器仍持續運行、持續計費，沒有真正把閒置時段的資源完全關閉；而且把這個自動化腳本排程在業務關鍵的 production 機器上執行，讓正式環境去負責管理其他環境的任務，職責混亂且有風險。", "zh": "寫一個用 gcloud 指令在上班時間以外把開發與驗收環境實例改成較小機器類型的 shell script，並排程在一台正式環境實例上自動執行"}, {"letter": "B", "analysis": "正確。直接把閒置時段完全不需要的機器關閉（stop），關閉後只計磁碟儲存費用，是最直接乾淨的省錢做法；Cloud Scheduler（定時排程服務）搭配 Cloud Function（無伺服器函式）是全託管、不需要額外維護伺服器的標準自動化組合。", "zh": "使用 Cloud Scheduler 觸發一個 Cloud Function，在下班後關閉開發與驗收環境、上班前再啟動"}, {"letter": "C", "analysis": "Autoscaling 是依照流量/負載動態增減機器數量，但開發/驗收環境的閒置問題是「下班後完全沒人用」，不是「負載忽高忽低」，自動擴縮無法做到完全關閉到 0 台、依時間排程不計費，用錯了工具解決錯的問題。", "zh": "把開發與驗收環境部署在 managed instance group 並開啟自動擴縮"}, {"letter": "D", "analysis": "Preemptible VM 便宜，但設計目的是容忍隨時可能被 Google 強制中斷回收的短暫性工作負載，不是依照上班時間開關這種可預測的排程需求，而且中斷時機不受控制，不符合開發/驗收環境在上班時間要穩定可用的需求。", "zh": "正式環境使用一般 Compute Engine 實例，驗收與開發環境使用 preemptible VM"}], "notes": [{"heading": "題目在問什麼", "body": "要找出能在「完全可預測的閒置時段（下班後）」把資源真正關閉、不計費的做法，而不是降級規格、依負載自動擴縮，或用不受控制中斷時機的機器類型。"}, {"heading": "答案驗證：B", "body": "Cloud Scheduler + Cloud Function 是全託管的定時自動化組合，可以精準在指定時間把開發/驗收環境實例關機、再於上班前開機，機器關閉期間只計磁碟費用，真正做到閒置時段零運算費用。"}, {"heading": "核心概念：關機 vs 降規格 vs 自動擴縮 vs 先佔式機器", "body": "四個選項分別代表四種不同層次的成本優化思路：降規格（A）仍持續計費，只是降低費率；自動擴縮（C）是依負載反應，不是依時間排程，無法處理「完全沒人用」的情境；先佔式機器（D）便宜但中斷時機不可控，適合容錯的短暫工作負載，不適合需要穩定可用的開發/驗收環境；只有「依排程直接關機（B）」才能精準對應「下班後完全不需要運算資源」這個情境，做到真正的零閒置成本。"}]}}, {"id": "T1-Q112", "topic": 1, "qnum": 112, "question": "You are moving an application that uses MySQL from on-premises to Google Cloud. The application will run on Compute Engine and will use Cloud SQL. You want to cut over to the Compute Engine deployment of the application with minimal downtime and no data loss to your customers. You want to migrate the application with minimal modification. You also need to determine the cutover strategy. What should you do?", "options": [{"letter": "A", "text": "1. Set up Cloud VPN to provide private network connectivity between the Compute Engine application and the on-premises MySQL server. 2. Stop the on-premises application. 3. Create a mysqldump of the on-premises MySQL server. 4. Upload the dump to a Cloud Storage bucket. 5. Import the dump into Cloud SQL. 6. Modify the source code of the application to write queries to both databases and read from its local database. 7. Start the Compute Engine application. 8. Stop the on-premises application."}, {"letter": "B", "text": "1. Set up Cloud SQL proxy and MySQL proxy. 2. Create a mysqldump of the on-premises MySQL server. 3. Upload the dump to a Cloud Storage bucket. 4. Import the dump into Cloud SQL. 5. Stop the on-premises application. 6. Start the Compute Engine application."}, {"letter": "C", "text": "1. Set up Cloud VPN to provide private network connectivity between the Compute Engine application and the on-premises MySQL server. 2. Stop the on-premises application. 3. Start the Compute Engine application, configured to read and write to the on-premises MySQL server. 4. Create the replication configuration in Cloud SQL. 5. Configure the source database server to accept connections from the Cloud SQL replica. 6. Finalize the Cloud SQL replica configuration. 7. When replication has been completed, stop the Compute Engine application. 8. Promote the Cloud SQL replica to a standalone instance. 9. Restart the Compute Engine application, configured to read and write to the Cloud SQL standalone instance."}, {"letter": "D", "text": "1. Stop the on-premises application. 2. Create a mysqldump of the on-premises MySQL server. 3. Upload the dump to a Cloud Storage bucket. 4. Import the dump into Cloud SQL. 5. Start the application on Compute Engine."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56692-exam-professional-cloud-architect-topic-1-question-112/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Cloud SQL", "資料遷移", "高可用性/災難復原"], "keywords": ["minimal downtime and no data loss", "minimal modification", "cutover strategy", "MySQL to Cloud SQL migration"], "explanation": {"questionZh": "你要把一個使用 MySQL 的應用程式從地端機房搬到 Google Cloud，應用程式會跑在 Compute Engine 上，資料庫使用 Cloud SQL。你希望切換過程停機時間最短、客戶資料完全不遺失，而且應用程式盡量不需要修改，你還需要決定具體的切換（cutover）策略，該怎麼做？", "optionTable": [{"letter": "A", "analysis": "設定 VPN 後需要修改應用程式原始碼，讓它同時寫入兩個資料庫、從本地資料庫讀取，這直接違反「盡量不修改程式碼」的要求，而且在應用層手刻雙寫同步邏輯風險很高、容易出錯導致資料不一致。", "zh": "1. 設定 Cloud VPN 提供 Compute Engine 應用程式與地端 MySQL 伺服器之間的私有網路連線 2. 停止地端應用程式 3. 對地端 MySQL 伺服器建立 mysqldump 4. 把 dump 上傳到 Cloud Storage bucket 5. 把 dump 匯入 Cloud SQL 6. 修改應用程式原始碼，讓它同時寫入兩個資料庫、從本地資料庫讀取 7. 啟動 Compute Engine 應用程式 8. 停止地端應用程式"}, {"letter": "B", "analysis": "建立 dump 的時間點之後，如果地端應用程式還在運作、還沒停止，那段時間新產生的寫入資料不會被包含在這份 dump 裡，等於切換到 Cloud SQL 後這些中間產生的資料就遺失了，違反「no data loss」的要求。", "zh": "1. 設定 Cloud SQL proxy 與 MySQL proxy 2. 對地端 MySQL 伺服器建立 mysqldump 3. 把 dump 上傳到 Cloud Storage bucket 4. 把 dump 匯入 Cloud SQL 5. 停止地端應用程式 6. 啟動 Compute Engine 應用程式"}, {"letter": "C", "analysis": "正確。利用 Cloud SQL 原生支援的複寫（replication）機制，讓 Cloud SQL 持續即時同步地端資料庫的所有變更，資料不會有缺口；應用程式先搬到 Compute Engine 但暫時仍連回地端資料庫，幾乎沒有停機；等複寫完全追上後，才短暫停機切換連線到已升級成獨立正式資料庫的 Cloud SQL，完全不需要修改應用程式的業務邏輯，只需改資料庫連線設定。", "zh": "1. 設定 Cloud VPN 提供 Compute Engine 應用程式與地端 MySQL 伺服器之間的私有網路連線 2. 停止地端應用程式 3. 啟動 Compute Engine 應用程式，設定成讀寫地端 MySQL 伺服器 4. 在 Cloud SQL 建立複寫設定 5. 設定來源資料庫伺服器接受來自 Cloud SQL 複寫副本的連線 6. 完成 Cloud SQL 複寫副本設定 7. 複寫完成後，停止 Compute Engine 應用程式 8. 把 Cloud SQL 複寫副本升級為獨立正式的執行個體 9. 重新啟動 Compute Engine 應用程式，設定成讀寫 Cloud SQL 獨立正式執行個體"}, {"letter": "D", "analysis": "先停止地端應用程式才開始做 dump、上傳、匯入，資料不會遺失，但如果資料庫很大，整個 dump 到匯入的過程可能花很長時間，這段時間應用程式完全無法使用，違反「停機時間最短」的要求。", "zh": "1. 停止地端應用程式 2. 對地端 MySQL 伺服器建立 mysqldump 3. 把 dump 上傳到 Cloud Storage bucket 4. 把 dump 匯入 Cloud SQL 5. 在 Compute Engine 啟動應用程式"}], "notes": [{"heading": "題目在問什麼", "body": "要同時滿足「停機時間最短」「資料零遺失」「應用程式盡量不修改」三個限制，並決定正確的切換（cutover）步驟順序。"}, {"heading": "答案驗證：C", "body": "利用資料庫原生複寫技術讓新舊資料庫持續保持同步，到切換前一刻資料都不會有缺口；真正的停機時間只有「等複寫追上、切換連線」那一瞬間，遠比整個 dump/restore 的時間短；全程不需要修改應用程式的業務邏輯，只需調整資料庫連線設定。"}, {"heading": "核心概念：為什麼 dump/restore 類型的做法（B、D）無法兩者兼顧", "body": "一次性的 mysqldump 是「某個時間點的靜態快照」，如果在 dump 之後才停應用程式（B），中間產生的新資料會遺失；如果先停應用程式才做 dump（D），資料不會遺失，但整個 dump、上傳、匯入過程都算停機時間，資料庫越大停機越久。只有「持續複寫」才能同時解決這兩個問題：複寫是持續進行的，資料不會有缺口，真正要停機的時間只是最後確認複寫追上、切換連線的那一刻。"}, {"heading": "核心概念：為什麼應用層雙寫（A）不是好做法", "body": "在應用程式原始碼裡手動實作「同時寫入兩個資料庫」的邏輯，等於把本來應該由資料庫層負責的同步工作，搬到應用層用程式碼自己處理，不僅違反「盡量不修改程式碼」的要求，也更容易因為程式邏輯錯誤（例如其中一次寫入失敗、順序問題）造成兩個資料庫資料不一致，遠比直接使用資料庫原生、經過充分測試的複寫機制風險更高。"}]}}, {"id": "T1-Q113", "topic": 1, "qnum": 113, "question": "Your organization has decided to restrict the use of external IP addresses on instances to only approved instances. You want to enforce this requirement across all of your Virtual Private Clouds (VPCs). What should you do?", "options": [{"letter": "A", "text": "Remove the default route on all VPCs. Move all approved instances into a new subnet that has a default route to an internet gateway."}, {"letter": "B", "text": "Create a new VPC in custom mode. Create a new subnet for the approved instances, and set a default route to the internet gateway on this new subnet."}, {"letter": "C", "text": "Implement a Cloud NAT solution to remove the need for external IP addresses entirely."}, {"letter": "D", "text": "Set an Organization Policy with a constraint on constraints/compute.vmExternalIpAccess. List the approved instances in the allowedValues list."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56576-exam-professional-cloud-architect-topic-1-question-113/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Organization Policy", "VPC/網路", "安全性"]}, {"id": "T1-Q114", "topic": 1, "qnum": 114, "question": "Your company uses the Firewall Insights feature in the Google Network Intelligence Center. You have several firewall rules applied to Compute Engine instances.You need to evaluate the efficiency of the applied firewall ruleset. When you bring up the Firewall Insights page in the Google Cloud Console, you notice that there are no log rows to display. What should you do to troubleshoot the issue?", "options": [{"letter": "A", "text": "Enable Virtual Private Cloud (VPC) flow logging."}, {"letter": "B", "text": "Enable Firewall Rules Logging for the firewall rules you want to monitor."}, {"letter": "C", "text": "Verify that your user account is assigned the compute.networkAdmin Identity and Access Management (IAM) role."}, {"letter": "D", "text": "Install the Google Cloud SDK, and verify that there are no Firewall logs in the command line output."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56375-exam-professional-cloud-architect-topic-1-question-114/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["VPC/網路", "安全性", "監控與可觀測性"]}, {"id": "T1-Q115", "topic": 1, "qnum": 115, "question": "Your company has sensitive data in Cloud Storage buckets. Data analysts have Identity Access Management (IAM) permissions to read the buckets. You want to prevent data analysts from retrieving the data in the buckets from outside the office network. What should you do?", "options": [{"letter": "A", "text": "1. Create a VPC Service Controls perimeter that includes the projects with the buckets. 2. Create an access level with the CIDR of the office network."}, {"letter": "B", "text": "1. Create a firewall rule for all instances in the Virtual Private Cloud (VPC) network for source range. 2. Use the Classless Inter-domain Routing (CIDR) of the office network."}, {"letter": "C", "text": "1. Create a Cloud Function to remove IAM permissions from the buckets, and another Cloud Function to add IAM permissions to the buckets. 2. Schedule the Cloud Functions with Cloud Scheduler to add permissions at the start of business and remove permissions at the end of business."}, {"letter": "D", "text": "1. Create a Cloud VPN to the office network. 2. Configure Private Google Access for on-premises hosts."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56376-exam-professional-cloud-architect-topic-1-question-115/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Cloud Storage", "VPC/網路", "安全性"]}, {"id": "T1-Q116", "topic": 1, "qnum": 116, "question": "You have developed a non-critical update to your application that is running in a managed instance group, and have created a new instance template with the update that you want to release. To prevent any possible impact to the application, you don't want to update any running instances. You want any new instances that are created by the managed instance group to contain the new update. What should you do?", "options": [{"letter": "A", "text": "Start a new rolling restart operation."}, {"letter": "B", "text": "Start a new rolling replace operation."}, {"letter": "C", "text": "Start a new rolling update. Select the Proactive update mode."}, {"letter": "D", "text": "Start a new rolling update. Select the Opportunistic update mode."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56399-exam-professional-cloud-architect-topic-1-question-116/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "CI/CD"]}, {"id": "T1-Q117", "topic": 1, "qnum": 117, "question": "Your company is designing its application landscape on Compute Engine. Whenever a zonal outage occurs, the application should be restored in another zone as quickly as possible with the latest application data. You need to design the solution to meet this requirement. What should you do?", "options": [{"letter": "A", "text": "Create a snapshot schedule for the disk containing the application data. Whenever a zonal outage occurs, use the latest snapshot to restore the disk in the same zone."}, {"letter": "B", "text": "Configure the Compute Engine instances with an instance template for the application, and use a regional persistent disk for the application data. Whenever a zonal outage occurs, use the instance template to spin up the application in another zone in the same region. Use the regional persistent disk for the application data."}, {"letter": "C", "text": "Create a snapshot schedule for the disk containing the application data. Whenever a zonal outage occurs, use the latest snapshot to restore the disk in another zone within the same region."}, {"letter": "D", "text": "Configure the Compute Engine instances with an instance template for the application, and use a regional persistent disk for the application data. Whenever a zonal outage occurs, use the instance template to spin up the application in another region. Use the regional persistent disk for the application data."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56403-exam-professional-cloud-architect-topic-1-question-117/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "高可用性/災難復原"]}, {"id": "T1-Q118", "topic": 1, "qnum": 118, "question": "Your company has just acquired another company, and you have been asked to integrate their existing Google Cloud environment into your company's data center. Upon investigation, you discover that some of the RFC 1918 IP ranges being used in the new company's Virtual Private Cloud (VPC) overlap with your data center IP space. What should you do to enable connectivity and make sure that there are no routing conflicts when connectivity is established?", "options": [{"letter": "A", "text": "Create a Cloud VPN connection from the new VPC to the data center, create a Cloud Router, and apply new IP addresses so there is no overlapping IP space."}, {"letter": "B", "text": "Create a Cloud VPN connection from the new VPC to the data center, and create a Cloud NAT instance to perform NAT on the overlapping IP space."}, {"letter": "C", "text": "Create a Cloud VPN connection from the new VPC to the data center, create a Cloud Router, and apply a custom route advertisement to block the overlapping IP space."}, {"letter": "D", "text": "Create a Cloud VPN connection from the new VPC to the data center, and apply a firewall rule that blocks the overlapping IP space."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56680-exam-professional-cloud-architect-topic-1-question-118/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["VPC/網路", "Interconnect/VPN"]}, {"id": "T1-Q119", "topic": 1, "qnum": 119, "question": "You need to migrate Hadoop jobs for your company's Data Science team without modifying the underlying infrastructure. You want to minimize costs and infrastructure management effort. What should you do?", "options": [{"letter": "A", "text": "Create a Dataproc cluster using standard worker instances."}, {"letter": "B", "text": "Create a Dataproc cluster using preemptible worker instances."}, {"letter": "C", "text": "Manually deploy a Hadoop cluster on Compute Engine using standard instances."}, {"letter": "D", "text": "Manually deploy a Hadoop cluster on Compute Engine using preemptible instances."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56684-exam-professional-cloud-architect-topic-1-question-119/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Dataflow/Dataproc", "成本優化", "資料遷移"]}, {"id": "T1-Q120", "topic": 1, "qnum": 120, "question": "Your company has a project in Google Cloud with three Virtual Private Clouds (VPCs). There is a Compute Engine instance on each VPC. Network subnets do not overlap and must remain separated. The network configuration is shown below.Instance #1 is an exception and must communicate directly with both Instance #2 and Instance #3 via internal IPs. How should you accomplish this?", "options": [{"letter": "A", "text": "Create a cloud router to advertise subnet #2 and subnet #3 to subnet #1."}, {"letter": "B", "text": "Add two additional NICs to Instance #1 with the following configuration: ג€¢ NIC1 ג—‹ VPC: VPC #2 ג—‹ SUBNETWORK: subnet #2 ג€¢ NIC2 ג—‹ VPC: VPC #3 ג—‹ SUBNETWORK: subnet #3 Update firewall rules to enable traffic between instances."}, {"letter": "C", "text": "Create two VPN tunnels via CloudVPN: ג€¢ 1 between VPC #1 and VPC #2. ג€¢ 1 between VPC #2 and VPC #3. Update firewall rules to enable traffic between the instances."}, {"letter": "D", "text": "Peer all three VPCs: ג€¢ Peer VPC #1 with VPC #2. ג€¢ Peer VPC #2 with VPC #3. Update firewall rules to enable traffic between the instances."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56416-exam-professional-cloud-architect-topic-1-question-120/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["VPC/網路"]}, {"id": "T1-Q121", "topic": 1, "qnum": 121, "question": "You need to deploy an application on Google Cloud that must run on a Debian Linux environment. The application requires extensive configuration in order to operate correctly. You want to ensure that you can install Debian distribution updates with minimal manual intervention whenever they become available. What should you do?", "options": [{"letter": "A", "text": "Create a Compute Engine instance template using the most recent Debian image. Create an instance from this template, and install and configure the application as part of the startup script. Repeat this process whenever a new Google-managed Debian image becomes available."}, {"letter": "B", "text": "Create a Debian-based Compute Engine instance, install and configure the application, and use OS patch management to install available updates."}, {"letter": "C", "text": "Create an instance with the latest available Debian image. Connect to the instance via SSH, and install and configure the application on the instance. Repeat this process whenever a new Google-managed Debian image becomes available."}, {"letter": "D", "text": "Create a Docker container with Debian as the base image. Install and configure the application as part of the Docker image creation process. Host the container on Google Kubernetes Engine and restart the container whenever a new update is available."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57270-exam-professional-cloud-architect-topic-1-question-121/", "postedDate": "2021-07-06", "postedYear": 2021, "tags": ["Compute Engine", "安全性"]}, {"id": "T1-Q122", "topic": 1, "qnum": 122, "question": "You have an application that runs in Google Kubernetes Engine (GKE). Over the last 2 weeks, customers have reported that a specific part of the application returns errors very frequently. You currently have no logging or monitoring solution enabled on your GKE cluster. You want to diagnose the problem, but you have not been able to replicate the issue. You want to cause minimal disruption to the application. What should you do?", "options": [{"letter": "A", "text": "1. Update your GKE cluster to use Cloud Operations for GKE. 2. Use the GKE Monitoring dashboard to investigate logs from affected Pods."}, {"letter": "B", "text": "1. Create a new GKE cluster with Cloud Operations for GKE enabled. 2. Migrate the affected Pods to the new cluster, and redirect traffic for those Pods to the new cluster. 3. Use the GKE Monitoring dashboard to investigate logs from affected Pods."}, {"letter": "C", "text": "1. Update your GKE cluster to use Cloud Operations for GKE, and deploy Prometheus. 2. Set an alert to trigger whenever the application returns an error."}, {"letter": "D", "text": "1. Create a new GKE cluster with Cloud Operations for GKE enabled, and deploy Prometheus. 2. Migrate the affected Pods to the new cluster, and redirect traffic for those Pods to the new cluster. 3. Set an alert to trigger whenever the application returns an error."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56425-exam-professional-cloud-architect-topic-1-question-122/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q123", "topic": 1, "qnum": 123, "question": "You need to deploy a stateful workload on Google Cloud. The workload can scale horizontally, but each instance needs to read and write to the same POSIX filesystem. At high load, the stateful workload needs to support up to 100 MB/s of writes. What should you do?", "options": [{"letter": "A", "text": "Use a persistent disk for each instance."}, {"letter": "B", "text": "Use a regional persistent disk for each instance."}, {"letter": "C", "text": "Create a Cloud Filestore instance and mount it in each instance."}, {"letter": "D", "text": "Create a Cloud Storage bucket and mount it in each instance using gcsfuse."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56384-exam-professional-cloud-architect-topic-1-question-123/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "效能調校"]}, {"id": "T1-Q124", "topic": 1, "qnum": 124, "question": "Your company has an application deployed on Anthos clusters (formerly Anthos GKE) that is running multiple microservices. The cluster has both Anthos ServiceMesh and Anthos Config Management configured. End users inform you that the application is responding very slowly. You want to identify the microservice that is causing the delay. What should you do?", "options": [{"letter": "A", "text": "Use the Service Mesh visualization in the Cloud Console to inspect the telemetry between the microservices."}, {"letter": "B", "text": "Use Anthos Config Management to create a ClusterSelector selecting the relevant cluster. On the Google Cloud Console page for Google Kubernetes Engine, view the Workloads and filter on the cluster. Inspect the configurations of the filtered workloads."}, {"letter": "C", "text": "Use Anthos Config Management to create a namespaceSelector selecting the relevant cluster namespace. On the Google Cloud Console page for Google Kubernetes Engine, visit the workloads and filter on the namespace. Inspect the configurations of the filtered workloads."}, {"letter": "D", "text": "Reinstall istio using the default istio profile in order to collect request latency. Evaluate the telemetry between the microservices in the Cloud Console."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57009-exam-professional-cloud-architect-topic-1-question-124/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["GKE/Kubernetes", "監控與可觀測性"]}, {"id": "T1-Q125", "topic": 1, "qnum": 125, "question": "You are working at a financial institution that stores mortgage loan approval documents on Cloud Storage. Any change to these approval documents must be uploaded as a separate approval file, so you want to ensure that these documents cannot be deleted or overwritten for the next 5 years. What should you do?", "options": [{"letter": "A", "text": "Create a retention policy on the bucket for the duration of 5 years. Create a lock on the retention policy."}, {"letter": "B", "text": "Create the bucket with uniform bucket-level access, and grant a service account the role of Object Writer. Use the service account to upload new files."}, {"letter": "C", "text": "Use a customer-managed key for the encryption of the bucket. Rotate the key after 5 years."}, {"letter": "D", "text": "Create the bucket with fine-grained access control, and grant a service account the role of Object Writer. Use the service account to upload new files."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57007-exam-professional-cloud-architect-topic-1-question-125/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Cloud Storage", "合規性"]}, {"id": "T1-Q126", "topic": 1, "qnum": 126, "question": "Your team will start developing a new application using microservices architecture on Kubernetes Engine. As part of the development lifecycle, any code change that has been pushed to the remote develop branch on your GitHub repository should be built and tested automatically. When the build and test are successful, the relevant microservice will be deployed automatically in the development environment. You want to ensure that all code deployed in the development environment follows this process. What should you do?", "options": [{"letter": "A", "text": "Have each developer install a pre-commit hook on their workstation that tests the code and builds the container when committing on the development branch. After a successful commit, have the developer deploy the newly built container image on the development cluster."}, {"letter": "B", "text": "Install a post-commit hook on the remote git repository that tests the code and builds the container when code is pushed to the development branch. After a successful commit, have the developer deploy the newly built container image on the development cluster."}, {"letter": "C", "text": "Create a Cloud Build trigger based on the development branch that tests the code, builds the container, and stores it in Container Registry. Create a deployment pipeline that watches for new images and deploys the new image on the development cluster. Ensure only the deployment tool has access to deploy new versions."}, {"letter": "D", "text": "Create a Cloud Build trigger based on the development branch to build a new container image and store it in Container Registry. Rely on Vulnerability Scanning to ensure the code tests succeed. As the final step of the Cloud Build process, deploy the new container image on the development cluster. Ensure only Cloud Build has access to deploy new versions."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56702-exam-professional-cloud-architect-topic-1-question-126/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["CI/CD", "GKE/Kubernetes", "容器化"]}, {"id": "T1-Q127", "topic": 1, "qnum": 127, "question": "Your operations team has asked you to help diagnose a performance issue in a production application that runs on Compute Engine. The application is dropping requests that reach it when under heavy load. The process list for affected instances shows a single application process that is consuming all available CPU, and autoscaling has reached the upper limit of instances. There is no abnormal load on any other related systems, including the database. You want to allow production traffic to be served again as quickly as possible. Which action should you recommend?", "options": [{"letter": "A", "text": "Change the autoscaling metric to agent.googleapis.com/memory/percent_used."}, {"letter": "B", "text": "Restart the affected instances on a staggered schedule."}, {"letter": "C", "text": "SSH to each instance and restart the application process."}, {"letter": "D", "text": "Increase the maximum number of instances in the autoscaling group."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56603-exam-professional-cloud-architect-topic-1-question-127/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q128", "topic": 1, "qnum": 128, "question": "You are implementing the infrastructure for a web service on Google Cloud. The web service needs to receive and store the data from 500,000 requests per second. The data will be queried later in real time, based on exact matches of a known set of attributes. There will be periods where the web service will not receive any requests. The business wants to keep costs low. Which web service platform and database should you use for the application?", "options": [{"letter": "A", "text": "Cloud Run and BigQuery"}, {"letter": "B", "text": "Cloud Run and Cloud Bigtable"}, {"letter": "C", "text": "A Compute Engine autoscaling managed instance group and BigQuery"}, {"letter": "D", "text": "A Compute Engine autoscaling managed instance group and Cloud Bigtable"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56612-exam-professional-cloud-architect-topic-1-question-128/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "Bigtable", "無伺服器", "成本優化"]}, {"id": "T1-Q129", "topic": 1, "qnum": 129, "question": "You are developing an application using different microservices that should remain internal to the cluster. You want to be able to configure each microservice with a specific number of replicas. You also want to be able to address a specific microservice from any other microservice in a uniform way, regardless of the number of replicas the microservice scales to. You need to implement this solution on Google Kubernetes Engine. What should you do?", "options": [{"letter": "A", "text": "Deploy each microservice as a Deployment. Expose the Deployment in the cluster using a Service, and use the Service DNS name to address it from other microservices within the cluster."}, {"letter": "B", "text": "Deploy each microservice as a Deployment. Expose the Deployment in the cluster using an Ingress, and use the Ingress IP address to address the Deployment from other microservices within the cluster."}, {"letter": "C", "text": "Deploy each microservice as a Pod. Expose the Pod in the cluster using a Service, and use the Service DNS name to address the microservice from other microservices within the cluster."}, {"letter": "D", "text": "Deploy each microservice as a Pod. Expose the Pod in the cluster using an Ingress, and use the Ingress IP address name to address the Pod from other microservices within the cluster."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57424-exam-professional-cloud-architect-topic-1-question-129/", "postedDate": "2021-07-08", "postedYear": 2021, "tags": ["GKE/Kubernetes", "容器化"]}, {"id": "T1-Q130", "topic": 1, "qnum": 130, "question": "Your company has a networking team and a development team. The development team runs applications on Compute Engine instances that contain sensitive data. The development team requires administrative permissions for Compute Engine. Your company requires all network resources to be managed by the networking team. The development team does not want the networking team to have access to the sensitive data on the instances. What should you do?", "options": [{"letter": "A", "text": "1. Create a project with a standalone VPC and assign the Network Admin role to the networking team. 2. Create a second project with a standalone VPC and assign the Compute Admin role to the development team. 3. Use Cloud VPN to join the two VPCs."}, {"letter": "B", "text": "1. Create a project with a standalone Virtual Private Cloud (VPC), assign the Network Admin role to the networking team, and assign the Compute Admin role to the development team."}, {"letter": "C", "text": "1. Create a project with a Shared VPC and assign the Network Admin role to the networking team. 2. Create a second project without a VPC, configure it as a Shared VPC service project, and assign the Compute Admin role to the development team."}, {"letter": "D", "text": "1. Create a project with a standalone VPC and assign the Network Admin role to the networking team. 2. Create a second project with a standalone VPC and assign the Compute Admin role to the development team. 3. Use VPC Peering to join the two VPCs."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57301-exam-professional-cloud-architect-topic-1-question-130/", "postedDate": "2021-07-06", "postedYear": 2021, "tags": ["VPC/網路", "IAM", "安全性"]}, {"id": "T1-Q131", "topic": 1, "qnum": 131, "question": "Your company wants you to build a highly reliable web application with a few public APIs as the backend. You don't expect a lot of user traffic, but traffic could spike occasionally. You want to leverage Cloud Load Balancing, and the solution must be cost-effective for users. What should you do?", "options": [{"letter": "A", "text": "Store static content such as HTML and images in Cloud CDN. Host the APIs on App Engine and store the user data in Cloud SQL."}, {"letter": "B", "text": "Store static content such as HTML and images in a Cloud Storage bucket. Host the APIs on a zonal Google Kubernetes Engine cluster with worker nodes in multiple zones, and save the user data in Cloud Spanner."}, {"letter": "C", "text": "Store static content such as HTML and images in Cloud CDN. Use Cloud Run to host the APIs and save the user data in Cloud SQL."}, {"letter": "D", "text": "Store static content such as HTML and images in a Cloud Storage bucket. Use Cloud Functions to host the APIs and save the user data in Firestore."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56615-exam-professional-cloud-architect-topic-1-question-131/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Load Balancing", "無伺服器", "成本優化"]}, {"id": "T1-Q132", "topic": 1, "qnum": 132, "question": "Your company sends all Google Cloud logs to Cloud Logging. Your security team wants to monitor the logs. You want to ensure that the security team can react quickly if an anomaly such as an unwanted firewall change or server breach is detected. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Schedule a cron job with Cloud Scheduler. The scheduled job queries the logs every minute for the relevant events."}, {"letter": "B", "text": "Export logs to BigQuery, and trigger a query in BigQuery to process the log data for the relevant events."}, {"letter": "C", "text": "Export logs to a Pub/Sub topic, and trigger Cloud Function with the relevant log events."}, {"letter": "D", "text": "Export logs to a Cloud Storage bucket, and trigger Cloud Run with the relevant log events."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57043-exam-professional-cloud-architect-topic-1-question-132/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "Pub/Sub", "安全性", "監控與可觀測性"]}, {"id": "T1-Q133", "topic": 1, "qnum": 133, "question": "You have deployed several instances on Compute Engine. As a security requirement, instances cannot have a public IP address. There is no VPN connection between Google Cloud and your office, and you need to connect via SSH into a specific machine without violating the security requirements. What should you do?", "options": [{"letter": "A", "text": "Configure Cloud NAT on the subnet where the instance is hosted. Create an SSH connection to the Cloud NAT IP address to reach the instance."}, {"letter": "B", "text": "Add all instances to an unmanaged instance group. Configure TCP Proxy Load Balancing with the instance group as a backend. Connect to the instance using the TCP Proxy IP."}, {"letter": "C", "text": "Configure Identity-Aware Proxy (IAP) for the instance and ensure that you have the role of IAP-secured Tunnel User. Use the gcloud command line tool to ssh into the instance."}, {"letter": "D", "text": "Create a bastion host in the network to SSH into the bastion host from your office location. From the bastion host, SSH into the desired instance."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56751-exam-professional-cloud-architect-topic-1-question-133/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["IAM", "安全性", "VPC/網路"]}, {"id": "T1-Q134", "topic": 1, "qnum": 134, "question": "Your company is using Google Cloud. You have two folders under the Organization: Finance and Shopping. The members of the development team are in aGoogle Group. The development team group has been assigned the Project Owner role on the Organization. You want to prevent the development team from creating resources in projects in the Finance folder. What should you do?", "options": [{"letter": "A", "text": "Assign the development team group the Project Viewer role on the Finance folder, and assign the development team group the Project Owner role on the Shopping folder."}, {"letter": "B", "text": "Assign the development team group only the Project Viewer role on the Finance folder."}, {"letter": "C", "text": "Assign the development team group the Project Owner role on the Shopping folder, and remove the development team group Project Owner role from the Organization."}, {"letter": "D", "text": "Assign the development team group only the Project Owner role on the Shopping folder."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56975-exam-professional-cloud-architect-topic-1-question-134/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["IAM", "Organization Policy"]}, {"id": "T1-Q135", "topic": 1, "qnum": 135, "question": "You are developing your microservices application on Google Kubernetes Engine. During testing, you want to validate the behavior of your application in case a specific microservice should suddenly crash. What should you do?", "options": [{"letter": "A", "text": "Add a taint to one of the nodes of the Kubernetes cluster. For the specific microservice, configure a pod anti-affinity label that has the name of the tainted node as a value."}, {"letter": "B", "text": "Use Istio's fault injection on the particular microservice whose faulty behavior you want to simulate."}, {"letter": "C", "text": "Destroy one of the nodes of the Kubernetes cluster to observe the behavior."}, {"letter": "D", "text": "Configure Istio's traffic management features to steer the traffic away from a crashing microservice."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56640-exam-professional-cloud-architect-topic-1-question-135/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "高可用性/災難復原"]}, {"id": "T1-Q136", "topic": 1, "qnum": 136, "question": "Your company is developing a new application that will allow globally distributed users to upload pictures and share them with other selected users. The application will support millions of concurrent users. You want to allow developers to focus on just building code without having to create and maintain the underlying infrastructure. Which service should you use to deploy the application?", "options": [{"letter": "A", "text": "App Engine"}, {"letter": "B", "text": "Cloud Endpoints"}, {"letter": "C", "text": "Compute Engine"}, {"letter": "D", "text": "Google Kubernetes Engine"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56754-exam-professional-cloud-architect-topic-1-question-136/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["App Engine", "無伺服器", "自動擴縮"]}, {"id": "T1-Q137", "topic": 1, "qnum": 137, "question": "Your company provides a recommendation engine for retail customers. You are providing retail customers with an API where they can submit a user ID and theAPI returns a list of recommendations for that user. You are responsible for the API lifecycle and want to ensure stability for your customers in case the API makes backward-incompatible changes. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Create a distribution list of all customers to inform them of an upcoming backward-incompatible change at least one month before replacing the old API with the new API."}, {"letter": "B", "text": "Create an automated process to generate API documentation, and update the public API documentation as part of the CI/CD process when deploying an update to the API."}, {"letter": "C", "text": "Use a versioning strategy for the APIs that increases the version number on every backward-incompatible change."}, {"letter": "D", "text": "Use a versioning strategy for the APIs that adds the suffix ג€DEPRECATEDג€ to the current API version number on every backward-incompatible change. Use the current version number for the new API."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56656-exam-professional-cloud-architect-topic-1-question-137/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["CI/CD"]}, {"id": "T1-Q138", "topic": 1, "qnum": 138, "question": "Your company has developed a monolithic, 3-tier application to allow external users to upload and share files. The solution cannot be easily enhanced and lacks reliability. The development team would like to re-architect the application to adopt microservices and a fully managed service approach, but they need to convince their leadership that the effort is worthwhile. Which advantage(s) should they highlight to leadership?", "options": [{"letter": "A", "text": "The new approach will be significantly less costly, make it easier to manage the underlying infrastructure, and automatically manage the CI/CD pipelines."}, {"letter": "B", "text": "The monolithic solution can be converted to a container with Docker. The generated container can then be deployed into a Kubernetes cluster."}, {"letter": "C", "text": "The new approach will make it easier to decouple infrastructure from application, develop and release new features, manage the underlying infrastructure, manage CI/CD pipelines and perform A/B testing, and scale the solution if necessary."}, {"letter": "D", "text": "The process can be automated with Migrate for Compute Engine."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56976-exam-professional-cloud-architect-topic-1-question-138/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["容器化", "CI/CD"]}, {"id": "T1-Q139", "topic": 1, "qnum": 139, "question": "Your team is developing a web application that will be deployed on Google Kubernetes Engine (GKE). Your CTO expects a successful launch and you need to ensure your application can handle the expected load of tens of thousands of users. You want to test the current deployment to ensure the latency of your application stays below a certain threshold. What should you do?", "options": [{"letter": "A", "text": "Use a load testing tool to simulate the expected number of concurrent users and total requests to your application, and inspect the results."}, {"letter": "B", "text": "Enable autoscaling on the GKE cluster and enable horizontal pod autoscaling on your application deployments. Send curl requests to your application, and validate if the auto scaling works."}, {"letter": "C", "text": "Replicate the application over multiple GKE clusters in every Google Cloud region. Configure a global HTTP(S) load balancer to expose the different clusters over a single global IP address."}, {"letter": "D", "text": "Use Cloud Debugger in the development environment to understand the latency between the different microservices."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56706-exam-professional-cloud-architect-topic-1-question-139/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "效能調校", "監控與可觀測性"]}, {"id": "T1-Q140", "topic": 1, "qnum": 140, "question": "Your company has a Kubernetes application that pulls messages from Pub/Sub and stores them in Filestore. Because the application is simple, it was deployed as a single pod. The infrastructure team has analyzed Pub/Sub metrics and discovered that the application cannot process the messages in real time. Most of them wait for minutes before being processed. You need to scale the elaboration process that is I/O-intensive. What should you do?", "options": [{"letter": "A", "text": "Use kubectl autoscale deployment APP_NAME --max 6 --min 2 --cpu-percent 50 to configure Kubernetes autoscaling deployment."}, {"letter": "B", "text": "Configure a Kubernetes autoscaling deployment based on the subscription/push_request_latencies metric."}, {"letter": "C", "text": "Use the --enable-autoscaling flag when you create the Kubernetes cluster."}, {"letter": "D", "text": "Configure a Kubernetes autoscaling deployment based on the subscription/num_undelivered_messages metric."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60396-exam-professional-cloud-architect-topic-1-question-140/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Pub/Sub", "自動擴縮"]}, {"id": "T1-Q141", "topic": 1, "qnum": 141, "question": "Your company is developing a web-based application. You need to make sure that production deployments are linked to source code commits and are fully auditable. What should you do?", "options": [{"letter": "A", "text": "Make sure a developer is tagging the code commit with the date and time of commit."}, {"letter": "B", "text": "Make sure a developer is adding a comment to the commit that links to the deployment."}, {"letter": "C", "text": "Make the container tag match the source code commit hash."}, {"letter": "D", "text": "Make sure the developer is tagging the commits with latest."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60698-exam-professional-cloud-architect-topic-1-question-141/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["CI/CD"]}, {"id": "T1-Q142", "topic": 1, "qnum": 142, "question": "An application development team has come to you for advice. They are planning to write and deploy an HTTP(S) API using Go 1.12. The API will have a very unpredictable workload and must remain reliable during peaks in traffic. They want to minimize operational overhead for this application. Which approach should you recommend?", "options": [{"letter": "A", "text": "Develop the application with containers, and deploy to Google Kubernetes Engine."}, {"letter": "B", "text": "Develop the application for App Engine standard environment."}, {"letter": "C", "text": "Use a Managed Instance Group when deploying to Compute Engine."}, {"letter": "D", "text": "Develop the application for App Engine flexible environment, using a custom runtime."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60437-exam-professional-cloud-architect-topic-1-question-142/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["App Engine", "無伺服器", "自動擴縮"]}, {"id": "T1-Q143", "topic": 1, "qnum": 143, "question": "Your company is designing its data lake on Google Cloud and wants to develop different ingestion pipelines to collect unstructured data from different sources.After the data is stored in Google Cloud, it will be processed in several data pipelines to build a recommendation engine for end users on the website. The structure of the data retrieved from the source systems can change at any time. The data must be stored exactly as it was retrieved for reprocessing purposes in case the data structure is incompatible with the current processing pipelines. You need to design an architecture to support the use case after you retrieve the data. What should you do?", "options": [{"letter": "A", "text": "Send the data through the processing pipeline, and then store the processed data in a BigQuery table for reprocessing."}, {"letter": "B", "text": "Store the data in a BigQuery table. Design the processing pipelines to retrieve the data from the table."}, {"letter": "C", "text": "Send the data through the processing pipeline, and then store the processed data in a Cloud Storage bucket for reprocessing."}, {"letter": "D", "text": "Store the data in a Cloud Storage bucket. Design the processing pipelines to retrieve the data from the bucket."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60682-exam-professional-cloud-architect-topic-1-question-143/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["Cloud Storage", "資料庫Schema設計"]}, {"id": "T1-Q144", "topic": 1, "qnum": 144, "question": "You are responsible for the Google Cloud environment in your company. Multiple departments need access to their own projects, and the members within each department will have the same project responsibilities. You want to structure your Google Cloud environment for minimal maintenance and maximum overview ofIAM permissions as each department's projects start and end. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Grant all department members the required IAM permissions for their respective projects."}, {"letter": "B", "text": "Create a Google Group per department and add all department members to their respective groups. Create a folder per department a
