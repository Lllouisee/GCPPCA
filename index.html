技術，對整個架構進行現代化改造。在現代化改造的過程中，新舊架構之間的延遲和維運負擔降到最低將是關鍵。你需要設計 VM 環境在 Google Cloud 上的雲端架構，同時確保未來的現代化改造路徑能符合技術需求。你該怎麼做？"}, "keywords": ["minimal latency and operational overhead between the old and new landscape"], "myAnswer": "B"}, {"id": "T1-Q234", "topic": 1, "qnum": 234, "question": "KnightMotives has developed and deployed a model on Vertex AI that can provide personalized recommendations in the new car configuration application. Customers will receive optional equipment recommendations that best suit their persona. Previous usage data from the car configuration application has been used for model training features. You know from past experience that customer behavior can change over time. For example, in times of economic certainty and rising stock markets, customers tend to purchase more expensive options. You want to detect when customer behavior gradually changes over time so you can adjust the model. What should you do?", "options": [{"letter": "A", "text": "Configure Model Monitoring, and select training-serving skew detection."}, {"letter": "B", "text": "Configure Model Monitoring, and select prediction drift detection."}, {"letter": "C", "text": "Configure Dataplex auto data quality on the prediction request data features using row-level rules."}, {"letter": "D", "text": "Configure Dataplex auto data quality on the prediction request data features using aggregate rules."}], "answer": "B", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383595-exam-professional-cloud-architect-topic-1-question-234/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Vertex AI/AI-ML", "監控與可觀測性", "案例研究題"], "explanation": {"notes": [{"heading": "題目在問什麼", "body": "KnightMotives 在 Vertex AI 上訓練了一個模型，根據客戶特質推薦配車選配，訓練資料用的是過去的使用數據。客戶行為會隨時間漸進式改變（例如股市好的時候，客戶傾向買貴的選配）。要偵測『客戶行為隨時間逐漸改變』，好讓你知道什麼時候該調整模型。"}, {"heading": "答案驗證：B（Prediction drift detection）", "body": "關鍵在分辨 training-serving skew 跟 prediction drift 的差異。skew 是拿模型上線時吃到的即時資料，跟『當初訓練用的那份固定資料集』做比較，是跟一個過去的固定基準點比對的一次性落差；drift 是看模型上線後這段時間自己送進來的資料，隨著時間推移分布是不是在慢慢改變，抓的是持續性、漸進式的變化趨勢。題目明確說『detect when customer behavior gradually changes over time』，精準對應 drift（隨時間漂移），不是 skew。信心高，邏輯清楚不需額外查證。"}, {"heading": "服務介紹：Vertex AI Model Monitoring", "body": "是什麼：GCP 用來持續監控已上線機器學習模型的工具，專門抓『模型現在吃到的資料，是不是已經跟訓練時不一樣了』，主要分兩種偵測：training-serving skew（訓練-服務偏差，跟訓練資料集比對）跟 prediction drift（預測漂移，跟自己過去一段時間的資料比對）。\n解決什麼問題：模型上線後，現實世界資料會隨時間改變（客戶行為、市場環境等），如果沒有監控，模型會在不知不覺中變得不準，Model Monitoring 讓你及時發現該重新訓練/調整模型的時機。\n在這題的應用：題目要偵測『客戶行為隨時間漸進改變』，答案選 prediction drift detection，因為它專門抓資料隨時間推移的持續性變化,正好對應題目情境。\n常見程度：GCP 考試中『MLOps / 模型上線後維運』主題的常見核心服務，skew vs drift 的差異是常考細節。"}, {"heading": "什麼是 Training-serving skew（訓練-服務偏差）", "body": "是什麼：拿模型上線後、實際接收到的服務（serving）資料，跟當初訓練（training）用的那份固定資料集做統計分布比對，檢查兩者是否有落差。\n解決什麼問題：確保『模型實際上線後吃到的資料』跟『當初訓練時看到的資料』長得差不多，避免訓練/上線環境不一致造成模型失準。\n在這題的應用：這是跟一個過去的固定基準點（訓練資料集）比對的一次性落差偵測，不是持續追蹤『隨時間推移』的變化趨勢，所以不符合題目『gradually changes over time』的要求，是這題的誤答陷阱。\n常見程度：常跟 prediction drift 放在一起考，重點記住『skew 比訓練資料、drift 比自己過去的資料』。"}, {"heading": "什麼是 Prediction drift（預測漂移）", "body": "是什麼：不跟訓練資料比，而是看模型上線後這段時間內，自己收到的預測請求資料，隨著時間推移分布是不是在慢慢改變,抓的是持續性、漸進式的變化趨勢。\n解決什麼問題：有些情境下資料會隨著現實世界環境（例如經濟狀況、季節、流行趨勢）慢慢改變,即使跟原始訓練資料的差距一開始不大，也需要被偵測出來，才能及時調整模型。\n在這題的應用：題目的『客戶行為隨時間漸進改變』正是 drift 的典型場景，所以答案選 B。\n常見程度：MLOps 監控主題的核心概念，常與 skew 做對比考。"}, {"heading": "服務介紹：Dataplex", "body": "是什麼：GCP 的資料治理/資料品質管理工具，用來檢查資料本身乾不乾淨、符不符合規則，例如有沒有缺值、格式對不對、數值有沒有超出合理範圍。它的 auto data quality 功能可以設定規則：row-level（逐筆檢查每一列資料）或 aggregate（整批統計層面檢查，例如整體平均值/缺值比例）。\n解決什麼問題：確保資料倉儲/資料湖裡的資料品質符合標準，常用在 ETL 流程、資料治理場景，跟『機器學習模型的預測行為是否隨時間改變』是完全不同的範疇。\n在這題的應用：C、D 選 Dataplex 的 row-level/aggregate 規則，但這題要偵測的是模型的預測行為漂移，不是資料本身乾不乾淨，從工具類別上就選錯了，是這題的誤答陷阱。\n常見程度：Dataplex 本身是常見的資料治理服務，但常被用來跟『模型監控』類題目混淆,要分清楚『資料品質』跟『模型監控』是兩套不同工具。"}], "optionTable": [{"letter": "A", "analysis": "錯誤：Training-serving skew 偵測的是『模型上線後的即時資料』跟『當初訓練用的那份固定資料集』之間的分布落差，是跟一個過去的固定基準點比對的一次性落差，不是持續追蹤『隨時間推移』的變化趨勢，不符合題目『客戶行為隨時間漸進改變』的要求。", "zh": "設定 Model Monitoring，選擇訓練-服務偏差（training-serving skew）偵測。"}, {"letter": "B", "analysis": "正確：Prediction drift detection 看的是模型上線後這段時間內，自己收到的預測請求資料，隨著時間推移分布是不是在慢慢改變，抓的正是持續性、漸進式的變化趨勢，精準對應題目『detect when customer behavior gradually changes over time』的要求。", "zh": "設定 Model Monitoring，選擇預測漂移（prediction drift）偵測。"}, {"letter": "C", "analysis": "錯誤：Dataplex 的 auto data quality 是資料治理/資料品質工具，用 row-level 規則逐筆檢查資料是否乾淨（有無缺值、格式對不對），跟『偵測模型預測行為隨時間改變』是完全不同的範疇，從工具類別上就選錯了。", "zh": "在 Dataplex 上針對預測請求資料的特徵，用逐筆（row-level）規則設定自動資料品質檢查。"}, {"letter": "D", "analysis": "錯誤：跟 C 一樣是 Dataplex 資料品質工具，只是用 aggregate（整批統計層面）規則而非逐筆檢查，但同樣不是用來偵測模型預測行為隨時間漂移的工具。", "zh": "在 Dataplex 上針對預測請求資料的特徵，用整批統計（aggregate）規則設定自動資料品質檢查。"}], "questionZh": "KnightMotives 在 Vertex AI 上開發並部署了一個模型，可以在新的汽車配置應用程式裡提供個人化推薦。客戶會收到最適合他們個人特質的選配設備推薦。汽車配置應用程式過去的使用數據，被用來當作模型訓練的特徵。你從過往經驗得知，客戶行為會隨時間改變。舉例來說，在經濟景氣穩定、股市上漲的時期，客戶傾向購買較貴的選配。你想要偵測客戶行為何時隨時間逐漸改變，以便調整模型。你該怎麼做？"}, "keywords": ["detect when customer behavior gradually changes over time"]}, {"id": "T1-Q235", "topic": 1, "qnum": 235, "question": "Your team plans to use Vertex AI to develop and deploy machine learning models for various use cases for fraud detection, product recommendations, and customer churn prediction. You want to enhance the security posture of the Vertex AI and Workbench environment by restricting data exfiltration. What should you do?", "options": [{"letter": "A", "text": "Enable Private Google Access for the VPC network to allow Vertex AI services to access public Google services without traversing the public internet."}, {"letter": "B", "text": "Enable VPC Flow Logs to monitor network traffic to and from Vertex AI services and to identify suspicious activity."}, {"letter": "C", "text": "Create a service perimeter and include ml.googleapis.com and document.googleapis.com as protected services."}, {"letter": "D", "text": "Create a service perimeter and include aiplatform.googleapis.com and notebooks.googleapis.com as protected services."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383614-exam-professional-cloud-architect-topic-1-question-235/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Vertex AI/AI-ML", "VPC/網路", "安全性"], "explanation": {"notes": [{"heading": "題目在問什麼", "body": "團隊要用 Vertex AI 開發/部署多個機器學習模型（詐欺偵測、產品推薦、客戶流失預測）。要強化 Vertex AI 和 Workbench 環境的安全性，防止資料外洩（data exfiltration）。"}, {"heading": "答案驗證：D", "body": "VPC Service Controls 的 Service Perimeter 保護的是你指定的特定 Google API，關鍵是要選對 API 清單：aiplatform.googleapis.com 是 Vertex AI 現行的 API（涵蓋訓練、部署、預測），notebooks.googleapis.com 是 Vertex AI Workbench（筆記本開發環境）的 API，兩個加起來正好對應題目說的『Vertex AI 和 Workbench 環境』。C 選的 ml.googleapis.com 是舊版 AI Platform（原 Cloud ML Engine）的 API，document.googleapis.com 是 Document AI（文件解析/OCR）的 API，都跟題目描述的 Vertex AI 用例無關，是選了看起來像但其實不對的服務名稱。信心高，邏輯清楚、API 名稱對應明確。"}, {"heading": "什麼是 Data exfiltration（資料外洩）", "body": "指內部的敏感資料被未經授權地搬出受控範圍，例如員工（或被盜用帳號/惡意程式）把公司機密資料複製到個人帳號、外部儲存空間，或透過網路傳到控制範圍以外的地方。這題要防的就是有人在 Vertex AI / Workbench 環境裡，把訓練資料或模型結果偷偷搬出去。"}, {"heading": "服務介紹：VPC Service Controls（Service Perimeter）", "body": "是什麼：GCP 的安全機制，可以在指定的 GCP 專案/服務周圍畫一條『邊界』（Service Perimeter）。邊界內的服務可以正常互相存取，但邊界內的資料不能被搬到邊界外（例如不能被複製到邊界外的 Cloud Storage bucket，或透過未授權的網路路徑送出去）——這是主動預防性（preventive）控制，不是事後查的被動監控。\n解決什麼問題：防止敏感資料被搬出受控範圍，即使帳號被盜用或員工誤操作，也能從網路層面擋下資料外洩。\n在這題的應用：要保護的目標是 aiplatform.googleapis.com（Vertex AI）+ notebooks.googleapis.com（Workbench），正好對應題目描述的環境,所以答案選 D。\n常見程度：GCP 考試中『資料外洩防護 / 多租戶資料隔離』情境的標準正解機制，重點是要記住它保護的是『特定 API』,選對 API 名稱是這類題目的關鍵。"}, {"heading": "什麼是 Vertex AI Workbench", "body": "是什麼：Vertex AI 裡提供的筆記本開發環境，本質上是託管版的 Jupyter Notebook，底層是一台已經裝好 Python、機器學習套件（TensorFlow、PyTorch、Pandas 等）、並連好 BigQuery、Cloud Storage 等 GCP 資料服務的 Compute Engine VM。\n解決什麼問題：讓資料科學家不用自己架設、維護開發環境（裝套件、處理版本相容性等），直接在雲端隨開即用的筆記本裡寫程式做資料探索、訓練模型。\n在這題的應用：資料科學家在 Workbench 裡會接觸大量敏感訓練資料（例如詐欺偵測用的交易記錄），如果沒有限制，有人可能直接在 Notebook 裡把資料複製/下載到外部，所以 Service Perimeter 要把 notebooks.googleapis.com（Workbench 的 API）也納入保護範圍，不能只保護 aiplatform.googleapis.com（Vertex AI 的訓練/部署功能）。\n常見程度：非常常見，是 Vertex AI 生態系裡資料科學家的主要互動介面之一。"}, {"heading": "為什麼 A、B 錯：連線路徑 vs 監控 vs 預防", "body": "A（Private Google Access）：讓沒有外部 IP 的 VM 能透過 Google 的私有網路路徑（不經公開網際網路）存取 Google 的公開 API 服務，解決的是『連線路徑』問題，跟『防止資料被搬出受控邊界』是不同訴求,本身不會阻止資料外洩。\nB（VPC Flow Logs）：只是把進出的網路流量記錄下來方便事後查看/分析可疑行為，是偵測性（detective）而非預防性（preventive）控制——能幫你事後發現異常，但不會主動阻止資料真的被搬出去。題目要的是『restricting』（限制/防止），不是『監控』。\n記憶重點：看到『restrict exfiltration / 防止資料外洩』這種『主動防止』的要求，優先考慮 VPC Service Controls（預防性），而不是 Flow Logs（偵測性）或 Private Google Access（連線路徑優化）。"}], "optionTable": [{"letter": "A", "analysis": "錯誤：Private Google Access 讓沒有外部 IP 的 VM，透過 Google 私有網路路徑（不經公開網際網路）存取 Google 的公開 API 服務，解決的是『連線路徑』問題，本身並不會限制或阻止資料被搬出受控邊界，跟『restricting exfiltration』的要求不對應。", "zh": "為 VPC 網路啟用 Private Google Access，讓 Vertex AI 服務可以不經過公開網際網路，直接存取 Google 的公開服務。"}, {"letter": "B", "analysis": "錯誤：VPC Flow Logs 只是把進出的網路流量記錄下來，方便事後查看/分析可疑行為，是偵測性（detective）控制，不會主動阻止資料真的被搬出去，不符合題目『restricting』（限制/防止）的要求。", "zh": "啟用 VPC Flow Logs，監控進出 Vertex AI 服務的網路流量，藉此識別可疑活動。"}, {"letter": "C", "analysis": "錯誤：Service Perimeter 的概念正確，但保護的 API 選錯了——ml.googleapis.com 是舊版 AI Platform（原 Cloud ML Engine）的 API，不是現行 Vertex AI 用的 API；document.googleapis.com 是 Document AI（文件解析/OCR）的 API，跟題目的 Vertex AI 用例無關，兩個都跟題目描述的環境不對應。", "zh": "建立一個服務邊界（service perimeter），並將 ml.googleapis.com 和 document.googleapis.com 納入受保護的服務。"}, {"letter": "D", "analysis": "正確：Service Perimeter 搭配正確的 API——aiplatform.googleapis.com 是 Vertex AI 現行的 API（涵蓋訓練、部署、預測），notebooks.googleapis.com 是 Vertex AI Workbench 的 API，兩個加起來正好對應題目說的『Vertex AI 和 Workbench 環境』，用預防性控制限制資料外洩，完全符合要求。", "zh": "建立一個服務邊界（service perimeter），並將 aiplatform.googleapis.com 和 notebooks.googleapis.com 納入受保護的服務。"}], "questionZh": "你的團隊打算用 Vertex AI 開發並部署機器學習模型，用於詐欺偵測、產品推薦、客戶流失預測等多種用例。你想要強化 Vertex AI 和 Workbench 環境的安全性，限制資料外洩（data exfiltration）。你該怎麼做？"}, "keywords": ["security posture of the Vertex AI and Workbench environment", "restricting data exfiltration"]}, {"id": "T1-Q236", "topic": 1, "qnum": 236, "question": "You have an application that uses Vertex AI Feature Store to manage and serve product features for real-time recommendations. You want to monitor the performance and health of the application. You need to understand the overall duration of a request. What should you do?", "options": [{"letter": "A", "text": "Observe the Request size in your featurestore."}, {"letter": "B", "text": "Monitor the Queries per second for your featurestore."}, {"letter": "C", "text": "Measure the Latency of your requests."}, {"letter": "D", "text": "Track the Online serving throughput of your requests."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383599-exam-professional-cloud-architect-topic-1-question-236/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Vertex AI/AI-ML", "監控與可觀測性", "效能調校"], "keywords": ["understand the overall duration of a request"], "explanation": {"questionZh": "你有一個應用程式，使用 Vertex AI Feature Store 來管理並提供產品特徵資料，供即時推薦使用。你想要監控這個應用程式的效能和健康狀況，需要了解一次請求的整體耗時。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Request size 衡量的是一次請求傳送的資料量大小，關心的是『流量/資料量』，跟『耗時多久』無關。", "zh": "觀察 featurestore 的 Request size（請求大小）。"}, {"letter": "B", "analysis": "錯誤：Queries per second（QPS）衡量系統每秒能處理多少次請求，是流量/負載量指標，告訴你系統忙不忙，不是單一請求花了多久時間。", "zh": "監控 featurestore 的 Queries per second（每秒查詢數）。"}, {"letter": "C", "analysis": "正確：Latency 就是從送出請求到收到回應，中間經過的時間，正是題目問的『overall duration of a request（一次請求的整體耗時）』的標準說法，兩者是同一件事。", "zh": "測量你的請求的 Latency（延遲）。"}, {"letter": "D", "analysis": "錯誤：Online serving throughput 指系統單位時間內能完成的請求數量（跟 QPS 概念類似），是整體產能/流量指標，不是單一請求花多久時間。", "zh": "追蹤你的請求的 Online serving throughput（線上服務吞吐量）。"}], "notes": [{"heading": "題目在問什麼", "body": "有個應用程式用 Vertex AI Feature Store 管理並提供產品特徵資料，做即時推薦。要監控這個應用程式的效能和健康狀況，需要了解『一次請求的整體耗時』。"}, {"heading": "答案驗證：C", "body": "這題的核心是分辨 latency（單次請求耗時）vs throughput/QPS（整體流量/吞吐量）這兩類完全不同的效能指標——看到『一次請求的整體耗時 / duration of a request』這種字眼，直接對應 latency，不是流量相關的指標。信心很高，邏輯直接，不需額外查證。"}, {"heading": "服務介紹：Vertex AI Feature Store", "body": "是什麼：Vertex AI 裡的特徵（feature）管理服務。做機器學習時，模型預測需要輸入一堆特徵（例如使用者過去的購買紀錄、商品類別、瀏覽次數等），Feature Store 的角色是集中管理這些特徵資料，訓練模型時和實際上線做預測時都從同一個地方拿特徵，確保資料一致，而且能做到低延遲、即時查詢（online serving）。\n解決什麼問題：避免訓練用的特徵資料跟上線服務時用的特徵資料不一致（這正是 Q234 提到的 training-serving skew 的成因之一），同時提供毫秒等級的即時查詢能力。\n在這題的應用：題目的『即時推薦』場景就是透過 Feature Store 提供特徵資料，監控的重點是這個查詢過程的回應耗時（latency）。\n常見程度：MLOps / 即時推薦系統主題的常見核心服務。"}]}}, {"id": "T1-Q237", "topic": 1, "qnum": 237, "question": "A large healthcare provider's primary electronic health record (EHR) application runs on Compute Engine instances with a Cloud SQL for PostgreSQL database, all located in the us-west1 region. A new regulatory mandate requires you to implement and document a business continuity plan (BCP). This plan must ensure that the EHR application can be fully recovered and operational in a different geographical region with a recovery time objective (RTO) of two hours and a recovery point objective (RPO) of 15 minutes. You need to design a disaster recovery strategy that meets these strict BCP requirements. What should you do?", "options": [{"letter": "A", "text": "Deploy active managed instance groups (MIGs) in both us-west1 and us-east1, fronted by a global external HTTP(S) Load Balancer. For the database, use a cross-region read replica in us-east1, and rely on load balancer health checks to automatically fail over all traffic during an outage."}, {"letter": "B", "text": "Use Terraform to define the application’s compute infrastructure. During a disaster, configure the Cloud SQL database in us-west1 to use a cross-region read replica in us-east1, build the environment in us-east1, and promote the replica."}, {"letter": "C", "text": "Take daily snapshots of the Compute Engine disks and Cloud SQL database. Copy these snapshots to a Cloud Storage bucket in us-east1. During a disaster, manually restore the virtual machines (VMs) and database from the latest snapshots"}, {"letter": "D", "text": "Deploy a regional MIG in us-west1 for high availability, and rely on the Google Cloud SLA to ensure the region remains online."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383620-exam-professional-cloud-architect-topic-1-question-237/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud SQL", "Compute Engine", "高可用性/災難復原", "多區域架構"], "keywords": ["recovery time objective (RTO) of two hours", "recovery point objective (RPO) of 15 minutes"], "explanation": {"questionZh": "一家大型醫療機構主要的電子病歷（EHR）應用程式，跑在 Compute Engine 執行個體上，搭配 Cloud SQL for PostgreSQL 資料庫，全部都位於 us-west1 區域。新的法規要求你實作並記錄一份業務持續營運計畫（BCP）。這份計畫必須確保 EHR 應用程式能在不同地理區域完全復原並上線，復原時間目標（RTO）為兩小時，復原點目標（RPO）為 15 分鐘。你需要設計一套符合這些嚴格 BCP 要求的災難復原策略。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：在 us-west1 和 us-east1 兩個區域都預先部署好 active 的 MIG，前面掛全域外部 HTTP(S) 負載平衡器；資料庫用跨區域唯讀複本持續同步，災難發生時負載平衡器健康檢查自動把流量切到 us-east1。兩邊都已預先建好、持續運作，加上自動故障轉移，符合 2 小時 RTO；資料庫持續複製而非定期備份，遺失資料範圍可壓在分鐘等級，符合 15 分鐘 RPO。", "zh": "在 us-west1 和 us-east1 都部署 active 的受管理執行個體群組（MIG），前面掛一個全域外部 HTTP(S) 負載平衡器。資料庫方面，在 us-east1 使用跨區域唯讀複本，並依靠負載平衡器的健康檢查，在故障發生時自動將所有流量轉移。"}, {"letter": "B", "analysis": "錯誤：用 Terraform 定義基礎設施本身沒問題，但 us-east1 的環境是『災難發生當下才開始建』，不是預先建好、持續運作。臨時部署整套 VM 環境、再把資料庫複本升級成主庫，整個流程要在 2 小時內完成風險很高，比 A 的『兩邊都已在跑，只是切換流量』慢得多，難以穩定達成 RTO 要求。", "zh": "用 Terraform 定義應用程式的運算基礎設施。發生災難時，把 us-west1 的 Cloud SQL 資料庫設定為使用 us-east1 的跨區域唯讀複本，在 us-east1 建立環境，並將複本升級（promote）為主庫。"}, {"letter": "C", "analysis": "錯誤：每日快照的 RPO 最好只能到『前一天的快照』，最多可能遺失將近 24 小時的資料，遠超過題目要求的 15 分鐘，直接不合格；手動還原的速度也慢，可能連帶衝擊 2 小時 RTO。", "zh": "每天對 Compute Engine 磁碟和 Cloud SQL 資料庫做快照。把這些快照複製到 us-east1 的 Cloud Storage bucket。發生災難時，手動從最新的快照還原虛擬機（VM）和資料庫。"}, {"letter": "D", "analysis": "錯誤：只在 us-west1 用區域型 MIG 做高可用性，完全沒有部署到其他地理區域，只依賴 Google Cloud 的 SLA 保證區域不會掛掉。題目明確要求『能在不同地理區域恢復』，如果整個 us-west1 區域發生大規模故障，區域型 MIG 救不了，根本沒做到跨區域容災。", "zh": "在 us-west1 部署一個區域型 MIG 來達成高可用性，並依靠 Google Cloud 的 SLA 來確保該區域維持上線。"}], "notes": [{"heading": "題目在問什麼", "body": "大型醫療機構的 EHR 系統跑在 us-west1 的 Compute Engine + Cloud SQL for PostgreSQL 上。新法規要求做 BCP：萬一整個區域掛掉，系統必須能在不同地理區域完整恢復並上線，RTO=2 小時，RPO=15 分鐘。"}, {"heading": "答案驗證：A", "body": "A 是唯一一個『兩個區域都預先部署好、持續運作（active-active）+ 自動故障轉移 + 資料庫持續複製』的方案。B 的環境是災難當下才建，C 的 RPO 只能到前一天（遠超 15 分鐘），D 完全沒有跨區域部署。信心高，邏輯清楚。"}, {"heading": "什麼是 RTO 與 RPO", "body": "RTO（Recovery Time Objective，復原時間目標）：災難發生後，系統最多可以容忍多久的停機時間才能恢復上線，這題是 2 小時。\nRPO（Recovery Point Objective，復原點目標）：災難發生時，最多可以容忍遺失多少時間範圍內的資料，這題是 15 分鐘，意思是最壞情況下只能遺失災難發生前 15 分鐘內的資料。\n比喻：RTO 問『要多久才能重新開門營業』，RPO 問『帳本最多能缺幾分鐘沒記到』。RPO 愈短，代表愈需要頻繁、即時的資料備份/複製機制，定期快照/備份無法滿足分鐘等級的 RPO，必須用持續性複製。"}, {"heading": "什麼是 Managed Instance Group（MIG，受管理執行個體群組）", "body": "是什麼：一組可以自動擴縮、自動偵測並補上掛掉的 VM（自動修復/autohealing）的 Compute Engine VM 叢集，GCP 會依照你設定的範本自動管理這組 VM 的數量和健康狀態。\n解決什麼問題：避免手動管理一堆獨立 VM、手動擴容、手動重啟掛掉的機器。\n在這題的應用：A 選項在兩個區域各自跑一組 active 的 MIG，確保兩邊隨時都有健康的運算資源可以服務流量，是跨區域容災架構的基礎元件。\n常見程度：GCP 考試中『高可用性/自動擴縮』情境的核心服務，與 Regional MIG（同一區域內跨多個可用區部署，只提供區域內高可用性，不提供跨區域容災）要分清楚。"}, {"heading": "什麼是全域外部 HTTP(S) 負載平衡器（Global external HTTP(S) Load Balancer）", "body": "是什麼：GCP 的一種負載平衡器，可以在全球入口點接收流量，並依照後端健康狀況、地理位置等因素，自動把請求導到最合適、且健康的後端（例如不同區域的 MIG）。\n解決什麼問題：當某個區域的後端出問題時，不需要人工介入修改 DNS 或路由設定，負載平衡器本身的健康檢查機制就能自動把流量導向健康的區域。\n在這題的應用：A 選項靠這個負載平衡器的健康檢查，在 us-west1 故障時自動把流量切到 us-east1，是達成 2 小時 RTO 的關鍵（自動化故障轉移，不用等人工操作）。\n常見程度：多區域高可用架構的標準元件，常考『自動故障轉移』情境。"}, {"heading": "什麼是跨區域唯讀複本（Cross-region read replica）", "body": "是什麼：Cloud SQL 的一種資料庫複本，架設在跟主資料庫不同的區域，持續（近即時）同步主資料庫的資料變化，平常只能唯讀查詢，但在主資料庫掛掉時可以被『升級（promote）』成新的主資料庫。\n解決什麼問題：讓資料庫的資料也有跨區域的備援，而且是持續同步（不是定期備份），資料落後主庫的時間差可以壓在很短範圍內。\n在這題的應用：A 選項這個複本是預先建立好、持續在同步的，所以故障發生時只遺失极短時間的資料（符合 15 分鐘 RPO）；B 選項則是災難發生『當下才設定』複本，缺少這個持續同步的過程,無法穩定達成同樣的 RPO。\n常見程度：資料庫層級的跨區域容災標準做法，常與『定期快照』做對比（快照 RPO 以『備份間隔』為單位，通常是小時或天；持續複製的 RPO 可以到分鐘甚至秒級)。"}]}}, {"id": "T1-Q238", "topic": 1, "qnum": 238, "question": "A financial services company is decommissioning one of its on-premises data centers. As part of this initiative, the company needs to perform a one-time migration of 500 ТВ of historical transaction archives to a Cloud Storage bucket for long-term retention. The data center’s internet egress is 1 Gbps, which is shared with critical business operations. You must complete the secure data transfer within a 60-day window to meet the decommissioning deadline. What should you do?", "options": [{"letter": "A", "text": "Provision a Partner Interconnect connection with a 10 Gbps capacity to accelerate the data transfer, and then use Storage Transfer Service."}, {"letter": "B", "text": "Write a script that uses the gcloud storage cp --parallel command to upload the data in chunks over the public internet during off-peak hours."}, {"letter": "C", "text": "Use Storage Transfer Service to create an agent-based transfer job that moves the data from the on-premises file servers directly to the Cloud Storage bucket."}, {"letter": "D", "text": "Order a Transfer Appliance, copy the data to the appliance using your high-speed local network, and ship it back to Google to upload the data into your Cloud Storage bucket."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383632-exam-professional-cloud-architect-topic-1-question-238/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Storage", "資料遷移"], "keywords": ["internet egress is 1 Gbps, which is shared with critical business operations", "secure data transfer within a 60-day window"], "explanation": {"questionZh": "一家金融服務公司正在關閉其中一個地端資料中心。作為這項計畫的一部分，公司需要將 500 TB 的歷史交易歸檔資料一次性遷移到一個 Cloud Storage bucket，以長期保存。這個資料中心的網際網路出口頻寬是 1 Gbps，而且跟關鍵業務營運共用這條線路。你必須在 60 天的時間窗口內完成安全的資料傳輸，以符合關閉資料中心的最後期限。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：申請、審核、實際佈線 Partner Interconnect 通常要花數週到數月才能生效，不一定趕得上 60 天的截止日；為了一次性的遷移去申請一條長期合約性質的專線，成本效益也很差——專線通常適合長期、持續性的大流量需求，不是一次性任務。", "zh": "佈建一條 10 Gbps 容量的 Partner Interconnect 連線來加速資料傳輸，接著使用 Storage Transfer Service。"}, {"letter": "B", "analysis": "錯誤：無論是否平行上傳、選在離峰時段，本質上還是走同一條被限制、被共用的 1 Gbps 對外線路。500 TB 用 1 Gbps 全速不間斷跑也要約 46 天，而這條線路不可能被遷移工作完全吃滿（要跟關鍵業務共用），實際完成時間遠超過 60 天，而且會跟關鍵業務搶頻寬，風險高。", "zh": "寫一個腳本，使用 gcloud storage cp --parallel 指令，在離峰時段透過公開網際網路分批上傳資料。"}, {"letter": "C", "analysis": "錯誤：Storage Transfer Service 的 agent-based 傳輸工作，雖然是用代理程式從地端伺服器搬資料到 Cloud Storage，但底層資料依然要透過網路傳輸送出去，沒有解決頻寬瓶頸的根本問題，一樣受限於那條 1 Gbps 線路。", "zh": "使用 Storage Transfer Service 建立一個 agent-based（代理程式式）的傳輸工作，直接把資料從地端檔案伺服器搬到 Cloud Storage bucket。"}, {"letter": "D", "analysis": "正確：訂購 Transfer Appliance（實體硬體裝置），用機房內部的高速區域網路把資料拷貝進去，完全繞過被共用、頻寬有限的對外網路，再把裝置寄回 Google 由其直接上傳進 Cloud Storage bucket。不受 1 Gbps 瓶頸限制，正是 Google 官方建議用於『一次性、資料量極大、現有網路頻寬不足』情境的標準做法。", "zh": "訂購一台 Transfer Appliance，用你的高速區域網路把資料拷貝到這台裝置上，再把它寄回給 Google，由 Google 把資料上傳進你的 Cloud Storage bucket。"}], "notes": [{"heading": "題目在問什麼", "body": "金融服務公司要關閉地端資料中心，需要把 500 TB 歷史交易歸檔資料一次性遷移到 Cloud Storage。資料中心網際網路出口頻寬只有 1 Gbps，且跟關鍵業務共用，必須在 60 天內安全完成遷移。"}, {"heading": "答案驗證：D", "body": "500 TB ≈ 4,000,000 Gb，用 1 Gbps 24 小時不間斷滿速跑，理論上也要約 46 天才能傳完；但線路要跟關鍵業務共用，不可能整天吃滿頻寬搬資料，實際可用速度一定更低，加上協定開銷、不穩定性，60 天內透過這條網路線完成並不切實際。Transfer Appliance 完全繞過受限的對外網路，靠內部高速網路+實體運送完成搬遷，是 Google 官方建議用於『一次性、資料量極大、現有網路頻寬不足』的標準場景。信心高，數學算式清楚支持此結論。"}, {"heading": "服務介紹：Transfer Appliance", "body": "是什麼：Google 提供的一種實體硬體裝置，Google 把它寄到你的機房，你用機房內部的高速區域網路把資料拷貝進這台裝置，裝滿後寄回去給 Google，由 Google 在資料中心端直接把資料上傳進你的 Cloud Storage bucket。\n解決什麼問題：當現有對外網路頻寬不足以在時限內完成超大量資料（TB~PB 級）的一次性搬遷時，完全繞過網路傳輸的瓶頸，靠『實體運送』取代『網路傳輸』。\n在這題的應用：500 TB 在 1 Gbps 共用線路上根本傳不完，Transfer Appliance 讓資料搬移靠內部高速網路（遠高於 1 Gbps）完成，不占用對外頻寬，也不影響關鍵業務。\n常見程度：GCP 考試中『資料量極大 + 網路頻寬受限 + 一次性遷移』情境的經典標準答案。"}, {"heading": "服務介紹：Partner Interconnect", "body": "是什麼：一種透過合作網路服務商，把你的地端網路跟 Google Cloud 直接用專線連接的服務，不經過公開網際網路，延遲低、頻寬穩定。\n解決什麼問題：適合長期、持續性、大流量的雲端-地端混合架構需求（例如長期跨雲資料同步、持續性的流量）。\n在這題的應用：申請、審核、實際佈線通常要花數週到數月才能生效，不一定趕得上 60 天截止日；而且為了一次性遷移去簽一條長期合約性質的專線，成本效益差，不符合題目『一次性』的任務性質。\n常見程度：常跟 Cloud VPN、Transfer Appliance 放在一起考，重點是分辨『長期持續需求』vs『一次性任務』該選哪種連接/搬遷方式。"}, {"heading": "服務介紹：Storage Transfer Service", "body": "是什麼：GCP 的資料搬遷服務，可以把資料從其他雲端（AWS S3 等）、地端檔案伺服器（透過安裝 agent 代理程式），或 HTTP/HTTPS 來源，搬到 Cloud Storage，並且可以排程、自動重試。\n解決什麼問題：省去自己寫腳本處理大量檔案搬遷、重試失敗、排程等麻煩。\n在這題的應用：無論是否搭配 Storage Transfer Service，只要走網路傳輸，就還是受限於那條 1 Gbps 共用線路，沒有解決頻寬瓶頸本身，所以這題的重點不在搬遷工具本身好不好用，而在於有沒有繞開網路頻寬限制。\n常見程度：常見的雲端資料搬遷服務，但遇到『網路頻寬明顯不足以在時限內傳完』的情境時，要優先想到 Transfer Appliance 而不是單純換個搬遷工具。"}]}}, {"id": "T1-Q239", "topic": 1, "qnum": 239, "question": "Your company wants to optimize Google Cloud costs for their development and staging environments. These environments are workstations used by developers Monday through Friday, 9:00 AM to 6:00 PM local time. Currently, the environments run on a fleet of nl-standard-4 Compute Engine instances that operate 24/7, leading to a high monthly cost for resources that are idle more than 70% of the time. You need to implement a solution that significantly reduces the monthly cost of these non-production environments without impacting the development team's productivity during work hours. What should you do?", "options": [{"letter": "A", "text": "Schedule the virtual machines to start and stop to match your team’s work schedule."}, {"letter": "B", "text": "Purchase three-year committed use discounts (CUDs) for the existing nl-standard-4 instances."}, {"letter": "C", "text": "Upgrade all instances to the N2 machine series."}, {"letter": "D", "text": "Re-architect the environments to run on a regional managed instance group (MIG) with autoscaling enabled."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383608-exam-professional-cloud-architect-topic-1-question-239/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "成本優化"], "keywords": ["operate 24/7, leading to a high monthly cost for resources that are idle more than 70% of the time", "without impacting the development team's productivity during work hours"], "explanation": {"questionZh": "你的公司想針對開發和測試環境優化 Google Cloud 的成本。這些環境是開發人員在週一到週五、當地時間早上 9 點到晚上 6 點使用的工作站。目前這些環境跑在一批全年無休 24/7 運作的 n1-standard-4 Compute Engine 執行個體上，導致每月成本很高，因為超過 70% 的時間這些資源都是閒置的。你需要實作一個解決方案，在不影響開發團隊工作時段生產力的前提下，大幅降低這些非正式環境的每月成本。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：既然使用模式固定在週一到週五的上班時間，最直接有效的做法就是設定排程，下班後自動關機、上班前自動開機。Compute Engine 按實際運作時間計費，關機狀態下運算費用就是 0，完全對應『閒置 70% 時間還在付費』的痛點，上班時段機器照常開著，不影響生產力。", "zh": "排程虛擬機的啟動和關閉時間，配合你的團隊的工作時間表。"}, {"letter": "B", "analysis": "錯誤：CUD 的前提是本來就要一直跑，用承諾長期持續使用換取折扣單價，但這題的問題是機器大部分時間根本不需要跑。就算用 CUD 打折，還是對著閒置 70% 的時間持續付費，只是單價變便宜一點，沒有解決『不需要的時候還在付費』這個核心浪費。", "zh": "為現有的 n1-standard-4 執行個體購買三年期承諾使用折扣（CUD）。"}, {"letter": "C", "analysis": "錯誤：N1、N2 都是 Compute Engine 的通用型機器系列，差別在 CPU 世代、效能、每小時單價略有不同，升級機型可能讓單位效能的費用稍微好一點，但完全沒解決『24/7 開著卻大部分時間沒人用』的問題，機器還是閒置著在燒錢。", "zh": "把所有執行個體升級到 N2 機器系列。"}, {"letter": "D", "analysis": "錯誤：自動擴縮的設計邏輯是根據負載高低（例如 CPU 使用率、流量大小）動態增減機器數量，適合需求量忽大忽小的生產環境。但這題的使用模式是固定的時間表（週一到週五上班時間），不是負載忽高忽低，用自動擴縮解決『照表操課』的問題是用錯工具、徒增複雜度，而且開發用工作站通常是每人固定一台，改成 MIG 架構本身也不太合理。", "zh": "重新架構這些環境，改成跑在啟用自動擴縮的區域型受管理執行個體群組（MIG）上。"}], "notes": [{"heading": "題目在問什麼", "body": "公司想優化開發/測試環境的 GCP 成本。這些環境是給開發人員週一到週五 9:00-18:00（當地時間）使用的工作站，目前用一批 n1-standard-4 Compute Engine 執行個體全年無休 24/7 運作，閒置超過 70% 的時間仍在付費。要在不影響工作時段生產力的前提下，大幅降低每月成本。"}, {"heading": "答案驗證：A", "body": "看到『使用時間有固定規律（例如上班時間）+ 其餘時間完全閒置』，優先考慮排程自動啟停（Instance Schedule）；看到『負載量會忽高忽低、不規律』才考慮 autoscaling；CUD 只在『本來就要長期持續運作』的情境下才划算。信心高，邏輯清楚。"}, {"heading": "什麼是 Instance Schedule（執行個體排程）", "body": "是什麼：Compute Engine 的一項功能，可以設定固定的時間表，自動在指定時間啟動或關閉 VM（例如每天早上 9 點自動開機、晚上 6 點自動關機，週末整天不開）。\n解決什麼問題：對於使用模式有固定規律（像上班時間）的工作負載，省去手動每天開關機的麻煩，並確保非使用時段不會白白付費。\n在這題的應用：直接對應題目的使用模式（週一到週五固定上班時間），關機時段完全不計算運算費用，是這題成本優化最直接、最匹配使用模式的解法。\n常見程度：GCP 考試中『開發/測試環境成本優化』情境幾乎必考的標準正解，常跟 CUD、機型升級、autoscaling 放在一起當誤答選項做對比。"}, {"heading": "什麼是 Committed Use Discounts（CUD，承諾使用折扣）", "body": "是什麼：你向 Google 承諾在未來一段固定期間（通常 1 年或 3 年）持續使用一定量的運算資源，以換取比隨用隨付（on-demand）更低的單價。\n解決什麼問題：適合『用量穩定、長期持續運作』的工作負載，用承諾換取價格優惠。\n在這題的應用：這題的機器大部分時間是閒置的，CUD 解決的是『單價』問題，不是『不需要時還在跑』的浪費問題，兩者是不同層次的成本優化手段——CUD 省的是『跑的時候便宜一點』，Instance Schedule 省的是『不跑的時候完全不付費』。\n常見程度：常見的雲端成本優化工具，但要分清楚它只對『持續性穩定用量』有效，面對『間歇性使用模式』時不是正解。"}]}}, {"id": "T1-Q240", "topic": 1, "qnum": 240, "question": "A retail company s most critical application is its online payment processing system. The business has a requirement that the system must be able to survive a complete zonal outage while minimizing cost. You need a design solution that can handle a zonal failure. What should you do?", "options": [{"letter": "A", "text": "Deploy the application in an active-active configuration using managed instance groups (MIGs) in two different regions, fronted by a global external HTTP(S) Load Balancer and backed by a multi-regional database like Spanner."}, {"letter": "B", "text": "Deploy the application on a regional MIG to provide high availability across multiple zones in the primary region."}, {"letter": "C", "text": "Configure the regional MIG to use only Spot VMs to aggressively minimize operational costs while maintaining high availability."}, {"letter": "D", "text": "Deploy the application on Compute Engine instances across multiple regions, and rely on daily snapshots for recovery to achieve the lowest possible cost."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383603-exam-professional-cloud-architect-topic-1-question-240/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"questionZh": "一家零售公司最關鍵的應用程式是其線上付款處理系統。業務要求這套系統必須能撐過整個可用區（zone）完全中斷，同時要把成本降到最低。你需要設計一個能處理可用區故障的解決方案。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "能撐過區域(regional)失效，不只是單一可用區(zonal)失效，防護範圍遠超過題目要求的『zonal outage』。但代價是雙區域主動-主動部署、全球外部負載平衡器、跨區域複寫的 Spanner 多區域配置，成本遠高於只需應付單一可用區失效的方案，直接違反題目『minimizing cost』的要求——用治療感冒的藥方去治療重感冒，防護過剩、成本過剩。", "zh": "使用代管執行個體群組（MIGs），在兩個不同區域以主動-主動（active-active）架構部署應用程式，前端接全球外部 HTTP(S) 負載平衡器，後端資料庫使用像 Spanner 這樣的多區域資料庫。"}, {"letter": "B", "analysis": "正確：Regional MIG（區域代管執行個體群組）會把執行個體自動分散部署到同一區域內的多個可用區，當某個可用區故障時，會自動在其他健康的可用區內重建執行個體維持服務，原生具備『撐過單一可用區失效』的能力，且只需在單一區域內運作，不用額外負擔第二區域、全球負載平衡、多區域資料庫複寫的費用，剛好精準對應題目『只需撐過 zonal outage』+『minimizing cost』兩個條件，不多花也不少花。", "zh": "將應用程式部署在區域代管執行個體群組（Regional MIG）上，在主要區域內的多個可用區之間提供高可用性。"}, {"letter": "C", "analysis": "Regional MIG 的多可用區架構本身方向正確，但『只用 Spot VM』是致命缺陷：Spot VM 隨時可能被 Google 以極短通知（約 30 秒）強制回收，完全沒有可用性保證，對『公司最關鍵的線上金流處理系統』這種不能說斷就斷的應用來說，為了省錢犧牲掉核心可用性保證，是本末倒置，不符合『關鍵應用』的前提。", "zh": "將區域 MIG 設定為只使用 Spot VM，在維持高可用性的同時盡可能降低運作成本。"}, {"letter": "D", "analysis": "『每日快照』是備份/還原機制，代表故障發生後要從快照還原重建，這個過程需要時間（還原、重新開機、重新接上流量），服務會有感知得到的停機，而且最多可能遺失近一整天的交易資料——這是『故障後復原（recover）』而不是題目要求的『撐過故障當下仍可用（survive）』，對金流交易系統而言，停機和資料遺失風險都不可接受。", "zh": "將應用程式部署在跨多個區域的 Compute Engine 執行個體上，並依賴每日快照做故障復原，以達到最低成本。"}], "notes": [{"heading": "題目在問什麼", "body": "公司最關鍵的應用是線上金流交易處理系統。業務需求：系統要能撐過『單一可用區（zone）完全失效』，同時要『把成本降到最低』。注意題目問的範圍是 zonal outage（單一可用區失效），不是 regional outage（整個區域失效）——這個範圍界定是解題關鍵。"}, {"heading": "⚠️ 答案存疑：我認為應該是 B，不是存的答案 A", "body": "題目明確只要求撐過『zonal outage』並且要『minimizing cost』，Regional MIG（B）正是 GCP 官方文件對這個精確需求的標準解法：單一區域內跨多可用區自動分散與自我修復，原生撐過可用區失效，且只需單一區域的運算成本。A 選項的雙區域主動-主動+全球負載平衡+Spanner 多區域，是用來撐過『整個區域失效』的架構，防護等級遠超題目要求的範圍，而且成本顯著更高（多一個區域的運算資源、跨區域資料複寫、全球負載平衡），與題目強調的『minimizing cost』直接衝突。這題的陷阱在於 A 『聽起來』韌性更強、更像正確答案的直覺，但正確的架構設計原則是『按實際需求的範圍挑方案，不做超出需求的過度建置』，尤其當題目明講要控制成本時。沒有找到這題在 ExamTopics 原始討論頁的留言可以核對（連結回傳 404），純粹依據 GCP 架構設計原則推理，信心中高。"}, {"heading": "基礎知識：Zonal Failure vs Regional Failure，防護層級對應的成本", "body": "GCP 的容錯設計分兩個層級，對應不同的失效範圍與成本：\\n① 撐過可用區失效（zonal failure）：在『同一個區域』內跨多個可用區部署，用 Regional MIG 之類的原生機制即可達成，成本只需單一區域的運算資源。\\n② 撐過區域失效（regional failure）：需要『跨多個區域』主動部署（active-active 或 active-passive），資料庫也要跨區域複寫（例如 Spanner 多區域配置），再搭配全球負載平衡器做流量轉移，成本是前者的數倍以上。\\n解題關鍵：先看題目明確要求撐過『哪一層級』的失效，再挑對應成本的方案——需求只到可用區層級卻選了區域層級的架構，會在『cost』這個條件上失分；反過來，需求是區域層級卻只做可用區層級的防護，會在『availability/survive』這個條件上失分。"}, {"heading": "服務介紹：Regional Managed Instance Group（區域代管執行個體群組）", "body": "是什麼：MIG（Managed Instance Group）有兩種範圍——Zonal MIG（執行個體全部集中在單一可用區）與 Regional MIG（執行個體自動分散到同一區域內的多個可用區）。Regional MIG 會依設定的執行個體數量，自動在至少 2 個以上可用區之間平均分配與自我修復（autohealing），當某個可用區發生問題時，會自動在其他健康可用區內補建執行個體。\\n解決什麼問題：不用自己手動規劃『哪些執行個體放哪個可用區』，也不用自己寫故障偵測與重建邏輯，GCP 原生處理掉『單一可用區掛掉』這個最常見的故障情境，且不需要額外的跨區域資源。\\n在這題的應用：題目只要求撐過 zonal outage，Regional MIG 原生就能滿足，不需要動用到跨區域的架構，是這個需求下最精簡、最省成本的解法。\\n常見程度：非常常見，是 GCP 考試裡『只需應付可用區層級高可用性』情境的標準答案載體。"}, {"heading": "記憶重點", "body": "看到題目只提到『zonal outage / 可用區失效』，先鎖定『單一區域內跨多可用區』的方案（Regional MIG），不要被『多區域、全球負載平衡、多區域資料庫』這類『聽起來更穩』的選項誘惑——除非題目明確要求撐過『regional outage / 整個區域失效』，才需要跨區域架構。題目同時強調『minimizing cost』時，更要優先懷疑任何超出題目要求範圍的過度建置選項。另外看到『只用 Spot VM』出現在『關鍵應用/critical application』的情境裡，直接判定不合格——Spot VM 沒有可用性保證，不適合核心系統；看到『依賴每日快照做復原』，要能分辨這是『故障後復原』不是『故障當下仍可用』，不滿足『survive』的語意。"}]}, "keywords": ["survive a complete zonal outage while minimizing cost", "handle a zonal failure"], "myAnswer": "B", "tags": ["Compute Engine", "高可用性/災難復原", "成本優化", "⚠️答案存疑"]}, {"id": "T1-Q241", "topic": 1, "qnum": 241, "question": "Your company is a global financial services provider that processes and analyzes a high volume of credit card transactions in real time for fraud detection. Your analytics team must run complex batch queries on the same transaction data for daily reporting. You need to design a data processing solution that can handle both real-time and batch processing of the transaction data while minimizing operational overhead and infrastructure management. What should you do?", "options": [{"letter": "A", "text": "Use Dataprep to ingest the transactions."}, {"letter": "B", "text": "Use Dataflow to process the streaming data."}, {"letter": "C", "text": "Use a Dataproc cluster for both the streaming and batch workloads."}, {"letter": "D", "text": "Use BigQuery for the batch analytics reports."}, {"letter": "E", "text": "Use Firestore to store and analyze the transaction data."}], "answer": "BD", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383622-exam-professional-cloud-architect-topic-1-question-241/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Dataflow/Dataproc", "BigQuery", "效能調校"], "keywords": ["both real-time and batch processing of the transaction data while minimizing operational overhead"], "explanation": {"questionZh": "你的公司是一家全球性的金融服務供應商，即時處理並分析大量的信用卡交易，用於詐欺偵測。你的分析團隊必須對同一批交易資料執行複雜的批次查詢，以產出每日報表。你需要設計一套資料處理方案，能同時處理交易資料的即時和批次處理，並把維運負擔和基礎設施管理降到最低。你該怎麼做？（請選擇兩項）", "optionTable": [{"letter": "A", "analysis": "錯誤：Dataprep 是視覺化的資料清理/整理工具，用來清洗、轉換髒資料（補缺值、修格式、去重複等），解決的是資料前處理問題，不是題目要的『即時+批次雙軌處理架構』的核心骨架，角色不對。", "zh": "使用 Dataprep 來擷取交易資料。"}, {"letter": "B", "analysis": "正確：Dataflow 是全託管的串流/批次資料處理服務，完全不用自己管理伺服器或叢集，資源自動依資料量調整，負責即時串流處理這段（詐欺偵測），對應題目的即時需求與維運負擔最小化要求。", "zh": "使用 Dataflow 來處理串流資料。"}, {"letter": "C", "analysis": "錯誤：Dataproc 是託管 Hadoop/Spark 叢集服務，重點是『叢集』，代表還是要自己決定機器規格、數量、何時擴容/縮容，維運負擔明顯比 Dataflow 高，不符合題目『minimizing operational overhead』的要求。", "zh": "使用一個 Dataproc 叢集同時處理串流和批次工作負載。"}, {"letter": "D", "analysis": "正確：BigQuery 是全託管、無伺服器資料倉儲，專門用 SQL 查詢分析超大量資料，完全不用管底層運算資源，天生適合複雜批次查詢+每日報表這種分析需求，負責批次分析這段。", "zh": "使用 BigQuery 來做批次分析報表。"}, {"letter": "E", "analysis": "錯誤：Firestore 是 NoSQL 文件型資料庫，設計給應用程式的即時資料存取用（例如 App 裡的使用者資料），不是為了大量交易資料的複雜分析查詢設計的，拿它做批次分析報表效能和功能都不合適。", "zh": "使用 Firestore 來儲存並分析交易資料。"}], "notes": [{"heading": "題目在問什麼", "body": "金融服務公司要即時處理大量信用卡交易做詐欺偵測，同時分析團隊要對同一批交易資料跑複雜批次查詢做每日報表。要設計一套同時支援即時+批次處理的資料架構，還要把維運負擔和基礎設施管理降到最低。這是複選題，答案有兩個字母。"}, {"heading": "答案驗證：B+D", "body": "架構邏輯是『用對的工具做對的事』——Dataflow 負責即時那一段（串流處理信用卡交易做詐欺偵測），BigQuery 負責批次那一段（複雜 SQL 分析做報表），兩者都是全託管、無伺服器服務，完全不用自己管機器或叢集，精準對應題目『即時+批次雙需求』+『維運負擔最小化』兩個條件。信心高，各服務定位明確。"}, {"heading": "服務介紹：Dataflow", "body": "是什麼：GCP 的全託管串流/批次資料處理服務，底層基於開源的 Apache Beam，完全不用自己管理伺服器或叢集，資源會自動依照資料量調整。\n解決什麼問題：同一套程式邏輯可以同時處理即時串流跟批次資料，省去自己維護運算叢集的麻煩。\n在這題的應用：負責即時處理信用卡交易資料，做詐欺偵測，對應題目的即時需求。\n常見程度：GCP 考試中『即時資料處理/串流管線』情境的標準核心服務。"}, {"heading": "服務介紹：Dataproc", "body": "是什麼：GCP 的託管 Hadoop/Spark 叢集服務，讓你可以在 GCP 上跑熟悉的大數據生態系工具（Hadoop、Spark、Hive 等），但仍然是『叢集』型態，需要自己決定機器規格、數量、擴縮時機。\n解決什麼問題：適合『已經有現成 Hadoop/Spark 程式碼要搬上雲端』的情境，不用自己維護實體機房。\n在這題的應用：雖然也能同時處理串流和批次，但叢集管理本身就是一種維運負擔，跟題目要求的『minimizing operational overhead』衝突，是這題的誤答陷阱。\n常見程度：常跟 Dataflow 放在一起考，重點記住『Dataproc=需要管叢集，Dataflow=真正無伺服器』。"}, {"heading": "服務介紹：Dataprep", "body": "是什麼：GCP 的視覺化資料清理/準備工具，用滑鼠拖拉方式清洗、轉換資料（補缺值、修格式、去重複、偵測異常值等），產出乾淨的資料給後續分析或機器學習使用。\n解決什麼問題：省去寫程式碼做資料清理的麻煩，用視覺化介面快速處理。\n在這題的應用：題目要的是『即時+批次雙軌處理架構』，不是『資料清理』，Dataprep 角色不對應，是干擾選項。\n常見程度：資料工程流程中常見的前處理工具，但考試裡常被用來跟『核心處理引擎』（Dataflow/Dataproc）的角色混淆。"}, {"heading": "服務介紹：Firestore", "body": "是什麼：GCP 的 NoSQL 文件型資料庫，設計給應用程式存取即時、結構彈性的資料用（例如使用者資料、即時聊天訊息、App 狀態），主打低延遲的單筆/簡單查詢。\n解決什麼問題：App 開發時需要一個簡單易用、能即時同步資料的資料庫後端。\n在這題的應用：Firestore 不適合做『大量交易資料的複雜批次分析查詢』，這種分析型需求應該交給 BigQuery 這類資料倉儲，角色選錯。\n常見程度：常見的 App 後端資料庫服務，但考試裡若題目強調『複雜分析/報表』，要優先排除它，改選 BigQuery。"}]}}, {"id": "T1-Q242", "topic": 1, "qnum": 242, "question": "Your company uses a custom-built application running on a Compute Engine virtual machine (VM). This application processes real-time sales data and writes it to a zonal Persistent Disk. A recent internal audit requires that you implement a backup and recovery plan to protect against zonal failures. Your company has a strict policy that all backup data must be retained for at least 90 days and stored in a separate project with limited access. You need to implement a fully automated backup solution that meets these requirements with minimal operational overhead. What should you do?", "options": [{"letter": "A", "text": "Write a script to create daily backups of the Persistent Disk. Copy the backups to a different zone and apply a label to each snapshot to indicate the deletion date."}, {"letter": "B", "text": "Use gcloud commands to create snapshots of the Persistent Disk. Store the snapshots in a regional Cloud Storage bucket and configure a lifecycle rule to delete objects older than 90 days."}, {"letter": "C", "text": "Create a snapshot schedule to automatically create Persistent Disk snapshots and use a script to move and store them in a multi-regional Cloud Storage bucket."}, {"letter": "D", "text": "Use the Backup and Disaster Recovery (DR) service to create a backup plan. Configure the backup plan to take daily snapshots and store them in a backup vault with a 90-day retention policy."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383611-exam-professional-cloud-architect-topic-1-question-242/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "高可用性/災難復原", "合規性"], "keywords": ["protect against zonal failures", "backup data must be retained for at least 90 days and stored in a separate project with limited access", "fully automated backup solution"], "explanation": {"questionZh": "你的公司使用一個客製化打造的應用程式，跑在一台 Compute Engine 虛擬機（VM）上。這個應用程式即時處理銷售資料，並把資料寫入一個區域性（zonal）持久化磁碟（Persistent Disk）。最近一次內部稽核要求你實作一套備份與復原計畫，以防範可用區（zonal）層級的故障。你的公司有一項嚴格政策：所有備份資料都必須至少保留 90 天，並且儲存在一個存取權限受限的獨立專案中。你需要實作一套全自動化的備份方案，滿足這些要求，同時把維運負擔降到最低。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：自己手刻的腳本，要自行維護程式碼、確保準時執行、處理失敗重試。用標籤標記刪除日期只是打個標記，實際刪除還需要另一套機制去檢查並執行，不是真正自動化的保留政策，維運負擔高。", "zh": "寫一個腳本，每天建立持久化磁碟的備份。把備份複製到不同的可用區，並對每個快照套用標籤標記刪除日期。"}, {"letter": "B", "analysis": "錯誤：技術性錯誤——Persistent Disk 快照是由 Google 專屬的快照儲存機制管理，不能直接存進一般的 Cloud Storage bucket。而且要靠手動下 gcloud 指令或寫腳本觸發，不是全自動化服務。", "zh": "使用 gcloud 指令建立持久化磁碟的快照。把快照存放在一個區域性（regional）Cloud Storage bucket 中，並設定生命週期規則，刪除超過 90 天的物件。"}, {"letter": "C", "analysis": "錯誤：快照排程這部分正確，但後半段用腳本把快照搬到 Cloud Storage bucket 一樣犯了快照無法直接搬進一般 bucket 的問題，而且用腳本搬又引入手動維運負擔，也沒有提到『獨立專案+限制存取』要怎麼達成。", "zh": "建立一個快照排程，自動建立持久化磁碟的快照，並使用腳本把它們搬到並儲存在一個多區域（multi-regional）Cloud Storage bucket 中。"}, {"letter": "D", "analysis": "正確：Backup and DR Service 是 Google Cloud 專門設計的備份與災難復原服務，設定一次備份計畫就會自動照排程執行備份，備份資料存進 backup vault（備份保管庫），保管庫可設定保留政策自動強制執行，且可設在獨立的專案裡搭配獨立的存取權限控管，完全對應題目『獨立專案+限制存取』的要求，是唯一用專門託管備份服務而非自己拼湊腳本的選項。", "zh": "使用備份與災難復原（Backup and DR）服務來建立一個備份計畫。設定這個備份計畫每天建立快照，並把它們存放在一個設有 90 天保留政策的 backup vault 中。"}], "notes": [{"heading": "題目在問什麼", "body": "自建應用程式跑在 Compute Engine VM 上，即時處理銷售資料，寫入一個 zonal Persistent Disk。內部稽核要求實作備份/復原計畫，防範可用區層級故障。公司嚴格政策：所有備份資料至少保留 90 天，且要存在獨立的專案裡、限制存取權限。需要一套全自動化的備份方案，維運負擔要最小。"}, {"heading": "答案驗證：D", "body": "D 是唯一一個用『專門的託管備份服務』而不是自己拼湊腳本/快照+儲存服務的選項，Backup and DR Service 的 backup vault 原生支援保留政策自動強制執行，也能設在獨立專案搭配限制存取，完全符合『fully automated』+『minimal operational overhead』+『獨立專案限制存取』三個要求。信心高。"}, {"heading": "什麼是 Persistent Disk：zonal vs regional", "body": "Persistent Disk 是 Compute Engine VM 掛載的硬碟儲存空間。zonal（區域性/單一可用區）：資料只存在一個可用區內，該可用區故障時磁碟就不能用；regional（跨區域）：資料會同步複寫到同一地理區域內的另一個可用區，可用區故障時還能切過去。這題用的是 zonal PD，所以才需要額外做備份來應付可用區故障風險。"}, {"heading": "服務介紹：Backup and DR Service", "body": "是什麼：Google Cloud 專門設計的備份與災難復原服務，你只要設定一次『備份計畫（backup plan）』，它就會自動照排程執行備份（例如每日），備份資料存進『backup vault（備份保管庫）』。\n解決什麼問題：省去自己寫腳本、自己管理快照搬移、自己實作保留政策刪除邏輯的麻煩，保管庫本身可以設定保留政策自動強制執行，到期前即使有人手滑也無法提前刪除。\n在這題的應用：backup vault 可以設在獨立的專案裡、搭配獨立的存取權限控管，天然對應題目『獨立專案+限制存取』的要求，是全自動化+低維運負擔的標準解法。\n常見程度：GCP 考試中『嚴格保留政策+隔離儲存+全自動化備份』組合情境的標準正解機制。"}, {"heading": "記憶重點", "body": "看到『fully automated 備份 + 嚴格的保留政策（retention）+ 要隔離在獨立專案/限制存取』這種組合要求，優先想到 Backup and DR Service（有專屬的 backup vault 機制），而不是自己用快照+腳本+Cloud Storage 拼湊——手動腳本/排程快照 + 自己管生命週期，維運負擔永遠比不上專門的託管服務。另外要記住：Persistent Disk 快照不能直接丟進一般 Cloud Storage bucket，這是這題裡 B、C 選項的技術陷阱。"}]}}, {"id": "T1-Q243", "topic": 1, "qnum": 243, "question": "Your ecommerce web application includes many products with pictures and videos. You need to improve the application's page load speed and reduce the latency for customer requests. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Deploy your application to Cloud Run and enable concurrency."}, {"letter": "B", "text": "Use Memorystore tor Redis."}, {"letter": "C", "text": "Implement CDN with the application's external HTTPS load balancer."}, {"letter": "D", "text": "Change the database from Bigtable to Spanner."}, {"letter": "E", "text": "Deploy your application to a GKE Autopilot cluster instead of a regular GKE cluster."}], "answer": "BC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383619-exam-professional-cloud-architect-topic-1-question-243/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Load Balancing", "Cloud CDN", "效能調校"], "keywords": ["improve the application's page load speed and reduce the latency for customer requests"], "explanation": {"questionZh": "你的電商網站應用程式裡有很多商品，附帶圖片和影片。你需要改善應用程式的網頁載入速度，並降低客戶請求的延遲。你該怎麼做？（請選擇兩項）", "optionTable": [{"letter": "A", "analysis": "錯誤：Cloud Run 的 concurrency（並行數）設定的是一個容器執行個體同時能處理幾個請求，調整這個數字影響的是運算資源的使用效率和擴縮行為，跟『圖片/影片載入速度』『降低客戶端感受到的延遲』沒有直接關係——它優化的是後端運算效率，不是內容傳輸速度。", "zh": "把應用程式部署到 Cloud Run 並啟用並行處理（concurrency）。"}, {"letter": "B", "analysis": "正確：Memorystore for Redis 是全託管記憶體內快取服務，把常被查詢、但不常變動的資料（例如商品資訊）先暫存在記憶體裡，下次查詢直接從記憶體讀取，不用每次都重新查資料庫，大幅降低動態資料查詢這部分的延遲。", "zh": "使用 Memorystore for Redis。"}, {"letter": "C", "analysis": "正確：CDN（內容傳遞網路）把靜態內容（圖片、影片等）複製一份存到全球各地離使用者更近的邊緣節點，使用者請求時直接從最近的節點拿，不用從原始伺服器所在地傳過去，對『頁面有大量圖片和影片』的電商網站是最直接對症下藥的做法，可以直接整合在外部 HTTPS 負載平衡器上啟用。", "zh": "在應用程式的外部 HTTPS 負載平衡器上實作 CDN。"}, {"letter": "D", "analysis": "錯誤：Bigtable 是 NoSQL 寬欄式資料庫，Spanner 是全球分散式的關聯式資料庫，換資料庫是個大工程（資料遷移、應用程式邏輯都要改），而且題目的核心痛點是圖片/影片這類靜態內容的載入速度，換資料庫引擎並不會讓圖片傳輸變快，答非所問。", "zh": "把資料庫從 Bigtable 換成 Spanner。"}, {"letter": "E", "analysis": "錯誤：Autopilot 模式是 Google 幫你全自動管理底層節點，主要降低的是維運負擔，不是使用者端感受到的網路延遲/載入速度，兩者是不同維度的優化目標。", "zh": "把應用程式部署到 GKE Autopilot 叢集，而不是一般的 GKE 叢集。"}], "notes": [{"heading": "題目在問什麼", "body": "電商網站有很多商品，商品頁有大量圖片和影片。要改善網頁載入速度，降低客戶請求的延遲。這是複選題，答案有兩個字母。"}, {"heading": "答案驗證：B+C", "body": "要優化的『頁面載入速度』分兩塊——靜態內容（圖片/影片）的傳輸速度，用 CDN 解決（讓內容離使用者更近）；動態資料的查詢速度（例如商品詳情、庫存資訊這類要即時從資料庫撈的資料），用 Memorystore/Redis 快取解決（避免每次都查資料庫）。兩者加起來涵蓋電商網站載入慢的兩大常見原因，完全對應題目要求。信心高，各服務定位明確。"}, {"heading": "服務介紹：Cloud CDN", "body": "是什麼：GCP 的內容傳遞網路服務，把靜態內容（圖片、影片、CSS/JS 等）複製一份存到全球各地離使用者更近的邊緣節點（edge location），可以直接整合在外部 HTTPS 負載平衡器上啟用。\n解決什麼問題：使用者請求圖片/影片時，直接從離他最近的節點拿，不用千里迢迢從原本的伺服器所在地傳過去，大幅降低靜態內容的傳輸延遲。\n在這題的應用：題目強調『頁面有大量圖片和影片』，CDN 是對症下藥的直接解法。\n常見程度：非常常見，是『電商/媒體網站載入速度優化』情境的標準核心服務之一。"}, {"heading": "服務介紹：Memorystore for Redis", "body": "是什麼：GCP 的全託管記憶體內快取服務，背後用開源的 Redis（一種超快速的記憶體資料庫）。\n解決什麼問題：把常被查詢、但不常變動的資料（例如商品資訊、使用者 Session）先暫存在記憶體裡，下次有人要同樣的資料時直接從記憶體讀（微秒等級），不用每次都去資料庫重新查詢（通常要幾十毫秒甚至更久），大幅降低動態資料查詢的延遲。\n在這題的應用：搭配 CDN 處理靜態內容，Memorystore 負責加速動態資料查詢這一塊，兩者互補。\n常見程度：常見的快取層服務，常跟 CDN 搭配出現在效能優化情境。"}, {"heading": "延伸討論：Cloud Run 部署真的比較快嗎？冷啟動 vs 熱啟動", "body": "不一定——這題選項 A（Cloud Run + concurrency）錯不是因為 Cloud Run 比 GKE 慢，而是因為運算平台選擇（Cloud Run vs GKE）跟這題的根本瓶頸（大量圖片影片的傳輸延遲）無關。\n冷啟動（Cold Start）：服務目前沒有任何執行個體待命，新請求進來時系統要從頭建立執行環境（配置資源、啟動容器、跑初始化程式碼），可能耗費數百毫秒到數秒，使用者會感受到這段額外延遲。\n熱啟動（Warm Start）：已經有執行個體開著待命，新請求直接重複使用現成、已初始化好的環境，跳過建立步驟，速度快很多（幾毫秒到幾十毫秒）。\n關鍵：Cloud Run 預設把沒流量的服務縮到 0 個執行個體（省錢但下一個請求必觸發冷啟動），GKE 如果維持常駐 Pod（設定 minReplicas）則不會有這個問題，但要自己承擔維護這些常駐資源的成本與維運負擔。所以兩者各有取捨，不能單純說『Cloud Run 一定比較快』。\n更重要的是：不管應用程式邏輯放在 Cloud Run 還是 GKE，圖片/影片檔案的傳輸路徑都沒有改變——使用者還是要從原始伺服器/儲存位置下載這些大檔案，運算平台的選擇解決不了這個問題，只有 CDN（讓內容物理上更靠近使用者）才能真正解決。"}]}}, {"id": "T1-Q244", "topic": 1, "qnum": 244, "question": "You need to build and deploy a containerized web application to Google Cloud. The application is very write-heavy and requires a relational database as its data store. The application needs to be highly available in multiple cloud regions. You want to minimize operational overhead while following Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Deploy the application to GKE clusters in multiple regions and expose the application endpoint with a regional load balancer. Use Cloud SQL as the database."}, {"letter": "B", "text": "Deploy the application to Cloud Run in multiple regions behind a global HTTPS load balancer. Use Spanner as the database."}, {"letter": "C", "text": "Deploy the application to a GKE standard cluster behind a global HTTPS load balancer. Use Firestore as the database with multi-region locations enabled."}, {"letter": "D", "text": "Deploy the application to a GKE standard cluster with a global ingress to expose the application endpoint. Use Bigtable as the database."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383607-exam-professional-cloud-architect-topic-1-question-244/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Run/Cloud Functions", "Cloud Spanner", "高可用性/災難復原", "多區域架構"], "keywords": ["very write-heavy and requires a relational database", "highly available in multiple cloud regions"], "explanation": {"questionZh": "你需要把一個容器化的網頁應用程式建置並部署到 Google Cloud。這個應用程式寫入量很大，需要一個關聯式資料庫作為資料儲存。這個應用程式必須在多個雲端區域都具備高可用性。你想要在遵循 Google 建議做法的前提下，把維運負擔降到最低。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Regional load balancer 只能把流量分配給同一個區域內的後端，無法把跨多區域的 GKE 叢集串成一個整體對外服務；Cloud SQL 的寫入實例只能在一個區域，該區域掛了寫入就斷了，不符合『多區域高可用』的要求。", "zh": "把應用程式部署到跨多個區域的 GKE 叢集，用區域型負載平衡器公開應用程式端點。資料庫使用 Cloud SQL。"}, {"letter": "B", "analysis": "正確：Cloud Run 是無伺服器容器服務，跨多區域部署簡單、維運負擔低；Global HTTPS Load Balancer 能把全球使用者流量導向最近、健康的區域；Spanner 是全球分散式關聯式資料庫，寫入可跨區域擴展且維持強一致性，三者加起來精準對應『關聯式+寫入量大+多區域高可用+低維運負擔』。", "zh": "把應用程式部署到跨多個區域的 Cloud Run，前面掛一個全域 HTTPS 負載平衡器。資料庫使用 Spanner。"}, {"letter": "C", "analysis": "錯誤：Firestore 是 NoSQL 文件型資料庫，不符合題目明確要求的『relational database』；而且只部署了單一 GKE 叢集（不是跨多區域部署），應用程式運算層依然是單點。", "zh": "把應用程式部署到一個 GKE standard 叢集，前面掛一個全域 HTTPS 負載平衡器。資料庫使用啟用多區域位置的 Firestore。"}, {"letter": "D", "analysis": "錯誤：Bigtable 是 NoSQL 寬欄式資料庫，不是關聯式資料庫，不符合要求；同樣只部署了單一 GKE 叢集，沒有做到多區域部署。", "zh": "把應用程式部署到一個 GKE standard 叢集，用全域 ingress 公開應用程式端點。資料庫使用 Bigtable。"}], "notes": [{"heading": "題目在問什麼", "body": "要把一個容器化網頁應用程式部署到 GCP。應用程式寫入量很大，需要關聯式資料庫。應用程式必須在多個雲端區域都有高可用性。要遵循 Google 建議做法，同時把維運負擔降到最低。"}, {"heading": "答案驗證：B", "body": "三個條件同時滿足的組合：『關聯式』排除 Firestore/Bigtable（C、D 淘汰）；『寫入量大+多區域高可用』排除 Cloud SQL（A 淘汰，Cloud SQL 寫入實例只能在一個區域）；剩下 B 用 Spanner（唯一真正做到全球分散、關聯式、高寫入吞吐三者兼具的 GCP 資料庫）搭配 Cloud Run+Global LB（低維運負擔的多區域部署組合）。信心高，邏輯清楚。"}, {"heading": "GCP 資料庫總覽", "body": "Cloud SQL：關聯式（MySQL/PostgreSQL/SQL Server），單一區域為主，可加跨區域唯讀複本做備援，但寫入永遠在一個區域，適合中小型傳統應用。\nAlloyDB：PostgreSQL 相容的強化版關聯式資料庫，效能比 Cloud SQL 更強，同樣單一區域為主。\nSpanner：關聯式+全球分散式，可跨多區域水平擴展、強一致性、寫入也能分散擴展，代價是貴，適合真的需要全球級關聯式資料庫的場景。\nFirestore：NoSQL 文件型，存 JSON 文件這類彈性結構資料，常見於 App 後端，有 multi-region 選項。\nBigtable：NoSQL 寬欄式，巨量資料、超高吞吐寫入、低延遲查詢，常見於時間序列/IoT/分析用途，不支援 SQL。\nMemorystore：記憶體內快取（Redis/Memcached），不是主要資料儲存，是加在資料庫前面的快取層。\nBigQuery：分析型資料倉儲（OLAP），用 SQL 對超大量歷史資料做分析/報表，不是用來處理即時交易（OLTP）。\n分類邏輯：要處理即時交易/寫入（OLTP）→ Cloud SQL/AlloyDB/Spanner（關聯式）或 Firestore/Bigtable（NoSQL，看資料形狀）；要做大量歷史資料分析（OLAP）→ BigQuery；要加速重複查詢 → Memorystore 當快取層。"}, {"heading": "基礎知識：Regional Load Balancer vs Global HTTPS Load Balancer", "body": "Regional external load balancer：只能把流量分配給同一個區域內的後端服務，視野侷限在那一個區域，看不到也管不到其他區域的後端。\nGlobal external HTTPS load balancer：用 Google 的全球骨幹網路（anycast IP，使用者連到一個全球共用的入口 IP，Google 網路內部再把請求導到離使用者最近、且健康的那個區域），視野橫跨所有部署的區域，可以做到自動選最近的、自動故障轉移到其他區域。\n關鍵：只要應用程式要跨多個區域提供服務（不是只在一個區域內做高可用），就必須用 Global HTTPS LB，Regional LB 做不到這件事。"}, {"heading": "基礎知識：GKE 的 Node / Cluster / 跨區域部署", "body": "Node（節點）：一台實際在跑容器的虛擬機（VM），本質上就是一台 Compute Engine 執行個體。\nCluster（叢集）：一群 Node 加上管理它們的控制層（control plane），合起來稱為一個叢集——一個叢集本來就是由多台機器組成的，這不是『單一 vs 叢集』的差異。\n真正的差異在叢集的部署範圍：Zonal cluster（單一可用區叢集）所有 Node 集中在同一可用區；Regional cluster（區域型叢集）Node 自動分散到同一區域內的多個可用區，但範圍仍侷限在同一區域。\n關鍵重點：GKE 沒有『一個叢集橫跨多個區域』這種東西，不管 zonal 還是 regional cluster，一個 GKE 叢集物件永遠只存在於一個區域裡。所以要讓應用程式在多個區域都能跑，必須在每個區域各自建立一個獨立的 GKE 叢集（複數 clusters），再用某種機制（例如 Global HTTPS LB 或 Multi-cluster Gateway）把這些分散的獨立叢集串起來對外提供統一服務。Q244 選項 C、D 說的是『a GKE standard cluster』（單數），意思是只建了一個叢集、只在一個區域，不滿足『多個雲端區域都要高可用』的要求。"}]}}, {"id": "T1-Q245", "topic": 1, "qnum": 245, "question": "Your machine learning (ML) engineers use self-hosted Jupyter notebooks for tasks such as data preparation, model training, and fine-tuning. The operations team then deploys these models in various environments. You want to provide maximum flexibility for ML engineers, promote collaboration with a common toolset, and leverage Google Cloud's scalability, while following Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Use AutoML for machine learning and Cloud Deploy for model deployment."}, {"letter": "B", "text": "Use Colab Enterprise for machine learning and DevOps for model deployment."}, {"letter": "C", "text": "Use Vertex AI for machine learning and machine learning operations (MLOps) for model deployment."}, {"letter": "D", "text": "Use TensorFlow for machine learning and Cloud Deploy for model deployment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383623-exam-professional-cloud-architect-topic-1-question-245/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Vertex AI/AI-ML", "CI/CD"], "keywords": ["provide maximum flexibility for ML engineers, promote collaboration with a common toolset"], "explanation": {"questionZh": "你的機器學習（ML）工程師使用自架的 Jupyter notebook 來進行資料準備、模型訓練、微調等工作。接著由維運團隊把這些模型部署到不同的環境。你想要在遵循 Google 建議做法的前提下，給 ML 工程師最大的彈性，用共同工具組促進協作，並善用 Google Cloud 的可擴展性。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：AutoML 是自動化機器學習服務，丟資料進去自動選模型架構、調參數、訓練，幾乎不用寫程式。題目要求給工程師最大彈性，但 AutoML 本質是黑盒子自動化工具，犧牲的正是彈性和控制權，跟需求方向相反。", "zh": "使用 AutoML 做機器學習，用 Cloud Deploy 做模型部署。"}, {"letter": "B", "analysis": "錯誤：Colab Enterprise 提供協作式 notebook 環境方向正確，但『DevOps』是一種開發文化/實踐方法論，不是具體的 GCP 服務或工具，用抽象概念回答『該用什麼服務部署模型』沒有給出具體答案。", "zh": "使用 Colab Enterprise 做機器學習，用 DevOps 做模型部署。"}, {"letter": "C", "analysis": "正確：Vertex AI 是整合式機器學習平台，涵蓋資料準備、訓練（含協作式 notebook）、微調、部署、監控的完整生命週期，天然滿足最大彈性+協作+可擴展性；MLOps 是機器學習版的 DevOps，Vertex AI 平台本身內建實踐 MLOps 的工具鏈，是 Google 官方推薦的端到端 ML 工作流程標準做法。", "zh": "使用 Vertex AI 做機器學習，用機器學習維運（MLOps）做模型部署。"}, {"letter": "D", "analysis": "錯誤：TensorFlow 只是機器學習程式庫/框架，不是平台或服務，本身不提供協作環境、可擴展運算基礎設施、模型部署管理，沒有回應題目『善用 GCP 可擴展性』『共同工具組協作』這兩個訴求。", "zh": "使用 TensorFlow 做機器學習，用 Cloud Deploy 做模型部署。"}], "notes": [{"heading": "題目在問什麼", "body": "ML 工程師用自架的 Jupyter notebook 做資料準備、模型訓練、微調，維運團隊再把模型部署到不同環境。要給 ML 工程師最大彈性、用共同工具組促進團隊協作、善用 GCP 可擴展性，同時遵循 Google 建議做法。"}, {"heading": "答案驗證：C", "body": "看到題目同時提到『ML 工程師需要彈性』+『團隊協作』+『GCP 可擴展性』+『Google 建議做法』這種全方位平台型需求，優先想到 Vertex AI（整合平台）搭配 MLOps（部署方法論/工具鏈），而不是單點工具（AutoML 太自動化沒彈性、TensorFlow 只是函式庫、DevOps 太抽象不是具體服務）。信心高。"}, {"heading": "什麼是 AutoML", "body": "是什麼：Google 的自動化機器學習服務，使用者只要提供資料，系統會自動嘗試不同的模型架構、自動調整參數、自動訓練出一個模型，幾乎不需要自己寫訓練程式碼。\n解決什麼問題：讓沒有深厚 ML 背景的人也能做出堪用的模型。\n在這題的應用：犧牲了彈性和控制權（工程師無法客製化訓練細節），跟題目要求的『最大彈性』相反，是誤答陷阱。\n常見程度：常見的入門/快速原型工具，但考試中若強調『工程師需要彈性/客製化』，通常要排除它。"}, {"heading": "什麼是 Colab Enterprise", "body": "是什麼：Google 把大家熟悉的 Colab（協作式 Jupyter Notebook 環境）做成企業級、並與 Vertex AI 整合的版本，提供團隊共用、可控管權限的筆記本開發環境。\n解決什麼問題：讓團隊在企業環境下也能用熟悉的 Colab 介面協作開發 ML 專案。\n在這題的應用：方向正確（協作+彈性），但這題選項搭配的『DevOps』不是具體部署工具，整體選項不夠具體完整。\n常見程度：近年 GCP 主推的協作開發環境之一，常跟 Vertex AI Workbench 放在一起比較。"}, {"heading": "什麼是 MLOps（機器學習維運）", "body": "是什麼：機器學習版本的 DevOps，專門處理『如何把訓練好的模型持續、可靠地部署上線、監控、重新訓練』的一套方法論與工具鏈，涵蓋持續訓練（continuous training）、持續部署（continuous deployment）、模型監控（像 Q234 的 Model Monitoring）等環節。\n解決什麼問題：避免模型訓練完就丟著不管、上線後沒人追蹤表現、要更新模型時流程混亂的問題。\n在這題的應用：Vertex AI 平台本身就內建了實踐 MLOps 的工具鏈，是 Google 官方推薦的端到端 ML 工作流程標準做法。\n常見程度：MLOps 主題的核心概念，常出現在『模型從訓練到上線的完整流程』情境題。"}]}}, {"id": "T1-Q246", "topic": 1, "qnum": 246, "question": "Your employer is a financial services company that recently acquired a popular fintech startup. The startup's core application is a monolithic Python application running on a managed instance group of Compute Engine virtual machines with a single, large PostgreSQL database. Your development team struggles with slow deployment cycles, and the monolithic design of the startup's core application makes it difficult to integrate new. ML-powered fraud detection models. You need a long-term strategy that improves developer agility and positions the company to leverage Google Cloud's advanced data and AI capabilities for future innovations. What should you do?", "options": [{"letter": "A", "text": "Deploy the ML fraud detection model to a Vertex AI endpoint. Create a REST API for the model and modify the monolithic Python application to call this endpoint for real-time fraud analysis."}, {"letter": "B", "text": "Containerize the application, deploy it to Google Kubernetes Engine (GKE), and migrate the PostgreSQL database to Cloud SQL for PostgreSQL."}, {"letter": "C", "text": "Propose a phased, event-driven migration to a microservices architecture. Use Pub/Sub for asynchronous communication and deploy the fraud models on Vertex AI endpoints."}, {"letter": "D", "text": "Migrate the PostgreSQL database to Cloud SQL for PostgreSQL. Replicate the data into BigQuery using Datastream, and then train and deploy the fraud detection models directly within BigQuery using BigQuery ML."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383627-exam-professional-cloud-architect-topic-1-question-246/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["容器化", "CI/CD", "Pub/Sub", "Vertex AI/AI-ML"], "keywords": ["slow deployment cycles", "long-term strategy that improves developer agility and positions the company to leverage Google Cloud's advanced data and AI capabilities"], "explanation": {"questionZh": "你任職的金融服務公司最近收購了一家熱門的 fintech 新創公司。這家新創的核心應用程式是一個單體式（monolithic）Python 應用程式，跑在一組 Compute Engine 虛擬機的受管理執行個體群組上，搭配一個單一、巨大的 PostgreSQL 資料庫。你的開發團隊深受部署週期緩慢所苦，而且這家新創核心應用程式的單體式設計，讓整合新的 ML 詐欺偵測模型變得困難。你需要一套長期策略，既能改善開發人員的敏捷度，又能讓公司未來善用 Google Cloud 進階的資料和 AI 能力。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：這只是在原封不動的單體架構上，額外掛一個呼叫外部 API 的功能。確實能把 ML 詐欺偵測接進來，但完全沒解決題目說的『部署週期慢』『單體架構難以持續演進』這個核心長期問題，只是治標的戰術性小修補，不是長期策略。", "zh": "把 ML 詐欺偵測模型部署到 Vertex AI endpoint。為這個模型建立一個 REST API，並修改單體式 Python 應用程式，讓它呼叫這個端點做即時詐欺分析。"}, {"letter": "B", "analysis": "錯誤：把同一包單體程式碼包進容器、搬去跑在 Kubernetes 上，資料庫也換個託管方式，本質上是原封不動地搬家+容器化，應用程式的架構本身完全沒變，還是同一包耦合在一起的大程式，沒有真正改善開發敏捷度，也沒有讓整合新 ML 功能變得比較容易。", "zh": "把應用程式容器化，部署到 Google Kubernetes Engine（GKE），並把 PostgreSQL 資料庫遷移到 Cloud SQL for PostgreSQL。"}, {"letter": "C", "analysis": "正確：分階段遷移到微服務架構，從根本解決部署週期慢的問題（各服務可獨立部署）；用 Pub/Sub 做事件驅動的服務間溝通，讓各微服務鬆耦合；詐欺偵測模型直接做成獨立的微服務部署在 Vertex AI endpoint 上，之後要加其他 ML 功能也能比照辦理。強調『分階段』承認一次重寫風險太高，採用漸進式遷移，完整對應長期策略+開發敏捷度+善用 GCP 進階資料/AI 能力三個要求。", "zh": "提出一套分階段、事件驅動的微服務架構遷移方案。使用 Pub/Sub 做非同步通訊，並把詐欺偵測模型部署在 Vertex AI endpoints 上。"}, {"letter": "D", "analysis": "錯誤：確實碰到了『善用 GCP 進階資料/AI 能力』這一半（用 BigQuery ML 直接在 BigQuery 裡訓練模型），但完全沒有觸碰到應用程式本身的單體架構問題——程式碼還是那包單體，部署週期還是一樣慢，沒有解決『開發敏捷度』這另一半的核心要求。", "zh": "把 PostgreSQL 資料庫遷移到 Cloud SQL for PostgreSQL。使用 Datastream 把資料複寫到 BigQuery，接著直接在 BigQuery 裡用 BigQuery ML 訓練並部署詐欺偵測模型。"}], "notes": [{"heading": "題目在問什麼", "body": "金融服務公司收購的 fintech 新創，核心應用程式是單體式 Python 應用程式，跑在 Compute Engine MIG 上，搭配單一巨大的 PostgreSQL 資料庫。開發團隊部署週期慢，單體架構讓整合新的 ML 詐欺偵測模型變困難。需要長期策略，既改善開發敏捷度，又讓公司未來能善用 GCP 進階資料/AI 能力。"}, {"heading": "答案驗證：C", "body": "題目同時出現『單體架構拖慢開發 + 要長期策略 + 要能持續整合新的 AI/ML 能力』這種雙重訴求，正解方向是微服務化+事件驅動解耦（Pub/Sub）+把 ML 模型做成獨立服務（Vertex AI endpoint）。單純換個地方部署（B）或單點補丁式整合 ML（A）或只處理資料/AI 這一半（D）都只解決了問題的一半，不是真正的長期架構策略。信心高。"}, {"heading": "什麼是 Monolithic（單體式）架構 vs Microservices（微服務）架構", "body": "單體式：整個應用程式的所有功能全部寫在同一包程式碼裡，打包成一個整體部署。改一個小功能往往要重新測試、重新部署整包程式，牽一髮動全身——這是部署週期慢、難以整合新功能的根本原因。\n微服務：把應用程式拆成多個獨立的小服務（例如交易服務、使用者服務、詐欺偵測服務各自獨立），各自獨立開發、部署、擴展。改其中一個服務不用重新部署其他服務，大幅加快迭代速度，也讓加入全新的 ML 服務變得容易，不用動到原本那包龐大的程式碼。\n在這題的應用：題目描述的痛點（部署慢、難整合新 ML 功能）正是單體架構的典型症狀，答案 C 對症下藥地提出微服務化遷移。"}, {"heading": "什麼是 Strangler Fig Pattern（絞殺榕模式）/ 分階段遷移", "body": "是什麼：一種把舊系統現代化的漸進式遷移策略，概念來自絞殺榕這種植物——新的藤蔓逐漸纏繞包覆住舊樹，慢慢取代它的功能，而不是把舊樹直接砍掉重種。實務上就是：新功能/新服務用微服務架構逐步建立，舊的單體系統功能被一點一點拆出去，最終舊系統完全被新架構取代。\n解決什麼問題：避免『一次性重寫整個系統』的高風險（容易中途失敗、長期沒有產出、業務無法忍受長時間凍結開發），改成邊運作邊逐步替換。\n在這題的應用：C 選項強調『phased（分階段）』正是這個模式的體現，也是業界處理大型單體系統現代化的務實共識做法。\n常見程度：軟體架構遷移的經典概念，GCP 考試裡『單體轉微服務』情境常考的核心策略詞彙。"}, {"heading": "服務介紹：Datastream", "body": "是什麼：GCP 的變更資料擷取（CDC, Change Data Capture）服務，能即時監控來源資料庫（例如 PostgreSQL、MySQL）的資料異動，並把這些異動即時同步複製到目的地（例如 BigQuery）。\n解決什麼問題：不用自己寫程式定期批次匯出/匯入資料，異動幾乎即時反映到分析端。\n在這題的應用：D 選項用它把交易資料同步到 BigQuery 做分析/訓練模型，技術上可行，但沒有解決題目真正要求的『應用程式架構敏捷度』問題。\n常見程度：常見的資料庫到資料倉儲的即時同步工具，常與 BigQuery ML 搭配出現在『既有資料庫資料要拿去做分析/訓練』的情境。"}]}}, {"id": "T1-Q250", "topic": 1, "qnum": 250, "question": "Your company has hired an external auditing firm to perform a compliance audit. Your company’s governance policy requires that external auditors be managed in a single Google Group that is granted temporary, read-only access to a Cloud Storage bucket named audit-evidence-bucket. Access must be traceable to the individual auditor's identity and be active only for the duration of the audit engagement, which runs the entire month of October. You need a secure access control strategy that avoids administrative overhead and complies with your company's governance policy. What should you do?", "options": [{"letter": "A", "text": "Apply an IAM policy binding that grants the roles/storage.objectViewer role to the Google Group. Configure this binding with a time-based IAM Condition that automatically grants access from October 1 to November 1."}, {"letter": "B", "text": "Create a service account, and grant it the roles/storage.objectViewer role on the bucket. Generate and share Signed URLs for each object in the bucket with an expiration date of November 1."}, {"letter": "C", "text": "Use Cloud Scheduler to run a Cloud Run functions script that adds the IAM binding of roles/storage.objectViewer to the Google Group on October 1 and another that removes the IAM binding on November 1."}, {"letter": "D", "text": "Use Workforce Identity Federation to map the auditors’ group to the Google Group. Bind the roles/storage.objectViewer role to this Google Group. Configure a 1-month session duration on the provider."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383625-exam-professional-cloud-architect-topic-1-question-250/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["IAM", "安全性", "合規性"], "keywords": ["temporary, read-only access", "Access must be traceable to the individual auditor's identity", "avoids administrative overhead"], "explanation": {"questionZh": "你的公司聘請了一家外部稽核事務所來進行合規稽核。公司的治理政策要求：外部稽核員必須統一管理在單一一個 Google Group 中，並授予這個群組對一個名為 audit-evidence-bucket 的 Cloud Storage bucket 的臨時唯讀存取權。存取紀錄必須能追蹤到個別稽核員的身分，而且只能在稽核期間（整個十月）有效。你需要一套安全的存取控制策略，既要避免增加管理負擔，又要符合公司的治理政策。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：直接利用 GCP 原生內建的 IAM Condition 功能，把時間區間當作條件寫在權限綁定本身上，10 月 1 日自動生效、11 月 1 日自動失效，全程不需要任何人手動開關或寫腳本。權限授予給 Google Group，個別稽核員透過加入群組取得存取權，Cloud Audit Logs 本來就會記錄實際是哪個使用者帳號執行了存取，完全滿足追蹤個別身分的要求，是設定一次、全自動、零後續維護的做法。", "zh": "套用一條 IAM 政策綁定，把 roles/storage.objectViewer 角色授予給這個 Google Group。為這條綁定設定一個以時間為基礎的 IAM 條件，讓它自動從 10 月 1 日到 11 月 1 日生效。"}, {"letter": "B", "analysis": "錯誤：Signed URL 綁定的是網址本身，不是使用者身分，任何拿到網址的人都能在到期前存取，無法分辨到底是哪個稽核員存取的，違反『存取必須可追蹤到個別身分』的要求；而且要為 bucket 裡每一個物件個別產生網址，之後有新檔案加入還要手動再產生，管理負擔反而更高。", "zh": "建立一個服務帳戶，並在 bucket 上授予它 roles/storage.objectViewer 角色。為 bucket 裡的每個物件產生並分享簽署網址（Signed URL），到期日設為 11 月 1 日。"}, {"letter": "C", "analysis": "錯誤：這個方法能做到定時生效/失效，但做法是自己額外架設排程服務+自己寫腳本程式+自己處理失敗重試/監控，這些都是題目明確要避免的管理負擔。能用 GCP 原生的 IAM Condition 一行設定搞定的事，這裡卻要多維護兩段自訂程式碼和排程任務，是多此一舉。", "zh": "使用 Cloud Scheduler 執行一個 Cloud Run functions 腳本，在 10 月 1 日把 roles/storage.objectViewer 的 IAM 綁定加到這個 Google Group，另一個腳本在 11 月 1 日移除這條綁定。"}, {"letter": "D", "analysis": "錯誤：Workforce Identity Federation 是讓組織外部、沒有 Google 帳號的人員透過聯合驗證存取 GCP 資源的機制，通常是給大量、長期的外部人力用的身分整合方案，為了一次性、一個月的稽核任務去架設一整套聯合身分驗證系統，設定成本過高。而且『session duration（工作階段時長）』控制的是單次登入後多久需要重新驗證，不是『整個十月都能存取、十一月就完全失效』這種明確的存取時間窗口，概念上不完全對應需求。", "zh": "使用 Workforce Identity Federation，把稽核員的群組對應到這個 Google Group。把 roles/storage.objectViewer 角色綁定到這個 Google Group。在身分提供者上設定一個月的工作階段（session）時長。"}], "notes": [{"heading": "題目在問什麼", "body": "公司請外部稽核事務所做合規稽核，要求外部稽核員統一管理在單一 Google Group 裡，授予這個群組對特定 bucket 的臨時唯讀存取權，存取需可追蹤到個別身分，只在整個十月生效，要避免增加管理負擔。"}, {"heading": "答案驗證：A", "body": "看到『存取權限需要有明確的開始/結束時間點 + 要盡量減少人工介入/管理負擔』，優先想到 IAM Condition（原生內建、設定一次自動生效失效），而不是自己額外寫腳本、架排程服務；看到『要追蹤到個別使用者身分』，要排除 Signed URL 這類認網址不認人的授權方式。信心高，邏輯清楚。"}, {"heading": "服務介紹：IAM Condition（IAM 條件）", "body": "是什麼：GCP IAM 權限綁定上可以附加的額外條件，讓一個權限授予不是無條件生效，而是只在符合特定條件時才生效（例如只在某個日期區間內、只在請求來自某個 IP）。這是 GCP 原生內建的功能，不需要額外寫程式、架服務去實現定時生效/失效。\n解決什麼問題：避免為了「暫時性/有時效性」的權限需求，自己額外寫自動化腳本去開關權限，降低管理負擔跟出錯風險。\n在這題的應用：把稽核期間（10/1~11/1）直接設定成時間條件綁在 IAM 政策上，自動生效自動失效，完全不用人工介入。\n常見程度：GCP 考試中『臨時性存取權限 + 避免管理負擔』情境的標準正解機制。"}, {"heading": "什麼是 Signed URL（簽署網址）", "body": "是什麼：一種帶有時效性、有授權簽章的特殊網址，任何人拿到這個網址都能在到期前直接存取該物件，不需要額外登入或驗證身分。\n解決什麼問題：想讓沒有 Google 帳號的外部人士，臨時存取某個特定檔案時使用。\n在這題的應用：它綁定的是『網址本身』，不是『使用者身分』，如果網址被轉傳或外洩，無法分辨到底是誰在存取，違反題目『可追蹤到個別身分』的要求，是這題的誤答陷阱。\n常見程度：常見的臨時檔案分享機制，但要記住它的授權對象是『持有網址的任何人』，不是『特定身分』。"}, {"heading": "服務介紹：Workforce Identity Federation", "body": "是什麼：讓組織外部、沒有 Google 帳號的人員（例如用公司自己的企業身分系統登入），不用額外建立 Google 帳號/服務帳戶，直接透過聯合驗證的方式存取 GCP 資源的機制。\n解決什麼問題：適合『大量、長期』需要存取 GCP 資源的外部人力，一次性整合企業既有的身分系統，不用幫每個人建立 Google 帳號。\n在這題的應用：為了一次性、一個月的稽核任務去架設一整套聯合身分驗證系統，設定成本過高，而且 session duration 控制的是單次登入的有效期，跟『特定日曆月份內的存取時間窗口』是不同的概念，過度複雜也不夠精準對應需求。\n常見程度：企業級混合身分整合情境的標準服務，但要分清楚它適合的場景是『長期、大量外部使用者』，不是『短期、小範圍的臨時存取』。"}]}}, {"id": "T1-Q251", "topic": 1, "qnum": 251, "question": "You are using a GitHub repository for your application’s source code. You want to set up an efficient and secure continuous deployment process to automatically build and deploy the application to Cloud Run whenever a pull request is merged. What should you do?", "options": [{"letter": "A", "text": "Create a GitHub webhook trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build a container image and save it in Artifact Registry. Use Config Sync to deploy the application to Cloud Run."}, {"letter": "B", "text": "Create a workflow using GitHub Actions to build and deploy the application to Cloud Run once a pull request is merged. The workflow will use a service account key checked in with your source code for deployment permission."}, {"letter": "C", "text": "Create a GitHub Enterprise trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build and deploy the application to Cloud Run. Save the deployment credential to Secret Manager."}, {"letter": "D", "text": "Connect your repository using the Cloud Build GitHub app. Create a trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build and deploy the application to Cloud Run."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383602-exam-professional-cloud-architect-topic-1-question-251/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Run/Cloud Functions", "CI/CD"], "keywords": ["efficient and secure continuous deployment process"], "explanation": {"questionZh": "你正在使用一個 GitHub repository 存放你應用程式的原始碼。你想要建立一套高效且安全的持續部署流程，在每次 pull request 被合併時，自動把應用程式建置並部署到 Cloud Run。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Config Sync 是 Anthos Config Management 底下的工具，設計用途是把 Git 裡定義好的 Kubernetes 設定檔持續同步到 GKE 叢集（一種管理 Kubernetes 資源狀態的 GitOps 做法），它不是用來部署到 Cloud Run 的工具，Cloud Run 不是 Kubernetes 叢集，工具選擇本身就錯了；手動設定 GitHub webhook 也比原生整合多一層手動設定的麻煩。", "zh": "在 Cloud Build 中建立一個 GitHub webhook trigger。一旦 pull request 被合併，觸發 Cloud Build 建置容器映像檔並存到 Artifact Registry。使用 Config Sync 把應用程式部署到 Cloud Run。"}, {"letter": "B", "analysis": "錯誤：致命問題在於把服務帳戶金鑰直接存進原始碼倉庫裡，這是嚴重的安全反模式——金鑰一旦提交進 Git 就永久留在版本歷史裡，容易因倉庫權限設定不當而外洩，長效靜態金鑰也難以輪替、難以追蹤使用者，直接違反題目要求的『安全』部署流程。", "zh": "使用 GitHub Actions 建立一個工作流程，在 pull request 被合併時建置並部署應用程式到 Cloud Run。這個工作流程會使用一組和原始碼一起提交（checked in）的服務帳戶金鑰來取得部署權限。"}, {"letter": "C", "analysis": "錯誤：GitHub Enterprise 是 GitHub 的企業付費版本，題目只說是一般的 GitHub repository，沒有特別指明是用 GitHub Enterprise，用了題目沒提到的前提假設；而且還要額外把部署憑證存進 Secret Manager 並自己管理存取權限，比起完全不需要管理任何憑證的做法，多了不必要的複雜度。", "zh": "在 Cloud Build 中建立一個 GitHub Enterprise trigger。一旦 pull request 被合併，觸發 Cloud Build 建置並部署應用程式到 Cloud Run。把部署憑證存到 Secret Manager。"}, {"letter": "D", "analysis": "正確：Cloud Build GitHub App 是 Google 跟 GitHub 官方原生整合的安裝方式，安裝授權後 Cloud Build 就能自動偵測 PR 合併等事件，不需要手動設定 webhook、不需要存放任何靜態金鑰或憑證，建立好 trigger 後可以直接內建支援部署到 Cloud Run，是最直接、最安全、設定最少的標準做法。", "zh": "使用 Cloud Build 的 GitHub app 連接你的 repository。在 Cloud Build 中建立一個 trigger。一旦 pull request 被合併，觸發 Cloud Build 建置並部署應用程式到 Cloud Run。"}], "notes": [{"heading": "題目在問什麼", "body": "應用程式原始碼放在 GitHub repository。要建立一套高效且安全的持續部署流程，每當 pull request 被合併時，自動把應用程式建置並部署到 Cloud Run。"}, {"heading": "答案驗證：D", "body": "看到『GitHub + 自動建置部署到 GCP 服務（特別是 Cloud Run/GKE）』，優先想到 Cloud Build 搭配 GitHub App 原生整合（不需要管理金鑰、設定最簡單）；看到『把金鑰/憑證直接存進原始碼倉庫』這種敘述，無論哪個工具組合，都要直接判定是安全性反模式。信心高。"}, {"heading": "服務介紹：Cloud Build", "body": "是什麼：GCP 的全託管 CI/CD（持續整合/持續部署）建置服務，定義一套建置步驟（例如把程式碼打包成容器映像檔、跑測試、部署），在指定事件發生時（有新的 commit、PR 被合併）自動執行，不用自己維護建置伺服器。\n解決什麼問題：省去自架 Jenkins 之類 CI/CD 伺服器的維運負擔。\n在這題的應用：透過 Cloud Build 的 GitHub App 原生整合，PR 合併後自動觸發建置並部署到 Cloud Run。\n常見程度：GCP 考試中 CI/CD 情境的核心服務。"}, {"heading": "什麼是 Cloud Build GitHub App（原生整合）", "body": "是什麼：Google 跟 GitHub 官方合作推出的安裝型整合方式，在 GitHub 上安裝這個 App 並授權存取倉庫後，Cloud Build 就能自動偵測 PR 合併等事件，觸發建置流程。\n解決什麼問題：不需要手動設定 webhook、不需要存放任何靜態金鑰或憑證，授權透過 GitHub App 的安裝機制處理，更安全、更容易管理，也不需要是 GitHub Enterprise 才能使用。\n在這題的應用：是這題正確答案的核心機制，也是 Google 官方推薦的標準做法。\n常見程度：GCP 考試裡『GitHub + Cloud Build 整合』情境的標準正解，與手動設定 webhook（A）、或誤用 GitHub Enterprise（C）做對比。"}, {"heading": "為什麼把金鑰存進原始碼是安全反模式", "body": "服務帳戶金鑰是一組長效的靜態憑證，一旦被提交進 Git 版本控制，就會永久留在版本歷史裡（即使之後刪除檔案，歷史紀錄中依然存在），只要倉庫權限設定不當、或不小心設成公開倉庫，金鑰就可能外洩；而且長效靜態金鑰難以定期輪替，也難以追蹤到底是誰在使用這把金鑰執行了什麼操作。\n正確做法：優先使用像 Cloud Build GitHub App 這種原生整合機制（不需要存放靜態金鑰），或是使用短效的身分聯合驗證（Workload Identity Federation）取代長效金鑰。\n常見程度：GCP 考試中反覆出現的安全反模式，看到『金鑰/憑證跟原始碼放在一起』幾乎都是要排除的錯誤選項。"}, {"heading": "什麼是 Webhook（網路鉤子）", "body": "是什麼：一種讓兩個系統之間自動互相通知的機制。在 A 系統設定『如果發生某件事，就主動打一個網路請求去通知 B 系統』，B 系統收到通知後就能馬上做出對應反應，不需要B系統自己每隔一段時間主動去問（polling，輪詢）。\n解決什麼問題：避免為了得知某件事是否發生，一直重複查詢對方狀態，改成事件發生時由對方主動推送通知,更即時也更省資源。\n在這題的應用：GitHub 本身有 Webhook 功能，可以在 repository 設定裡手動填入一個接收通知的網址,並選擇要監聽的事件（例如 PR 被合併），之後有符合條件的事件發生時,GitHub 會自動發送 HTTP 請求通知那個網址。選項 A 用的是這種手動設定方式——要自己填網址、選事件類型,網址或設定異動時也要自己手動維護。\n為什麼 D 更好：Cloud Build GitHub App（選項 D 用的方法）是更高階的整合方式,安裝並授權後,Google 跟 GitHub 之間已經談好怎麼互相通知（背後原理也是 webhook，但是自動設定、自動維護的）,不需要自己手動填網址、管理密鑰,也更安全。\n常見程度：軟體整合中非常常見的通用機制,但考試裡常用來跟『平台原生整合（App 安裝授權）』做比較,原生整合通常是維運負擔更低、更安全的選項。"}]}}, {"id": "T1-Q252", "topic": 1, "qnum": 252, "question": "You are deploying a highly confidential data processing workload on Google Cloud. Your company’s compliance framework mandates that cryptographic keys used for encrypting data at rest must be generated and stored exclusively within a validated Hardware Security Module (HSM). You want to use a fully integrated Google Cloud managed service to handle the lifecycle and usage of these keys. What should you do?", "options": [{"letter": "A", "text": "Use Customer-Supplied Encryption Keys (CSEK) by providing your on-premises generated key with each API request."}, {"letter": "B", "text": "Import your on-premises HSM key material into a Cloud KMS key with the SOFTWARE protection level."}, {"letter": "C", "text": "Create a new key in Cloud Key Management Service (Cloud KMS) with the HSM protection level."}, {"letter": "D", "text": "Configure Cloud External Key Manager (Cloud EKM) to connect to your on-premises HSM."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383612-exam-professional-cloud-architect-topic-1-question-252/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud KMS/加密", "安全性", "合規性"], "keywords": ["must be generated and stored exclusively within a validated Hardware Security Module (HSM)"], "explanation": {"questionZh": "你正在 Google Cloud 上部署一個高度機密的資料處理工作負載。你公司的合規框架規定：用來加密靜態資料（data at rest）的加密金鑰，必須只能在一個經過驗證的硬體安全模組（HSM）內生成並儲存。你想要使用一套完全整合的 Google Cloud 託管服務，來處理這些金鑰的生命週期和使用。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：CSEK 是一種『你自己保管金鑰，每次要用的時候才傳給 Google』的機制，Google 不會幫你儲存這把金鑰，你必須每一次 API 請求都自己附上金鑰。這完全不是全託管服務處理金鑰生命週期，反而是把金鑰管理的全部責任丟回給你自己，而且地端生成的金鑰也不保證是經驗證 HSM 生成的。", "zh": "使用客戶提供的加密金鑰（CSEK），在每次 API 請求時提供你地端生成的金鑰。"}, {"letter": "B", "analysis": "錯誤：就算一開始的金鑰材料是在地端 HSM 裡生成的，一旦匯入 Cloud KMS 時選擇 SOFTWARE（軟體）保護等級，這把金鑰在 Google Cloud 這邊就是用軟體層面的加密模組來儲存和使用，不再是存放在硬體 HSM 裡，直接違反『必須只能在經驗證的 HSM 內儲存』的要求。", "zh": "把你地端 HSM 的金鑰材料，匯入到一個保護等級設為 SOFTWARE 的 Cloud KMS 金鑰中。"}, {"letter": "C", "analysis": "正確：Cloud KMS 建立金鑰時可選擇保護等級，選擇 HSM 等級時，這把金鑰會在 Google Cloud 自己維運、符合 FIPS 140-2 Level 3 驗證標準的硬體安全模組內生成並儲存，所有加解密運算都在硬體內部完成，金鑰明文從頭到尾不會離開 HSM。這是完全託管的服務，精準對應生成並儲存在經驗證 HSM 內+全託管服務+處理金鑰生命週期三個要求。", "zh": "在 Cloud Key Management Service（Cloud KMS）中建立一把新金鑰，保護等級設為 HSM。"}, {"letter": "D", "analysis": "錯誤：Cloud EKM 是讓你把金鑰完全留在 GCP 之外（例如留在自己的地端 HSM），GCP 服務需要加解密時透過網路呼叫外部系統執行。雖然金鑰確實存在 HSM 裡，但這不是 Google Cloud 自己的全託管服務，還是要自己維護那台地端 HSM、處理網路連線的可用性/延遲問題，架構複雜度和維運負擔都更高。", "zh": "設定 Cloud External Key Manager（Cloud EKM），連接到你的地端 HSM。"}], "notes": [{"heading": "題目在問什麼", "body": "要在 GCP 部署一個高度機密的資料處理工作負載。合規框架規定：用來加密靜態資料的加密金鑰，必須只能在經過驗證的硬體安全模組（HSM）內生成並儲存。要用一套完全整合的 Google Cloud 託管服務來管理這些金鑰的生命週期和使用。"}, {"heading": "答案驗證：C", "body": "看到『金鑰必須生成並儲存在經驗證的 HSM + 要用全託管服務』，直接鎖定 Cloud KMS 選 HSM 保護等級——這是最直接、最少複雜度的做法。要分清楚 Cloud KMS 的保護等級邏輯：Software（軟體層加密，最基本）vs HSM（Google 託管的硬體安全模組，合規等級更高）；而 CSEK（自己每次傳金鑰）和 Cloud EKM（金鑰留在外部系統）都是『金鑰不交給 Google 完全託管』的替代方案，不符合這題要全託管服務處理金鑰生命週期的要求。信心高。"}, {"heading": "什麼是 HSM（Hardware Security Module，硬體安全模組）", "body": "是什麼：一種專門用來生成、儲存、保護加密金鑰的實體硬體裝置，金鑰從生成到使用的整個過程都只發生在這個硬體裝置內部——金鑰的原始明文永遠不會以明文形式離開這個硬體，即使是系統管理員也看不到金鑰本身的明文內容，只能請求這個硬體幫忙做加密/解密運算。\n解決什麼問題：提供比單純軟體加密更高等級的防護，防止軟體層被入侵後金鑰被竊取，是金融、政府、高合規產業常見的強制要求。『經過驗證（validated）』通常是指符合國際標準（例如 FIPS 140-2 Level 3）的認證硬體。\n在這題的應用：題目要求金鑰只能存在經驗證的 HSM 內，這直接排除了會把金鑰以軟體方式儲存/使用的選項（B）。\n常見程度：高合規場景（金融、政府、醫療）常見的硬性合規要求。"}, {"heading": "服務介紹：Cloud KMS（Key Management Service）", "body": "是什麼：GCP 的金鑰管理服務，建立金鑰時可以選擇保護等級（protection level）：Software（軟體）或 HSM。選擇 HSM 等級時，金鑰會在 Google Cloud 自己維運、符合 FIPS 140-2 Level 3 驗證標準的硬體安全模組內生成並儲存。\n解決什麼問題：讓企業不用自己買 HSM 硬體、不用自己維護，就能享有硬體等級的金鑰保護，Google 幫忙管理金鑰的整個生命週期（生成、輪替、撤銷等）。\n在這題的應用：選 HSM 保護等級，精準對應題目的三個要求（生成並儲存在經驗證 HSM 內、全託管服務、處理金鑰生命週期）。\n常見程度：GCP 考試中『金鑰管理/加密合規』情境的核心服務，HSM vs Software 保護等級的差異是常考細節。"}, {"heading": "什麼是 CSEK（Customer-Supplied Encryption Keys）", "body": "是什麼：一種由客戶自己保管加密金鑰、每次 API 請求時才提供給 Google 使用的機制，Google 不會儲存這把金鑰。\n解決什麼問題：給需要完全掌控金鑰、不想讓 Google 保管任何金鑰副本的場景使用。\n在這題的應用：這完全不是『全託管服務處理金鑰生命週期』的做法，反而是把金鑰管理責任全部丟回給客戶自己，也不保證金鑰是在驗證過的 HSM 中生成，是這題的誤答陷阱。\n常見程度：較少見的進階加密選項，通常用於有特殊合規或信任需求但又需要使用 GCP 運算資源的場景。"}, {"heading": "服務介紹：Cloud EKM（External Key Manager）", "body": "是什麼：讓你把加密金鑰完全留在 Google Cloud 之外（例如自己的地端 HSM，或第三方金鑰管理系統），GCP 服務需要加解密時，透過網路呼叫外部系統來執行運算。\n解決什麼問題：給需要『金鑰完全不落地在雲端供應商手上』這種極端合規需求的場景使用。\n在這題的應用：雖然金鑰確實存在 HSM 裡，但這不是 Google Cloud 自己的全託管服務，還是要自己維護地端 HSM、處理網路連線的可用性/延遲問題，架構複雜度和維運負擔都比直接用 Cloud KMS 的 HSM 保護等級高，不符合題目『全託管服務』的要求。\n常見程度：極高合規/金鑰主權需求場景的進階選項，考試裡常被用來跟 Cloud KMS HSM 保護等級做對比混淆。"}]}}, {"id": "T1-Q254", "topic": 1, "qnum": 254, "question": "You are designing a central, automated infrastructure deployment process for your organization using Terraform and Cloud Build. The security team prohibits the use of long-lived, static service account keys in any CI/CD pipeline. Additionally, while developers can propose infrastructure changes for peer review, they must not have permissions to directly apply changes in the production project. You need to design a secure and automated workflow for applying Terraform changes that meets the security team's requirements and ensures proper governance. What should you do?", "options": [{"letter": "A", "text": "Configure the Cloud Build pipeline to use service account impersonation. Set up a trigger that automatically runs terraform apply when a pull request is merged."}, {"letter": "B", "text": "Use service account impersonation in Cloud Build. Configure the pipeline to run terraform plan on pull requests, and require manual approval before running terraform apply."}, {"letter": "C", "text": "Configure the pipeline to only run terraform plan. After a pull request is approved, have an authorized developer run terraform apply from a secured workstation."}, {"letter": "D", "text": "Create a privileged service account and store its JSON key in Secret Manager. Configure the Cloud Build pipeline to fetch this key during execution to authenticate Terraform."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383629-exam-professional-cloud-architect-topic-1-question-254/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Terraform/IaC", "CI/CD", "安全性"], "keywords": ["prohibits the use of long-lived, static service account keys", "must not have permissions to directly apply changes in the production project"], "explanation": {"questionZh": "你正在用 Terraform 和 Cloud Build，為你的組織設計一套集中化、自動化的基礎設施部署流程。安全團隊規定：任何 CI/CD 流程中都禁止使用長效、靜態的服務帳戶金鑰。此外，開發人員雖然可以提出基礎設施變更讓同儕審查，但不能有權限直接在正式環境（production）專案中套用變更。你需要設計一套安全、自動化的工作流程來套用 Terraform 變更，既符合安全團隊的要求，也確保適當的治理。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：服務帳戶模擬這部分做對了（沒有靜態金鑰），但 PR 一合併就自動套用到正式環境，中間沒有任何額外的人工核准關卡，代表審查程式碼變更跟核准正式套用被混為同一個動作，缺乏治理上要求的分階段把關。", "zh": "設定 Cloud Build 管線使用服務帳戶模擬（impersonation）。設置一個觸發條件，當 pull request 被合併時自動執行 terraform apply。"}, {"letter": "B", "analysis": "正確：同樣使用服務帳戶模擬（沒有靜態金鑰），而且流程上把審查程式碼跟核准正式套用拆成兩個獨立的把關點（PR 時跑 plan 給審查者看，apply 前再要求額外人工核准），符合職責分離的標準治理實踐，開發人員只能提案、等審查、等核准，沒有人能繞過流程直接讓變更生效。", "zh": "在 Cloud Build 中使用服務帳戶模擬。設定管線在 pull request 時執行 terraform plan，並在執行 terraform apply 之前要求人工核准。"}, {"letter": "C", "analysis": "錯誤：讓真正套用變更這個動作跑到集中化自動管線之外，變成由某個人在自己的工作站上手動執行，跟題目要求的『集中化、自動化的部署流程』自相矛盾，套用動作的執行紀錄、身分認證方式都不在統一 CI/CD 管線掌控之下，難以稽核，也沒有用到服務帳戶模擬這種更安全的身分機制。", "zh": "設定管線只執行 terraform plan。在 pull request 被核准之後，由一位獲授權的開發人員從一台安全的工作站執行 terraform apply。"}, {"letter": "D", "analysis": "錯誤：Secret Manager 本身是安全存放密鑰的服務，但這仍然是一把長效、靜態的服務帳戶 JSON 金鑰，只是換了個比較安全的保管箱，金鑰本身依然長期存在、可以被下載使用，不管放在多安全的地方，只要還是靜態金鑰就違反安全團隊『禁止使用長效靜態服務帳戶金鑰』的規定。", "zh": "建立一個具有高權限的服務帳戶，把它的 JSON 金鑰存進 Secret Manager。設定 Cloud Build 管線在執行期間抓取這把金鑰，用來驗證 Terraform 的身分。"}], "notes": [{"heading": "題目在問什麼", "body": "要用 Terraform + Cloud Build 設計一套集中化、自動化的基礎設施部署流程。安全團隊規定 CI/CD 流程裡禁止使用長效靜態的服務帳戶金鑰。開發人員可以提出基礎設施變更讓同儕審查，但不能有權限直接在正式環境套用變更。需要一套安全、自動化、符合治理要求的工作流程來套用 Terraform 變更。"}, {"heading": "答案驗證：B", "body": "看到『CI/CD 要操作雲端資源，但禁止用靜態服務帳戶金鑰』，優先想到 service account impersonation（服務帳戶模擬）——不管金鑰放哪裡（Secret Manager 也一樣），只要是靜態金鑰就不符合這類安全規定；看到『Terraform 自動化管線+需要適當治理/核准流程』，標準做法是 plan（自動跑，給審查用）+ apply 前加一道獨立的人工核准關卡，不要把 PR 審查通過跟正式套用變更混為同一個不可分割的自動化動作，也不要讓套用這個高風險動作脫離自動化管線、退回到個人手動執行。信心高。"}, {"heading": "什麼是 Terraform plan vs apply", "body": "terraform plan：預覽這次程式碼變更會對實際基礎設施做出什麼改動（新增/修改/刪除哪些資源），但不會真的執行，純粹是模擬結果的報告，讓人審查用。\nterraform apply：真正執行這些變更，把雲端資源實際建立/修改/刪除，是有實際破壞力的動作。\n在這題的應用：好的治理流程會把『plan 給人看』和『apply 真正執行』拆成兩個步驟，並在 apply 前插入人工核准關卡，而不是看完 plan 就自動無條件套用。"}, {"heading": "什麼是 Service Account Impersonation（服務帳戶模擬）", "body": "是什麼：讓一個身分（例如 Cloud Build 執行時用的預設身分）臨時『借用』另一個服務帳戶的權限去執行操作，整個過程不需要下載、持有該服務帳戶的任何長效金鑰檔案，權限的授予和撤銷都在 IAM 層級控管，且每次借用的行為都會被記錄。\n解決什麼問題：避免為了讓某個服務擁有特定權限，就必須產生並保管一把靜態金鑰檔案，降低金鑰外洩風險，也更容易追蹤稽核。\n在這題的應用：A、B 選項都用了這個機制，是正確的身分驗證方式，差別在於套用前有沒有多一道人工核准關卡。\n常見程度：GCP 考試中『CI/CD 需要操作雲端資源但禁止用靜態金鑰』情境的標準正解機制，詳見 Q251 的延伸討論。"}, {"heading": "記憶重點：職責分離（Separation of Duties）", "body": "看到題目要求『開發人員可以提案，但不能直接套用到正式環境』這種敘述，核心是在考『職責分離』的治理原則——提案/審查的人，跟核准/執行套用的人（或流程關卡），應該是分開的，不能是同一個不可分割的動作。實務上常見做法是：PR 審查通過只代表程式碼邏輯沒問題，套用到正式環境前還需要另一個獨立的核准步驟（可能是不同的人、不同的角色），確保沒有人能繞過這層把關直接讓變更生效。"}]}}, {"id": "T1-Q259", "topic": 1, "qnum": 259, "question": "Your company is expanding its AI-powered operations nationwide and has chosen accelerator-based compute for the AI workloads. The batch image processing workloads are not time-sensitive and can tolerate interruptions. You need to rapidly deploy cost-effective accelerator nodes for these batch tasks, ensuring rapid deployment and data persistence when necessary. What should you do?", "options": [{"letter": "A", "text": "Deploy standard VMs with configured accelerators and attached persistent disks."}, {"letter": "B", "text": "Deploy spot VMs with attached persistent disks and implement checkpoint mechanisms."}, {"letter": "C", "text": "Deploy spot VMs with local SSD to reduce time for bursty workloads"}, {"letter": "D", "text": "Deploy Cloud Run functions with ephemeral local SSD."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383596-exam-professional-cloud-architect-topic-1-question-259/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "成本優化", "Vertex AI/AI-ML", "⚠️答案存疑"], "myAnswer": "B", "keywords": ["rapidly deploy cost-effective accelerator nodes", "ensuring rapid deployment and data persistence when necessary"], "explanation": {"questionZh": "你的公司正在全國擴展其 AI 驅動的營運，並為 AI 工作負載選用了加速器型（accelerator-based）運算。批次影像處理工作負載不急迫，可以容忍中斷。你需要快速部署成本效益高的加速器節點來處理這些批次任務，確保快速部署，並在必要時確保資料能持久保存。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：標準（on-demand）VM 沒有用到任何折扣機制，全額付費——工作負載明明可以容忍中斷，卻沒有善用這個特性換取更便宜的運算資源，不符合 cost-effective 的要求。", "zh": "部署已設定加速器並掛載持久化磁碟的標準 VM。"}, {"letter": "B", "analysis": "我認為這才是正確答案：Spot VM 比標準 VM 便宜很多（通常 60-90% 折扣），正好對應『可以容忍中斷』這個特性換取省錢；checkpoint 機制定期把處理進度存到持久化磁碟，就算 VM 被回收，下次重新啟動時可以從上次存檔的進度繼續，不用從頭重跑。這是 Google 官方文件裡針對『可中斷批次工作負載』的標準建議架構，同時滿足成本效益、可容忍中斷、資料持久保存三個要求。", "zh": "部署掛載持久化磁碟的 Spot VM，並實作 checkpoint（檢查點）機制。"}, {"letter": "C", "analysis": "錯誤：Local SSD 速度極快，但 VM 被搶占（preempted）或關閉時，裡面的資料會直接消失，不會留下來，完全違反題目『確保必要時資料能持久保存』的要求。", "zh": "部署使用 local SSD 的 Spot VM，以縮短突發性（bursty）工作負載的處理時間。"}, {"letter": "D", "analysis": "存的答案，但我認為錯誤：選項裡明確寫『ephemeral（短暫易逝）local SSD』，資料不會被持久保存，直接跟題目『ensuring...data persistence when necessary』的要求矛盾；而且 Cloud Run 本身也不是為大規模 GPU/加速器型批次處理這種情境設計的服務。", "zh": "部署使用 ephemeral local SSD 的 Cloud Run functions。"}], "notes": [{"heading": "題目在問什麼", "body": "公司要把 AI 運算全國擴展，選用加速器型運算（GPU/TPU）處理 AI 工作負載。批次影像處理工作不急、可以容忍中斷。需要快速部署、成本效益高的加速器節點來跑這些批次任務，並確保必要時資料能持久保存。"}, {"heading": "⚠️ 答案存疑：我認為應該是 B，不是存的答案 D", "body": "D 選項裡的『ephemeral local SSD』從字面上看就是會遺失資料的儲存方式，這跟題目明確要求的『資料持久保存』矛盾；Google 自己的 GPU 文件明白寫著 Local SSD 的資料在 VM 停止、被搶占、或主機維護時都會遺失。Spot VM + 持久化磁碟 + checkpoint（B）才是 Google 官方文件明確記載的『成本效益高、可中斷批次工作負載』標準建議架構，而且 Cloud Run 本身也不是為大規模 GPU/加速器型批次處理這種情境設計的服務。曾派background查證這題在 ExamTopics 原始討論頁的社群投票，但原始連結本身回傳 404（查無資料），廣泛搜尋鏡像站、Wayback Machine 存檔也都找不到這題的任何討論或投票紀錄，無法確認 D 是否真的是 ExamTopics 的『建議答案』。純粹依據 Google 官方文件的架構邏輯推理，信心中高，但無法做最終的社群共識核對。"}, {"heading": "服務介紹：Spot VM", "body": "是什麼：一種比標準（on-demand）VM 便宜很多（通常 60-90% 折扣）的運算資源，代價是 Google 隨時可能以短通知強制回收這台機器。\n解決什麼問題：給『可以容忍中斷、不急迫』的工作負載（像批次處理、大量平行運算）大幅省錢的選項。\n在這題的應用：批次影像處理本來就不急、可以容忍中斷，正好適合用 Spot VM 換取大幅度的成本節省。\n常見程度：GCP 考試中『成本優化+可中斷批次工作負載』情境的標準核心服務。"}, {"heading": "什麼是 Checkpoint（檢查點）機制", "body": "是什麼：讓長時間執行的工作，定期把目前的處理進度/狀態存到持久化儲存空間（例如持久化磁碟或 Cloud Storage），如果工作中途被中斷（例如 Spot VM 被回收），下次重新啟動時可以從最近一次存檔的進度繼續，不用整個從頭重跑。\n解決什麼問題：搭配 Spot VM 這種隨時可能被中斷的運算資源時，避免一次中斷就損失所有已經做完的運算成果。\n在這題的應用：批次影像處理可能耗時很長，搭配 checkpoint 機制讓 Spot VM 被回收後重啟也不用整批重算，是讓 Spot VM 真正可用於長時間批次任務的關鍵配套做法。\n常見程度：搭配 Spot VM/可搶占資源使用時的標準最佳實踐，常跟 Spot VM 一起出現在考題裡。"}, {"heading": "什麼是 Local SSD vs Persistent Disk：資料持久性的關鍵差異", "body": "Local SSD：實體焊接在 VM 所在硬體機器上的固態硬碟，讀寫速度極快，但 VM 被停止、被搶占（preempted）、或所在硬體做維護時，裡面的資料會直接消失、無法復原。\nPersistent Disk：獨立於 VM 硬體之外的網路掛載式儲存空間，VM 被回收或關閉，資料依然保留在磁碟上，下次掛載到新的 VM 時還能繼續讀取。\n在這題的應用：題目明確要求『資料必要時要能持久保存』，只有 Persistent Disk 符合這個要求；Local SSD（不管是『local SSD』還是『ephemeral local SSD』）因為資料會隨 VM 消失，都不符合這個要求，是 C、D 選項共同的技術陷阱。\n常見程度：GCP 考試中反覆出現的儲存選型陷阱，看到『資料持久保存』的要求時要優先排除任何標榜『ephemeral/local』的儲存選項。"}]}}, {"id": "T1-Q260", "topic": 1, "qnum": 260, "question": "A large, multinational corporation is migrating to Google Cloud. The company has several distinct business units: Finance, Marketing, and Research and Development (R&D). The central security team has mandated governance requirements for each business unit:• Finance: Must be restricted to deploying resources only in specific, compliant regions (us-central1 and europe-west2). Access to their projects must be tightly controlled by a dedicated finance-admins group.• Marketing: Needs separate environments for production and development, with different teams managing each environment.• R&D: Requires maximum flexibility to experiment with new services but must be completely isolated to prevent any impact on production systems.• Global Auditing: A central compliance team requires read-only access to view all resources across the entire company for auditing purposes.You need to design a resource hierarchy that enforces these security policies at scale according to the Google Cloud Well-Architected Framework while providing the correct level of autonomy for each business unit. What should you do?", "options": [{"letter": "A", "text": "Create a folder for each department under the root Organization node. Apply the resource location Organiza
