tion Policy on the Finance folder. Within the Marketing folder, create separate projects for mktg-prod and mktg-dev. Grant the compliance team the roles/viewer role at the Organization level."}, {"letter": "B", "text": "Place all projects directly under the Organization node. Use network tags and service accounts to enforce security boundaries between the different department workloads. Apply the resource location Organization Policy on the Finance project."}, {"letter": "C", "text": "Create separate Google Cloud Organizations for each department (Finance, Marketing, and R&D). Grant the compliance team the roles/viewer role for each organization."}, {"letter": "D", "text": "Create a single project for each department. Apply the resource location policy directly to the Finance project. Grant the compliance team the roles/browser role on each project individually."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383628-exam-professional-cloud-architect-topic-1-question-260/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Organization Policy", "IAM", "合規性"], "keywords": ["design a resource hierarchy that enforces these security policies at scale", "the correct level of autonomy for each business unit"], "explanation": {"questionZh": "一家跨國大企業正在遷移到 Google Cloud。這家公司有好幾個不同的事業單位：財務（Finance）、行銷（Marketing）、研發（R&D）。中央安全團隊為每個事業單位訂出了治理要求：\n財務：必須被限制只能把資源部署在特定、符合合規要求的區域（us-central1 和 europe-west2）。對其專案的存取必須由一個專屬的 finance-admins 群組嚴格控管。\n行銷：需要為正式環境和開發環境建立各自獨立的環境，由不同的團隊各自管理。\n研發（R&D）：需要最大彈性去實驗新服務，但必須完全隔離，以防止對正式環境系統造成任何影響。\n全域稽核：中央合規團隊需要唯讀存取權限，以檢視整個公司所有資源，供稽核使用。\n你需要設計一套資源階層架構，依照 Google Cloud Well-Architected Framework 大規模落實這些安全政策，同時為每個事業單位提供適當程度的自主權。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：在 Organization 底下為每個部門建立資料夾，Finance 資料夾套用資源位置限制政策（自動套用到底下所有現在和未來新建的專案），Marketing 資料夾下分 mktg-prod/mktg-dev 兩個獨立專案天然做到環境分離，R&D 有自己獨立的資料夾天然隔離且保留最大彈性，合規團隊在 Organization 頂層授予 roles/viewer，靠 IAM 繼承一次設定涵蓋全公司所有資源，完全對應四項治理要求且符合『at scale』。", "zh": "在根組織節點下為每個部門建立一個資料夾。在 Finance 資料夾上套用資源位置組織政策。在 Marketing 資料夾內，為 mktg-prod 和 mktg-dev 建立各自獨立的專案。在組織層級授予合規團隊 roles/viewer 角色。"}, {"letter": "B", "analysis": "錯誤：網路標籤本質上是用來設定防火牆規則的，不是用來做部門層級治理/權限邊界的工具；區域限制政策只套在單一個 Finance 專案上而非資料夾，財務部門之後若開新專案，限制不會自動套用，不符合『at scale』的要求，完全沒利用資源階層繼承的優勢。", "zh": "把所有專案直接放在組織節點底下。使用網路標籤和服務帳戶，在不同部門的工作負載之間建立安全邊界。在 Finance 專案上套用資源位置組織政策。"}, {"letter": "C", "analysis": "錯誤：每個部門各自建立獨立的 Organization，等於完全打散了中央治理的可能性，三個組織互不隸屬，沒有共同頂層可以統一設定政策，合規團隊還得跑三個不同組織分別授權，而不是一次設定全部搞定，過度複雜且削弱中央治理能力。", "zh": "為每個部門（財務、行銷、研發）各自建立獨立的 Google Cloud Organization。在每個組織分別授予合規團隊 roles/viewer 角色。"}, {"letter": "D", "analysis": "錯誤：行銷部門只有一個專案，無法做到正式/開發環境分開、不同團隊管理的要求；合規團隊的權限是逐一在每個專案手動授予，而非頂層一次設定，不符合『at scale』，未來新增的專案也不會自動被看到；roles/browser 角色比 roles/viewer 更受限，對稽核用途可能不夠用。", "zh": "為每個部門建立單一一個專案。把資源位置政策直接套用在 Finance 專案上。在每個專案上個別授予合規團隊 roles/browser 角色。"}], "notes": [{"heading": "題目在問什麼", "body": "跨國企業要遷移到 GCP，有財務、行銷、研發三個事業單位，各有不同治理要求：財務限制部署區域+嚴格存取控管；行銷需要正式/開發環境分開各自管理；研發需要最大彈性但完全隔離；全域合規團隊需要唯讀存取看到全公司資源。要設計資源階層架構，大規模落實這些安全政策，同時給每個事業單位適當自主權。"}, {"heading": "答案驗證：A", "body": "看到『某個部門要套用統一的合規限制、而且要自動套用到未來新專案』，答案方向是在該部門的 Folder 層級套用 Organization Policy；看到『需要全公司範圍的唯讀稽核』，答案方向是在最頂層 Organization 授予一次唯讀角色，靠 IAM 繼承往下涵蓋所有東西——不要被『分成多個獨立 Organization』或『逐一手動在每個專案授權』這種看起來也能達到目的、但犧牲了集中治理和自動擴展性的做法騙了。信心高。"}, {"heading": "基礎知識：GCP 資源階層（Resource Hierarchy）", "body": "GCP 的資源組織結構是一層套一層：Organization（組織，整個公司，正常只有一個）→ Folder（資料夾，通常對應部門/團隊）→ Project（專案，實際資源跑在這裡）→ 底下的各種資源（VM、資料庫等）。\n關鍵特性是繼承（inheritance）：在上層設定的 IAM 權限或組織政策（Organization Policy），會自動套用到底下所有的 Folder 和 Project，不用每個專案都手動重複設定一次。\n解決什麼問題：大型組織有多個部門、多個專案時，不用為了套用統一規則（例如限制部署區域、授予稽核權限）逐一手動在每個專案設定一次，設計得當的話只要在對的層級設定一次，就能自動涵蓋現在和未來所有底下的資源。\n在這題的應用：Finance 的區域限制政策套在 Folder 層級，Organization 層級授予合規團隊唯讀角色，都是善用這個繼承特性、一次設定、自動擴展到未來新資源的標準做法。\n常見程度：GCP 考試中『大型企業治理/多部門權限設計』情境的核心基礎知識，是這類題目的解題關鍵框架。"}, {"heading": "什麼是 roles/viewer vs roles/browser", "body": "roles/viewer：可以查看資源的詳細設定和內容（例如 VM 的設定、Storage bucket 裡的物件清單等），是常見用於『唯讀稽核』情境的角色。\nroles/browser：權限比 viewer 更受限，大致只能看到資源階層的架構和 IAM 政策本身，但看不到實際資源的詳細內容/設定，對於需要實際檢視資源狀態的稽核工作可能不夠用。\n在這題的應用：題目要求合規團隊能『view all resources（檢視所有資源）』做稽核，這需要 roles/viewer 等級的權限，選項 D 給的 roles/browser 權限可能不夠。\n常見程度：IAM 預先定義角色的細節差異，是常考的混淆點。"}]}}, {"id": "T1-Q261", "topic": 1, "qnum": 261, "question": "Your organization is going to migrate applications to Kubernetes and use managed cloud services to deploy applications. Your team is new to Kubernetes and wants to quickly onboard engineers. You want to reduce operational overhead, so the engineering team can focus on developing consumer requirements instead of maintaining the infrastructure. What should you do?", "options": [{"letter": "A", "text": "Package your application into a Docker image, and deploy it to Kubernetes on Compute Engine."}, {"letter": "B", "text": "Leverage Cloud Build to create a container image, and deploy it automatically to Kubernetes on Compute Engine."}, {"letter": "C", "text": "Assess application and dependencies for containerization Develop a migration strategy for deployment to GKE in Standard mode."}, {"letter": "D", "text": "Assess application and dependencies for containerization. Develop a migration strategy for deployment to GKE in Autopilot mode."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383618-exam-professional-cloud-architect-topic-1-question-261/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["GKE/Kubernetes", "容器化", "成本優化"], "keywords": ["reduce operational overhead, so the engineering team can focus on developing consumer requirements"], "explanation": {"questionZh": "你的組織打算把應用程式遷移到 Kubernetes，並使用託管雲端服務來部署應用程式。你的團隊是 Kubernetes 新手，想要快速讓工程師上手。你想要降低維運負擔，讓工程團隊能專注在開發消費者需求的功能，而不是維護基礎設施。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：這裡講的不是 GKE，而是自己在 Compute Engine VM 上手動架設 Kubernetes，代表要自己管理整個 Kubernetes 控制層（從零架設、維護、升級），對 Kubernetes 新手團隊來說是維運負擔最重的選項，完全違背題目降低維運負擔的核心訴求。", "zh": "把應用程式打包成 Docker 映像檔，部署到 Compute Engine 上的 Kubernetes。"}, {"letter": "B", "analysis": "錯誤：雖然用 Cloud Build 自動化了建置映像檔這個環節，但部署的目標依然是自己架設在 Compute Engine 上的 Kubernetes（不是 GKE），一樣要自己管理整套 Kubernetes 控制層的維運，核心問題沒有解決。", "zh": "善用 Cloud Build 建立容器映像檔，並自動部署到 Compute Engine 上的 Kubernetes。"}, {"letter": "C", "analysis": "錯誤：方向正確地選用了 GKE（控制層交給 Google 管），但 Standard 模式仍然要自己管理節點（決定機型、數量、擴縮、升級節點版本等），對『團隊是 Kubernetes 新手、想要快速上手、降低維運負擔』這個情境來說，還是比 Autopilot 多了一層不必要的維運複雜度。", "zh": "評估應用程式和相依性是否適合容器化。制定遷移策略，部署到 GKE Standard 模式。"}, {"letter": "D", "analysis": "正確：Autopilot 讓 Google 連控制層和節點都一併全自動管理，團隊完全不用操心底層基礎設施的任何細節，最大程度降低維運負擔，讓 Kubernetes 新手團隊能把精力完全專注在開發應用程式功能上，精準對應題目的所有訴求。", "zh": "評估應用程式和相依性是否適合容器化。制定遷移策略，部署到 GKE Autopilot 模式。"}], "notes": [{"heading": "題目在問什麼", "body": "公司要把應用程式遷移到 Kubernetes，並用託管雲端服務來部署。團隊是 Kubernetes 新手，想快速讓工程師上手。要降低維運負擔，讓工程團隊能專注在開發消費者需求的功能，而不是維護基礎設施。"}, {"heading": "答案驗證：D", "body": "看到『團隊是 Kubernetes 新手+想快速上手+要降低維運負擔，把心力放在開發』這種組合描述，優先選 GKE Autopilot（連節點都不用管）而不是 GKE Standard（還要自己管節點）；而『自己在 Compute Engine 上架 Kubernetes』（不是 GKE）幾乎在任何『降低維運負擔』的情境下都是錯誤選項，因為那等於完全放棄了託管服務的優勢。信心高。"}, {"heading": "基礎知識：GKE Standard vs Autopilot", "body": "GKE（Google Kubernetes Engine）提供兩種叢集管理模式：\nStandard 模式：Google 幫你管理控制層（control plane），但節點（node，底下跑容器的 VM）仍然要自己管——自己決定節點數量、機型規格、擴縮策略、節點升級時機等。彈性比較高，但維運負擔也比較高。\nAutopilot 模式：Google 連節點也一併幫你全自動管理，完全不用操心底下有幾台機器、規格多大，系統依照 Pod 需求自動配置運算資源，按實際使用的資源計費（不是按整台機器計費）。維運負擔降到最低，特別適合不熟悉 Kubernetes 底層運維細節的團隊。\n在這題的應用：題目的情境（新手團隊、要降低維運負擔）精準對應 Autopilot 的設計目的。\n常見程度：GCP 考試中『GKE 模式選擇』情境的核心基礎知識。"}]}}, {"id": "T1-Q262", "topic": 1, "qnum": 262, "question": "Your company runs a critical, revenue-generating ecommerce application that is served by a regional managed instance group (MIG) behind an external HTTP(S) Load Balancer. The operations team is currently overwhelmed with low-priority notifications and is starting to ignore alerts. Your team's service level objective (SLO) is to maintain 99.9% availability, which is measured by the ratio of successful requests (2xx status codes) to total requests. You want to minimize noise from non-critical events and ensure that the team is only notified of issues that are actionable and threaten the SLO. What should you do?", "options": [{"letter": "A", "text": "Focus on cause-based alerts, creating alerting policies with thresholds for the Compute Engine instances, including CPU utilization, memory usage, disk I/O, and network traffic."}, {"letter": "B", "text": "Create log-based alerts for only the WARN and ERROR log entries generated by the application to ensure that no potential issue is missed."}, {"letter": "C", "text": "Implement an error budget policy based on the availability of the SLO. Create a \"page” alert that triggers only when the rate of burn of the error budget predicts a full exhaustion within the next 24 hours."}, {"letter": "D", "text": "Configure alerts based on predictive metrics. Use the instance count of the MIG as the primary metric to trigger an alert."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383574-exam-professional-cloud-architect-topic-1-question-262/", "postedDate": "2026-02-10", "postedYear": 2026, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "高可用性/災難復原"], "keywords": ["minimize noise from non-critical events and ensure that the team is only notified of issues that are actionable and threaten the SLO"], "explanation": {"questionZh": "你的公司經營一個關鍵、會產生營收的電商應用程式，由一組區域型受管理執行個體群組（MIG）在外部 HTTP(S) 負載平衡器後面提供服務。維運團隊目前被大量低優先級的通知淹沒，開始無視警報。你團隊的服務等級目標（SLO）是維持 99.9% 可用性，用成功請求（2xx 狀態碼）佔總請求數的比例來衡量。你想要減少非關鍵事件的雜訊，並確保團隊只會在問題真的可以採取行動、且會威脅到 SLO 時才收到通知。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：這是典型的 cause-based（以成因為基礎）做法，CPU、記憶體、磁碟 I/O、網路流量這些底層資源指標的波動，不直接等於使用者端感受到的服務異常，很容易產生大量低優先級雜訊，正是題目描述『團隊被淹沒、開始忽視警報』的病根，不是解法。", "zh": "著重在以成因為基礎的警報，針對 Compute Engine 執行個體建立有閾值的警報政策，涵蓋 CPU 使用率、記憶體使用量、磁碟 I/O、以及網路流量。"}, {"letter": "B", "analysis": "錯誤：『不漏掉任何潛在問題』這個心態正是問題所在，應用程式的 WARN 等級日誌通常數量龐大、大多無關緊要，把每一條 WARN/ERROR 都變成警報只會讓雜訊問題更嚴重，跟題目要減少雜訊的目標完全相反。", "zh": "只針對應用程式產生的 WARN 和 ERROR 日誌項目建立基於日誌的警報，確保不會漏掉任何潛在問題。"}, {"letter": "C", "analysis": "正確：這是 symptom-based（以症狀為基礎）警報的標準實踐——直接監控 SLO 本身，並用燃燒率（burn rate）做預測性判斷，精準抓住『照這個消耗速度，很快就會把這個月容許出錯的額度用完』這個真正值得立刻處理的時刻才發出 page（緊急呼叫）通知，完全對應題目只在真正威脅到 SLO、且可採取行動時才通知的要求。", "zh": "實作一套基於 SLO 可用性的錯誤預算（error budget）政策。建立一個『page（呼叫）』警報，只在錯誤預算的消耗速率（burn rate）預測會在未來 24 小時內完全耗盡時才觸發。"}, {"letter": "D", "analysis": "錯誤：MIG 的執行個體數量變化通常只是自動擴縮在正常運作的結果（流量變大、自動多開幾台機器，是預期中的正常行為，不是故障），拿數量變化本身當警報觸發條件，一樣是跟使用者是否真的受影響脫鉤的成因類指標，容易產生大量不必要的通知。", "zh": "基於預測性指標設定警報。使用 MIG 的執行個體數量作為觸發警報的主要指標。"}], "notes": [{"heading": "題目在問什麼", "body": "電商應用程式跑在區域型 MIG 後面，維運團隊被大量低優先級通知淹沒、開始無視警報（警報疲勞）。團隊 SLO 是 99.9% 可用性（成功請求佔總請求數比例）。要減少非關鍵事件的雜訊，確保團隊只會在問題真的可採取行動、且會威脅到 SLO 時才收到通知。"}, {"heading": "答案驗證：C", "body": "看到『團隊被警報淹沒、開始忽視警報（alert fatigue）+ 只想在真正威脅到 SLO 時收到通知』，標準答案方向是基於錯誤預算燃燒率（error budget burn rate）的 symptom-based 警報——直接盯緊使用者真正在意的服務品質指標本身，而不是盯著 CPU/記憶體這些底層資源指標（cause-based），也不是盯著每一條日誌訊息（容易過度敏感）。這是 Google SRE 方法論裡被廣泛引用的核心最佳實踐。信心高。"}, {"heading": "基礎知識：SLI / SLO / 錯誤預算（Error Budget）", "body": "SLI（Service Level Indicator，服務等級指標）：實際拿來衡量服務好壞的數字，這題是 2xx 成功請求 ÷ 總請求數。\nSLO（Service Level Objective，服務等級目標）：對這個指標訂出的目標值，這題是 99.9%。\n錯誤預算（Error Budget）：如果目標是 99.9% 可用性，代表允許有 0.1% 的失敗空間，這 0.1% 就是錯誤預算，可以想成這個月容許出錯的額度。只要沒把這個額度花完，就還在 SLO 範圍內；如果額度快被花光（burn，燒光），就代表即將違反對使用者的服務承諾，這才是真正該緊急處理的事。\n常見程度：Google SRE 方法論的核心基礎概念，GCP 考試中『監控/可觀測性』主題常考。"}, {"heading": "基礎知識：Cause-based vs Symptom-based 警報", "body": "Cause-based（以成因為基礎）：監控可能導致問題的底層原因，像 CPU 使用率、記憶體、磁碟 I/O、網路流量。問題是這些指標升高不代表使用者真的受到影響（例如 CPU 飆高但系統還是順利回應所有請求），容易跟實際使用者體驗脫鉤，造成大量看似嚴重、實則無人受影響的雜訊通知。\nSymptom-based（以症狀為基礎）：直接監控使用者實際感受到的服務品質（這題就是 SLO 本身：請求成功率），只有真正影響到使用者體驗、快要違反服務承諾時才通知，這才是真正可採取行動且威脅到 SLO 的事件。\n在這題的應用：A 選項是典型的 cause-based 誤答陷阱，C 選項是 symptom-based 的正確實踐。\n常見程度：SRE 監控設計的核心二分法，是這類題目的解題關鍵框架。"}, {"heading": "什麼是 Page（呼叫/傳呼）vs Ticket（工單）", "body": "是什麼：Page 是維運/SRE 術語裡最高緊急程度的通知方式，系統偵測到問題時會直接打電話、傳簡訊、或透過 PagerDuty/Opsgenie 這類工具強制中斷值班工程師目前在做的事，要求立刻處理，不管是半夜還是假日。名稱源自早期的呼叫器（pager）裝置。相對地，Ticket（工單）代表這件事需要被追蹤但不急，系統建立一張工單紀錄，值班人員等正常上班時間、手邊事情做完再處理就好，不會打斷人也不會半夜吵醒人。\n解決什麼問題：區分『真正緊急、需要立刻打斷人處理』跟『該被記錄但不急』這兩種不同急迫程度的事件，避免把所有事情都用最強烈的方式通知，加劇警報疲勞。\n在這題的應用：只有錯誤預算燃燒率顯示『24 小時內 SLO 就要被違反了』這種真正緊急、有實際業務影響的狀況，才值得用 page 把值班工程師直接吵醒；像 CPU 使用率稍微高一點這種小事，頂多開一張 ticket 讓人有空再看就好。\n常見程度：維運/事件管理（incident management）的核心術語，GCP 考試中『警報設計/降低警報疲勞』情境常考的概念。"}]}}, {"id": "T1-Q263", "topic": 1, "qnum": 263, "question": "You manage a highly distributed, hybrid- and multi-cloud IT environment, and your developers rely heavily on Prometheus for their workflows. You need a cloud-based, highly scalable, low-maintenance enterprise solution that supports Prometheus Query Language (PromQL) queries, quick metric viewing, and efficient issue diagnosis. What should you do?", "options": [{"letter": "A", "text": "Deploy a Prometheus operator in your existing Kubernetes and Serverless setup across multi-cloud environments."}, {"letter": "B", "text": "Set up Cloud Monitoring as a single pane of glass across multi-cloud environments."}, {"letter": "C", "text": "Enable Google Cloud Managed Service for Prometheus to monitor and alert on your workloads at scale."}, {"letter": "D", "text": "Build a SaaS-based, Prometheus-compatible solution to display metrics for each cloud in a customizable way."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383601-exam-professional-cloud-architect-topic-1-question-263/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Monitoring/Logging", "混合雲", "監控與可觀測性", "⚠️答案存疑"], "myAnswer": "C", "keywords": ["cloud-based, highly scalable, low-maintenance enterprise solution that supports Prometheus Query Language (PromQL) queries"], "explanation": {"questionZh": "你管理一個高度分散、混合雲與多雲的 IT 環境，你的開發人員高度仰賴 Prometheus 進行日常工作流程。你需要一套雲端為基礎、高度可擴展、低維運的企業級解決方案，要支援 Prometheus 查詢語言（PromQL）查詢、快速查看指標，以及高效的問題診斷。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "存的答案，但我認為錯誤：這代表要自己在多雲環境部署並營運整套 Prometheus（即使用 operator 模式，仍要自己管理跨叢集的擴展、高可用、儲存、聯合查詢），直接跟題目明確要求的『low-maintenance（低維運）』相反，是自己架設而非使用雲端託管服務。", "zh": "在你現有的 Kubernetes 和無伺服器（Serverless）環境中，跨多雲部署一個 Prometheus operator。"}, {"letter": "B", "analysis": "錯誤：Cloud Monitoring 本身有自己的查詢語言（MQL），不是原生支援 PromQL 的工具，除非搭配 Google Cloud Managed Service for Prometheus，否則這個選項沒有明確提到 PromQL 支援，不夠具體對應題目的 PromQL 要求。", "zh": "設定 Cloud Monitoring，作為跨多雲環境的單一整合儀表板（single pane of glass）。"}, {"letter": "C", "analysis": "我認為這才是正確答案：Google Cloud Managed Service for Prometheus（GMP）是 Google 官方文件明確描述為『全託管、跨多雲、跨專案』的 Prometheus 解決方案，原生支援 PromQL 查詢，明確支援混合雲/多雲環境（不限 GKE，收集器可以跑在地端和其他雲端），用的是跟 Cloud Monitoring 相同的後端架構，繼承其規模化能力和低維運模式，完全對應題目『雲端為基礎+高度可擴展+低維運+支援 PromQL』的所有要求。", "zh": "啟用 Google Cloud Managed Service for Prometheus，大規模監控並對你的工作負載發出警報。"}, {"letter": "D", "analysis": "錯誤：『建立』一套 SaaS 式、相容 Prometheus 的自訂解決方案，代表要自己從頭開發、維護整套系統，完全違反題目要求的『低維運』，而且也不是『企業級』現成解決方案的做法。", "zh": "打造一套 SaaS 式、相容 Prometheus 的解決方案，以可自訂的方式為每個雲端顯示指標。"}], "notes": [{"heading": "題目在問什麼", "body": "管理一個高度分散、混合雲與多雲的 IT 環境，開發人員高度仰賴 Prometheus。需要一套雲端為基礎、高度可擴展、低維運的企業級解決方案，支援 PromQL 查詢、快速查看指標、高效診斷問題。"}, {"heading": "⚠️ 答案存疑：我認為應該是 C，不是存的答案 A", "body": "題目明確要求『low-maintenance（低維運）』——選項 A 要自己在多雲環境部署、營運 Prometheus Operator，代表還是要自己扛起擴展、高可用、儲存、跨叢集聯合查詢這些事情，跟『低維運』的要求完全相反。選項 C（Google Cloud Managed Service for Prometheus）才是 Google 官方專門為這個情境打造的全託管服務：原生支援 PromQL、可擴展、低維運、明確支援混合雲/多雲（不限 GKE）。曾派background查證這題在 ExamTopics 原始討論頁的社群投票，連結本身一樣回傳 404（查無資料），找不到任何討論或投票紀錄可以核對。這很可能是題庫裡一個過時/錯誤的答案——GMP 是在 2022-2023 年才正式 GA（正式推出）的服務，這題所在的題庫可能是在這之前就編寫好的，存的答案 A 帶有『舊答案還沒跟上新功能』的典型特徵。信心中高，技術邏輯清楚（有 Google 官方文件佐證），但無法做最終的社群共識核對。"}, {"heading": "服務介紹：Google Cloud Managed Service for Prometheus（GMP）", "body": "是什麼：Google Cloud 全託管、跨多雲、跨專案的 Prometheus/OpenTelemetry 指標監控解決方案，原生支援 PromQL 查詢（既有的 Grafana 儀表板、基於 PromQL 的警報都能直接沿用）。\n解決什麼問題：讓已經習慣用 Prometheus 生態系（PromQL、既有的監控規則/儀表板）的團隊，不用自己架設、擴展、維護 Prometheus 伺服器叢集，就能享有雲端等級的可擴展性和可靠性。\n在這題的應用：收集器（collector）可以跑在地端環境和其他雲端（不限 GKE），資料統一送進 Google 的後端儲存（跟 Cloud Monitoring 共用後端）並支援全域查詢，精準對應題目『混合雲/多雲+低維運+支援 PromQL』的要求。\n常見程度：近年 GCP 主推的可觀測性服務之一，是『既有 Prometheus 生態系想遷移到雲端託管』情境的標準正解。"}, {"heading": "為什麼自己部署 Prometheus Operator 不算『低維運』", "body": "Prometheus Operator 是 Kubernetes 生態系裡的開源工具，透過自訂資源（如 ServiceMonitor、PrometheusRule）簡化在單一叢集內管理 Prometheus 的生命週期，但它解決的是『部署設定的便利性』，不是『誰來負責擴展、儲存、跨叢集/跨雲聯合查詢』這個根本問題——這些依然要由你自己的團隊規劃與維運，尤其是『跨多雲環境』這種情境，還要自己處理跨叢集資料聯合（federation）的複雜度，這正是題目要求『低維運』想要避免的事。"}, {"heading": "什麼是 Prometheus 與 PromQL", "body": "是什麼：Prometheus 是一套開源的監控與指標收集系統，原本由 SoundCloud 開發、後來捐給 CNCF（雲原生運算基金會）維護，現在幾乎是容器化/Kubernetes 生態系裡監控的事實標準。它會定期主動『拉取』（pull model）各個應用程式、伺服器暴露出來的指標（例如 CPU 使用率、請求數、回應時間），把這些隨時間變化的數字存起來，供查詢、畫圖、設定警報規則使用。\nPromQL（Prometheus Query Language）：Prometheus 自己的查詢語言，專門用來對時間序列指標資料做運算和篩選（例如『過去 5 分鐘內錯誤請求佔全部請求的比例』）。因為 Prometheus 太普及，PromQL 本身也變成一種事實標準，很多監控工具即使底層不是真正的 Prometheus，也會支援 PromQL 查詢，讓熟悉這套語法的工程師可以直接沿用。\n在這題的應用：題目強調『開發人員高度仰賴 Prometheus』，代表公司已經圍繞 Prometheus 建立起一整套查詢、警報規則、Grafana 儀表板，如果換一套不支援 PromQL 的監控系統，這些既有投資全部要重寫，所以新方案必須支援 PromQL 才能無縫接軌，這正是 Google Cloud Managed Service for Prometheus 被設計成原生支援 PromQL 的原因。\n常見程度：Kubernetes/雲原生監控生態系的核心工具，GCP 考試中『混合雲/多雲監控』情境常考的背景知識。"}]}}, {"id": "T1-Q264", "topic": 1, "qnum": 264, "question": "Your organization uses Google Kubernetes Engine (GKE) and Amazon Elastic Kubernetes Service (EKS) to manage a complex Kubernetes environment across multiple cloud providers. You need to deploy a solution that streamlines configuration management, enforces security policies, and ensures consistent application deployment across all of the environments. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Leverage Argo CD for GitOps-based continuous delivery and Open Policy Agent (OPA) for policy enforcement, and develop a controller for multi-cluster configuration management."}, {"letter": "B", "text": "Deploy Crossplane for managing cloud resources as Kubernetes objects, FluxCD for GitOps-based configuration synchronization, and Kyverno for policy enforcement."}, {"letter": "C", "text": "Deploy Kustomize for configuration customization, Config Sync with multiple Git repositories, and a script to enforce security policies."}, {"letter": "D", "text": "Utilize Config Sync as part of GKE to synchronize configurations from a centralized repository, and utilize Policy Controller to enforce policies using OPA Gatekeeper."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383613-exam-professional-cloud-architect-topic-1-question-264/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["GKE/Kubernetes", "混合雲", "Organization Policy"], "keywords": ["streamlines configuration management, enforces security policies, and ensures consistent application deployment across all of the environments"], "explanation": {"questionZh": "你的組織使用 Google Kubernetes Engine（GKE）和 Amazon Elastic Kubernetes Service（EKS），來管理一個跨多個雲端供應商的複雜 Kubernetes 環境。你需要部署一套解決方案，來簡化設定管理、強制執行安全政策，並確保在所有環境中應用程式部署都保持一致。你想要遵循 Google 建議的做法。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Argo CD 和 OPA 方向合理，但『develop a controller（自己開發一個控制器）』意味著要自己額外寫程式、維護一個客製化系統來處理多叢集設定管理，不是使用現成的 Google 建議做法，而是自己動手造輪子，增加開發和維運負擔。", "zh": "善用 Argo CD 做基於 GitOps 的持續交付，用 Open Policy Agent（OPA）做政策執行，並開發一個用於多叢集設定管理的控制器。"}, {"letter": "B", "analysis": "錯誤：Crossplane、FluxCD、Kyverno 都是獨立的開源專案，技術上都能用，但這是自己要整合三套不同來源的開源工具，不是 Google 官方整合好的解決方案，也不符合遵循 Google 建議做法的要求。", "zh": "部署 Crossplane 把雲端資源當作 Kubernetes 物件來管理，用 FluxCD 做基於 GitOps 的設定同步，並用 Kyverno 做政策執行。"}, {"letter": "C", "analysis": "錯誤：Config Sync 這部分方向正確（屬於 Google 官方 Anthos Config Management 套件），但『用腳本來強制執行安全政策』又是自己動手寫客製化邏輯，Google 其實有專門的政策執行工具（Policy Controller），用腳本土法煉鋼不是 Google 建議做法，是繞過了現成官方工具自己兜一套。", "zh": "部署 Kustomize 做設定客製化，搭配多個 Git repository 的 Config Sync，並用一個腳本來強制執行安全政策。"}, {"letter": "D", "analysis": "正確：Config Sync 和 Policy Controller 都是 Google 官方 Anthos Config Management 套件底下的正式產品，專門為多叢集、多雲環境的設定管理和政策治理設計，不需要自己開發控制器、不需要自己整合多個第三方開源專案、也不需要自己寫腳本，是 Google 官方現成、整合好的標準解決方案。", "zh": "利用 GKE 內建的 Config Sync，從一個集中式倉庫同步設定，並利用 Policy Controller（底層使用 OPA Gatekeeper）來強制執行政策。"}], "notes": [{"heading": "題目在問什麼", "body": "組織同時用 GKE 和 Amazon EKS 管理跨多個雲端供應商的複雜 Kubernetes 環境。需要簡化設定管理、強制執行安全政策、確保所有環境的應用程式部署一致，而且要遵循 Google 建議做法。"}, {"heading": "答案驗證：D", "body": "看到『多叢集/混合雲環境需要統一設定管理+強制政策+要遵循 Google 建議做法』，優先想到 Config Sync + Policy Controller 這組 Google 官方整合方案（屬於 Anthos Config Management），而不是自己兜湊第三方開源工具（Argo CD、FluxCD、Crossplane、Kyverno 等）或自己開發腳本/控制器——後者雖然技術上可行，但不符合遵循官方建議做法這個明確要求。信心高。"}, {"heading": "服務介紹：Config Sync", "body": "是什麼：GKE/Anthos 底下的一項功能，讓你把叢集的設定（例如 Kubernetes 資源的定義）集中寫在一個 Git 倉庫裡，Config Sync 會持續自動把 Git 倉庫裡定義的狀態，同步套用到指定的所有叢集（包括 GKE，也能涵蓋透過 Anthos 連接的 EKS 等非 GKE 叢集）。\n解決什麼問題：這是一種 GitOps（用 Git 當作唯一真實來源來管理基礎設施設定）的實踐方式，確保所有環境的設定維持一致，不用手動在每個叢集逐一設定。\n在這題的應用：負責『簡化設定管理+確保一致部署』這部分需求。\n常見程度：GCP 考試中『多叢集/混合雲設定治理』情境的標準核心服務。"}, {"heading": "服務介紹：Policy Controller（底層為 OPA Gatekeeper）", "body": "是什麼：Google 官方整合的政策執行工具，底層技術是開源的 OPA Gatekeeper，讓你用宣告式的規則（例如『所有 Pod 都必須設定資源限制』『不能用 latest 標籤的容器映像檔』）大規模強制套用到所有叢集，不符合規則的部署會被直接擋下來。\n解決什麼問題：不需要自己寫腳本去逐一檢查每個部署是否符合安全/合規規則，用宣告式規則集中管理、自動強制執行。\n在這題的應用：負責『強制執行安全政策』這部分需求。\n常見程度：GCP 考試中『多叢集政策治理』情境的標準核心服務，與 Config Sync 常常搭配出現。"}, {"heading": "名詞快速對照：這題出現的開源工具", "body": "Argo CD：開源的 Kubernetes GitOps 持續部署工具，跟 Config Sync 功能類似但是獨立的第三方專案。\nFluxCD：另一套開源的 GitOps 同步工具，功能定位也跟 Config Sync 類似。\nCrossplane：開源工具，讓你用 Kubernetes 的方式去管理雲端資源（把雲端資源也當成 Kubernetes 物件操作）。\nKyverno：開源的 Kubernetes 原生政策引擎，功能定位類似 Policy Controller/OPA Gatekeeper。\nKustomize：Kubernetes 官方的設定客製化工具，讓你用疊加（overlay）的方式管理不同環境的設定差異，但本身不負責『同步』或『政策執行』。\n記憶重點：這些都是技術上可行的替代方案，但題目特別強調『遵循 Google 建議做法』，所以要優先選擇 Google 官方整合好的 Config Sync + Policy Controller，而不是這些第三方開源工具的組合。"}]}}, {"id": "T1-Q265", "topic": 1, "qnum": 265, "question": "Your company is rapidly deploying containerized microservices on Google Kubernetes Engine (GKE) using a robust CI/CD pipeline. Security is a top priority, and you need to implement a comprehensive and efficient strategy to prevent container image vulnerabilities from reaching your GKE production environment. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Review the security reports generated by Artifact Analysis for each container image before deployment to GKE."}, {"letter": "B", "text": "Incorporate vulnerability scanning before building container images, and use Google-maintained base images for your container deployments."}, {"letter": "C", "text": "Enable Artifact Analysis for the container images, and stop deployment if critical vulnerabilities are found."}, {"letter": "D", "text": "Use a custom security policy within your container image that restricts access to specific network ports and resources."}, {"letter": "E", "text": "Enable Shielded GKE Nodes on the production cluster to automatically block the execution of container images with known vulnerabilities."}], "answer": "BC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383575-exam-professional-cloud-architect-topic-1-question-265/", "postedDate": "2026-02-10", "postedYear": 2026, "tags": ["GKE/Kubernetes", "容器化", "安全性", "CI/CD"], "keywords": ["implement a comprehensive and efficient strategy to prevent container image vulnerabilities from reaching your GKE production environment"], "explanation": {"questionZh": "你的公司正在用一套強大的 CI/CD 管線，在 Google Kubernetes Engine（GKE）上快速部署容器化的微服務。安全是最優先考量，你需要實作一套全面且高效的策略，防止容器映像檔的漏洞進入到你的 GKE 正式環境。你該怎麼做？（請選擇兩項）", "optionTable": [{"letter": "A", "analysis": "錯誤：Artifact Analysis 這個工具沒錯，但流程是人工審查報告——每次部署都要有人手動去看報告、手動判斷要不要放行，沒有效率，也沒有強制力，就算報告顯示有嚴重漏洞，也只是給人看，沒有任何機制真的擋下來，不符合題目要『全面且高效』『防止』的要求。", "zh": "在部署到 GKE 之前，審查 Artifact Analysis 為每個容器映像檔產生的安全報告。"}, {"letter": "B", "analysis": "正確：在建置容器映像檔之前先做漏洞掃描，是從源頭就開始防範（shift left，盡早檢查）；搭配使用 Google 維護的基礎映像檔，這些映像檔會持續被更新、修補已知的安全漏洞，比來源不明的基礎映像檔風險低很多，兩者加起來從一開始就大幅降低有漏洞的東西被建置出來的機率。", "zh": "在建置容器映像檔之前先納入漏洞掃描，並在容器部署時使用 Google 維護的基礎映像檔。"}, {"letter": "C", "analysis": "正確：跟 A 最大的差別在於『停止部署』——這是把漏洞掃描整合進 CI/CD 管線裡的自動化關卡，掃描結果顯示有嚴重漏洞，管線自動擋下部署，不需要人工介入判斷，是真正有強制力的自動化防護機制。", "zh": "為容器映像檔啟用 Artifact Analysis，如果發現嚴重漏洞就停止部署。"}, {"letter": "D", "analysis": "錯誤：這是另一個安全層面的概念——限制容器執行時能存取哪些網路埠/資源，比較像是縮小萬一真的被入侵之後的攻擊範圍（防禦縱深），跟題目要求的『防止有漏洞的映像檔進到正式環境』（漏洞掃描與部署關卡）是不同的問題，答非所問。", "zh": "在容器映像檔內使用自訂安全政策，限制對特定網路埠和資源的存取。"}, {"letter": "E", "analysis": "錯誤：Shielded GKE Nodes 保護的是節點（VM）本身——確保開機過程沒有被植入惡意程式（安全開機、完整性監控等），保護對象是『這台機器有沒有被竄改』，不會去檢查放進去的容器映像檔裡有沒有已知的套件漏洞，這個選項的描述混淆了 Shielded Nodes 的實際功能，它根本不做這件事。", "zh": "在正式環境叢集上啟用 Shielded GKE Nodes，以自動阻擋含已知漏洞的容器映像檔執行。"}], "notes": [{"heading": "題目在問什麼", "body": "公司用 CI/CD 管線在 GKE 上快速部署容器化微服務。安全是最優先考量，需要一套全面且高效的策略，防止容器映像檔的漏洞進到 GKE 正式環境。這是複選題，答案有兩個字母。"}, {"heading": "答案驗證：B+C", "body": "這題的防護邏輯是『從源頭降低風險（B）+ 流程中自動攔截（C）』——B 負責讓一開始就盡量少產生有漏洞的東西（早期掃描+用乾淨的基礎映像檔），C 負責萬一真的有漏洞還是被做出來了，部署前自動擋下來，不讓它流到正式環境，兩者是互補的兩道防線，比起 A（純人工審查，沒有強制力）或 D、E（防護對象根本不對）更完整也更自動化。看到『防止有漏洞的容器進到正式環境+要全面且高效』，優先想到『盡早掃描（shift left）+用受信任的基礎映像檔+管線自動化擋下有問題的部署』這套組合；如果選項只是人工看報告而沒有自動擋下的動作，通常不算是真正有效的 prevent 機制。信心高。"}, {"heading": "什麼是 Shift Left（左移）", "body": "是什麼：把安全檢查、測試等品質把關動作，從流程的後期（例如部署後才發現問題）往前移到流程的早期（例如建置映像檔之前就先掃描），因為越早發現問題，修復成本越低、影響範圍越小。\n解決什麼問題：避免問題一路流到接近正式環境才被發現，那時候修復成本已經很高（可能已經有真實使用者受影響）。\n在這題的應用：B 選項『在建置容器映像檔之前先做漏洞掃描』正是 shift left 的實踐。\n常見程度：DevSecOps（把安全融入開發流程）的核心理念，GCP 考試中『CI/CD 安全強化』情境常考的概念。"}, {"heading": "服務介紹：Artifact Analysis", "body": "是什麼：GCP 掃描容器映像檔漏洞的服務，會檢查映像檔裡包的軟體套件版本，有沒有被公開通報的已知安全漏洞（CVE）。\n解決什麼問題：不用自己手動去比對每個套件版本是否有已知漏洞，自動化掃描並產出報告。\n在這題的應用：關鍵不是『有沒有用 Artifact Analysis』（A、C 都有用），而是『用了之後，有沒有一個自動化機制根據掃描結果真的擋下部署』——C 選項明確做到這點，A 只停留在人工審查報告。\n常見程度：GCP 考試中『容器安全/漏洞管理』情境的核心服務。"}, {"heading": "基礎知識：Shielded GKE Nodes 保護的是什麼層級（Node vs Pod vs Image）", "body": "整個堆疊由上到下是：容器映像檔（Image）→ 被部署成 Pod（執行中的容器）→ 被排程到 Node（跑 Pod 的那台 VM）→ 屬於 Cluster（叢集）。\n這題的漏洞掃描（Artifact Analysis）發生在映像檔還躺在 Artifact Registry、根本還沒被拿去啟動成任何 Pod 之前，檢查的是『映像檔裡面包的軟體套件版本有沒有已知漏洞』，跟這個映像檔之後會被排程到哪個 Pod、哪個 Node 完全無關。\nShielded GKE Nodes 保護的是地基層級——不管最後排程了哪個映像檔、哪個 Pod，它關心的是『承載這一切的那台實體機器，開機過程有沒有被植入惡意程式（rootkit/bootkit）』，用 Secure Boot（安全開機，驗證每一層開機軟體的簽章）、vTPM（虛擬可信平台模組，硬體級金鑰與完整性驗證）、Integrity Monitoring（持續比對機器開機後狀態是否異常）三個機制達成。\n這跟『容器映像檔內容有沒有漏洞』是完全獨立的兩個問題，保護的對象根本不同，所以 E 選項把兩者混為一談是不成立的，是這題的技術陷阱。"}, {"heading": "基礎知識：一個 Pod 可以有多個 Container/Image 嗎", "body": "可以。Pod 是 Kubernetes 裡『排程的最小單位』，不是『容器的最小單位』——一個 Pod 可以包含多個 Container（容器），每個 Container 都是從它自己的 Image（映像檔）啟動出來的。同一個 Pod 裡的所有容器，一定會被排程到同一台 Node 上，並共用同一個網路命名空間（可以用 localhost 互相溝通）和部分儲存空間（volume）。\n最常見的多容器模式是 Sidecar（側車）：一個主要容器負責應用程式邏輯，旁邊搭一個輔助性容器做周邊工作，例如日誌收集、或像 Cloud Service Mesh 常用的做法——在每個 Pod 裡自動塞一個 Envoy proxy 容器，專門處理進出流量（加密、流量控管、監控），主容器完全不用改程式碼。另外還有 Init Container（初始化容器）：Pod 啟動時先跑完這些容器（例如先確認資料庫就緒），確定都完成後主容器才開始啟動，這些初始化容器用的也可以是跟主容器完全不同的映像檔。\n常見程度：Kubernetes 架構設計的基礎概念，理解它有助於釐清『漏洞掃描到底在檢查哪個層級的東西』這類考題的邏輯。"}]}}, {"id": "T1-Q266", "topic": 1, "qnum": 266, "question": "Your organization is implementing a new cloud-native application on Google Cloud and needs to ensure compliance with the ISO/IEC 27001 framework. You want to leverage Google Cloud’s security reports and documentation to support your ISO/IEC 27001 audit process. What should you do?", "options": [{"letter": "A", "text": "Engage an independent auditor to conduct an ISO/IEC 27001 audit of your organization's Google Cloud implementation."}, {"letter": "B", "text": "Download the ISO/IEC 27001 report for Google Cloud through internet search."}, {"letter": "C", "text": "Review the Compliance Reports Manager for information about ISO/IEC 27001 compliance and related documentation on obtaining reports through your Google Cloud account."}, {"letter": "D", "text": "Utilize the Cloud Audit Logs service for accessing and requesting the ISO/IEC 27001 reports."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383598-exam-professional-cloud-architect-topic-1-question-266/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["合規性"], "keywords": ["leverage Google Cloud's security reports and documentation to support your ISO/IEC 27001 audit process"], "explanation": {"questionZh": "你的組織正在 Google Cloud 上實作一個新的雲端原生應用程式，需要確保符合 ISO/IEC 27001 框架的合規要求。你想要善用 Google Cloud 的安全報告和文件，來支援你的 ISO/IEC 27001 稽核流程。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：ISO 27001 認證的本質就是要有獨立、合格的第三方稽核機構，實際檢視組織的管理系統並出具正式認證，這是唯一能讓你的組織真正拿到這張認證的途徑。Google Cloud 平台本身的認證不會自動延伸到你蓋在上面的應用程式和組織自己的管理流程。", "zh": "聘請一位獨立稽核員，對你組織在 Google Cloud 上的實作進行 ISO/IEC 27001 稽核。"}, {"letter": "B", "analysis": "錯誤：Google 官方的合規報告通常需要透過官方管道、驗證身分後才能取得（很多甚至需要簽署保密協議才能看到完整內容），隨便用網路搜尋下載的文件真實性和時效性都無法保證，不是嚴謹的合規流程該有的做法。", "zh": "透過網路搜尋，下載 Google Cloud 的 ISO/IEC 27001 報告。"}, {"letter": "C", "analysis": "錯誤：Compliance Reports Manager 是 GCP 主控台裡真實存在的官方工具，可以合法下載 Google 自己的合規文件和認證報告，但這只能幫你拿到 Google 這邊的證明文件，當作稽核過程中的輔助佐證資料，本身不等於組織完成了稽核，不能單靠這個步驟就說自己確保了合規，只回答了『怎麼拿到佐證資料』，沒有回答『怎麼真正確保/取得合規認證』這個更完整的問題。", "zh": "查看 Compliance Reports Manager，了解 ISO/IEC 27001 合規相關資訊，以及透過你的 Google Cloud 帳戶取得報告的相關文件。"}, {"letter": "D", "analysis": "錯誤：Cloud Audit Logs 是記錄誰在 GCP 裡做了什麼操作的服務（例如誰修改了防火牆規則），跟取得合規認證報告完全無關，角色用錯了，技術上也做不到。", "zh": "利用 Cloud Audit Logs 服務來存取並申請 ISO/IEC 27001 報告。"}], "notes": [{"heading": "題目在問什麼", "body": "組織要在 GCP 上建置新的雲端原生應用程式，需要確保符合 ISO/IEC 27001 框架。想要善用 Google Cloud 的安全報告和文件來支援這個 ISO/IEC 27001 稽核流程。"}, {"heading": "答案驗證：A", "body": "看到『組織要確保自己符合某個合規框架（像 ISO 27001、SOC 2 這類組織層級的認證）』，要優先想到最終還是需要獨立第三方稽核員，正式審查你組織自己的實作——Google 提供的合規報告/文件（透過 Compliance Reports Manager 這類官方工具）是輔助佐證材料，可以拿給稽核員參考，但不能替代稽核這個動作本身。這題考的是『雲端平台的認證 vs 建置在上面的組織/應用程式自己的認證，是兩件不同的事』這個常被混淆的合規概念。信心高。"}, {"heading": "基礎知識：ISO/IEC 27001 與「雲端平台認證」vs「組織自身認證」的差異", "body": "ISO/IEC 27001 是一套國際公認的資訊安全管理系統（ISMS）標準，拿到這個認證代表這個組織有一套完整、持續運作的安全管理流程（風險評估、存取控管、事件應變等），而且通過了獨立第三方稽核機構的正式審查。關鍵重點：這個認證的對象是特定組織、特定範圍的管理系統，不是某個雲端平台。\nGoogle Cloud 自己（作為雲端平台）早就已經是 ISO/IEC 27001 認證過的了，代表 Google 底層的基礎設施（資料中心、硬體、GCP 服務本身的管理流程）符合這個標準。但『你的組織』要實作一個新的應用程式，需要確保『這個應用程式/組織本身』符合 ISO/IEC 27001，這是兩件不同的事——你不能只是下載 Google 的報告就宣稱自己通過認證，Google 的報告只能當作『底層基礎設施這部分沒問題』的佐證資料，提供給審查你的稽核員參考，不能取代稽核這個動作本身。\n題目用的『leverage ... to support your audit process（善用…來支援你的稽核流程）』這個措辭，注意是『支援』不是『取代』，暗示了還是要有一個實際的稽核流程在進行，Google 的報告只是過程中的輔助材料。\n常見程度：這是雲端合規主題裡常被混淆的核心概念，GCP 考試中『組織需要自己取得某項合規認證』情境的標準解題框架。"}, {"heading": "服務介紹：Compliance Reports Manager", "body": "是什麼：GCP 主控台裡的官方工具，讓客戶可以合法下載 Google 自己的各種合規文件和認證報告（例如 ISO 27001 證書、SOC 2/3 報告等），部分敏感報告可能需要先簽署保密協議（NDA）才能取得完整內容。\n解決什麼問題：讓客戶不用到處搜尋、也不用擔心文件真實性，直接從官方管道取得 Google 自己的合規佐證文件。\n在這題的應用：這是取得『佐證資料』的正確管道，但只是整個合規流程裡的一個輔助步驟，不能單靠這一步就說組織完成了自己的合規稽核，這是這題的誤答陷阱。\n常見程度：GCP 考試中『取得 Google 自身合規文件』情境的標準正確工具，但要留意它解決的只是『取得資料』這一半，不是『完成稽核』這整件事。"}]}}, {"id": "T1-Q267", "topic": 1, "qnum": 267, "question": "You are monitoring Google Kubernetes Engine (GKE) clusters in a Cloud Monitoring workspace. As a Site Reliability Engineer (SRE), you need to triage incidents quickly. What should you do?", "options": [{"letter": "A", "text": "1. Navigate the predefined dashboards in the Cloud Monitoring workspace.2. Add metrics and create alert policies."}, {"letter": "B", "text": "1. Write a shell script that gathers metrics from GKE nodes, and publish these metrics to a Pub/Sub topic.2. Export the data to BigQuery. and make a Data Studio dashboard."}, {"letter": "C", "text": "1. Create a custom dashboard in the Cloud Monitoring workspace for each incident.2. Add metrics and create alert policies."}, {"letter": "D", "text": "1. Navigate the predefined dashboards in the Cloud Monitoring workspace.2. Create custom metrics and install alerting software on a Compute Engine instance."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383615-exam-professional-cloud-architect-topic-1-question-267/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "監控與可觀測性"], "keywords": ["you need to triage incidents quickly"], "explanation": {"questionZh": "你正在一個 Cloud Monitoring workspace 裡監控 Google Kubernetes Engine（GKE）叢集。身為一位網站可靠性工程師（SRE），你需要快速檢傷分類（triage）事故。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：GKE 內建許多現成的、預先建好的儀表板（涵蓋叢集、節點、Pod 等各層級健康狀況指標），事故發生時直接打開既有儀表板就能最快掌握問題範圍，完全符合 quickly triage 的核心訴求，再搭配補充額外指標和原生內建的警報政策持續強化監控覆蓋範圍。", "zh": "1. 瀏覽 Cloud Monitoring workspace 裡預先建好的儀表板。2. 新增指標並建立警報政策。"}, {"letter": "B", "analysis": "錯誤：這是從零開始打造一整套自訂的指標收集管線（寫腳本、架 Pub/Sub、處理 BigQuery 匯出、再手動做視覺化儀表板），整個過程曠日廢時，而且 Cloud Monitoring 本來就已經原生支援監控 GKE，等於是重新發明輪子，完全不符合 quickly 的要求。", "zh": "1. 寫一個腳本，從 GKE 節點收集指標，並把這些指標發布到一個 Pub/Sub 主題。2. 把資料匯出到 BigQuery，再做一個 Data Studio 儀表板。"}, {"letter": "C", "analysis": "錯誤：問題出在『為每個事故建立自訂儀表板』這件事——事故正在發生的當下，應該用已經存在、現成可看的視覺化工具去快速定位問題，而不是臨時手忙腳亂地建一個新儀表板（這本身就要花時間設計、挑指標、排版），反而拖慢了快速檢傷分類的速度。", "zh": "1. 在 Cloud Monitoring workspace 裡為每一次事故建立一個自訂儀表板。2. 新增指標並建立警報政策。"}, {"letter": "D", "analysis": "錯誤：前半段看現成儀表板是對的，但後半段在 Compute Engine 執行個體上安裝警報軟體又是多此一舉——Cloud Monitoring 本身就內建警報政策功能，不需要另外找一台機器、自己裝一套第三方警報軟體來做這件事，把簡單的事情複雜化。", "zh": "1. 瀏覽 Cloud Monitoring workspace 裡預先建好的儀表板。2. 建立自訂指標，並在一台 Compute Engine 執行個體上安裝警報軟體。"}], "notes": [{"heading": "題目在問什麼", "body": "在 Cloud Monitoring workspace 裡監控 GKE 叢集。身為 SRE，需要快速檢傷分類（triage）事故。"}, {"heading": "答案驗證：A", "body": "看到『SRE 需要快速檢傷分類事故』，優先想到善用服務本身已經內建、現成準備好的監控工具（像 GKE 的預先建好儀表板），而不是臨時自己動手打造一套全新的監控管線或儀表板——事故發生當下，速度才是重點，任何需要先花時間建置才能用的方案，都跟 quickly（快速）的要求相悖。信心高。"}, {"heading": "什麼是 Triage（檢傷分類）", "body": "是什麼：原本是醫療急診用語——當大量傷患同時湧入，醫護人員要快速判斷誰最嚴重、該優先處理誰。在維運/SRE 的語境裡，triage incidents 指的是事故剛發生時，快速搞清楚『到底是哪裡出問題、嚴重程度多高、該優先處理什麼』的初步判斷過程，重點是快，不是要你立刻修好問題，而是要你快速定位問題範圍。\n在這題的應用：要做到快速 triage，必須仰賴平時就已經準備好、隨時可用的監控工具（現成儀表板），而不是事故發生後才臨時去建置任何新東西。\n常見程度：SRE/維運領域的核心術語，GCP 考試中『事故應變/監控』情境常見的背景知識。"}]}}, {"id": "T2-Q1", "topic": 2, "qnum": 1, "question": "The JencoMart security team requires that all Google Cloud Platform infrastructure is deployed using a least privilege model with separation of duties for administration between production and development resources.What Google domain and project structure should you recommend?", "options": [{"letter": "A", "text": "Create two G Suite accounts to manage users: one for development/test/staging and one for production. Each account should contain one project for every application"}, {"letter": "B", "text": "Create two G Suite accounts to manage users: one with a single project for all development applications and one with a single project for all production applications"}, {"letter": "C", "text": "Create a single G Suite account to manage users with each stage of each application in its own project"}, {"letter": "D", "text": "Create a single G Suite account to manage users with one project for the development/test/staging environment and one project for the production environment"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10396-exam-professional-cloud-architect-topic-2-question-1/", "postedDate": "2019-12-15", "postedYear": 2019, "tags": ["IAM", "Organization Policy"], "keywords": ["least privilege model with separation of duties for administration between production and development resources"], "explanation": {"questionZh": "JencoMart 的安全團隊要求所有 Google Cloud Platform 基礎設施，都必須用最小權限模型部署，而且正式環境與開發環境之間的管理工作要職責分離。你該建議什麼樣的 Google 網域和專案架構？", "optionTable": [{"letter": "A", "analysis": "錯誤：用兩個獨立網域來隔離 prod/dev 是過重的做法，要維護兩套完全獨立的使用者目錄（每個人要在兩邊都有帳號、兩邊使用者管理要分開做），管理負擔非常高，不是 Google 慣用的標準架構模式。", "zh": "建立兩個 G Suite 帳戶來管理使用者：一個管開發/測試/預備環境，一個管正式環境。每個帳戶裡，每個應用程式各自建立一個專案。"}, {"letter": "B", "analysis": "錯誤：除了跟 A 一樣有兩個網域管理負擔很重的問題，還多了一個問題——同一個環境裡的所有應用程式全部擠在同一個專案，意味著只要有權限碰這個開發環境的專案，就能碰到所有應用程式的開發資源，無法針對特定應用程式做更細緻的權限範圍限制，不符合最小權限原則。", "zh": "建立兩個 G Suite 帳戶來管理使用者：一個用單一專案管所有開發應用程式，一個用單一專案管所有正式環境應用程式。"}, {"letter": "C", "analysis": "正確：用單一個 G Suite 帳戶管理使用者（管理負擔最低），但在這個網域底下用專案的粒度做到最精細的切分——每個應用程式的每個環境階段都各自獨立成一個專案，可以針對特定應用程式的特定環境單獨設定 IAM 權限，同時做到最小權限（細到每個應用程式每個階段）跟職責分離（不同環境的管理權限天生被專案邊界隔開）。", "zh": "建立一個單一的 G Suite 帳戶來管理使用者，讓每個應用程式的每個階段都各自擁有自己的專案。"}, {"letter": "D", "analysis": "錯誤：方向對了一半（統一網域、prod/dev 分開），但粒度不夠細——如果公司有多個應用程式，全部開發環境資源都擠在同一個開發專案裡，有權限碰某個應用程式的開發環境，就等於有權限碰到所有應用程式的開發環境，無法針對單一應用程式做權限隔離，違反最小權限原則。", "zh": "建立一個單一的 G Suite 帳戶來管理使用者，用一個專案管理開發/測試/預備環境，另一個專案管理正式環境。"}], "notes": [{"heading": "題目在問什麼", "body": "JencoMart 安全團隊要求所有 GCP 基礎設施，必須用最小權限原則部署，而且正式環境和開發環境之間的管理工作要職責分離。該建議什麼樣的 Google 網域和專案架構？"}, {"heading": "答案驗證：C", "body": "GCP 架構設計的一個經典原則是『偏好多個細粒度的小專案，而不是少數幾個大雜燴專案』——專案本身就是 IAM 權限隔離的天然邊界，切得越細（依照『應用程式 × 環境階段』的組合各自獨立），就越能同時滿足『最小權限』和『職責分離』這兩個要求；而『要不要分成多個 G Suite 帳戶/網域』通常不是用來做這種環境隔離的工具（那樣做管理負擔太重），單一網域 + 多專案架構才是標準做法。信心高。"}, {"heading": "基礎知識：G Suite/Google Workspace 帳戶 vs GCP 專案", "body": "G Suite 帳戶（現在叫 Google Workspace）：可以理解成一整套獨立的使用者網域/身分目錄，每個 G Suite 帳戶都是一個完全獨立的使用者管理體系（自己的一批帳號、自己的網域名稱）。\nGCP 專案（Project）：GCP 資源階層裡實際權限隔離的最小單位，一個網域底下可以有任意數量的專案，每個專案可以設定各自獨立的 IAM 權限。\n解決什麼問題：當需要對不同的應用程式/環境做精細的權限區隔時，應該靠『增加更多細粒度的專案』來達成，而不是靠『建立更多獨立網域』——後者會造成使用者管理的重複負擔（同一個人要在多個網域各自建帳號），不符合『集中管理使用者身分、但精細切分資源權限』的設計原則。\n在這題的應用：正確答案選擇單一網域+每個應用程式每個階段各自一個專案，而非多網域的做法，正是這個原則的體現。\n常見程度：GCP 考試中『多應用程式/多環境的權限治理』情境的核心基礎知識，是較早期但經典的 PCA 考題。"}, {"heading": "基礎知識：最小權限原則（Least Privilege）與職責分離（Separation of Duties）", "body": "最小權限原則：每個人/每個團隊只應該拿到完成工作所必須的最小權限，不多不少。\n職責分離：不同職責的人（例如開發 vs. 正式環境維運）權限範圍要能明確區隔開，不能一個人同時有權限碰到不該碰的環境。\n在這題的應用：用『每個應用程式每個階段各自一個專案』的架構，可以精準地只對需要存取特定應用程式特定環境的人授予權限，天然同時達成這兩個安全原則。\n常見程度：資安/治理領域的基礎概念，幾乎所有 GCP 考試中涉及 IAM 權限設計的題目都會圍繞這兩個原則出題。"}]}}, {"id": "T2-Q2", "topic": 2, "qnum": 2, "question": "A few days after JencoMart migrates the user credentials database to Google Cloud Platform and shuts down the old server, the new database server stops responding to SSH connections. It is still serving database requests to the application servers correctly.What three steps should you take to diagnose the problem? (Choose three.)", "options": [{"letter": "A", "text": "Delete the virtual machine (VM) and disks and create a new one"}, {"letter": "B", "text": "Delete the instance, attach the disk to a new VM, and investigate"}, {"letter": "C", "text": "Take a snapshot of the disk and connect to a new machine to investigate"}, {"letter": "D", "text": "Check inbound firewall rules for the network the machine is connected to"}, {"letter": "E", "text": "Connect the machine to another network with very simple firewall rules and investigate"}, {"letter": "F", "text": "Print the Serial Console output for the instance for troubleshooting, activate the interactive console, and investigate"}], "answer": "CDF", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11917-exam-professional-cloud-architect-topic-2-question-2/", "postedDate": "2020-01-14", "postedYear": 2020, "tags": ["Compute Engine", "VPC/網路", "監控與可觀測性"]}, {"id": "T2-Q3", "topic": 2, "qnum": 3, "question": "JencoMart has decided to migrate user profile storage to Google Cloud Datastore and the application servers to Google Compute Engine (GCE). During the migration, the existing infrastructure will need access to Datastore to upload the data.What service account key-management strategy should you recommend?", "options": [{"letter": "A", "text": "Provision service account keys for the on-premises infrastructure and for the GCE virtual machines (VMs)"}, {"letter": "B", "text": "Authenticate the on-premises infrastructure with a user account and provision service account keys for the VMs"}, {"letter": "C", "text": "Provision service account keys for the on-premises infrastructure and use Google Cloud Platform (GCP) managed keys for the VMs"}, {"letter": "D", "text": "Deploy a custom authentication service on GCE/Google Kubernetes Engine (GKE) for the on-premises infrastructure and use GCP managed keys for the VMs"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/12793-exam-professional-cloud-architect-topic-2-question-3/", "postedDate": "2020-01-26", "postedYear": 2020, "tags": ["IAM", "資料遷移", "安全性"]}, {"id": "T2-Q4", "topic": 2, "qnum": 4, "question": "JencoMart has built a version of their application on Google Cloud Platform that serves traffic to Asia. You want to measure success against their business and technical goals.Which metrics should you track?", "options": [{"letter": "A", "text": "Error rates for requests from Asia"}, {"letter": "B", "text": "Latency difference between US and Asia"}, {"letter": "C", "text": "Total visits, error rates, and latency from Asia"}, {"letter": "D", "text": "Total visits and average latency for users from Asia"}, {"letter": "E", "text": "The number of character sets present in the database"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/14318-exam-professional-cloud-architect-topic-2-question-4/", "postedDate": "2020-02-17", "postedYear": 2020, "tags": ["監控與可觀測性"]}, {"id": "T2-Q5", "topic": 2, "qnum": 5, "question": "The migration of JencoMart's application to Google Cloud Platform (GCP) is progressing too slowly. The infrastructure is shown in the diagram. You want to maximize throughput.What are three potential bottlenecks? (Choose three.)", "options": [{"letter": "A", "text": "A single VPN tunnel, which limits throughput"}, {"letter": "B", "text": "A tier of Google Cloud Storage that is not suited for this task"}, {"letter": "C", "text": "A copy command that is not suited to operate over long distances"}, {"letter": "D", "text": "Fewer virtual machines (VMs) in GCP than on-premises machines"}, {"letter": "E", "text": "A separate storage layer outside the VMs, which is not suited for this task"}, {"letter": "F", "text": "Complicated internet connectivity between the on-premises infrastructure and GCP"}], "answer": "ACF", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6708-exam-professional-cloud-architect-topic-2-question-5/", "postedDate": "2019-10-17", "postedYear": 2019, "tags": ["Interconnect/VPN", "資料遷移", "效能調校"]}, {"id": "T2-Q6", "topic": 2, "qnum": 6, "question": "JencoMart wants to move their User Profiles database to Google Cloud Platform.Which Google Database should they use?", "options": [{"letter": "A", "text": "Cloud Spanner"}, {"letter": "B", "text": "Google BigQuery"}, {"letter": "C", "text": "Google Cloud SQL"}, {"letter": "D", "text": "Google Cloud Datastore"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8497-exam-professional-cloud-architect-topic-2-question-6/", "postedDate": "2019-11-18", "postedYear": 2019, "tags": ["Datastore/Firestore", "資料庫Schema設計"]}, {"id": "T3-Q1", "topic": 3, "qnum": 1, "question": "Your team is in charge of creating a payment card data vault for card numbers used to bill tens of thousands of viewers, merchandise consumers, and season ticket holders. You need to implement a custom card tokenization service that meets the following requirements:* It must provide low latency at minimal cost.* It must be able to identify duplicate credit cards and must not store plaintext card numbers.* It should support annual key rotation.Which storage approach should you adopt for your tokenization service?", "options": [{"letter": "A", "text": "Store the card data in Secret Manager after running a query to identify duplicates."}, {"letter": "B", "text": "Encrypt the card data with a deterministic algorithm stored in Firestore using Datastore mode."}, {"letter": "C", "text": "Encrypt the card data with a deterministic algorithm and shard it across multiple Memorystore instances."}, {"letter": "D", "text": "Use column-level encryption to store the data in Cloud SQL."}], "answer": "B", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/65937-exam-professional-cloud-architect-topic-3-question-1/", "postedDate": "2021-11-13", "postedYear": 2021, "tags": ["Cloud KMS/加密", "安全性", "案例研究題"]}, {"id": "T3-Q3", "topic": 3, "qnum": 3, "question": "The HRL development team releases a new version of their predictive capability application every Tuesday evening at 3 a.m. UTC to a repository. The security team at HRL has developed an in-house penetration test Cloud Function calledAirwolf. The security team wants to run Airwolf against the predictive capability application as soon as it is released every Tuesday. You need to set up Airwolf to run at the recurring weekly cadence. What should you do?", "options": [{"letter": "A", "text": "Set up Cloud Tasks and a Cloud Storage bucket that triggers a Cloud Function."}, {"letter": "B", "text": "Set up a Cloud Logging sink and a Cloud Storage bucket that triggers a Cloud Function."}, {"letter": "C", "text": "Configure the deployment job to notify a Pub/Sub queue that triggers a Cloud Function."}, {"letter": "D", "text": "Set up Identity and Access Management (IAM) and Confidential Computing to trigger a Cloud Function."}], "answer": "C", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56890-exam-professional-cloud-architect-topic-3-question-3/", "postedDate": "2021-07-02", "postedYear": 2021, "tags": ["Pub/Sub", "Cloud Run/Cloud Functions", "CI/CD", "案例研究題"]}, {"id": "T3-Q4", "topic": 3, "qnum": 4, "question": "HRL wants better prediction accuracy from their ML prediction models. They want you to use Google's AI Platform so HRL can understand and interpret the predictions. What should you do?", "options": [{"letter": "A", "text": "Use Explainable AI."}, {"letter": "B", "text": "Use Vision AI."}, {"letter": "C", "text": "Use Google Cloud's operations suite."}, {"letter": "D", "text": "Use Jupyter Notebooks."}], "answer": "A", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56322-exam-professional-cloud-architect-topic-3-question-4/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Vertex AI/AI-ML", "案例研究題"]}, {"id": "T3-Q5", "topic": 3, "qnum": 5, "question": "HRL is looking for a cost-effective approach for storing their race data such as telemetry. They want to keep all historical records, train models using only the previous season's data, and plan for data growth in terms of volume and information collected. You need to propose a data solution. Considering HRL business requirements and the goals expressed by CEO S. Hawke, what should you do?", "options": [{"letter": "A", "text": "Use Firestore for its scalable and flexible document-based database. Use collections to aggregate race data by season and event."}, {"letter": "B", "text": "Use Cloud Spanner for its scalability and ability to version schemas with zero downtime. Split race data using season as a primary key."}, {"letter": "C", "text": "Use BigQuery for its scalability and ability to add columns to a schema. Partition race data based on season."}, {"letter": "D", "text": "Use Cloud SQL for its ability to automatically manage storage increases and compatibility with MySQL. Use separate database instances for each season."}], "answer": "C", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56326-exam-professional-cloud-architect-topic-3-question-5/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["BigQuery", "成本優化", "資料庫Schema設計", "案例研究題"]}, {"id": "T3-Q6", "topic": 3, "qnum": 6, "question": "A recent finance audit of cloud infrastructure noted an exceptionally high number ofCompute Engine instances are allocated to do video encoding and transcoding. You suspect that these Virtual Machines are zombie machines that were not deleted after their workloads completed. You need to quickly get a list of which VM instances are idle. What should you do?", "options": [{"letter": "A", "text": "Log into each Compute Engine instance and collect disk, CPU, memory, and network usage statistics for analysis."}, {"letter": "B", "text": "Use the gcloud compute instances list to list the virtual machine instances that have the idle: true label set."}, {"letter": "C", "text": "Use the gcloud recommender command to list the idle virtual machine instances."}, {"letter": "D", "text": "From the Google Console, identify which Compute Engine instances in the managed instance groups are no longer responding to health check probes."}], "answer": "C", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56328-exam-professional-cloud-architect-topic-3-question-6/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "成本優化", "案例研究題"]}, {"id": "T4-Q1", "topic": 4, "qnum": 1, "question": "You are responsible for ensuring that EHR's use of Google Cloud will pass an upcoming privacy compliance audit. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Verify EHR's product usage against the list of compliant products on the Google Cloud compliance page."}, {"letter": "B", "text": "Advise EHR to execute a Business Associate Agreement (BAA) with Google Cloud."}, {"letter": "C", "text": "Use Firebase Authentication for EHR's user facing applications."}, {"letter": "D", "text": "Implement Prometheus to detect and prevent security breaches on EHR's web-based applications."}, {"letter": "E", "text": "Use GKE private clusters for all Kubernetes workloads."}], "answer": "AB", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60388-exam-professional-cloud-architect-topic-4-question-1/", "postedDate": "2021-08-23", "postedYear": 2021, "explanation": {"questionZh": "你負責確保 EHR 使用 Google Cloud 的方式能通過即將到來的隱私合規稽核。你該怎麼做？（選兩個）", "optionTable": [{"letter": "A", "analysis": "正確：Google Cloud 官方有一個「合規性資源中心(Compliance Resource Center)」，列出每一項服務對應通過哪些法規/標準認證(例如 HIPAA、ISO、SOC 等)。要通過隱私合規稽核，第一步就是確認 EHR 實際在用的每一項 GCP 產品，都在這份「合規產品清單」裡，若用了不在清單內、不受該法規涵蓋的服務來處理受規範資料，稽核一定會被抓出來。", "zh": "對照 Google Cloud 合規性頁面上的合規產品清單，核對 EHR 所使用的產品。"}, {"letter": "B", "analysis": "正確：EHR 是醫療產業，會處理 PHI(受保護健康資訊)，依美國 HIPAA 法規，任何「業務夥伴(Business Associate)」要替「涵蓋實體(Covered Entity，例如醫療機構)」處理 PHI，雙方必須簽署 BAA(業務夥伴協議)，明定雙方對資料保護的法律責任。Google Cloud 作為雲端供應商要處理 EHR 的健康資料，沒有簽 BAA 等於沒有法律基礎保護這些資料，稽核必定不會過。", "zh": "建議 EHR 與 Google Cloud 簽署業務夥伴協議（BAA）。"}, {"letter": "C", "analysis": "Firebase Authentication 是使用者身分驗證服務，解決『誰可以登入』的問題，跟『隱私合規稽核』(資料本身有沒有依法規要求被妥善保護、有沒有簽對法律文件)是兩個不同層面的問題，選對驗證工具不會讓稽核通過。", "zh": "在 EHR 面向使用者的應用程式中使用 Firebase Authentication。"}, {"letter": "D", "analysis": "Prometheus 是開源的『指標監控/告警』系統，用來收集效能指標(CPU、延遲等)做監控告警，不是設計來『偵測與防止安全性入侵』的工具，這個敘述本身對 Prometheus 的定位就有誤；而且就算真的拿來做安全監控，也是『維運/安全』層面，不是『隱私法規合規』層面要補的東西。", "zh": "實作 Prometheus 來偵測並防止 EHR 網頁應用程式上的安全性入侵。"}, {"letter": "E", "analysis": "GKE Private Cluster 讓叢集節點沒有公開 IP、縮小對外暴露面，是很好的網路安全強化措施，但這是『基礎設施安全架構』的最佳實踐，不是『通過隱私合規稽核』的必要條件——合規稽核看的是有沒有符合特定法規要求的法律文件與產品認證，不是單一網路架構設計細節。", "zh": "對所有 Kubernetes 工作負載使用 GKE 私有叢集。"}], "notes": [{"heading": "題目在問什麼", "body": "EHR Healthcare 即將接受隱私合規稽核，身為負責人要確保 EHR 在 Google Cloud 上的使用方式能通過稽核。EHR 是醫療業，核心法規背景是美國 HIPAA(健康保險可攜性與責任法)，稽核會檢查『有沒有用對服務』和『有沒有簽對法律文件』。"}, {"heading": "答案驗證：AB(官方案例研究標準答案，信心高)", "body": "這題是 Google 官方公開的 Professional Cloud Architect 案例研究(EHR Healthcare)裡的標準題，AB 是被廣泛引用、一致公認的正解，不是存疑題。核心邏輯：A 確保『用的服務本身有法規認證』，B 確保『雲端供應商和客戶之間有法律文件規範資料保護責任』，兩者缺一不可，分別對應『技術層面合規』與『法律層面合規』。"}, {"heading": "基礎知識：什麼是 BAA(Business Associate Agreement，業務夥伴協議)", "body": "是什麼：美國 HIPAA 法規下，『涵蓋實體(Covered Entity)』(醫療機構、保險公司等直接接觸病患健康資料的單位)如果要讓『業務夥伴(Business Associate)』(例如雲端供應商、第三方服務商)代為處理 PHI(受保護健康資訊)，雙方必須簽訂的法律合約，明定業務夥伴對資料保護、通報義務、使用限制等責任。\\n解決什麼問題：沒有 BAA，業務夥伴處理 PHI 在法律上就是違規，不管技術上做了多少安全措施都不算合規；BAA 是『法律層面』的必要條件，技術安全措施(加密、存取控制等)是『技術層面』的必要條件，兩者都要滿足才算真正合規。\\n在這題的應用：B 選項『advise EHR to execute a BAA with Google Cloud』正是補上這個法律層面的必要條件，沒有這張文件，再強的技術架構都無法讓隱私合規稽核通過。\\n常見程度：這是醫療/健康資料相關情境的核心必考概念，只要題目出現『healthcare』『PHI』『HIPAA』『privacy compliance』，幾乎都要考慮 BAA 這個答案方向。"}, {"heading": "基礎知識：Google Cloud 合規性資源中心(Compliance Resource Center)", "body": "是什麼：Google 官方網站上公開列出每一項 GCP 服務分別通過了哪些法規/標準認證(HIPAA、PCI DSS、ISO 27001、SOC 1/2/3、GDPR 相關控制措施等)的對照清單。\\n解決什麼問題：企業要用雲端服務處理受法規管制的資料前，必須先確認『這個服務本身有沒有被認證適合處理這類資料』，不是所有 GCP 服務都適用所有法規情境，誤用未受認證的服務處理受規範資料，稽核一定會抓出來。\\n在這題的應用：A 選項就是要求 EHR 對照這份官方清單，逐一核對目前在用的每一項產品是否都在『HIPAA 合規產品』之列，這是進行隱私合規稽核前必做的基本功課。\\n常見程度：任何牽涉法規合規(HIPAA、PCI DSS、GDPR 等)的考題，第一步驟幾乎都會考『先查官方合規頁面核對產品清單』這個動作。"}, {"heading": "記憶重點", "body": "看到『healthcare』『PHI』『HIPAA』『privacy compliance audit』這類關鍵字，反射想到兩個必要動作：① 查 Google Cloud 合規性資源中心核對『用的服務是否受該法規認證涵蓋』；② 簽署 BAA 補上雲端供應商與客戶之間的法律責任文件。身分驗證(Firebase Auth)、監控工具(Prometheus)、網路架構強化(GKE Private Cluster)都是『資訊安全最佳實踐』，但不等於『法規合規』，考題若問的是『合規稽核』而非『安全加固』，要優先挑『認證清單』和『法律文件』這類答案方向，不要被看起來很安全的技術選項誤導。"}]}, "keywords": ["ensuring that EHR's use of Google Cloud will pass an upcoming privacy compliance audit"], "tags": ["合規性", "案例研究題"]}, {"id": "T4-Q2", "topic": 4, "qnum": 2, "question": "You need to define the technical architecture for securely deploying workloads to Google Cloud. You also need to ensure that only verified containers are deployed using Google Cloud services. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Enable Binary Authorization on GKE, and sign containers as part of a CI/CD pipeline."}, {"letter": "B", "text": "Configure Jenkins to utilize Kritis to cryptographically sign a container as part of a CI/CD pipeline."}, {"letter": "C", "text": "Configure Container Registry to only allow trusted service accounts to create and deploy containers from the registry."}, {"letter": "D", "text": "Configure Container Registry to use vulnerability scanning to confirm that there are no vulnerabilities before deploying the workload."}], "answer": "AD", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60423-exam-professional-cloud-architect-topic-4-question-2/", "postedDate": "2021-08-23", "postedYear": 2021, "explanation": {"questionZh": "你需要定義一套能安全部署工作負載到 Google Cloud 的技術架構。你也需要確保只有經過驗證的容器才會被部署到 Google Cloud 服務上。你該怎麼做？（選兩個）", "optionTable": [{"letter": "A", "analysis": "正確：Binary Authorization 是 GKE 原生的「部署時」安全控管機制，可以設定政策規定——只有通過特定驗證(例如通過 CI/CD 流程裡的簽署步驟)、帶有合法簽章的容器映像檔，才允許被部署到叢集上；沒有合法簽章的映像檔會直接被擋下，無法部署。這正是題目『只允許經過驗證的容器被部署』的標準解法，且是 Google 官方推薦、原生整合、不需要自己額外架設維護的機制。", "zh": "在 GKE 上啟用 Binary Authorization，並把容器簽署步驟整合進 CI/CD 流程。"}, {"letter": "B", "analysis": "Kritis 是比 Binary Authorization 更早期的開源專案，原本用來做容器來源驗證，但它是『驗證者/政策檢查』的角色，實際上不是用來做『加密簽署』這個動作的工具，這個選項把 Kritis 的功能描述錯了。更重要的是，Google 官方現在的建議方向是直接用原生整合、全託管的 Binary Authorization，而不是自己在 Jenkins 裡額外兜一套 Kritis 的流程——後者是更舊、更需要自己維護的做法，不是現在的標準答案方向。", "zh": "設定 Jenkins 使用 Kritis，在 CI/CD 流程中對容器進行加密簽署。"}, {"letter": "C", "analysis": "這個做法管的是『誰(哪個服務帳戶)有權限從 Registry 推送/部署容器』，是存取控制(IAM)層面的措施，確保操作者的身分可信；但它完全沒有檢查『容器映像檔本身的內容』有沒有通過驗證、有沒有弱點、是否被正確簽署——一個被信任的服務帳戶一樣可以推送一個未經驗證、甚至帶有弱點的容器。這題要的是『驗證容器本身』，不是『驗證操作者身分』，方向不對。", "zh": "設定 Container Registry，只允許受信任的服務帳戶從登錄檔建立並部署容器。"}, {"letter": "D", "analysis": "正確：Container/Artifact Registry 的弱點掃描功能會自動掃描容器映像檔裡已知的 CVE(已公開的安全漏洞)，在部署前就能確認這個映像檔乾不乾淨，是『驗證容器內容是否安全』的核心機制之一，直接對應題目『安全部署工作負載』+『確保容器經過驗證』的要求。", "zh": "設定 Container Registry 使用弱點掃描，確認沒有安全漏洞才部署工作負載。"}], "notes": [{"heading": "題目在問什麼", "body": "要設計一套『安全部署工作負載到 GCP』的技術架構，核心要求是『確保只有經過驗證的容器才會被部署』。關鍵在分辨：驗證「容器映像檔本身」(內容/簽章/弱點)，跟驗證「誰有權限操作」(身分/權限)，是兩個不同的安全控制面向，這題問的是前者。"}, {"heading": "答案驗證：AD(EHR 官方案例研究標準題，信心高)", "body": "A(Binary Authorization，部署時擋下未簽署/未驗證的映像檔)和 D(弱點掃描，確認映像檔內容沒有已知安全漏洞)，分別從『簽章驗證』和『弱點驗證』兩個角度，共同構成『只部署經過驗證容器』的完整機制，這是被廣泛引用、一致公認的官方標準答案，不是存疑題。"}, {"heading": "服務介紹：Binary Authorization", "body": "是什麼：GKE(以及 Cloud Run)的部署時安全閘門，透過政策設定『只有符合特定條件(例如通過某個簽署流程、取得特定 attestor 的核可)的容器映像檔才能被部署』，不符合條件的部署請求會被直接擋下。\\n解決什麼問題：防止未經測試、未經核准、甚至被竄改過的映像檔被意外或惡意部署到生產環境，把『驗證』這個動作變成部署流程裡強制執行的關卡，而不是只靠人工流程自律。\\n在這題的應用：把簽署步驟放進 CI/CD 流程(例如測試通過後才簽署)，再搭配 Binary Authorization 在部署端把關，確保『沒簽署 = 不給部署』，完整對應題目需求。\\n常見程度：GCP 考試裡『容器安全部署、只部署驗證過的映像檔』情境的標準答案載體，非常常見。"}, {"heading": "服務介紹：Container/Artifact Registry 弱點掃描(Vulnerability Scanning)", "body": "是什麼：Container Registry(較新的是 Artifact Registry)內建的自動掃描功能，會比對映像檔裡的套件版本跟已知 CVE(公開安全漏洞)資料庫，找出映像檔裡潛藏的已知弱點。\\n解決什麼問題：容器映像檔常常是一層層疊加別人寫好的基礎映像/套件堆出來的，開發者自己未必知道裡面某個底層套件版本其實有公開的安全漏洞，弱點掃描能在部署前自動抓出這類風險，而不是等出事才發現。\\n在這題的應用：D 選項確保『內容乾淨』，跟 A 的『身分/簽章驗證』互補，一起組成題目要求的『只部署經過驗證的容器』。\\n常見程度：非常常見，容器安全情境幾乎必考。"}, {"heading": "概念辨析：Kritis vs Binary Authorization(為什麼 B 不是標準答案)", "body": "Kritis 是比 Binary Authorization 更早的開源專案，角色是『政策檢查者』，驗證容器是否符合某個簽署政策，但它本身不是用來做『加密簽署』這個動作的工具(簽署通常是在 CI/CD 流程裡由專門的簽署步驟/attestor 完成)，B 選項對 Kritis 功能的描述本身就不準確。更關鍵的是，Google 現在的官方建議方向是直接使用原生整合、全託管的 Binary Authorization，不需要像 B 描述的那樣自己在 Jenkins 裡額外兜一套 Kritis 流程來維護——這也是為什麼題目會把 A(用 Binary Authorization)設計成正解，而 B(自組 Kritis 方案)設計成看起來相似但方向較舊的干擾選項。"}, {"heading": "概念辨析：存取控制(IAM) vs 內容驗證(為什麼 C 不是標準答案)", "body": "C 選項做的是『限制誰可以操作 Registry』，這是身分與權限層面的安全措施(確保只有被信任的服務帳戶能推送/部署)，跟『驗證容器映像檔本身的內容是否可信、是否有弱點』是兩個完全不同的安全控制維度。即使操作者的身分百分之百可信，他推送上去的映像檔內容本身依然可能未經測試、帶有弱點，C 完全沒有觸及這層風險，所以不符合題目『驗證容器』的核心訴求。"}, {"heading": "延伸知識：Jenkins、Kritis 是什麼，以及「簽署容器」實際在做什麼", "body": "Jenkins：開源的 CI/CD 自動化工具，負責串起「程式碼推上去 → 自動測試 → 自動建置 → 自動部署」整條流水線，是通用工具、不是 Google 的產品，可以架在任何地方，市場上非常主流。\nKritis：比 Binary Authorization 更早期的開源專案，角色是「政策檢查者」——部署前檢查容器映像檔是否帶有合法的核准證明(attestation)，符合預設的安全政策才放行，不符合就擋下。\n什麼是「簽署容器(sign containers)」：當容器映像檔通過測試/掃描/人工核准後，用加密的方式對這個映像檔的內容算出一個數位簽章，蓋在映像檔上，概念類似公證蓋章——之後任何人要驗證，就用對應的公鑰檢查這個簽章是否有效、內容是否跟簽署當時完全一致(內容被竄改過，驗證就會失敗)。CI/CD 流程裡通常是測試通過後呼叫一個簽署服務(例如搭配 Binary Authorization 的 attestor)產生這份簽章/核准證明。\n三者怎麼串起來：容器建好 → 跑測試/掃描 → 通過 → 簽署(產生「這個通過驗證了」的證明) → 部署前 Binary Authorization 檢查簽章 → 有效才放行。Jenkins 負責跑整條流水線，Kritis(或現在更常用的 Binary Authorization)負責在部署前做檢查這一步，簽署動作則是連接兩者的橋樑。\n選項 D(弱點掃描)的重要細節：掃描本身只是「偵測+回報」，掃描服務自己不會主動擋部署，報告出來後要搭配 CI/CD 流程判斷或 Binary Authorization 的漏洞門檻 attestor，才能真正做到「掃描沒過就不給部署」；A(Binary Authorization)本身就是主動的部署閘門，D 比較像驗血報告，報告要有人看了才會決定讓不讓你進門，兩者角色不完全一樣。"}, {"heading": "記憶重點", "body": "看到『確保只有經過驗證的容器被部署』『容器安全部署』這類關鍵字，反射想到兩個互補的機制：① Binary Authorization(部署時擋下未簽署/未核准的映像檔，驗證『來源與簽章』)；② 弱點掃描(驗證『映像檔內容本身有沒有已知漏洞』)。看到『限制誰有權限操作 Registry』這類選項，要能分辨這是 IAM 存取控制，不等於驗證容器內容本身，不要被『聽起來也跟安全有關』混淆。看到某個開源/自組方案(像 Kritis)跟 GCP 原生全託管服務(像 Binary Authorization)同時出現在選項裡，考試通常傾向選『GCP 原生、官方推薦』的那個。"}]}, "keywords": ["ensure that only verified containers are deployed using Google Cloud services"], "tags": ["GKE/Kubernetes", "CI/CD", "安全性", "案例研究題"]}, {"id": "T4-Q3", "topic": 4, "qnum": 3, "question": "You need to upgrade the EHR connection to comply with their requirements. The new connection design must support business-critical needs and meet the same network and security policy requirements. What should you do?", "options": [{"letter": "A", "text": "Add a new Dedicated Interconnect connection."}, {"letter": "B", "text": "Upgrade the bandwidth on the Dedicated Interconnect connection to 100 G."}, {"letter": "C", "text": "Add three new Cloud VPN connections."}, {"letter": "D", "text": "Add a new Carrier Peering connection."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60403-exam-professional-cloud-architect-topic-4-question-3/", "postedDate": "2021-08-23", "postedYear": 2021, "explanation": {"questionZh": "你需要升級 EHR 的連線，以符合他們的要求。這個新的連線設計必須能支撐關鍵業務需求，並且符合跟原本一樣的網路與安全政策要求。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：Google 官方對「關鍵業務(business-critical)」等級的混合連接架構，建議至少部署兩條 Dedicated Interconnect連線，且位於不同的實體邊緣可用網域(edge availability domain)，才能達到 99.99% 的可用性 SLA。原本只有一條 Interconnect，等於只要這條線路所在的機房/路由器出問題，連線就整個中斷，是單點故障。加一條新的 Dedicated Interconnect，既維持原本『私有專線連接、不經過公開網際網路』的網路與安全政策，又補上冗餘，完全對應題目『支撐關鍵業務』+『維持相同網路與安全政策』兩個要求。", "zh": "新增一條 Dedicated Interconnect 連線。"}, {"letter": "B", "analysis": "把現有這一條 Interconnect 的頻寬升級到 100G，只是讓『同一條線路』能傳輸更多流量，完全沒有解決『這條線路本身故障就會整個斷線』的單點故障問題。題目強調的是『business-critical(關鍵業務)』，核心訴求是可用性/容錯，不是頻寬不足，升級頻寬答錯了題目真正要解決的問題。", "zh": "將現有 Dedicated Interconnect 連線的頻寬升級到 100G。"}, {"letter": "C", "analysis": "Cloud VPN 是透過公開網際網路、用 IPsec 加密通道建立的連線方式，跟 Dedicated Interconnect『完全不經過公開網際網路的私有實體專線』在網路路徑與安全性質上是不同等級的方案。題目要求新設計要『符合跟原本一樣的網路與安全政策要求』，直接換成一種路徑性質不同(走公開網際網路)的連線方式，不符合『維持相同安全政策』這個前提，就算加開三條也無法等同於私有專線的安全層級。", "zh": "新增三條 Cloud VPN 連線。"}, {"letter": "D", "analysis": "Carrier Peering 是透過電信商/網路服務供應商的網路跟 Google 建立連接，比 Dedicated Interconnect 更間接一層，Google 對 Carrier Peering 本身不提供像 Dedicated Interconnect 那樣的 99.99% 可用性 SLA 保證。題目要求的是『支撐關鍵業務』等級的連線，Carrier Peering 在 SLA 保證層級上並不是對等的升級方案，無法滿足關鍵業務對可靠度的要求。", "zh": "新增一條 Carrier Peering 連線。"}], "notes": [{"heading": "題目在問什麼", "body": "EHR 原本只靠一條連線(案例情境裡是 Dedicated Interconnect)連接內部機房和 Google Cloud，現在要升級這個連線設計，條件是：① 要能撐得起『關鍵業務』等級的可靠度需求；② 網路與安全政策要維持跟原本一樣的等級(不能換成安全性質不同的連接方式)。"}, {"heading": "答案驗證：A(已查證 Google 官方關鍵業務連接架構建議)", "body": "Google Cloud 官方混合連接架構指南明確建議：要達到生產環境/關鍵業務等級(99.99% 可用性 SLA)，至少要有兩條 Dedicated Interconnect 連線，且分散在不同的邊緣可用網域，避免單一線路或單一機房故障造成整個連線中斷。A 完全對應這個官方建議，是被廣泛引用、一致公認的標準答案，信心高。"}, {"heading": "基礎知識：為什麼『關鍵業務』等級要用「兩條」Interconnect，不是「升級頻寬」", "body": "只有一條實體線路，不管這條線路頻寬多大，都只是『加大水管直徑』，沒有解決『這條水管本身爆裂(線路故障、機房斷電、人為挖斷光纖)』這個風險，一旦發生，連線會整個中斷，不管頻寬多高都沒用。『關鍵業務』強調的是服務不能中斷(可用性/容錯)，不是傳輸速度不夠快(頻寬)，所以正確方向是『增加一條獨立、分散在不同實體位置的線路做冗餘』，而不是加大單一線路的頻寬——這是考試常考的陷阱：把『容錯/可用性』問題誤判成『效能/頻寬』問題。"}, {"heading": "概念辨析：Dedicated Interconnect vs Cloud VPN vs Carrier Peering，三種混合連接方式的安全與可靠度等級", "body": "Dedicated Interconnect：透過實體專線直接接入 Google 網路，完全不經過公開網際網路，延遲最低、安全性最高(屬於私有連接)，且能拿到最高等級的可用性 SLA(搭配冗餘設計可達 99.99%)，但需要自己有實體機房在 Google 的對接點附近，成本與建置門檻較高。\\nCloud VPN：透過公開網際網路，用 IPsec 加密通道連接，建置快速、成本低，但流量本質上還是走公開網際網路(只是加密保護內容)，跟『完全不經過公開網路』的專線在網路路徑性質上不同，安全政策定位也不同。\\nCarrier Peering：透過合作的電信商/網路服務供應商間接連到 Google 網路，不需要自己直接對接 Google 的機房，建置門檻介於前兩者之間，但 Google 不對 Carrier Peering 本身提供等同 Dedicated Interconnect 的 SLA 保證。\\n在這題的應用：題目要求『維持相同網路與安全政策』，暗示原本用的是 Dedicated Interconnect(私有專線)，答案也必須維持同一種連接性質(私有專線)，才算『相同政策』，直接排除 C(改用公開網路路徑的 VPN)和 D(SLA 等級不同的 Carrier Peering)。"}, {"heading": "記憶重點", "body": "看到『business-critical(關鍵業務)』『支撐關鍵業務需求』，先反射想到『需要容錯/冗餘設計，不是需要更多頻寬』；若情境裡原本用的是 Dedicated Interconnect，標準答案方向通常是『再加一條 Dedicated Interconnect，分散在不同邊緣可用網域，達到 99.99% SLA』。看到『維持相同網路與安全政策』，要留意答案選項是不是換成了路徑性質不同的連接方式(例如從專線換成走公開網際網路的 VPN)，那種換法即使加開多條，也不等於維持原本的安全政策等級。"}]}, "keywords": ["upgrade the EHR connection", "support business-critical needs and meet the same network and security policy requirements"], "tags": ["Interconnect/VPN"]}, {"id": "T4-Q4", "topic": 4, "qnum": 4, "question": "You need to define the technical architecture for hybrid connectivity between EHR's on-premises systems and Google Cloud. You want to follow Google's recommended practices for production-level applications. Considering the EHR Healthcare business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Configure two Partner Interconnect connections in one metro (City), and make sure the Interconnect connections are placed in different metro zones."}, {"letter": "B", "text": "Configure two VPN connections from on-premises to Google Cloud, and make sure the VPN devices on-premises are in separate racks."}, {"letter": "C", "text": "Configure Direct Peering between EHR Healthcare and Google Cloud, and make sure you are peering at least two Google locations."}, {"letter": "D", "text": "Configure two Dedicated Interconnect connections in one metro (City) and two connections in another metro, and make sure the Interconnect connections are placed in different metro zones."}], "answer": "D", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60435-exam-professional-cloud-architect-topic-4-question-4/", "postedDate": "2021-08-24", "postedYear": 2021, "explanation": {"questionZh": "你需要定義 EHR 內部機房系統跟 Google Cloud 之間混合連接的技術架構。你想遵循 Google 針對生產等級(production-level)應用程式的建議做法。考量到 EHR Healthcare 的業務與技術需求，你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "Partner Interconnect 是透過合作服務供應商間接連到 Google 網路，SLA 等級本身就比 Dedicated Interconnect 低一級；而且全部兩條連線都放在『同一個 metro(城市)』，就算分散在不同的邊緣可用網域，一旦這整個城市層級發生重大事件(大規模停電、天災)，還是可能同時影響到這兩條連線，沒有達到 Google 對『生產等級』建議的跨城市備援層級。", "zh": "在同一個 metro(城市)設定兩條 Partner Interconnect 連線，並確保這兩條 Interconnect 連線位於不同的 metro zone。"}, {"letter": "B", "analysis": "Cloud VPN 走的是公開網際網路(用 IPsec 加密通道)，效能與 SLA 等級都比不上 Dedicated/Partner Interconnect 這類實體專線方案；『把 VPN 裝置放在不同機櫃』解決的是機櫃層級的實體備援，格局遠小於 Google 對生產等級混合連接建議的『跨都市/跨 metro』層級備援。", "zh": "從內部機房到 Google Cloud 設定兩條 VPN 連線，並確保內部機房的 VPN 裝置位於不同的機櫃。"}, {"letter": "C", "analysis": "Direct Peering 是直接跟 Google 的邊緣網路對接，主要用在像存取 YouTube、Gmail 等 Google 公開服務流量的場景，Google 並不會對 Direct Peering 提供正式的可用性 SLA 保證，也不是 Google 針對企業要存取 VPC 內部資源的生產級混合連接建議方案；就算跟兩個 Google 據點對等互連，底層缺乏 SLA 保證這個根本問題並沒有被解決。", "zh": "在 EHR Healthcare 和 Google Cloud 之間設定 Direct Peering，並確保至少跟兩個 Google 據點對等互連(peering)。"}, {"letter": "D", "analysis": "正確：這正是 Google 官方文件對『99.99% 可用性(生產關鍵等級)』混合連接架構的標準建議——用 Dedicated Interconnect(最高 SLA 等級的實體專線)，總共 4 條連線，分散在『兩個不同的 metro(城市)』，每個 metro 裡的 2 條連線再分散在不同的 metro zone(邊緣可用網域)。這樣設計下，不管是單一線路故障、單一邊緣據點故障，甚至整個城市層級的事件，都還有另一個城市的連線撐著，達到 Google 對生產等級應用程式建議的最高可用性架構。", "zh": "在一個 metro(城市)設定兩條 Dedicated Interconnect 連線，在另一個 metro 設定另外兩條連線，並確保這些 Interconnect 連線位於不同的 metro zone。"}], "notes": [{"heading": "題目在問什麼", "body": "要幫 EHR 設計內部機房到 Google Cloud 的混合連接架構，明確要求『遵循 Google 針對生產等級應用程式的建議做法』——這句話是解題關鍵，代表要用 Google 官方文件裡『最高可用性等級』的混合連接架構範本，不是隨便一種能連上的方案就算過關。"}, {"heading": "答案驗證：D(已查證 Google 官方生產等級混合連接架構建議)", "body": "Google Cloud 官方混合連接架構指南明確定義：要達到 99.99% 可用性(四個 9，生產關鍵等級)，建議架構是『4 條 Dedicated Interconnect 連線，分散在 2 個不同 metro，每個 metro 內的連線再分散在不同 metro zone』。D 選項完全對應這個官方建議，是被廣泛引用、一致公認的標準答案，信心高。"}, {"heading": "基礎知識：Metro 跟 Metro Zone 是什麼", "body": "Metro(都會區)：指一個城市層級的地理區域，例如東京、法蘭克福、洛杉磯，Google 在這些城市會有多個實體對接據點。\\nMetro Zone(都會區內的邊緣可用網域)：同一個 metro 裡，Google 會把對接據點再分散在至少兩個獨立的邊緣可用網域，確保『同一個城市內』的單一據點故障不會波及另一個據點。\\n兩層備援的意義：只分散在不同 metro zone，防的是『單一據點/單一邊緣機房』層級的故障；要防到『整個城市』層級的事件(大規模停電、天災、區域性網路中斷)，就必須跨到『不同 metro』，這也是為什麼 99.99% 等級的建議架構一定要求『兩個不同 metro』，不是只在『同一個 metro 裡分散據點』就足夠。"}, {"heading": "基礎知識：可用性等級對應的建議連線數量(Google 官方架構範本)", "body": "99.9%(三個 9，一般生產等級)：2 條 Dedicated/Partner Interconnect 連線，位於同一個 metro 的不同 metro zone。\\n99.99%(四個 9，生產關鍵等級)：4 條 Dedicated Interconnect 連線，分散在 2 個不同 metro，每個 metro 內的連線再分散在不同 metro zone(也就是 D 選項的架構)。\\n這題強調『遵循 Google 針對生產等級應用程式的建議做法』且屬於 EHR 這種關鍵業務情境，答案要對應到最高等級(四個 9)的建議架構，而不是三個 9 的基本款(A 選項的架構格局其實接近三個 9 等級，但用錯了連接類型 Partner Interconnect，且仍只在單一 metro)。"}, {"heading": "概念辨析：Dedicated Interconnect vs Partner Interconnect vs Direct Peering vs Cloud VPN，四種方案的 SLA 定位", "body": "Dedicated Interconnect：直接跟 Google 實體對接，SLA 等級最高(搭配正確冗餘可達 99.99%)，但需要自己的設備能實體進駐 Google 的對接據點。\\nPartner Interconnect：透過合作服務供應商間接連到 Google 網路，適合沒辦法直接進駐對接據點的情況，SLA 等級比 Dedicated 略低一級。\\nDirect Peering：直接跟 Google 的邊緣網路對等互連，主要服務於存取 Google 公開服務(搜尋、YouTube、Gmail 等)的流量情境，Google 不提供正式 SLA 保證，不是企業存取 VPC 內部資源的建議生產方案。\\nCloud VPN：走公開網際網路的加密通道，建置快速、成本低，但 SLA 與效能等級都在最後面。\\n在這題的應用：題目要求『生產等級應用程式的建議做法』，直接指向 SLA 等級最高的 Dedicated Interconnect，排除掉 Partner Interconnect(A)、Direct Peering(C)、Cloud VPN(B)。"}, {"heading": "延伸知識：Partner Interconnect 是什麼，跟 Dedicated Interconnect 差在哪", "body": "Partner Interconnect 跟 Dedicated Interconnect 一樣，都是「透過實體連線接進 Google 網路、不走公開網際網路」的方案，差別在於最後一哩路的實體線路由誰負責。\nDedicated Interconnect：自己的網路設備直接進駐 Google 指定的對接據點(colocation facility)，自己拉線直接接上 Google 網路，跟 Google 之間沒有中間人。\nPartner Interconnect：如果機房沒辦法直接進駐那些對接據點(距離太遠、或流量需求沒到需要租一整條專線的規模)，可以透過一個已經跟 Google 有直接連接的合作服務供應商，讓供應商幫忙把流量轉接進 Google 網路，等於多了一層中間商。\n為什麼 SLA 等級比較低：因為多了合作供應商這一層，整體連接的可靠度跟效能表現會受供應商自己的網路品質影響，不是 100% 由你跟 Google 直接掌控，所以 Google 官方給 Partner Interconnect 的 SLA 承諾等級，比直接對接的 Dedicated Interconnect 略低一級。\n怎麼選：公司規模大、流量高、機房位置方便直接進駐對接據點 → 選 Dedicated Interconnect，拿最高等級 SLA；公司規模較小、流量沒那麼高、或機房位置不方便直接進駐 → 選 Partner Interconnect，門檻較低。\n在這題的應用：EHR 是要支撐生產關鍵等級業務的大型醫療企業，題目要求遵循 Google 最高建議做法，這種情境下優先選 SLA 等級最高的 Dedicated Interconnect，這也是 A 選項(用 Partner Interconnect)不是正解的原因之一。"}, {"heading": "記憶重點", "body": "看到『遵循 Google 針對生產等級應用程式的建議做法』+『混合連接』，反射想到 Dedicated Interconnect 加上『跨 2 個 metro、每個 metro 內再跨不同 metro zone』的 4 條連線架構(99.99% 範本)。只分散在同一個城市的不同據點，只能防到據點層級的故障，防不到整個城市層級的事件，不是生產關鍵等級該有的架構。看到 Partner Interconnect / Direct Peering / Cloud VPN 跟 Dedicated Interconnect 一起出現在選項裡比較『生產等級』需求時，優先選 Dedicated Interconnect，因為它的 SLA 等級最高。"}]}, "keywords": ["follow Google's recommended practices for production-level applications", "hybrid connectivity between EHR's on-premises systems and Google Cloud"], "tags": ["Interconnect/VPN", "高可用性/災難復原", "案例研究題"]}, {"id": "T4-Q5", "topic": 4, "qnum": 5, "question": "You are a developer on the EHR customer portal team. Your team recently migrated the customer portal application to Google Cloud. The load has increased on the application servers, and now the application is logging many timeout errors. You recently incorporated Pub/Sub into the application architecture, and the application is not logging any Pub/Sub publishing errors. You want to improve publishing latency.What should you do?", "options": [{"letter": "A", "text": "Increase the Pub/Sub Total Timeout retry value."}, {"letter": "B", "text": "Move from a Pub/Sub subscriber pull model to a push model."}, {"letter": "C", "text": "Turn off Pub/Sub message batching."}, {"letter": "D", "text": "Create a backup Pub/Sub message queue."}], "answer": "C", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60405-exam-professional-cloud-architect-topic-4-question-5/", "postedDate": "2021-08-23", "postedYear": 2021, "explanation": {"questionZh": "你是 EHR 客戶入口網站團隊的開發人員。你的團隊最近把客戶入口網站應用程式搬到了 Google Cloud。隨著負載增加，應用程式現在記錄到大量逾時(timeout)錯誤。你最近把 Pub/Sub 整合進了應用程式架構，而應用程式沒有記錄到任何 Pub/Sub 發布(publishing)錯誤。你想要改善發布延遲(publishing latency)。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "Total Timeout 的 retry 設定，管的是「發布請求失敗時，client 要花多長時間持續重試才放棄」，這是處理『失敗/錯誤』的參數，跟『正常情況下發布一則訊息要花多久時間(延遲)』是不同的問題。題目已經明確說『沒有任何 Pub/Sub 發布錯誤』，代表發布本身一直成功，根本沒有觸發重試機制，調整這個值完全不會影響一直成功的發布請求要花多久時間，答錯了題目真正要處理的問題。", "zh": "增加 Pub/Sub 的 Total Timeout 重試數值。"}, {"letter": "B", "analysis": "Pull 跟 Push 是「訂閱端(subscriber)」收訊息的兩種方式，管的是『訊息怎麼從 Pub/Sub 送到消費者手上』，跟題目要優化的『發布端(publisher)把訊息送進 Pub/Sub 要花多久時間』完全是兩個不同角色、兩個不同方向的流程，調訂閱端的收件方式不會對發布端的延遲有任何影響，是利用 Pub/Sub「發布/訂閱」兩端容易混淆而設計的干擾選項。", "zh": "把 Pub/Sub 訂閱端從 pull 模式改成 push 模式。"}, {"letter": "C", "analysis": "正確：Pub/Sub 的 client 函式庫預設會開啟訊息批次(batching)機制——不是訊息一來就馬上送出，而是先讓訊息在本地緩衝區等待，直到累積到一定的訊息數量、資料大小，或是等了一段設定的時間(例如幾十毫秒)之後，才把這批訊息「打包」一次送出，用更少的網路請求換取更高的整體吞吐量。這個設計是用『每則訊息的延遲』去換『整體傳輸效率』。如果應用程式在意的是『每一則訊息要盡快送出去(低延遲)』，而不是『整體吞吐量要多高』，關掉批次機制可以讓每則訊息不用等待湊批次，直接馬上送出，直接對應題目『改善發布延遲』的要求。", "zh": "關閉 Pub/Sub 的訊息批次(message batching)功能。"}, {"letter": "D", "analysis": "建立一個備援訊息佇列，處理的是『萬一主佇列掛掉，資料不會遺失』這種可靠度/容錯的問題，跟『發布一則訊息要花多少時間』這個延遲議題完全無關，不會讓任何一次發布動作變快。", "zh": "建立一個備援的 Pub/Sub 訊息佇列。"}], "notes": [{"heading": "題目在問什麼", "body": "EHR 客戶入口網站負載增加後，應用程式記錄到很多逾時錯誤。團隊最近導入了 Pub/Sub，而且『沒有任何 Pub/Sub 發布錯誤』——這句話是關鍵線索，代表 Pub/Sub 發布本身一直是成功的，問題不是『失敗/出錯』，而是『發布這個動作本身花了太多時間』，題目明確要優化的是這個『publishing latency(發布延遲)』。"}, {"heading": "答案驗證：C(官方案例研究標準題，信心高)", "body": "這題是被廣泛引用、一致公認的官方標準答案，核心邏輯是分辨 Pub/Sub client 的『批次機制(犧牲單則延遲換吞吐量)』跟題目要的『降低單則延遲』方向相反，關掉批次直接對應需求，信心高，不是存疑題。"}, {"heading": "基礎知識：Pub/Sub 的訊息批次(Message Batching)機制", "body": "是什麼：Pub/Sub 的發布端(publisher) client 函式庫預設不會每則訊息都立刻各自送一次網路請求，而是先把短時間內產生的多則訊息，累積在本地的緩衝區，等累積到設定的『訊息數量上限』『資料大小上限』，或是等了設定的『最大延遲時間』之後，才一次打包送出，用一次網路請求帶多則訊息。\\n解決什麼問題：如果應用程式短時間內要發布大量小訊息，每則都各自發一次網路請求會非常沒有效率(大量連線開銷)，批次機制讓你用較少的網路請求送出同樣多的訊息，換取更高的整體吞吐量(throughput)，是一種『用延遲換效率』的設計。\\n在這題的應用：批次機制的代價就是『每則訊息要等批次條件湊滿才會真正被送出』，如果應用程式在意的是『單則訊息要盡快送出(低延遲)』，批次反而是拖慢的原因，關掉批次(或把批次的訊息數量/延遲上限設到最小)讓每則訊息幾乎是產生後就立刻送出，直接改善發布延遲。\\n常見程度：這是 Pub/Sub 效能調校的核心取捨之一(延遲 vs 吞吐量)，GCP 考試裡常考『批次機制如何影響延遲』這個概念。"}, {"heading": "概念辨析：Publisher(發布端) vs Subscriber(訂閱端)，Pull vs Push 管的是訂閱端", "body": "Pub/Sub 是「發布-訂閱」模式，分成兩端：Publisher(發布端)把訊息送進某個 Topic；Subscriber(訂閱端)透過某個 Subscription 把訊息取出來處理。Pull 模式是訂閱端自己主動定期去問 Pub/Sub『有沒有新訊息』來拉取；Push 模式是 Pub/Sub 主動把訊息推送到訂閱端指定的網址(例如一個 HTTP endpoint)。\\n這兩種模式調的都是『訂閱端怎麼收到訊息』，跟『發布端把訊息送進 Pub/Sub 這個動作本身要花多久時間』是完全不同的環節，題目問的是發布延遲，答案必須在『發布端』的設定裡找，跟訂閱端的收件方式無關——這正是 B 選項的陷阱所在。"}, {"heading": "記憶重點", "body": "看到『沒有任何發布錯誤』，先排除跟『重試/錯誤處理』相關的選項(像 A 的 timeout retry)，因為沒有錯誤就不會觸發重試，調那個值不會有感。看到題目問的是『發布(publishing)延遲』，答案要往『發布端(publisher)』的設定找，不要被『訂閱端(pull/push)』的選項混淆——發布跟訂閱是 Pub/Sub 兩個不同方向的角色。看到『延遲 vs 吞吐量』的取捨情境，優先想到『批次機制(batching)』：開批次 = 犧牲單則延遲換整體效率；關批次 = 犧牲效率換單則訊息盡快送出。"}]}, "keywords": ["improve publishing latency", "not logging any Pub/Sub publishing errors"], "tags": ["Pub/Sub", "效能調校", "案例研究題"]}, {"id": "T4-Q6", "topic": 4, "qnum": 6, "question": "In the past, configuration errors put public IP addresses on backend servers that should not have been accessible from the Internet. You need to ensure that no one can put external IP addresses on backend Compute Engine instances and that external IP addresses can only be configured on frontend Compute Engine instances. What should you do?", "options": [{"letter": "A", "text": "Create an Organizational Policy with a constraint to allow external IP addresses only on the frontend Compute Engine instances."}, {"letter": "B", "text": "Revoke the compute.networkAdmin role from all users in the project with front end instances."}, {"letter": "C", "text": "Create an Identity and Access Management (IAM) policy that maps the IT staff to the compute.networkAdmin role for the organization."}, {"letter": "D", "text": "Create a custom Identity and Access Management (IAM) role named GCE_FRONTEND with the compute.addresses.create permission."}], "answer": "A", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60407-exam-professional-cloud-architect-topic-4-question-6/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["Organization Policy", "VPC/網路", "安全性", "案例研究題"], "keywords": ["ensure that no one can put external IP addresses on backend instances", "Organization Policy", "compute.vmExternalIpAccess"], "explanation": {"questionZh": "過去曾經因為設定錯誤，讓後端伺服器被配置了公開 IP，結果可以直接從網際網路存取（不該發生的事）。你需要確保沒有任何人能幫後端 Compute Engine 實例設定外部 IP，外部 IP 只能設定在前端 Compute Engine 實例上。該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確。組織政策（Organization Policy）控制的是「這個設定本身是否被允許存在」，是不管身分、不管角色都無法繞過的硬性護欄，可以用 constraints/compute.vmExternalIpAccess 這類約束，規定只有白名單裡的特定實例才能有外部 IP，其餘全部禁止，在 IAM 權限檢查之前就生效，即使是專案 Owner 也無法違反。", "zh": "建立一個組織政策（Organizational Policy），加入限制，只允許前端 Compute Engine 實例使用外部 IP"}, {"letter": "B", "analysis": "只是針對特定專案裡的特定使用者移除權限，治標不治本：換一個有其他權限（例如 Owner、Editor）的人，還是可以繞過去設定外部 IP，無法做到「沒有任何人能做這件事」的通用保證。", "zh": "撤銷所有在有前端實例的專案裡的使用者的 compute.networkAdmin 角色"}, {"letter": "C", "analysis": "完全做反了方向，是在授予更大範圍的組織層級網路管理權限，不是限制，反而擴大了風險範圍。", "zh": "建立一個 IAM 政策，把 IT 人員對應到組織層級的 compute.networkAdmin 角色"}, {"letter": "D", "analysis": "IAM 角色解決的是誰可以執行某個動作，而不是這個動作本身是否被允許存在。即使設計了自訂角色，只要還有其他擁有更高權限的人存在，依然可以繞過這個角色限制去設定後端的外部 IP，無法達到沒有任何人能做這件事的保證。", "zh": "建立一個自訂 IAM 角色 GCE_FRONTEND，給予 compute.addresses.create 權限"}], "notes": [{"heading": "題目在問什麼", "body": "要找出能「絕對禁止、不可被任何角色繞過」的做法，確保後端實例永遠不可能被設定外部 IP，而不是單純調整某些使用者的權限。"}, {"heading": "答案驗證：A", "body": "Organization Policy 的 compute.vmExternalIpAccess 約束可以直接在政策層級規定哪些實例允許外部 IP，其餘一律禁止，這個限制在 IAM 權限檢查之前就生效，是唯一能保證「沒有任何人能做這件事」的做法。"}, {"heading": "核心概念：IAM vs Organization Policy，兩種完全不同層次的控制", "body": "IAM 控制的是「誰可以執行某個動作」，是一種基於身分的授權機制，只要有足夠高的權限（例如 Owner），理論上永遠可以繞過任何角色限制。Organization Policy 控制的是「這個設定本身是否被允許存在」，是不管你是誰、什麼角色，都無法繞過的硬性護欄。遇到題目強調「絕對禁止」「沒有任何人能」這類字眼時，答案方向通常是 Organization Policy，而不是調整 IAM 角色/權限。"}]}}, {"id": "T4-Q7", "topic": 4, "qnum": 7, "question": "You are responsible for designing the Google Cloud network architecture for Google KubernetesEngine. You want to follow Google best practices. Considering the EHR Healthcare business and technical requirements, what should you do to reduce the attack surface?", "options": [{"letter": "A", "text": "Use a private cluster with a private endpoint with master authorized networks configured."}, {"letter": "B", "text": "Use a public cluster with firewall rules and Virtual Private Cloud (VPC) routes."}, {"letter": "C", "text": "Use a private cluster with a public endpoint with master authorized networks configured."}, {"letter": "D", "text": "Use a public cluster with master authorized networks enabled and firewall rules."}], "answer": "A", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60409-exam-professional-cloud-architect-topic-4-question-7/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["GKE/Kubernetes", "VPC/網路", "安全性", "案例研究題"], "keywords": ["reduce the attack surface", "private cluster", "private endpoint", "master authorized networks", "GKE network architecture"], "explanation": {"questionZh": "你負責設計 GKE 的 GCP 網路架構，要遵循 Google 最佳實務。考量到 EHR Healthcare 的商業與技術需求，該怎麼做才能降低攻擊面（attack surface）？", "optionTable": [{"letter": "A", "analysis": "正確。私有叢集讓節點完全沒有公開 IP，外部網際網路無法直接碰到跑應用程式的機器；私有端點讓控制平面也沒有公開 IP，外部無法碰到管理整個叢集的入口；主控端授權網路再疊加一層限制，確保即使在內部 VPC 網路裡，也只有白名單裡的特定來源才能連到控制平面下指令。三層疊加，達成攻擊面最小化。", "zh": "使用私有叢集，搭配設定主控端授權網路的私有端點"}, {"letter": "B", "analysis": "公開叢集代表節點本身就有公開 IP，直接暴露在網際網路上，即使有防火牆規則和 VPC routes 擋著，攻擊面還是遠大於私有叢集，一旦規則設定出錯就會直接暴露，不適合醫療這種高敏感資料場景。", "zh": "使用公開叢集，搭配防火牆規則與 VPC routes"}, {"letter": "C", "analysis": "節點是私有的沒錯，但控制平面端點仍然有公開 IP、可以從網際網路連線，即使用授權網路白名單限制來源，這個端點本身依然是暴露在公網上的攻擊面，不是攻擊面最小的選項。", "zh": "使用私有叢集，搭配設定主控端授權網路的公開端點"}, {"letter": "D", "analysis": "公開叢集，節點本身就暴露在網際網路上，即使啟用主控端授權網路和防火牆規則，攻擊面依然遠大於私有叢集。", "zh": "使用公開叢集，啟用主控端授權網路與防火牆規則"}], "notes": [{"heading": "題目在問什麼", "body": "要找出能讓 GKE 叢集對公開網際網路完全零曝光、同時內部網路也只有特定授權來源能管理的網路架構，對應「降低攻擊面」這個核心要求。"}, {"heading": "答案驗證：A", "body": "私有叢集（節點私有化）+ 私有端點（控制平面私有化）+ 主控端授權網路（內部網路再加一層白名單）三層疊加，是 Google 建議給高敏感資料場景的最小攻擊面網路架構。"}, {"heading": "核心概念：Cluster 與 Endpoint 保護的是不同對象", "body": "Private Cluster 管的是「節點（Node）」要不要有公開 IP，保護的是實際跑應用程式 Pod 的機器本身，防止外部直接攻擊節點或節點上的 kubelet 等管理元件。Private Endpoint 管的是「控制平面（Kubernetes API Server）」這個管理入口要不要有公開 IP，保護的是用來下指令管理整個叢集的那個入口（kubectl、CI/CD 連線的對象）。兩者保護的對象不同：Cluster 保護「執行層」，Endpoint 保護「管理層」，一般使用者存取部署的應用程式走的是 Service/Ingress/Load Balancer，跟這兩者都無關，不受影響。"}, {"heading": "核心概念：endpoint 是「對話窗口」不是「進入叢集」", "body": "透過 endpoint 連線，是送出 API 請求給控制平面，由控制平面代為查詢或操作叢集內部狀態再回傳結果，使用者自己並沒有真正「進入」叢集內部網路，全程都待在外面，像是站在對講窗口前喊話、由裡面的人代為處理，而不是走進控制室本身。"}, {"heading": "核心概念：Cluster 與 Endpoint 的父子關係", "body": "Endpoint 的私有/公開選項，只有在選擇建立 Private Cluster 的前提下才會出現讓你設定；選擇一般的公開叢集時，節點直接有公開 IP，控制平面端點也必定公開，沒有再細分的選項。因此 Private Cluster 是先決條件，Private Endpoint 是在這個前提成立後才會出現的第二層、更細緻的防護選項，兩者是父子關係而非完全平行、各自獨立設定的關係。"}, {"heading": "核心概念：為什麼私有端點還要疊加主控端授權網路", "body": "主控端授權網路不限定只能用在公開端點，私有端點一樣可以疊加。私有端點只解決「外部網際網路完全碰不到」的問題，但不代表整個內部 VPC 網路裡的每一台機器都該有資格管理叢集。授權網路再疊加一層限制，確保只有真正該管理叢集的特定來源（例如固定的管理用 bastion host、CI/CD 系統的 IP）才能連到控制平面，即使攻擊者已經進到 VPC 內部，也無法任意連線管理叢集，這正是防禦縱深（Defense in Depth）的具體體現。"}, {"heading": "為什麼節點公開 IP 本身就是風險，即使有防火牆規則", "body": "公開 IP 的存在本身，等於把安全防護完全賭在「防火牆規則永遠不會設錯」這件事上。EHR Healthcare 案例背景裡就曾因設定錯誤，讓後端伺服器意外暴露在網際網路上（見 T4-Q6）。如果節點本來就沒有公開 IP，就算某天防火牆規則被改錯，攻擊者依然沒有路徑可以從網際網路連到這台機器；但如果節點本來就有公開 IP、只靠防火牆規則擋著，一旦規則出錯就會瞬間暴露，這就是私有叢集被視為防禦縱深最佳實務的根本原因。"}]}}, {"id": "T5-Q1", "topic": 5, "qnum": 1, "question": "Mountkirk Games wants you to design their new testing strategy. How should the test coverage differ from their existing backends on the other platforms?", "options": [{"letter": "A", "text": "Tests should scale well beyond the prior approaches"}, {"letter": "B", "text": "Unit tests are no longer required, only end-to-end tests"}, {"letter": "C", "text": "Tests should be applied after the release is in the production environment"}, {"letter": "D", "text": "Tests should include directly testing the Google Cloud Platform (GCP) infrastructure"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10722-exam-professional-cloud-architect-topic-5-question-1/", "postedDate": "2019-12-20", "postedYear": 2019, "tags": ["CI/CD"]}, {"id": "T5-Q2", "topic": 5, "qnum": 2, "question": "Mountkirk Games has deployed their new backend on Google Cloud Platform (GCP). You want to create a through testing process for new versions of the backend before they are released to the public. You want the testing environment to scale in an economical way. How should you design the process?", "options": [{"letter": "A", "text": "Create a scalable environment in GCP for simulating production load"}, {"letter": "B", "text": "Use the existing infrastructure to test the GCP-based backend at scale"}, {"letter": "C", "text": "Build stress tests into each component of your application using resources internal to GCP to simulate load"}, {"letter": "D", "text": "Create a set of static environments in GCP to test different levels of load ג€\" for example, high, medium, and low"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9190-exam-professional-cloud-architect-topic-5-question-2/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["CI/CD", "成本優化"]}, {"id": "T5-Q3", "topic": 5, "qnum": 3, "question": "Mountkirk Games wants to set up a continuous delivery pipeline. Their architecture includes many small services that
