多環境隔離+共用資源存取』情境的解題關鍵。"}]}}, {"id": "T1-Q214", "topic": 1, "qnum": 214, "question": "You are designing the network architecture for a public-facing, containerized web application deployed on Cloud Run. All incoming traffic must be inspected by a Cloud Armor web application firewall (WAF) before reaching the application You plan to use an Application Load Balancer, which will have the Cloud Armor policy attached. You must ensure that all public requests pass through the load balancer and any attempt to access the Cloud Run service directly through its default *.run.app URL is blocked. What should you do?", "options": [{"letter": "A", "text": "Enable Identity-Aware Proxy (IAP) directly on the Cloud Run service to intercept and validate all incoming requests"}, {"letter": "B", "text": "Create a DNS entry to route traffic to Cloud Armor. Configure Cloud Armor to deny traffic from unknown IP addresses"}, {"letter": "C", "text": "Set the Cloud Run ingress to Allow internal traffic and Cloud Load Balancing, and use a serverless NEG backend on the load balancer"}, {"letter": "D", "text": "Configure a VPC firewall rule with a high priority to deny all traffic that does not originate from the load balancer"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381821-exam-professional-cloud-architect-topic-1-question-214/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Run/Cloud Functions", "Cloud Armor", "Load Balancing", "安全性"], "keywords": ["any attempt to access the Cloud Run service directly through its default *.run.app URL is blocked"], "explanation": {"questionZh": "你正在為一個部署在 Cloud Run 上、公開對外的容器化網頁應用程式設計網路架構。所有進來的流量都必須先經過 Cloud Armor 這套 Web 應用防火牆（WAF）檢查，才能到達應用程式。你打算使用一個 Application Load Balancer，並在上面掛上 Cloud Armor 政策。你必須確保所有公開請求都經過這個負載平衡器，並且任何想透過 Cloud Run 預設的 *.run.app 網址直接存取的嘗試都要被擋下來。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：IAP 是用來做身分驗證的（確認這個使用者是誰、有沒有權限），跟擋掉直接存取預設網址的請求是不同的問題，角色不對應。", "zh": "直接在 Cloud Run 服務上啟用 Identity-Aware Proxy（IAP），來攔截並驗證所有進來的請求。"}, {"letter": "B", "analysis": "錯誤：Cloud Armor 本身不是一個可以被 DNS 直接指向的獨立端點，它是掛在負載平衡器上的一個政策，不是獨立存在的服務，這個選項的描述在技術上不成立。", "zh": "建立一個 DNS 項目，把流量導向 Cloud Armor。設定 Cloud Armor 拒絕來自未知 IP 位址的流量。"}, {"letter": "C", "analysis": "正確：把 Cloud Run 的 ingress 設成 Allow internal traffic and Cloud Load Balancing，直接阻斷透過 *.run.app 預設網址的公開直接存取，只允許透過配置好、以 serverless NEG 為後端的負載平衡器進來的流量，精準對應題目兩個要求，是 Google 官方文件針對這個情境的標準做法。", "zh": "把 Cloud Run 的 ingress 設定為 Allow internal traffic and Cloud Load Balancing，並在負載平衡器上使用一個 serverless NEG 後端。"}, {"letter": "D", "analysis": "錯誤：Cloud Run 是無伺服器服務，它本來就不像 VM 一樣活在某個 VPC 裡，它的預設公開網址是由 Google 的全域前端基礎設施提供服務的，VPC 防火牆規則管不到這一層，用錯機制。", "zh": "設定一條高優先級的 VPC 防火牆規則，拒絕所有不是源自負載平衡器的流量。"}], "notes": [{"heading": "題目在問什麼", "body": "設計跑在 Cloud Run 上的公開容器化網頁應用的網路架構，所有進來的流量必須先經過 Cloud Armor WAF 檢查。計畫用 Application Load Balancer，掛上 Cloud Armor 政策。必須確保所有公開請求都要經過負載平衡器，任何想直接用 Cloud Run 預設網址存取的嘗試都要被擋下來。"}, {"heading": "答案驗證：C", "body": "看到『要強制 Cloud Run 流量只能走負載平衡器，禁止直接用預設網址存取』，直接鎖定 Cloud Run 的 Ingress 設定（改成 Internal and Cloud Load Balancing）+ 負載平衡器用 serverless NEG 當後端——這是 Google 官方唯一正確的做法，IAP、VPC 防火牆規則都管不到 Cloud Run 這種無伺服器服務的預設公開網址這一層。信心高。"}, {"heading": "基礎知識：DNS 的作用", "body": "DNS（Domain Name System，網域名稱系統）的核心功能是把人類好記的網址翻譯成電腦真正用來連線的 IP 位址。DNS 只能指向一個有實際 IP 位址的目標（例如負載平衡器的 IP），不能直接指向一個沒有自己 IP 的『政策』（像 Cloud Armor），這是選項 B 在技術上不成立的原因。"}, {"heading": "延伸澄清：為什麼 Cloud Run 不像 VM 一樣活在 VPC 裡", "body": "要分清楚兩個方向的連線：①Cloud Run 主動連出去（outbound）存取 VPC 內部的資源——可以，透過 Direct VPC egress（Q205 提過）讓 Cloud Run 主動把流量送進一個 VPC，存取裡面的私有資源。②外部流量連進 Cloud Run（inbound，別人要連到你的服務）——這一段不是活在 VPC 裡。Cloud Run 服務的預設公開網址（*.run.app）是由 Google 自己的全域前端基礎設施（Google Front End）直接提供服務的，這跟 VM 不一樣：VM 在建立的那一刻就被放進某個特定的 VPC/子網路裡，擁有那個網路範圍內的 IP，所以 VPC 防火牆規則可以根據流量是不是來自/去向某個 VPC 裡的資源來過濾。但 Cloud Run 的預設公開端點不屬於任何一個客戶自己的 VPC，它活在 Google 自己的基礎設施層，VPC 防火牆規則完全碰不到它，這是為什麼必須用 Cloud Run 自己的 Ingress 設定（而不是 VPC 防火牆規則）來控制誰能連進來的根本原因。\n一句話總結：Cloud Run 可以主動連出去碰 VPC 裡的東西（Direct VPC egress），但它自己對外曝露的那個預設網址不是 VPC 裡的一個資源，所以 VPC 層級的防火牆規則管不到誰能連進 Cloud Run 的預設網址這件事，必須用 Cloud Run 自己的 Ingress 設定來管。"}, {"heading": "基礎知識：Cloud Run Ingress 設定", "body": "Cloud Run 有個設定叫 Ingress，可以控制什麼來源的流量能直接打到這個服務，有幾個選項：All（全部流量，包括直接用公開網址存取）、Internal（只允許 VPC 內部流量）、Internal and Cloud Load Balancing（只允許內部流量+透過配置好的負載平衡器進來的流量）。\n在這題的應用：設成 Internal and Cloud Load Balancing，搭配負載平衡器用 serverless NEG（網路端點群組，專門用來把 Cloud Run/Cloud Functions 這類無伺服器服務接上負載平衡器）當後端，就能強制所有公開流量只能走負載平衡器進來。\n常見程度：GCP 考試中『強制無伺服器服務流量走 WAF/負載平衡器』情境的標準核心解法。"}]}}, {"id": "T1-Q215", "topic": 1, "qnum": 215, "question": "To improve governance and security, your organization has structured the Google Cloud environment using folders for different business units. Each business unit folder has subfolders for development, staging, and production environments, which must comply with internal security controls:• Production workloads must be protected from direct internet ingress by default unless explicitly tagged.• The application must be accessible to customers over HTTPS.You need to design a scalable and enforceable model that blocks internet ingress traffic to the production folders while selectively allowing direct HTTPS traffic to the necessary virtual machines. You must also ensure that individual project teams cannot overwrite these controls once they are implemented for all current and future production projects. What should you do?", "options": [{"letter": "A", "text": "At each production folder, apply a hierarchical firewall policy to deny all ingress except for HTTPS to tagged VMs."}, {"letter": "B", "text": "Mandate the application teams to deploy a Terraform module to create VPC firewall rules in each project that deny ingress and allow HTTPS."}, {"letter": "C", "text": "At the organization root, apply a hierarchical firewall policy to deny all ingress except for HTTPS to tagged VMs."}, {"letter": "D", "text": "At each production folder, use an organization policy to block all external IPs and require teams to use external HTTPS load balancers."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381826-exam-professional-cloud-architect-topic-1-question-215/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["VPC/網路", "Organization Policy", "安全性"], "keywords": ["individual project teams cannot overwrite these controls once they are implemented for all current and future production projects"], "explanation": {"questionZh": "為了改善治理和安全性，你的組織用資料夾依不同事業單位組織 Google Cloud 環境。每個事業單位的資料夾下，有開發、預備、正式環境的子資料夾，這些子資料夾必須符合內部安全控管：正式環境的工作負載，預設必須防止直接的網際網路進入流量，除非被明確標記；應用程式必須能讓客戶透過 HTTPS 存取。你需要設計一套可擴展、可強制執行的模型，封鎖對正式環境資料夾的網際網路進入流量，同時選擇性允許直接的 HTTPS 流量到必要的虛擬機。你還必須確保，一旦針對所有現在和未來的正式環境專案實作了這些控管之後，各專案團隊不能自己覆寫掉它們。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：範圍精準（只套在正式環境資料夾，不影響開發/預備環境）、機制正確（階層式防火牆政策，專案團隊無法覆寫）、邏輯精準對應（預設全擋，但用標記selective允許 HTTPS）。", "zh": "在每個正式環境資料夾，套用一條階層式防火牆政策，拒絕所有進入流量，除了允許 HTTPS 到有標記的 VM。"}, {"letter": "B", "analysis": "錯誤：這是靠規範/約定要求團隊自己做，但這些還是專案層級的一般防火牆規則——團隊自己的專案，他們本來就有權限修改或刪除自己建立的規則，完全沒有結構上的強制力，直接違反題目團隊不能自己覆寫掉控管的核心要求。", "zh": "要求應用團隊在每個專案部署一個 Terraform 模組，建立 VPC 防火牆規則來拒絕進入流量並允許 HTTPS。"}, {"letter": "C", "analysis": "錯誤：機制是對的（階層式政策，無法被覆寫），但範圍錯了——套在整個組織根層級，代表這條規則會套用到所有環境（包括開發、預備環境），但題目只要求正式環境要有這個限制，開發/測試環境可能需要更寬鬆的存取權限做測試，套在組織根層級範圍過大、太粗暴。", "zh": "在組織根節點，套用一條階層式防火牆政策，拒絕所有進入流量，除了允許 HTTPS 到有標記的 VM。"}, {"letter": "D", "analysis": "錯誤：Organization Policy 管的是資源設定層級的限制（像不能在哪些區域部署資源），沒有像允許 HTTPS 流量到有標記的 VM 這種精細的網路流量過濾規則類型，這種精細的流量控管正是階層式防火牆政策的職責，工具用錯了，而且封鎖所有外部 IP 也跟題目要選擇性允許直接 HTTPS 到必要 VM 的要求衝突。", "zh": "在每個正式環境資料夾，使用 organization policy 封鎖所有外部 IP，並要求團隊使用外部 HTTPS 負載平衡器。"}], "notes": [{"heading": "題目在問什麼", "body": "組織用資料夾依事業單位分層，每個事業單位資料夾下又有開發/預備/正式環境子資料夾。安全規定：正式環境的工作負載，預設要防止直接的網際網路進入流量，除非明確被標記。應用程式要能透過 HTTPS 讓客戶存取。要設計一套可擴展、可強制執行的模型，封鎖對正式環境資料夾的網際網路進入流量，同時選擇性允許直接 HTTPS 流量到必要的 VM。還要確保各專案團隊未來不能自己覆寫掉這些控管（對現在和未來所有正式環境專案都要生效）。"}, {"heading": "答案驗證：A", "body": "看到『要在特定範圍（資料夾/子樹）強制套用網路流量規則，而且團隊不能覆寫』，直接鎖定 Hierarchical Firewall Policy（階層式防火牆政策），套用在正確的範圍層級（題目要求的是哪個範圍，就套在那個範圍，不要套太高層級影響到不該被影響的環境）——這跟 Organization Policy（管資源設定約束，不是流量規則）跟一般專案層級防火牆規則（可以被專案團隊自己覆寫，沒有強制力）都是不同的機制，考試常把這三者放在一起混淆。信心高。"}, {"heading": "基礎知識：這題涉及的基本概念拆解", "body": "資源階層：Organization（整個公司）→ 事業單位的 Folder（資料夾）→ 開發/預備/正式環境的子 Folder → 底下的 Project（專案）。\n網際網路進入流量（internet ingress）：指從公開網際網路主動連進來的流量，例如有人在瀏覽器打伺服器的公開 IP。\nHTTPS：網站加密連線用的標準協定，題目要求客戶還是要能透過 HTTPS 正常存取應用程式，所以不是完全封死，而是預設封死但開一個安全的 HTTPS 通道。\nVM 標記（tag）：在 VM 上貼自訂標籤，防火牆規則可以設定成只對有這個標籤的 VM 生效，這題要求只有被貼上特定標籤的 VM 才允許接受 HTTPS 流量進來，其他沒貼標籤的 VM 一律被擋。\n防火牆規則：決定什麼樣的網路流量可以通過、什麼要被擋下來的規則，可依來源/目的地 IP、通訊埠、協定類型、標籤來過濾。\n這題真正要解決的問題：正式環境資料夾裡會有很多專案（現在和未來都算），要一套規則——預設這些專案裡的 VM 都不能被網際網路直接連到，除非被貼了特定標籤，而且這個規則不能被各專案團隊自己繞過或關掉。"}, {"heading": "服務介紹：Hierarchical Firewall Policy（階層式防火牆政策）", "body": "是什麼：可以掛在 Organization 或 Folder 層級的防火牆規則，跟一般專案層級的防火牆規則不同的地方是，可以設定成專案層級的規則無法覆寫/繞過——即使某個專案團隊自己在專案裡亂設防火牆規則，階層式政策的規則依然優先生效，專案團隊無法用自己的權限推翻這個上層規定的限制。\n解決什麼問題：需要對整個資料夾/組織範圍內（包括現在和未來的所有專案）強制套用統一的網路安全規則，且不能被底下的專案團隊繞過時使用。\n在這題的應用：套用在每個正式環境資料夾（範圍精準），達成預設拒絕所有進入流量、但允許 HTTPS 到有標記 VM 的選擇性放行，且專案團隊無法覆寫。\n常見程度：GCP 考試中『大規模、強制性的網路治理』情境的標準核心機制，常跟 Organization Policy（管資源設定，不是流量）和一般專案層級防火牆規則（可被覆寫）做對比混淆。"}]}}, {"id": "T1-Q216", "topic": 1, "qnum": 216, "question": "You are designing a new insurance claims processing application that will be deployed on Google Kubernetes Engine (GKE) Your company’s compliance team requires a complete and non-repudiable audit trail for all administrative actions from day one. Your application must capture who deploys a new container image, who modifies the GKE cluster's configuration, and who interacts with running pods or Kubernetes secrets using kubectl. What should you do?", "options": [{"letter": "A", "text": "Enable Binary Authorization on the GKE cluster, and create a policy that requires all deployed container images to be signed by a trusted attestor."}, {"letter": "B", "text": "Deploy a DaemonSet to every node in the GKE cluster that runs a logging agent to collect and forward all container logs to Cloud Logging."}, {"letter": "C", "text": "Enable GKE Audit Logging to send Kubernetes API server logs to Cloud Logging, and ensure Cloud Audit Logs are enabled for the project."}, {"letter": "D", "text": "Activate the Security Command Center Premium tier to analyze GKE logs and detect threats, vulnerabilities, and misconfigurations in real time."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381818-exam-professional-cloud-architect-topic-1-question-216/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "合規性"], "keywords": ["a complete and non-repudiable audit trail for all administrative actions"], "explanation": {"questionZh": "你正在設計一個新的保險理賠處理應用程式，將部署在 Google Kubernetes Engine（GKE）上。你公司的合規團隊要求從第一天開始，就要有一套完整且不可否認的審計軌跡，記錄所有的管理動作。你的應用程式必須捕捉：誰部署了新的容器映像檔、誰修改了 GKE 叢集的設定、誰使用 kubectl 與正在執行的 Pod 或 Kubernetes Secrets 互動。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Binary Authorization 是部署時的政策把關工具，只負責擋掉沒有簽署的映像檔，不會記錄誰做了部署這個動作，也完全沒有涵蓋到誰修改了叢集設定、誰用 kubectl 跟 Pod/Secrets 互動這兩項需求，角色根本不是用來做審計記錄的。", "zh": "在 GKE 叢集上啟用 Binary Authorization，建立一條政策，要求所有部署的容器映像檔都必須經過受信任的證明人簽署。"}, {"letter": "B", "analysis": "錯誤：DaemonSet 收集的是應用程式本身的輸出日誌（容器印出來的 log），不是誰對 Kubernetes 本身下了什麼管理指令，這是兩種完全不同層級的日誌，角色不對應。", "zh": "在 GKE 叢集的每個節點部署一個 DaemonSet，執行一個日誌代理程式來收集並轉送所有容器日誌到 Cloud Logging。"}, {"letter": "C", "analysis": "正確：所有管理動作最終都要經過 Kubernetes API Server，GKE Audit Logging 記錄的正是誰對 API Server 送出了什麼請求，天然涵蓋部署新映像檔、修改叢集設定、用 kubectl 跟 Pod/Secrets 互動這三件事；搭配 Cloud Audit Logs（GCP 層級的管理活動日誌，涵蓋直接操作 GKE 這個 GCP 資源本身的動作），兩者加起來完整覆蓋所有管理層面的動作軌跡。", "zh": "啟用 GKE 審計日誌，把 Kubernetes API Server 的日誌送到 Cloud Logging，並確保專案已啟用 Cloud Audit Logs。"}, {"letter": "D", "analysis": "錯誤：Security Command Center Premium 是威脅偵測/安全態勢分析工具，用途是找出有沒有異常/危險的狀況，不是用來產出誰做了什麼動作的完整、不可否認的審計記錄，是偵測性工具而非記錄性工具。", "zh": "啟用 Security Command Center Premium 方案，即時分析 GKE 日誌以偵測威脅、漏洞和設定錯誤。"}], "notes": [{"heading": "題目在問什麼", "body": "保險理賠處理應用程式要跑在 GKE 上。合規團隊要求從第一天開始，就要有完整且不可否認的審計軌跡，記錄所有管理動作：誰部署新容器映像檔、誰修改 GKE 叢集設定、誰用 kubectl 跟正在跑的 Pod 或 Secrets 互動。"}, {"heading": "答案驗證：C", "body": "看到『需要完整、不可否認的審計軌跡，記錄誰做了哪些管理/操作動作』，在 Kubernetes/GKE 的情境下，直接鎖定 GKE Audit Logging（捕捉所有打到 API Server 的請求，涵蓋 kubectl 操作、部署、設定變更）+ Cloud Audit Logs（涵蓋 GCP 層級對 GKE 資源本身的管理操作）——不要被 Binary Authorization（部署關卡，不是記錄工具）、DaemonSet 日誌代理（應用程式層級日誌，不是管理動作記錄）、SCC（威脅偵測，不是審計記錄）這些聽起來也跟安全/日誌有關，但實際用途不對應的選項混淆。信心高。"}, {"heading": "基礎知識：什麼是「不可否認（non-repudiable）」", "body": "意思是這個記錄沒辦法被事後否認——假設有人做了某個動作，不能事後說自己沒做過，因為記錄本身清楚記載了是誰、在什麼時候、做了什麼，而且這份記錄本身不能被竄改。這是稽核/合規領域的核心要求，GKE Audit Logging 搭配 Cloud Audit Logs 正是達成這個要求的標準機制。"}, {"heading": "服務介紹：GKE Audit Logging 與 Cloud Audit Logs 的分工", "body": "GKE Audit Logging：記錄所有打到 Kubernetes API Server 的請求——不管是透過 kubectl 下指令、還是 CI/CD 管線自動部署，背後都是對 API Server 送出請求，這天然涵蓋部署映像檔、修改叢集內部設定（例如 Deployment、ConfigMap）、存取 Secrets 等動作。\nCloud Audit Logs：GCP 層級的管理活動日誌，涵蓋對 GKE 這個 GCP 資源本身（而不是叢集內部 Kubernetes 物件）的管理操作，例如誰在主控台/gcloud 建立、刪除、調整了整個 GKE 叢集的設定。\n兩者搭配：GKE Audit Logging 管『叢集內部的 Kubernetes 層級操作』，Cloud Audit Logs 管『GCP 層級對這個叢集資源的操作』，合起來才是完整的管理動作審計軌跡。\n常見程度：GCP 考試中『Kubernetes/GKE 合規稽核』情境的標準核心機制。"}]}}, {"id": "T1-Q217", "topic": 1, "qnum": 217, "question": "Your product team is building a critical, customer-facing application on Google Cloud. The development team wants to use Spanner for their database to take advantage of its horizontal scalability and low operational overhead However, the FinOps team is concerned about the direct monthly cost of Spanner and proposed using a self-managed PostgreSQL database on Compute Engine VMs instead. You need to resolve this conflict and ensure the project moves forward with an architecturally sound database choice that balances technical requirements with financial constraints. What should you do?", "options": [{"letter": "A", "text": "Provide the development team with a reference architecture for deploying a highly available PostgreSQL cluster on a regional managed instance group (MIG)."}, {"letter": "B", "text": "Suggest using Cloud SQL for PostgreSQL as a compromise to get a managed service at a lower cost than Spanner."}, {"letter": "C", "text": "Develop a total cost of ownership (TCO) analysis that includes operational overhead, and present it in a workshop to facilitate a decision."}, {"letter": "D", "text": "Cite the reliability and performance optimization pillars of the Google Cloud Well-Architected Framework to formally justify the use of Spanner."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381824-exam-professional-cloud-architect-topic-1-question-217/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Spanner", "成本優化"], "keywords": ["resolve this conflict and ensure the project moves forward with an architecturally sound database choice that balances technical requirements with financial constraints"], "explanation": {"questionZh": "你的產品團隊正在 Google Cloud 上建置一個關鍵的、面向客戶的應用程式。開發團隊想用 Spanner 當資料庫，以善用它的水平擴展能力和低維運負擔。然而，FinOps 團隊擔心 Spanner 每月的直接成本，提議改用在 Compute Engine VM 上自行管理的 PostgreSQL 資料庫。你需要解決這個衝突，確保專案能用一個架構上合理、同時兼顧技術需求和財務限制的資料庫選擇繼續推進。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：這等於直接幫其中一方（FinOps 提議的方案）把實作方式準備好，但完全沒有真正解決衝突，跳過了評估、比較、達成共識的過程，直接單方面推進某一個方案。", "zh": "提供開發團隊一份在區域型受管理執行個體群組（MIG）上部署高可用 PostgreSQL 叢集的參考架構。"}, {"letter": "B", "analysis": "錯誤：Cloud SQL 比自架 PostgreSQL 更省事，但不具備 Spanner 的水平擴展能力，只能垂直擴展、主要在單一區域運作。這是在還沒有完整評估兩邊真正的技術需求和總成本之前，就直接跳到一個特定的技術方案，萬一這個關鍵應用程式未來真的需要 Spanner 等級的水平擴展能力，這個折衷方案可能沒有真正滿足技術需求，操之過急。", "zh": "建議使用 Cloud SQL for PostgreSQL 作為折衷方案，取得比 Spanner 更低成本的託管服務。"}, {"letter": "C", "analysis": "正確：TCO 分析的重點是不只算每月帳單上的直接費用，還要把維運這套系統需要花多少人力/時間成本這種隱藏成本也一起算進去。把這份完整的成本比較在工作坊裡讓開發團隊和 FinOps 團隊一起看數據、一起討論，這才是真正用資料驅動、讓雙方充分理解全貌後共同做決策的做法，完全對應解決衝突+兼顧技術需求和財務限制+架構合理三個要求。", "zh": "制定一份包含維運負擔的總持有成本（TCO）分析，並在工作坊中呈現以促成決策。"}, {"letter": "D", "analysis": "錯誤：這是單方面替開發團隊的立場背書，只是找理論依據去強化己方的論點，完全沒有處理 FinOps 團隊合理的成本顧慮，不是真正的解決衝突，而是用框架術語去壓過另一方的意見。", "zh": "引用 Google Cloud Well-Architected Framework 中的可靠性和效能優化支柱，正式為使用 Spanner 的決定做辯護。"}], "notes": [{"heading": "題目在問什麼", "body": "開發團隊想用 Spanner（水平擴展+低維運負擔），FinOps 團隊擔心 Spanner 每月直接成本，提議改用自架 PostgreSQL。需要解決這個衝突，確保專案用一個架構合理、兼顧技術需求和財務限制的資料庫選擇繼續推進。"}, {"heading": "答案驗證：C", "body": "看到『技術團隊和財務/營運團隊對某個架構決策有分歧，需要在技術需求和成本之間找平衡』，標準做法是做一份完整的 TCO 分析（把隱藏的維運人力成本也算進去，不只看表面的雲端帳單數字），然後讓雙方基於完整數據一起討論做決策——而不是直接幫某一方找藉口（D）、直接推進某個方案跳過討論（A）、或還沒做完整評估就倉促選一個折衷方案（B）。信心高。"}, {"heading": "基礎知識：TCO（Total Cost of Ownership，總持有成本）", "body": "是什麼：評估一套系統/方案的完整成本時，不只看表面的直接費用（例如雲端服務帳單），還要把間接/隱藏的成本（例如維運所需的人力時間、故障處理、升級維護、培訓成本等）一起納入計算。\n解決什麼問題：避免只看『帳單數字小』就誤判某個方案更便宜——自己架設、維護系統看起來省了服務費，但背後可能需要工程師投入大量時間處理高可用、備份復原、效能調校等工作，這些隱藏的人力成本往往被低估，真正算進去後，自架方案的總成本可能反而比用託管服務更高。\n在這題的應用：Spanner 的直接月費可能較高，但低維運負擔可以省下大量工程師時間成本；自架 PostgreSQL 的直接費用可能較低，但需要投入可觀的維運人力。TCO 分析能把這兩邊的完整成本量化出來，讓雙方基於事實做決策。\n常見程度：GCP 考試及真實企業架構決策中『技術方案 vs 成本考量』衝突情境的標準解決框架。"}]}}, {"id": "T1-Q218", "topic": 1, "qnum": 218, "question": "You are deploying a critical application with a stateless, containerized frontend on Cloud Run and a Cloud SQL for PostgreSQL backend. The application experiences unpredictable traffic spikes, and the business requires the ability to immediately roll back a failed deployment to the last known good state. You need to apply a deployment strategy that aligns with Site Reliability Engineering (SRE) principles for both the application code and the database schema updates, while meeting the business's requirements. What should you do?", "options": [{"letter": "A", "text": "Package the database schema migration script within the container to be executed on every container startup before the application process begins."}, {"letter": "B", "text": "Configure the CI/CD pipeline to use the :latest container tag for deployments, with database schema changes applied manually as needed."}, {"letter": "C", "text": "Separate CI/CD pipelines for database schema migrations from application deployments. When deploying a new Cloud Run revision, use gradual traffic split."}, {"letter": "D", "text": "Use a single CI/CD pipeline that first applies database schema changes and then deploys the new Cloud Run revision."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381817-exam-professional-cloud-architect-topic-1-question-218/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Run/Cloud Functions", "Cloud SQL", "CI/CD", "高可用性/災難復原"], "keywords": ["the ability to immediately roll back a failed deployment to the last known good state"], "explanation": {"questionZh": "你正在部署一個關鍵應用程式，前端是跑在 Cloud Run 上的無狀態容器化應用，後端是 Cloud SQL for PostgreSQL。這個應用程式會遇到難以預測的流量尖峰，業務要求必須能立即把失敗的部署回滾到上一個已知良好的狀態。你需要套用一套符合網站可靠性工程（SRE）原則的部署策略，同時處理好應用程式程式碼和資料庫結構（schema）更新這兩件事，並滿足業務要求。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Cloud Run 遇到流量尖峰時會同時啟動很多個容器實例，如果每個實例啟動時都各自跑一次遷移腳本，多個實例可能同時嘗試對同一個資料庫結構做變更，產生競爭衝突；萬一遷移失敗，每一個新啟動的容器都會啟動失敗；而且把程式碼部署和資料庫結構變更綁死在同一個容器生命週期裡，回滾時沒辦法乾淨地只回滾程式碼。", "zh": "把資料庫結構遷移腳本打包進容器裡，在每次容器啟動時、應用程式行程開始之前先執行。"}, {"letter": "B", "analysis": "錯誤：:latest 標籤永遠指向最新推上去的那一版，不是一個固定、可追溯的特定版本，想回滾到上一個已知良好的狀態時根本沒有一個明確的歷史版本標籤可以回去，直接違反立即回滾的要求；手動視需要套用資料庫變更也缺乏結構化和自動化。", "zh": "設定 CI/CD 管線使用 :latest 容器標籤進行部署，資料庫結構變更則視需要手動套用。"}, {"letter": "C", "analysis": "正確：把資料庫結構變更跟程式碼部署解耦成兩條獨立管線，資料庫結構的變更可以用向後相容的方式設計，讓程式碼的部署/回滾不會被綁死在某次結構變更的時間點上；用 Cloud Run 的漸進式流量分配，部署產生不可變的新 revision，先讓少部分流量試跑，萬一發現問題只要把流量切回舊的 revision 就能立即完成回滾，完全不用重新部署任何東西。", "zh": "把資料庫結構遷移的 CI/CD 管線，跟應用程式部署的 CI/CD 管線分開。部署新的 Cloud Run revision 時，使用漸進式流量分配。"}, {"letter": "D", "analysis": "錯誤：把兩件事綁在同一條管線裡依序執行，如果程式碼部署階段出了問題需要回滾，光是把程式碼回滾到舊版本並不會自動把資料庫結構也回滾，如果舊版程式碼不相容於已經變更過的新結構，回滾程式碼反而會造成舊程式碼碰到新結構產生錯誤的更糟狀況。", "zh": "使用單一一條 CI/CD 管線，先套用資料庫結構變更，再部署新的 Cloud Run revision。"}], "notes": [{"heading": "題目在問什麼", "body": "關鍵應用程式：無狀態容器化前端跑在 Cloud Run 上，後端是 Cloud SQL for PostgreSQL。應用程式會遇到難以預測的流量尖峰，業務要求一旦部署失敗要能立即回滾到上一個已知良好的狀態。需要套用符合 SRE 原則的部署策略，同時處理好應用程式程式碼和資料庫結構更新這兩件事。"}, {"heading": "答案驗證：C", "body": "看到『要能立即回滾+同時處理程式碼部署和資料庫結構變更』，標準 SRE 做法是：①把資料庫結構遷移和應用程式部署解耦成獨立流程（搭配向後相容的結構變更設計），②善用平台本身的漸進式流量切換機制（像 Cloud Run 的 revision+traffic split）做即時回滾——而不是把兩者綁在同一個部署流程裡一起進退，也不要用 :latest 這種沒有明確歷史版本的標籤方式部署。信心高。"}, {"heading": "基礎知識：Cloud Run Revision 與漸進式流量分配", "body": "Revision（修訂版本）：Cloud Run 每次部署都會產生一個新的、不可變（immutable）的 revision，舊的 revision 不會被覆蓋或刪除，依然存在。\n漸進式流量分配（gradual traffic split）：可以設定讓一部分流量（例如 10%）導到新的 revision 試跑，確認沒問題後再逐步加大比例到 100%，這種做法類似 Canary Release（還記得 Q6 提過的概念嗎）。\n即時回滾：萬一新 revision 出問題，只要把流量設定改回全部導向舊的 revision，就能立即完成回滾，完全不需要重新建置或重新部署任何東西，因為舊版本本來就還在、還能正常接收流量。\n在這題的應用：這個機制正是滿足業務要求的立即回滾能力的關鍵，同時也是 SRE 強調的漸進式交付（progressive delivery）的標準實踐。\n常見程度：GCP 考試中『安全部署策略/快速回滾』情境的標準核心機制。"}, {"heading": "基礎知識：資料庫結構變更要向後相容（Backward Compatible）", "body": "是什麼：資料庫結構（schema）變更時，設計成『新結構依然能讓舊版程式碼正常運作』，常見做法包括：新增欄位時給預設值而不強制所有舊程式碼都要提供這個欄位；要刪除舊欄位時先分階段（讓程式碼先停止使用它，確認沒問題後才真的刪除），這種漸進式的結構變更模式業界稱為『expand/contract（擴張/收縮）』模式。\n解決什麼問題：讓程式碼部署和資料庫結構變更可以彼此獨立進行、獨立回滾，不會因為兩者綁在一起而讓回滾變得危險或不可行。\n在這題的應用：這是選項 C 把兩條管線分開後，資料庫結構遷移管線本身應該遵循的設計原則，讓程式碼的部署/回滾完全不受資料庫結構變更進度的牽制。\n常見程度：資料庫遷移/持續部署領域的核心最佳實踐，常跟『解耦部署管線』的概念一起出現。"}]}}, {"id": "T1-Q219", "topic": 1, "qnum": 219, "question": "Altostrat stores a large library of media content, including sensitive interviews and documentaries, in Cloud Storage. They are concerned about the confidentiality of this content and want to protect it from unauthorized access. You need to implement a Google-recommended solution that is easy to integrate and provides Altostrat with control and auditability of the encryption keys. What should you do?", "options": [{"letter": "A", "text": "Configure Cloud Storage to use server-side encryption with Google-managed encryption keys. Create a bucket policy to restrict access to only authorized Google groups and required service accounts."}, {"letter": "B", "text": "Use Cloud Storage default encryption at rest. Implement fine-grained access control using IAM roles and groups to restrict access to sensitive buckets"}, {"letter": "C", "text": "Implement client-side encryption before uploading it to Cloud Storage. Store the encryption keys in a HashiCorp Vault instance deployed on Google Kubernetes Engine (GKE). Implement fine-grained access control to sensitive Cloud Storage buckets using IAM roles."}, {"letter": "D", "text": "Use customer-managed encryption keys (CMEK) for all Cloud Storage buckets storing sensitive media content. Implement fine-grained access control using IAM roles and groups to restrict access to sensitive buckets."}], "answer": "D", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383590-exam-professional-cloud-architect-topic-1-question-219/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Server-side encryption + Google-managed keys：金鑰完全由 Google 管理，客戶沒有控制金鑰生命週期（產生、輪替、撤銷）的能力，不符合『控制與稽核加密金鑰』的要求。"}, {"letter": "B", "analysis": "Default encryption at rest 本質上也是用 Google-managed keys（GCS 預設就會加密，這不是額外的保護措施），客戶一樣無法控制金鑰，只是多做了 IAM 存取控制，沒有解決金鑰控制權的問題。"}, {"letter": "C", "analysis": "Client-side encryption + 自架 HashiCorp Vault on GKE：客戶對金鑰有完全控制權，但要自己架設、維運整套金鑰管理基礎設施，複雜度非常高，不符合『容易整合』的要求，也不是 Google 官方建議的原生路徑。"}, {"letter": "D", "analysis": "正確：CMEK（Customer-Managed Encryption Keys）透過 Cloud KMS，讓客戶自己產生、輪替、設定過期、撤銷金鑰，所有金鑰操作都記錄在 Cloud Audit Logs 裡，同時是 GCP 原生服務，只要在建立 bucket 時指定 KMS 金鑰即可，加解密流程由 GCP 自動處理，完全符合『Google 建議、容易整合、控制與稽核金鑰』三個要求。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 把大量敏感媒體內容（訪談、紀錄片）存在 Cloud Storage，擔心機密性，想要一個 Google 建議、容易整合、而且公司自己能控制並稽核加密金鑰的解決方案。這題屬於 Altostrat Media 案例研究題組。"}, {"heading": "四個選項的核心差異：誰管金鑰", "body": "A（Google-managed keys）和 B（default encryption，本質上也是 Google 管理金鑰）：客戶都無法控制金鑰生命週期，只是做了存取控制，不符合題目對金鑰控制權的要求。C（client-side encryption + 自架 HashiCorp Vault）：客戶對金鑰有完全控制權，但要自己架設維運整套基礎設施，複雜度高，不符合『容易整合』、也不是 Google 原生建議路徑。D（CMEK + Cloud KMS）：GCP 原生服務，客戶能控制金鑰生命週期並有 Cloud Audit Logs 稽核紀錄，同時整合簡單（只要在建立 bucket 時指定 KMS 金鑰），同時滿足三個要求。"}, {"heading": "答案驗證：D（推理高信心，未找到直接核對的原始 ExamTopics 頁面）", "body": "搜尋沒找到這題在 ExamTopics 的原始討論頁（網站擋爬蟲），但根據 Cloud KMS 官方最佳實務文件，CMEK 正是設計給『客戶要控制金鑰生命週期＋需要稽核紀錄＋不想自己架金鑰管理基礎設施』這種情境使用，技術邏輯站得住腳，信心程度高。"}, {"heading": "記憶重點", "body": "看到『想要自己控制/稽核加密金鑰，但又要容易整合』這種組合要求，答案方向幾乎都是 CMEK + Cloud KMS——這是 GCP 原生服務裡唯一同時滿足『客戶掌握金鑰生命週期』和『不用自己蓋基礎設施』的選項。只有題目強調『金鑰完全不能碰 GCP 的任何服務』這種更極端的合規要求時，才會考慮 CSEK（客戶自己帶金鑰上傳）或像 C 選項這種完全自架的方案。"}]}, "tags": ["Cloud Storage", "Cloud KMS/加密", "安全性", "案例研究題"]}, {"id": "T1-Q220", "topic": 1, "qnum": 220, "question": "Altostrat is experiencing fluctuating computational demands for its batch processing jobs. These jobs are not time-critical and can tolerate occasional interruptions. You want to optimize cloud costs and address batch processing needs. What should you do?", "options": [{"letter": "A", "text": "Configure reserved VM instances"}, {"letter": "B", "text": "Deploy spot VM instances."}, {"letter": "C", "text": "Set up standard VM instances."}, {"letter": "D", "text": "Use Cloud Run functions."}], "answer": "B", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383587-exam-professional-cloud-architect-topic-1-question-220/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Reserved VM instances（預留實例）是反方向的做法——先付錢保證一段時間的運算資源，用在長期、穩定、可預測的工作負載上換取折扣，跟『忽高忽低、可容忍中斷』的批次工作完全不搭。"}, {"letter": "B", "analysis": "正確：Spot VM（前身 Preemptible VM）用比正常價格便宜非常多（通常折扣 60~91%）的方式賣出暫時閒置的運算資源，代價是 GCP 可以隨時收回（中斷工作，通常提前約 30 秒通知）。完全對應『忽高忽低需求、不急迫、可容忍中斷、要省錢』四個條件。"}, {"letter": "C", "analysis": "Standard VM instances（標準隨選實例）正常價格、不打折，沒有利用到『可容忍中斷』這個特性去換取成本優化，不是針對這種彈性批次工作的最佳選擇。"}, {"letter": "D", "analysis": "Cloud Run functions 是無伺服器函式執行環境，設計給事件驅動、短時間執行的任務（例如影片轉檔中繼資料擷取），不是用來跑大量運算、持續一段時間的批次處理工作，性質不符。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 的批次處理工作（batch processing jobs）運算需求忽高忽低，這些工作不急迫、可以容忍偶爾被中斷，想在滿足需求的同時優化雲端成本。屬於 Altostrat Media 案例研究題組。"}, {"heading": "答案驗證：B（高信心，屬 GCP 標準概念定義）", "body": "Spot VM 的設計目的跟題目描述幾乎逐字對應：用可被中斷的風險，換取大幅度的價格折扣，專門處理彈性、非固定、能容忍中斷的工作負載，是 GCP 考試『成本優化』類題目的標準套路，不需外部來源額外核對。"}, {"heading": "記憶重點", "body": "看到『運算需求忽高忽低 + 工作不急迫 + 可容忍中斷 + 想省錢』這種組合描述，幾乎可以直接反射選 Spot VM。核心邏輯是『用可被中斷的風險，換取大幅度的價格折扣』——這跟 Reserved（長期穩定換折扣）、Standard（正常價不打折）、Cloud Run（事件驅動短任務）三者的適用情境都不同，要分清楚各自對應的工作負載特性。"}]}, "tags": ["Compute Engine", "成本優化", "案例研究題"]}, {"id": "T1-Q221", "topic": 1, "qnum": 221, "question": "Altostrat's development team is using a microservices architecture for their application. You need to select the most suitable testing approach to ensure that individual microservices function correctly in isolation. What should you do?", "options": [{"letter": "A", "text": "Run unit testing."}, {"letter": "B", "text": "Use load testing."}, {"letter": "C", "text": "Perform end-to-end testing."}, {"letter": "D", "text": "Execute integration testing"}], "answer": "A", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383591-exam-professional-cloud-architect-topic-1-question-221/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["CI/CD", "案例研究題"]}, {"id": "T1-Q222", "topic": 1, "qnum": 222, "question": "Altostrat needs to analyze the performance of its media processing pipeline running on Java-based Cloud Run function. You need to select the most effective tool for the task. What should you do?", "options": [{"letter": "A", "text": "Query logs in Cloud Logging."}, {"letter": "B", "text": "Analyze the data via Cloud Profiler."}, {"letter": "C", "text": "Instrument the code to use Cloud Trace."}, {"letter": "D", "text": "Inspect data from Snapshot Debugger."}], "answer": "B", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383592-exam-professional-cloud-architect-topic-1-question-222/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Cloud Logging 單純收集、查詢 log 事件紀錄，不是效能分析工具，回答的是『發生了什麼事』，不是『花了多少資源/時間』，不符合『分析效能』的需求。"}, {"letter": "B", "analysis": "正確（中等信心）：Cloud Profiler 持續分析程式碼在執行時 CPU 和記憶體花在哪些函式/區塊上，幾乎零額外設定負擔，原生支援 Java。題目用字『analyze the performance』幾乎是 Google 官方介紹 Profiler 的原文用詞，且題目特別強調『Java-based』呼應 Profiler 對 Java 的良好支援。"}, {"letter": "C", "analysis": "Cloud Trace 是分散式追蹤，分析一個請求跨越多個服務/步驟時每段花多少時間（延遲），常用在微服務架構找出鏈路中最慢的一段。選項寫『Instrument the code』代表要自己動手改程式碼加 trace 埋點，需要額外工程力氣。如果題目強調『pipeline 各階段分別花多少時間』，這個選項也有合理性，是這題比較模稜兩可的地方。"}, {"letter": "D", "analysis": "Snapshot Debugger（Cloud Debugger）在正式環境中即時檢查程式變數狀態，用在抓邏輯錯誤（bug），不是分析效能的工具。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 要分析跑在 Java 版 Cloud Run function 上的媒體處理 pipeline 的效能（performance），問該選哪個最有效的工具。屬於 Altostrat Media 案例研究題組。"}, {"heading": "四個 GCP 可觀測性工具的職責區分", "body": "Cloud Profiler：持續分析程式碼本身在執行時 CPU 和記憶體花在哪，近零額外設定負擔。Cloud Trace：分散式追蹤，分析請求跨多個服務/步驟時每段花多少時間（延遲），常用在微服務架構。Cloud Logging：單純收集查詢 log 事件，不是效能分析工具。Snapshot Debugger：即時檢查程式變數狀態，用來抓邏輯錯誤（bug），不是效能分析。"}, {"heading": "答案驗證：B（中等信心，未找到可交叉比對的外部來源）", "body": "搜尋沒找到這題在 ExamTopics 的原始討論頁。推理依據：題目用字『analyze the performance』幾乎是 Google 官方介紹 Cloud Profiler 的原文用詞，且 Profiler 原生支援 Java（呼應題目特別強調『Java-based』），幾乎不用改程式碼就能用。但選項 C（Cloud Trace）也有一定合理性，如果題目情境更強調『pipeline 各階段分別花多少時間（跨步驟延遲）』，C 會更貼題，這題存在一定模稜兩可空間，不像有些題目那麼篤定。"}, {"heading": "記憶重點", "body": "看到『效能/CPU/記憶體』關鍵字 → 想到 Cloud Profiler；看到『延遲/跨服務請求鏈路』關鍵字 → 想到 Cloud Trace。另一個判斷線索：要不要改程式碼——Profiler 幾乎不用動程式碼，Trace 通常需要手動埋點（除非用自動整合的框架）。"}]}, "tags": ["Cloud Run/Cloud Functions", "Cloud Trace/Profiler", "效能調校", "案例研究題"]}, {"id": "T1-Q223", "topic": 1, "qnum": 223, "question": "Altostrat is concerned about sophisticated, multi-vector Distributed Denial of Service (DDoS) attacks targeting various layers of their infrastructure. DDoS attacks could potentially disrupt video streaming and cause financial losses. You need to mitigate this risk. What should you do?", "options": [{"letter": "A", "text": "Set up VPC Service Controls to restrict access to sensitive resources and prevent data exfiltration."}, {"letter": "B", "text": "Configure Cloud Next Generation Firewall (NGFW) with custom rules to filter malicious traffic at the network level."}, {"letter": "C", "text": "Deploy Google Cloud Armor with pre-configured and custom rules for L3/L4 and L7 protection"}, {"letter": "D", "text": "Activate Security Command Center to monitor security posture and detect potential threats."}], "answer": "C", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383588-exam-professional-cloud-architect-topic-1-question-223/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "VPC Service Controls 是用來建立安全邊界、防止敏感資料外洩（exfiltration）的工具，跟防禦 DDoS 攻擊是完全不同的目的，不符合題目需求。"}, {"letter": "B", "analysis": "Cloud NGFW 可以做網路層級的流量過濾，但不是專門為大規模 DDoS 設計的服務，沒有 Cloud Armor 那種跟 Google 全球邊緣網路整合、能吸收巨量攻擊流量的能力。"}, {"letter": "C", "analysis": "正確：Cloud Armor 提供 L3/L4（網路層/傳輸層）永遠開啟的流量型攻擊防護，再加上 L7（應用層）可設定的預先配置規則和自訂規則，並有 Adaptive Protection（ML）偵測大流量 L7 DDoS 攻擊。選項用詞幾乎是 Cloud Armor 官方賣點的直接翻版，對應題目『multi-vector DDoS』的描述。"}, {"letter": "D", "analysis": "Security Command Center 是監控/偵測工具，幫忙掌握安全態勢、看到威脅，但不會主動攔截或緩解攻擊流量，是被動的可視性工具，不是主動防禦機制。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 擔心複雜、多向量（multi-vector）的 DDoS 攻擊會打到基礎設施的不同層級，可能中斷影音串流、造成財務損失，問該怎麼降低這個風險。屬於 Altostrat Media 案例研究題組。"}, {"heading": "答案驗證：C（已查證，官方文件用詞與選項高度吻合）", "body": "Google 官方文件對 Cloud Armor 的描述：L3/L4 永遠開啟防護 + L7 需設定的預先配置/自訂規則 + Adaptive Protection 偵測高流量 L7 DDoS，跟選項 C「pre-configured and custom rules for L3/L4 and L7 protection」幾乎逐字對應，信心高。"}, {"heading": "記憶重點", "body": "看到『DDoS 攻擊、多層級、要主動防護/緩解』這種描述，直接反射選 Cloud Armor——這是 GCP 專門對抗 DDoS 的旗艦產品，同時涵蓋 L3/L4（自動）和 L7（需設定規則）防護。VPC Service Controls 是防資料外洩，Security Command Center 是監控偵測不是主動防禦，不要跟 DDoS 防護搞混。"}]}, "tags": ["Cloud Armor", "安全性", "案例研究題"]}, {"id": "T1-Q224", "topic": 1, "qnum": 224, "question": "Altostrat is using Apigee for API management and wants to ensure their APIs are protected from overuse and abuse. You need to implement an Apigee feature to control the total number of API calls for cost management. What should you do?", "options": [{"letter": "A", "text": "Set up API key validation."}, {"letter": "B", "text": "Integrate OAuth 2.0 authorization."}, {"letter": "C", "text": "Configure Quota policies."}, {"letter": "D", "text": "Activate XML threat protection."}], "answer": "C", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383593-exam-professional-cloud-architect-topic-1-question-224/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "API key validation 是身分識別機制，用來確認『是誰在呼叫這個 API』，不會限制呼叫次數。"}, {"letter": "B", "analysis": "OAuth 2.0 整合是授權/驗證機制，確認呼叫者有沒有權限存取這個 API，一樣不會限制呼叫次數。"}, {"letter": "C", "analysis": "正確：Quota policy 維護一個計數器，統計 API proxy 收到的請求次數，達到設定上限就拒絕後續呼叫直到計數器重置，是 Apigee 官方設計用來做『長時間週期總量管控、成本管理』的功能，直接對應題目需求。"}, {"letter": "D", "analysis": "XML threat protection 是防禦惡意 XML payload 攻擊（例如 XML bomb、超大巢狀結構攻擊）的資安功能，跟控制呼叫次數完全無關。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 用 Apigee 做 API 管理，想確保 API 不被過度使用/濫用，需要一個 Apigee 功能來控制 API 呼叫的總次數，目的是成本管理。屬於 Altostrat Media 案例研究題組。"}, {"heading": "答案驗證：C（已查證，官方文件直接支持）", "body": "Apigee 官方文件明確說明 Quota policy 的用途就是統計並限制 API proxy 的請求次數，用於成本管理/方案分級。值得注意的細節：官方文件特別提醒『若要防瞬間流量暴衝，應該用 Spike Arrest policy，不是 Quota』——Quota 是給長時間週期（例如每天/每月）總量管控用的。這題問的是『total number of API calls for cost management』，精準對應 Quota 的設計目的，不是 Spike Arrest 的情境，進一步確認 C 正確。"}, {"heading": "記憶重點", "body": "Apigee 裡『限制次數、做成本管理/方案分級』→ Quota policy；『防止短時間流量暴衝』→ Spike Arrest policy；兩者常被搞混，但用途不同要分清楚。API key validation 和 OAuth 2.0 都是身分驗證/授權機制，不是流量管控工具。"}]}, "tags": ["Apigee", "成本優化", "案例研究題"]}, {"id": "T1-Q225", "topic": 1, "qnum": 225, "question": "KnightMotives has developed a new car configurator application to enhance both the dealer and customer experience. The new application will be deployed on Google Kubernetes Engine (GKE) KnightMotives wants you to replicate the deployment of the application across multiple locations to ensure this critical application is always available over the internet, even during regional outages. What should you do?", "options": [{"letter": "A", "text": "Create multiple GKE clusters in different regions. Deploy part of the microservices of the app in different clusters. Configure a multi-cluster Cloud Service Mesh."}, {"letter": "B", "text": "Create multiple GKE clusters in different regions. Deploy the app on every cluster. Configure a multi-cluster Cloud Service Mesh."}, {"letter": "C", "text": "Create a fleet of GKE clusters in different regions Deploy part of the microservices of the app in different clusters Configure a multi-cluster Gateway."}, {"letter": "D", "text": "Create a fleet of GKE clusters in different regions. Deploy the app on every cluster. Configure a multi-cluster Gateway."}], "answer": "D", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383586-exam-professional-cloud-architect-topic-1-question-225/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "把微服務拆開分散到不同叢集（part of the microservices），一旦某區域掛掉，該區域獨有的微服務就會消失，應用功能不完整，違反『always available』的要求；用 Cloud Service Mesh 也不是處理外部流量入口容錯的最佳工具。"}, {"letter": "B", "analysis": "每個叢集都跑完整 app 這點正確，但用 Cloud Service Mesh 處理的是服務之間（east-west）的流量，不是外部使用者進入應用（north-south）的全域容錯路由，不是最貼題的做法。"}, {"letter": "C", "analysis": "用了正確的 multi-cluster Gateway，但微服務拆散到不同叢集，一樣會在區域掛掉時造成功能缺失，不符合『even during regional outages』仍要完整可用的要求。"}, {"letter": "D", "analysis": "正確：每個區域都部署完整的一套應用（不拆分微服務），確保任一區域掛掉時其他區域仍能獨立完整服務；搭配 multi-cluster Gateway——GKE 專門用來把網際網路流量路由到跑在多個叢集的應用、自動避開故障區域的全域負載平衡層，精準對應『always available over the internet, even during regional outages』的需求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives（案例研究公司）的車輛配置器應用要跑在 GKE 上，想要複製部署到多個地點，確保即使某個區域整個掛掉，這個關鍵應用在網際網路上依然保持可用。屬於 KnightMotives Automotive 案例研究題組。"}, {"heading": "答案驗證：D（已查證，官方文件支持）", "body": "Google 官方文件證實 multi-cluster Gateway 就是設計來把網際網路流量路由到跑在多個 GKE 叢集的應用，對應題目『over the internet』的訴求。要『even during regional outages』仍完整可用，必須每個區域都跑完整副本，不能拆分微服務（否則故障區域獨有的微服務會消失）。"}, {"heading": "記憶重點：Service Mesh vs Gateway", "body": "看到『跨區域部署、要求整個應用在區域故障時依然可用』，答案方向是：每個區域都跑完整副本（不要拆分微服務）+ multi-cluster Gateway。區分訣竅：Service Mesh 管微服務之間怎麼互相講話（east-west），Gateway 管外部使用者怎麼進來（north-south，對應『over the internet』這個關鍵字）。"}, {"heading": "什麼是 Cloud Service Mesh", "body": "Cloud Service Mesh（前身叫 Anthos Service Mesh）是 GCP 的服務網格產品，底層基於開源 Istio。核心概念：當應用拆成大量微服務，彼此要互相呼叫（east-west traffic），Service Mesh 在每個微服務旁放一個輕量代理（sidecar proxy，用 Envoy），所有進出該服務的流量先經過代理，讓加密（mTLS）、重試、流量切分（金絲雀/A-B測試）、可觀測性、熔斷等基礎設施邏輯統一由代理處理，微服務本身程式碼不用管這些。multi-cluster Service Mesh 可以讓不同 GKE 叢集（甚至跨雲）裡的微服務彼此互相呼叫，像在同一個網路裡一樣。強項是處理『服務之間怎麼溝通』，不是處理『外部使用者怎麼進來』。"}, {"heading": "North-South vs East-West：資料中心網路方向性比喻", "body": "這是資料中心網路工程的經典比喻，把流量方向畫成地圖方位。North-South（南北向）：流量從外部（網際網路、使用者）進來打到應用，『北方』代表外部世界，『南方』代表資料中心內部，流量由外往內（或回應往外）；典型工具是 Load Balancer、Gateway、Ingress。East-West（東西向）：流量發生在內部服務之間彼此呼叫，像微服務們平行排列、流量在同一層橫向移動、不出網路邊界；典型工具是 Service Mesh。對照 Q225：選項 A、B 的 Cloud Service Mesh 處理 East-West（服務互相講話）；選項 C、D 的 multi-cluster Gateway 處理 North-South（外部使用者怎麼進來、怎麼在多區域間容錯切換），這正是題目『always available over the internet』要的那一層，所以答案選用 Gateway 的 D，不是用 Service Mesh 的 B。"}]}, "keywords": ["replicate the deployment of the application across multiple locations", "always available over the internet", "even during regional outages"], "tags": ["GKE/Kubernetes", "高可用性/災難復原", "多區域架構", "案例研究題"]}, {"id": "T1-Q226", "topic": 1, "qnum": 226, "question": "As part of its development of fully autonomous driving vehicles. KnightMotives wants to analyze all vehicle sensor data during test drives. The analysis will enable KnightMotives to improve its software based on insights from this data.• Different event types, such as parking, overtaking and navigating, need to be analyzed. Each test vehicle and event type has an ID.• Different categories of sensors, such as cameras, radars, and ultrasonic beams, also need to be analyzed. During each autonomously-initiated event, data from multiple sensors will be captured and sent to Google Cloud where the data will be stored in Bigtable.During data analysis, you want to be able to retrieve all sensor data of occurrences of the same event type for a specific vehicle within a specific interval of time. You need to design a Bigtable schema that is optimized for read performance. What should you do?", "options": [{"letter": "A", "text": "Use the sensor category, event ID, and timestamp (in that order) as the row key. Create a column family for each individual sensor and a column qualifier for each vehicle."}, {"letter": "B", "text": "Use the timestamp, vehicle ID, and event ID (in that order) as the row key. Create a column family per sensor category, and use a column qualifier for each individual sensor within its respective category."}, {"letter": "C", "text": "Use the vehicle ID, event ID, and timestamp (in that order) as the row key. Create a column family per sensor category, and use a column qualifier for each individual sensor within its respective category."}, {"letter": "D", "text": "Use the vehicle ID and event ID (in that order) as the row key. Create a column family per sensor category, and use a column qualifier for each individual sensor within its respective category. Utilize the timestamped versions of a cell to distinguish between different moments in time of similar events."}], "answer": "B", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383589-exam-professional-cloud-architect-topic-1-question-226/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "row key 用『感測器類別 + 事件ID + 時間戳』，完全沒有車輛ID，無法鎖定『特定車輛』這個查詢條件；而且把 column family/qualifier 的角色也用反了（照題目邏輯應該是每個感測器類別一個 family，而不是每個車輛一個 qualifier），不符合查詢需求也不符合一般 schema 設計邏輯。"}, {"letter": "B", "analysis": "存疑（我認為這不是最佳答案）：row key 用『時間戳 + 車輛ID + 事件ID』，時間戳放在最前面。Google 官方 Bigtable 文件明確警告：時間戳打頭的 row key 會讓同時間寫入的資料全部擠在同一小段 key 空間，造成寫入熱點（hotspotting）；而且查詢『特定車輛+特定事件類型+時間區間』時，同時間其他車輛/事件的資料會穿插其中，無法做連續範圍掃描，讀取效率反而更差，跟題目『optimized for read performance』的目標矛盾。"}, {"letter": "C", "analysis": "我認為這才是正確答案：row key 用『車輛ID + 事件ID + 時間戳』，可以用『車輛ID+事件ID』當前綴鎖定連續的一塊 row，再對時間戳做範圍掃描，一次完成『特定車輛、同一事件類型、時間區間』的高效率連續讀取，完全對應題目查詢模式；高基數欄位在前、時間戳在後，也符合 Google 官方建議的時間序列 row key 設計原則（避免熱點）。"}, {"letter": "D", "analysis": "row key 只有『車輛ID + 事件ID』，不含時間戳，改用 cell 的 timestamped versions 區分不同時間點的資料。問題是 cell 版本機制設計上是用來存同一邏輯值的歷史修訂，不是用來存無限持續產生的時間序列事件；測試車輛會不斷觸發新事件，會讓同一 row 的 cell 版本數量無限增長，也無法對時間區間做高效率的 row-level range scan（需整列讀出再篩選版本），不符合『range 查詢 + 讀取效能優化』的需求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 測試自動駕駛車時，收集各種感測器（相機、雷達、超音波）資料存進 Bigtable。查詢需求：針對特定一台車，找出同一種事件類型（停車、超車、導航…）的所有發生紀錄，且只要特定時間區間內的資料。要設計一個針對讀取效能優化的 Bigtable row key / column family schema。"}, {"heading": "⚠️ 答案存疑：我認為應該是 C，不是存的答案 B", "body": "Bigtable row 依 row key 字典順序排序，只有從 row key 最前面開始的連續前綴才能做高效率範圍掃描。查詢是『特定車輛+特定事件類型+時間區間』，C 的 row key（車輛ID+事件ID+時間戳）能用前兩段鎖定連續區塊、再對時間戳做範圍掃描，一次完成高效率連續讀取；B 把時間戳放最前面，不但查詢時其他車輛/事件的資料會穿插其中無法連續掃描，更嚴重的是違反 Google 官方 Bigtable schema 設計文件明確警告的『時間戳開頭 row key 會造成寫入熱點』反模式。搜尋到的 GCP 實務指南（fleet of cars 情境）也採用『高基數 ID 在前、時間戳在後』的標準做法，支持 C 才是正確設計。沒找到這題在 ExamTopics 的原始討論頁做最終核對，但技術推理站得住腳，信心中高。"}, {"heading": "什麼是 Time Series Database（時間序列資料庫）", "body": "專門為『隨時間不斷累積的連續數據點』設計的資料庫，每筆資料都跟時間戳綁在一起，幾乎只新增、很少修改，查詢模式通常是『某時間區間內的資料/趨勢』。這題的車輛感測器資料就是典型時間序列資料：寫入量大且持續、查詢幾乎都是『時間範圍+某個識別碼』、資料量無限成長常需搭配 TTL 自動清除。GCP 裡適合存時間序列資料：Cloud Bigtable（高寫入量+row key range scan，這題用的）、BigQuery（大量歷史分析彙總查詢）、Cloud Monitoring 內建時序資料庫（存指標，原生 TTL）。時間序列 row key 設計黃金法則：高基數識別碼放前面，時間戳放後面，才能同時避免寫入熱點、又支援針對特定識別碼做時間區間查詢。"}, {"heading": "什麼是 Cell（儲存格）", "body": "Bigtable 資料模型：Table → Row（由 row key 決定）→ Column Family → Column Qualifier → Cell。Cell 就是「某個 row、某個 column」交叉出來實際存放資料值的那一格，類似 Excel 表格裡的一格。跟一般資料庫不同的是，一個 cell 可以同時存多個『版本』（timestamped versions），每個版本都帶自己的時間戳，依新舊排序疊放，由 garbage collection policy 控制保留幾個版本或多久。這也是 D 選項失敗的原因：cell 版本機制適合存『同一邏輯值的少量歷史修訂』（例如同一欄位被改過幾次），不適合存『無限持續產生的時間序列事件』——車輛會不斷觸發新事件，版本數會無限膨脹，而且無法對 cell 版本做 row-level range scan（要整列讀出再篩選版本），效能上不如把時間戳放進 row key 本身。"}, {"heading": "記憶重點", "body": "Bigtable row key 設計口訣：高基數、常被拿來做『鎖定範圍』的欄位放前面（像車輛ID、事件ID），時間戳放最後面。只要看到『時間戳放在 row key 最前面』的選項，先打個問號——這幾乎都是 Bigtable 官方明確警告的 hotspotting 反模式。另外要分清楚：cell 版本機制適合存『同一邏輯值的少量歷史修訂』，不適合存『無限持續產生的時間序列事件』。"}]}, "keywords": ["retrieve all sensor data of occurrences of the same event type for a specific vehicle within a specific interval of time", "optimized for read performance"], "myAnswer": "C", "tags": ["Bigtable", "資料庫Schema設計", "效能調校", "案例研究題", "⚠️答案存疑"]}, {"id": "T1-Q227", "topic": 1, "qnum": 227, "question": "Company Overview -KnightMotives is a car manufacturer specializing in autonomous, self-driving vehicles, including Battery Electric Vehicles (BEVs), hybrids and traditional internal combustion engine (ICE) vehicles. While KnightMotives has made strides with the in-vehicle experience in their BEV fleet, the hybrid and ICE vehicles have yet to implement these new systems and are viewed poorly by critics and drivers. The lack of modern in-vehicle technology in hybrid and ICE vehicles has resulted in declining sales and customer satisfaction.KnightMotives wants to modernize the consumer experience across all vehicles within five years Artificial Intelligence offers a unique opportunity to revolutionize the in-vehicle experience, as well as the shopping buying and service/maintenance experience. Investment in this new technology will require a shift in financial priorities on a global scale.KnightMotives also wants to improve their online ordering system, which is unreliable. Systems for customers to build their vehicle online for acquisition through a dealer are not delivering the data or reliability that dealers need, causing. A strain in the relationship between KnightMotives and dealers. Service technicians and sales staff need better tooling to enhance dealer successes, including built-to-order vehicles.Solution Concept -KnightMotives wants to shift from manufacturing cars to creating a complete and compelling “automotive experience.” Then strategy prioritizes delivering a consistent experience across all models, developing AI-powered features, generating new revenue from data monetization, adopting a digital focus to differentiate their brand from competitors, and developing better tools for mechanics and salespeople.Existing Technical Environment -KnightMotives's IT is largely on-premises with some applications on major cloud platforms. Their supply chain runs on an outdated mainframe, and Enterprise Resource Planning (ERP) is also outdated, making new promotions and dealer discounts difficult to implement. Dealers have no budget for new equipment. There is fragmentation across vehicles with multiple code bases, and significant technical debt from supporting backwards compatibility. Network connectivity to manufacturing plants and vehicle connectivity in rural areas are challenges.Business Requirements -Key business requirements include fostering a personalized relationship with the driver and delivering a cohesive experience across all models. Creating a better build-to-order model will reduce time on the lot and provide transparency for both dealers and customers. Additionally, KnightMotives seeks to monetize corporate data to finance new technology investments, as their current AI infrastructure is obsolete and corporate data remains siloed. Security is a paramount concern due to past data breaches Adherence to European Union (EU) data protection regulations, especially for emerging autonomous platforms, is critical.KnightMotives plans to make significant investments in fully autonomous driving capabilities, with initial implementation targeting regions with favorable regulatory environments. Prioritizing employee upskilling, attracting top-tier talent, and fostering better communication between business and technical teams are also critical objectives.Technical Requirements -• Modernizing the in-vehicle experience includes developing a consistent user experience (UX) that seamlessly integrates AI-powered features across all models, updating in-vehicle hardware and software in legacy models to support new UX features and AI capabilities, and ensuring reliable network connectivity, especially in rural areas, to support real-time AI features and data transmission.• Network upgrades are necessary to support increased data traffic and improve connectivity between plants and headquarters.• IT infrastructure modernization requires adopting a hybrid cloud strategy to leverage the benefits of both on-premises and cloud infrastructure, and gradually modernizing or replacing legacy systems to improve efficiency and agility.• Autonomous vehicle development and testing requires investing in cutting-edge AI and machine learning technologies, building a robust simulation environment, and ensuring compliance with evolving regulations related to autonomous vehicles.• Data monetization and insights requires implementing a robust data management platform, strict data security and privacy measures, and a scalable AI/ML infrastructure.• Increased focus on security and risk management involves implementing a comprehensive security framework to protect against cyber threats and data breaches, developing an incident response plan, and providing security awareness training to employees.• Providing a delightful experience for dealers and customers requires improving the online build-to-order system; developing modern dealer tools to streamline dealer operations, including sales, service, and inventory management; and implementing a comprehensive Customer Relationship Management (CRM) system to track customer interactions personalize experiences, and improve customer satisfaction.Executive Statement -KnightMotives is committed to enhancing safety and saving lives by leveraging an extensive body of data — encompassing driving, road conditions, behavioral studies, and crash safety statistics — to create compelling digital experiences for drivers. Our AI consistently outperforms national safety statistics, ensuring the unique and coveted KnightMotives experience is aligned across all our vehicle models.Michael Knight, KnightMotives CEOFor this question, refer to the KnightMotives Automotive case study, KnightMotives has deployed their new Dealer Tools on Google Kubernetes Engine (GKE). You are supporting KnightMotives in the performance of the GKE workloads. Some of the Pods are Statefull. To ensure these Pods do not consume an unlimited amount of CPU, you have configured resource limits on the Deployments. You have identified that these Pods were allocated too much CPU and are actually consuming drastically less some of the time. You want to optimize resource usage and allow maximum flexibility in case of higher load. What should you do?", "options": [{"letter": "A", "text": "Configure resource requests per Deployment. Set resource requests slightly above the typical CPU usage observed during monitoring."}, {"letter": "B", "text": "Configure resource requests per Deployment. Ensure the requests are equal to the current limits."}, {"letter": "C", "text": "Enable vertical Pod autoscaling on each Deployment. Ensure the autoscaling mode is set to Auto."}, {"letter": "D", "text": "Enable horizontal Pod autoscaling on each Deployment. Ensure the minimum number of Pods is lower than the currently configured amount in the Deployment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383571-exam-professional-cloud-architect-topic-1-question-227/", "postedDate": "2026-02-10", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "手動設定 requests 略高於觀察到的典型用量，是一次性、靜態的調整，不會隨用量變化持續自我調整，用量模式一變就要重新手動調整，不是真正的優化機制。"}, {"letter": "B", "analysis": "讓 requests 等於目前的 limits，會讓這個 Pod 變成 Guaranteed QoS，不管實際有沒有用到都永久預留等同 limits 的資源，加劇浪費，方向完全錯誤。"}, {"letter": "C", "analysis": "正確：VPA（Vertical Pod Autoscaler）會持續觀察 Pod 實際 CPU/記憶體用量歷史，自動調整 resource requests（甚至 limits），讓配置動態貼合實際用量；用量低時自動調低（省資源）、用量持續升高時自動調高（給彈性應付尖峰）。設成 Auto 模式代表建議值自動套用，不用人工介入，完全對應『優化資源使用+保有彈性』兩個訴求。"}, {"letter": "D", "analysis": "HPA（水平自動擴縮）調的是『要開幾個 Pod』，不是『每個 Pod 該分配多少資源』。題目的問題是每個 Pod 的資源配置量不合理（垂直問題），不是 Pod 數量問題（水平問題），用錯工具；而且 Stateful 的 Pod 通常綁定專屬身份/儲存，水平縮放語意更複雜，不是解決配置浪費最直接的做法。"}], "notes": [{"heading": "題目在問什麼（已去除案例研究背景）", "body": "KnightMotives 的 Dealer Tools 跑在 GKE 上，部分 Pod 是 Stateful（StatefulSet 管理）。已設定 resource limits 避免無限吃資源，但發現這些 Pod 被分配太多 CPU，且實際用量常常遠低於分配量，想要優化資源使用，同時在負載變高時仍保有最大彈性。"}, {"heading": "答案驗證：C（已查證，官方文件+練習資源支持）", "body": "GKE 官方文件確認 StatefulSet 是合法的 VPA 目標對象，GCP 官方 PCA 考試練習資源也把『VPA Auto 模式』當成這類情境的標準答案，信心高。"}, {"heading": "基礎知識：Node / Pod / Container / Kubernetes 的關係", "body": "Kubernetes（K8s）是容器編排系統，幫你自動管理大量容器該放哪裡跑、掛了自動重開、流量大自動擴縮。Container（容器）是把應用程式和它需要的所有東西打包在一起的輕量虛擬化技術，共用主機作業系統核心但擁有獨立檔案系統/網路/程序空間，比傳統 VM 輕量快速，最常見技術是 Docker。Pod 是 Kubernetes 最小部署單位，裡面跑著一個或多個 Container。Node 是一台實體或虛擬機器，擁有真正的硬體資源（CPU/記憶體），一個 Node 通常不只一顆 CPU（可能 4 核、8 核甚至更多，看機器規格），一台 Node 上同時跑著多個 Pod，這些 Pod 共用這台 Node 的 CPU 資源。Kubernetes 叢集由很多台 Node 組成。層級關係：Cluster（多個 Node）→ Node（多個 Pod）→ Pod（一個或多個 Container）。"}, {"heading": "基礎知識：Request vs Limit", "body": "Request（請求量）是 Pod 保證拿到的資源下限，排程器依此判斷某台 Node 剩餘資源夠不夠放這個 Pod，這份資源保證給它、其他 Pod 不能搶。Limit（上限）是 Pod 最多能用到的資源上限，超過 CPU 會被節流、記憶體超過會被 OOMKilled。一台 Node 能塞下幾個 Pod，看這些 Pod 的 request 加總有沒有超過 Node 的總資源量。選項 B 把 request 設成等於 limit，會讓 Pod 變成 Guaranteed QoS，資源永久被鎖定保留，就算沒用到其他 Pod 也不能用，這正是題目想避免的浪費。"}, {"heading": "基礎知識：Stateless vs Stateful，以及 Kubernetes 的幾種控制器", "body": "Stateless（無狀態）：Pod 本身不保存重要資料，壞了直接砍掉重開一個新的即可，新舊 Pod 完全對等可互相替換，例如單純處理請求不存資料的 Web 伺服器，由 Deployment 管理。Stateful（有狀態）：Pod 有專屬於自己的資料或身份，不能隨便砍掉重開，例如資料庫節點，由 StatefulSet 管理，每個 Pod 有固定穩定的名字（pod-0、pod-1…）和專屬儲存空間，重建後仍接回同樣名字和資料。其他控制器：DaemonSet 確保每台 Node 都剛好跑一個特定 Pod（常用於監控/日誌收集）；Job/CronJob 跑一次性或定時任務，跑完就結束，不是常駐服務。"}, {"heading": "基礎知識：HPA vs VPA", "body": "HPA（Horizontal Pod Autoscaler，水平自動擴縮）：監控指標（常見是 CPU 使用率），負載升高時自動增加 Pod 複本數量，負載降低時自動減少，調的是『要開幾個 Pod』。VPA（Vertical Pod Autoscaler，垂直自動擴縮）：持續觀察單一 Pod 的實際用量，自動調整這個 Pod 的 resource request/limit 大小，調的是『每個 Pod 該分配多少資源』。比喻：客人變多開更多收銀櫃檯是 HPA；把空間浪費的櫃檯改小、長期大排長龍的櫃檯擴大是 VPA。Q227 的問題是『每個 Pod 的資源配置量不合理』，是垂直問題，所以要用 VPA 不是 HPA。"}, {"heading": "記憶重點", "body": "看到『Pod 的 CPU/記憶體用量忽高忽低，目前靜態配置浪費資源，想要自動優化+保留彈性』，直接反射選 VPA，注意是調單一 Pod 的資源大小，不是調 Pod 數量（那是 HPA）。看到『requests 設成等於 limits』要能判斷這是加劇資源鎖定浪費的反模式，不是優化。遇到 StatefulSet 管理的 Pod，優先考慮垂直調整（VPA）而非水平調整（HPA），因為每個複本可能綁定專屬身份/儲存，水平縮放語意更複雜。"}]}, "keywords": ["were allocated too much CPU and are actually consuming drastically less some of the time", "optimize resource usage and allow maximum flexibility in case of higher load"], "tags": ["GKE/Kubernetes", "自動擴縮", "效能調校"]}, {"id": "T1-Q228", "topic": 1, "qnum": 228, "question": "KnightMotives has established a dedicated Google Cloud Interconnect with 99.99% availability between its headquarters and two different metropolitan areas corresponding to the us-central1 and us-east1 Google Cloud regions. To minimize cost and latency between these workloads, you want to ensure all workloads in Google Cloud are deployed in these two regions as the VLAN attachment for the Cloud Interconnect. What should you do?", "options": [{"letter": "A", "text": "Schedule an export of all assets via Asset Inventory into BigQuery. Schedule a daily Cloud Run function to query the export and send out an alert if resources are created in regions outside of the allowed list."}, {"letter": "B", "text": "Ensure all deployments are done through Infrastructure as Code using standardized Terraform modules. Configure the region variable of all resources with a default value corresponding to one of the allowed regions."}, {"letter": "C", "text": "Limit the Google Cloud VPC used by the Cloud Interconnect to only have subnets in the allowed regions."}, {"letter": "D", "text": "Configure the Resource Location Restriction constraint organization policy at the organization level, and ensure only the allowed regions are listed."}], "answer": "A", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383594-exam-professional-cloud-architect-topic-1-question-228/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "存疑（我認為這不是最佳答案）：排程匯出資產清單到 BigQuery，每天用 Cloud Run 函式查詢、發現違規才發送警告。這是偵測型（detective）控制，資源已經被建在錯誤區域之後才發現，無法真正『ensure（確保）』工作負載只部署在允許的區域，等成本和延遲的問題已經發生了才知道。"}, {"letter": "B", "analysis": "IaC + Terraform 預設區域變數只是『建議值』，任何人部署時都可以覆寫這個預設值，也無法阻止不透過這套模組、用其他方式（Console、gcloud）手動建立的資源，是軟性規範不是強制護欄。"}, {"letter": "C", "analysis": "只限制了 Cloud Interconnect 使用的『那一個特定 VPC』的子網路範圍，不會阻止其他資源（運算、儲存、或全新建立的 VPC）被建在允許區域之外，涵蓋範圍太窄，沒有做到『所有工作負載』這個範圍。"}, {"letter": "D", "analysis": "我認為這才是正確答案：在組織層級設定 Resource Location Restriction 這個 organization policy constraint，明確列出允許的區域。這是預防型（preventive）控制，GCP 會在 API 層級直接擋下任何試圖在允許清單以外區域建立資源的請求，不管是 Console、gcloud 還是 Terraform，都無法繞過，真正符合『ensure all workloads... are deployed in these two regions』的要求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 在總部跟 us-central1、us-east1 兩區之間建了專屬 Cloud Interconnect（99.99% 可用性專線），VLAN attachment 也接在這兩區。為了降低成本和延遲，希望確保所有部署在 Google Cloud 的工作負載都只落在這兩個區域。"}, {"heading": "⚠️ 答案存疑：我認為應該是 D，不是存的答案 A", "body": "關鍵字是『ensure（確保）』，代表要的是預防性、強制擋下違規的機制，不是事後才發現的機制。A 是偵測型控制（資源已建立在錯誤區域後才告警），無法真正『確保』；D（Resource Location Restriction org policy）是 Google 官方提供、在 API 層級直接擋下不符合規定的資源建立請求的機制，才是真正做到『ensure』的工具。已查證 Google 官方文件確認 Resource Location Restriction 就是設計來做組織層級、強制性地域合規限制用的，支持這個判斷。沒找到這題在 ExamTopics 的原始討論頁做最終核對，但技術推理站得住腳，信心中高。"}, {"heading": "什麼是 VLAN", "body": "VLAN（Virtual Local Area Network）是在同一組實體網路設備上，邏輯上切出好幾個獨立網路的技術，每個 VLAN 有一個 VLAN ID 標籤，讓設備知道封包屬於哪個邏輯網路。Cloud Interconnect 的『VLAN attachment』就是在實體專線上切出一個邏輯連結，這個邏輯連結會綁定連到 Google Cloud 裡某一個特定區域的 VPC 網路——這也是為什麼 VLAN attachment 的設計是綁定特定區域的，不是接到任意區域都可以。一條實體 Cloud Interconnect 連線可以切出多個 VLAN attachment，各自連到不同區域。"}, {"heading": "什麼是 Cloud Interconnect，Dedicated vs Partner 的命名關係", "body": "Cloud Interconnect 是 Google Cloud 讓企業內部網路跟 GCP 網路之間建立專屬、不經過公開網際網路連線的產品總稱，底下分兩種子類型：Dedicated Interconnect（自己花錢牽專屬實體光纖線到 Google 共置機房，整條線只有自己用）、Partner Interconnect（透過已經跟 Google 有實體線路的電信商合作夥伴間接連線，不用自己拉線）。『Cloud Interconnect』本身不是一個具體方案，是這兩種子類型的總稱，類似『手機』是大類別、『iPhone/Android』是子類型的關係。優點：更穩定（有 SLA，如題目的 99.99%）、更低延遲（專線不跟人共享頻寬）、更安全（不經公開網路）、大流量下計費通常較便宜。對比 Cloud VPN：VPN 走公開網際網路、用加密建立邏輯通道，建置成本低但不保證穩定性，跟 Cloud Interconnect 的實體專線本質完全不同。Q228 題目用詞是『dedicated Google Cloud Interconnect』，明確指的是 Dedicated Interconnect 這個子類型。"}, {"heading": "記憶重點", "body": "看到『ensure/確保資源只能部署在特定區域』這種需求，要分辨：只是監控/事後告警 → 偵測型控制，不等於確保；真正能擋下不符合規定的資源建立 → 用 Organization Policy 的 Resource Location Restriction（gcp.resourceLocations constraint），這是 GCP 官方設計來做組織層級強制性地域合規的標準工具。另外要記住 Cloud Interconnect 是大類別、Dedicated/Partner 是子類型，不要把兩者當成同一層級的東西搞混。"}]}, "keywords": ["ensure all workloads in Google Cloud are deployed in these two regions"], "myAnswer": "D", "tags": ["Organization Policy", "合規性", "案例研究題", "⚠️答案存疑"]}, {"id": "T1-Q229", "topic": 1, "qnum": 229, "question": "KnightMotives is managing supplier data and pricing in a central MySQL database at headquarters (HQ). Only personnel at HQ are allowed to change the data. Each local plant stores a copy of the data in their own MySQL database, often using a different database schema or version. Every night a batch job exports any product or price updates in XML format from the central database at HQ and stores the updated data on a central FTP server. Each local plant must download this XML file and update their local system with the new information. The local data kept by some plants has become inconsistent with the source data due to XML parsing issues. HQ wants to easily verify that all changes are applied correctly at each plant.", "options": [{"letter": "A", "text": "Create a Pub/Sub topic per supplier, and have HQ publish all changes related to the respective supplier in JSON format on that topic. Allow all plants to create Pub/Sub Pull subscription to receive messages for their suppliers and update their databases."}, {"letter": "B", "text": "Create a Pub/Sub topic per supplier, and have HQ publish all changes related to the respective supplier in JSON format on that topic. Allow all plants to create Pub/Sub Push subscription to receive messages for their suppliers and update their databases."}, {"letter": "C", "text": "Migrate the self-hosted MySQL database at HQ to Cloud SQL. Standardize the database schema across all plants, and configure the local databases as external read replicas in Cloud SQL."}, {"letter": "D", "text": "Migrate the self-hosted MySQL database at HQ to Cloud SQL. Configure Database Migration Service between Cloud SQL and the on-premises databases. When creating the migration job. choose continuous migration instead of one-time migration."}], "answer": "C", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383605-exam-professional-cloud-architect-topic-1-question-229/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "把 XML 換成 JSON、把 FTP 換成 Pub/Sub Pull 訂閱，但每個工廠收到訊息後還是要自己寫程式解析、套用到資料庫，本質問題沒解決；也完全沒處理『各工廠 schema 不同』這個根本原因。"}, {"letter": "B", "analysis": "跟 A 同樣的根本問題，只是用 Push 訂閱取代 Pull——Pub/Sub 主動把訊息推到工廠的 HTTPS 端點，但一樣需要工廠自己寫解析/套用邏輯，且要求工廠對外開放可被呼叫的端點，不一定符合各工廠的網路環境。"}, {"letter": "C", "analysis": "正確：先把各工廠 schema 標準化，解決『不同 schema/版本』這個根本問題；再把各工廠本地資料庫設定成 Cloud SQL 的外部唯讀複本，用資料庫引擎原生複寫機制取代『匯出XML+FTP+解析』整個容易出錯的人工流程，複寫狀態天生可監控，直接對應『HQ 想要輕鬆驗證』的需求。"}, {"letter": "D", "analysis": "Database Migration Service 設計上是用來做『遷移/一次性切換』，即使選 continuous 模式，目的也是把停機時間降到最低、最終完全切換到 Cloud SQL，不是設計來長期維持『一個中央資料庫+多個永久並存的下游資料庫』這種架構；而且完全沒提到處理 schema 不同的問題。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 在 HQ 管理供應商資料和價格，存在中央 MySQL，只有 HQ 的人能改資料。每個地方工廠各自保留一份資料副本，存在自己的 MySQL，常常用不同 schema 或版本。每晚批次工作把異動匯出成 XML，丟到中央 FTP 伺服器，各工廠下載並解析套用。問題：有些工廠的資料因 XML 解析問題變得不一致，HQ 想要輕鬆驗證每個工廠的異動都有正確套用。"}, {"heading": "答案驗證：C（推理信心高，核心原因對應正確）", "body": "C 同時解決兩個核心問題：① 用『先標準化 schema』對應題目點出的『不同 schema/版本』根本原因；② 用 Cloud SQL 原生外部複寫取代『匯出XML+FTP+人工解析』的流程，資料庫層級複寫天生可監控驗證，直接對應『HQ 想要輕鬆驗證』的需求。Google 官方文件確認 Cloud SQL 支援『複寫到外部伺服器』功能，技術上可行。"}, {"heading": "服務介紹：Pub/Sub", "body": "Cloud Pub/Sub 是 GCP 的訊息佇列/發布訂閱服務，讓不同系統非同步傳遞訊息。Topic 是訊息頻道，發送方發布訊息；Subscription 是訂閱，接收方訂閱才能收到訊息，一個 Topic 可以有多個訂閱者。Pull：訂閱者主動定期去問有沒有新訊息；Push：Pub/Sub 主動把訊息推到你指定的 HTTPS 端點。本題選項 A/B 想用它取代 FTP，但收到訊息後還是要自己寫解析/套用邏輯，沒解決根本問題。"}, {"heading": "服務介紹：Cloud SQL 與複寫", "body": "Cloud SQL 是 GCP 全託管關聯式資料庫服務，支援 MySQL/PostgreSQL/SQL Server，Google 幫忙處理備份、修補、高可用性。關鍵功能：複寫（Replication）——主要資料庫（primary）的異動自動即時同步到複本（replica），甚至能複寫到 GCP 以外的『外部伺服器』（External Server Replication）。本題答案 C 就是用這個功能，讓各工廠的本地 MySQL 當 Cloud SQL 的外部唯讀複本，資料庫引擎自動保持同步。"}, {"heading": "服務介紹：Database Migration Service（DMS）", "body": "DMS 是 GCP 的資料庫遷移服務，幫你把現有資料庫（地端或其他雲）搬到 Cloud SQL。一次性遷移：搬一次就結束；持續遷移：持續同步異動直到你準備好正式切換（promote），目的是降低停機時間。核心理解：DMS 本質是為了『搬家』設計的，終點是讓你最終完全改用 Cloud SQL、淘汰舊資料庫，不是設計來長期維持中央+多個下游資料庫並存的架構，這是選項 D 不適合的原因。"}, {"heading": "什麼是 FTP", "body": "FTP（File Transfer Protocol）是古老的檔案傳輸協定，主從式架構：FTP 伺服器存放檔案，客戶端連上去上傳/下載檔案。本題情境：HQ 批次工作把 XML 上傳到中央 FTP 伺服器，各工廠定期連上去下載、自己解析套用。缺點：預設不加密（安全性較弱）、批次處理沒有即時性、檔案格式要靠人工解析邏輯（容易出錯、難以驗證同步狀態）、沒有自動重試/一致性保證機制。這些缺點正是 Q229 要解決的痛點，答案 C 用資料庫原生複寫徹底取代這整套流程。"}, {"heading": "MySQL 是 RDB 還是 NoSQL", "body": "MySQL 是 RDB（關聯式資料庫），不是 NoSQL。核心特徵：資料存在固定 schema 的表格裡、支援 SQL 語法、支援 JOIN 跨表查詢、支援 ACID 交易保證強一致性。RDB 適合資料結構固定、需要精確一致性、有複雜關聯查詢的情境（像本題的供應商價格資料）；NoSQL（如 Bigtable）適合資料量巨大、結構多變、高吞吐寫入、不需要複雜 JOIN 的情境（像 Q8、Q226 的感測器資料）。"}, {"heading": "記憶重點", "body": "看到『中央資料庫 + 多個地方資料庫要保持同步、且容易驗證一致性』，優先考慮資料庫原生複寫機制，而不是『匯出檔案+訊息佇列』這種需要額外解析邏輯的方案。看到『不同環境 schema 不一致』，要先想到『標準化 schema』是解決問題的前提。DMS 是遷移/切換工具，不是長期多端並存的同步架構。"}]}, "keywords": ["often using a different database schema or version", "has become inconsistent with the source data due to XML parsing issues", "HQ wants to easily verify that all changes are applied correctly at each plant"], "tags": ["Pub/Sub", "Database Migration Service", "Cloud SQL", "案例研究題"]}, {"id": "T1-Q230", "topic": 1, "qnum": 230, "question": "KnightMotives wants to personalize the dealer experience for its customers and has decided to train its own AI models for personalized recommendations. The company will start collecting personally identifiable information (PII) from its customers to use as part of the models’ training data. KnightMotives wants to ensure maximum security and compliance worldwide. You need to ensure the data is encrypted both at rest and during AI model training without impacting the models’ accuracy. What should you do?", "options": [{"letter": "A", "text": "Store the training data in BigQuery using column-level encryption. Train the model using Confidential GKE Nodes."}, {"letter": "B", "text": "Store the training data in BigQuery using column-level encryption Train the model on VertexAI notebooks using customer-managed encryption keys."}, {"letter": "C", "text": "Process all data with Sensitive Data Protection’s de-identification service. Replace any PII with a random string before storing it. Train the model using Confidential GKE Nodes."}, {"letter": "D", "text": "Process all data with Sensitive Data Protection's de-identification service. Replace any PII with a random string before storing it. Train the model on VertexAI notebooks using customer-managed encryption keys."}], "answer": "A", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383572-exam-professional-cloud-architect-topic-1-question-230/", "postedDate": "2026-02-10", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "正確：BigQuery 欄位層級加密負責『靜置加密』，Confidential GKE Nodes 用硬體層級記憶體加密負責『訓練當下（運算中）的加密』，同時保留真實 PII 資料不破壞訓練用的個人化特徵，不影響模型準確度，同時滿足題目三個條件。"}, {"letter": "B", "analysis": "欄位加密+保留真實資料這點正確，但訓練環境用 Vertex AI notebooks + CMEK。CMEK 只能保證『靜置加密』（資料存在硬碟時用自己管理的金鑰加密），無法讓資料在被處理、載入記憶體運算的當下保持加密狀態，不滿足『訓練當下也要加密』的要求。"}, {"letter": "C", "analysis": "用 Sensitive Data Protection 去識別化服務把 PII 換成隨機字串，原始個人化特徵資訊被徹底破壞消失。要做個人化推薦，模型本來就需要從這些資料學出規律，換成亂碼會讓模型學不到東西，直接違反『不能影響模型準確度』的要求。"}, {"letter": "D", "analysis": "跟 C 一樣用去識別化破壞原始資料、影響模型準確度；訓練環境的 CMEK 也只解決靜置加密，沒解決訓練當下的運算中加密，兩個條件都沒達成。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 要訓練自己的 AI 模型做個人化推薦，會收集客戶 PII（個資）當訓練資料。要求：① 全球最高等級的安全與合規 ② 資料靜置時和模型訓練當下都要加密 ③ 不能影響模型準確度。"}, {"heading": "答案驗證：A（已查證 Confidential GKE Nodes 的保護範圍）", "body": "Google 官方說明確認 Confidential GKE Nodes 用硬體層級的記憶體加密，保護資料在『使用中（in use）』時不被未授權存取，正好對應題目『during AI model training』的訴求。沒找到這題原始討論頁做最終核對，但推理邏輯清楚，信心高。"}, {"heading": "為什麼不能用去識別化（C、D 錯誤的核心原因）", "body": "Sensitive Data Protection 的去識別化服務會把 PII 換成隨機字串，原始資訊被徹底破壞、不可逆。個人化推薦模型需要從真實的個人化特徵中學習規律，換成亂碼會讓訓練資料失去意義，直接違反『不能影響模型準確度』的要求。看到『不能影響準確度』，要優先懷疑任何會改寫/銷毀原始資料內容的做法（去識別化、隨機化、過度泛化）。"}, {"heading": "服務介紹：BigQuery", "body": "是什麼：GCP 全託管、無伺服器的資料倉儲（Data Warehouse），專門用 SQL 查詢分析超大量結構化資料，常見用在報表、BI、大數據分析，而不是日常交易型應用的資料庫（那是 Cloud SQL / Spanner 的角色）。\n解決什麼問題：傳統資料倉儲要自己買機器、自己調效能擴容，BigQuery 讓你只要寫 SQL，運算資源由 Google 全自動擴展，不用管底層硬體。\n在這題的應用：資料預設就有靜置加密，還支援欄位層級加密、資料遮罩等更細緻的安全控制，所以選項 A/B 都選它當訓練資料的儲存位置——因為題目要求『存放大量 PII』又要『欄位層級加密』這種進階安全需求，BigQuery 剛好同時滿足。\n常見程度：非常常見，是 GCP 考試裡『需要做精細資料安全控制』情境的標準答案載體之一。"}, {"heading": "延伸知識：BigQuery、NoSQL、關聯式資料庫是平行關係，不是誰查誰", "body": "BigQuery 本身就是一種資料庫（資料倉儲/OLAP 類），有自己的欄式儲存引擎，資料是真的存進 BigQuery，不是去查詢 NoSQL 的介面層。它跟 Cloud SQL/Spanner（關聯式）、Bigtable/Firestore（NoSQL）是同一個層級、並列的服務，不是誰疊在誰上面。\n分類依據是「用途/查詢模式」：OLTP（線上交易處理）daily業務的即時小筆讀寫，要求低延遲、ACID 交易保證，例如下訂單、更新餘額，對應 Cloud SQL / Spanner；OLAP（線上分析處理）事後對大量歷史資料做統計彙總找趨勢，單次查詢掃過巨量資料做聚合（SUM/GROUP BY），不要求交易即時性，對應 BigQuery。儲存方式也不同：OLTP 用列式儲存（一筆完整紀錄存一起，方便快速存取單筆資料），OLAP 用欄式儲存（同一欄位存一起，方便一次掃大量資料做聚合計算）。\n但 OLTP/OLAP 不是萬能二分法，不是所有資料儲存系統都能套進去：快取（Memorystore）純粹加速讀取不算交易或分析；物件儲存（Cloud Storage）存檔案不是結構化查詢；圖資料庫處理關係遍歷查詢；近年也有 HTAP（混合交易/分析）模糊兩者界線。這條分類線在 PCA 考試情境夠用（考題基本只在『即時交易』vs『分析報表』之間選 Cloud SQL/Spanner 還是 BigQuery），但不是現實世界資料庫分類的全貌。\nBigQuery 也支援『聯合查詢』(federated query)：不搬資料、直接用 SQL 查詢 Cloud Storage、Bigtable、Cloud SQL、Spanner、Google Sheets 等外部來源，但這是附加功能，平常運作方式還是先把資料載入 BigQuery 自己的儲存，之後查詢都是查自己存的那份資料，跟 NoSQL 資料庫互相獨立。\n考試辨識關鍵字：題目出現『分析』『彙總』『報表』『歷史資料趨勢』『BI』→ OLAP → BigQuery；出現『即時交易』『ACID』『全球強一致性』→ OLTP → Spanner；出現『App 後端』『即時同步』『文件結構』→ Firestore；出現『IoT』『時間序列』『超高寫入吞吐』→ Bigtable。"}, {"heading": "什麼是 Column-level encryption（欄位層級加密）", "body": "是什麼：不是加密整個資料庫或整張表，而是只針對特定欄位（例如存 PII 的那一欄）做加密，其他欄位保持明文可以正常查詢。在 BigQuery 是透過 AEAD 加密函式（AEAD.ENCRYPT / AEAD.DECRYPT）搭配 Cloud KMS 金鑰實作：寫入時用金鑰加密指定欄位，查詢時只有持有對應金鑰權限的人能解密還原。\n解決什麼問題：有些欄位敏感度特別高但不常被篩選/排序，整張表都加密會拖累查詢效能也沒必要，欄位層級加密讓你『只保護真正需要保護的那幾欄』，兼顧安全性跟可用性。\n在這題的應用：關鍵是加密後原始值可以完整還原，跟去識別化（永久破壞資料）完全不同——這正是本題選 A 而不選 C/D 的核心：訓練資料需要保留真實特徵才不會影響模型準確度。\n常見程度：這種考法很常見——『靜置加密 + 不能破壞原始資料』幾乎都在暗示答案要用加密（CMEK / 欄位層級加密），而不是去識別化 / 匿名化。"}, {"heading": "服務介紹：Confidential GKE Nodes（機密運算）", "body": "是什麼：GKE（Google Kubernetes Engine，GCP 的容器調度平台）節點的一種強化模式，底層靠 Confidential VM 技術（例如 AMD SEV 硬體加密）讓節點的記憶體在硬體層級被加密，連雲端供應商自己的 hypervisor 都看不到裡面實際在跑的明文資料。\n解決什麼問題：一般資料只有『靜置加密』（存在硬碟）和『傳輸加密』（網路傳輸中，像 HTTPS）兩層保護，但資料被 CPU 實際拿來運算的那一刻必須先解密成明文才能處理，這段『運算中（data in use）』完全沒有保護——Confidential Computing（機密運算）就是為了補上這個缺口而生的技術。\n在這題的應用：AI 模型訓練正是資料被大量載入記憶體、不斷被 CPU/GPU 運算的過程，一般加密方式完全保護不到這個階段，只有 Confidential GKE Nodes 能補上，對應題目『during AI model training』也要加密的要求。\n常見程度：這個技術相對新、在一般日常應用還不算普及，但在考試裡只要看到『運算中也要加密』『data in use』這種關鍵字，幾乎都是在指向 Confidential Computing（Confidential VM / Confidential GKE Nodes），是很好辨認的訊號詞。"}, {"heading": "服務介紹：Vertex AI Notebooks", "body": "是什麼：Vertex AI 是 GCP 整合式的機器學習平台，涵蓋資料準備、訓練、部署、監控的完整生命週期，是 GCP 目前主推的 ML 解決方案；Notebooks 是裡面提供的 Jupyter 筆記本開發環境，工程師在上面寫程式做資料探索、訓練、實驗模型。\n解決什麼問題：讓 ML 工程師不用自己架設、維護訓練用的運算環境，直接在託管的筆記本環境裡寫程式訓練模型。\n在這題的應用：選項 B/D 用 Vertex AI Notebooks 搭配 CMEK 來訓練模型，問題不在 Notebooks 本身（它是合理的訓練環境），而是搭配的加密方式 CMEK 只能保護『靜置加密』，無法滿足『訓練當下也要加密』的要求，所以 B/D 還是因為加密方式選錯而不是正解。\n常見程度：非常常見、主流的 ML 開發工具，考試裡經常出現。"}, {"heading": "什麼是 Customer-managed encryption keys（CMEK，客戶自管金鑰）", "body": "是什麼：讓你用自己在 Cloud KMS（Key Management Service）建立、擁有控制權（能輪替、能撤銷存取）的金鑰，取代 Google 預設管理的金鑰，對儲存中的資料加密。\n解決什麼問題：Google 預設管理的金鑰（Google-managed key）你無法直接控制它的生命週期，CMEK 讓有更高合規/稽核需求的企業能自己掌控金鑰——在金融、醫療等高合規產業很常見。\n在這題的應用：這題的陷阱就在這裡——CMEK 只解決『靜置加密』這一層，資料被讀進記憶體實際運算的那一刻並不在它的保護範圍內，很容易誤以為『用自己的金鑰加密 = 夠安全』，但沒處理到題目要求的『運算中加密』，這就是 B、D 錯誤的關鍵之一。\n常見程度：CMEK 本身在企業雲端架構中很常見，但要注意它『只管靜置、不管運算中』的邊界，是這類題目常考的細節。"}, {"heading": "服務介紹：Sensitive Data Protection（前身為 Cloud DLP）", "body": "是什麼：GCP 的敏感資料偵測與保護服務，能自動掃描、分類文字/檔案裡的 PII 等敏感資訊，並提供『去識別化（de-identification）』功能，把真實姓名、身分證號等換成遮罩或隨機字串，讓原始內容無法被還原。\n解決什麼問題：在資料要被分享、對外分析、或想降低洩漏風險時，讓敏感資料『失去可識別性』但保留整體資料形態，常用在隱私合規場景（例如把資料拿去做一般統計分析、或分享給第三方）。\n在這題的應用：這是本題最大的陷阱——個人化推薦模型本來就需要從『真實的個人化特徵』裡學規律，資料被換成亂碼後失去所有可學習的訊號，直接違反『不能影響模型準確度』的要求。這題的核心就是要你分辨『去識別化：保護隱私但犧牲資料可用性』vs『加密：保護隱私同時保留資料原貌』這兩種手法的差異與取捨。\n常見程度：Sensitive Data Protection 本身很常用、很主流，但在『需要保留資料可用性/準確度』的情境下反而是錯誤選項，是很經典的混淆設計。"}, {"heading": "記憶重點", "body": "看到『不能影響模型準確度』，優先排除會破壞/改寫原始資料內容的做法（去識別化、匿名化、隨機化）。看到『運算/訓練當下也要加密』（data in use），答案方向是 Confidential Computing（Confidential VM / Confidential GKE Nodes），不是單純的 CMEK——CMEK 只管靜置加密，管不到運算中加密。"}]}, "keywords": ["ensure maximum security and compliance worldwide", "encrypted both at rest and during AI model training without impacting the models’ accuracy"], "tags": ["Sensitive Data Protection(DLP)", "Vertex AI/AI-ML", "Cloud KMS/加密", "安全性", "案例研究題"]}, {"id": "T1-Q231", "topic": 1, "qnum": 231, "question": "You are responsible for designing the network infrastructure architecture for KnightMotives's new environment on Google Cloud. You need to design the new VPC topology. You want to ensure a guaranteed bandwidth and low latency between the plants and Google Cloud resources. What should you do?", "options": [{"letter": "A", "text": "Create a Standard Tier VPC. and ensure a subnet is available in the region closest to a plant. Establish a Cloud Interconnect between each subnet and the local plant."}, {"letter": "B", "text": "Create a Standard Tier VPC. and ensure a subnet is available in the region closest to a plant Establish Direct Peering between Google's Edge Network and the local plant."}, {"letter": "C", "text": "Create a Premium Ter VPand ensure a subnet is available in the region closest to a plant. Establish a Cloud Interconnect between each subnet and the local plant."}, {"letter": "D", "text": "Create a Premium Ter VPC. and ensure a subnet is available in the region closest to a plant. Establish Direct Peering between Google's Edge Network and the local plant."}], "answer": "C", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383631-exam-professional-cloud-architect-topic-1-question-231/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Cloud Interconnect 本身能提供有 SLA 保證的專線頻寬，但搭配的是 Standard Tier VPC——Standard Tier 的流量不保證全程走 Google 的全球私有骨幹網路，在 GCP 內部段的路由品質、延遲都不如 Premium Tier 穩定，不是最佳組合。"}, {"letter": "B", "analysis": "Direct Peering 本身沒有 SLA、不保證頻寬，是 best-effort 的連線方式，不滿足題目『保證頻寬』的硬性需求，直接不符合條件。"}, {"letter": "C", "analysis": "正確：Premium Tier 讓流量盡量走 Google 全球私有骨幹網路，路徑最佳化、延遲最低；Cloud Interconnect（Dedicated/Partner Interconnect）提供有 SLA 保障的專線頻寬，不經過公開網際網路。兩者組合同時滿足『保證頻寬』與『低延遲』兩個要求。"}, {"letter": "D", "analysis": "Direct Peering 沒有 SLA、不保證頻寬，即使搭配 Premium Tier VPC，整條連線仍無法滿足『保證頻寬』的要求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 要幫新環境設計 VPC 網路架構，要求工廠（plants）跟 GCP 資源之間的連線要有『保證頻寬』+『低延遲』。這題在考『挑選正確的網路服務層（Service Tier）+ 正確的連線方式（Interconnect vs Peering）』的組合。"}, {"heading": "答案驗證：C", "body": "Google 官方文件明確指出：Dedicated/Partner Interconnect 提供有 SLA 保證的頻寬與延遲；Direct Peering 則是沒有 SLA 的 best-effort 連線，兩者定位完全不同。同時 Premium Tier 讓流量在 Google 骨幹網路中走最佳路徑，比 Standard Tier 更低延遲、更穩定。C 是唯一同時滿足『保證頻寬』與『低延遲』兩個要求的組合。"}, {"heading": "服務介紹：Cloud Interconnect（含 Dedicated / Partner 差異）", "body": "是什麼：Cloud Interconnect 是一個總稱，底下分兩種——Dedicated Interconnect（直接跟 Google 拉一條實體專線，適合流量大、自己有能力到 Google 機房做互連的企業）、Partner Interconnect（透過合作電信商中轉連線，適合流量沒那麼大或沒辦法直接進 Google 機房的企業）。兩種都提供 SLA 保證的頻寬與低延遲，完全不經過公開網際網路。\n解決什麼問題：公開網際網路的連線品質無法保證，企業需要穩定、可預期品質的連線到 GCP，Cloud Interconnect 就是為了解決『我需要知道我的連線頻寬、延遲是有保障的』這個需求而設計。\n在這題的應用：題目要求『保證頻寬』，Cloud Interconnect 正是唯一能給出 SLA 保證的連線方式，答案 A、C 都用它，差別在搭配的 Network Tier。\n常見程度：在正式的地端到 GCP 混合雲架構中非常常見，是企業上雲的標準做法之一。題目裡的『Cloud Interconnect』是泛稱，實際落地時會是 Dedicated 或 Partner Interconnect 其中一種。"}, {"heading": "服務介紹：Direct Peering", "body": "是什麼：在特定的網路交換點，讓你的網路設備直接跟 Google 的邊緣網路（Edge Network）對接，走的仍然是類似網際網路的路徑，只是實體上少繞一點路。\n解決什麼問題：主要是為了讓你的用戶能更快速存取 Google 的公開服務（例如 Google Workspace、YouTube、一般的 Google API/服務），提供一個免費或低成本、比純公開網際網路稍好的連線選項。\n在這題的應用：關鍵限制是 Google 明確說明 Direct Peering 沒有 SLA（Service Level Agreement），不保證頻寬、不保證延遲、不保證可用性，品質是 best-effort。這跟企業關鍵基礎設施需要的『保證頻寬』完全是兩回事，是本題排除 B、D 的關鍵原因。\n常見程度：常見於一般存取 Google 服務的場景，但不適合用在需要 SLA 保證的企業專線情境，是這類題目常見的混淆選項。"}, {"heading": "服務介紹：Network Service Tier（Premium Tier vs Standard Tier）", "body": "是什麼：GCP VPC 層級的網路服務分級設定，決定你的流量怎麼在 Google 的網路裡繞路。Premium Tier 讓流量盡量走 Google 自己建的全球私有骨幹網路，在離來源/目的地最近的 Google 邊緣節點才進出公開網路，路徑最佳化、延遲最低、可靠度最高，但費用較高；Standard Tier 則比較像一般 ISP 的作法，流量會更早進入/離開公開網際網路，走一般的公開路由，便宜但延遲與穩定性都比較差，且不是所有 region 都支援。\n解決什麼問題：給用戶在『效能』跟『成本』之間一個選擇權——不是所有應用都需要最高品質的網路。\n在這題的應用：題目強調『保證頻寬 + 低延遲』，明確指向要選 Premium Tier，這也是 A（Standard Tier）即使搭配了 Cloud Interconnect 仍不是最佳答案的原因。\n常見程度：是企業關鍵/生產環境混合雲連線的常見標準選擇，考試裡經常跟 Cloud Interconnect 搭配出現。"}, {"heading": "記憶重點", "body": "看到『guaranteed bandwidth』（保證頻寬）、SLA，優先想到 Cloud Interconnect（Dedicated/Partner），而不是 Peering（Direct Peering、Carrier Peering 都沒有 SLA）。看到『低延遲、走 Google 骨幹網路』，要選 Premium Tier 而不是 Standard Tier。Direct Peering vs Cloud Interconnect 的核心差異就是『有沒有 SLA 保證』，是這類考題的經典陷阱。"}]}, "keywords": ["ensure a guaranteed bandwidth and low latency", "Standard Tier", "Premium Tier", "Cloud Interconnect", "Direct Peering"], "tags": ["VPC/網路", "Interconnect/VPN", "案例研究題"]}, {"id": "T1-Q232", "topic": 1, "qnum": 232, "question": "As part of its cloud strategy. KnightMotives wants to move its virtual machines (VMs) into Google Cloud. These VMs contain applications, database instances, and file servers. In the future, KnightMotives intends to modernize their landscape by adopting cloud native technologies on Google Cloud. During modernization, minimal latency and operational overhead between the old and new landscape will be crucial. You need to design the cloud architecture for the VM environment on Google Cloud while ensuring a future modernization track will meet the technical requirements. What should you do?", "options": [{"letter": "A", "text": "Create a Shared Virtual Private Cloud (VPC). and migrate the VMs to Compute Engine in a new project. During modernization, deploy each modernized workload in a dedicated Google Cloud project with its own VPC. Connect the two VPCs via an on-premises VPN."}, {"letter": "B", "text": "Create a Shared Virtual Private Cloud (VPC). Migrate the VMs to Compute Engine in a new project. During modernization, deploy each modernized workload in a dedicated Google Cloud project using the Shared VPC."}, {"letter": "C", "text": "Create a single private cloud on Google Cloud VMware Engine. Migrate the VMs using VMware HCX. During modernization, deploy the modernized workloads in a single Google Cloud project using a single VPC."}, {"letter": "D", "text": "Create a single private cloud on Google Cloud VMware Engine. Migrate the VMs using VMware HCX. During modernization, deploy each modernized workload in a dedicated Google Cloud project with its own VPC."}], "answer": "A", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383600-exam-professional-cloud-architect-topic-1-question-232/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "VPC/網路", "資料遷移", "案例研究題", "⚠️答案存疑"], "explanation": {"optionTable": [{"letter": "A", "analysis": "存疑（我認為不是最佳答案）：現代化階段放棄了 Shared VPC，改成每個現代化工作負載用各自獨立的 VPC，再用『地端 VPN』把新舊 VPC 連起來。這代表雲端內部的流量可能要繞道經過地端機房才能互通，額外架設/維護 VPN 也是維運負擔，直接違背『延遲和維運負擔要降到最低』的核心要求。", "zh": "建立共用虛擬私有雲（Shared VPC），把 VM 搬到一個新專案裡的 Compute Engine。現代化改造時，把每個現代化後的工作負載部署在各自獨立的 Google Cloud 專案、各自擁有自己的 VPC。透過地端（on-premises）VPN 把這兩個 VPC 連接起來。"}, {"letter": "B", "analysis": "我認為這才是正確答案：現代化階段的每個新工作負載雖然放在各自獨立的新專案，但繼續掛在同一個 Shared VPC 上。新舊工作負載全部共用同一個網路，彼此用內部私有 IP 直接溝通，不需要額外的 VPN 或 Peering，完全對應『延遲最小化（同網路內部直連）+維運負擔最小化（不用管理額外連線）』的要求，也符合 Shared VPC 本身的設計目的。", "zh": "建立共用虛擬私有雲（Shared VPC）。把 VM 搬到一個新專案裡的 Compute Engine。現代化改造時，把每個現代化後的工作負載部署在各自獨立的 Google Cloud 專案，但繼續使用同一個 Shared VPC。"}, {"letter": "C", "analysis": "用 Google Cloud VMware Engine（GCVE）+ VMware HCX 遷移，但題目完全沒提到這些 VM 是跑在 VMware 上，假設要用 GCVE 是過度推論。現代化後的工作負載全部塞進單一 VPC/專案，也跟題目『未來採用雲原生技術』的方向不太搭——GCVE 是讓你繼續留在 VMware 私有雲環境，不是邁向雲原生的路徑。", "zh": "在 Google Cloud VMware Engine 上建立單一私有雲。用 VMware HCX 搬遷 VM。現代化改造時，把現代化後的工作負載全部部署在單一 Google Cloud 專案、使用單一 VPC。"}, {"letter": "D", "analysis": "同樣用 GCVE/HCX（過度假設 VMware 環境），而且現代化後每個工作負載用各自獨立 VPC，卻完全沒提到新舊之間要怎麼連接，比 A 還少了連接機制的說明，更難滿足『延遲和維運負擔最小化』的要求。", "zh": "在 Google Cloud VMware Engine 上建立單一私有雲。用 VMware HCX 搬遷 VM。現代化改造時，把每個現代化後的工作負載部署在各自獨立的 Google Cloud 專案、各自擁有自己的 VPC。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 要把 VM（應用程式、資料庫、檔案伺服器）搬到 Google Cloud，未來打算採用雲原生技術做現代化改造。關鍵要求：現代化改造過程中，新舊兩套架構之間的延遲和維運負擔要降到最低。要設計一套既符合現在搬遷需求、又能支援未來現代化的網路架構。"}, {"heading": "⚠️ 答案存疑：我認為應該是 B，不是存的答案 A", "body": "核心判斷依據是 Shared VPC 的設計目的：讓多個不同專案共用同一個 VPC 網路，資源之間用內部私有 IP 直接溝通，不需要額外架 VPN 或做 Peering。B 的做法是現代化階段的新工作負載繼續掛在同一個 Shared VPC 上，新舊工作負載全部共用同一個網路，直接對應『延遲最小化+維運負擔最小化』的要求。A 雖然一開始也用 Shared VPC，但現代化階段卻放棄這個共用網路架構，改成各自獨立 VPC 再用地端 VPN 連接，這代表雲端內部流量可能要繞道經過地端機房才能互通，增加延遲也增加維運負擔，邏輯上說不通。搜尋到的 GCP 練習資源也指出這類題型『比較偏好的答案是保留既有的 VPC，只調整外圍的 project 結構』，支持 B 的判斷。沒找到這題原始討論頁做最終核對，信心中高。"}, {"heading": "記憶重點", "body": "看到『先搬遷 VM，之後逐步現代化，要求新舊架構間延遲/維運負擔要低』這種情境，優先考慮 Shared VPC，而且重點是：現代化階段的新工作負載，要繼續掛在同一個 Shared VPC 上，而不是切出全新的獨立 VPC 再想辦法接回去——額外架 VPN/Peering 去連接本來可以共用的網路，是常見的反模式。另外，題目沒明確提到 VMware，不要自己腦補要用 GCVE/HCX 這類 VMware 專屬遷移路徑。"}, {"heading": "服務介紹：Shared VPC（共用虛擬私有雲）", "body": "是什麼：正常情況下每個 GCP 專案都有自己獨立的 VPC 網路，彼此預設互相看不到、連不到。Shared VPC 讓你指定一個 host project（主機專案），它的 VPC 網路可以被其他多個 service project（服務專案）共用，被授權的 service project 裡的資源（VM、GKE 叢集等）就像活在同一個網路裡，可以用內部私有 IP 直接互相溝通。\n解決什麼問題：多個專案（通常對應不同團隊/部門）需要共用同一套網路架構、互相直連，又不想額外架 VPN 或做 VPC Peering 來連接彼此。\n在這題的應用：題目要求「新舊架構間延遲和維運負擔最小化」，Shared VPC 讓不同專案的資源直接內部互通，不用額外架設連接機制，完全對應這個要求——關鍵是現代化階段的新工作負載也要繼續掛在同一個 Shared VPC 上（選項 B），而不是切出全新的獨立 VPC 再想辦法接回去（選項 A 的問題）。\n常見程度：企業多專案（multi-project）架構的標準做法，GCP 考試裡「多個專案需要互通」情境的常見正解。"}, {"heading": "什麼是 Compute Engine", "body": "是什麼：GCP 自己的虛擬機（VM）服務，讓你在 Google 的硬體上建立、執行一般的虛擬機器，可以自訂作業系統、CPU、記憶體、磁碟等規格，是 GCP 最基礎的運算服務之一。\n解決什麼問題：公司原本在自己機房或其他雲端上跑的伺服器，需要『搬家』到 GCP 繼續運作時，最直接的落地位置就是 Compute Engine（對應傳統的 lift-and-shift 遷移）。\n在這題的應用：題目裡所有選項都要把 VM 搬到 Compute Engine 上執行，差別只在於搬遷方式（直接搬 vs 透過 VMware 相關工具搬）跟搬完之後的網路架構怎麼設計。\n常見程度：非常常見，是 GCP 考試裡『伺服器搬遷/傳統工作負載』情境幾乎必然出現的基礎服務。"}, {"heading": "什麼是 on-premises VPN（地端 VPN）", "body": "是什麼：VPN（Virtual Private Network，虛擬私有網路）在這裡是指透過網路，在雲端的 VPC 跟公司自己機房（on-premises，地端）的網路之間，架一條加密的連線通道，讓兩邊的資源可以互相溝通，就像地端機房多了一條『私有的網路專線』通到雲端。\n解決什麼問題：公司資源分散在雲端跟地端兩邊時，需要安全地互相存取彼此的服務。\n在這題的應用：選項 A 現代化階段放棄了 Shared VPC，改用『地端 VPN』把兩個獨立 VPC 連起來——問題是這代表雲端內部兩套工作負載之間的流量，可能要先繞去地端機房再繞回來才能互通，不但多了一層延遲，架設維護這條 VPN 本身也是額外的維運負擔，直接違背題目『延遲和維運負擔最小化』的要求。\n常見程度：VPN 本身是雲端架構常見的連接手法，但這題的陷阱是『本來可以直接用 Shared VPC 共用網路，卻繞道改用 VPN 連接』，屬於過度複雜化的反模式。"}, {"heading": "服務介紹：Google Cloud VMware Engine（GCVE）", "body": "是什麼：Google Cloud 提供的服務，讓你在 GCP 的實體硬體基礎設施上，直接跑一套完整的 VMware 私有雲環境（vSphere、vSAN、NSX 等 VMware 自家虛擬化技術）。\n解決什麼問題：公司原本機房用 VMware 當虛擬化平台（傳統企業很常見），GCVE 讓你把整套 VMware 環境原封不動搬到 GCP，VM 不需要重新設定、不用轉換格式——對 VM 來說就像『機房換了個地方』,其他完全不變；相對地，若直接搬到 Compute Engine，VM 的磁碟映像、驅動程式通常需要轉換成相容格式。\n在這題的應用：選項 C、D 用 GCVE 當遷移目的地，但題目完全沒提到這些 VM 原本是跑在 VMware 上，假設要用 GCVE 是過度推論；而且 GCVE 是讓你繼續留在 VMware 私有雲生態系，跟題目『未來要採用雲原生技術做現代化改造』的方向不太搭。\n常見程度：VMware 環境遷移上雲是常見的真實場景,但這題沒有任何 VMware 的線索,不該自己腦補。"}, {"heading": "什麼是 VMware HCX", "body": "是什麼：VMware 官方提供的遷移工具，專門用來把 VM 在不同的 VMware 環境之間搬遷（例如從地端的 VMware 機房，搬到 GCVE 的 VMware 環境），支援接近零停機的線上遷移，還能讓搬過去的 VM 暫時保留原本的 IP 位址和網路設定，不用立刻重新規劃網路。\n解決什麼問題：VMware 環境間搬 VM 時，避免大規模停機跟網路重新設定的麻煩。\n在這題的應用：選項 C、D 搭配 GCVE 使用 HCX 搬遷 VM,邏輯上是『選了 GCVE 當目的地,自然要用 VMware 自家的遷移工具』,但因為 GCVE 這個前提本身就是過度推論（題目沒提到 VMware），這兩個選項從源頭就站不住腳。\n常見程度：在真實的 VMware-to-cloud 遷移案例中很常見，但這題考的其實是『不要自己腦補題目沒給的前提』。"}], "questionZh": "身為 KnightMotives 雲端策略的一部分，公司想把虛擬機（VM）搬到 Google Cloud。這些 VM 裡跑著應用程式、資料庫實例和檔案伺服器。未來，KnightMotives 打算透過採用雲原生
