], "answer": "C", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383593-exam-professional-cloud-architect-topic-1-question-224/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "API key validation 是身分識別機制，用來確認『是誰在呼叫這個 API』，不會限制呼叫次數。"}, {"letter": "B", "analysis": "OAuth 2.0 整合是授權/驗證機制，確認呼叫者有沒有權限存取這個 API，一樣不會限制呼叫次數。"}, {"letter": "C", "analysis": "正確：Quota policy 維護一個計數器，統計 API proxy 收到的請求次數，達到設定上限就拒絕後續呼叫直到計數器重置，是 Apigee 官方設計用來做『長時間週期總量管控、成本管理』的功能，直接對應題目需求。"}, {"letter": "D", "analysis": "XML threat protection 是防禦惡意 XML payload 攻擊（例如 XML bomb、超大巢狀結構攻擊）的資安功能，跟控制呼叫次數完全無關。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 用 Apigee 做 API 管理，想確保 API 不被過度使用/濫用，需要一個 Apigee 功能來控制 API 呼叫的總次數，目的是成本管理。屬於 Altostrat Media 案例研究題組。"}, {"heading": "答案驗證：C（已查證，官方文件直接支持）", "body": "Apigee 官方文件明確說明 Quota policy 的用途就是統計並限制 API proxy 的請求次數，用於成本管理/方案分級。值得注意的細節：官方文件特別提醒『若要防瞬間流量暴衝，應該用 Spike Arrest policy，不是 Quota』——Quota 是給長時間週期（例如每天/每月）總量管控用的。這題問的是『total number of API calls for cost management』，精準對應 Quota 的設計目的，不是 Spike Arrest 的情境，進一步確認 C 正確。"}, {"heading": "記憶重點", "body": "Apigee 裡『限制次數、做成本管理/方案分級』→ Quota policy；『防止短時間流量暴衝』→ Spike Arrest policy；兩者常被搞混，但用途不同要分清楚。API key validation 和 OAuth 2.0 都是身分驗證/授權機制，不是流量管控工具。"}]}, "tags": ["Apigee", "成本優化", "案例研究題"]}, {"id": "T1-Q225", "topic": 1, "qnum": 225, "question": "KnightMotives has developed a new car configurator application to enhance both the dealer and customer experience. The new application will be deployed on Google Kubernetes Engine (GKE) KnightMotives wants you to replicate the deployment of the application across multiple locations to ensure this critical application is always available over the internet, even during regional outages. What should you do?", "options": [{"letter": "A", "text": "Create multiple GKE clusters in different regions. Deploy part of the microservices of the app in different clusters. Configure a multi-cluster Cloud Service Mesh."}, {"letter": "B", "text": "Create multiple GKE clusters in different regions. Deploy the app on every cluster. Configure a multi-cluster Cloud Service Mesh."}, {"letter": "C", "text": "Create a fleet of GKE clusters in different regions Deploy part of the microservices of the app in different clusters Configure a multi-cluster Gateway."}, {"letter": "D", "text": "Create a fleet of GKE clusters in different regions. Deploy the app on every cluster. Configure a multi-cluster Gateway."}], "answer": "D", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383586-exam-professional-cloud-architect-topic-1-question-225/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "把微服務拆開分散到不同叢集（part of the microservices），一旦某區域掛掉，該區域獨有的微服務就會消失，應用功能不完整，違反『always available』的要求；用 Cloud Service Mesh 也不是處理外部流量入口容錯的最佳工具。"}, {"letter": "B", "analysis": "每個叢集都跑完整 app 這點正確，但用 Cloud Service Mesh 處理的是服務之間（east-west）的流量，不是外部使用者進入應用（north-south）的全域容錯路由，不是最貼題的做法。"}, {"letter": "C", "analysis": "用了正確的 multi-cluster Gateway，但微服務拆散到不同叢集，一樣會在區域掛掉時造成功能缺失，不符合『even during regional outages』仍要完整可用的要求。"}, {"letter": "D", "analysis": "正確：每個區域都部署完整的一套應用（不拆分微服務），確保任一區域掛掉時其他區域仍能獨立完整服務；搭配 multi-cluster Gateway——GKE 專門用來把網際網路流量路由到跑在多個叢集的應用、自動避開故障區域的全域負載平衡層，精準對應『always available over the internet, even during regional outages』的需求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives（案例研究公司）的車輛配置器應用要跑在 GKE 上，想要複製部署到多個地點，確保即使某個區域整個掛掉，這個關鍵應用在網際網路上依然保持可用。屬於 KnightMotives Automotive 案例研究題組。"}, {"heading": "答案驗證：D（已查證，官方文件支持）", "body": "Google 官方文件證實 multi-cluster Gateway 就是設計來把網際網路流量路由到跑在多個 GKE 叢集的應用，對應題目『over the internet』的訴求。要『even during regional outages』仍完整可用，必須每個區域都跑完整副本，不能拆分微服務（否則故障區域獨有的微服務會消失）。"}, {"heading": "記憶重點：Service Mesh vs Gateway", "body": "看到『跨區域部署、要求整個應用在區域故障時依然可用』，答案方向是：每個區域都跑完整副本（不要拆分微服務）+ multi-cluster Gateway。區分訣竅：Service Mesh 管微服務之間怎麼互相講話（east-west），Gateway 管外部使用者怎麼進來（north-south，對應『over the internet』這個關鍵字）。"}, {"heading": "什麼是 Cloud Service Mesh", "body": "Cloud Service Mesh（前身叫 Anthos Service Mesh）是 GCP 的服務網格產品，底層基於開源 Istio。核心概念：當應用拆成大量微服務，彼此要互相呼叫（east-west traffic），Service Mesh 在每個微服務旁放一個輕量代理（sidecar proxy，用 Envoy），所有進出該服務的流量先經過代理，讓加密（mTLS）、重試、流量切分（金絲雀/A-B測試）、可觀測性、熔斷等基礎設施邏輯統一由代理處理，微服務本身程式碼不用管這些。multi-cluster Service Mesh 可以讓不同 GKE 叢集（甚至跨雲）裡的微服務彼此互相呼叫，像在同一個網路裡一樣。強項是處理『服務之間怎麼溝通』，不是處理『外部使用者怎麼進來』。"}, {"heading": "North-South vs East-West：資料中心網路方向性比喻", "body": "這是資料中心網路工程的經典比喻，把流量方向畫成地圖方位。North-South（南北向）：流量從外部（網際網路、使用者）進來打到應用，『北方』代表外部世界，『南方』代表資料中心內部，流量由外往內（或回應往外）；典型工具是 Load Balancer、Gateway、Ingress。East-West（東西向）：流量發生在內部服務之間彼此呼叫，像微服務們平行排列、流量在同一層橫向移動、不出網路邊界；典型工具是 Service Mesh。對照 Q225：選項 A、B 的 Cloud Service Mesh 處理 East-West（服務互相講話）；選項 C、D 的 multi-cluster Gateway 處理 North-South（外部使用者怎麼進來、怎麼在多區域間容錯切換），這正是題目『always available over the internet』要的那一層，所以答案選用 Gateway 的 D，不是用 Service Mesh 的 B。"}]}, "keywords": ["replicate the deployment of the application across multiple locations", "always available over the internet", "even during regional outages"], "tags": ["GKE/Kubernetes", "高可用性/災難復原", "多區域架構", "案例研究題"]}, {"id": "T1-Q226", "topic": 1, "qnum": 226, "question": "As part of its development of fully autonomous driving vehicles. KnightMotives wants to analyze all vehicle sensor data during test drives. The analysis will enable KnightMotives to improve its software based on insights from this data.• Different event types, such as parking, overtaking and navigating, need to be analyzed. Each test vehicle and event type has an ID.• Different categories of sensors, such as cameras, radars, and ultrasonic beams, also need to be analyzed. During each autonomously-initiated event, data from multiple sensors will be captured and sent to Google Cloud where the data will be stored in Bigtable.During data analysis, you want to be able to retrieve all sensor data of occurrences of the same event type for a specific vehicle within a specific interval of time. You need to design a Bigtable schema that is optimized for read performance. What should you do?", "options": [{"letter": "A", "text": "Use the sensor category, event ID, and timestamp (in that order) as the row key. Create a column family for each individual sensor and a column qualifier for each vehicle."}, {"letter": "B", "text": "Use the timestamp, vehicle ID, and event ID (in that order) as the row key. Create a column family per sensor category, and use a column qualifier for each individual sensor within its respective category."}, {"letter": "C", "text": "Use the vehicle ID, event ID, and timestamp (in that order) as the row key. Create a column family per sensor category, and use a column qualifier for each individual sensor within its respective category."}, {"letter": "D", "text": "Use the vehicle ID and event ID (in that order) as the row key. Create a column family per sensor category, and use a column qualifier for each individual sensor within its respective category. Utilize the timestamped versions of a cell to distinguish between different moments in time of similar events."}], "answer": "B", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383589-exam-professional-cloud-architect-topic-1-question-226/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "row key 用『感測器類別 + 事件ID + 時間戳』，完全沒有車輛ID，無法鎖定『特定車輛』這個查詢條件；而且把 column family/qualifier 的角色也用反了（照題目邏輯應該是每個感測器類別一個 family，而不是每個車輛一個 qualifier），不符合查詢需求也不符合一般 schema 設計邏輯。"}, {"letter": "B", "analysis": "存疑（我認為這不是最佳答案）：row key 用『時間戳 + 車輛ID + 事件ID』，時間戳放在最前面。Google 官方 Bigtable 文件明確警告：時間戳打頭的 row key 會讓同時間寫入的資料全部擠在同一小段 key 空間，造成寫入熱點（hotspotting）；而且查詢『特定車輛+特定事件類型+時間區間』時，同時間其他車輛/事件的資料會穿插其中，無法做連續範圍掃描，讀取效率反而更差，跟題目『optimized for read performance』的目標矛盾。"}, {"letter": "C", "analysis": "我認為這才是正確答案：row key 用『車輛ID + 事件ID + 時間戳』，可以用『車輛ID+事件ID』當前綴鎖定連續的一塊 row，再對時間戳做範圍掃描，一次完成『特定車輛、同一事件類型、時間區間』的高效率連續讀取，完全對應題目查詢模式；高基數欄位在前、時間戳在後，也符合 Google 官方建議的時間序列 row key 設計原則（避免熱點）。"}, {"letter": "D", "analysis": "row key 只有『車輛ID + 事件ID』，不含時間戳，改用 cell 的 timestamped versions 區分不同時間點的資料。問題是 cell 版本機制設計上是用來存同一邏輯值的歷史修訂，不是用來存無限持續產生的時間序列事件；測試車輛會不斷觸發新事件，會讓同一 row 的 cell 版本數量無限增長，也無法對時間區間做高效率的 row-level range scan（需整列讀出再篩選版本），不符合『range 查詢 + 讀取效能優化』的需求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 測試自動駕駛車時，收集各種感測器（相機、雷達、超音波）資料存進 Bigtable。查詢需求：針對特定一台車，找出同一種事件類型（停車、超車、導航…）的所有發生紀錄，且只要特定時間區間內的資料。要設計一個針對讀取效能優化的 Bigtable row key / column family schema。"}, {"heading": "⚠️ 答案存疑：我認為應該是 C，不是存的答案 B", "body": "Bigtable row 依 row key 字典順序排序，只有從 row key 最前面開始的連續前綴才能做高效率範圍掃描。查詢是『特定車輛+特定事件類型+時間區間』，C 的 row key（車輛ID+事件ID+時間戳）能用前兩段鎖定連續區塊、再對時間戳做範圍掃描，一次完成高效率連續讀取；B 把時間戳放最前面，不但查詢時其他車輛/事件的資料會穿插其中無法連續掃描，更嚴重的是違反 Google 官方 Bigtable schema 設計文件明確警告的『時間戳開頭 row key 會造成寫入熱點』反模式。搜尋到的 GCP 實務指南（fleet of cars 情境）也採用『高基數 ID 在前、時間戳在後』的標準做法，支持 C 才是正確設計。沒找到這題在 ExamTopics 的原始討論頁做最終核對，但技術推理站得住腳，信心中高。"}, {"heading": "什麼是 Time Series Database（時間序列資料庫）", "body": "專門為『隨時間不斷累積的連續數據點』設計的資料庫，每筆資料都跟時間戳綁在一起，幾乎只新增、很少修改，查詢模式通常是『某時間區間內的資料/趨勢』。這題的車輛感測器資料就是典型時間序列資料：寫入量大且持續、查詢幾乎都是『時間範圍+某個識別碼』、資料量無限成長常需搭配 TTL 自動清除。GCP 裡適合存時間序列資料：Cloud Bigtable（高寫入量+row key range scan，這題用的）、BigQuery（大量歷史分析彙總查詢）、Cloud Monitoring 內建時序資料庫（存指標，原生 TTL）。時間序列 row key 設計黃金法則：高基數識別碼放前面，時間戳放後面，才能同時避免寫入熱點、又支援針對特定識別碼做時間區間查詢。"}, {"heading": "記憶重點", "body": "Bigtable row key 設計口訣：高基數、常被拿來做『鎖定範圍』的欄位放前面（像車輛ID、事件ID），時間戳放最後面。只要看到『時間戳放在 row key 最前面』的選項，先打個問號——這幾乎都是 Bigtable 官方明確警告的 hotspotting 反模式。另外要分清楚：cell 版本機制適合存『同一邏輯值的少量歷史修訂』，不適合存『無限持續產生的時間序列事件』。"}]}, "keywords": ["retrieve all sensor data of occurrences of the same event type for a specific vehicle within a specific interval of time", "optimized for read performance"], "myAnswer": "C", "tags": ["Bigtable", "資料庫Schema設計", "效能調校", "案例研究題", "⚠️答案存疑"]}, {"id": "T1-Q227", "topic": 1, "qnum": 227, "question": "Company Overview -KnightMotives is a car manufacturer specializing in autonomous, self-driving vehicles, including Battery Electric Vehicles (BEVs), hybrids and traditional internal combustion engine (ICE) vehicles. While KnightMotives has made strides with the in-vehicle experience in their BEV fleet, the hybrid and ICE vehicles have yet to implement these new systems and are viewed poorly by critics and drivers. The lack of modern in-vehicle technology in hybrid and ICE vehicles has resulted in declining sales and customer satisfaction.KnightMotives wants to modernize the consumer experience across all vehicles within five years Artificial Intelligence offers a unique opportunity to revolutionize the in-vehicle experience, as well as the shopping buying and service/maintenance experience. Investment in this new technology will require a shift in financial priorities on a global scale.KnightMotives also wants to improve their online ordering system, which is unreliable. Systems for customers to build their vehicle online for acquisition through a dealer are not delivering the data or reliability that dealers need, causing. A strain in the relationship between KnightMotives and dealers. Service technicians and sales staff need better tooling to enhance dealer successes, including built-to-order vehicles.Solution Concept -KnightMotives wants to shift from manufacturing cars to creating a complete and compelling “automotive experience.” Then strategy prioritizes delivering a consistent experience across all models, developing AI-powered features, generating new revenue from data monetization, adopting a digital focus to differentiate their brand from competitors, and developing better tools for mechanics and salespeople.Existing Technical Environment -KnightMotives's IT is largely on-premises with some applications on major cloud platforms. Their supply chain runs on an outdated mainframe, and Enterprise Resource Planning (ERP) is also outdated, making new promotions and dealer discounts difficult to implement. Dealers have no budget for new equipment. There is fragmentation across vehicles with multiple code bases, and significant technical debt from supporting backwards compatibility. Network connectivity to manufacturing plants and vehicle connectivity in rural areas are challenges.Business Requirements -Key business requirements include fostering a personalized relationship with the driver and delivering a cohesive experience across all models. Creating a better build-to-order model will reduce time on the lot and provide transparency for both dealers and customers. Additionally, KnightMotives seeks to monetize corporate data to finance new technology investments, as their current AI infrastructure is obsolete and corporate data remains siloed. Security is a paramount concern due to past data breaches Adherence to European Union (EU) data protection regulations, especially for emerging autonomous platforms, is critical.KnightMotives plans to make significant investments in fully autonomous driving capabilities, with initial implementation targeting regions with favorable regulatory environments. Prioritizing employee upskilling, attracting top-tier talent, and fostering better communication between business and technical teams are also critical objectives.Technical Requirements -• Modernizing the in-vehicle experience includes developing a consistent user experience (UX) that seamlessly integrates AI-powered features across all models, updating in-vehicle hardware and software in legacy models to support new UX features and AI capabilities, and ensuring reliable network connectivity, especially in rural areas, to support real-time AI features and data transmission.• Network upgrades are necessary to support increased data traffic and improve connectivity between plants and headquarters.• IT infrastructure modernization requires adopting a hybrid cloud strategy to leverage the benefits of both on-premises and cloud infrastructure, and gradually modernizing or replacing legacy systems to improve efficiency and agility.• Autonomous vehicle development and testing requires investing in cutting-edge AI and machine learning technologies, building a robust simulation environment, and ensuring compliance with evolving regulations related to autonomous vehicles.• Data monetization and insights requires implementing a robust data management platform, strict data security and privacy measures, and a scalable AI/ML infrastructure.• Increased focus on security and risk management involves implementing a comprehensive security framework to protect against cyber threats and data breaches, developing an incident response plan, and providing security awareness training to employees.• Providing a delightful experience for dealers and customers requires improving the online build-to-order system; developing modern dealer tools to streamline dealer operations, including sales, service, and inventory management; and implementing a comprehensive Customer Relationship Management (CRM) system to track customer interactions personalize experiences, and improve customer satisfaction.Executive Statement -KnightMotives is committed to enhancing safety and saving lives by leveraging an extensive body of data — encompassing driving, road conditions, behavioral studies, and crash safety statistics — to create compelling digital experiences for drivers. Our AI consistently outperforms national safety statistics, ensuring the unique and coveted KnightMotives experience is aligned across all our vehicle models.Michael Knight, KnightMotives CEOFor this question, refer to the KnightMotives Automotive case study, KnightMotives has deployed their new Dealer Tools on Google Kubernetes Engine (GKE). You are supporting KnightMotives in the performance of the GKE workloads. Some of the Pods are Statefull. To ensure these Pods do not consume an unlimited amount of CPU, you have configured resource limits on the Deployments. You have identified that these Pods were allocated too much CPU and are actually consuming drastically less some of the time. You want to optimize resource usage and allow maximum flexibility in case of higher load. What should you do?", "options": [{"letter": "A", "text": "Configure resource requests per Deployment. Set resource requests slightly above the typical CPU usage observed during monitoring."}, {"letter": "B", "text": "Configure resource requests per Deployment. Ensure the requests are equal to the current limits."}, {"letter": "C", "text": "Enable vertical Pod autoscaling on each Deployment. Ensure the autoscaling mode is set to Auto."}, {"letter": "D", "text": "Enable horizontal Pod autoscaling on each Deployment. Ensure the minimum number of Pods is lower than the currently configured amount in the Deployment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383571-exam-professional-cloud-architect-topic-1-question-227/", "postedDate": "2026-02-10", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "手動設定 requests 略高於觀察到的典型用量，是一次性、靜態的調整，不會隨用量變化持續自我調整，用量模式一變就要重新手動調整，不是真正的優化機制。"}, {"letter": "B", "analysis": "讓 requests 等於目前的 limits，會讓這個 Pod 變成 Guaranteed QoS，不管實際有沒有用到都永久預留等同 limits 的資源，加劇浪費，方向完全錯誤。"}, {"letter": "C", "analysis": "正確：VPA（Vertical Pod Autoscaler）會持續觀察 Pod 實際 CPU/記憶體用量歷史，自動調整 resource requests（甚至 limits），讓配置動態貼合實際用量；用量低時自動調低（省資源）、用量持續升高時自動調高（給彈性應付尖峰）。設成 Auto 模式代表建議值自動套用，不用人工介入，完全對應『優化資源使用+保有彈性』兩個訴求。"}, {"letter": "D", "analysis": "HPA（水平自動擴縮）調的是『要開幾個 Pod』，不是『每個 Pod 該分配多少資源』。題目的問題是每個 Pod 的資源配置量不合理（垂直問題），不是 Pod 數量問題（水平問題），用錯工具；而且 Stateful 的 Pod 通常綁定專屬身份/儲存，水平縮放語意更複雜，不是解決配置浪費最直接的做法。"}], "notes": [{"heading": "題目在問什麼（已去除案例研究背景）", "body": "KnightMotives 的 Dealer Tools 跑在 GKE 上，部分 Pod 是 Stateful（StatefulSet 管理）。已設定 resource limits 避免無限吃資源，但發現這些 Pod 被分配太多 CPU，且實際用量常常遠低於分配量，想要優化資源使用，同時在負載變高時仍保有最大彈性。"}, {"heading": "答案驗證：C（已查證，官方文件+練習資源支持）", "body": "GKE 官方文件確認 StatefulSet 是合法的 VPA 目標對象，GCP 官方 PCA 考試練習資源也把『VPA Auto 模式』當成這類情境的標準答案，信心高。"}, {"heading": "基礎知識：Node / Pod / Container / Kubernetes 的關係", "body": "Kubernetes（K8s）是容器編排系統，幫你自動管理大量容器該放哪裡跑、掛了自動重開、流量大自動擴縮。Container（容器）是把應用程式和它需要的所有東西打包在一起的輕量虛擬化技術，共用主機作業系統核心但擁有獨立檔案系統/網路/程序空間，比傳統 VM 輕量快速，最常見技術是 Docker。Pod 是 Kubernetes 最小部署單位，裡面跑著一個或多個 Container。Node 是一台實體或虛擬機器，擁有真正的硬體資源（CPU/記憶體），一個 Node 通常不只一顆 CPU（可能 4 核、8 核甚至更多，看機器規格），一台 Node 上同時跑著多個 Pod，這些 Pod 共用這台 Node 的 CPU 資源。Kubernetes 叢集由很多台 Node 組成。層級關係：Cluster（多個 Node）→ Node（多個 Pod）→ Pod（一個或多個 Container）。"}, {"heading": "基礎知識：Request vs Limit", "body": "Request（請求量）是 Pod 保證拿到的資源下限，排程器依此判斷某台 Node 剩餘資源夠不夠放這個 Pod，這份資源保證給它、其他 Pod 不能搶。Limit（上限）是 Pod 最多能用到的資源上限，超過 CPU 會被節流、記憶體超過會被 OOMKilled。一台 Node 能塞下幾個 Pod，看這些 Pod 的 request 加總有沒有超過 Node 的總資源量。選項 B 把 request 設成等於 limit，會讓 Pod 變成 Guaranteed QoS，資源永久被鎖定保留，就算沒用到其他 Pod 也不能用，這正是題目想避免的浪費。"}, {"heading": "基礎知識：Stateless vs Stateful，以及 Kubernetes 的幾種控制器", "body": "Stateless（無狀態）：Pod 本身不保存重要資料，壞了直接砍掉重開一個新的即可，新舊 Pod 完全對等可互相替換，例如單純處理請求不存資料的 Web 伺服器，由 Deployment 管理。Stateful（有狀態）：Pod 有專屬於自己的資料或身份，不能隨便砍掉重開，例如資料庫節點，由 StatefulSet 管理，每個 Pod 有固定穩定的名字（pod-0、pod-1…）和專屬儲存空間，重建後仍接回同樣名字和資料。其他控制器：DaemonSet 確保每台 Node 都剛好跑一個特定 Pod（常用於監控/日誌收集）；Job/CronJob 跑一次性或定時任務，跑完就結束，不是常駐服務。"}, {"heading": "基礎知識：HPA vs VPA", "body": "HPA（Horizontal Pod Autoscaler，水平自動擴縮）：監控指標（常見是 CPU 使用率），負載升高時自動增加 Pod 複本數量，負載降低時自動減少，調的是『要開幾個 Pod』。VPA（Vertical Pod Autoscaler，垂直自動擴縮）：持續觀察單一 Pod 的實際用量，自動調整這個 Pod 的 resource request/limit 大小，調的是『每個 Pod 該分配多少資源』。比喻：客人變多開更多收銀櫃檯是 HPA；把空間浪費的櫃檯改小、長期大排長龍的櫃檯擴大是 VPA。Q227 的問題是『每個 Pod 的資源配置量不合理』，是垂直問題，所以要用 VPA 不是 HPA。"}, {"heading": "記憶重點", "body": "看到『Pod 的 CPU/記憶體用量忽高忽低，目前靜態配置浪費資源，想要自動優化+保留彈性』，直接反射選 VPA，注意是調單一 Pod 的資源大小，不是調 Pod 數量（那是 HPA）。看到『requests 設成等於 limits』要能判斷這是加劇資源鎖定浪費的反模式，不是優化。遇到 StatefulSet 管理的 Pod，優先考慮垂直調整（VPA）而非水平調整（HPA），因為每個複本可能綁定專屬身份/儲存，水平縮放語意更複雜。"}]}, "keywords": ["were allocated too much CPU and are actually consuming drastically less some of the time", "optimize resource usage and allow maximum flexibility in case of higher load"], "tags": ["GKE/Kubernetes", "自動擴縮", "效能調校"]}, {"id": "T1-Q228", "topic": 1, "qnum": 228, "question": "KnightMotives has established a dedicated Google Cloud Interconnect with 99.99% availability between its headquarters and two different metropolitan areas corresponding to the us-central1 and us-east1 Google Cloud regions. To minimize cost and latency between these workloads, you want to ensure all workloads in Google Cloud are deployed in these two regions as the VLAN attachment for the Cloud Interconnect. What should you do?", "options": [{"letter": "A", "text": "Schedule an export of all assets via Asset Inventory into BigQuery. Schedule a daily Cloud Run function to query the export and send out an alert if resources are created in regions outside of the allowed list."}, {"letter": "B", "text": "Ensure all deployments are done through Infrastructure as Code using standardized Terraform modules. Configure the region variable of all resources with a default value corresponding to one of the allowed regions."}, {"letter": "C", "text": "Limit the Google Cloud VPC used by the Cloud Interconnect to only have subnets in the allowed regions."}, {"letter": "D", "text": "Configure the Resource Location Restriction constraint organization policy at the organization level, and ensure only the allowed regions are listed."}], "answer": "A", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383594-exam-professional-cloud-architect-topic-1-question-228/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "存疑（我認為這不是最佳答案）：排程匯出資產清單到 BigQuery，每天用 Cloud Run 函式查詢、發現違規才發送警告。這是偵測型（detective）控制，資源已經被建在錯誤區域之後才發現，無法真正『ensure（確保）』工作負載只部署在允許的區域，等成本和延遲的問題已經發生了才知道。"}, {"letter": "B", "analysis": "IaC + Terraform 預設區域變數只是『建議值』，任何人部署時都可以覆寫這個預設值，也無法阻止不透過這套模組、用其他方式（Console、gcloud）手動建立的資源，是軟性規範不是強制護欄。"}, {"letter": "C", "analysis": "只限制了 Cloud Interconnect 使用的『那一個特定 VPC』的子網路範圍，不會阻止其他資源（運算、儲存、或全新建立的 VPC）被建在允許區域之外，涵蓋範圍太窄，沒有做到『所有工作負載』這個範圍。"}, {"letter": "D", "analysis": "我認為這才是正確答案：在組織層級設定 Resource Location Restriction 這個 organization policy constraint，明確列出允許的區域。這是預防型（preventive）控制，GCP 會在 API 層級直接擋下任何試圖在允許清單以外區域建立資源的請求，不管是 Console、gcloud 還是 Terraform，都無法繞過，真正符合『ensure all workloads... are deployed in these two regions』的要求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 在總部跟 us-central1、us-east1 兩區之間建了專屬 Cloud Interconnect（99.99% 可用性專線），VLAN attachment 也接在這兩區。為了降低成本和延遲，希望確保所有部署在 Google Cloud 的工作負載都只落在這兩個區域。"}, {"heading": "⚠️ 答案存疑：我認為應該是 D，不是存的答案 A", "body": "關鍵字是『ensure（確保）』，代表要的是預防性、強制擋下違規的機制，不是事後才發現的機制。A 是偵測型控制（資源已建立在錯誤區域後才告警），無法真正『確保』；D（Resource Location Restriction org policy）是 Google 官方提供、在 API 層級直接擋下不符合規定的資源建立請求的機制，才是真正做到『ensure』的工具。已查證 Google 官方文件確認 Resource Location Restriction 就是設計來做組織層級、強制性地域合規限制用的，支持這個判斷。沒找到這題在 ExamTopics 的原始討論頁做最終核對，但技術推理站得住腳，信心中高。"}, {"heading": "什麼是 VLAN", "body": "VLAN（Virtual Local Area Network）是在同一組實體網路設備上，邏輯上切出好幾個獨立網路的技術，每個 VLAN 有一個 VLAN ID 標籤，讓設備知道封包屬於哪個邏輯網路。Cloud Interconnect 的『VLAN attachment』就是在實體專線上切出一個邏輯連結，這個邏輯連結會綁定連到 Google Cloud 裡某一個特定區域的 VPC 網路——這也是為什麼 VLAN attachment 的設計是綁定特定區域的，不是接到任意區域都可以。一條實體 Cloud Interconnect 連線可以切出多個 VLAN attachment，各自連到不同區域。"}, {"heading": "什麼是 Cloud Interconnect，Dedicated vs Partner 的命名關係", "body": "Cloud Interconnect 是 Google Cloud 讓企業內部網路跟 GCP 網路之間建立專屬、不經過公開網際網路連線的產品總稱，底下分兩種子類型：Dedicated Interconnect（自己花錢牽專屬實體光纖線到 Google 共置機房，整條線只有自己用）、Partner Interconnect（透過已經跟 Google 有實體線路的電信商合作夥伴間接連線，不用自己拉線）。『Cloud Interconnect』本身不是一個具體方案，是這兩種子類型的總稱，類似『手機』是大類別、『iPhone/Android』是子類型的關係。優點：更穩定（有 SLA，如題目的 99.99%）、更低延遲（專線不跟人共享頻寬）、更安全（不經公開網路）、大流量下計費通常較便宜。對比 Cloud VPN：VPN 走公開網際網路、用加密建立邏輯通道，建置成本低但不保證穩定性，跟 Cloud Interconnect 的實體專線本質完全不同。Q228 題目用詞是『dedicated Google Cloud Interconnect』，明確指的是 Dedicated Interconnect 這個子類型。"}, {"heading": "記憶重點", "body": "看到『ensure/確保資源只能部署在特定區域』這種需求，要分辨：只是監控/事後告警 → 偵測型控制，不等於確保；真正能擋下不符合規定的資源建立 → 用 Organization Policy 的 Resource Location Restriction（gcp.resourceLocations constraint），這是 GCP 官方設計來做組織層級強制性地域合規的標準工具。另外要記住 Cloud Interconnect 是大類別、Dedicated/Partner 是子類型，不要把兩者當成同一層級的東西搞混。"}]}, "keywords": ["ensure all workloads in Google Cloud are deployed in these two regions"], "myAnswer": "D", "tags": ["Organization Policy", "合規性", "案例研究題", "⚠️答案存疑"]}, {"id": "T1-Q229", "topic": 1, "qnum": 229, "question": "KnightMotives is managing supplier data and pricing in a central MySQL database at headquarters (HQ). Only personnel at HQ are allowed to change the data. Each local plant stores a copy of the data in their own MySQL database, often using a different database schema or version. Every night a batch job exports any product or price updates in XML format from the central database at HQ and stores the updated data on a central FTP server. Each local plant must download this XML file and update their local system with the new information. The local data kept by some plants has become inconsistent with the source data due to XML parsing issues. HQ wants to easily verify that all changes are applied correctly at each plant.", "options": [{"letter": "A", "text": "Create a Pub/Sub topic per supplier, and have HQ publish all changes related to the respective supplier in JSON format on that topic. Allow all plants to create Pub/Sub Pull subscription to receive messages for their suppliers and update their databases."}, {"letter": "B", "text": "Create a Pub/Sub topic per supplier, and have HQ publish all changes related to the respective supplier in JSON format on that topic. Allow all plants to create Pub/Sub Push subscription to receive messages for their suppliers and update their databases."}, {"letter": "C", "text": "Migrate the self-hosted MySQL database at HQ to Cloud SQL. Standardize the database schema across all plants, and configure the local databases as external read replicas in Cloud SQL."}, {"letter": "D", "text": "Migrate the self-hosted MySQL database at HQ to Cloud SQL. Configure Database Migration Service between Cloud SQL and the on-premises databases. When creating the migration job. choose continuous migration instead of one-time migration."}], "answer": "C", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383605-exam-professional-cloud-architect-topic-1-question-229/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "把 XML 換成 JSON、把 FTP 換成 Pub/Sub Pull 訂閱，但每個工廠收到訊息後還是要自己寫程式解析、套用到資料庫，本質問題沒解決；也完全沒處理『各工廠 schema 不同』這個根本原因。"}, {"letter": "B", "analysis": "跟 A 同樣的根本問題，只是用 Push 訂閱取代 Pull——Pub/Sub 主動把訊息推到工廠的 HTTPS 端點，但一樣需要工廠自己寫解析/套用邏輯，且要求工廠對外開放可被呼叫的端點，不一定符合各工廠的網路環境。"}, {"letter": "C", "analysis": "正確：先把各工廠 schema 標準化，解決『不同 schema/版本』這個根本問題；再把各工廠本地資料庫設定成 Cloud SQL 的外部唯讀複本，用資料庫引擎原生複寫機制取代『匯出XML+FTP+解析』整個容易出錯的人工流程，複寫狀態天生可監控，直接對應『HQ 想要輕鬆驗證』的需求。"}, {"letter": "D", "analysis": "Database Migration Service 設計上是用來做『遷移/一次性切換』，即使選 continuous 模式，目的也是把停機時間降到最低、最終完全切換到 Cloud SQL，不是設計來長期維持『一個中央資料庫+多個永久並存的下游資料庫』這種架構；而且完全沒提到處理 schema 不同的問題。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 在 HQ 管理供應商資料和價格，存在中央 MySQL，只有 HQ 的人能改資料。每個地方工廠各自保留一份資料副本，存在自己的 MySQL，常常用不同 schema 或版本。每晚批次工作把異動匯出成 XML，丟到中央 FTP 伺服器，各工廠下載並解析套用。問題：有些工廠的資料因 XML 解析問題變得不一致，HQ 想要輕鬆驗證每個工廠的異動都有正確套用。"}, {"heading": "答案驗證：C（推理信心高，核心原因對應正確）", "body": "C 同時解決兩個核心問題：① 用『先標準化 schema』對應題目點出的『不同 schema/版本』根本原因；② 用 Cloud SQL 原生外部複寫取代『匯出XML+FTP+人工解析』的流程，資料庫層級複寫天生可監控驗證，直接對應『HQ 想要輕鬆驗證』的需求。Google 官方文件確認 Cloud SQL 支援『複寫到外部伺服器』功能，技術上可行。"}, {"heading": "服務介紹：Pub/Sub", "body": "Cloud Pub/Sub 是 GCP 的訊息佇列/發布訂閱服務，讓不同系統非同步傳遞訊息。Topic 是訊息頻道，發送方發布訊息；Subscription 是訂閱，接收方訂閱才能收到訊息，一個 Topic 可以有多個訂閱者。Pull：訂閱者主動定期去問有沒有新訊息；Push：Pub/Sub 主動把訊息推到你指定的 HTTPS 端點。本題選項 A/B 想用它取代 FTP，但收到訊息後還是要自己寫解析/套用邏輯，沒解決根本問題。"}, {"heading": "服務介紹：Cloud SQL 與複寫", "body": "Cloud SQL 是 GCP 全託管關聯式資料庫服務，支援 MySQL/PostgreSQL/SQL Server，Google 幫忙處理備份、修補、高可用性。關鍵功能：複寫（Replication）——主要資料庫（primary）的異動自動即時同步到複本（replica），甚至能複寫到 GCP 以外的『外部伺服器』（External Server Replication）。本題答案 C 就是用這個功能，讓各工廠的本地 MySQL 當 Cloud SQL 的外部唯讀複本，資料庫引擎自動保持同步。"}, {"heading": "服務介紹：Database Migration Service（DMS）", "body": "DMS 是 GCP 的資料庫遷移服務，幫你把現有資料庫（地端或其他雲）搬到 Cloud SQL。一次性遷移：搬一次就結束；持續遷移：持續同步異動直到你準備好正式切換（promote），目的是降低停機時間。核心理解：DMS 本質是為了『搬家』設計的，終點是讓你最終完全改用 Cloud SQL、淘汰舊資料庫，不是設計來長期維持中央+多個下游資料庫並存的架構，這是選項 D 不適合的原因。"}, {"heading": "什麼是 FTP", "body": "FTP（File Transfer Protocol）是古老的檔案傳輸協定，主從式架構：FTP 伺服器存放檔案，客戶端連上去上傳/下載檔案。本題情境：HQ 批次工作把 XML 上傳到中央 FTP 伺服器，各工廠定期連上去下載、自己解析套用。缺點：預設不加密（安全性較弱）、批次處理沒有即時性、檔案格式要靠人工解析邏輯（容易出錯、難以驗證同步狀態）、沒有自動重試/一致性保證機制。這些缺點正是 Q229 要解決的痛點，答案 C 用資料庫原生複寫徹底取代這整套流程。"}, {"heading": "MySQL 是 RDB 還是 NoSQL", "body": "MySQL 是 RDB（關聯式資料庫），不是 NoSQL。核心特徵：資料存在固定 schema 的表格裡、支援 SQL 語法、支援 JOIN 跨表查詢、支援 ACID 交易保證強一致性。RDB 適合資料結構固定、需要精確一致性、有複雜關聯查詢的情境（像本題的供應商價格資料）；NoSQL（如 Bigtable）適合資料量巨大、結構多變、高吞吐寫入、不需要複雜 JOIN 的情境（像 Q8、Q226 的感測器資料）。"}, {"heading": "記憶重點", "body": "看到『中央資料庫 + 多個地方資料庫要保持同步、且容易驗證一致性』，優先考慮資料庫原生複寫機制，而不是『匯出檔案+訊息佇列』這種需要額外解析邏輯的方案。看到『不同環境 schema 不一致』，要先想到『標準化 schema』是解決問題的前提。DMS 是遷移/切換工具，不是長期多端並存的同步架構。"}]}, "keywords": ["often using a different database schema or version", "has become inconsistent with the source data due to XML parsing issues", "HQ wants to easily verify that all changes are applied correctly at each plant"], "tags": ["Pub/Sub", "Database Migration Service", "Cloud SQL", "案例研究題"]}, {"id": "T1-Q230", "topic": 1, "qnum": 230, "question": "KnightMotives wants to personalize the dealer experience for its customers and has decided to train its own AI models for personalized recommendations. The company will start collecting personally identifiable information (PII) from its customers to use as part of the models’ training data. KnightMotives wants to ensure maximum security and compliance worldwide. You need to ensure the data is encrypted both at rest and during AI model training without impacting the models’ accuracy. What should you do?", "options": [{"letter": "A", "text": "Store the training data in BigQuery using column-level encryption. Train the model using Confidential GKE Nodes."}, {"letter": "B", "text": "Store the training data in BigQuery using column-level encryption Train the model on VertexAI notebooks using customer-managed encryption keys."}, {"letter": "C", "text": "Process all data with Sensitive Data Protection’s de-identification service. Replace any PII with a random string before storing it. Train the model using Confidential GKE Nodes."}, {"letter": "D", "text": "Process all data with Sensitive Data Protection's de-identification service. Replace any PII with a random string before storing it. Train the model on VertexAI notebooks using customer-managed encryption keys."}], "answer": "A", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383572-exam-professional-cloud-architect-topic-1-question-230/", "postedDate": "2026-02-10", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "正確：BigQuery 欄位層級加密負責『靜置加密』，Confidential GKE Nodes 用硬體層級記憶體加密負責『訓練當下（運算中）的加密』，同時保留真實 PII 資料不破壞訓練用的個人化特徵，不影響模型準確度，同時滿足題目三個條件。"}, {"letter": "B", "analysis": "欄位加密+保留真實資料這點正確，但訓練環境用 Vertex AI notebooks + CMEK。CMEK 只能保證『靜置加密』（資料存在硬碟時用自己管理的金鑰加密），無法讓資料在被處理、載入記憶體運算的當下保持加密狀態，不滿足『訓練當下也要加密』的要求。"}, {"letter": "C", "analysis": "用 Sensitive Data Protection 去識別化服務把 PII 換成隨機字串，原始個人化特徵資訊被徹底破壞消失。要做個人化推薦，模型本來就需要從這些資料學出規律，換成亂碼會讓模型學不到東西，直接違反『不能影響模型準確度』的要求。"}, {"letter": "D", "analysis": "跟 C 一樣用去識別化破壞原始資料、影響模型準確度；訓練環境的 CMEK 也只解決靜置加密，沒解決訓練當下的運算中加密，兩個條件都沒達成。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 要訓練自己的 AI 模型做個人化推薦，會收集客戶 PII（個資）當訓練資料。要求：① 全球最高等級的安全與合規 ② 資料靜置時和模型訓練當下都要加密 ③ 不能影響模型準確度。"}, {"heading": "答案驗證：A（已查證 Confidential GKE Nodes 的保護範圍）", "body": "Google 官方說明確認 Confidential GKE Nodes 用硬體層級的記憶體加密，保護資料在『使用中（in use）』時不被未授權存取，正好對應題目『during AI model training』的訴求。沒找到這題原始討論頁做最終核對，但推理邏輯清楚，信心高。"}, {"heading": "為什麼不能用去識別化（C、D 錯誤的核心原因）", "body": "Sensitive Data Protection 的去識別化服務會把 PII 換成隨機字串，原始資訊被徹底破壞、不可逆。個人化推薦模型需要從真實的個人化特徵中學習規律，換成亂碼會讓訓練資料失去意義，直接違反『不能影響模型準確度』的要求。看到『不能影響準確度』，要優先懷疑任何會改寫/銷毀原始資料內容的做法（去識別化、隨機化、過度泛化）。"}, {"heading": "服務介紹：BigQuery", "body": "是什麼：GCP 全託管、無伺服器的資料倉儲（Data Warehouse），專門用 SQL 查詢分析超大量結構化資料，常見用在報表、BI、大數據分析，而不是日常交易型應用的資料庫（那是 Cloud SQL / Spanner 的角色）。\n解決什麼問題：傳統資料倉儲要自己買機器、自己調效能擴容，BigQuery 讓你只要寫 SQL，運算資源由 Google 全自動擴展，不用管底層硬體。\n在這題的應用：資料預設就有靜置加密，還支援欄位層級加密、資料遮罩等更細緻的安全控制，所以選項 A/B 都選它當訓練資料的儲存位置——因為題目要求『存放大量 PII』又要『欄位層級加密』這種進階安全需求，BigQuery 剛好同時滿足。\n常見程度：非常常見，是 GCP 考試裡『需要做精細資料安全控制』情境的標準答案載體之一。"}, {"heading": "什麼是 Column-level encryption（欄位層級加密）", "body": "是什麼：不是加密整個資料庫或整張表，而是只針對特定欄位（例如存 PII 的那一欄）做加密，其他欄位保持明文可以正常查詢。在 BigQuery 是透過 AEAD 加密函式（AEAD.ENCRYPT / AEAD.DECRYPT）搭配 Cloud KMS 金鑰實作：寫入時用金鑰加密指定欄位，查詢時只有持有對應金鑰權限的人能解密還原。\n解決什麼問題：有些欄位敏感度特別高但不常被篩選/排序，整張表都加密會拖累查詢效能也沒必要，欄位層級加密讓你『只保護真正需要保護的那幾欄』，兼顧安全性跟可用性。\n在這題的應用：關鍵是加密後原始值可以完整還原，跟去識別化（永久破壞資料）完全不同——這正是本題選 A 而不選 C/D 的核心：訓練資料需要保留真實特徵才不會影響模型準確度。\n常見程度：這種考法很常見——『靜置加密 + 不能破壞原始資料』幾乎都在暗示答案要用加密（CMEK / 欄位層級加密），而不是去識別化 / 匿名化。"}, {"heading": "服務介紹：Confidential GKE Nodes（機密運算）", "body": "是什麼：GKE（Google Kubernetes Engine，GCP 的容器調度平台）節點的一種強化模式，底層靠 Confidential VM 技術（例如 AMD SEV 硬體加密）讓節點的記憶體在硬體層級被加密，連雲端供應商自己的 hypervisor 都看不到裡面實際在跑的明文資料。\n解決什麼問題：一般資料只有『靜置加密』（存在硬碟）和『傳輸加密』（網路傳輸中，像 HTTPS）兩層保護，但資料被 CPU 實際拿來運算的那一刻必須先解密成明文才能處理，這段『運算中（data in use）』完全沒有保護——Confidential Computing（機密運算）就是為了補上這個缺口而生的技術。\n在這題的應用：AI 模型訓練正是資料被大量載入記憶體、不斷被 CPU/GPU 運算的過程，一般加密方式完全保護不到這個階段，只有 Confidential GKE Nodes 能補上，對應題目『during AI model training』也要加密的要求。\n常見程度：這個技術相對新、在一般日常應用還不算普及，但在考試裡只要看到『運算中也要加密』『data in use』這種關鍵字，幾乎都是在指向 Confidential Computing（Confidential VM / Confidential GKE Nodes），是很好辨認的訊號詞。"}, {"heading": "服務介紹：Vertex AI Notebooks", "body": "是什麼：Vertex AI 是 GCP 整合式的機器學習平台，涵蓋資料準備、訓練、部署、監控的完整生命週期，是 GCP 目前主推的 ML 解決方案；Notebooks 是裡面提供的 Jupyter 筆記本開發環境，工程師在上面寫程式做資料探索、訓練、實驗模型。\n解決什麼問題：讓 ML 工程師不用自己架設、維護訓練用的運算環境，直接在託管的筆記本環境裡寫程式訓練模型。\n在這題的應用：選項 B/D 用 Vertex AI Notebooks 搭配 CMEK 來訓練模型，問題不在 Notebooks 本身（它是合理的訓練環境），而是搭配的加密方式 CMEK 只能保護『靜置加密』，無法滿足『訓練當下也要加密』的要求，所以 B/D 還是因為加密方式選錯而不是正解。\n常見程度：非常常見、主流的 ML 開發工具，考試裡經常出現。"}, {"heading": "什麼是 Customer-managed encryption keys（CMEK，客戶自管金鑰）", "body": "是什麼：讓你用自己在 Cloud KMS（Key Management Service）建立、擁有控制權（能輪替、能撤銷存取）的金鑰，取代 Google 預設管理的金鑰，對儲存中的資料加密。\n解決什麼問題：Google 預設管理的金鑰（Google-managed key）你無法直接控制它的生命週期，CMEK 讓有更高合規/稽核需求的企業能自己掌控金鑰——在金融、醫療等高合規產業很常見。\n在這題的應用：這題的陷阱就在這裡——CMEK 只解決『靜置加密』這一層，資料被讀進記憶體實際運算的那一刻並不在它的保護範圍內，很容易誤以為『用自己的金鑰加密 = 夠安全』，但沒處理到題目要求的『運算中加密』，這就是 B、D 錯誤的關鍵之一。\n常見程度：CMEK 本身在企業雲端架構中很常見，但要注意它『只管靜置、不管運算中』的邊界，是這類題目常考的細節。"}, {"heading": "服務介紹：Sensitive Data Protection（前身為 Cloud DLP）", "body": "是什麼：GCP 的敏感資料偵測與保護服務，能自動掃描、分類文字/檔案裡的 PII 等敏感資訊，並提供『去識別化（de-identification）』功能，把真實姓名、身分證號等換成遮罩或隨機字串，讓原始內容無法被還原。\n解決什麼問題：在資料要被分享、對外分析、或想降低洩漏風險時，讓敏感資料『失去可識別性』但保留整體資料形態，常用在隱私合規場景（例如把資料拿去做一般統計分析、或分享給第三方）。\n在這題的應用：這是本題最大的陷阱——個人化推薦模型本來就需要從『真實的個人化特徵』裡學規律，資料被換成亂碼後失去所有可學習的訊號，直接違反『不能影響模型準確度』的要求。這題的核心就是要你分辨『去識別化：保護隱私但犧牲資料可用性』vs『加密：保護隱私同時保留資料原貌』這兩種手法的差異與取捨。\n常見程度：Sensitive Data Protection 本身很常用、很主流，但在『需要保留資料可用性/準確度』的情境下反而是錯誤選項，是很經典的混淆設計。"}, {"heading": "記憶重點", "body": "看到『不能影響模型準確度』，優先排除會破壞/改寫原始資料內容的做法（去識別化、匿名化、隨機化）。看到『運算/訓練當下也要加密』（data in use），答案方向是 Confidential Computing（Confidential VM / Confidential GKE Nodes），不是單純的 CMEK——CMEK 只管靜置加密，管不到運算中加密。"}]}, "keywords": ["ensure maximum security and compliance worldwide", "encrypted both at rest and during AI model training without impacting the models’ accuracy"], "tags": ["Sensitive Data Protection(DLP)", "Vertex AI/AI-ML", "Cloud KMS/加密", "安全性", "案例研究題"]}, {"id": "T1-Q231", "topic": 1, "qnum": 231, "question": "You are responsible for designing the network infrastructure architecture for KnightMotives's new environment on Google Cloud. You need to design the new VPC topology. You want to ensure a guaranteed bandwidth and low latency between the plants and Google Cloud resources. What should you do?", "options": [{"letter": "A", "text": "Create a Standard Tier VPC. and ensure a subnet is available in the region closest to a plant. Establish a Cloud Interconnect between each subnet and the local plant."}, {"letter": "B", "text": "Create a Standard Tier VPC. and ensure a subnet is available in the region closest to a plant Establish Direct Peering between Google's Edge Network and the local plant."}, {"letter": "C", "text": "Create a Premium Ter VPand ensure a subnet is available in the region closest to a plant. Establish a Cloud Interconnect between each subnet and the local plant."}, {"letter": "D", "text": "Create a Premium Ter VPC. and ensure a subnet is available in the region closest to a plant. Establish Direct Peering between Google's Edge Network and the local plant."}], "answer": "C", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383631-exam-professional-cloud-architect-topic-1-question-231/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Cloud Interconnect 本身能提供有 SLA 保證的專線頻寬，但搭配的是 Standard Tier VPC——Standard Tier 的流量不保證全程走 Google 的全球私有骨幹網路，在 GCP 內部段的路由品質、延遲都不如 Premium Tier 穩定，不是最佳組合。"}, {"letter": "B", "analysis": "Direct Peering 本身沒有 SLA、不保證頻寬，是 best-effort 的連線方式，不滿足題目『保證頻寬』的硬性需求，直接不符合條件。"}, {"letter": "C", "analysis": "正確：Premium Tier 讓流量盡量走 Google 全球私有骨幹網路，路徑最佳化、延遲最低；Cloud Interconnect（Dedicated/Partner Interconnect）提供有 SLA 保障的專線頻寬，不經過公開網際網路。兩者組合同時滿足『保證頻寬』與『低延遲』兩個要求。"}, {"letter": "D", "analysis": "Direct Peering 沒有 SLA、不保證頻寬，即使搭配 Premium Tier VPC，整條連線仍無法滿足『保證頻寬』的要求。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 要幫新環境設計 VPC 網路架構，要求工廠（plants）跟 GCP 資源之間的連線要有『保證頻寬』+『低延遲』。這題在考『挑選正確的網路服務層（Service Tier）+ 正確的連線方式（Interconnect vs Peering）』的組合。"}, {"heading": "答案驗證：C", "body": "Google 官方文件明確指出：Dedicated/Partner Interconnect 提供有 SLA 保證的頻寬與延遲；Direct Peering 則是沒有 SLA 的 best-effort 連線，兩者定位完全不同。同時 Premium Tier 讓流量在 Google 骨幹網路中走最佳路徑，比 Standard Tier 更低延遲、更穩定。C 是唯一同時滿足『保證頻寬』與『低延遲』兩個要求的組合。"}, {"heading": "服務介紹：Cloud Interconnect（含 Dedicated / Partner 差異）", "body": "是什麼：Cloud Interconnect 是一個總稱，底下分兩種——Dedicated Interconnect（直接跟 Google 拉一條實體專線，適合流量大、自己有能力到 Google 機房做互連的企業）、Partner Interconnect（透過合作電信商中轉連線，適合流量沒那麼大或沒辦法直接進 Google 機房的企業）。兩種都提供 SLA 保證的頻寬與低延遲，完全不經過公開網際網路。\n解決什麼問題：公開網際網路的連線品質無法保證，企業需要穩定、可預期品質的連線到 GCP，Cloud Interconnect 就是為了解決『我需要知道我的連線頻寬、延遲是有保障的』這個需求而設計。\n在這題的應用：題目要求『保證頻寬』，Cloud Interconnect 正是唯一能給出 SLA 保證的連線方式，答案 A、C 都用它，差別在搭配的 Network Tier。\n常見程度：在正式的地端到 GCP 混合雲架構中非常常見，是企業上雲的標準做法之一。題目裡的『Cloud Interconnect』是泛稱，實際落地時會是 Dedicated 或 Partner Interconnect 其中一種。"}, {"heading": "服務介紹：Direct Peering", "body": "是什麼：在特定的網路交換點，讓你的網路設備直接跟 Google 的邊緣網路（Edge Network）對接，走的仍然是類似網際網路的路徑，只是實體上少繞一點路。\n解決什麼問題：主要是為了讓你的用戶能更快速存取 Google 的公開服務（例如 Google Workspace、YouTube、一般的 Google API/服務），提供一個免費或低成本、比純公開網際網路稍好的連線選項。\n在這題的應用：關鍵限制是 Google 明確說明 Direct Peering 沒有 SLA（Service Level Agreement），不保證頻寬、不保證延遲、不保證可用性，品質是 best-effort。這跟企業關鍵基礎設施需要的『保證頻寬』完全是兩回事，是本題排除 B、D 的關鍵原因。\n常見程度：常見於一般存取 Google 服務的場景，但不適合用在需要 SLA 保證的企業專線情境，是這類題目常見的混淆選項。"}, {"heading": "服務介紹：Network Service Tier（Premium Tier vs Standard Tier）", "body": "是什麼：GCP VPC 層級的網路服務分級設定，決定你的流量怎麼在 Google 的網路裡繞路。Premium Tier 讓流量盡量走 Google 自己建的全球私有骨幹網路，在離來源/目的地最近的 Google 邊緣節點才進出公開網路，路徑最佳化、延遲最低、可靠度最高，但費用較高；Standard Tier 則比較像一般 ISP 的作法，流量會更早進入/離開公開網際網路，走一般的公開路由，便宜但延遲與穩定性都比較差，且不是所有 region 都支援。\n解決什麼問題：給用戶在『效能』跟『成本』之間一個選擇權——不是所有應用都需要最高品質的網路。\n在這題的應用：題目強調『保證頻寬 + 低延遲』，明確指向要選 Premium Tier，這也是 A（Standard Tier）即使搭配了 Cloud Interconnect 仍不是最佳答案的原因。\n常見程度：是企業關鍵/生產環境混合雲連線的常見標準選擇，考試裡經常跟 Cloud Interconnect 搭配出現。"}, {"heading": "記憶重點", "body": "看到『guaranteed bandwidth』（保證頻寬）、SLA，優先想到 Cloud Interconnect（Dedicated/Partner），而不是 Peering（Direct Peering、Carrier Peering 都沒有 SLA）。看到『低延遲、走 Google 骨幹網路』，要選 Premium Tier 而不是 Standard Tier。Direct Peering vs Cloud Interconnect 的核心差異就是『有沒有 SLA 保證』，是這類考題的經典陷阱。"}]}, "keywords": ["ensure a guaranteed bandwidth and low latency", "Standard Tier", "Premium Tier", "Cloud Interconnect", "Direct Peering"], "tags": ["VPC/網路", "Interconnect/VPN", "案例研究題"]}, {"id": "T1-Q232", "topic": 1, "qnum": 232, "question": "As part of its cloud strategy. KnightMotives wants to move its virtual machines (VMs) into Google Cloud. These VMs contain applications, database instances, and file servers. In the future, KnightMotives intends to modernize their landscape by adopting cloud native technologies on Google Cloud. During modernization, minimal latency and operational overhead between the old and new landscape will be crucial. You need to design the cloud architecture for the VM environment on Google Cloud while ensuring a future modernization track will meet the technical requirements. What should you do?", "options": [{"letter": "A", "text": "Create a Shared Virtual Private Cloud (VPC). and migrate the VMs to Compute Engine in a new project. During modernization, deploy each modernized workload in a dedicated Google Cloud project with its own VPC. Connect the two VPCs via an on-premises VPN."}, {"letter": "B", "text": "Create a Shared Virtual Private Cloud (VPC). Migrate the VMs to Compute Engine in a new project. During modernization, deploy each modernized workload in a dedicated Google Cloud project using the Shared VPC."}, {"letter": "C", "text": "Create a single private cloud on Google Cloud VMware Engine. Migrate the VMs using VMware HCX. During modernization, deploy the modernized workloads in a single Google Cloud project using a single VPC."}, {"letter": "D", "text": "Create a single private cloud on Google Cloud VMware Engine. Migrate the VMs using VMware HCX. During modernization, deploy each modernized workload in a dedicated Google Cloud project with its own VPC."}], "answer": "A", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383600-exam-professional-cloud-architect-topic-1-question-232/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "VPC/網路", "資料遷移", "案例研究題", "⚠️答案存疑"], "explanation": {"optionTable": [{"letter": "A", "analysis": "存疑（我認為不是最佳答案）：現代化階段放棄了 Shared VPC，改成每個現代化工作負載用各自獨立的 VPC，再用『地端 VPN』把新舊 VPC 連起來。這代表雲端內部的流量可能要繞道經過地端機房才能互通，額外架設/維護 VPN 也是維運負擔，直接違背『延遲和維運負擔要降到最低』的核心要求。", "zh": "建立共用虛擬私有雲（Shared VPC），把 VM 搬到一個新專案裡的 Compute Engine。現代化改造時，把每個現代化後的工作負載部署在各自獨立的 Google Cloud 專案、各自擁有自己的 VPC。透過地端（on-premises）VPN 把這兩個 VPC 連接起來。"}, {"letter": "B", "analysis": "我認為這才是正確答案：現代化階段的每個新工作負載雖然放在各自獨立的新專案，但繼續掛在同一個 Shared VPC 上。新舊工作負載全部共用同一個網路，彼此用內部私有 IP 直接溝通，不需要額外的 VPN 或 Peering，完全對應『延遲最小化（同網路內部直連）+維運負擔最小化（不用管理額外連線）』的要求，也符合 Shared VPC 本身的設計目的。", "zh": "建立共用虛擬私有雲（Shared VPC）。把 VM 搬到一個新專案裡的 Compute Engine。現代化改造時，把每個現代化後的工作負載部署在各自獨立的 Google Cloud 專案，但繼續使用同一個 Shared VPC。"}, {"letter": "C", "analysis": "用 Google Cloud VMware Engine（GCVE）+ VMware HCX 遷移，但題目完全沒提到這些 VM 是跑在 VMware 上，假設要用 GCVE 是過度推論。現代化後的工作負載全部塞進單一 VPC/專案，也跟題目『未來採用雲原生技術』的方向不太搭——GCVE 是讓你繼續留在 VMware 私有雲環境，不是邁向雲原生的路徑。", "zh": "在 Google Cloud VMware Engine 上建立單一私有雲。用 VMware HCX 搬遷 VM。現代化改造時，把現代化後的工作負載全部部署在單一 Google Cloud 專案、使用單一 VPC。"}, {"letter": "D", "analysis": "同樣用 GCVE/HCX（過度假設 VMware 環境），而且現代化後每個工作負載用各自獨立 VPC，卻完全沒提到新舊之間要怎麼連接，比 A 還少了連接機制的說明，更難滿足『延遲和維運負擔最小化』的要求。", "zh": "在 Google Cloud VMware Engine 上建立單一私有雲。用 VMware HCX 搬遷 VM。現代化改造時，把每個現代化後的工作負載部署在各自獨立的 Google Cloud 專案、各自擁有自己的 VPC。"}], "notes": [{"heading": "題目在問什麼", "body": "KnightMotives 要把 VM（應用程式、資料庫、檔案伺服器）搬到 Google Cloud，未來打算採用雲原生技術做現代化改造。關鍵要求：現代化改造過程中，新舊兩套架構之間的延遲和維運負擔要降到最低。要設計一套既符合現在搬遷需求、又能支援未來現代化的網路架構。"}, {"heading": "⚠️ 答案存疑：我認為應該是 B，不是存的答案 A", "body": "核心判斷依據是 Shared VPC 的設計目的：讓多個不同專案共用同一個 VPC 網路，資源之間用內部私有 IP 直接溝通，不需要額外架 VPN 或做 Peering。B 的做法是現代化階段的新工作負載繼續掛在同一個 Shared VPC 上，新舊工作負載全部共用同一個網路，直接對應『延遲最小化+維運負擔最小化』的要求。A 雖然一開始也用 Shared VPC，但現代化階段卻放棄這個共用網路架構，改成各自獨立 VPC 再用地端 VPN 連接，這代表雲端內部流量可能要繞道經過地端機房才能互通，增加延遲也增加維運負擔，邏輯上說不通。搜尋到的 GCP 練習資源也指出這類題型『比較偏好的答案是保留既有的 VPC，只調整外圍的 project 結構』，支持 B 的判斷。沒找到這題原始討論頁做最終核對，信心中高。"}, {"heading": "記憶重點", "body": "看到『先搬遷 VM，之後逐步現代化，要求新舊架構間延遲/維運負擔要低』這種情境，優先考慮 Shared VPC，而且重點是：現代化階段的新工作負載，要繼續掛在同一個 Shared VPC 上，而不是切出全新的獨立 VPC 再想辦法接回去——額外架 VPN/Peering 去連接本來可以共用的網路，是常見的反模式。另外，題目沒明確提到 VMware，不要自己腦補要用 GCVE/HCX 這類 VMware 專屬遷移路徑。"}, {"heading": "服務介紹：Shared VPC（共用虛擬私有雲）", "body": "是什麼：正常情況下每個 GCP 專案都有自己獨立的 VPC 網路，彼此預設互相看不到、連不到。Shared VPC 讓你指定一個 host project（主機專案），它的 VPC 網路可以被其他多個 service project（服務專案）共用，被授權的 service project 裡的資源（VM、GKE 叢集等）就像活在同一個網路裡，可以用內部私有 IP 直接互相溝通。\n解決什麼問題：多個專案（通常對應不同團隊/部門）需要共用同一套網路架構、互相直連，又不想額外架 VPN 或做 VPC Peering 來連接彼此。\n在這題的應用：題目要求「新舊架構間延遲和維運負擔最小化」，Shared VPC 讓不同專案的資源直接內部互通，不用額外架設連接機制，完全對應這個要求——關鍵是現代化階段的新工作負載也要繼續掛在同一個 Shared VPC 上（選項 B），而不是切出全新的獨立 VPC 再想辦法接回去（選項 A 的問題）。\n常見程度：企業多專案（multi-project）架構的標準做法，GCP 考試裡「多個專案需要互通」情境的常見正解。"}, {"heading": "什麼是 Compute Engine", "body": "是什麼：GCP 自己的虛擬機（VM）服務，讓你在 Google 的硬體上建立、執行一般的虛擬機器，可以自訂作業系統、CPU、記憶體、磁碟等規格，是 GCP 最基礎的運算服務之一。\n解決什麼問題：公司原本在自己機房或其他雲端上跑的伺服器，需要『搬家』到 GCP 繼續運作時，最直接的落地位置就是 Compute Engine（對應傳統的 lift-and-shift 遷移）。\n在這題的應用：題目裡所有選項都要把 VM 搬到 Compute Engine 上執行，差別只在於搬遷方式（直接搬 vs 透過 VMware 相關工具搬）跟搬完之後的網路架構怎麼設計。\n常見程度：非常常見，是 GCP 考試裡『伺服器搬遷/傳統工作負載』情境幾乎必然出現的基礎服務。"}, {"heading": "什麼是 on-premises VPN（地端 VPN）", "body": "是什麼：VPN（Virtual Private Network，虛擬私有網路）在這裡是指透過網路，在雲端的 VPC 跟公司自己機房（on-premises，地端）的網路之間，架一條加密的連線通道，讓兩邊的資源可以互相溝通，就像地端機房多了一條『私有的網路專線』通到雲端。\n解決什麼問題：公司資源分散在雲端跟地端兩邊時，需要安全地互相存取彼此的服務。\n在這題的應用：選項 A 現代化階段放棄了 Shared VPC，改用『地端 VPN』把兩個獨立 VPC 連起來——問題是這代表雲端內部兩套工作負載之間的流量，可能要先繞去地端機房再繞回來才能互通，不但多了一層延遲，架設維護這條 VPN 本身也是額外的維運負擔，直接違背題目『延遲和維運負擔最小化』的要求。\n常見程度：VPN 本身是雲端架構常見的連接手法，但這題的陷阱是『本來可以直接用 Shared VPC 共用網路，卻繞道改用 VPN 連接』，屬於過度複雜化的反模式。"}, {"heading": "服務介紹：Google Cloud VMware Engine（GCVE）", "body": "是什麼：Google Cloud 提供的服務，讓你在 GCP 的實體硬體基礎設施上，直接跑一套完整的 VMware 私有雲環境（vSphere、vSAN、NSX 等 VMware 自家虛擬化技術）。\n解決什麼問題：公司原本機房用 VMware 當虛擬化平台（傳統企業很常見），GCVE 讓你把整套 VMware 環境原封不動搬到 GCP，VM 不需要重新設定、不用轉換格式——對 VM 來說就像『機房換了個地方』,其他完全不變；相對地，若直接搬到 Compute Engine，VM 的磁碟映像、驅動程式通常需要轉換成相容格式。\n在這題的應用：選項 C、D 用 GCVE 當遷移目的地，但題目完全沒提到這些 VM 原本是跑在 VMware 上，假設要用 GCVE 是過度推論；而且 GCVE 是讓你繼續留在 VMware 私有雲生態系，跟題目『未來要採用雲原生技術做現代化改造』的方向不太搭。\n常見程度：VMware 環境遷移上雲是常見的真實場景,但這題沒有任何 VMware 的線索,不該自己腦補。"}, {"heading": "什麼是 VMware HCX", "body": "是什麼：VMware 官方提供的遷移工具，專門用來把 VM 在不同的 VMware 環境之間搬遷（例如從地端的 VMware 機房，搬到 GCVE 的 VMware 環境），支援接近零停機的線上遷移，還能讓搬過去的 VM 暫時保留原本的 IP 位址和網路設定，不用立刻重新規劃網路。\n解決什麼問題：VMware 環境間搬 VM 時，避免大規模停機跟網路重新設定的麻煩。\n在這題的應用：選項 C、D 搭配 GCVE 使用 HCX 搬遷 VM,邏輯上是『選了 GCVE 當目的地,自然要用 VMware 自家的遷移工具』,但因為 GCVE 這個前提本身就是過度推論（題目沒提到 VMware），這兩個選項從源頭就站不住腳。\n常見程度：在真實的 VMware-to-cloud 遷移案例中很常見，但這題考的其實是『不要自己腦補題目沒給的前提』。"}], "questionZh": "身為 KnightMotives 雲端策略的一部分，公司想把虛擬機（VM）搬到 Google Cloud。這些 VM 裡跑著應用程式、資料庫實例和檔案伺服器。未來，KnightMotives 打算透過採用雲原生技術，對整個架構進行現代化改造。在現代化改造的過程中，新舊架構之間的延遲和維運負擔降到最低將是關鍵。你需要設計 VM 環境在 Google Cloud 上的雲端架構，同時確保未來的現代化改造路徑能符合技術需求。你該怎麼做？"}, "keywords": ["minimal latency and operational overhead between the old and new landscape"], "myAnswer": "B"}, {"id": "T1-Q234", "topic": 1, "qnum": 234, "question": "KnightMotives has developed and deployed a model on Vertex AI that can provide personalized recommendations in the new car configuration application. Customers will receive optional equipment recommendations that best suit their persona. Previous usage data from the car configuration application has been used for model training features. You know from past experience that customer behavior can change over time. For example, in times of economic certainty and rising stock markets, customers tend to purchase more expensive options. You want to detect when customer behavior gradually changes over time so you can adjust the model. What should you do?", "options": [{"letter": "A", "text": "Configure Model Monitoring, and select training-serving skew detection."}, {"letter": "B", "text": "Configure Model Monitoring, and select prediction drift detection."}, {"letter": "C", "text": "Configure Dataplex auto data quality on the prediction request data features using row-level rules."}, {"letter": "D", "text": "Configure Dataplex auto data quality on the prediction request data features using aggregate rules."}], "answer": "B", "caseStudy": "KnightMotives Automotive", "link": "https://www.examtopics.com/discussions/google/view/383595-exam-professional-cloud-architect-topic-1-question-234/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Vertex AI/AI-ML", "監控與可觀測性", "案例研究題"], "explanation": {"notes": [{"heading": "題目在問什麼", "body": "KnightMotives 在 Vertex AI 上訓練了一個模型，根據客戶特質推薦配車選配，訓練資料用的是過去的使用數據。客戶行為會隨時間漸進式改變（例如股市好的時候，客戶傾向買貴的選配）。要偵測『客戶行為隨時間逐漸改變』，好讓你知道什麼時候該調整模型。"}, {"heading": "答案驗證：B（Prediction drift detection）", "body": "關鍵在分辨 training-serving skew 跟 prediction drift 的差異。skew 是拿模型上線時吃到的即時資料，跟『當初訓練用的那份固定資料集』做比較，是跟一個過去的固定基準點比對的一次性落差；drift 是看模型上線後這段時間自己送進來的資料，隨著時間推移分布是不是在慢慢改變，抓的是持續性、漸進式的變化趨勢。題目明確說『detect when customer behavior gradually changes over time』，精準對應 drift（隨時間漂移），不是 skew。信心高，邏輯清楚不需額外查證。"}, {"heading": "服務介紹：Vertex AI Model Monitoring", "body": "是什麼：GCP 用來持續監控已上線機器學習模型的工具，專門抓『模型現在吃到的資料，是不是已經跟訓練時不一樣了』，主要分兩種偵測：training-serving skew（訓練-服務偏差，跟訓練資料集比對）跟 prediction drift（預測漂移，跟自己過去一段時間的資料比對）。\n解決什麼問題：模型上線後，現實世界資料會隨時間改變（客戶行為、市場環境等），如果沒有監控，模型會在不知不覺中變得不準，Model Monitoring 讓你及時發現該重新訓練/調整模型的時機。\n在這題的應用：題目要偵測『客戶行為隨時間漸進改變』，答案選 prediction drift detection，因為它專門抓資料隨時間推移的持續性變化,正好對應題目情境。\n常見程度：GCP 考試中『MLOps / 模型上線後維運』主題的常見核心服務，skew vs drift 的差異是常考細節。"}, {"heading": "什麼是 Training-serving skew（訓練-服務偏差）", "body": "是什麼：拿模型上線後、實際接收到的服務（serving）資料，跟當初訓練（training）用的那份固定資料集做統計分布比對，檢查兩者是否有落差。\n解決什麼問題：確保『模型實際上線後吃到的資料』跟『當初訓練時看到的資料』長得差不多，避免訓練/上線環境不一致造成模型失準。\n在這題的應用：這是跟一個過去的固定基準點（訓練資料集）比對的一次性落差偵測，不是持續追蹤『隨時間推移』的變化趨勢，所以不符合題目『gradually changes over time』的要求，是這題的誤答陷阱。\n常見程度：常跟 prediction drift 放在一起考，重點記住『skew 比訓練資料、drift 比自己過去的資料』。"}, {"heading": "什麼是 Prediction drift（預測漂移）", "body": "是什麼：不跟訓練資料比，而是看模型上線後這段時間內，自己收到的預測請求資料，隨著時間推移分布是不是在慢慢改變,抓的是持續性、漸進式的變化趨勢。\n解決什麼問題：有些情境下資料會隨著現實世界環境（例如經濟狀況、季節、流行趨勢）慢慢改變,即使跟原始訓練資料的差距一開始不大，也需要被偵測出來，才能及時調整模型。\n在這題的應用：題目的『客戶行為隨時間漸進改變』正是 drift 的典型場景，所以答案選 B。\n常見程度：MLOps 監控主題的核心概念，常與 skew 做對比考。"}, {"heading": "服務介紹：Dataplex", "body": "是什麼：GCP 的資料治理/資料品質管理工具，用來檢查資料本身乾不乾淨、符不符合規則，例如有沒有缺值、格式對不對、數值有沒有超出合理範圍。它的 auto data quality 功能可以設定規則：row-level（逐筆檢查每一列資料）或 aggregate（整批統計層面檢查，例如整體平均值/缺值比例）。\n解決什麼問題：確保資料倉儲/資料湖裡的資料品質符合標準，常用在 ETL 流程、資料治理場景，跟『機器學習模型的預測行為是否隨時間改變』是完全不同的範疇。\n在這題的應用：C、D 選 Dataplex 的 row-level/aggregate 規則，但這題要偵測的是模型的預測行為漂移，不是資料本身乾不乾淨，從工具類別上就選錯了，是這題的誤答陷阱。\n常見程度：Dataplex 本身是常見的資料治理服務，但常被用來跟『模型監控』類題目混淆,要分清楚『資料品質』跟『模型監控』是兩套不同工具。"}], "optionTable": [{"letter": "A", "analysis": "錯誤：Training-serving skew 偵測的是『模型上線後的即時資料』跟『當初訓練用的那份固定資料集』之間的分布落差，是跟一個過去的固定基準點比對的一次性落差，不是持續追蹤『隨時間推移』的變化趨勢，不符合題目『客戶行為隨時間漸進改變』的要求。", "zh": "設定 Model Monitoring，選擇訓練-服務偏差（training-serving skew）偵測。"}, {"letter": "B", "analysis": "正確：Prediction drift detection 看的是模型上線後這段時間內，自己收到的預測請求資料，隨著時間推移分布是不是在慢慢改變，抓的正是持續性、漸進式的變化趨勢，精準對應題目『detect when customer behavior gradually changes over time』的要求。", "zh": "設定 Model Monitoring，選擇預測漂移（prediction drift）偵測。"}, {"letter": "C", "analysis": "錯誤：Dataplex 的 auto data quality 是資料治理/資料品質工具，用 row-level 規則逐筆檢查資料是否乾淨（有無缺值、格式對不對），跟『偵測模型預測行為隨時間改變』是完全不同的範疇，從工具類別上就選錯了。", "zh": "在 Dataplex 上針對預測請求資料的特徵，用逐筆（row-level）規則設定自動資料品質檢查。"}, {"letter": "D", "analysis": "錯誤：跟 C 一樣是 Dataplex 資料品質工具，只是用 aggregate（整批統計層面）規則而非逐筆檢查，但同樣不是用來偵測模型預測行為隨時間漂移的工具。", "zh": "在 Dataplex 上針對預測請求資料的特徵，用整批統計（aggregate）規則設定自動資料品質檢查。"}], "questionZh": "KnightMotives 在 Vertex AI 上開發並部署了一個模型，可以在新的汽車配置應用程式裡提供個人化推薦。客戶會收到最適合他們個人特質的選配設備推薦。汽車配置應用程式過去的使用數據，被用來當作模型訓練的特徵。你從過往經驗得知，客戶行為會隨時間改變。舉例來說，在經濟景氣穩定、股市上漲的時期，客戶傾向購買較貴的選配。你想要偵測客戶行為何時隨時間逐漸改變，以便調整模型。你該怎麼做？"}, "keywords": ["detect when customer behavior gradually changes over time"]}, {"id": "T1-Q235", "topic": 1, "qnum": 235, "question": "Your team plans to use Vertex AI to develop and deploy machine learning models for various use cases for fraud detection, product recommendations, and customer churn prediction. You want to enhance the security posture of the Vertex AI and Workbench environment by restricting data exfiltration. What should you do?", "options": [{"letter": "A", "text": "Enable Private Google Access for the VPC network to allow Vertex AI services to access public Google services without traversing the public internet."}, {"letter": "B", "text": "Enable VPC Flow Logs to monitor network traffic to and from Vertex AI services and to identify suspicious activity."}, {"letter": "C", "text": "Create a service perimeter and include ml.googleapis.com and document.googleapis.com as protected services."}, {"letter": "D", "text": "Create a service perimeter and include aiplatform.googleapis.com and notebooks.googleapis.com as protected services."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383614-exam-professional-cloud-architect-topic-1-question-235/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Vertex AI/AI-ML", "VPC/網路", "安全性"], "explanation": {"notes": [{"heading": "題目在問什麼", "body": "團隊要用 Vertex AI 開發/部署多個機器學習模型（詐欺偵測、產品推薦、客戶流失預測）。要強化 Vertex AI 和 Workbench 環境的安全性，防止資料外洩（data exfiltration）。"}, {"heading": "答案驗證：D", "body": "VPC Service Controls 的 Service Perimeter 保護的是你指定的特定 Google API，關鍵是要選對 API 清單：aiplatform.googleapis.com 是 Vertex AI 現行的 API（涵蓋訓練、部署、預測），notebooks.googleapis.com 是 Vertex AI Workbench（筆記本開發環境）的 API，兩個加起來正好對應題目說的『Vertex AI 和 Workbench 環境』。C 選的 ml.googleapis.com 是舊版 AI Platform（原 Cloud ML Engine）的 API，document.googleapis.com 是 Document AI（文件解析/OCR）的 API，都跟題目描述的 Vertex AI 用例無關，是選了看起來像但其實不對的服務名稱。信心高，邏輯清楚、API 名稱對應明確。"}, {"heading": "什麼是 Data exfiltration（資料外洩）", "body": "指內部的敏感資料被未經授權地搬出受控範圍，例如員工（或被盜用帳號/惡意程式）把公司機密資料複製到個人帳號、外部儲存空間，或透過網路傳到控制範圍以外的地方。這題要防的就是有人在 Vertex AI / Workbench 環境裡，把訓練資料或模型結果偷偷搬出去。"}, {"heading": "服務介紹：VPC Service Controls（Service Perimeter）", "body": "是什麼：GCP 的安全機制，可以在指定的 GCP 專案/服務周圍畫一條『邊界』（Service Perimeter）。邊界內的服務可以正常互相存取，但邊界內的資料不能被搬到邊界外（例如不能被複製到邊界外的 Cloud Storage bucket，或透過未授權的網路路徑送出去）——這是主動預防性（preventive）控制，不是事後查的被動監控。\n解決什麼問題：防止敏感資料被搬出受控範圍，即使帳號被盜用或員工誤操作，也能從網路層面擋下資料外洩。\n在這題的應用：要保護的目標是 aiplatform.googleapis.com（Vertex AI）+ notebooks.googleapis.com（Workbench），正好對應題目描述的環境,所以答案選 D。\n常見程度：GCP 考試中『資料外洩防護 / 多租戶資料隔離』情境的標準正解機制，重點是要記住它保護的是『特定 API』,選對 API 名稱是這類題目的關鍵。"}, {"heading": "什麼是 Vertex AI Workbench", "body": "是什麼：Vertex AI 裡提供的筆記本開發環境，本質上是託管版的 Jupyter Notebook，底層是一台已經裝好 Python、機器學習套件（TensorFlow、PyTorch、Pandas 等）、並連好 BigQuery、Cloud Storage 等 GCP 資料服務的 Compute Engine VM。\n解決什麼問題：讓資料科學家不用自己架設、維護開發環境（裝套件、處理版本相容性等），直接在雲端隨開即用的筆記本裡寫程式做資料探索、訓練模型。\n在這題的應用：資料科學家在 Workbench 裡會接觸大量敏感訓練資料（例如詐欺偵測用的交易記錄），如果沒有限制，有人可能直接在 Notebook 裡把資料複製/下載到外部，所以 Service Perimeter 要把 notebooks.googleapis.com（Workbench 的 API）也納入保護範圍，不能只保護 aiplatform.googleapis.com（Vertex AI 的訓練/部署功能）。\n常見程度：非常常見，是 Vertex AI 生態系裡資料科學家的主要互動介面之一。"}, {"heading": "為什麼 A、B 錯：連線路徑 vs 監控 vs 預防", "body": "A（Private Google Access）：讓沒有外部 IP 的 VM 能透過 Google 的私有網路路徑（不經公開網際網路）存取 Google 的公開 API 服務，解決的是『連線路徑』問題，跟『防止資料被搬出受控邊界』是不同訴求,本身不會阻止資料外洩。\nB（VPC Flow Logs）：只是把進出的網路流量記錄下來方便事後查看/分析可疑行為，是偵測性（detective）而非預防性（preventive）控制——能幫你事後發現異常，但不會主動阻止資料真的被搬出去。題目要的是『restricting』（限制/防止），不是『監控』。\n記憶重點：看到『restrict exfiltration / 防止資料外洩』這種『主動防止』的要求，優先考慮 VPC Service Controls（預防性），而不是 Flow Logs（偵測性）或 Private Google Access（連線路徑優化）。"}], "optionTable": [{"letter": "A", "analysis": "錯誤：Private Google Access 讓沒有外部 IP 的 VM，透過 Google 私有網路路徑（不經公開網際網路）存取 Google 的公開 API 服務，解決的是『連線路徑』問題，本身並不會限制或阻止資料被搬出受控邊界，跟『restricting exfiltration』的要求不對應。", "zh": "為 VPC 網路啟用 Private Google Access，讓 Vertex AI 服務可以不經過公開網際網路，直接存取 Google 的公開服務。"}, {"letter": "B", "analysis": "錯誤：VPC Flow Logs 只是把進出的網路流量記錄下來，方便事後查看/分析可疑行為，是偵測性（detective）控制，不會主動阻止資料真的被搬出去，不符合題目『restricting』（限制/防止）的要求。", "zh": "啟用 VPC Flow Logs，監控進出 Vertex AI 服務的網路流量，藉此識別可疑活動。"}, {"letter": "C", "analysis": "錯誤：Service Perimeter 的概念正確，但保護的 API 選錯了——ml.googleapis.com 是舊版 AI Platform（原 Cloud ML Engine）的 API，不是現行 Vertex AI 用的 API；document.googleapis.com 是 Document AI（文件解析/OCR）的 API，跟題目的 Vertex AI 用例無關，兩個都跟題目描述的環境不對應。", "zh": "建立一個服務邊界（service perimeter），並將 ml.googleapis.com 和 document.googleapis.com 納入受保護的服務。"}, {"letter": "D", "analysis": "正確：Service Perimeter 搭配正確的 API——aiplatform.googleapis.com 是 Vertex AI 現行的 API（涵蓋訓練、部署、預測），notebooks.googleapis.com 是 Vertex AI Workbench 的 API，兩個加起來正好對應題目說的『Vertex AI 和 Workbench 環境』，用預防性控制限制資料外洩，完全符合要求。", "zh": "建立一個服務邊界（service perimeter），並將 aiplatform.googleapis.com 和 notebooks.googleapis.com 納入受保護的服務。"}], "questionZh": "你的團隊打算用 Vertex AI 開發並部署機器學習模型，用於詐欺偵測、產品推薦、客戶流失預測等多種用例。你想要強化 Vertex AI 和 Workbench 環境的安全性，限制資料外洩（data exfiltration）。你該怎麼做？"}, "keywords": ["security posture of the Vertex AI and Workbench environment", "restricting data exfiltration"]}, {"id": "T1-Q236", "topic": 1, "qnum": 236, "question": "You have an application that uses Vertex AI Feature Store to manage and serve product features for real-time recommendations. You want to monitor the performance and health of the application. You need to understand the overall duration of a request. What should you do?", "options": [{"letter": "A", "text": "Observe the Request size in your featurestore."}, {"letter": "B", "text": "Monitor the Queries per second for your featurestore."}, {"letter": "C", "text": "Measure the Latency of your requests."}, {"letter": "D", "text": "Track the Online serving throughput of your requests."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383599-exam-professional-cloud-architect-topic-1-question-236/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Vertex AI/AI-ML", "監控與可觀測性", "效能調校"], "keywords": ["understand the overall duration of a request"], "explanation": {"questionZh": "你有一個應用程式，使用 Vertex AI Feature Store 來管理並提供產品特徵資料，供即時推薦使用。你想要監控這個應用程式的效能和健康狀況，需要了解一次請求的整體耗時。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：Request size 衡量的是一次請求傳送的資料量大小，關心的是『流量/資料量』，跟『耗時多久』無關。", "zh": "觀察 featurestore 的 Request size（請求大小）。"}, {"letter": "B", "analysis": "錯誤：Queries per second（QPS）衡量系統每秒能處理多少次請求，是流量/負載量指標，告訴你系統忙不忙，不是單一請求花了多久時間。", "zh": "監控 featurestore 的 Queries per second（每秒查詢數）。"}, {"letter": "C", "analysis": "正確：Latency 就是從送出請求到收到回應，中間經過的時間，正是題目問的『overall duration of a request（一次請求的整體耗時）』的標準說法，兩者是同一件事。", "zh": "測量你的請求的 Latency（延遲）。"}, {"letter": "D", "analysis": "錯誤：Online serving throughput 指系統單位時間內能完成的請求數量（跟 QPS 概念類似），是整體產能/流量指標，不是單一請求花多久時間。", "zh": "追蹤你的請求的 Online serving throughput（線上服務吞吐量）。"}], "notes": [{"heading": "題目在問什麼", "body": "有個應用程式用 Vertex AI Feature Store 管理並提供產品特徵資料，做即時推薦。要監控這個應用程式的效能和健康狀況，需要了解『一次請求的整體耗時』。"}, {"heading": "答案驗證：C", "body": "這題的核心是分辨 latency（單次請求耗時）vs throughput/QPS（整體流量/吞吐量）這兩類完全不同的效能指標——看到『一次請求的整體耗時 / duration of a request』這種字眼，直接對應 latency，不是流量相關的指標。信心很高，邏輯直接，不需額外查證。"}, {"heading": "服務介紹：Vertex AI Feature Store", "body": "是什麼：Vertex AI 裡的特徵（feature）管理服務。做機器學習時，模型預測需要輸入一堆特徵（例如使用者過去的購買紀錄、商品類別、瀏覽次數等），Feature Store 的角色是集中管理這些特徵資料，訓練模型時和實際上線做預測時都從同一個地方拿特徵，確保資料一致，而且能做到低延遲、即時查詢（online serving）。\n解決什麼問題：避免訓練用的特徵資料跟上線服務時用的特徵資料不一致（這正是 Q234 提到的 training-serving skew 的成因之一），同時提供毫秒等級的即時查詢能力。\n在這題的應用：題目的『即時推薦』場景就是透過 Feature Store 提供特徵資料，監控的重點是這個查詢過程的回應耗時（latency）。\n常見程度：MLOps / 即時推薦系統主題的常見核心服務。"}]}}, {"id": "T1-Q237", "topic": 1, "qnum": 237, "question": "A large healthcare provider's primary electronic health record (EHR) application runs on Compute Engine instances with a Cloud SQL for PostgreSQL database, all located in the us-west1 region. A new regulatory mandate requires you to implement and document a business continuity plan (BCP). This plan must ensure that the EHR application can be fully recovered and operational in a different geographical region with a recovery time objective (RTO) of two hours and a recovery point objective (RPO) of 15 minutes. You need to design a disaster recovery strategy that meets these strict BCP requirements. What should you do?", "options": [{"letter": "A", "text": "Deploy active managed instance groups (MIGs) in both us-west1 and us-east1, fronted by a global external HTTP(S) Load Balancer. For the database, use a cross-region read replica in us-east1, and rely on load balancer health checks to automatically fail over all traffic during an outage."}, {"letter": "B", "text": "Use Terraform to define the application’s compute infrastructure. During a disaster, configure the Cloud SQL database in us-west1 to use a cross-region read replica in us-east1, build the environment in us-east1, and promote the replica."}, {"letter": "C", "text": "Take daily snapshots of the Compute Engine disks and Cloud SQL database. Copy these snapshots to a Cloud Storage bucket in us-east1. During a disaster, manually restore the virtual machines (VMs) and database from the latest snapshots"}, {"letter": "D", "text": "Deploy a regional MIG in us-west1 for high availability, and rely on the Google Cloud SLA to ensure the region remains online."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383620-exam-professional-cloud-architect-topic-1-question-237/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud SQL", "Compute Engine", "高可用性/災難復原", "多區域架構"], "keywords": ["recovery time objective (RTO) of two hours", "recovery point objective (RPO) of 15 minutes"], "explanation": {"questionZh": "一家大型醫療機構主要的電子病歷（EHR）應用程式，跑在 Compute Engine 執行個體上，搭配 Cloud SQL for PostgreSQL 資料庫，全部都位於 us-west1 區域。新的法規要求你實作並記錄一份業務持續營運計畫（BCP）。這份計畫必須確保 EHR 應用程式能在不同地理區域完全復原並上線，復原時間目標（RTO）為兩小時，復原點目標（RPO）為 15 分鐘。你需要設計一套符合這些嚴格 BCP 要求的災難復原策略。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：在 us-west1 和 us-east1 兩個區域都預先部署好 active 的 MIG，前面掛全域外部 HTTP(S) 負載平衡器；資料庫用跨區域唯讀複本持續同步，災難發生時負載平衡器健康檢查自動把流量切到 us-east1。兩邊都已預先建好、持續運作，加上自動故障轉移，符合 2 小時 RTO；資料庫持續複製而非定期備份，遺失資料範圍可壓在分鐘等級，符合 15 分鐘 RPO。", "zh": "在 us-west1 和 us-east1 都部署 active 的受管理執行個體群組（MIG），前面掛一個全域外部 HTTP(S) 負載平衡器。資料庫方面，在 us-east1 使用跨區域唯讀複本，並依靠負載平衡器的健康檢查，在故障發生時自動將所有流量轉移。"}, {"letter": "B", "analysis": "錯誤：用 Terraform 定義基礎設施本身沒問題，但 us-east1 的環境是『災難發生當下才開始建』，不是預先建好、持續運作。臨時部署整套 VM 環境、再把資料庫複本升級成主庫，整個流程要在 2 小時內完成風險很高，比 A 的『兩邊都已在跑，只是切換流量』慢得多，難以穩定達成 RTO 要求。", "zh": "用 Terraform 定義應用程式的運算基礎設施。發生災難時，把 us-west1 的 Cloud SQL 資料庫設定為使用 us-east1 的跨區域唯讀複本，在 us-east1 建立環境，並將複本升級（promote）為主庫。"}, {"letter": "C", "analysis": "錯誤：每日快照的 RPO 最好只能到『前一天的快照』，最多可能遺失將近 24 小時的資料，遠超過題目要求的 15 分鐘，直接不合格；手動還原的速度也慢，可能連帶衝擊 2 小時 RTO。", "zh": "每天對 Compute Engine 磁碟和 Cloud SQL 資料庫做快照。把這些快照複製到 us-east1 的 Cloud Storage bucket。發生災難時，手動從最新的快照還原虛擬機（VM）和資料庫。"}, {"letter": "D", "analysis": "錯誤：只在 us-west1 用區域型 MIG 做高可用性，完全沒有部署到其他地理區域，只依賴 Google Cloud 的 SLA 保證區域不會掛掉。題目明確要求『能在不同地理區域恢復』，如果整個 us-west1 區域發生大規模故障，區域型 MIG 救不了，根本沒做到跨區域容災。", "zh": "在 us-west1 部署一個區域型 MIG 來達成高可用性，並依靠 Google Cloud 的 SLA 來確保該區域維持上線。"}], "notes": [{"heading": "題目在問什麼", "body": "大型醫療機構的 EHR 系統跑在 us-west1 的 Compute Engine + Cloud SQL for PostgreSQL 上。新法規要求做 BCP：萬一整個區域掛掉，系統必須能在不同地理區域完整恢復並上線，RTO=2 小時，RPO=15 分鐘。"}, {"heading": "答案驗證：A", "body": "A 是唯一一個『兩個區域都預先部署好、持續運作（active-active）+ 自動故障轉移 + 資料庫持續複製』的方案。B 的環境是災難當下才建，C 的 RPO 只能到前一天（遠超 15 分鐘），D 完全沒有跨區域部署。信心高，邏輯清楚。"}, {"heading": "什麼是 RTO 與 RPO", "body": "RTO（Recovery Time Objective，復原時間目標）：災難發生後，系統最多可以容忍多久的停機時間才能恢復上線，這題是 2 小時。\nRPO（Recovery Point Objective，復原點目標）：災難發生時，最多可以容忍遺失多少時間範圍內的資料，這題是 15 分鐘，意思是最壞情況下只能遺失災難發生前 15 分鐘內的資料。\n比喻：RTO 問『要多久才能重新開門營業』，RPO 問『帳本最多能缺幾分鐘沒記到』。RPO 愈短，代表愈需要頻繁、即時的資料備份/複製機制，定期快照/備份無法滿足分鐘等級的 RPO，必須用持續性複製。"}, {"heading": "什麼是 Managed Instance Group（MIG，受管理執行個體群組）", "body": "是什麼：一組可以自動擴縮、自動偵測並補上掛掉的 VM（自動修復/autohealing）的 Compute Engine VM 叢集，GCP 會依照你設定的範本自動管理這組 VM 的數量和健康狀態。\n解決什麼問題：避免手動管理一堆獨立 VM、手動擴容、手動重啟掛掉的機器。\n在這題的應用：A 選項在兩個區域各自跑一組 active 的 MIG，確保兩邊隨時都有健康的運算資源可以服務流量，是跨區域容災架構的基礎元件。\n常見程度：GCP 考試中『高可用性/自動擴縮』情境的核心服務，與 Regional MIG（同一區域內跨多個可用區部署，只提供區域內高可用性，不提供跨區域容災）要分清楚。"}, {"heading": "什麼是全域外部 HTTP(S) 負載平衡器（Global external HTTP(S) Load Balancer）", "body": "是什麼：GCP 的一種負載平衡器，可以在全球入口點接收流量，並依照後端健康狀況、地理位置等因素，自動把請求導到最合適、且健康的後端（例如不同區域的 MIG）。\n解決什麼問題：當某個區域的後端出問題時，不需要人工介入修改 DNS 或路由設定，負載平衡器本身的健康檢查機制就能自動把流量導向健康的區域。\n在這題的應用：A 選項靠這個負載平衡器的健康檢查，在 us-west1 故障時自動把流量切到 us-east1，是達成 2 小時 RTO 的關鍵（自動化故障轉移，不用等人工操作）。\n常見程度：多區域高可用架構的標準元件，常考『自動故障轉移』情境。"}, {"heading": "什麼是跨區域唯讀複本（Cross-region read replica）", "body": "是什麼：Cloud SQL 的一種資料庫複本，架設在跟主資料庫不同的區域，持續（近即時）同步主資料庫的資料變化，平常只能唯讀查詢，但在主資料庫掛掉時可以被『升級（promote）』成新的主資料庫。\n解決什麼問題：讓資料庫的資料也有跨區域的備援，而且是持續同步（不是定期備份），資料落後主庫的時間差可以壓在很短範圍內。\n在這題的應用：A 選項這個複本是預先建立好、持續在同步的，所以故障發生時只遺失极短時間的資料（符合 15 分鐘 RPO）；B 選項則是災難發生『當下才設定』複本，缺少這個持續同步的過程,無法穩定達成同樣的 RPO。\n常見程度：資料庫層級的跨區域容災標準做法，常與『定期快照』做對比（快照 RPO 以『備份間隔』為單位，通常是小時或天；持續複製的 RPO 可以到分鐘甚至秒級)。"}]}}, {"id": "T1-Q238", "topic": 1, "qnum": 238, "question": "A financial services company is decommissioning one of its on-premises data centers. As part of this initiative, the company needs to perform a one-time migration of 500 ТВ of historical transaction archives to a Cloud Storage bucket for long-term retention. The data center’s internet egress is 1 Gbps, which is shared with critical business operations. You must complete the secure data transfer within a 60-day window to meet the decommissioning deadline. What should you do?", "options": [{"letter": "A", "text": "Provision a Partner Interconnect connection with a 10 Gbps capacity to accelerate the data transfer, and then use Storage Transfer Service."}, {"letter": "B", "text": "Write a script that uses the gcloud storage cp --parallel command to upload the data in chunks over the public internet during off-peak hours."}, {"letter": "C", "text": "Use Storage Transfer Service to create an agent-based transfer job that moves the data from the on-premises file servers directly to the Cloud Storage bucket."}, {"letter": "D", "text": "Order a Transfer Appliance, copy the data to the appliance using your high-speed local network, and ship it back to Google to upload the data into your Cloud Storage bucket."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383632-exam-professional-cloud-architect-topic-1-question-238/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Storage", "資料遷移"], "keywords": ["internet egress is 1 Gbps, which is shared with critical business operations", "secure data transfer within a 60-day window"], "explanation": {"questionZh": "一家金融服務公司正在關閉其中一個地端資料中心。作為這項計畫的一部分，公司需要將 500 TB 的歷史交易歸檔資料一次性遷移到一個 Cloud Storage bucket，以長期保存。這個資料中心的網際網路出口頻寬是 1 Gbps，而且跟關鍵業務營運共用這條線路。你必須在 60 天的時間窗口內完成安全的資料傳輸，以符合關閉資料中心的最後期限。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "錯誤：申請、審核、實際佈線 Partner Interconnect 通常要花數週到數月才能生效，不一定趕得上 60 天的截止日；為了一次性的遷移去申請一條長期合約性質的專線，成本效益也很差——專線通常適合長期、持續性的大流量需求，不是一次性任務。", "zh": "佈建一條 10 Gbps 容量的 Partner Interconnect 連線來加速資料傳輸，接著使用 Storage Transfer Service。"}, {"letter": "B", "analysis": "錯誤：無論是否平行上傳、選在離峰時段，本質上還是走同一條被限制、被共用的 1 Gbps 對外線路。500 TB 用 1 Gbps 全速不間斷跑也要約 46 天，而這條線路不可能被遷移工作完全吃滿（要跟關鍵業務共用），實際完成時間遠超過 60 天，而且會跟關鍵業務搶頻寬，風險高。", "zh": "寫一個腳本，使用 gcloud storage cp --parallel 指令，在離峰時段透過公開網際網路分批上傳資料。"}, {"letter": "C", "analysis": "錯誤：Storage Transfer Service 的 agent-based 傳輸工作，雖然是用代理程式從地端伺服器搬資料到 Cloud Storage，但底層資料依然要透過網路傳輸送出去，沒有解決頻寬瓶頸的根本問題，一樣受限於那條 1 Gbps 線路。", "zh": "使用 Storage Transfer Service 建立一個 agent-based（代理程式式）的傳輸工作，直接把資料從地端檔案伺服器搬到 Cloud Storage bucket。"}, {"letter": "D", "analysis": "正確：訂購 Transfer Appliance（實體硬體裝置），用機房內部的高速區域網路把資料拷貝進去，完全繞過被共用、頻寬有限的對外網路，再把裝置寄回 Google 由其直接上傳進 Cloud Storage bucket。不受 1 Gbps 瓶頸限制，正是 Google 官方建議用於『一次性、資料量極大、現有網路頻寬不足』情境的標準做法。", "zh": "訂購一台 Transfer Appliance，用你的高速區域網路把資料拷貝到這台裝置上，再把它寄回給 Google，由 Google 把資料上傳進你的 Cloud Storage bucket。"}], "notes": [{"heading": "題目在問什麼", "body": "金融服務公司要關閉地端資料中心，需要把 500 TB 歷史交易歸檔資料一次性遷移到 Cloud Storage。資料中心網際網路出口頻寬只有 1 Gbps，且跟關鍵業務共用，必須在 60 天內安全完成遷移。"}, {"heading": "答案驗證：D", "body": "500 TB ≈ 4,000,000 Gb，用 1 Gbps 24 小時不間斷滿速跑，理論上也要約 46 天才能傳完；但線路要跟關鍵業務共用，不可能整天吃滿頻寬搬資料，實際可用速度一定更低，加上協定開銷、不穩定性，60 天內透過這條網路線完成並不切實際。Transfer Appliance 完全繞過受限的對外網路，靠內部高速網路+實體運送完成搬遷，是 Google 官方建議用於『一次性、資料量極大、現有網路頻寬不足』的標準場景。信心高，數學算式清楚支持此結論。"}, {"heading": "服務介紹：Transfer Appliance", "body": "是什麼：Google 提供的一種實體硬體裝置，Google 把它寄到你的機房，你用機房內部的高速區域網路把資料拷貝進這台裝置，裝滿後寄回去給 Google，由 Google 在資料中心端直接把資料上傳進你的 Cloud Storage bucket。\n解決什麼問題：當現有對外網路頻寬不足以在時限內完成超大量資料（TB~PB 級）的一次性搬遷時，完全繞過網路傳輸的瓶頸，靠『實體運送』取代『網路傳輸』。\n在這題的應用：500 TB 在 1 Gbps 共用線路上根本傳不完，Transfer Appliance 讓資料搬移靠內部高速網路（遠高於 1 Gbps）完成，不占用對外頻寬，也不影響關鍵業務。\n常見程度：GCP 考試中『資料量極大 + 網路頻寬受限 + 一次性遷移』情境的經典標準答案。"}, {"heading": "服務介紹：Partner Interconnect", "body": "是什麼：一種透過合作網路服務商，把你的地端網路跟 Google Cloud 直接用專線連接的服務，不經過公開網際網路，延遲低、頻寬穩定。\n解決什麼問題：適合長期、持續性、大流量的雲端-地端混合架構需求（例如長期跨雲資料同步、持續性的流量）。\n在這題的應用：申請、審核、實際佈線通常要花數週到數月才能生效，不一定趕得上 60 天截止日；而且為了一次性遷移去簽一條長期合約性質的專線，成本效益差，不符合題目『一次性』的任務性質。\n常見程度：常跟 Cloud VPN、Transfer Appliance 放在一起考，重點是分辨『長期持續需求』vs『一次性任務』該選哪種連接/搬遷方式。"}, {"heading": "服務介紹：Storage Transfer Service", "body": "是什麼：GCP 的資料搬遷服務，可以把資料從其他雲端（AWS S3 等）、地端檔案伺服器（透過安裝 agent 代理程式），或 HTTP/HTTPS 來源，搬到 Cloud Storage，並且可以排程、自動重試。\n解決什麼問題：省去自己寫腳本處理大量檔案搬遷、重試失敗、排程等麻煩。\n在這題的應用：無論是否搭配 Storage Transfer Service，只要走網路傳輸，就還是受限於那條 1 Gbps 共用線路，沒有解決頻寬瓶頸本身，所以這題的重點不在搬遷工具本身好不好用，而在於有沒有繞開網路頻寬限制。\n常見程度：常見的雲端資料搬遷服務，但遇到『網路頻寬明顯不足以在時限內傳完』的情境時，要優先想到 Transfer Appliance 而不是單純換個搬遷工具。"}]}}, {"id": "T1-Q239", "topic": 1, "qnum": 239, "question": "Your company wants to optimize Google Cloud costs for their development and staging environments. These environments are workstations used by developers Monday through Friday, 9:00 AM to 6:00 PM local time. Currently, the environments run on a fleet of nl-standard-4 Compute Engine instances that operate 24/7, leading to a high monthly cost for resources that are idle more than 70% of the time. You need to implement a solution that significantly reduces the monthly cost of these non-production environments without impacting the development team's productivity during work hours. What should you do?", "options": [{"letter": "A", "text": "Schedule the virtual machines to start and stop to match your team’s work schedule."}, {"letter": "B", "text": "Purchase three-year committed use discounts (CUDs) for the existing nl-standard-4 instances."}, {"letter": "C", "text": "Upgrade all instances to the N2 machine series."}, {"letter": "D", "text": "Re-architect the environments to run on a regional managed instance group (MIG) with autoscaling enabled."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383608-exam-professional-cloud-architect-topic-1-question-239/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "成本優化"], "keywords": ["operate 24/7, leading to a high monthly cost for resources that are idle more than 70% of the time", "without impacting the development team's productivity during work hours"], "explanation": {"questionZh": "你的公司想針對開發和測試環境優化 Google Cloud 的成本。這些環境是開發人員在週一到週五、當地時間早上 9 點到晚上 6 點使用的工作站。目前這些環境跑在一批全年無休 24/7 運作的 n1-standard-4 Compute Engine 執行個體上，導致每月成本很高，因為超過 70% 的時間這些資源都是閒置的。你需要實作一個解決方案，在不影響開發團隊工作時段生產力的前提下，大幅降低這些非正式環境的每月成本。你該怎麼做？", "optionTable": [{"letter": "A", "analysis": "正確：既然使用模式固定在週一到週五的上班時間，最直接有效的做法就是設定排程，下班後自動關機、上班前自動開機。Compute Engine 按實際運作時間計費，關機狀態下運算費用就是 0，完全對應『閒置 70% 時間還在付費』的痛點，上班時段機器照常開著，不影響生產力。", "zh": "排程虛擬機的啟動和關閉時間，配合你的團隊的工作時間表。"}, {"letter": "B", "analysis": "錯誤：CUD 的前提是本來就要一直跑，用承諾長期持續使用換取折扣單價，但這題的問題是機器大部分時間根本不需要跑。就算用 CUD 打折，還是對著閒置 70% 的時間持續付費，只是單價變便宜一點，沒有解決『不需要的時候還在付費』這個核心浪費。", "zh": "為現有的 n1-standard-4 執行個體購買三年期承諾使用折扣（CUD）。"}, {"letter": "C", "analysis": "錯誤：N1、N2 都是 Compute Engine 的通用型機器系列，差別在 CPU 世代、效能、每小時單價略有不同，升級機型可能讓單位效能的費用稍微好一點，但完全沒解決『24/7 開著卻大部分時間沒人用』的問題，機器還是閒置著在燒錢。", "zh": "把所有執行個體升級到 N2 機器系列。"}, {"letter": "D", "analysis": "錯誤：自動擴縮的設計邏輯是根據負載高低（例如 CPU 使用率、流量大小）動態增減機器數量，適合需求量忽大忽小的生產環境。但這題的使用模式是固定的時間表（週一到週五上班時間），不是負載忽高忽低，用自動擴縮解決『照表操課』的問題是用錯工具、徒增複雜度，而且開發用工作站通常是每人固定一台，改成 MIG 架構本身也不太合理。", "zh": "重新架構這些環境，改成跑在啟用自動擴縮的區域型受管理執行個體群組（MIG）上。"}], "notes": [{"heading": "題目在問什麼", "body": "公司想優化開發/測試環境的 GCP 成本。這些環境是給開發人員週一到週五 9:00-18:00（當地時間）使用的工作站，目前用一批 n1-standard-4 Compute Engine 執行個體全年無休 24/7 運作，閒置超過 70% 的時間仍在付費。要在不影響工作時段生產力的前提下，大幅降低每月成本。"}, {"heading": "答案驗證：A", "body": "看到『使用時間有固定規律（例如上班時間）+ 其餘時間完全閒置』，優先考慮排程自動啟停（Instance Schedule）；看到『負載量會忽高忽低、不規律』才考慮 autoscaling；CUD 只在『本來就要長期持續運作』的情境下才划算。信心高，邏輯清楚。"}, {"heading": "什麼是 Instance Schedule（執行個體排程）", "body": "是什麼：Compute Engine 的一項功能，可以設定固定的時間表，自動在指定時間啟動或關閉 VM（例如每天早上 9 點自動開機、晚上 6 點自動關機，週末整天不開）。\n解決什麼問題：對於使用模式有固定規律（像上班時間）的工作負載，省去手動每天開關機的麻煩，並確保非使用時段不會白白付費。\n在這題的應用：直接對應題目的使用模式（週一到週五固定上班時間），關機時段完全不計算運算費用，是這題成本優化最直接、最匹配使用模式的解法。\n常見程度：GCP 考試中『開發/測試環境成本優化』情境幾乎必考的標準正解，常跟 CUD、機型升級、autoscaling 放在一起當誤答選項做對比。"}, {"heading": "什麼是 Committed Use Discounts（CUD，承諾使用折扣）", "body": "是什麼：你向 Google 承諾在未來一段固定期間（通常 1 年或 3 年）持續使用一定量的運算資源，以換取比隨用隨付（on-demand）更低的單價。\n解決什麼問題：適合『用量穩定、長期持續運作』的工作負載，用承諾換取價格優惠。\n在這題的應用：這題的機器大部分時間是閒置的，CUD 解決的是『單價』問題，不是『不需要時還在跑』的浪費問題，兩者是不同層次的成本優化手段——CUD 省的是『跑的時候便宜一點』，Instance Schedule 省的是『不跑的時候完全不付費』。\n常見程度：常見的雲端成本優化工具，但要分清楚它只對『持續性穩定用量』有效，面對『間歇性使用模式』時不是正解。"}]}}, {"id": "T1-Q240", "topic": 1, "qnum": 240, "question": "A retail company s most critical application is its online payment processing system. The business has a requirement that the system must be able to survive a complete zonal outage while minimizing cost. You need a design solution that can handle a zonal failure. What should you do?", "options": [{"letter": "A", "text": "Deploy the application in an active-active configuration using managed instance groups (MIGs) in two different regions, fronted by a global external HTTP(S) Load Balancer and backed by a multi-regional database like Spanner."}, {"letter": "B", "text": "Deploy the application on a regional MIG to provide high availability across multiple zones in the primary region."}, {"letter": "C", "text": "Configure the regional MIG to use only Spot VMs to aggressively minimize operational costs while maintaining high availability."}, {"letter": "D", "text": "Deploy the application on Compute Engine instances across multiple regions, and rely on daily snapshots for recovery to achieve the lowest possible cost."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383603-exam-professional-cloud-architect-topic-1-question-240/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "高可用性/災難復原", "成本優化"]}, {"id": "T1-Q241", "topic": 1, "qnum": 241, "question": "Your company is a global financial services provider that processes and analyzes a high volume of credit card transactions in real time for fraud detection. Your analytics team must run complex batch queries on the same transaction data for daily reporting. You need to design a data processing solution that can handle both real-time and batch processing of the transaction data while minimizing operational overhead and infrastructure management. What should you do?", "options": [{"letter": "A", "text": "Use Dataprep to ingest the transactions."}, {"letter": "B", "text": "Use Dataflow to process the streaming data."}, {"letter": "C", "text": "Use a Dataproc cluster for both the streaming and batch workloads."}, {"letter": "D", "text": "Use BigQuery for the batch analytics reports."}, {"letter": "E", "text": "Use Firestore to store and analyze the transaction data."}], "answer": "BD", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383622-exam-professional-cloud-architect-topic-1-question-241/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Dataflow/Dataproc", "BigQuery", "效能調校"]}, {"id": "T1-Q242", "topic": 1, "qnum": 242, "question": "Your company uses a custom-built application running on a Compute Engine virtual machine (VM). This application processes real-time sales data and writes it to a zonal Persistent Disk. A recent internal audit requires that you implement a backup and recovery plan to protect against zonal failures. Your company has a strict policy that all backup data must be retained for at least 90 days and stored in a separate project with limited access. You need to implement a fully automated backup solution that meets these requirements with minimal operational overhead. What should you do?", "options": [{"letter": "A", "text": "Write a script to create daily backups of the Persistent Disk. Copy the backups to a different zone and apply a label to each snapshot to indicate the deletion date."}, {"letter": "B", "text": "Use gcloud commands to create snapshots of the Persistent Disk. Store the snapshots in a regional Cloud Storage bucket and configure a lifecycle rule to delete objects older than 90 days."}, {"letter": "C", "text": "Create a snapshot schedule to automatically create Persistent Disk snapshots and use a script to move and store them in a multi-regional Cloud Storage bucket."}, {"letter": "D", "text": "Use the Backup and Disaster Recovery (DR) service to create a backup plan. Configure the backup plan to take daily snapshots and store them in a backup vault with a 90-day retention policy."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383611-exam-professional-cloud-architect-topic-1-question-242/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "高可用性/災難復原", "合規性"]}, {"id": "T1-Q243", "topic": 1, "qnum": 243, "question": "Your ecommerce web application includes many products with pictures and videos. You need to improve the application's page load speed and reduce the latency for customer requests. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Deploy your application to Cloud Run and enable concurrency."}, {"letter": "B", "text": "Use Memorystore tor Redis."}, {"letter": "C", "text": "Implement CDN with the application's external HTTPS load balancer."}, {"letter": "D", "text": "Change the database from Bigtable to Spanner."}, {"letter": "E", "text": "Deploy your application to a GKE Autopilot cluster instead of a regular GKE cluster."}], "answer": "BC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383619-exam-professional-cloud-architect-topic-1-question-243/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Load Balancing", "Cloud CDN", "效能調校"]}, {"id": "T1-Q244", "topic": 1, "qnum": 244, "question": "You need to build and deploy a containerized web application to Google Cloud. The application is very write-heavy and requires a relational database as its data store. The application needs to be highly available in multiple cloud regions. You want to minimize operational overhead while following Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Deploy the application to GKE clusters in multiple regions and expose the application endpoint with a regional load balancer. Use Cloud SQL as the database."}, {"letter": "B", "text": "Deploy the application to Cloud Run in multiple regions behind a global HTTPS load balancer. Use Spanner as the database."}, {"letter": "C", "text": "Deploy the application to a GKE standard cluster behind a global HTTPS load balancer. Use Firestore as the database with multi-region locations enabled."}, {"letter": "D", "text": "Deploy the application to a GKE standard cluster with a global ingress to expose the application endpoint. Use Bigtable as the database."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383607-exam-professional-cloud-architect-topic-1-question-244/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Run/Cloud Functions", "Cloud Spanner", "高可用性/災難復原", "多區域架構"]}, {"id": "T1-Q245", "topic": 1, "qnum": 245, "question": "Your machine learning (ML) engineers use self-hosted Jupyter notebooks for tasks such as data preparation, model training, and fine-tuning. The operations team then deploys these models in various environments. You want to provide maximum flexibility for ML engineers, promote collaboration with a common toolset, and leverage Google Cloud's scalability, while following Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Use AutoML for machine learning and Cloud Deploy for model deployment."}, {"letter": "B", "text": "Use Colab Enterprise for machine learning and DevOps for model deployment."}, {"letter": "C", "text": "Use Vertex AI for machine learning and machine learning operations (MLOps) for model deployment."}, {"letter": "D", "text": "Use TensorFlow for machine learning and Cloud Deploy for model deployment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383623-exam-professional-cloud-architect-topic-1-question-245/", "postedDate": "2026-02-12", "postedYear": 202
