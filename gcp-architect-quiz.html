D", "text": "Create a new Kubernetes Engine cluster with the following command: gcloud alpha container clusters create mycluster - -enable- autoscaling - -min-nodes=1 - -max-nodes=10 and redeploy your application"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7073-exam-professional-cloud-architect-topic-1-question-167/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["GKE/Kubernetes", "自動擴縮"]}, {"id": "T1-Q168", "topic": 1, "qnum": 168, "question": "Your marketing department wants to send out a promotional email campaign. The development team wants to minimize direct operation management. They project a wide range of possible customer responses, from 100 to 500,000 click-through per day. The link leads to a simple website that explains the promotion and collects user information and preferences.Which infrastructure should you recommend? (Choose two.)", "options": [{"letter": "A", "text": "Use Google App Engine to serve the website and Google Cloud Datastore to store user data."}, {"letter": "B", "text": "Use a Google Container Engine cluster to serve the website and store data to persistent disk."}, {"letter": "C", "text": "Use a managed instance group to serve the website and Google Cloud Bigtable to store user data."}, {"letter": "D", "text": "Use a single Compute Engine virtual machine (VM) to host a web server, backend by Google Cloud SQL."}], "answer": "AC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54373-exam-professional-cloud-architect-topic-1-question-168/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["App Engine", "Bigtable", "自動擴縮", "無伺服器"]}, {"id": "T1-Q169", "topic": 1, "qnum": 169, "question": "Your company just finished a rapid lift and shift to Google Compute Engine for your compute needs. You have another 9 months to design and deploy a more cloud-native solution. Specifically, you want a system that is no-ops and auto-scaling.Which two compute products should you choose? (Choose two.)", "options": [{"letter": "A", "text": "Compute Engine with containers"}, {"letter": "B", "text": "Google Kubernetes Engine with containers"}, {"letter": "C", "text": "Google App Engine Standard Environment"}, {"letter": "D", "text": "Compute Engine with custom instance types"}, {"letter": "E", "text": "Compute Engine with managed instance groups"}], "answer": "BC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54374-exam-professional-cloud-architect-topic-1-question-169/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["GKE/Kubernetes", "App Engine", "自動擴縮", "無伺服器"]}, {"id": "T1-Q170", "topic": 1, "qnum": 170, "question": "One of your primary business objectives is being able to trust the data stored in your application. You want to log all changes to the application data.How can you design your logging system to verify authenticity of your logs?", "options": [{"letter": "A", "text": "Write the log concurrently in the cloud and on premises"}, {"letter": "B", "text": "Use a SQL database and limit who can modify the log table"}, {"letter": "C", "text": "Digitally sign each timestamp and log entry and store the signature"}, {"letter": "D", "text": "Create a JSON dump of each log entry and store it in Google Cloud Storage"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7082-exam-professional-cloud-architect-topic-1-question-170/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["Cloud KMS/加密", "安全性"]}, {"id": "T1-Q171", "topic": 1, "qnum": 171, "question": "Your company has a Google Workspace account and Google Cloud Organization. Some developers in the company have created Google Cloud projects outside of the Google Cloud Organization.You want to create an Organization structure that allows developers to create projects, but prevents them from modifying production projects. You want to manage policies for all projects centrally and be able to set more restrictive policies for production projects.You want to minimize disruption to users and developers when business needs change in the future. You want to follow Google-recommended practices. Now should you design the Organization structure?", "options": [{"letter": "A", "text": "1. Create a second Google Workspace account and Organization. 2. Grant all developers the Project Creator IAM role on the new Organization. 3. Move the developer projects into the new Organization. 4. Set the policies for all projects on both Organizations. 5. Additionally, set the production policies on the original Organization."}, {"letter": "B", "text": "1. Create a folder under the Organization resource named ג€Production.ג€ 2. Grant all developers the Project Creator IAM role on the new Organization. 3. Move the developer projects into the new Organization. 4. Set the policies for all projects on the Organization. 5. Additionally, set the production policies on the ג€Productionג€ folder."}, {"letter": "C", "text": "1. Create folders under the Organization resource named ג€Developmentג€ and ג€Production.ג€ 2. Grant all developers the Project Creator IAM role on the ג€Developmentג€ folder. 3. Move the developer projects into the ג€Developmentג€ folder. 4. Set the policies for all projects on the Organization. 5. Additionally, set the production policies on the ג€Productionג€ folder."}, {"letter": "D", "text": "1. Designate the Organization for production projects only. 2. Ensure that developers do not have the Project Creator IAM role on the Organization. 3. Create development projects outside of the Organization using the developer Google Workspace accounts. 4. Set the policies for all projects on the Organization. 5. Additionally, set the production policies on the individual production projects."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68682-exam-professional-cloud-architect-topic-1-question-171/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Organization Policy", "IAM"]}, {"id": "T1-Q172", "topic": 1, "qnum": 172, "question": "Your company has an application running on Compute Engine that allows users to play their favorite music. There are a fixed number of instances. Files are stored in Cloud Storage, and data is streamed directly to users. Users are reporting that they sometimes need to attempt to play popular songs multiple times before they are successful. You need to improve the performance of the application. What should you do?", "options": [{"letter": "A", "text": "1. Mount the Cloud Storage bucket using gcsfuse on all backend Compute Engine instances. 2. Serve music files directly from the backend Compute Engine instance."}, {"letter": "B", "text": "1. Create a Cloud Filestore NFS volume and attach it to the backend Compute Engine instances. 2. Download popular songs in Cloud Filestore. 3. Serve music files directly from the backend Compute Engine instance."}, {"letter": "C", "text": "1. Copy popular songs into CloudSQL as a blob. 2. Update application code to retrieve data from CloudSQL when Cloud Storage is overloaded."}, {"letter": "D", "text": "1. Create a managed instance group with Compute Engine instances. 2. Create a global load balancer and configure it with two backends: ג—‹ Managed instance group ג—‹ Cloud Storage bucket 3. Enable Cloud CDN on the bucket backend."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68683-exam-professional-cloud-architect-topic-1-question-172/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Load Balancing", "效能調校", "Cloud CDN"]}, {"id": "T1-Q173", "topic": 1, "qnum": 173, "question": "The operations team in your company wants to save Cloud VPN log events for one year. You need to configure the cloud infrastructure to save the logs. What should you do?", "options": [{"letter": "A", "text": "Set up a filter in Cloud Logging and a Cloud Storage bucket as an export target for the logs you want to save."}, {"letter": "B", "text": "Enable the Compute Engine API, and then enable logging on the firewall rules that match the traffic you want to save."}, {"letter": "C", "text": "Set up a Cloud Logging Dashboard titled Cloud VPN Logs, and then add a chart that queries for the VPN metrics over a one-year time period."}, {"letter": "D", "text": "Set up a filter in Cloud Logging and a topic in Pub/Sub to publish the logs."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68684-exam-professional-cloud-architect-topic-1-question-173/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Interconnect/VPN", "Cloud Monitoring/Logging", "合規性"]}, {"id": "T1-Q174", "topic": 1, "qnum": 174, "question": "You are working with a data warehousing team that performs data analysis. The team needs to process data from external partners, but the data contains personally identifiable information (PII). You need to process and store the data without storing any of the PIIE data. What should you do?", "options": [{"letter": "A", "text": "Create a Dataflow pipeline to retrieve the data from the external sources. As part of the pipeline, use the Cloud Data Loss Prevention (Cloud DLP) API to remove any PII data. Store the result in BigQuery."}, {"letter": "B", "text": "Create a Dataflow pipeline to retrieve the data from the external sources. As part of the pipeline, store all non-PII data in BigQuery and store all PII data in a Cloud Storage bucket that has a retention policy set."}, {"letter": "C", "text": "Ask the external partners to upload all data on Cloud Storage. Configure Bucket Lock for the bucket. Create a Dataflow pipeline to read the data from the bucket. As part of the pipeline, use the Cloud Data Loss Prevention (Cloud DLP) API to remove any PII data. Store the result in BigQuery."}, {"letter": "D", "text": "Ask the external partners to import all data in your BigQuery dataset. Create a dataflow pipeline to copy the data into a new table. As part of the Dataflow bucket, skip all data in columns that have PII data"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68685-exam-professional-cloud-architect-topic-1-question-174/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Dataflow/Dataproc", "Sensitive Data Protection(DLP)", "BigQuery", "安全性"]}, {"id": "T1-Q175", "topic": 1, "qnum": 175, "question": "You want to allow your operations team to store logs from all the production projects in your Organization, without including logs from other projects. All of the production projects are contained in a folder. You want to ensure that all logs for existing and new production projects are captured automatically. What should you do?", "options": [{"letter": "A", "text": "Create an aggregated export on the Production folder. Set the log sink to be a Cloud Storage bucket in an operations project."}, {"letter": "B", "text": "Create an aggregated export on the Organization resource. Set the log sink to be a Cloud Storage bucket in an operations project."}, {"letter": "C", "text": "Create log exports in the production projects. Set the log sinks to be a Cloud Storage bucket in an operations project."}, {"letter": "D", "text": "Create log exports in the production projects. Set the log sinks to be BigQuery datasets in the production projects, and grant IAM access to the operations team to run queries on the datasets."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68686-exam-professional-cloud-architect-topic-1-question-175/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "Organization Policy"]}, {"id": "T1-Q176", "topic": 1, "qnum": 176, "question": "Your company has an application that is running on multiple instances of Compute Engine. It generates 1 TB per day of logs. For compliance reasons, the logs need to be kept for at least two years. The logs need to be available for active query for 30 days. After that, they just need to be retained for audit purposes. You want to implement a storage solution that is compliant, minimizes costs, and follows Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "1. Install a Cloud Logging agent on all instances. 2. Create a sink to export logs into a regional Cloud Storage bucket. 3. Create an Object Lifecycle rule to move files into a Coldline Cloud Storage bucket after one month. 4. Configure a retention policy at the bucket level using bucket lock."}, {"letter": "B", "text": "1. Write a daily cron job, running on all instances, that uploads logs into a Cloud Storage bucket. 2. Create a sink to export logs into a regional Cloud Storage bucket. 3. Create an Object Lifecycle rule to move files into a Coldline Cloud Storage bucket after one month."}, {"letter": "C", "text": "1. Install a Cloud Logging agent on all instances. 2. Create a sink to export logs into a partitioned BigQuery table. 3. Set a time_partitioning_expiration of 30 days."}, {"letter": "D", "text": "1. Create a daily cron job, running on all instances, that uploads logs into a partitioned BigQuery table. 2. Set a time_partitioning_expiration of 30 days."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68688-exam-professional-cloud-architect-topic-1-question-176/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Cloud Storage", "Cloud Monitoring/Logging", "合規性", "成本優化"]}, {"id": "T1-Q177", "topic": 1, "qnum": 177, "question": "Your company has just recently activated Cloud Identity to manage users. The Google Cloud Organization has been configured as well. The security team needs to secure projects that will be part of the Organization. They want to prohibit IAM users outside the domain from gaining permissions from now on. What should they do?", "options": [{"letter": "A", "text": "Configure an organization policy to restrict identities by domain."}, {"letter": "B", "text": "Configure an organization policy to block creation of service accounts."}, {"letter": "C", "text": "Configure Cloud Scheduler to trigger a Cloud Function every hour that removes all users that don't belong to the Cloud Identity domain from all projects."}, {"letter": "D", "text": "Create a technical user (e.g., [email protected]), and give it the project owner role at root organization level. Write a bash script that: ג€¢ Lists all the IAM rules of all projects within the organization. ג€¢ Deletes all users that do not belong to the company domain. Create a Compute Engine instance in a project within the Organization and configure gcloud to be executed with technical user credentials. Configure a cron job that executes the bash script every hour."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68690-exam-professional-cloud-architect-topic-1-question-177/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Organization Policy", "IAM", "安全性"]}, {"id": "T1-Q178", "topic": 1, "qnum": 178, "question": "Your company has an application running on Google Cloud that is collecting data from thousands of physical devices that are globally distributed. Data is published to Pub/Sub and streamed in real time into an SSD Cloud Bigtable cluster via a Dataflow pipeline. The operations team informs you that your CloudBigtable cluster has a hotspot, and queries are taking longer than expected. You need to resolve the problem and prevent it from happening in the future. What should you do?", "options": [{"letter": "A", "text": "Advise your clients to use HBase APIs instead of NodeJS APIs."}, {"letter": "B", "text": "Delete records older than 30 days."}, {"letter": "C", "text": "Review your RowKey strategy and ensure that keys are evenly spread across the alphabet."}, {"letter": "D", "text": "Double the number of nodes you currently have."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68691-exam-professional-cloud-architect-topic-1-question-178/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Bigtable", "效能調校", "資料庫Schema設計"]}, {"id": "T1-Q179", "topic": 1, "qnum": 179, "question": "Your company has a Google Cloud project that uses BigQuery for data warehousing. There are some tables that contain personally identifiable information (PII).Only the compliance team may access the PII. The other information in the tables must be available to the data science team. You want to minimize cost and the time it takes to assign appropriate access to the tables. What should you do?", "options": [{"letter": "A", "text": "1. From the dataset where you have the source data, create views of tables that you want to share, excluding PII. 2. Assign an appropriate project-level IAM role to the members of the data science team. 3. Assign access controls to the dataset that contains the view."}, {"letter": "B", "text": "1. From the dataset where you have the source data, create materialized views of tables that you want to share, excluding PII. 2. Assign an appropriate project-level IAM role to the members of the data science team. 3. Assign access controls to the dataset that contains the view."}, {"letter": "C", "text": "1. Create a dataset for the data science team. 2. Create views of tables that you want to share, excluding PII. 3. Assign an appropriate project-level IAM role to the members of the data science team. 4. Assign access controls to the dataset that contains the view. 5. Authorize the view to access the source dataset."}, {"letter": "D", "text": "1. Create a dataset for the data science team. 2. Create materialized views of tables that you want to share, excluding PII. 3. Assign an appropriate project-level IAM role to the members of the data science team. 4. Assign access controls to the dataset that contains the view. 5. Authorize the view to access the source dataset."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68692-exam-professional-cloud-architect-topic-1-question-179/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["BigQuery", "IAM", "安全性"]}, {"id": "T1-Q180", "topic": 1, "qnum": 180, "question": "Your operations team currently stores 10 TB of data in an object storage service from a third-party provider. They want to move this data to a Cloud Storage bucket as quickly as possible, following Google-recommended practices. They want to minimize the cost of this data migration. Which approach should they use?", "options": [{"letter": "A", "text": "Use the gsutil mv command to move the data."}, {"letter": "B", "text": "Use the Storage Transfer Service to move the data."}, {"letter": "C", "text": "Download the data to a Transfer Appliance, and ship it to Google."}, {"letter": "D", "text": "Download the data to the on-premises data center, and upload it to the Cloud Storage bucket."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/68693-exam-professional-cloud-architect-topic-1-question-180/", "postedDate": "2021-12-28", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移", "成本優化"]}, {"id": "T1-Q181", "topic": 1, "qnum": 181, "question": "You have a Compute Engine managed instance group that adds and removes Compute Engine instances from the group in response to the load on your application. The instances have a shutdown script that removes REDIS database entries associated with the instance. You see that many database entries have not been removed, and you suspect that the shutdown script is the problem. You need to ensure that the commands in the shutdown script are run reliably every time an instance is shut down. You create a Cloud Function to remove the database entries. What should you do next?", "options": [{"letter": "A", "text": "Modify the shutdown script to wait for 30 seconds before triggering the Cloud Function."}, {"letter": "B", "text": "Do not use the Cloud Function. Modify the shutdown script to restart if it has not completed in 30 seconds."}, {"letter": "C", "text": "Set up a Cloud Monitoring sink that triggers the Cloud Function after an instance removal log message arrives in Cloud Logging."}, {"letter": "D", "text": "Modify the shutdown script to wait for 30 seconds and then publish a message to a Pub/Sub queue."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80034-exam-professional-cloud-architect-topic-1-question-181/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["Pub/Sub", "Compute Engine", "高可用性/災難復原"]}, {"id": "T1-Q182", "topic": 1, "qnum": 182, "question": "You are managing several projects on Google Cloud and need to interact on a daily basis with BigQuery, Bigtable, and Kubernetes Engine using the gcloud CL tool. You are travelling a lot and work on different workstations during the week. You want to avoid having to manage the gcloud CLI manually. What should you do?", "options": [{"letter": "A", "text": "Use Google Cloud Shell in the Google Cloud Console to interact with Google Cloud."}, {"letter": "B", "text": "Create a Compute Engine instance and install gcloud on the instance. Connect to this instance via SSH to always use the same gcloud installation when interacting with Google Cloud."}, {"letter": "C", "text": "Install gcloud on all of your workstations. Run the command gcloud components auto-update on each workstation"}, {"letter": "D", "text": "Use a package manager to install gcloud on your workstations instead of installing it manually."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80035-exam-professional-cloud-architect-topic-1-question-182/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["CI/CD"]}, {"id": "T1-Q183", "topic": 1, "qnum": 183, "question": "Your company recently acquired a company that has infrastructure in Google Cloud. Each company has its own Google Cloud organization. Each company is using a Shared Virtual Private Cloud (VPC) to provide network connectivity for its applications. Some of the subnets used by both companies overlap. In order for both businesses to integrate, the applications need to have private network connectivity. These applications are not on overlapping subnets. You want to provide connectivity with minimal re-engineering. What should you do?", "options": [{"letter": "A", "text": "Set up VPC peering and peer each Shared VPC together."}, {"letter": "B", "text": "Migrate the projects from the acquired company into your company's Google Cloud organization. Re-launch the instances in your companies Shared VPC."}, {"letter": "C", "text": "Set up a Cloud VPN gateway in each Shared VPC and peer Cloud VPNs."}, {"letter": "D", "text": "Configure SSH port forwarding on each application to provide connectivity between applications in the different Shared VPCs."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80075-exam-professional-cloud-architect-topic-1-question-183/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["VPC/網路"]}, {"id": "T1-Q184", "topic": 1, "qnum": 184, "question": "You are managing several internal applications that are deployed on Compute Engine. Business users inform you that an application has become very slow over the past few days. You want to find the underlying cause in order to solve the problem. What should you do first?", "options": [{"letter": "A", "text": "Inspect the logs and metrics from the instances in Cloud Logging and Cloud Monitoring."}, {"letter": "B", "text": "Change the Compute Engine Instances behind the application to a machine type with more CPU and memory."}, {"letter": "C", "text": "Restore a backup of the application database from a time before the application became slow."}, {"letter": "D", "text": "Deploy the applications on a managed instance group with autoscaling enabled. Add a load balancer in front of the managed instance group, and have the users connect to the IP of the load balancer."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/79697-exam-professional-cloud-architect-topic-1-question-184/", "postedDate": "2022-09-03", "postedYear": 2022, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "效能調校"]}, {"id": "T1-Q185", "topic": 1, "qnum": 185, "question": "Your company has an application running as a Deployment in a Google Kubernetes Engine (GKE) cluster. When releasing new versions of the application via a rolling deployment, the team has been causing outages. The root cause of the outages is misconfigurations with parameters that are only used in production. You want to put preventive measures for this in the platform to prevent outages. What should you do?", "options": [{"letter": "A", "text": "Configure liveness and readiness probes in the Pod specification."}, {"letter": "B", "text": "Configure health checks on the managed instance group."}, {"letter": "C", "text": "Create a Scheduled Task to check whether the application is available."}, {"letter": "D", "text": "Configure an uptime alert in Cloud Monitoring."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/79702-exam-professional-cloud-architect-topic-1-question-185/", "postedDate": "2022-09-03", "postedYear": 2022, "tags": ["GKE/Kubernetes", "CI/CD", "高可用性/災難復原"]}, {"id": "T1-Q186", "topic": 1, "qnum": 186, "question": "Your company uses Google Kubernetes Engine (GKE) as a platform for all workloads. Your company has a single large GKE cluster that contains batch, stateful, and stateless workloads. The GKE cluster is configured with a single node pool with 200 nodes. Your company needs to reduce the cost of this cluster but does not want to compromise availability. What should you do?", "options": [{"letter": "A", "text": "Create a second GKE cluster for the batch workloads only. Allocate the 200 original nodes across both clusters."}, {"letter": "B", "text": "Configure CPU and memory limits on the namespaces in the cluster. Configure all Pods to have a CPU and memory limits."}, {"letter": "C", "text": "Configure a HorizontalPodAutoscaler for all stateless workloads and for all compatible stateful workloads. Configure the cluster to use node auto scaling."}, {"letter": "D", "text": "Change the node pool to use preemptible VMs."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/79736-exam-professional-cloud-architect-topic-1-question-186/", "postedDate": "2022-09-03", "postedYear": 2022, "tags": ["GKE/Kubernetes", "成本優化", "自動擴縮"]}, {"id": "T1-Q187", "topic": 1, "qnum": 187, "question": "Your company has a Google Cloud project that uses BigQuery for data warehousing on a pay-per-use basis. You want to monitor queries in real time to discover the most costly queries and which users spend the most. What should you do?", "options": [{"letter": "A", "text": "1. In the BigQuery dataset that contains all the tables to be queried, add a label for each user that can launch a query. 2. Open the Billing page of the project. 3. Select Reports. 4. Select BigQuery as the product and filter by the user you want to check."}, {"letter": "B", "text": "1. Create a Cloud Logging sink to export BigQuery data access logs to BigQuery. 2. Perform a BigQuery query on the generated table to extract the information you need."}, {"letter": "C", "text": "1. Create a Cloud Logging sink to export BigQuery data access logs to Cloud Storage. 2. Develop a Dataflow pipeline to compute the cost of queries split by users."}, {"letter": "D", "text": "1. Activate billing export into BigQuery. 2. Perform a BigQuery query on the billing table to extract the information you need."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80112-exam-professional-cloud-architect-topic-1-question-187/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["BigQuery", "成本優化", "監控與可觀測性"]}, {"id": "T1-Q188", "topic": 1, "qnum": 188, "question": "Your company and one of its partners each have a Google Cloud project in separate organizations. Your company's project (prj-a) runs in Virtual Private Cloud(vpc-a). The partner's project (prj-b) runs in vpc-b. There are two instances running on vpc-a and one instance running on vpc-b. Subnets defined in both VPCs are not overlapping. You need to ensure that all instances communicate with each other via internal IPs, minimizing latency and maximizing throughput. What should you do?", "options": [{"letter": "A", "text": "Set up a network peering between vpc-a and vpc-b."}, {"letter": "B", "text": "Set up a VPN between vpc-a and vpc-b using Cloud VPN."}, {"letter": "C", "text": "Configure IAP TCP forwarding on the instance in vpc-b, and then launch the following gcloud command from one of the instances in vpc-a gcloud: gcloud compute start-iap-tunnel INSTANCE_NAME_IN_VPC_8 22 \\ --local-host-port=localhost:22"}, {"letter": "D", "text": "1. Create an additional instance in vpc-a. 2. Create an additional instance in vpc-b. 3. Install OpenVPN in newly created instances. 4. Configure a VPN tunnel between vpc-a and vpc-b with the help of OpenVPN."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80000-exam-professional-cloud-architect-topic-1-question-188/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["VPC/網路"]}, {"id": "T1-Q189", "topic": 1, "qnum": 189, "question": "You want to store critical business information in Cloud Storage buckets. The information is regularly changed, but previous versions need to be referenced on a regular basis. You want to ensure that there is a record of all changes to any information in these buckets. You want to ensure that accidental edits or deletions can be easily rolled back. Which feature should you enable?", "options": [{"letter": "A", "text": "Bucket Lock"}, {"letter": "B", "text": "Object Versioning"}, {"letter": "C", "text": "Object change notification"}, {"letter": "D", "text": "Object Lifecycle Management"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80304-exam-professional-cloud-architect-topic-1-question-189/", "postedDate": "2022-09-05", "postedYear": 2022, "tags": ["Cloud Storage", "高可用性/災難復原"]}, {"id": "T1-Q190", "topic": 1, "qnum": 190, "question": "You have a Compute Engine application that you want to autoscale when total memory usage exceeds 80%. You have installed the Cloud Monitoring agent and configured the autoscaling policy as follows:✑ Metric identifier: agent.googleapis.com/memory/percent_used✑ Filter: metric.label.state = 'used'✑ Target utilization level: 80✑ Target type: GAUGEYou observe that the application does not scale under high load. You want to resolve this. What should you do?", "options": [{"letter": "A", "text": "Change the Target type to DELTA_PER_MINUTE."}, {"letter": "B", "text": "Change the Metric identifier to agent.googleapis.com/memory/bytes_used."}, {"letter": "C", "text": "Change the filter to metric.label.state = 'used' AND metric.label.state = 'buffered' AND metric.label.state = 'cached' AND metric.label.state = 'slab'."}, {"letter": "D", "text": "Change the filter to metric.label.state = 'free' and the Target utilization to 20."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80040-exam-professional-cloud-architect-topic-1-question-190/", "postedDate": "2022-09-04", "postedYear": 2022, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q191", "topic": 1, "qnum": 191, "question": "You are deploying an application to Google Cloud. The application is part of a system. The application in Google Cloud must communicate over a private network with applications in a non-Google Cloud environment. The expected average throughput is 200 kbps. The business requires:✑ as close to 100% system availability as possible✑ cost optimizationYou need to design the connectivity between the locations to meet the business requirements. What should you provision?", "options": [{"letter": "A", "text": "An HA Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway"}, {"letter": "B", "text": "Two Classic Cloud VPN gateways connected to two on-premises VPN gateways Configure each Classic Cloud VPN gateway to have two tunnels, each connected to different on-premises VPN gateways"}, {"letter": "C", "text": "Two HA Cloud VPN gateways connected to two on-premises VPN gateways Configure each HA Cloud VPN gateway to have two tunnels, each connected to different on-premises VPN gateways"}, {"letter": "D", "text": "A single Cloud VPN gateway connected to an on-premises VPN gateway"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/80419-exam-professional-cloud-architect-topic-1-question-191/", "postedDate": "2022-09-05", "postedYear": 2022, "tags": ["Interconnect/VPN", "高可用性/災難復原", "成本優化"]}, {"id": "T1-Q192", "topic": 1, "qnum": 192, "question": "Your company has an application running on App Engine that allows users to upload music files and share them with other people. You want to allow users to upload files directly into Cloud Storage from their browser session. The payload should not be passed through the backend. What should you do?", "options": [{"letter": "A", "text": "1. Set a CORS configuration in the target Cloud Storage bucket where the base URL of the App Engine application is an allowed origin.2. Use the Cloud Storage Signed URL feature to generate a POST URL."}, {"letter": "B", "text": "1. Set a CORS configuration in the target Cloud Storage bucket where the base URL of the App Engine application is an allowed origin.2. Assign the Cloud Storage WRITER role to users who upload files."}, {"letter": "C", "text": "1. Use the Cloud Storage Signed URL feature to generate a POST URL.2. Use App Engine default credentials to sign requests against Cloud Storage."}, {"letter": "D", "text": "1. Assign the Cloud Storage WRITER role to users who upload files.2. Use App Engine default credentials to sign requests against Cloud Storage."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121240-exam-professional-cloud-architect-topic-1-question-192/", "postedDate": "2023-09-23", "postedYear": 2023, "tags": ["App Engine", "Cloud Storage", "安全性"]}, {"id": "T1-Q193", "topic": 1, "qnum": 193, "question": "You are configuring the cloud network architecture for a newly created project in Google Cloud that will host applications in Compute Engine. Compute Engine virtual machine instances will be created in two different subnets (sub-a and sub-b) within a single region:• Instances in sub-a will have public IP addresses.• Instances in sub-b will have only private IP addresses.To download updated packages, instances must connect to a public repository outside the boundaries of Google Cloud. You need to allow sub-b to access the external repository. What should you do?", "options": [{"letter": "A", "text": "Enable Private Google Access on sub-b."}, {"letter": "B", "text": "Configure Cloud NAT and select sub-b in the NAT mapping section."}, {"letter": "C", "text": "Configure a bastion host instance in sub-a to connect to instances in sub-b."}, {"letter": "D", "text": "Enable Identity-Aware Proxy for TCP forwarding for instances in sub-b."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121322-exam-professional-cloud-architect-topic-1-question-193/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["VPC/網路"]}, {"id": "T1-Q194", "topic": 1, "qnum": 194, "question": "Your company is planning to migrate their Windows Server 2022 from their on-premises data center to Google Cloud. You need to bring the licenses that are currently in use in on-premises virtual machines into the target cloud environment. What should you do?", "options": [{"letter": "A", "text": "1. Create an image of the on-premises virtual machines and upload into Cloud Storage.2. Import the image as a virtual disk on Compute Engine."}, {"letter": "B", "text": "1. Create standard instances on Compute Engine.2. Select as the OS the same Microsoft Windows version that is currently in use in the on-premises environment."}, {"letter": "C", "text": "1. Create an image of the on-premises virtual machine.2. Import the image as a virtual disk on Compute Engine.3. Create a standard instance on Compute Engine, selecting as the OS the same Microsoft Windows version that is currently in use in the on-premises environment.4. Attach a data disk that includes data that matches the created image."}, {"letter": "D", "text": "1. Create an image of the on-premises virtual machines.2. Import the image as a virtual disk on Compute Engine using --os=windows-2022-dc-v.3. Create a sole-tenancy instance on Compute Engine that uses the imported disk as a boot disk."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121314-exam-professional-cloud-architect-topic-1-question-194/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["Compute Engine", "資料遷移"]}, {"id": "T1-Q195", "topic": 1, "qnum": 195, "question": "You are deploying an application to Google Cloud. The application is part of a system. The application in Google Cloud must communicate over a private network with applications in a non-Google Cloud environment. The expected average throughput is 200 kbps. The business requires:• 99.99% system availability• cost optimizationYou need to design the connectivity between the locations to meet the business requirements. What should you provision?", "options": [{"letter": "A", "text": "An HA Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway."}, {"letter": "B", "text": "A Classic Cloud VPN gateway connected with two tunnels to an on-premises VPN gateway."}, {"letter": "C", "text": "Two HA Cloud VPN gateways connected to two on-premises VPN gateways. Configure each HA Cloud VPN gateway to have two tunnels, each connected to different on-premises VPN gateways."}, {"letter": "D", "text": "A Classic Cloud VPN gateway connected with one tunnel to an on-premises VPN gateway."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121313-exam-professional-cloud-architect-topic-1-question-195/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["Interconnect/VPN", "高可用性/災難復原", "成本優化"]}, {"id": "T1-Q196", "topic": 1, "qnum": 196, "question": "Your company wants to migrate their 10-TB on-premises database export into Cloud Storage. You want to minimize the time it takes to complete this activity and the overall cost. The bandwidth between the on-premises environment and Google Cloud is 1 Gbps. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Develop a Dataflow job to read data directly from the database and write it into Cloud Storage."}, {"letter": "B", "text": "Use the Data Transfer appliance to perform an offline migration."}, {"letter": "C", "text": "Use a commercial partner ETL solution to extract the data from the on-premises database and upload it into Cloud Storage."}, {"letter": "D", "text": "Upload the data with gcloud storage cp."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/121324-exam-professional-cloud-architect-topic-1-question-196/", "postedDate": "2023-09-24", "postedYear": 2023, "tags": ["Cloud Storage", "資料遷移"]}, {"id": "T1-Q197", "topic": 1, "qnum": 197, "question": "You are working at a financial institution that stores mortgage loan approval documents on Cloud Storage. Any change to these approval documents must be uploaded as a separate approval file. You need to ensure that these documents cannot be deleted or overwritten for the next 5 years. What should you do?", "options": [{"letter": "A", "text": "Create a retention policy on the bucket for the duration of 5 years. Create a lock on the retention policy."}, {"letter": "B", "text": "Create a retention policy organizational constraint constraints/storage.retentionPolicySeconds at the organization level. Set the duration to 5 years."}, {"letter": "C", "text": "Use a customer-managed key for the encryption of the bucket. Rotate the key after 5 years."}, {"letter": "D", "text": "Create a retention policy organizational constraint constraints/storage.retentionPolicySeconds at the project level. Set the duration to 5 years."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/138677-exam-professional-cloud-architect-topic-1-question-197/", "postedDate": "2024-04-14", "postedYear": 2024, "tags": ["Cloud Storage", "合規性"]}, {"id": "T1-Q198", "topic": 1, "qnum": 198, "question": "Your company has decided to make a major revision of their API in order to create better experiences for their developers. They need to keep the old version of the API available and deployable, while allowing new customers and testers to try out the new API. They want to keep the same SSL and DNS records in place to serve both APIs.What should they do?", "options": [{"letter": "A", "text": "Configure a new load balancer for the new version of the API"}, {"letter": "B", "text": "Reconfigure old clients to use a new endpoint for the new API"}, {"letter": "C", "text": "Have the old API forward traffic to the new API based on the path"}, {"letter": "D", "text": "Use separate backend pools for each API path behind the load balancer"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/146571-exam-professional-cloud-architect-topic-1-question-198/", "postedDate": "2024-08-27", "postedYear": 2024, "tags": ["Load Balancing", "VPC/網路"]}, {"id": "T1-Q199", "topic": 1, "qnum": 199, "question": "You have a Compute Engine application that you want to autoscale when total memory usage exceeds 80%. You have installed the Cloud Monitoring agent and configured the autoscaling policy as follows:You observe that the application does not scale under high load. You want to resolve this. What should you do?", "options": [{"letter": "A", "text": "Change the Target type to DELTA_PER_MINUTE."}, {"letter": "B", "text": "Change the Metric identifier to agent.googleapis.com/memory/bytes_used."}, {"letter": "C", "text": "Change the filter to metric.label.state = ‘used’."}, {"letter": "D", "text": "Change the filter to metric.label.state = ‘free’ and the Target utilization to 20."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/146572-exam-professional-cloud-architect-topic-1-question-199/", "postedDate": "2024-08-27", "postedYear": 2024, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q200", "topic": 1, "qnum": 200, "question": "Your company has a Google Cloud project that uses BigOuery for data warehousing. The VPN tunnel between the on-premises environment and Google Cloud is configured with Cloud VPN. Your security team wants to avoid data exfiltration by malicious insiders, compromised code, and accidental oversharing. What should you do?", "options": [{"letter": "A", "text": "Configure Private Service Connect."}, {"letter": "B", "text": "Configure VPC Service Controls and configure Private Google Access for on-promises hosts."}, {"letter": "C", "text": "Create a service account, grant the BigQuery JobUser role and Storage Object Viewer role to the service account, and remove all other Identity and Access Management (IAM) access from the project."}, {"letter": "D", "text": "Configure Private Google Access."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/169213-exam-professional-cloud-architect-topic-1-question-200/", "postedDate": "2025-03-17", "postedYear": 2025, "tags": ["BigQuery", "VPC/網路", "安全性"]}, {"id": "T1-Q201", "topic": 1, "qnum": 201, "question": "You are managing a few hundred Ubuntu and Red Hat Enterprise Linux virtual machines running on Google Compute Engine (GCE). You need to patch the operating systems for those VMs periodically in a secure and scalable way. What should you do?", "options": [{"letter": "A", "text": "Create a Cloud Scheduler job to run a Bash script that securely connects to each VM and applies the patches."}, {"letter": "B", "text": "Configure Config Sync, and install the Ops Agent on each VM. Schedule a patch job to apply patches on each VM."}, {"letter": "C", "text": "Schedule a Cloud Build job, and use Cloud Deploy to run a patch job that applies patches on each VM."}, {"letter": "D", "text": "Set up VM Manager, and install the OS Config agent on each VM. Schedule a patch job to apply patches on each VM."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381829-exam-professional-cloud-architect-topic-1-question-201/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Compute Engine", "安全性", "監控與可觀測性"]}, {"id": "T1-Q202", "topic": 1, "qnum": 202, "question": "Your company uses Salesforce for customer relationship management (CRM). ServiceNow for IT service management, and a Cloud SQL database to store customer transaction data You need to seamlessly connect, map. and transform data between these systems to ensure data consistency and enable real-time reporting. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Leverage Workflows to connect the services and transform the data."}, {"letter": "B", "text": "Leverage Application Integration to connect the services and transform the data."}, {"letter": "C", "text": "Leverage Pub/Sub and BigQuery to connect the services and transform the data."}, {"letter": "D", "text": "Leverage Pub/Sub and Datastream to connect the services and transform the data."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381815-exam-professional-cloud-architect-topic-1-question-202/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["混合雲"]}, {"id": "T1-Q203", "topic": 1, "qnum": 203, "question": "You are designing the architecture for a global social media site on Google Cloud. The site serves dynamic API content, static assets such as CSS. JS. images, and user-uploaded videos for streaming. You need to minimize latency for all content types for users worldwide. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Use an external Application Load Balancer to serve your application APIs."}, {"letter": "B", "text": "Use Cloud CDN to serve static assets of your application."}, {"letter": "C", "text": "Use Media CDN to serve static assets of your application"}, {"letter": "D", "text": "Use Memorystore to serve your web application."}, {"letter": "E", "text": "Use a multi-region Cloud Storage bucket to serve your entire web application."}], "answer": "AB", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381822-exam-professional-cloud-architect-topic-1-question-203/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Load Balancing", "多區域架構", "效能調校", "Cloud CDN"]}, {"id": "T1-Q204", "topic": 1, "qnum": 204, "question": "You are creating a migration plan to move your organization’s infrastructure from on-premises to Google Cloud. You want to understand and manage costs effectively after the migration is complete. Which strategies should you include in the migration plan? (Choose two.)", "options": [{"letter": "A", "text": "Enable Backup and DR Service."}, {"letter": "B", "text": "Configure labels and tags for the resources provisioned in Google Cloud."}, {"letter": "C", "text": "Create a Cloud Scheduler job to export billing data to Cloud SQL."}, {"letter": "D", "text": "Create service alerts using Cloud Monitoring."}, {"letter": "E", "text": "Adopt infrastructure as code (IaC) for the cloud resources."}], "answer": "BE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381813-exam-professional-cloud-architect-topic-1-question-204/", "postedDate": "2025-12-21", "postedYear": 2025, "tags": ["成本優化", "Terraform/IaC", "資料遷移"]}, {"id": "T1-Q205", "topic": 1, "qnum": 205, "question": "A Cloud Run service running your serverless application is unable to connect to an AlloyDB database created with default configurations. You need to troubleshoot and resolve the issue as quickly as possible. What should you do?", "options": [{"letter": "A", "text": "Verify that the Cloud Run service and AlloyDB instance are in the same region."}, {"letter": "B", "text": "Enable Direct VPC egress for the Cloud Run service, and send traffic directly to a VPC."}, {"letter": "C", "text": "Disable the default public IP address of the AlloyDB instance, and use the private IP address in the connection string."}, {"letter": "D", "text": "Create a Cloud SQL instance, and migrate the AlloyDB database to PostgreSQL on Cloud SQL."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381825-exam-professional-cloud-architect-topic-1-question-205/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Run/Cloud Functions", "VPC/網路"]}, {"id": "T1-Q206", "topic": 1, "qnum": 206, "question": "Your company is building containerized applications as part of their CI/CD pipeline. To improve the security and maintainability of the build process, you need to:• Identify potential vulnerabilities within your container images.• Generate verifiable metadata about the builds for auditing and compliance.• Create a comprehensive inventory of your application’s dependenciesWhat should you do?", "options": [{"letter": "A", "text": "Use Cloud Build to build container images, and then trigger Artifact Analysis on images pushed to Artifact Registry."}, {"letter": "B", "text": "Use Cloud Build to build container images, trigger Binary Authorization, and use Cloud Asset Inventory for tracking and analysis."}, {"letter": "C", "text": "Use Cloud Build to build container images, push the images to Artifact Registry, and use Security Command Center for tracking and analysis."}, {"letter": "D", "text": "Use Cloud Build to build container images, trigger Binary Authorization, and use Security Command Center for tracking and analysis."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381816-exam-professional-cloud-architect-topic-1-question-206/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["CI/CD", "容器化", "安全性", "Security Command Center"]}, {"id": "T1-Q207", "topic": 1, "qnum": 207, "question": "Your team is running applications on a Google Kubernetes Engine (GKE) cluster with a private endpoint. You've set up a Cloud Deploy pipeline, but deployments to the GKE cluster are failing. You need to resolve the issue. What should you do?", "options": [{"letter": "A", "text": "Use VPC Service Controls with Cloud Build Update the Cloud pipeline to use Cloud Build as its execution environment."}, {"letter": "B", "text": "Create a Cloud Build private pool in the default VPC. Use Cloud Build to deploy the applications to the GKE cluster."}, {"letter": "C", "text": "Create a Cloud Build private pool that is peered with the same VPC network as your GKE cluster. Update the Cloud Deploy pipeline to use this private pool as its execution environment."}, {"letter": "D", "text": "Create a custom target in Cloud Deploy Update the deploy pipeline to use the custom target for the application deployment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381827-exam-professional-cloud-architect-topic-1-question-207/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["GKE/Kubernetes", "CI/CD", "VPC/網路"]}, {"id": "T1-Q208", "topic": 1, "qnum": 208, "question": "You are planning to migrate your on-premises compute and SAP workloads to Google Cloud. You want to follow Google-recommended practices to quickly create a cost estimate for running these workloads in Google Cloud. What should you do?", "options": [{"letter": "A", "text": "Leverage Cloud Asset Inventory to gather data and generate a cost estimate."}, {"letter": "B", "text": "Use the Google Cloud pricing calculator, and input the estimated resource to generate a cost estimate."}, {"letter": "C", "text": "Engage with a Google Cloud partner to perform a comprehensive assessment and provide a customized cost estimate."}, {"letter": "D", "text": "Gather data about your current environment, and leverage Google Cloud Migration Center to generate a cost estimate."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381828-exam-professional-cloud-architect-topic-1-question-208/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["成本優化", "資料遷移"]}, {"id": "T1-Q209", "topic": 1, "qnum": 209, "question": "Your organization has a significant amount of log data stored in Cloud Logging. The data engineering team is accustomed to using SQL for analysis and wants the ability to create insightful dashboards for visualizing log trends and patterns. You want to follow the recommendations of the Google Cloud Well-Architected Framework to provide a solution for the data engineering team. What should you do?", "options": [{"letter": "A", "text": "Create a log sink, and export the data to BigQuery using Pub/Sub. Run queries and visualize the data with Cloud Monitoring dashboards."}, {"letter": "B", "text": "Enable log analytics and run queries in Cloud Monitoring. Visualize the data using Vertex AI workbench."}, {"letter": "C", "text": "Enable log analytics and run queries in the linked log dataset in BigQuery. Visualize the data with Looker Studio dashboards."}, {"letter": "D", "text": "Create a log sink, and export the data to a storage bucket. Create an external table in BigQuery for the data in the bucket. Run queries and visualize the data with Cloud Monitoring dashboards."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381814-exam-professional-cloud-architect-topic-1-question-209/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Monitoring/Logging", "BigQuery", "監控與可觀測性"]}, {"id": "T1-Q210", "topic": 1, "qnum": 210, "question": "You are designing the storage architecture for a financial analytics platform. The platform ingests and stores terabytes of transactional data daily, which is used for both real-time fraud detection and long-term historical analysis. Transaction data from the last 30 days must be accessible with very low latency for the fraud detection engine. Data older than 30 days is accessed infrequently for quarterly reports, where retrieval times of a few seconds are acceptable. All data must be retained for five years to meet compliance regulations. You need to design a solution as cost-effective as possible. What should you do?", "options": [{"letter": "A", "text": "Store all transaction data in a Cloud Storage bucket using the Standard storage class for the entire five-year retention period."}, {"letter": "B", "text": "Ingest all data into BigQuery using time-partitioned tables, and rely on BigQuery’s automatic long-term storage pricing for data older than 90 days."}, {"letter": "C", "text": "Configure a Cloud Storage bucket with an Object Lifecycle Management policy to transition data from the Standard class to the Archive class after 30 days."}, {"letter": "D", "text": "Configure a Cloud Storage bucket with an Object Lifecycle Management policy to transition data from the Standard class to the Coldline class after 30 days."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381819-exam-professional-cloud-architect-topic-1-question-210/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Storage", "成本優化", "合規性"]}, {"id": "T1-Q211", "topic": 1, "qnum": 211, "question": "You are architecting a new application feature for a healthcare provider based in Qatar. The feature needs to summarize sensitive patient notes that are submitted by clinicians. A critical requirement is that the content of these patient notes must never be processed outside of Qatar's borders. You want to use a powerful, pre-trained generative model for the summarization task while strictly adhering to the data residency constraint. What should you do?", "options": [{"letter": "A", "text": "Write application code that sends the patient notes explicitly to the Gemini API endpoint in Qatar for summarization. Protect the API by VPC-Service Controls."}, {"letter": "B", "text": "Use Vertex AI Model Garden to select a Gemma model. Deploy this model to a Vertex AI Endpoint within a Google Cloud region located in Qatar."}, {"letter": "C", "text": "Use the Cloud Natural Language API to analyze the text and configure it to generate a summary of the patient notes."}, {"letter": "D", "text": "Gather a large, anonymized dataset of medical notes. Use Vertex AI Training to train a custom summarization model from scratch, deploying it in a Qatar region."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381823-exam-professional-cloud-architect-topic-1-question-211/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Vertex AI/AI-ML", "合規性", "安全性"]}, {"id": "T1-Q212", "topic": 1, "qnum": 212, "question": "You are migrating a critical on-premises inventory management application to Google Cloud. The application is a monolith with a traditional relational database, and the immediate business goal is a rapid data center exit. The monolith is exposing an API to other business critical applications.The long-term vision is to modernize the application into globally distributed, cloud-native services to support the company’s expansion. You need to design the initial cloud architecture to ensure that future modernization causes the least possible disruption to other applications that depend on inventory data. The future modernization might require the API to change structure. What should you do?", "options": [{"letter": "A", "text": "Use Service Directory to register the monolith's endpoint, allowing dependent applications to look up its address and connect directly."}, {"letter": "B", "text": "Implement a managed API facade with Apigee to handle all requests from dependent applications on behalf of the monolith’s backend."}, {"letter": "C", "text": "Use an internal load balancer to provide a stable IP for dependent applications to connect directly to the monolith's native API."}, {"letter": "D", "text": "Provide dependent applications with direct database access by creating secured SQL VIEWs on Cloud SQL for them to query."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381830-exam-professional-cloud-architect-topic-1-question-212/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Apigee", "資料遷移"]}, {"id": "T1-Q213", "topic": 1, "qnum": 213, "question": "Your organization uses separate Google Cloud projects for shared services, development, testing, and production.• The shared services project hosts your private CI/CD runners and a central Artifact Registry• The development, testing, and production projects host the GKE clusters where applications are deployed.You need to design an architecture that allows the CI/CD runners to connect to the GKE clusters and the clusters to pull images from Artifact Registry, all using private IP addresses. However, direct network traffic between the development, testing, and production environments must be strictly prohibited. What should you do?", "options": [{"letter": "A", "text": "Create a separate VPC in each of the four projects. Connect each environment's VPC to the shared services VPC through VPC Network Peering."}, {"letter": "B", "text": "Expose the resources in the shared services project using an external load balancer. Implement a firewall rule to limit access."}, {"letter": "C", "text": "Create a separate VPC in each project. Use VPC Network Peering to create a full mesh, connecting every VPC directly to every other VPC."}, {"letter": "D", "text": "Configure the shared services project as a Shared VPC host. Create a single VPC in this host project and attach the environment projects as service projects."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381820-exam-professional-cloud-architect-topic-1-question-213/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["VPC/網路", "GKE/Kubernetes", "安全性"]}, {"id": "T1-Q214", "topic": 1, "qnum": 214, "question": "You are designing the network architecture for a public-facing, containerized web application deployed on Cloud Run. All incoming traffic must be inspected by a Cloud Armor web application firewall (WAF) before reaching the application You plan to use an Application Load Balancer, which will have the Cloud Armor policy attached. You must ensure that all public requests pass through the load balancer and any attempt to access the Cloud Run service directly through its default *.run.app URL is blocked. What should you do?", "options": [{"letter": "A", "text": "Enable Identity-Aware Proxy (IAP) directly on the Cloud Run service to intercept and validate all incoming requests"}, {"letter": "B", "text": "Create a DNS entry to route traffic to Cloud Armor. Configure Cloud Armor to deny traffic from unknown IP addresses"}, {"letter": "C", "text": "Set the Cloud Run ingress to Allow internal traffic and Cloud Load Balancing, and use a serverless NEG backend on the load balancer"}, {"letter": "D", "text": "Configure a VPC firewall rule with a high priority to deny all traffic that does not originate from the load balancer"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381821-exam-professional-cloud-architect-topic-1-question-214/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Run/Cloud Functions", "Cloud Armor", "Load Balancing", "安全性"]}, {"id": "T1-Q215", "topic": 1, "qnum": 215, "question": "To improve governance and security, your organization has structured the Google Cloud environment using folders for different business units. Each business unit folder has subfolders for development, staging, and production environments, which must comply with internal security controls:• Production workloads must be protected from direct internet ingress by default unless explicitly tagged.• The application must be accessible to customers over HTTPS.You need to design a scalable and enforceable model that blocks internet ingress traffic to the production folders while selectively allowing direct HTTPS traffic to the necessary virtual machines. You must also ensure that individual project teams cannot overwrite these controls once they are implemented for all current and future production projects. What should you do?", "options": [{"letter": "A", "text": "At each production folder, apply a hierarchical firewall policy to deny all ingress except for HTTPS to tagged VMs."}, {"letter": "B", "text": "Mandate the application teams to deploy a Terraform module to create VPC firewall rules in each project that deny ingress and allow HTTPS."}, {"letter": "C", "text": "At the organization root, apply a hierarchical firewall policy to deny all ingress except for HTTPS to tagged VMs."}, {"letter": "D", "text": "At each production folder, use an organization policy to block all external IPs and require teams to use external HTTPS load balancers."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381826-exam-professional-cloud-architect-topic-1-question-215/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["VPC/網路", "Organization Policy", "安全性"]}, {"id": "T1-Q216", "topic": 1, "qnum": 216, "question": "You are designing a new insurance claims processing application that will be deployed on Google Kubernetes Engine (GKE) Your company’s compliance team requires a complete and non-repudiable audit trail for all administrative actions from day one. Your application must capture who deploys a new container image, who modifies the GKE cluster's configuration, and who interacts with running pods or Kubernetes secrets using kubectl. What should you do?", "options": [{"letter": "A", "text": "Enable Binary Authorization on the GKE cluster, and create a policy that requires all deployed container images to be signed by a trusted attestor."}, {"letter": "B", "text": "Deploy a DaemonSet to every node in the GKE cluster that runs a logging agent to collect and forward all container logs to Cloud Logging."}, {"letter": "C", "text": "Enable GKE Audit Logging to send Kubernetes API server logs to Cloud Logging, and ensure Cloud Audit Logs are enabled for the project."}, {"letter": "D", "text": "Activate the Security Command Center Premium tier to analyze GKE logs and detect threats, vulnerabilities, and misconfigurations in real time."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381818-exam-professional-cloud-architect-topic-1-question-216/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "合規性"]}, {"id": "T1-Q217", "topic": 1, "qnum": 217, "question": "Your product team is building a critical, customer-facing application on Google Cloud. The development team wants to use Spanner for their database to take advantage of its horizontal scalability and low operational overhead However, the FinOps team is concerned about the direct monthly cost of Spanner and proposed using a self-managed PostgreSQL database on Compute Engine VMs instead. You need to resolve this conflict and ensure the project moves forward with an architecturally sound database choice that balances technical requirements with financial constraints. What should you do?", "options": [{"letter": "A", "text": "Provide the development team with a reference architecture for deploying a highly available PostgreSQL cluster on a regional managed instance group (MIG)."}, {"letter": "B", "text": "Suggest using Cloud SQL for PostgreSQL as a compromise to get a managed service at a lower cost than Spanner."}, {"letter": "C", "text": "Develop a total cost of ownership (TCO) analysis that includes operational overhead, and present it in a workshop to facilitate a decision."}, {"letter": "D", "text": "Cite the reliability and performance optimization pillars of the Google Cloud Well-Architected Framework to formally justify the use of Spanner."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381824-exam-professional-cloud-architect-topic-1-question-217/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Spanner", "成本優化"]}, {"id": "T1-Q218", "topic": 1, "qnum": 218, "question": "You are deploying a critical application with a stateless, containerized frontend on Cloud Run and a Cloud SQL for PostgreSQL backend. The application experiences unpredictable traffic spikes, and the business requires the ability to immediately roll back a failed deployment to the last known good state. You need to apply a deployment strategy that aligns with Site Reliability Engineering (SRE) principles for both the application code and the database schema updates, while meeting the business's requirements. What should you do?", "options": [{"letter": "A", "text": "Package the database schema migration script within the container to be executed on every container startup before the application process begins."}, {"letter": "B", "text": "Configure the CI/CD pipeline to use the :latest container tag for deployments, with database schema changes applied manually as needed."}, {"letter": "C", "text": "Separate CI/CD pipelines for database schema migrations from application deployments. When deploying a new Cloud Run revision, use gradual traffic split."}, {"letter": "D", "text": "Use a single CI/CD pipeline that first applies database schema changes and then deploys the new Cloud Run revision."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/381817-exam-professional-cloud-architect-topic-1-question-218/", "postedDate": "2025-12-22", "postedYear": 2025, "tags": ["Cloud Run/Cloud Functions", "Cloud SQL", "CI/CD", "高可用性/災難復原"]}, {"id": "T1-Q219", "topic": 1, "qnum": 219, "question": "Altostrat stores a large library of media content, including sensitive interviews and documentaries, in Cloud Storage. They are concerned about the confidentiality of this content and want to protect it from unauthorized access. You need to implement a Google-recommended solution that is easy to integrate and provides Altostrat with control and auditability of the encryption keys. What should you do?", "options": [{"letter": "A", "text": "Configure Cloud Storage to use server-side encryption with Google-managed encryption keys. Create a bucket policy to restrict access to only authorized Google groups and required service accounts."}, {"letter": "B", "text": "Use Cloud Storage default encryption at rest. Implement fine-grained access control using IAM roles and groups to restrict access to sensitive buckets"}, {"letter": "C", "text": "Implement client-side encryption before uploading it to Cloud Storage. Store the encryption keys in a HashiCorp Vault instance deployed on Google Kubernetes Engine (GKE). Implement fine-grained access control to sensitive Cloud Storage buckets using IAM roles."}, {"letter": "D", "text": "Use customer-managed encryption keys (CMEK) for all Cloud Storage buckets storing sensitive media content. Implement fine-grained access control using IAM roles and groups to restrict access to sensitive buckets."}], "answer": "D", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383590-exam-professional-cloud-architect-topic-1-question-219/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Server-side encryption + Google-managed keys：金鑰完全由 Google 管理，客戶沒有控制金鑰生命週期（產生、輪替、撤銷）的能力，不符合『控制與稽核加密金鑰』的要求。"}, {"letter": "B", "analysis": "Default encryption at rest 本質上也是用 Google-managed keys（GCS 預設就會加密，這不是額外的保護措施），客戶一樣無法控制金鑰，只是多做了 IAM 存取控制，沒有解決金鑰控制權的問題。"}, {"letter": "C", "analysis": "Client-side encryption + 自架 HashiCorp Vault on GKE：客戶對金鑰有完全控制權，但要自己架設、維運整套金鑰管理基礎設施，複雜度非常高，不符合『容易整合』的要求，也不是 Google 官方建議的原生路徑。"}, {"letter": "D", "analysis": "正確：CMEK（Customer-Managed Encryption Keys）透過 Cloud KMS，讓客戶自己產生、輪替、設定過期、撤銷金鑰，所有金鑰操作都記錄在 Cloud Audit Logs 裡，同時是 GCP 原生服務，只要在建立 bucket 時指定 KMS 金鑰即可，加解密流程由 GCP 自動處理，完全符合『Google 建議、容易整合、控制與稽核金鑰』三個要求。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 把大量敏感媒體內容（訪談、紀錄片）存在 Cloud Storage，擔心機密性，想要一個 Google 建議、容易整合、而且公司自己能控制並稽核加密金鑰的解決方案。這題屬於 Altostrat Media 案例研究題組。"}, {"heading": "四個選項的核心差異：誰管金鑰", "body": "A（Google-managed keys）和 B（default encryption，本質上也是 Google 管理金鑰）：客戶都無法控制金鑰生命週期，只是做了存取控制，不符合題目對金鑰控制權的要求。C（client-side encryption + 自架 HashiCorp Vault）：客戶對金鑰有完全控制權，但要自己架設維運整套基礎設施，複雜度高，不符合『容易整合』、也不是 Google 原生建議路徑。D（CMEK + Cloud KMS）：GCP 原生服務，客戶能控制金鑰生命週期並有 Cloud Audit Logs 稽核紀錄，同時整合簡單（只要在建立 bucket 時指定 KMS 金鑰），同時滿足三個要求。"}, {"heading": "答案驗證：D（推理高信心，未找到直接核對的原始 ExamTopics 頁面）", "body": "搜尋沒找到這題在 ExamTopics 的原始討論頁（網站擋爬蟲），但根據 Cloud KMS 官方最佳實務文件，CMEK 正是設計給『客戶要控制金鑰生命週期＋需要稽核紀錄＋不想自己架金鑰管理基礎設施』這種情境使用，技術邏輯站得住腳，信心程度高。"}, {"heading": "記憶重點", "body": "看到『想要自己控制/稽核加密金鑰，但又要容易整合』這種組合要求，答案方向幾乎都是 CMEK + Cloud KMS——這是 GCP 原生服務裡唯一同時滿足『客戶掌握金鑰生命週期』和『不用自己蓋基礎設施』的選項。只有題目強調『金鑰完全不能碰 GCP 的任何服務』這種更極端的合規要求時，才會考慮 CSEK（客戶自己帶金鑰上傳）或像 C 選項這種完全自架的方案。"}]}, "tags": ["Cloud Storage", "Cloud KMS/加密", "安全性", "案例研究題"]}, {"id": "T1-Q220", "topic": 1, "qnum": 220, "question": "Altostrat is experiencing fluctuating computational demands for its batch processing jobs. These jobs are not time-critical and can tolerate occasional interruptions. You want to optimize cloud costs and address batch processing needs. What should you do?", "options": [{"letter": "A", "text": "Configure reserved VM instances"}, {"letter": "B", "text": "Deploy spot VM instances."}, {"letter": "C", "text": "Set up standard VM instances."}, {"letter": "D", "text": "Use Cloud Run functions."}], "answer": "B", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383587-exam-professional-cloud-architect-topic-1-question-220/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Reserved VM instances（預留實例）是反方向的做法——先付錢保證一段時間的運算資源，用在長期、穩定、可預測的工作負載上換取折扣，跟『忽高忽低、可容忍中斷』的批次工作完全不搭。"}, {"letter": "B", "analysis": "正確：Spot VM（前身 Preemptible VM）用比正常價格便宜非常多（通常折扣 60~91%）的方式賣出暫時閒置的運算資源，代價是 GCP 可以隨時收回（中斷工作，通常提前約 30 秒通知）。完全對應『忽高忽低需求、不急迫、可容忍中斷、要省錢』四個條件。"}, {"letter": "C", "analysis": "Standard VM instances（標準隨選實例）正常價格、不打折，沒有利用到『可容忍中斷』這個特性去換取成本優化，不是針對這種彈性批次工作的最佳選擇。"}, {"letter": "D", "analysis": "Cloud Run functions 是無伺服器函式執行環境，設計給事件驅動、短時間執行的任務（例如影片轉檔中繼資料擷取），不是用來跑大量運算、持續一段時間的批次處理工作，性質不符。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 的批次處理工作（batch processing jobs）運算需求忽高忽低，這些工作不急迫、可以容忍偶爾被中斷，想在滿足需求的同時優化雲端成本。屬於 Altostrat Media 案例研究題組。"}, {"heading": "答案驗證：B（高信心，屬 GCP 標準概念定義）", "body": "Spot VM 的設計目的跟題目描述幾乎逐字對應：用可被中斷的風險，換取大幅度的價格折扣，專門處理彈性、非固定、能容忍中斷的工作負載，是 GCP 考試『成本優化』類題目的標準套路，不需外部來源額外核對。"}, {"heading": "記憶重點", "body": "看到『運算需求忽高忽低 + 工作不急迫 + 可容忍中斷 + 想省錢』這種組合描述，幾乎可以直接反射選 Spot VM。核心邏輯是『用可被中斷的風險，換取大幅度的價格折扣』——這跟 Reserved（長期穩定換折扣）、Standard（正常價不打折）、Cloud Run（事件驅動短任務）三者的適用情境都不同，要分清楚各自對應的工作負載特性。"}]}, "tags": ["Compute Engine", "成本優化", "案例研究題"]}, {"id": "T1-Q221", "topic": 1, "qnum": 221, "question": "Altostrat's development team is using a microservices architecture for their application. You need to select the most suitable testing approach to ensure that individual microservices function correctly in isolation. What should you do?", "options": [{"letter": "A", "text": "Run unit testing."}, {"letter": "B", "text": "Use load testing."}, {"letter": "C", "text": "Perform end-to-end testing."}, {"letter": "D", "text": "Execute integration testing"}], "answer": "A", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383591-exam-professional-cloud-architect-topic-1-question-221/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["CI/CD", "案例研究題"]}, {"id": "T1-Q222", "topic": 1, "qnum": 222, "question": "Altostrat needs to analyze the performance of its media processing pipeline running on Java-based Cloud Run function. You need to select the most effective tool for the task. What should you do?", "options": [{"letter": "A", "text": "Query logs in Cloud Logging."}, {"letter": "B", "text": "Analyze the data via Cloud Profiler."}, {"letter": "C", "text": "Instrument the code to use Cloud Trace."}, {"letter": "D", "text": "Inspect data from Snapshot Debugger."}], "answer": "B", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383592-exam-professional-cloud-architect-topic-1-question-222/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "Cloud Logging 單純收集、查詢 log 事件紀錄，不是效能分析工具，回答的是『發生了什麼事』，不是『花了多少資源/時間』，不符合『分析效能』的需求。"}, {"letter": "B", "analysis": "正確（中等信心）：Cloud Profiler 持續分析程式碼在執行時 CPU 和記憶體花在哪些函式/區塊上，幾乎零額外設定負擔，原生支援 Java。題目用字『analyze the performance』幾乎是 Google 官方介紹 Profiler 的原文用詞，且題目特別強調『Java-based』呼應 Profiler 對 Java 的良好支援。"}, {"letter": "C", "analysis": "Cloud Trace 是分散式追蹤，分析一個請求跨越多個服務/步驟時每段花多少時間（延遲），常用在微服務架構找出鏈路中最慢的一段。選項寫『Instrument the code』代表要自己動手改程式碼加 trace 埋點，需要額外工程力氣。如果題目強調『pipeline 各階段分別花多少時間』，這個選項也有合理性，是這題比較模稜兩可的地方。"}, {"letter": "D", "analysis": "Snapshot Debugger（Cloud Debugger）在正式環境中即時檢查程式變數狀態，用在抓邏輯錯誤（bug），不是分析效能的工具。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 要分析跑在 Java 版 Cloud Run function 上的媒體處理 pipeline 的效能（performance），問該選哪個最有效的工具。屬於 Altostrat Media 案例研究題組。"}, {"heading": "四個 GCP 可觀測性工具的職責區分", "body": "Cloud Profiler：持續分析程式碼本身在執行時 CPU 和記憶體花在哪，近零額外設定負擔。Cloud Trace：分散式追蹤，分析請求跨多個服務/步驟時每段花多少時間（延遲），常用在微服務架構。Cloud Logging：單純收集查詢 log 事件，不是效能分析工具。Snapshot Debugger：即時檢查程式變數狀態，用來抓邏輯錯誤（bug），不是效能分析。"}, {"heading": "答案驗證：B（中等信心，未找到可交叉比對的外部來源）", "body": "搜尋沒找到這題在 ExamTopics 的原始討論頁。推理依據：題目用字『analyze the performance』幾乎是 Google 官方介紹 Cloud Profiler 的原文用詞，且 Profiler 原生支援 Java（呼應題目特別強調『Java-based』），幾乎不用改程式碼就能用。但選項 C（Cloud Trace）也有一定合理性，如果題目情境更強調『pipeline 各階段分別花多少時間（跨步驟延遲）』，C 會更貼題，這題存在一定模稜兩可空間，不像有些題目那麼篤定。"}, {"heading": "記憶重點", "body": "看到『效能/CPU/記憶體』關鍵字 → 想到 Cloud Profiler；看到『延遲/跨服務請求鏈路』關鍵字 → 想到 Cloud Trace。另一個判斷線索：要不要改程式碼——Profiler 幾乎不用動程式碼，Trace 通常需要手動埋點（除非用自動整合的框架）。"}]}, "tags": ["Cloud Run/Cloud Functions", "Cloud Trace/Profiler", "效能調校", "案例研究題"]}, {"id": "T1-Q223", "topic": 1, "qnum": 223, "question": "Altostrat is concerned about sophisticated, multi-vector Distributed Denial of Service (DDoS) attacks targeting various layers of their infrastructure. DDoS attacks could potentially disrupt video streaming and cause financial losses. You need to mitigate this risk. What should you do?", "options": [{"letter": "A", "text": "Set up VPC Service Controls to restrict access to sensitive resources and prevent data exfiltration."}, {"letter": "B", "text": "Configure Cloud Next Generation Firewall (NGFW) with custom rules to filter malicious traffic at the network level."}, {"letter": "C", "text": "Deploy Google Cloud Armor with pre-configured and custom rules for L3/L4 and L7 protection"}, {"letter": "D", "text": "Activate Security Command Center to monitor security posture and detect potential threats."}], "answer": "C", "caseStudy": "Altostrat Media", "link": "https://www.examtopics.com/discussions/google/view/383588-exam-professional-cloud-architect-topic-1-question-223/", "postedDate": "2026-02-12", "postedYear": 2026, "explanation": {"optionTable": [{"letter": "A", "analysis": "VPC Service Controls 是用來建立安全邊界、防止敏感資料外洩（exfiltration）的工具，跟防禦 DDoS 攻擊是完全不同的目的，不符合題目需求。"}, {"letter": "B", "analysis": "Cloud NGFW 可以做網路層級的流量過濾，但不是專門為大規模 DDoS 設計的服務，沒有 Cloud Armor 那種跟 Google 全球邊緣網路整合、能吸收巨量攻擊流量的能力。"}, {"letter": "C", "analysis": "正確：Cloud Armor 提供 L3/L4（網路層/傳輸層）永遠開啟的流量型攻擊防護，再加上 L7（應用層）可設定的預先配置規則和自訂規則，並有 Adaptive Protection（ML）偵測大流量 L7 DDoS 攻擊。選項用詞幾乎是 Cloud Armor 官方賣點的直接翻版，對應題目『multi-vector DDoS』的描述。"}, {"letter": "D", "analysis": "Security Command Center 是監控/偵測工具，幫忙掌握安全態勢、看到威脅，但不會主動攔截或緩解攻擊流量，是被動的可視性工具，不是主動防禦機制。"}], "notes": [{"heading": "題目在問什麼", "body": "Altostrat 擔心複雜、多向量（multi-vector）的 DDoS 攻擊會打到基礎設施的不同層級，可能中斷影音串流、造成財務損失，問該怎麼降低這個風險。屬於 Altostrat Media 案例研究題組。"}, {"heading": "答案驗證：C（已查證，官方文件用詞與選項高度吻合）", "body": "Google 官方文件對 Cloud Armor 的描述：L3/L4 永遠開啟防護 + L7 需設定的預先配置/自訂規則 + Adaptive Protection 偵測高流量 L7 DDoS，跟選項 C「pre-configured and custom rules for L3/L4 and L7 protection」幾乎逐字對應，信心高。"}, {"heading": "記憶重點", "body": "看到『DDoS 攻擊、多層級、要主動防護/緩解』這種描述，直接反射選 Cloud Armor——這是 GCP 專門對抗 DDoS 的旗艦產品，同時涵蓋 L3/L4（自動）和 L7（需設定規則）防護。VPC Service Controls 是防資料外洩，Security Command Center 是監控偵測不是主動防禦，不要跟 DDoS 防護搞混。"}]}, "tags": ["Cloud Armor", "安全性", "案例研究題"]}, {"id": "T1-Q224", "topic": 1, "qnum": 224, "question": "Altostrat is using Apigee for API management and wants to ensure their APIs are protected from overuse and abuse. You need to implement an Apigee feature to control the total number of API calls for cost management. What should you do?", "options": [{"letter": "A", "text": "Set up API key validation."}, {"letter": "B", "text": "Integrate OAuth 2.0 authorization."}, {"letter": "C", "text": "Configure Quota policies."}, {"letter": "D", "text": "Activate XML threat protection."}
