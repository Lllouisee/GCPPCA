mplementing a single Cloud SQL MySQL second-generation database that contains business-critical transaction data. You want to ensure that the minimum amount of data is lost in case of catastrophic failure. Which two features should you implement? (Choose two.)", "options": [{"letter": "A", "text": "Sharding"}, {"letter": "B", "text": "Read replicas"}, {"letter": "C", "text": "Binary logging"}, {"letter": "D", "text": "Automated backups"}, {"letter": "E", "text": "Semisynchronous replication"}], "answer": "CD", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56369-exam-professional-cloud-architect-topic-1-question-108/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Cloud SQL", "高可用性/災難復原"]}, {"id": "T1-Q109", "topic": 1, "qnum": 109, "question": "You are working at a sports association whose members range in age from 8 to 30. The association collects a large amount of health data, such as sustained injuries. You are storing this data in BigQuery. Current legislation requires you to delete such information upon request of the subject. You want to design a solution that can accommodate such a request. What should you do?", "options": [{"letter": "A", "text": "Use a unique identifier for each individual. Upon a deletion request, delete all rows from BigQuery with this identifier."}, {"letter": "B", "text": "When ingesting new data in BigQuery, run the data through the Data Loss Prevention (DLP) API to identify any personal information. As part of the DLP scan, save the result to Data Catalog. Upon a deletion request, query Data Catalog to find the column with personal information."}, {"letter": "C", "text": "Create a BigQuery view over the table that contains all data. Upon a deletion request, exclude the rows that affect the subject's data from this view. Use this view instead of the source table for all analysis tasks."}, {"letter": "D", "text": "Use a unique identifier for each individual. Upon a deletion request, overwrite the column with the unique identifier with a salted SHA256 of its value."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56381-exam-professional-cloud-architect-topic-1-question-109/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["BigQuery", "Sensitive Data Protection(DLP)", "合規性"]}, {"id": "T1-Q110", "topic": 1, "qnum": 110, "question": "Your company has announced that they will be outsourcing operations functions. You want to allow developers to easily stage new versions of a cloud-based application in the production environment and allow the outsourced operations team to autonomously promote staged versions to production. You want to minimize the operational overhead of the solution. Which Google Cloud product should you migrate to?", "options": [{"letter": "A", "text": "App Engine"}, {"letter": "B", "text": "GKE On-Prem"}, {"letter": "C", "text": "Compute Engine"}, {"letter": "D", "text": "Google Kubernetes Engine"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56840-exam-professional-cloud-architect-topic-1-question-110/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["App Engine", "CI/CD"]}, {"id": "T1-Q111", "topic": 1, "qnum": 111, "question": "Your company is running its application workloads on Compute Engine. The applications have been deployed in production, acceptance, and development environments. The production environment is business-critical and is used 24/7, while the acceptance and development environments are only critical during office hours. Your CFO has asked you to optimize these environments to achieve cost savings during idle times. What should you do?", "options": [{"letter": "A", "text": "Create a shell script that uses the gcloud command to change the machine type of the development and acceptance instances to a smaller machine type outside of office hours. Schedule the shell script on one of the production instances to automate the task."}, {"letter": "B", "text": "Use Cloud Scheduler to trigger a Cloud Function that will stop the development and acceptance environments after office hours and start them just before office hours."}, {"letter": "C", "text": "Deploy the development and acceptance applications on a managed instance group and enable autoscaling."}, {"letter": "D", "text": "Use regular Compute Engine instances for the production environment, and use preemptible VMs for the acceptance and development environments."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56686-exam-professional-cloud-architect-topic-1-question-111/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Compute Engine", "成本優化", "Cloud Run/Cloud Functions"]}, {"id": "T1-Q112", "topic": 1, "qnum": 112, "question": "You are moving an application that uses MySQL from on-premises to Google Cloud. The application will run on Compute Engine and will use Cloud SQL. You want to cut over to the Compute Engine deployment of the application with minimal downtime and no data loss to your customers. You want to migrate the application with minimal modification. You also need to determine the cutover strategy. What should you do?", "options": [{"letter": "A", "text": "1. Set up Cloud VPN to provide private network connectivity between the Compute Engine application and the on-premises MySQL server. 2. Stop the on-premises application. 3. Create a mysqldump of the on-premises MySQL server. 4. Upload the dump to a Cloud Storage bucket. 5. Import the dump into Cloud SQL. 6. Modify the source code of the application to write queries to both databases and read from its local database. 7. Start the Compute Engine application. 8. Stop the on-premises application."}, {"letter": "B", "text": "1. Set up Cloud SQL proxy and MySQL proxy. 2. Create a mysqldump of the on-premises MySQL server. 3. Upload the dump to a Cloud Storage bucket. 4. Import the dump into Cloud SQL. 5. Stop the on-premises application. 6. Start the Compute Engine application."}, {"letter": "C", "text": "1. Set up Cloud VPN to provide private network connectivity between the Compute Engine application and the on-premises MySQL server. 2. Stop the on-premises application. 3. Start the Compute Engine application, configured to read and write to the on-premises MySQL server. 4. Create the replication configuration in Cloud SQL. 5. Configure the source database server to accept connections from the Cloud SQL replica. 6. Finalize the Cloud SQL replica configuration. 7. When replication has been completed, stop the Compute Engine application. 8. Promote the Cloud SQL replica to a standalone instance. 9. Restart the Compute Engine application, configured to read and write to the Cloud SQL standalone instance."}, {"letter": "D", "text": "1. Stop the on-premises application. 2. Create a mysqldump of the on-premises MySQL server. 3. Upload the dump to a Cloud Storage bucket. 4. Import the dump into Cloud SQL. 5. Start the application on Compute Engine."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56692-exam-professional-cloud-architect-topic-1-question-112/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Cloud SQL", "資料遷移", "高可用性/災難復原"]}, {"id": "T1-Q113", "topic": 1, "qnum": 113, "question": "Your organization has decided to restrict the use of external IP addresses on instances to only approved instances. You want to enforce this requirement across all of your Virtual Private Clouds (VPCs). What should you do?", "options": [{"letter": "A", "text": "Remove the default route on all VPCs. Move all approved instances into a new subnet that has a default route to an internet gateway."}, {"letter": "B", "text": "Create a new VPC in custom mode. Create a new subnet for the approved instances, and set a default route to the internet gateway on this new subnet."}, {"letter": "C", "text": "Implement a Cloud NAT solution to remove the need for external IP addresses entirely."}, {"letter": "D", "text": "Set an Organization Policy with a constraint on constraints/compute.vmExternalIpAccess. List the approved instances in the allowedValues list."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56576-exam-professional-cloud-architect-topic-1-question-113/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Organization Policy", "VPC/網路", "安全性"]}, {"id": "T1-Q114", "topic": 1, "qnum": 114, "question": "Your company uses the Firewall Insights feature in the Google Network Intelligence Center. You have several firewall rules applied to Compute Engine instances.You need to evaluate the efficiency of the applied firewall ruleset. When you bring up the Firewall Insights page in the Google Cloud Console, you notice that there are no log rows to display. What should you do to troubleshoot the issue?", "options": [{"letter": "A", "text": "Enable Virtual Private Cloud (VPC) flow logging."}, {"letter": "B", "text": "Enable Firewall Rules Logging for the firewall rules you want to monitor."}, {"letter": "C", "text": "Verify that your user account is assigned the compute.networkAdmin Identity and Access Management (IAM) role."}, {"letter": "D", "text": "Install the Google Cloud SDK, and verify that there are no Firewall logs in the command line output."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56375-exam-professional-cloud-architect-topic-1-question-114/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["VPC/網路", "安全性", "監控與可觀測性"]}, {"id": "T1-Q115", "topic": 1, "qnum": 115, "question": "Your company has sensitive data in Cloud Storage buckets. Data analysts have Identity Access Management (IAM) permissions to read the buckets. You want to prevent data analysts from retrieving the data in the buckets from outside the office network. What should you do?", "options": [{"letter": "A", "text": "1. Create a VPC Service Controls perimeter that includes the projects with the buckets. 2. Create an access level with the CIDR of the office network."}, {"letter": "B", "text": "1. Create a firewall rule for all instances in the Virtual Private Cloud (VPC) network for source range. 2. Use the Classless Inter-domain Routing (CIDR) of the office network."}, {"letter": "C", "text": "1. Create a Cloud Function to remove IAM permissions from the buckets, and another Cloud Function to add IAM permissions to the buckets. 2. Schedule the Cloud Functions with Cloud Scheduler to add permissions at the start of business and remove permissions at the end of business."}, {"letter": "D", "text": "1. Create a Cloud VPN to the office network. 2. Configure Private Google Access for on-premises hosts."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56376-exam-professional-cloud-architect-topic-1-question-115/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Cloud Storage", "VPC/網路", "安全性"]}, {"id": "T1-Q116", "topic": 1, "qnum": 116, "question": "You have developed a non-critical update to your application that is running in a managed instance group, and have created a new instance template with the update that you want to release. To prevent any possible impact to the application, you don't want to update any running instances. You want any new instances that are created by the managed instance group to contain the new update. What should you do?", "options": [{"letter": "A", "text": "Start a new rolling restart operation."}, {"letter": "B", "text": "Start a new rolling replace operation."}, {"letter": "C", "text": "Start a new rolling update. Select the Proactive update mode."}, {"letter": "D", "text": "Start a new rolling update. Select the Opportunistic update mode."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56399-exam-professional-cloud-architect-topic-1-question-116/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "CI/CD"]}, {"id": "T1-Q117", "topic": 1, "qnum": 117, "question": "Your company is designing its application landscape on Compute Engine. Whenever a zonal outage occurs, the application should be restored in another zone as quickly as possible with the latest application data. You need to design the solution to meet this requirement. What should you do?", "options": [{"letter": "A", "text": "Create a snapshot schedule for the disk containing the application data. Whenever a zonal outage occurs, use the latest snapshot to restore the disk in the same zone."}, {"letter": "B", "text": "Configure the Compute Engine instances with an instance template for the application, and use a regional persistent disk for the application data. Whenever a zonal outage occurs, use the instance template to spin up the application in another zone in the same region. Use the regional persistent disk for the application data."}, {"letter": "C", "text": "Create a snapshot schedule for the disk containing the application data. Whenever a zonal outage occurs, use the latest snapshot to restore the disk in another zone within the same region."}, {"letter": "D", "text": "Configure the Compute Engine instances with an instance template for the application, and use a regional persistent disk for the application data. Whenever a zonal outage occurs, use the instance template to spin up the application in another region. Use the regional persistent disk for the application data."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56403-exam-professional-cloud-architect-topic-1-question-117/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "高可用性/災難復原"]}, {"id": "T1-Q118", "topic": 1, "qnum": 118, "question": "Your company has just acquired another company, and you have been asked to integrate their existing Google Cloud environment into your company's data center. Upon investigation, you discover that some of the RFC 1918 IP ranges being used in the new company's Virtual Private Cloud (VPC) overlap with your data center IP space. What should you do to enable connectivity and make sure that there are no routing conflicts when connectivity is established?", "options": [{"letter": "A", "text": "Create a Cloud VPN connection from the new VPC to the data center, create a Cloud Router, and apply new IP addresses so there is no overlapping IP space."}, {"letter": "B", "text": "Create a Cloud VPN connection from the new VPC to the data center, and create a Cloud NAT instance to perform NAT on the overlapping IP space."}, {"letter": "C", "text": "Create a Cloud VPN connection from the new VPC to the data center, create a Cloud Router, and apply a custom route advertisement to block the overlapping IP space."}, {"letter": "D", "text": "Create a Cloud VPN connection from the new VPC to the data center, and apply a firewall rule that blocks the overlapping IP space."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56680-exam-professional-cloud-architect-topic-1-question-118/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["VPC/網路", "Interconnect/VPN"]}, {"id": "T1-Q119", "topic": 1, "qnum": 119, "question": "You need to migrate Hadoop jobs for your company's Data Science team without modifying the underlying infrastructure. You want to minimize costs and infrastructure management effort. What should you do?", "options": [{"letter": "A", "text": "Create a Dataproc cluster using standard worker instances."}, {"letter": "B", "text": "Create a Dataproc cluster using preemptible worker instances."}, {"letter": "C", "text": "Manually deploy a Hadoop cluster on Compute Engine using standard instances."}, {"letter": "D", "text": "Manually deploy a Hadoop cluster on Compute Engine using preemptible instances."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56684-exam-professional-cloud-architect-topic-1-question-119/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Dataflow/Dataproc", "成本優化", "資料遷移"]}, {"id": "T1-Q120", "topic": 1, "qnum": 120, "question": "Your company has a project in Google Cloud with three Virtual Private Clouds (VPCs). There is a Compute Engine instance on each VPC. Network subnets do not overlap and must remain separated. The network configuration is shown below.Instance #1 is an exception and must communicate directly with both Instance #2 and Instance #3 via internal IPs. How should you accomplish this?", "options": [{"letter": "A", "text": "Create a cloud router to advertise subnet #2 and subnet #3 to subnet #1."}, {"letter": "B", "text": "Add two additional NICs to Instance #1 with the following configuration: ג€¢ NIC1 ג—‹ VPC: VPC #2 ג—‹ SUBNETWORK: subnet #2 ג€¢ NIC2 ג—‹ VPC: VPC #3 ג—‹ SUBNETWORK: subnet #3 Update firewall rules to enable traffic between instances."}, {"letter": "C", "text": "Create two VPN tunnels via CloudVPN: ג€¢ 1 between VPC #1 and VPC #2. ג€¢ 1 between VPC #2 and VPC #3. Update firewall rules to enable traffic between the instances."}, {"letter": "D", "text": "Peer all three VPCs: ג€¢ Peer VPC #1 with VPC #2. ג€¢ Peer VPC #2 with VPC #3. Update firewall rules to enable traffic between the instances."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56416-exam-professional-cloud-architect-topic-1-question-120/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["VPC/網路"]}, {"id": "T1-Q121", "topic": 1, "qnum": 121, "question": "You need to deploy an application on Google Cloud that must run on a Debian Linux environment. The application requires extensive configuration in order to operate correctly. You want to ensure that you can install Debian distribution updates with minimal manual intervention whenever they become available. What should you do?", "options": [{"letter": "A", "text": "Create a Compute Engine instance template using the most recent Debian image. Create an instance from this template, and install and configure the application as part of the startup script. Repeat this process whenever a new Google-managed Debian image becomes available."}, {"letter": "B", "text": "Create a Debian-based Compute Engine instance, install and configure the application, and use OS patch management to install available updates."}, {"letter": "C", "text": "Create an instance with the latest available Debian image. Connect to the instance via SSH, and install and configure the application on the instance. Repeat this process whenever a new Google-managed Debian image becomes available."}, {"letter": "D", "text": "Create a Docker container with Debian as the base image. Install and configure the application as part of the Docker image creation process. Host the container on Google Kubernetes Engine and restart the container whenever a new update is available."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57270-exam-professional-cloud-architect-topic-1-question-121/", "postedDate": "2021-07-06", "postedYear": 2021, "tags": ["Compute Engine", "安全性"]}, {"id": "T1-Q122", "topic": 1, "qnum": 122, "question": "You have an application that runs in Google Kubernetes Engine (GKE). Over the last 2 weeks, customers have reported that a specific part of the application returns errors very frequently. You currently have no logging or monitoring solution enabled on your GKE cluster. You want to diagnose the problem, but you have not been able to replicate the issue. You want to cause minimal disruption to the application. What should you do?", "options": [{"letter": "A", "text": "1. Update your GKE cluster to use Cloud Operations for GKE. 2. Use the GKE Monitoring dashboard to investigate logs from affected Pods."}, {"letter": "B", "text": "1. Create a new GKE cluster with Cloud Operations for GKE enabled. 2. Migrate the affected Pods to the new cluster, and redirect traffic for those Pods to the new cluster. 3. Use the GKE Monitoring dashboard to investigate logs from affected Pods."}, {"letter": "C", "text": "1. Update your GKE cluster to use Cloud Operations for GKE, and deploy Prometheus. 2. Set an alert to trigger whenever the application returns an error."}, {"letter": "D", "text": "1. Create a new GKE cluster with Cloud Operations for GKE enabled, and deploy Prometheus. 2. Migrate the affected Pods to the new cluster, and redirect traffic for those Pods to the new cluster. 3. Set an alert to trigger whenever the application returns an error."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56425-exam-professional-cloud-architect-topic-1-question-122/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q123", "topic": 1, "qnum": 123, "question": "You need to deploy a stateful workload on Google Cloud. The workload can scale horizontally, but each instance needs to read and write to the same POSIX filesystem. At high load, the stateful workload needs to support up to 100 MB/s of writes. What should you do?", "options": [{"letter": "A", "text": "Use a persistent disk for each instance."}, {"letter": "B", "text": "Use a regional persistent disk for each instance."}, {"letter": "C", "text": "Create a Cloud Filestore instance and mount it in each instance."}, {"letter": "D", "text": "Create a Cloud Storage bucket and mount it in each instance using gcsfuse."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56384-exam-professional-cloud-architect-topic-1-question-123/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "效能調校"]}, {"id": "T1-Q124", "topic": 1, "qnum": 124, "question": "Your company has an application deployed on Anthos clusters (formerly Anthos GKE) that is running multiple microservices. The cluster has both Anthos ServiceMesh and Anthos Config Management configured. End users inform you that the application is responding very slowly. You want to identify the microservice that is causing the delay. What should you do?", "options": [{"letter": "A", "text": "Use the Service Mesh visualization in the Cloud Console to inspect the telemetry between the microservices."}, {"letter": "B", "text": "Use Anthos Config Management to create a ClusterSelector selecting the relevant cluster. On the Google Cloud Console page for Google Kubernetes Engine, view the Workloads and filter on the cluster. Inspect the configurations of the filtered workloads."}, {"letter": "C", "text": "Use Anthos Config Management to create a namespaceSelector selecting the relevant cluster namespace. On the Google Cloud Console page for Google Kubernetes Engine, visit the workloads and filter on the namespace. Inspect the configurations of the filtered workloads."}, {"letter": "D", "text": "Reinstall istio using the default istio profile in order to collect request latency. Evaluate the telemetry between the microservices in the Cloud Console."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57009-exam-professional-cloud-architect-topic-1-question-124/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["GKE/Kubernetes", "監控與可觀測性"]}, {"id": "T1-Q125", "topic": 1, "qnum": 125, "question": "You are working at a financial institution that stores mortgage loan approval documents on Cloud Storage. Any change to these approval documents must be uploaded as a separate approval file, so you want to ensure that these documents cannot be deleted or overwritten for the next 5 years. What should you do?", "options": [{"letter": "A", "text": "Create a retention policy on the bucket for the duration of 5 years. Create a lock on the retention policy."}, {"letter": "B", "text": "Create the bucket with uniform bucket-level access, and grant a service account the role of Object Writer. Use the service account to upload new files."}, {"letter": "C", "text": "Use a customer-managed key for the encryption of the bucket. Rotate the key after 5 years."}, {"letter": "D", "text": "Create the bucket with fine-grained access control, and grant a service account the role of Object Writer. Use the service account to upload new files."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57007-exam-professional-cloud-architect-topic-1-question-125/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Cloud Storage", "合規性"]}, {"id": "T1-Q126", "topic": 1, "qnum": 126, "question": "Your team will start developing a new application using microservices architecture on Kubernetes Engine. As part of the development lifecycle, any code change that has been pushed to the remote develop branch on your GitHub repository should be built and tested automatically. When the build and test are successful, the relevant microservice will be deployed automatically in the development environment. You want to ensure that all code deployed in the development environment follows this process. What should you do?", "options": [{"letter": "A", "text": "Have each developer install a pre-commit hook on their workstation that tests the code and builds the container when committing on the development branch. After a successful commit, have the developer deploy the newly built container image on the development cluster."}, {"letter": "B", "text": "Install a post-commit hook on the remote git repository that tests the code and builds the container when code is pushed to the development branch. After a successful commit, have the developer deploy the newly built container image on the development cluster."}, {"letter": "C", "text": "Create a Cloud Build trigger based on the development branch that tests the code, builds the container, and stores it in Container Registry. Create a deployment pipeline that watches for new images and deploys the new image on the development cluster. Ensure only the deployment tool has access to deploy new versions."}, {"letter": "D", "text": "Create a Cloud Build trigger based on the development branch to build a new container image and store it in Container Registry. Rely on Vulnerability Scanning to ensure the code tests succeed. As the final step of the Cloud Build process, deploy the new container image on the development cluster. Ensure only Cloud Build has access to deploy new versions."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56702-exam-professional-cloud-architect-topic-1-question-126/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["CI/CD", "GKE/Kubernetes", "容器化"]}, {"id": "T1-Q127", "topic": 1, "qnum": 127, "question": "Your operations team has asked you to help diagnose a performance issue in a production application that runs on Compute Engine. The application is dropping requests that reach it when under heavy load. The process list for affected instances shows a single application process that is consuming all available CPU, and autoscaling has reached the upper limit of instances. There is no abnormal load on any other related systems, including the database. You want to allow production traffic to be served again as quickly as possible. Which action should you recommend?", "options": [{"letter": "A", "text": "Change the autoscaling metric to agent.googleapis.com/memory/percent_used."}, {"letter": "B", "text": "Restart the affected instances on a staggered schedule."}, {"letter": "C", "text": "SSH to each instance and restart the application process."}, {"letter": "D", "text": "Increase the maximum number of instances in the autoscaling group."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56603-exam-professional-cloud-architect-topic-1-question-127/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q128", "topic": 1, "qnum": 128, "question": "You are implementing the infrastructure for a web service on Google Cloud. The web service needs to receive and store the data from 500,000 requests per second. The data will be queried later in real time, based on exact matches of a known set of attributes. There will be periods where the web service will not receive any requests. The business wants to keep costs low. Which web service platform and database should you use for the application?", "options": [{"letter": "A", "text": "Cloud Run and BigQuery"}, {"letter": "B", "text": "Cloud Run and Cloud Bigtable"}, {"letter": "C", "text": "A Compute Engine autoscaling managed instance group and BigQuery"}, {"letter": "D", "text": "A Compute Engine autoscaling managed instance group and Cloud Bigtable"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56612-exam-professional-cloud-architect-topic-1-question-128/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "Bigtable", "無伺服器", "成本優化"]}, {"id": "T1-Q129", "topic": 1, "qnum": 129, "question": "You are developing an application using different microservices that should remain internal to the cluster. You want to be able to configure each microservice with a specific number of replicas. You also want to be able to address a specific microservice from any other microservice in a uniform way, regardless of the number of replicas the microservice scales to. You need to implement this solution on Google Kubernetes Engine. What should you do?", "options": [{"letter": "A", "text": "Deploy each microservice as a Deployment. Expose the Deployment in the cluster using a Service, and use the Service DNS name to address it from other microservices within the cluster."}, {"letter": "B", "text": "Deploy each microservice as a Deployment. Expose the Deployment in the cluster using an Ingress, and use the Ingress IP address to address the Deployment from other microservices within the cluster."}, {"letter": "C", "text": "Deploy each microservice as a Pod. Expose the Pod in the cluster using a Service, and use the Service DNS name to address the microservice from other microservices within the cluster."}, {"letter": "D", "text": "Deploy each microservice as a Pod. Expose the Pod in the cluster using an Ingress, and use the Ingress IP address name to address the Pod from other microservices within the cluster."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57424-exam-professional-cloud-architect-topic-1-question-129/", "postedDate": "2021-07-08", "postedYear": 2021, "tags": ["GKE/Kubernetes", "容器化"]}, {"id": "T1-Q130", "topic": 1, "qnum": 130, "question": "Your company has a networking team and a development team. The development team runs applications on Compute Engine instances that contain sensitive data. The development team requires administrative permissions for Compute Engine. Your company requires all network resources to be managed by the networking team. The development team does not want the networking team to have access to the sensitive data on the instances. What should you do?", "options": [{"letter": "A", "text": "1. Create a project with a standalone VPC and assign the Network Admin role to the networking team. 2. Create a second project with a standalone VPC and assign the Compute Admin role to the development team. 3. Use Cloud VPN to join the two VPCs."}, {"letter": "B", "text": "1. Create a project with a standalone Virtual Private Cloud (VPC), assign the Network Admin role to the networking team, and assign the Compute Admin role to the development team."}, {"letter": "C", "text": "1. Create a project with a Shared VPC and assign the Network Admin role to the networking team. 2. Create a second project without a VPC, configure it as a Shared VPC service project, and assign the Compute Admin role to the development team."}, {"letter": "D", "text": "1. Create a project with a standalone VPC and assign the Network Admin role to the networking team. 2. Create a second project with a standalone VPC and assign the Compute Admin role to the development team. 3. Use VPC Peering to join the two VPCs."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57301-exam-professional-cloud-architect-topic-1-question-130/", "postedDate": "2021-07-06", "postedYear": 2021, "tags": ["VPC/網路", "IAM", "安全性"]}, {"id": "T1-Q131", "topic": 1, "qnum": 131, "question": "Your company wants you to build a highly reliable web application with a few public APIs as the backend. You don't expect a lot of user traffic, but traffic could spike occasionally. You want to leverage Cloud Load Balancing, and the solution must be cost-effective for users. What should you do?", "options": [{"letter": "A", "text": "Store static content such as HTML and images in Cloud CDN. Host the APIs on App Engine and store the user data in Cloud SQL."}, {"letter": "B", "text": "Store static content such as HTML and images in a Cloud Storage bucket. Host the APIs on a zonal Google Kubernetes Engine cluster with worker nodes in multiple zones, and save the user data in Cloud Spanner."}, {"letter": "C", "text": "Store static content such as HTML and images in Cloud CDN. Use Cloud Run to host the APIs and save the user data in Cloud SQL."}, {"letter": "D", "text": "Store static content such as HTML and images in a Cloud Storage bucket. Use Cloud Functions to host the APIs and save the user data in Firestore."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56615-exam-professional-cloud-architect-topic-1-question-131/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Load Balancing", "無伺服器", "成本優化"]}, {"id": "T1-Q132", "topic": 1, "qnum": 132, "question": "Your company sends all Google Cloud logs to Cloud Logging. Your security team wants to monitor the logs. You want to ensure that the security team can react quickly if an anomaly such as an unwanted firewall change or server breach is detected. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Schedule a cron job with Cloud Scheduler. The scheduled job queries the logs every minute for the relevant events."}, {"letter": "B", "text": "Export logs to BigQuery, and trigger a query in BigQuery to process the log data for the relevant events."}, {"letter": "C", "text": "Export logs to a Pub/Sub topic, and trigger Cloud Function with the relevant log events."}, {"letter": "D", "text": "Export logs to a Cloud Storage bucket, and trigger Cloud Run with the relevant log events."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/57043-exam-professional-cloud-architect-topic-1-question-132/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "Pub/Sub", "安全性", "監控與可觀測性"]}, {"id": "T1-Q133", "topic": 1, "qnum": 133, "question": "You have deployed several instances on Compute Engine. As a security requirement, instances cannot have a public IP address. There is no VPN connection between Google Cloud and your office, and you need to connect via SSH into a specific machine without violating the security requirements. What should you do?", "options": [{"letter": "A", "text": "Configure Cloud NAT on the subnet where the instance is hosted. Create an SSH connection to the Cloud NAT IP address to reach the instance."}, {"letter": "B", "text": "Add all instances to an unmanaged instance group. Configure TCP Proxy Load Balancing with the instance group as a backend. Connect to the instance using the TCP Proxy IP."}, {"letter": "C", "text": "Configure Identity-Aware Proxy (IAP) for the instance and ensure that you have the role of IAP-secured Tunnel User. Use the gcloud command line tool to ssh into the instance."}, {"letter": "D", "text": "Create a bastion host in the network to SSH into the bastion host from your office location. From the bastion host, SSH into the desired instance."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56751-exam-professional-cloud-architect-topic-1-question-133/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["IAM", "安全性", "VPC/網路"]}, {"id": "T1-Q134", "topic": 1, "qnum": 134, "question": "Your company is using Google Cloud. You have two folders under the Organization: Finance and Shopping. The members of the development team are in aGoogle Group. The development team group has been assigned the Project Owner role on the Organization. You want to prevent the development team from creating resources in projects in the Finance folder. What should you do?", "options": [{"letter": "A", "text": "Assign the development team group the Project Viewer role on the Finance folder, and assign the development team group the Project Owner role on the Shopping folder."}, {"letter": "B", "text": "Assign the development team group only the Project Viewer role on the Finance folder."}, {"letter": "C", "text": "Assign the development team group the Project Owner role on the Shopping folder, and remove the development team group Project Owner role from the Organization."}, {"letter": "D", "text": "Assign the development team group only the Project Owner role on the Shopping folder."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56975-exam-professional-cloud-architect-topic-1-question-134/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["IAM", "Organization Policy"]}, {"id": "T1-Q135", "topic": 1, "qnum": 135, "question": "You are developing your microservices application on Google Kubernetes Engine. During testing, you want to validate the behavior of your application in case a specific microservice should suddenly crash. What should you do?", "options": [{"letter": "A", "text": "Add a taint to one of the nodes of the Kubernetes cluster. For the specific microservice, configure a pod anti-affinity label that has the name of the tainted node as a value."}, {"letter": "B", "text": "Use Istio's fault injection on the particular microservice whose faulty behavior you want to simulate."}, {"letter": "C", "text": "Destroy one of the nodes of the Kubernetes cluster to observe the behavior."}, {"letter": "D", "text": "Configure Istio's traffic management features to steer the traffic away from a crashing microservice."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56640-exam-professional-cloud-architect-topic-1-question-135/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "高可用性/災難復原"]}, {"id": "T1-Q136", "topic": 1, "qnum": 136, "question": "Your company is developing a new application that will allow globally distributed users to upload pictures and share them with other selected users. The application will support millions of concurrent users. You want to allow developers to focus on just building code without having to create and maintain the underlying infrastructure. Which service should you use to deploy the application?", "options": [{"letter": "A", "text": "App Engine"}, {"letter": "B", "text": "Cloud Endpoints"}, {"letter": "C", "text": "Compute Engine"}, {"letter": "D", "text": "Google Kubernetes Engine"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56754-exam-professional-cloud-architect-topic-1-question-136/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["App Engine", "無伺服器", "自動擴縮"]}, {"id": "T1-Q137", "topic": 1, "qnum": 137, "question": "Your company provides a recommendation engine for retail customers. You are providing retail customers with an API where they can submit a user ID and theAPI returns a list of recommendations for that user. You are responsible for the API lifecycle and want to ensure stability for your customers in case the API makes backward-incompatible changes. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Create a distribution list of all customers to inform them of an upcoming backward-incompatible change at least one month before replacing the old API with the new API."}, {"letter": "B", "text": "Create an automated process to generate API documentation, and update the public API documentation as part of the CI/CD process when deploying an update to the API."}, {"letter": "C", "text": "Use a versioning strategy for the APIs that increases the version number on every backward-incompatible change."}, {"letter": "D", "text": "Use a versioning strategy for the APIs that adds the suffix ג€DEPRECATEDג€ to the current API version number on every backward-incompatible change. Use the current version number for the new API."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56656-exam-professional-cloud-architect-topic-1-question-137/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["CI/CD"]}, {"id": "T1-Q138", "topic": 1, "qnum": 138, "question": "Your company has developed a monolithic, 3-tier application to allow external users to upload and share files. The solution cannot be easily enhanced and lacks reliability. The development team would like to re-architect the application to adopt microservices and a fully managed service approach, but they need to convince their leadership that the effort is worthwhile. Which advantage(s) should they highlight to leadership?", "options": [{"letter": "A", "text": "The new approach will be significantly less costly, make it easier to manage the underlying infrastructure, and automatically manage the CI/CD pipelines."}, {"letter": "B", "text": "The monolithic solution can be converted to a container with Docker. The generated container can then be deployed into a Kubernetes cluster."}, {"letter": "C", "text": "The new approach will make it easier to decouple infrastructure from application, develop and release new features, manage the underlying infrastructure, manage CI/CD pipelines and perform A/B testing, and scale the solution if necessary."}, {"letter": "D", "text": "The process can be automated with Migrate for Compute Engine."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56976-exam-professional-cloud-architect-topic-1-question-138/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["容器化", "CI/CD"]}, {"id": "T1-Q139", "topic": 1, "qnum": 139, "question": "Your team is developing a web application that will be deployed on Google Kubernetes Engine (GKE). Your CTO expects a successful launch and you need to ensure your application can handle the expected load of tens of thousands of users. You want to test the current deployment to ensure the latency of your application stays below a certain threshold. What should you do?", "options": [{"letter": "A", "text": "Use a load testing tool to simulate the expected number of concurrent users and total requests to your application, and inspect the results."}, {"letter": "B", "text": "Enable autoscaling on the GKE cluster and enable horizontal pod autoscaling on your application deployments. Send curl requests to your application, and validate if the auto scaling works."}, {"letter": "C", "text": "Replicate the application over multiple GKE clusters in every Google Cloud region. Configure a global HTTP(S) load balancer to expose the different clusters over a single global IP address."}, {"letter": "D", "text": "Use Cloud Debugger in the development environment to understand the latency between the different microservices."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56706-exam-professional-cloud-architect-topic-1-question-139/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "效能調校", "監控與可觀測性"]}, {"id": "T1-Q140", "topic": 1, "qnum": 140, "question": "Your company has a Kubernetes application that pulls messages from Pub/Sub and stores them in Filestore. Because the application is simple, it was deployed as a single pod. The infrastructure team has analyzed Pub/Sub metrics and discovered that the application cannot process the messages in real time. Most of them wait for minutes before being processed. You need to scale the elaboration process that is I/O-intensive. What should you do?", "options": [{"letter": "A", "text": "Use kubectl autoscale deployment APP_NAME --max 6 --min 2 --cpu-percent 50 to configure Kubernetes autoscaling deployment."}, {"letter": "B", "text": "Configure a Kubernetes autoscaling deployment based on the subscription/push_request_latencies metric."}, {"letter": "C", "text": "Use the --enable-autoscaling flag when you create the Kubernetes cluster."}, {"letter": "D", "text": "Configure a Kubernetes autoscaling deployment based on the subscription/num_undelivered_messages metric."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60396-exam-professional-cloud-architect-topic-1-question-140/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Pub/Sub", "自動擴縮"]}, {"id": "T1-Q141", "topic": 1, "qnum": 141, "question": "Your company is developing a web-based application. You need to make sure that production deployments are linked to source code commits and are fully auditable. What should you do?", "options": [{"letter": "A", "text": "Make sure a developer is tagging the code commit with the date and time of commit."}, {"letter": "B", "text": "Make sure a developer is adding a comment to the commit that links to the deployment."}, {"letter": "C", "text": "Make the container tag match the source code commit hash."}, {"letter": "D", "text": "Make sure the developer is tagging the commits with latest."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60698-exam-professional-cloud-architect-topic-1-question-141/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["CI/CD"]}, {"id": "T1-Q142", "topic": 1, "qnum": 142, "question": "An application development team has come to you for advice. They are planning to write and deploy an HTTP(S) API using Go 1.12. The API will have a very unpredictable workload and must remain reliable during peaks in traffic. They want to minimize operational overhead for this application. Which approach should you recommend?", "options": [{"letter": "A", "text": "Develop the application with containers, and deploy to Google Kubernetes Engine."}, {"letter": "B", "text": "Develop the application for App Engine standard environment."}, {"letter": "C", "text": "Use a Managed Instance Group when deploying to Compute Engine."}, {"letter": "D", "text": "Develop the application for App Engine flexible environment, using a custom runtime."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60437-exam-professional-cloud-architect-topic-1-question-142/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["App Engine", "無伺服器", "自動擴縮"]}, {"id": "T1-Q143", "topic": 1, "qnum": 143, "question": "Your company is designing its data lake on Google Cloud and wants to develop different ingestion pipelines to collect unstructured data from different sources.After the data is stored in Google Cloud, it will be processed in several data pipelines to build a recommendation engine for end users on the website. The structure of the data retrieved from the source systems can change at any time. The data must be stored exactly as it was retrieved for reprocessing purposes in case the data structure is incompatible with the current processing pipelines. You need to design an architecture to support the use case after you retrieve the data. What should you do?", "options": [{"letter": "A", "text": "Send the data through the processing pipeline, and then store the processed data in a BigQuery table for reprocessing."}, {"letter": "B", "text": "Store the data in a BigQuery table. Design the processing pipelines to retrieve the data from the table."}, {"letter": "C", "text": "Send the data through the processing pipeline, and then store the processed data in a Cloud Storage bucket for reprocessing."}, {"letter": "D", "text": "Store the data in a Cloud Storage bucket. Design the processing pipelines to retrieve the data from the bucket."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60682-exam-professional-cloud-architect-topic-1-question-143/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["Cloud Storage", "資料庫Schema設計"]}, {"id": "T1-Q144", "topic": 1, "qnum": 144, "question": "You are responsible for the Google Cloud environment in your company. Multiple departments need access to their own projects, and the members within each department will have the same project responsibilities. You want to structure your Google Cloud environment for minimal maintenance and maximum overview ofIAM permissions as each department's projects start and end. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Grant all department members the required IAM permissions for their respective projects."}, {"letter": "B", "text": "Create a Google Group per department and add all department members to their respective groups. Create a folder per department and grant the respective group the required IAM permissions at the folder level. Add the projects under the respective folders."}, {"letter": "C", "text": "Create a folder per department and grant the respective members of the department the required IAM permissions at the folder level. Structure all projects for each department under the respective folders."}, {"letter": "D", "text": "Create a Google Group per department and add all department members to their respective groups. Grant each group the required IAM permissions for their respective projects."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60743-exam-professional-cloud-architect-topic-1-question-144/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["IAM", "Organization Policy"]}, {"id": "T1-Q145", "topic": 1, "qnum": 145, "question": "Your company has an application running as a Deployment in a Google Kubernetes Engine (GKE) cluster. You have separate clusters for development, staging, and production. You have discovered that the team is able to deploy a Docker image to the production cluster without first testing the deployment in development and then staging. You want to allow the team to have autonomy but want to prevent this from happening. You want a Google Cloud solution that can be implemented quickly with minimal effort. What should you do?", "options": [{"letter": "A", "text": "Configure a Kubernetes lifecycle hook to prevent the container from starting if it is not approved for usage in the given environment."}, {"letter": "B", "text": "Implement a corporate policy to prevent teams from deploying Docker images to an environment unless the Docker image was tested in an earlier environment."}, {"letter": "C", "text": "Configure binary authorization policies for the development, staging, and production clusters. Create attestations as part of the continuous integration pipeline."}, {"letter": "D", "text": "Create a Kubernetes admissions controller to prevent the container from starting if it is not approved for usage in the given environment."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60438-exam-professional-cloud-architect-topic-1-question-145/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["GKE/Kubernetes", "CI/CD", "安全性"]}, {"id": "T1-Q146", "topic": 1, "qnum": 146, "question": "Your company wants to migrate their 10-TB on-premises database export into Cloud Storage. You want to minimize the time it takes to complete this activity, the overall cost, and database load. The bandwidth between the on-premises environment and Google Cloud is 1 Gbps. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Develop a Dataflow job to read data directly from the database and write it into Cloud Storage."}, {"letter": "B", "text": "Use the Data Transfer appliance to perform an offline migration."}, {"letter": "C", "text": "Use a commercial partner ETL solution to extract the data from the on-premises database and upload it into Cloud Storage."}, {"letter": "D", "text": "Compress the data and upload it with gsutil -m to enable multi-threaded copy."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60720-exam-professional-cloud-architect-topic-1-question-146/", "postedDate": "2021-08-26", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移"]}, {"id": "T1-Q147", "topic": 1, "qnum": 147, "question": "Your company has an enterprise application running on Compute Engine that requires high availability and high performance. The application has been deployed on two instances in two zones in the same region in active-passive mode. The application writes data to a persistent disk. In the case of a single zone outage, that data should be immediately made available to the other instance in the other zone. You want to maximize performance while minimizing downtime and data loss.What should you do?", "options": [{"letter": "A", "text": "1. Attach a persistent SSD disk to the first instance. 2. Create a snapshot every hour. 3. In case of a zone outage, recreate a persistent SSD disk in the second instance where data is coming from the created snapshot."}, {"letter": "B", "text": "1. Create a Cloud Storage bucket. 2. Mount the bucket into the first instance with gcs-fuse. 3. In case of a zone outage, mount the Cloud Storage bucket to the second instance with gcs-fuse."}, {"letter": "C", "text": "1. Attach a regional SSD persistent disk to the first instance. 2. In case of a zone outage, force-attach the disk to the other instance."}, {"letter": "D", "text": "1. Attach a local SSD to the first instance disk. 2. Execute an rsync command every hour where the target is a persistent SSD disk attached to the second instance. 3. In case of a zone outage, use the second instance."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60583-exam-professional-cloud-architect-topic-1-question-147/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["Compute Engine", "高可用性/災難復原"]}, {"id": "T1-Q148", "topic": 1, "qnum": 148, "question": "You are designing a Data Warehouse on Google Cloud and want to store sensitive data in BigQuery. Your company requires you to generate the encryption keys outside of Google Cloud. You need to implement a solution. What should you do?", "options": [{"letter": "A", "text": "Generate a new key in Cloud Key Management Service (Cloud KMS). Store all data in Cloud Storage using the customer-managed key option and select the created key. Set up a Dataflow pipeline to decrypt the data and to store it in a new BigQuery dataset."}, {"letter": "B", "text": "Generate a new key in Cloud KMS. Create a dataset in BigQuery using the customer-managed key option and select the created key."}, {"letter": "C", "text": "Import a key in Cloud KMS. Store all data in Cloud Storage using the customer-managed key option and select the created key. Set up a Dataflow pipeline to decrypt the data and to store it in a new BigQuery dataset."}, {"letter": "D", "text": "Import a key in Cloud KMS. Create a dataset in BigQuery using the customer-supplied key option and select the created key."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60439-exam-professional-cloud-architect-topic-1-question-148/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["BigQuery", "Cloud KMS/加密", "安全性"]}, {"id": "T1-Q149", "topic": 1, "qnum": 149, "question": "Your organization has stored sensitive data in a Cloud Storage bucket. For regulatory reasons, your company must be able to rotate the encryption key used to encrypt the data in the bucket. The data will be processed in Dataproc. You want to follow Google-recommended practices for security. What should you do?", "options": [{"letter": "A", "text": "Create a key with Cloud Key Management Service (KMS). Encrypt the data using the encrypt method of Cloud KMS."}, {"letter": "B", "text": "Create a key with Cloud Key Management Service (KMS). Set the encryption key on the bucket to the Cloud KMS key."}, {"letter": "C", "text": "Generate a GPG key pair. Encrypt the data using the GPG key. Upload the encrypted data to the bucket."}, {"letter": "D", "text": "Generate an AES-256 encryption key. Encrypt the data in the bucket using the customer-supplied encryption keys feature."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60440-exam-professional-cloud-architect-topic-1-question-149/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Storage", "Cloud KMS/加密", "安全性"]}, {"id": "T1-Q150", "topic": 1, "qnum": 150, "question": "Your team needs to create a Google Kubernetes Engine (GKE) cluster to host a newly built application that requires access to third-party services on the internet.Your company does not allow any Compute Engine instance to have a public IP address on Google Cloud. You need to create a deployment strategy that adheres to these guidelines. What should you do?", "options": [{"letter": "A", "text": "Configure the GKE cluster as a private cluster, and configure Cloud NAT Gateway for the cluster subnet."}, {"letter": "B", "text": "Configure the GKE cluster as a private cluster. Configure Private Google Access on the Virtual Private Cloud (VPC)."}, {"letter": "C", "text": "Configure the GKE cluster as a route-based cluster. Configure Private Google Access on the Virtual Private Cloud (VPC)."}, {"letter": "D", "text": "Create a Compute Engine instance, and install a NAT Proxy on the instance. Configure all workloads on GKE to pass through this proxy to access third-party services on the Internet."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60441-exam-professional-cloud-architect-topic-1-question-150/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["GKE/Kubernetes", "VPC/網路", "安全性"]}, {"id": "T1-Q151", "topic": 1, "qnum": 151, "question": "Your company has a support ticketing solution that uses App Engine Standard. The project that contains the App Engine application already has a Virtual PrivateCloud (VPC) network fully connected to the company's on-premises environment through a Cloud VPN tunnel. You want to enable the App Engine application to communicate with a database that is running in the company's on-premises environment. What should you do?", "options": [{"letter": "A", "text": "Configure private Google access for on-premises hosts only."}, {"letter": "B", "text": "Configure private Google access."}, {"letter": "C", "text": "Configure private services access."}, {"letter": "D", "text": "Configure serverless VPC access."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60436-exam-professional-cloud-architect-topic-1-question-151/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["App Engine", "無伺服器", "Interconnect/VPN"]}, {"id": "T1-Q152", "topic": 1, "qnum": 152, "question": "Your company is planning to upload several important files to Cloud Storage. After the upload is completed, they want to verify that the uploaded content is identical to what they have on-premises. You want to minimize the cost and effort of performing this check. What should you do?", "options": [{"letter": "A", "text": "1. Use Linux shasum to compute a digest of files you want to upload. 2. Use gsutil -m to upload all the files to Cloud Storage. 3. Use gsutil cp to download the uploaded files. 4. Use Linux shasum to compute a digest of the downloaded files. 5. Compare the hashes."}, {"letter": "B", "text": "1. Use gsutil -m to upload the files to Cloud Storage. 2. Develop a custom Java application that computes CRC32C hashes. 3. Use gsutil ls -L gs://[YOUR_BUCKET_NAME] to collect CRC32C hashes of the uploaded files. 4. Compare the hashes."}, {"letter": "C", "text": "1. Use gsutil -m to upload all the files to Cloud Storage. 2. Use gsutil cp to download the uploaded files. 3. Use Linux diff to compare the content of the files."}, {"letter": "D", "text": "1. Use gsutil -m to upload the files to Cloud Storage. 2. Use gsutil hash -c FILE_NAME to generate CRC32C hashes of all on-premises files. 3. Use gsutil ls -L gs://[YOUR_BUCKET_NAME] to collect CRC32C hashes of the uploaded files. 4. Compare the hashes."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60415-exam-professional-cloud-architect-topic-1-question-152/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移"]}, {"id": "T1-Q153", "topic": 1, "qnum": 153, "question": "You have deployed an application on Anthos clusters (formerly Anthos GKE). According to the SRE practices at your company, you need to be alerted if request latency is above a certain threshold for a specified amount of time. What should you do?", "options": [{"letter": "A", "text": "Install Anthos Service Mesh on your cluster. Use the Google Cloud Console to define a Service Level Objective (SLO), and create an alerting policy based on this SLO."}, {"letter": "B", "text": "Enable the Cloud Trace API on your project, and use Cloud Monitoring Alerts to send an alert based on the Cloud Trace metrics."}, {"letter": "C", "text": "Use Cloud Profiler to follow up the request latency. Create a custom metric in Cloud Monitoring based on the results of Cloud Profiler, and create an Alerting policy in case this metric exceeds the threshold."}, {"letter": "D", "text": "Configure Anthos Config Management on your cluster, and create a yaml file that defines the SLO and alerting policy you want to deploy in your cluster."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60624-exam-professional-cloud-architect-topic-1-question-153/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["GKE/Kubernetes", "監控與可觀測性"]}, {"id": "T1-Q154", "topic": 1, "qnum": 154, "question": "Your company has a stateless web API that performs scientific calculations. The web API runs on a single Google Kubernetes Engine (GKE) cluster. The cluster is currently deployed in us-central1. Your company has expanded to offer your API to customers in Asia. You want to reduce the latency for users in Asia.What should you do?", "options": [{"letter": "A", "text": "Create a second GKE cluster in asia-southeast1, and expose both APIs using a Service of type LoadBalancer. Add the public IPs to the Cloud DNS zone."}, {"letter": "B", "text": "Use a global HTTP(s) load balancer with Cloud CDN enabled."}, {"letter": "C", "text": "Create a second GKE cluster in asia-southeast1, and use kubemci to create a global HTTP(s) load balancer."}, {"letter": "D", "text": "Increase the memory and CPU allocated to the application in the cluster."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60627-exam-professional-cloud-architect-topic-1-question-154/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Load Balancing", "多區域架構", "效能調校", "Cloud CDN"]}, {"id": "T1-Q155", "topic": 1, "qnum": 155, "question": "You are migrating third-party applications from optimized on-premises virtual machines to Google Cloud. You are unsure about the optimum CPU and memory options. The applications have a consistent usage pattern across multiple weeks. You want to optimize resource usage for the lowest cost. What should you do?", "options": [{"letter": "A", "text": "Create an instance template with the smallest available machine type, and use an image of the third-party application taken from a current on-premises virtual machine. Create a managed instance group that uses average CPU utilization to autoscale the number of instances in the group. Modify the average CPU utilization threshold to optimize the number of instances running."}, {"letter": "B", "text": "Create an App Engine flexible environment, and deploy the third-party application using a Dockerfile and a custom runtime. Set CPU and memory options similar to your application's current on-premises virtual machine in the app.yaml file."}, {"letter": "C", "text": "Create multiple Compute Engine instances with varying CPU and memory options. Install the Cloud Monitoring agent, and deploy the third-party application on each of them. Run a load test with high traffic levels on the application, and use the results to determine the optimal settings."}, {"letter": "D", "text": "Create a Compute Engine instance with CPU and memory options similar to your application's current on-premises virtual machine. Install the Cloud Monitoring agent, and deploy the third-party application. Run a load test with normal traffic levels on the application, and follow the Rightsizing Recommendations in the Cloud Console."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60494-exam-professional-cloud-architect-topic-1-question-155/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Compute Engine", "成本優化"]}, {"id": "T1-Q156", "topic": 1, "qnum": 156, "question": "Your company has a Google Cloud project that uses BigQuery for data warehousing. They have a VPN tunnel between the on-premises environment and GoogleCloud that is configured with Cloud VPN. The security team wants to avoid data exfiltration by malicious insiders, compromised code, and accidental oversharing.What should they do?", "options": [{"letter": "A", "text": "Configure Private Google Access for on-premises only."}, {"letter": "B", "text": "Perform the following tasks: 1. Create a service account. 2. Give the BigQuery JobUser role and Storage Reader role to the service account. 3. Remove all other IAM access from the project."}, {"letter": "C", "text": "Configure VPC Service Controls and configure Private Google Access."}, {"letter": "D", "text": "Configure Private Google Access."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60416-exam-professional-cloud-architect-topic-1-question-156/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["BigQuery", "VPC/網路", "安全性"]}, {"id": "T1-Q157", "topic": 1, "qnum": 157, "question": "You are working at an institution that processes medical data. You are migrating several workloads onto Google Cloud. Company policies require all workloads to run on physically separated hardware, and workloads from different clients must also be separated. You created a sole-tenant node group and added a node for each client. You need to deploy the workloads on these dedicated hosts. What should you do?", "options": [{"letter": "A", "text": "Add the node group name as a network tag when creating Compute Engine instances in order to host each workload on the correct node group."}, {"letter": "B", "text": "Add the node name as a network tag when creating Compute Engine instances in order to host each workload on the correct node."}, {"letter": "C", "text": "Use node affinity labels based on the node group name when creating Compute Engine instances in order to host each workload on the correct node group."}, {"letter": "D", "text": "Use node affinity labels based on the node name when creating Compute Engine instances in order to host each workload on the correct node."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60495-exam-professional-cloud-architect-topic-1-question-157/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Compute Engine", "合規性", "安全性"]}, {"id": "T1-Q158", "topic": 1, "qnum": 158, "question": "Your company's test suite is a custom C++ application that runs tests throughout each day on Linux virtual machines. The full test suite takes several hours to complete, running on a limited number of on-premises servers reserved for testing. Your company wants to move the testing infrastructure to the cloud, to reduce the amount of time it takes to fully test a change to the system, while changing the tests as little as possible.Which cloud infrastructure should you recommend?", "options": [{"letter": "A", "text": "Google Compute Engine unmanaged instance groups and Network Load Balancer"}, {"letter": "B", "text": "Google Compute Engine managed instance groups with auto-scaling"}, {"letter": "C", "text": "Google Cloud Dataproc to run Apache Hadoop jobs to process each test"}, {"letter": "D", "text": "Google App Engine with Google StackDriver for logging"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8340-exam-professional-cloud-architect-topic-1-question-158/", "postedDate": "2019-11-16", "postedYear": 2019, "tags": ["Compute Engine", "自動擴縮", "效能調校"]}, {"id": "T1-Q159", "topic": 1, "qnum": 159, "question": "A lead software engineer tells you that his new application design uses websockets and HTTP sessions that are not distributed across the web servers. You want to help him ensure his application will run properly on Google Cloud Platform.What should you do?", "options": [{"letter": "A", "text": "Help the engineer to convert his websocket code to use HTTP streaming"}, {"letter": "B", "text": "Review the encryption requirements for websocket connections with the security team"}, {"letter": "C", "text": "Meet with the cloud operations team and the engineer to discuss load balancer options"}, {"letter": "D", "text": "Help the engineer redesign the application to use a distributed user session service that does not rely on websockets and HTTP sessions."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8341-exam-professional-cloud-architect-topic-1-question-159/", "postedDate": "2019-11-16", "postedYear": 2019, "tags": ["Load Balancing", "自動擴縮"]}, {"id": "T1-Q160", "topic": 1, "qnum": 160, "question": "The application reliability team at your company this added a debug feature to their backend service to send all server events to Google Cloud Storage for eventual analysis. The event records are at least 50 KB and at most 15 MB and are expected to peak at 3,000 events per second. You want to minimize data loss.Which process should you implement?", "options": [{"letter": "A", "text": "ג€¢ Append metadata to file body ג€¢ Compress individual files ג€¢ Name files with serverName ג€\" Timestamp ג€¢ Create a new bucket if bucket is older than 1 hour and save individual files to the new bucket. Otherwise, save files to existing bucket."}, {"letter": "B", "text": "ג€¢ Batch every 10,000 events with a single manifest file for metadata ג€¢ Compress event files and manifest file into a single archive file ג€¢ Name files using serverName ג€\" EventSequence ג€¢ Create a new bucket if bucket is older than 1 day and save the single archive file to the new bucket. Otherwise, save the single archive file to existing bucket."}, {"letter": "C", "text": "ג€¢ Compress individual files ג€¢ Name files with serverName ג€\" EventSequence ג€¢ Save files to one bucket ג€¢ Set custom metadata headers for each object after saving"}, {"letter": "D", "text": "ג€¢ Append metadata to file body ג€¢ Compress individual files ג€¢ Name files with a random prefix pattern ג€¢ Save files to one bucket"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54369-exam-professional-cloud-architect-topic-1-question-160/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["Cloud Storage", "效能調校"]}, {"id": "T1-Q161", "topic": 1, "qnum": 161, "question": "A recent audit revealed that a new network was created in your GCP project. In this network, a GCE instance has an SSH port open to the world. You want to discover this network's origin.What should you do?", "options": [{"letter": "A", "text": "Search for Create VM entry in the Stackdriver alerting console"}, {"letter": "B", "text": "Navigate to the Activity page in the Home section. Set category to Data Access and search for Create VM entry"}, {"letter": "C", "text": "In the Logging section of the console, specify GCE Network as the logging section. Search for the Create Insert entry"}, {"letter": "D", "text": "Connect to the GCE instance using project SSH keys. Identify previous logins in system logs, and match these with the project owners list"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7016-exam-professional-cloud-architect-topic-1-question-161/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "安全性", "監控與可觀測性"]}, {"id": "T1-Q162", "topic": 1, "qnum": 162, "question": "You want to make a copy of a production Linux virtual machine in the US-Central region. You want to manage and replace the copy easily if there are changes on the production virtual machine. You will deploy the copy as a new instance in a different project in the US-East region.What steps must you take?", "options": [{"letter": "A", "text": "Use the Linux dd and netcat commands to copy and stream the root disk contents to a new virtual machine instance in the US-East region."}, {"letter": "B", "text": "Create a snapshot of the root disk and select the snapshot as the root disk when you create a new virtual machine instance in the US-East region."}, {"letter": "C", "text": "Create an image file from the root disk with Linux dd command, create a new virtual machine instance in the US-East region"}, {"letter": "D", "text": "Create a snapshot of the root disk, create an image file in Google Cloud Storage from the snapshot, and create a new virtual machine instance in the US-East region using the image file the root disk."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7018-exam-professional-cloud-architect-topic-1-question-162/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["Compute Engine", "多區域架構"]}, {"id": "T1-Q163", "topic": 1, "qnum": 163, "question": "Your company runs several databases on a single MySQL instance. They need to take backups of a specific database at regular intervals. The backup activity needs to complete as quickly as possible and cannot be allowed to impact disk performance.How should you configure the storage?", "options": [{"letter": "A", "text": "Configure a cron job to use the gcloud tool to take regular backups using persistent disk snapshots."}, {"letter": "B", "text": "Mount a Local SSD volume as the backup location. After the backup is complete, use gsutil to move the backup to Google Cloud Storage."}, {"letter": "C", "text": "Use gcsfise to mount a Google Cloud Storage bucket as a volume directly on the instance and write backups to the mounted location using mysqldump."}, {"letter": "D", "text": "Mount additional persistent disk volumes onto each virtual machine (VM) instance in a RAID10 array and use LVM to create snapshots to send to Cloud Storage"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7020-exam-professional-cloud-architect-topic-1-question-163/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["Compute Engine", "Cloud SQL", "效能調校"]}, {"id": "T1-Q164", "topic": 1, "qnum": 164, "question": "You are helping the QA team to roll out a new load-testing tool to test the scalability of your primary cloud services that run on Google Compute Engine with CloudBigtable.Which three requirements should they include? (Choose three.)", "options": [{"letter": "A", "text": "Ensure that the load tests validate the performance of Cloud Bigtable"}, {"letter": "B", "text": "Create a separate Google Cloud project to use for the load-testing environment"}, {"letter": "C", "text": "Schedule the load-testing tool to regularly run against the production environment"}, {"letter": "D", "text": "Ensure all third-party systems your services use is capable of handling high load"}, {"letter": "E", "text": "Instrument the production services to record every transaction for replay by the load-testing tool"}, {"letter": "F", "text": "Instrument the load-testing tool and the target services with detailed logging and metrics collection"}], "answer": "ABF", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54371-exam-professional-cloud-architect-topic-1-question-164/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["Bigtable", "效能調校", "監控與可觀測性"]}, {"id": "T1-Q165", "topic": 1, "qnum": 165, "question": "Your customer is moving their corporate applications to Google Cloud Platform. The security team wants detailed visibility of all projects in the organization. You provision the Google Cloud Resource Manager and set up yourself as the org admin.What Google Cloud Identity and Access Management (Cloud IAM) roles should you give to the security team?", "options": [{"letter": "A", "text": "Org viewer, project owner"}, {"letter": "B", "text": "Org viewer, project viewer"}, {"letter": "C", "text": "Org admin, project browser"}, {"letter": "D", "text": "Project owner, network admin"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7068-exam-professional-cloud-architect-topic-1-question-165/", "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["IAM"]}, {"id": "T1-Q166", "topic": 1, "qnum": 166, "question": "Your company places a high value on being responsive and meeting customer needs quickly. Their primary business objectives are release speed and agility. You want to reduce the chance of security errors being accidentally introduced.Which two actions can you take? (Choose two.)", "options": [{"letter": "A", "text": "Ensure every code check-in is peer reviewed by a security SME"}, {"letter": "B", "text": "Use source code security analyzers as part of the CI/CD pipeline"}, {"letter": "C", "text": "Ensure you have stubs to unit test all interfaces between components"}, {"letter": "D", "text": "Enable code signing and a trusted binary repository integrated with your CI/CD pipeline"}, {"letter": "E", "text": "Run a vulnerability security scanner as part of your continuous-integration /continuous-delivery (CI/CD) pipeline"}], "answer": "BE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54372-exam-professional-cloud-architect-topic-1-question-166/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["CI/CD", "安全性"]}, {"id": "T1-Q167", "topic": 1, "qnum": 167, "question": "You want to enable your running Google Kubernetes Engine cluster to scale as demand for your application changes.What should you do?", "options": [{"letter": "A", "text": "Add additional nodes to your Kubernetes Engine cluster using the following command: gcloud container clusters resize CLUSTER_Name ג€\" -size 10"}, {"letter": "B", "text": "Add a tag to the instances in the cluster with the following command: gcloud compute instances add-tags INSTANCE - -tags enable- autoscaling max-nodes-10"}, {"letter": "C", "text": "Update the existing Kubernetes Engine cluster with the following command: gcloud alpha container clusters update mycluster - -enable- autoscaling - -min-nodes=1 - -max-nodes=10"}, {"letter": "
