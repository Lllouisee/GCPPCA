{"letter": "A", "text": "Use BigQuery as the data warehouse. Connect all vehicles to the network and stream data into BigQuery using Cloud Pub/Sub and Cloud Dataflow. Use Google Data Studio for analysis and reporting."}, {"letter": "B", "text": "Use BigQuery as the data warehouse. Connect all vehicles to the network and upload gzip files to a Multi-Regional Cloud Storage bucket using gcloud. Use Google Data Studio for analysis and reporting."}, {"letter": "C", "text": "Use Cloud Dataproc Hive as the data warehouse. Upload gzip files to a Multi-Regional Cloud Storage bucket. Upload this data into BigQuery using gcloud. Use Google Data Studio for analysis and reporting."}, {"letter": "D", "text": "Use Cloud Dataproc Hive as the data warehouse. Directly stream data into partitioned Hive tables. Use Pig scripts to analyze data."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/14729-exam-professional-cloud-architect-topic-9-question-5/", "postedDate": "2020-02-23", "postedYear": 2020, "tags": ["BigQuery", "Pub/Sub", "Dataflow/Dataproc", "案例研究題"]}, {"id": "T9-Q6", "topic": 9, "qnum": 6, "question": "You are asked to design a new architecture for the ingestion of the data of the 200,000 vehicles that are connected to a cellular network. You want to follow Google-recommended practices.Considering the technical requirements, which components should you use for the ingestion of the data?", "options": [{"letter": "A", "text": "Google Kubernetes Engine with an SSL Ingress"}, {"letter": "B", "text": "Cloud IoT Core with public/private key pairs"}, {"letter": "C", "text": "Compute Engine with project-wide SSH keys"}, {"letter": "D", "text": "Compute Engine with specific SSH keys"}], "answer": "B", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/6785-exam-professional-cloud-architect-topic-9-question-6/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["安全性", "案例研究題"]}, {"id": "T10-Q1", "topic": 10, "qnum": 1, "question": "You start to build a new application that uses a few Cloud Functions for the backend. One use case requires a Cloud Function func_display to invoke another Cloud Function func_query. You want func_query only to accept invocations from func_display. You also want to follow Google's recommended best practices. What should you do?", "options": [{"letter": "A", "text": "Create a token and pass it in as an environment variable to func_display. When invoking func_query, include the token in the request. Pass the same token to func_query and reject the invocation if the tokens are different."}, {"letter": "B", "text": "Make func_query 'Require authentication.' Create a unique service account and associate it to func_display. Grant the service account invoker role for func_query. Create an id token in func_display and include the token to the request when invoking func_query."}, {"letter": "C", "text": "Make func_query 'Require authentication' and only accept internal traffic. Create those two functions in the same VPC. Create an ingress firewall rule for func_query to only allow traffic from func_display."}, {"letter": "D", "text": "Create those two functions in the same project and VPC. Make func_query only accept internal traffic. Create an ingress firewall for func_query to only allow traffic from func_display. Also, make sure both functions use the same service account."}], "answer": "B", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60524-exam-professional-cloud-architect-topic-10-question-1/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "IAM", "安全性", "案例研究題"]}, {"id": "T10-Q2", "topic": 10, "qnum": 2, "question": "You have broken down a legacy monolithic application into a few containerized RESTful microservices.You want to run those microservices on Cloud Run. You also want to make sure the services are highly available with low latency to your customers. What should you do?", "options": [{"letter": "A", "text": "Deploy Cloud Run services to multiple availability zones. Create Cloud Endpoints that point to the services. Create a global HTTP(S) Load Balancing instance and attach the Cloud Endpoints to its backend."}, {"letter": "B", "text": "Deploy Cloud Run services to multiple regions. Create serverless network endpoint groups pointing to the services. Add the serverless NEGs to a backend service that is used by a global HTTP(S) Load Balancing instance."}, {"letter": "C", "text": "Deploy Cloud Run services to multiple regions. In Cloud DNS, create a latency-based DNS name that points to the services."}, {"letter": "D", "text": "Deploy Cloud Run services to multiple availability zones. Create a TCP/IP global load balancer. Add the Cloud Run Endpoints to its backend service."}], "answer": "B", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60525-exam-professional-cloud-architect-topic-10-question-2/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Run/Cloud Functions", "Load Balancing", "高可用性/災難復原", "多區域架構", "案例研究題"]}, {"id": "T10-Q3", "topic": 10, "qnum": 3, "question": "You are migrating a Linux-based application from your private data center to Google Cloud. TheTerramEarth security team sent you several recent Linux vulnerabilities published by Common Vulnerabilities and Exposures (CVE). You need assistance in understanding how these vulnerabilities could impact your migration. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Open a support case regarding the CVE and chat with the support engineer."}, {"letter": "B", "text": "Read the CVEs from the Google Cloud Status Dashboard to understand the impact."}, {"letter": "C", "text": "Read the CVEs from the Google Cloud Platform Security Bulletins to understand the impact."}, {"letter": "D", "text": "Post a question regarding the CVE in Stack Overflow to get an explanation."}, {"letter": "E", "text": "Post a question regarding the CVE in a Google Cloud discussion group to get an explanation."}], "answer": "AC", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60557-exam-professional-cloud-architect-topic-10-question-3/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["安全性", "案例研究題"]}, {"id": "T10-Q4", "topic": 10, "qnum": 4, "question": "TerramEarth has a legacy web application that you cannot migrate to cloud. However, you still want to build a cloud-native way to monitor the application. If the application goes down, you want the URL to point to a &quot;Site is unavailable&quot; page as soon as possible. You also want your Ops team to receive a notification for the issue. You need to build a reliable solution for minimum cost. What should you do?", "options": [{"letter": "A", "text": "Create a scheduled job in Cloud Run to invoke a container every minute. The container will check the application URL. If the application is down, switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}, {"letter": "B", "text": "Create a cron job on a Compute Engine VM that runs every minute. The cron job invokes a Python program to check the application URL. If the application is down, switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}, {"letter": "C", "text": "Create a Cloud Monitoring uptime check to validate the application URL. If it fails, put a message in a Pub/Sub queue that triggers a Cloud Function to switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}, {"letter": "D", "text": "Use Cloud Error Reporting to check the application URL. If the application is down, switch the URL to the \"Site is unavailable\" page, and notify the Ops team."}], "answer": "C", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60562-exam-professional-cloud-architect-topic-10-question-4/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "Cloud Run/Cloud Functions", "監控與可觀測性", "案例研究題"]}, {"id": "T10-Q5", "topic": 10, "qnum": 5, "question": "You are building a microservice-based application for TerramEarth. The application is based on Docker containers. You want to follow Google-recommended practices to build the application continuously and store the build artifacts. What should you do?", "options": [{"letter": "A", "text": "Configure a trigger in Cloud Build for new source changes. Invoke Cloud Build to build container images for each microservice, and tag them using the code commit hash. Push the images to the Container Registry."}, {"letter": "B", "text": "Configure a trigger in Cloud Build for new source changes. The trigger invokes build jobs and build container images for the microservices. Tag the images with a version number, and push them to Cloud Storage."}, {"letter": "C", "text": "Create a Scheduler job to check the repo every minute. For any new change, invoke Cloud Build to build container images for the microservices. Tag the images using the current timestamp, and push them to the Container Registry."}, {"letter": "D", "text": "Configure a trigger in Cloud Build for new source changes. Invoke Cloud Build to build one container image, and tag the image with the label 'latest.' Push the image to the Container Registry."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60563-exam-professional-cloud-architect-topic-10-question-5/", "postedDate": "2021-08-25", "postedYear": 2021, "tags": ["CI/CD", "容器化", "案例研究題"]}, {"id": "T10-Q6", "topic": 10, "qnum": 6, "question": "TerramEarth has about 1 petabyte (PB) of vehicle testing data in a private data center. You want to move the data to Cloud Storage for your machine learning team. Currently, a 1-Gbps interconnect link is available for you. The machine learning team wants to start using the data in a month. What should you do?", "options": [{"letter": "A", "text": "Request Transfer Appliances from Google Cloud, export the data to appliances, and return the appliances to Google Cloud."}, {"letter": "B", "text": "Configure the Storage Transfer service from Google Cloud to send the data from your data center to Cloud Storage."}, {"letter": "C", "text": "Make sure there are no other users consuming the 1Gbps link, and use multi-thread transfer to upload the data to Cloud Storage."}, {"letter": "D", "text": "Export files to an encrypted USB device, send the device to Google Cloud, and request an import of the data to Cloud Storage."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/60483-exam-professional-cloud-architect-topic-10-question-6/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Cloud Storage", "資料遷移", "案例研究題"]}, {"id": "T11-Q1", "topic": 11, "qnum": 1, "question": "The Dress4Win security team has disabled external SSH access into production virtual machines (VMs) on Google Cloud Platform (GCP).The operations team needs to remotely manage the VMs, build and push Docker containers, and manage Google Cloud Storage objects.What can they do?", "options": [{"letter": "A", "text": "Grant the operations engineer access to use Google Cloud Shell."}, {"letter": "B", "text": "Configure a VPN connection to GCP to allow SSH access to the cloud VMs."}, {"letter": "C", "text": "Develop a new access request process that grants temporary SSH access to cloud VMs when an operations engineer needs to perform a task."}, {"letter": "D", "text": "Have the development team build an API service that allows the operations team to execute specific remote procedure calls to accomplish their tasks."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6660-exam-professional-cloud-architect-topic-11-question-1/", "postedDate": "2019-10-16", "postedYear": 2019, "tags": ["安全性"]}, {"id": "T11-Q2", "topic": 11, "qnum": 2, "question": "At Dress4Win, an operations engineer wants to create a tow-cost solution to remotely archive copies of database backup files.The database files are compressed tar files stored in their current data center.How should he proceed?", "options": [{"letter": "A", "text": "Create a cron script using gsutil to copy the files to a Coldline Storage bucket."}, {"letter": "B", "text": "Create a cron script using gsutil to copy the files to a Regional Storage bucket."}, {"letter": "C", "text": "Create a Cloud Storage Transfer Service Job to copy the files to a Coldline Storage bucket."}, {"letter": "D", "text": "Create a Cloud Storage Transfer Service job to copy the files to a Regional Storage bucket."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/14731-exam-professional-cloud-architect-topic-11-question-2/", "postedDate": "2020-02-23", "postedYear": 2020, "tags": ["Cloud Storage", "成本優化"]}, {"id": "T11-Q3", "topic": 11, "qnum": 3, "question": "Dress4Win has asked you to recommend machine types they should deploy their application servers to.How should you proceed?", "options": [{"letter": "A", "text": "Perform a mapping of the on-premises physical hardware cores and RAM to the nearest machine types in the cloud."}, {"letter": "B", "text": "Recommend that Dress4Win deploy application servers to machine types that offer the highest RAM to CPU ratio available."}, {"letter": "C", "text": "Recommend that Dress4Win deploy into production with the smallest instances available, monitor them over time, and scale the machine type up until the desired performance is reached."}, {"letter": "D", "text": "Identify the number of virtual cores and RAM associated with the application server virtual machines align them to a custom machine type in the cloud, monitor performance, and scale the machine types up until the desired performance is reached."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7261-exam-professional-cloud-architect-topic-11-question-3/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Compute Engine", "成本優化", "效能調校"]}, {"id": "T11-Q4", "topic": 11, "qnum": 4, "question": "As part of Dress4Win's plans to migrate to the cloud, they want to be able to set up a managed logging and monitoring system so they can handle spikes in their traffic load.They want to ensure that:* The infrastructure can be notified when it needs to scale up and down to handle the ebb and flow of usage throughout the day* Their administrators are notified automatically when their application reports errors.* They can filter their aggregated logs down in order to debug one piece of the application across many hostsWhich Google StackDriver features should they use?", "options": [{"letter": "A", "text": "Logging, Alerts, Insights, Debug"}, {"letter": "B", "text": "Monitoring, Trace, Debug, Logging"}, {"letter": "C", "text": "Monitoring, Logging, Alerts, Error Reporting"}, {"letter": "D", "text": "Monitoring, Logging, Debug, Error Report"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6617-exam-professional-cloud-architect-topic-11-question-4/", "postedDate": "2019-10-15", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "自動擴縮"]}, {"id": "T11-Q5", "topic": 11, "qnum": 5, "question": "Dress4Win would like to become familiar with deploying applications to the cloud by successfully deploying some applications quickly, as is. They have asked for your recommendation.What should you advise?", "options": [{"letter": "A", "text": "Identify self-contained applications with external dependencies as a first move to the cloud."}, {"letter": "B", "text": "Identify enterprise applications with internal dependencies and recommend these as a first move to the cloud."}, {"letter": "C", "text": "Suggest moving their in-house databases to the cloud and continue serving requests to on-premise applications."}, {"letter": "D", "text": "Recommend moving their message queuing servers to the cloud and continue handling requests to on-premise applications."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6968-exam-professional-cloud-architect-topic-11-question-5/", "postedDate": "2019-10-22", "postedYear": 2019, "tags": ["資料遷移"]}, {"id": "T11-Q6", "topic": 11, "qnum": 6, "question": "Dress4Win has asked you for advice on how to migrate their on-premises MySQL deployment to the cloud.They want to minimize downtime and performance impact to their on-premises solution during the migration.Which approach should you recommend?", "options": [{"letter": "A", "text": "Create a dump of the on-premises MySQL master server, and then shut it down, upload it to the cloud environment, and load into a new MySQL cluster."}, {"letter": "B", "text": "Setup a MySQL replica server/slave in the cloud environment, and configure it for asynchronous replication from the MySQL master server on-premises until cutover."}, {"letter": "C", "text": "Create a new MySQL cluster in the cloud, configure applications to begin writing to both on premises and cloud MySQL masters, and destroy the original cluster at cutover."}, {"letter": "D", "text": "Create a dump of the MySQL replica server into the cloud environment, load it into: Google Cloud Datastore, and configure applications to read/write to Cloud Datastore at cutover."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9198-exam-professional-cloud-architect-topic-11-question-6/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["Cloud SQL", "資料遷移", "高可用性/災難復原"]}, {"id": "T11-Q7", "topic": 11, "qnum": 7, "question": "Dress4Win has configured a new uptime check with Google Stackdriver for several of their legacy services. The Stackdriver dashboard is not reporting the services as healthy.What should they do?", "options": [{"letter": "A", "text": "Install the Stackdriver agent on all of the legacy web servers."}, {"letter": "B", "text": "In the Cloud Platform Console download the list of the uptime servers' IP addresses and create an inbound firewall rule"}, {"letter": "C", "text": "Configure their load balancer to pass through the User-Agent HTTP header when the value matches GoogleStackdriverMonitoring-UptimeChecks (https:// cloud.google.com/monitoring)"}, {"letter": "D", "text": "Configure their legacy web servers to allow requests that contain user-Agent HTTP header when the value matches GoogleStackdriverMonitoring- UptimeChecks (https://cloud.google.com/monitoring)"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7263-exam-professional-cloud-architect-topic-11-question-7/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "VPC/網路"]}, {"id": "T11-Q8", "topic": 11, "qnum": 8, "question": "As part of their new application experience, Dress4Wm allows customers to upload images of themselves.The customer has exclusive control over who may view these images.Customers should be able to upload images with minimal latency and also be shown their images quickly on the main application page when they log in.Which configuration should Dress4Win use?", "options": [{"letter": "A", "text": "Store image files in a Google Cloud Storage bucket. Use Google Cloud Datastore to maintain metadata that maps each customer's ID and their image files."}, {"letter": "B", "text": "Store image files in a Google Cloud Storage bucket. Add custom metadata to the uploaded images in Cloud Storage that contains the customer's unique ID."}, {"letter": "C", "text": "Use a distributed file system to store customers' images. As storage needs increase, add more persistent disks and/or nodes. Assign each customer a unique ID, which sets each file's owner attribute, ensuring privacy of images."}, {"letter": "D", "text": "Use a distributed file system to store customers' images. As storage needs increase, add more persistent disks and/or nodes. Use a Google Cloud SQL database to maintain metadata that maps each customer's ID to their image files."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8251-exam-professional-cloud-architect-topic-11-question-8/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Cloud Storage", "Datastore/Firestore", "效能調校"]}, {"id": "T11-Q9", "topic": 11, "qnum": 9, "question": "Dress4Win has end-to-end tests covering 100% of their endpoints.They want to ensure that the move to the cloud does not introduce any new bugs.Which additional testing methods should the developers employ to prevent an outage?", "options": [{"letter": "A", "text": "They should enable Google Stackdriver Debugger on the application code to show errors in the code."}, {"letter": "B", "text": "They should add additional unit tests and production scale load tests on their cloud staging environment."}, {"letter": "C", "text": "They should run the end-to-end tests in the cloud staging environment to determine if the code is working as intended."}, {"letter": "D", "text": "They should add canary tests so developers can measure how much of an impact the new release causes to latency."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/14735-exam-professional-cloud-architect-topic-11-question-9/", "postedDate": "2020-02-23", "postedYear": 2020, "tags": ["CI/CD"]}, {"id": "T11-Q10", "topic": 11, "qnum": 10, "question": "You want to ensure Dress4Win's sales and tax records remain available for infrequent viewing by auditors for at least 10 years.Cost optimization is your top priority.Which cloud services should you choose?", "options": [{"letter": "A", "text": "Google Cloud Storage Coldline to store the data, and gsutil to access the data."}, {"letter": "B", "text": "Google Cloud Storage Nearline to store the data, and gsutil to access the data."}, {"letter": "C", "text": "Google Bigtabte with US or EU as location to store the data, and gcloud to access the data."}, {"letter": "D", "text": "BigQuery to store the data, and a web server cluster in a managed instance group to access the data. Google Cloud SQL mirrored across two distinct regions to store the data, and a Redis cluster in a managed instance group to access the data."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9199-exam-professional-cloud-architect-topic-11-question-10/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["Cloud Storage", "成本優化", "合規性"]}, {"id": "T11-Q11", "topic": 11, "qnum": 11, "question": "The current Dress4Win system architecture has high latency to some customers because it is located in one data center.As of a future evaluation and optimizing for performance in the cloud, Dresss4Win wants to distribute its system architecture to multiple locations when Google cloud platform.Which approach should they use?", "options": [{"letter": "A", "text": "Use regional managed instance groups and a global load balancer to increase performance because the regional managed instance group can grow instances in each region separately based on traffic."}, {"letter": "B", "text": "Use a global load balancer with a set of virtual machines that forward the requests to a closer group of virtual machines managed by your operations team."}, {"letter": "C", "text": "Use regional managed instance groups and a global load balancer to increase reliability by providing automatic failover between zones in different regions."}, {"letter": "D", "text": "Use a global load balancer with a set of virtual machines that forward the requests to a closer group of virtual machines as part of a separate managed instance groups."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6802-exam-professional-cloud-architect-topic-11-question-11/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Load Balancing", "Compute Engine", "多區域架構", "效能調校"]}, {"id": "T12-Q1", "topic": 12, "qnum": 1, "question": "Dress4Win is expected to grow to 10 times its size in 1 year with a corresponding growth in data and traffic that mirrors the existing patterns of usage. The CIO has set the target of migrating production infrastructure to the cloud within the next 6 months. How will you configure the solution to scale for this growth without making major application changes and still maximize the ROI?", "options": [{"letter": "A", "text": "Migrate the web application layer to App Engine, and MySQL to Cloud Datastore, and NAS to Cloud Storage. Deploy RabbitMQ, and deploy Hadoop servers using Deployment Manager."}, {"letter": "B", "text": "Migrate RabbitMQ to Cloud Pub/Sub, Hadoop to BigQuery, and NAS to Compute Engine with Persistent Disk storage. Deploy Tomcat, and deploy Nginx using Deployment Manager."}, {"letter": "C", "text": "Implement managed instance groups for Tomcat and Nginx. Migrate MySQL to Cloud SQL, RabbitMQ to Cloud Pub/Sub, Hadoop to Cloud Dataproc, and NAS to Compute Engine with Persistent Disk storage."}, {"letter": "D", "text": "Implement managed instance groups for the Tomcat and Nginx. Migrate MySQL to Cloud SQL, RabbitMQ to Cloud Pub/Sub, Hadoop to Cloud Dataproc, and NAS to Cloud Storage."}], "answer": "D", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/6803-exam-professional-cloud-architect-topic-12-question-1/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Compute Engine", "Cloud SQL", "Pub/Sub", "Dataflow/Dataproc", "自動擴縮", "案例研究題"]}, {"id": "T12-Q2", "topic": 12, "qnum": 2, "question": "Considering the given business requirements, how would you automate the deployment of web and transactional data layers?", "options": [{"letter": "A", "text": "Deploy Nginx and Tomcat using Cloud Deployment Manager to Compute Engine. Deploy a Cloud SQL server to replace MySQL. Deploy Jenkins using Cloud Deployment Manager."}, {"letter": "B", "text": "Deploy Nginx and Tomcat using Cloud Launcher. Deploy a MySQL server using Cloud Launcher. Deploy Jenkins to Compute Engine using Cloud Deployment Manager scripts."}, {"letter": "C", "text": "Migrate Nginx and Tomcat to App Engine. Deploy a Cloud Datastore server to replace the MySQL server in a high-availability configuration. Deploy Jenkins to Compute Engine using Cloud Launcher."}, {"letter": "D", "text": "Migrate Nginx and Tomcat to App Engine. Deploy a MySQL server using Cloud Launcher. Deploy Jenkins to Compute Engine using Cloud Launcher."}], "answer": "A", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/7265-exam-professional-cloud-architect-topic-12-question-2/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Terraform/IaC", "Cloud SQL", "CI/CD", "案例研究題"]}, {"id": "T12-Q3", "topic": 12, "qnum": 3, "question": "Which of the compute services should be migrated as-is and would still be an optimized architecture for performance in the cloud?", "options": [{"letter": "A", "text": "Web applications deployed using App Engine standard environment"}, {"letter": "B", "text": "RabbitMQ deployed using an unmanaged instance group"}, {"letter": "C", "text": "Hadoop/Spark deployed using Cloud Dataproc Regional in High Availability mode"}, {"letter": "D", "text": "Jenkins, monitoring, bastion hosts, security scanners services deployed on custom machine types"}], "answer": "C", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/7266-exam-professional-cloud-architect-topic-12-question-3/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Dataflow/Dataproc", "高可用性/災難復原", "案例研究題"]}, {"id": "T12-Q4", "topic": 12, "qnum": 4, "question": "To be legally compliant during an audit, Dress4Win must be able to give insights in all administrative actions that modify the configuration or metadata of resources on Google Cloud.What should you do?", "options": [{"letter": "A", "text": "Use Stackdriver Trace to create a Trace list analysis."}, {"letter": "B", "text": "Use Stackdriver Monitoring to create a dashboard on the project's activity."}, {"letter": "C", "text": "Enable Cloud Identity-Aware Proxy in all projects, and add the group of Administrators as a member."}, {"letter": "D", "text": "Use the Activity page in the GCP Console and Stackdriver Logging to provide the required insight."}], "answer": "D", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/6805-exam-professional-cloud-architect-topic-12-question-4/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "合規性", "監控與可觀測性", "案例研究題"]}, {"id": "T12-Q5", "topic": 12, "qnum": 5, "question": "You are responsible for the security of data stored in Cloud Storage for your company, Dress4Win. You have already created a set of Google Groups and assigned the appropriate users to those groups. You should use Google best practices and implement the simplest design to meet the requirements.Considering Dress4Win's business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Assign custom IAM roles to the Google Groups you created in order to enforce security requirements. Encrypt data with a customer-supplied encryption key when storing files in Cloud Storage."}, {"letter": "B", "text": "Assign custom IAM roles to the Google Groups you created in order to enforce security requirements. Enable default storage encryption before storing files in Cloud Storage."}, {"letter": "C", "text": "Assign predefined IAM roles to the Google Groups you created in order to enforce security requirements. Utilize Google's default encryption at rest when storing files in Cloud Storage."}, {"letter": "D", "text": "Assign predefined IAM roles to the Google Groups you created in order to enforce security requirements. Ensure that the default Cloud KMS key is set before storing files in Cloud Storage."}], "answer": "C", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/8252-exam-professional-cloud-architect-topic-12-question-5/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Cloud Storage", "IAM", "安全性", "案例研究題"]}, {"id": "T12-Q6", "topic": 12, "qnum": 6, "question": "You want to ensure that your on-premises architecture meets business requirements before you migrate your solution.What change in the on-premises architecture should you make?", "options": [{"letter": "A", "text": "Replace RabbitMQ with Google Pub/Sub."}, {"letter": "B", "text": "Downgrade MySQL to v5.7, which is supported by Cloud SQL for MySQL."}, {"letter": "C", "text": "Resize compute resources to match predefined Compute Engine machine types."}, {"letter": "D", "text": "Containerize the micro-services and host them in Google Kubernetes Engine."}], "answer": "D", "caseStudy": "Dress4Win", "link": "https://www.examtopics.com/discussions/google/view/6807-exam-professional-cloud-architect-topic-12-question-6/", "postedDate": "2019-10-19", "postedYear": 2019, "tags": ["Pub/Sub", "資料遷移", "案例研究題"]}], "caseStudies": {"Altostrat Media": "Company Overview -Altostrat is a prominent player in the media industry, with an extensive collection of audio and video content that comprises podcasts, interviews, news broadcasts, and documentaries. Their success in delivering premium content to a diverse audience requires a content management system that can keep pace with the dynamic media landscape.Solution Concept -Altostrat seeks to modernize its content management and user engagement strategies using Google Cloud's generative AI. They want a platform that empowers customers with personalized recommendations, natural language interactions and seamless self-service support. Simultaneously, they want to drive revenue growth through dynamic pricing targeted marketing, and personalized product suggestions.The seamless integration of AI-powered tools into the existing Google Cloud environment will enable Altostrat to efficiently manage their vast media library, enhance user experiences, and unlock new revenue streams. Google Cloud's generative AI will solidify their leadership in the media industry.Existing Technical Environment -Altostrat’s content management and delivery platform leverages GKE for scalability and high availability, essential for handling their vast media library. Their extensive media library spanning various documents, audio and video formats is stored in Cloud Storage. To gain valuable insights into user behavior, content consumption patterns, and audience demographics, Altostrat leverages BigQuery as their primary data warehouse. Additionally, they use Cloud Run functions for serverless execution of event-driven tasks such as video transcoding metadata extraction, and personalized content recommendations.While Altostrat has made significant strides in cloud adoption, they also maintain some legacy on-premises systems for specific workflows like content ingestion and archival. These systems are slated for modernization and migration to Google Cloud in the near future. User management and authentication are currently handled through a combination of Google Identity and third-party identity providers. For monitoring and observability, Altostrat relies on a mix of native Google Cloud tools like Cloud Monitoring and open-source solutions like Prometheus, with alerts primarily delivered via email notifications.Business Requirements -• Accelerate and enhance the reliability of operational workflows across all environments. [Google Cloud + On-premises]• Simplify infrastructure management for rapid application deployment.• Optimize cloud storage costs while maintaining high availability and scalability for media content.• Enable natural language interaction with the platform with 24/7 user support.• Automatically generate concise summaries of media content.• Extract rich metadata from media assets using NLP and computer vision.• Detect and filter inappropriate content.• Analyze media content to identify trends and extract insights.• Inform content strategy and decision making with data.Technical Requirements -• Modernize CI/CD for containerized deployments with a centralized management platform.• Secure, high-performance hybrid cloud connectivity for data ingestion.• Provide scalable, performant kubernetes environments both on-premises and in the cloud.• Optimize cloud storage costs for growing media volumes.• Design AI-powered detection of harmful content.• Ensure that AI systems are auditable and their decisions can be explained.• Leverage LLMs and conversational AI for personalized experiences and content virality.• Develop advanced chatbots with natural language understanding to provide personalized assistance.• Automated summarization for diverse media.Executive Statement -At Altostrat, we are embracing the next frontier of artificial intelligence to revolutionize our content strategy. By harnessing the power of generative AI, we will create an unparalleled user experience by empowering our audience with intelligent toots for content discovery, personalized recommendations, and seamless interaction. Reliability and cost management are our top priorities. This strategic initiative will deepen engagement, foster customer loyalty, and unlock new revenue streams through targeted marketing and tailored content offerings. We see a future where Al-driven innovation is central to our business, leading to greater success for our company and delivering exceptional value to our customers.", "KnightMotives Automotive": "Company Overview -KnightMotives is a car manufacturer specializing in autonomous, self-driving vehicles, including Battery Electric Vehicles (BEVs), hybrids and traditional internal combustion engine (ICE) vehicles. While KnightMotives has made strides with the in-vehicle experience in their BEV fleet, the hybrid and ICE vehicles have yet to implement these new systems and are viewed poorly by critics and drivers. The lack of modern in-vehicle technology in hybrid and ICE vehicles has resulted in declining sales and customer satisfaction.KnightMotives wants to modernize the consumer experience across all vehicles within five years Artificial Intelligence offers a unique opportunity to revolutionize the in-vehicle experience, as well as the shopping buying and service/maintenance experience. Investment in this new technology will require a shift in financial priorities on a global scale.KnightMotives also wants to improve their online ordering system, which is unreliable. Systems for customers to build their vehicle online for acquisition through a dealer are not delivering the data or reliability that dealers need, causing. A strain in the relationship between KnightMotives and dealers. Service technicians and sales staff need better tooling to enhance dealer successes, including built-to-order vehicles.Solution Concept -KnightMotives wants to shift from manufacturing cars to creating a complete and compelling “automotive experience.” Then strategy prioritizes delivering a consistent experience across all models, developing AI-powered features, generating new revenue from data monetization, adopting a digital focus to differentiate their brand from competitors, and developing better tools for mechanics and salespeople.Existing Technical Environment -KnightMotives's IT is largely on-premises with some applications on major cloud platforms. Their supply chain runs on an outdated mainframe, and Enterprise Resource Planning (ERP) is also outdated, making new promotions and dealer discounts difficult to implement. Dealers have no budget for new equipment. There is fragmentation across vehicles with multiple code bases, and significant technical debt from supporting backwards compatibility. Network connectivity to manufacturing plants and vehicle connectivity in rural areas are challenges.Business Requirements -Key business requirements include fostering a personalized relationship with the driver and delivering a cohesive experience across all models. Creating a better build-to-order model will reduce time on the lot and provide transparency for both dealers and customers. Additionally, KnightMotives seeks to monetize corporate data to finance new technology investments, as their current AI infrastructure is obsolete and corporate data remains siloed. Security is a paramount concern due to past data breaches Adherence to European Union (EU) data protection regulations, especially for emerging autonomous platforms, is critical.KnightMotives plans to make significant investments in fully autonomous driving capabilities, with initial implementation targeting regions with favorable regulatory environments. Prioritizing employee upskilling, attracting top-tier talent, and fostering better communication between business and technical teams are also critical objectives.Technical Requirements -• Modernizing the in-vehicle experience includes developing a consistent user experience (UX) that seamlessly integrates AI-powered features across all models, updating in-vehicle hardware and software in legacy models to support new UX features and AI capabilities, and ensuring reliable network connectivity, especially in rural areas, to support real-time AI features and data transmission.• Network upgrades are necessary to support increased data traffic and improve connectivity between plants and headquarters.• IT infrastructure modernization requires adopting a hybrid cloud strategy to leverage the benefits of both on-premises and cloud infrastructure, and gradually modernizing or replacing legacy systems to improve efficiency and agility.• Autonomous vehicle development and testing requires investing in cutting-edge AI and machine learning technologies, building a robust simulation environment, and ensuring compliance with evolving regulations related to autonomous vehicles.• Data monetization and insights requires implementing a robust data management platform, strict data security and privacy measures, and a scalable AI/ML infrastructure.• Increased focus on security and risk management involves implementing a comprehensive security framework to protect against cyber threats and data breaches, developing an incident response plan, and providing security awareness training to employees.• Providing a delightful experience for dealers and customers requires improving the online build-to-order system; developing modern dealer tools to streamline dealer operations, including sales, service, and inventory management; and implementing a comprehensive Customer Relationship Management (CRM) system to track customer interactions personalize experiences, and improve customer satisfaction.Executive Statement -KnightMotives is committed to enhancing safety and saving lives by leveraging an extensive body of data — encompassing driving, road conditions, behavioral studies, and crash safety statistics — to create compelling digital experiences for drivers. Our AI consistently outperforms national safety statistics, ensuring the unique and coveted KnightMotives experience is aligned across all our vehicle models.Michael Knight, KnightMotives CEO"}, "incomplete": [{"topic": 3, "qnum": 2, "link": "https://www.examtopics.com/discussions/google/view/68709-exam-professional-cloud-architect-topic-3-question-2/"}, {"topic": 8, "qnum": 1, "link": "https://www.examtopics.com/discussions/google/view/11084-exam-professional-cloud-architect-topic-8-question-1/"}]}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const QUESTIONS = DATA.questions;
  const CASE_STUDIES = DATA.caseStudies;
  const INCOMPLETE = DATA.incomplete;
  const STORE_KEY = 'gcpPcaQuizProgress_v1';
  const LAST_QID_KEY = 'gcpPcaQuizLastQid_v1';

  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){ progress = {}; }
  function saveProgress(){ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }

  const CUSTOM_TAG_KEY = 'gcpPcaQuizCustomTags_v1';
  let customTags = {};
  try { customTags = JSON.parse(localStorage.getItem(CUSTOM_TAG_KEY) || '{}'); } catch(e){ customTags = {}; }
  function saveCustomTags(){ localStorage.setItem(CUSTOM_TAG_KEY, JSON.stringify(customTags)); }
  function getTags(q){
    const base = Array.isArray(q.tags) ? q.tags : [];
    const custom = customTags[q.id] || [];
    return [...new Set([...base, ...custom])];
  }
  function allTags(){
    const s = new Set();
    QUESTIONS.forEach(q=>getTags(q).forEach(t=>s.add(t)));
    return [...s].sort((a,b)=>a.localeCompare(b, 'zh-Hant'));
  }

  const topics = [...new Set(QUESTIONS.map(q=>q.topic))].sort((a,b)=>a-b);
  const years = [...new Set(QUESTIONS.map(q=>q.postedYear).filter(y=>y!=null))].sort((a,b)=>a-b);
  let state = {
    mode: 'sequential',
    statusFilter: 'all',
    search: '',
    selectedTopics: new Set(topics),
    selectedYears: new Set(years),
    selectedTags: new Set(allTags()),
    list: [],
    pos: 0,
    submitted: false,
    picked: new Set(),
  };

  document.getElementById('totalCount').textContent = QUESTIONS.length;

  // ---- sidebar: topics ----
  const topicListEl = document.getElementById('topicList');
  topicListEl.innerHTML = topics.map(t=>{
    const count = QUESTIONS.filter(q=>q.topic===t).length;
    return `<label><input type="checkbox" class="topic-cb" value="${t}" checked> Topic ${t} <span class="count">${count}</span></label>`;
  }).join('');
  topicListEl.addEventListener('change', e=>{
    if(!e.target.classList.contains('topic-cb')) return;
    const v = Number(e.target.value);
    if(e.target.checked) state.selectedTopics.add(v); else state.selectedTopics.delete(v);
    rebuildList(true);
  });
  document.getElementById('selectAllTopics').onclick = ()=>{
    state.selectedTopics = new Set(topics);
    topicListEl.querySelectorAll('.topic-cb').forEach(cb=>cb.checked=true);
    rebuildList(true);
  };
  document.getElementById('clearAllTopics').onclick = ()=>{
    state.selectedTopics = new Set();
    topicListEl.querySelectorAll('.topic-cb').forEach(cb=>cb.checked=false);
    rebuildList(true);
  };

  // ---- sidebar: years ----
  const yearListEl = document.getElementById('yearList');
  yearListEl.innerHTML = years.map(y=>{
    const count = QUESTIONS.filter(q=>q.postedYear===y).length;
    return `<label><input type="checkbox" class="year-cb" value="${y}" checked> ${y} <span class="count">${count}</span></label>`;
  }).join('');
  yearListEl.addEventListener('change', e=>{
    if(!e.target.classList.contains('year-cb')) return;
    const v = Number(e.target.value);
    if(e.target.checked) state.selectedYears.add(v); else state.selectedYears.delete(v);
    rebuildList(true);
  });
  document.getElementById('selectAllYears').onclick = ()=>{
    state.selectedYears = new Set(years);
    yearListEl.querySelectorAll('.year-cb').forEach(cb=>cb.checked=true);
    rebuildList(true);
  };
  document.getElementById('clearAllYears').onclick = ()=>{
    state.selectedYears = new Set();
    yearListEl.querySelectorAll('.year-cb').forEach(cb=>cb.checked=false);
    rebuildList(true);
  };

  // ---- sidebar: tags ----
  const tagListEl = document.getElementById('tagList');
  function renderTagList(){
    const tags = allTags();
    if(!tags.length){
      tagListEl.innerHTML = `<div class="qidx-empty">尚無任何 tag</div>`;
      return;
    }
    tagListEl.innerHTML = tags.map(t=>{
      const count = QUESTIONS.filter(q=>getTags(q).includes(t)).length;
      const checked = state.selectedTags.has(t) ? 'checked' : '';
      return `<label><input type="checkbox" class="tag-cb" value="${escapeHtml(t)}" ${checked}> ${escapeHtml(t)} <span class="count">${count}</span></label>`;
    }).join('');
  }
  tagListEl.addEventListener('change', e=>{
    if(!e.target.classList.contains('tag-cb')) return;
    const v = e.target.value;
    if(e.target.checked) state.selectedTags.add(v); else state.selectedTags.delete(v);
    rebuildList(true);
  });
  document.getElementById('selectAllTags').onclick = ()=>{
    state.selectedTags = new Set(allTags());
    renderTagList();
    rebuildList(true);
  };
  document.getElementById('clearAllTags').onclick = ()=>{
    state.selectedTags = new Set();
    renderTagList();
    rebuildList(true);
  };
  function addCustomTag(q, raw){
    const tag = (raw||'').trim();
    if(!tag) return;
    const list = customTags[q.id] || [];
    if(!list.includes(tag)) list.push(tag);
    customTags[q.id] = list;
    saveCustomTags();
    state.selectedTags.add(tag);
    renderTagList();
    renderCard();
  }
  renderTagList();

  // ---- sidebar: mode ----
  document.getElementById('modeSeg').addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;
    document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    rebuildList(true);
  });

  // ---- sidebar: status filter ----
  document.getElementById('statusOpts').addEventListener('change', e=>{
    state.statusFilter = e.target.value;
    rebuildList(true);
  });

  // ---- search ----
  let searchTimer;
  document.getElementById('searchBox').addEventListener('input', e=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      state.search = e.target.value.trim().toLowerCase();
      rebuildList(true);
    }, 150);
  });

  // ---- reset ----
  document.getElementById('resetBtn').onclick = ()=>{
    if(!confirm('確定要清除所有作答紀錄與標記嗎？此動作無法復原。')) return;
    progress = {}; saveProgress();
    rebuildList(true);
  };

  // ---- incomplete note ----
  const incEl = document.getElementById('incompleteNote');
  if(INCOMPLETE.length===0){
    document.getElementById('incompleteSection').style.display='none';
  } else {
    incEl.innerHTML = INCOMPLETE.map(q=>`<a href="${q.link}" target="_blank">Topic ${q.topic} / Q${q.qnum} →</a>`).join('');
  }

  function matchesStatus(q){
    const p = progress[q.id];
    switch(state.statusFilter){
      case 'unanswered': return !p || !p.status;
      case 'wrong': return p && p.status==='wrong';
      case 'correct': return p && p.status==='correct';
      case 'starred': return p && p.starred;
      default: return true;
    }
  }
  function matchesSearch(q){
    if(!state.search) return true;
    const hay = (q.question + ' ' + q.options.map(o=>o.text).join(' ')).toLowerCase();
    return hay.includes(state.search);
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function matchesTags(q){
    const tags = allTags();
    if(state.selectedTags.size >= tags.length) return true;
    const qTags = getTags(q);
    if(!qTags.length) return false;
    return qTags.some(t=>state.selectedTags.has(t));
  }

  function rebuildList(resetPos){
    let list = QUESTIONS.filter(q=>state.selectedTopics.has(q.topic) && state.selectedYears.has(q.postedYear) && matchesTags(q) && matchesStatus(q) && matchesSearch(q));
    if(state.mode==='shuffle') list = shuffle(list);
    state.list = list;
    if(resetPos) state.pos = 0;
    if(state.pos >= list.length) state.pos = Math.max(0, list.length-1);
    state.submitted = false;
    state.picked = new Set();
    renderStats();
    renderCard();
  }

  function renderStats(){
    let answered=0, correct=0, wrong=0;
    QUESTIONS.forEach(q=>{
      const p = progress[q.id];
      if(p && p.status){
        answered++;
        if(p.status==='correct') correct++;
        if(p.status==='wrong') wrong++;
      }
    });
    document.getElementById('statAnswered').textContent = answered;
    document.getElementById('statRemaining').textContent = QUESTIONS.length - answered;
    document.getElementById('statCorrect').textContent = correct;
    document.getElementById('statWrong').textContent = wrong;

    const total = state.list.length;
    const posDisp = total ? state.pos+1 : 0;
    document.getElementById('progressText').textContent = `${posDisp} / ${total}（篩選後）`;
    document.getElementById('progressFill').style.width = total ? `${(posDisp/total)*100}%` : '0%';

    renderQuestionIndex();
  }

  function renderQuestionIndex(){
    const el = document.getElementById('questionIndexList');
    if(!state.list.length){
      el.innerHTML = `<div class="qidx-empty">沒有符合篩選條件的題目</div>`;
      return;
    }
    el.innerHTML = state.list.map((q,idx)=>{
      const p = progress[q.id] || {};
      let icon = '○', statusCls = '';
      if(p.status==='correct'){ icon='✅'; statusCls='correct'; }
      else if(p.status==='wrong'){ icon='❌'; statusCls='wrong'; }
      else if(p.status==='skipped'){ icon='➖'; }
      const star = p.starred ? `<span class="qidx-star">★</span>` : '';
      const active = idx===state.pos ? ' active' : '';
      return `<div class="qidx-item${active}" data-idx="${idx}">
        <span class="qidx-status ${statusCls}">${icon}</span>
        <span class="qidx-label">T${q.topic}·Q${q.qnum}</span>
        ${star}
      </div>`;
    }).join('');
  }

  document.getElementById('questionIndexList').addEventListener('click', e=>{
    const item = e.target.closest('.qidx-item');
    if(!item) return;
    const idx = Number(item.dataset.idx);
    if(Number.isNaN(idx)) return;
    state.pos = idx;
    state.submitted = false;
    state.picked = new Set();
    renderStats();
    renderCard();
  });

  function mdInline(s){
    let t = escapeHtml(s||'');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/`(.+?)`/g, '<code>$1</code>');
    return t;
  }
  function mdBlock(s){
    return String(s||'').split(/\n\n+/).filter(p=>p.trim()).map(p=>`<p>${mdInline(p).replace(/\n/g,'<br>')}</p>`).join('');
  }
  function renderExplanation(q){
    const ex = q.explanation;
    if(!ex) return '';
    if(typeof ex === 'string'){
      return `<div class="explain-box" id="explainBox" style="display:none"><div class="explain-label">💡 解析筆記</div>${escapeHtml(ex)}</div>`;
    }
    let html = '<div class="explain-rich" id="explainBox" style="display:none">';
    if(Array.isArray(ex.optionTable) && ex.optionTable.length){
      const analysisMap = {};
      const zhMap = {};
      ex.optionTable.forEach(r=>{ analysisMap[r.letter] = r.analysis; if(r.zh) zhMap[r.letter] = r.zh; });
      const disputed = !!(q.myAnswer && q.myAnswer !== q.answer);
      const rows = q.options.map(o=>{
        const isStored = q.answer.includes(o.letter);
        const isMine = (q.myAnswer||'').includes(o.letter);
        let cls, icon, badge = '';
        if(disputed){
          if(isMine){ cls='my-answer'; icon='✅'; badge='<span class="my-answer-badge">我認為的正解</span>'; }
          else if(isStored){ cls='community-answer'; icon='〰️'; badge='<span class="community-badge">社群標示答案（存疑）</span>'; }
          else { cls='bad'; icon='❌'; }
        } else {
          cls = isStored ? 'ok' : 'bad';
          icon = isStored ? '✅' : '❌';
        }
        const zhLine = zhMap[o.letter] ? `<div class="zh-translate">${mdInline(zhMap[o.letter])}</div>` : '';
        return `<tr class="${cls}"><td class="opt-letter">${o.letter} ${icon}${badge}</td><td>${mdInline(o.text)}${zhLine}</td><td>${mdInline(analysisMap[o.letter]||'')}</td></tr>`;
      }).join('');
      const questionZh = ex.questionZh ? `<div class="question-zh"><div class="question-zh-label">題目翻譯</div>${mdInline(ex.questionZh)}</div>` : '';
      html += `<div class="acc"><div class="acc-head" data-acc><span class="tri">▼</span><span>📊 完整選項對比</span></div><div class="acc-body">${questionZh}<table class="opt-table"><thead><tr><th>選項</th><th>內容</th><th>分析</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }
    if(Array.isArray(ex.notes) && ex.notes.length){
      const blocks = ex.notes.map(n=>{
        let b = '<div class="note-block">';
        if(n.heading) b += `<div class="note-heading">${escapeHtml(n.heading)}</div>`;
        if(n.body) b += `<div class="note-body">${mdBlock(n.body)}</div>`;
        if(n.diagram) b += `<pre class="note-diagram">${escapeHtml(n.diagram)}</pre>`;
        b += '</div>';
        return b;
      }).join('');
      html += `<div class="acc"><div class="acc-head" data-acc><span class="tri">▼</span><span>📝 學習筆記</span></div><div class="acc-body">${blocks}</div></div>`;
    }
    html += '</div>';
    return html;
  }

  function renderCard(){
    const card = document.getElementById('quizCard');
    const q = state.list[state.pos];
    if(!q){
      card.innerHTML = `<div class="empty-state">沒有符合篩選條件的題目 🎉<br>試著調整左側的 Topic 或狀態篩選。</div>`;
      return;
    }
    try { localStorage.setItem(LAST_QID_KEY, q.id); } catch(e){}
    const effectiveAnswer = q.myAnswer || q.answer;
    const disputed = !!(q.myAnswer && q.myAnswer !== q.answer);
    const isMulti = effectiveAnswer.length > 1;
    const p = progress[q.id] || {};
    const starred = !!p.starred;

    let caseBadge = '';
    let caseBox = '';
    if(q.caseStudy){
      caseBadge = `<span class="case-badge" id="caseToggle">📄 ${escapeHtml(q.caseStudy)} 案例</span>`;
      const text = CASE_STUDIES[q.caseStudy];
      caseBox = `<div class="case-study-box" id="caseBox">${text ? escapeHtml(text) : '（此案例完整背景未收錄於原始資料，僅知題目引用「' + escapeHtml(q.caseStudy) + '」案例）'}</div>`;
    }

    const optionsHtml = q.options.map(o=>{
      return `<label class="option" data-letter="${o.letter}">
        <input type="${isMulti?'checkbox':'radio'}" name="opt" value="${o.letter}">
        <span class="letter">${o.letter}.</span>
        <span class="text">${escapeHtml(o.text)}</span>
      </label>`;
    }).join('');

    const qTags = getTags(q);
    const baseTagSet = new Set(Array.isArray(q.tags) ? q.tags : []);
    const tagsHtml = `<div class="tag-row">${qTags.map(t=>`<span class="tag-chip${baseTagSet.has(t)?'':' custom'}">${escapeHtml(t)}</span>`).join('')}<span class="tag-add"><input type="text" id="newTagInput" placeholder="+ 新增tag" maxlength="24"></span></div>`;

    card.innerHTML = `
      <div class="card-head">
        <span class="badge">Topic ${q.topic} · Q${q.qnum}</span>
        ${q.postedYear?`<span class="badge" title="ExamTopics 最高票留言時間：${q.postedDate}">🗓 ${q.postedYear}</span>`:''}
        ${isMulti?`<span class="badge multi">複選題（${effectiveAnswer.length} 項）</span>`:''}
        ${disputed?`<span class="badge disputed" title="存的官方/社群答案與我的判斷不同，詳見下方解析">⚠️ 答案存疑</span>`:''}
        ${caseBadge}
        <button class="star-btn ${starred?'on':''}" id="starBtn" title="標記本題">★</button>
      </div>
      ${caseBox}
      <div class="question-text">${highlightKeywords(q.question, q.keywords)}</div>
      ${tagsHtml}
      <div class="options" id="optionsEl">${optionsHtml}</div>
      <div class="action-row">
        <button class="btn primary" id="submitBtn" disabled>提交答案</button>
        <button class="btn ghost" id="revealBtn">直接看答案</button>
      </div>
      <div id="resultArea"></div>
      ${renderExplanation(q)}
      <div class="nav-row">
        <button class="btn ghost" id="prevBtn" ${state.pos===0?'disabled':''}>← 上一題</button>
        <div class="mid">
          <button class="btn ghost" id="skipBtn">跳過</button>
        </div>
        <button class="btn ghost" id="nextBtn" ${state.pos>=state.list.length-1?'disabled':''}>下一題 →</button>
      </div>
      <div class="source-link"><a href="${q.link}" target="_blank">在 ExamTopics 查看原始討論與留言 ↗</a>　·　答案為社群多數投票結果，僅供參考，非官方保證正確。</div>
    `;

    if(caseBadge){
      document.getElementById('caseToggle').onclick = ()=>{
        document.getElementById('caseBox').classList.toggle('open');
      };
    }
    document.getElementById('starBtn').onclick = ()=>{
      const cur = progress[q.id] || {};
      cur.starred = !cur.starred;
      progress[q.id] = cur;
      saveProgress();
      renderCard();
    };

    document.getElementById('newTagInput').addEventListener('keydown', e=>{
      if(e.key !== 'Enter') return;
      addCustomTag(q, e.target.value);
      e.target.value = '';
    });

    const optionsEl = document.getElementById('optionsEl');
    const submitBtn = document.getElementById('submitBtn');
    optionsEl.addEventListener('click', e=>{
      if(state.submitted) return;
      const label = e.target.closest('.option');
      if(!label) return;
      const letter = label.dataset.letter;
      const input = label.querySelector('input');
      if(isMulti){
        input.checked = !input.checked;
        if(input.checked) state.picked.add(letter); else state.picked.delete(letter);
      } else {
        optionsEl.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
        state.picked = new Set([letter]);
        input.checked = true;
      }
      label.classList.toggle('selected', input.checked);
      submitBtn.disabled = state.picked.size===0;
    });

    submitBtn.onclick = ()=> doSubmit(q, isMulti, false);
    document.getElementById('revealBtn').onclick = ()=> doSubmit(q, isMulti, true);
    document.getElementById('prevBtn').onclick = ()=>{ state.pos--; state.submitted=false; state.picked=new Set(); renderStats(); renderCard(); };
    document.getElementById('nextBtn').onclick = goNext;
    document.getElementById('skipBtn').onclick = goNext;
  }

  function goNext(){
    state.pos++; state.submitted=false; state.picked=new Set();
    renderStats(); renderCard();
  }

  function doSubmit(q, isMulti, isReveal){
    if(state.submitted) return;
    state.submitted = true;
    const effectiveAnswer = q.myAnswer || q.answer;
    const disputed = !!(q.myAnswer && q.myAnswer !== q.answer);
    const correctSet = new Set(effectiveAnswer.split(''));
    const pickedSet = isReveal ? new Set() : state.picked;
    const isCorrect = !isReveal && pickedSet.size===correctSet.size && [...pickedSet].every(l=>correctSet.has(l));
    const disputedNote = disputed ? `<div class="result-sub">⚠️ 此題社群標示答案是 ${q.answer}，但判斷後我認為 ${q.myAnswer} 才是正解（評分以此為準），理由見下方解析。</div>` : '';

    document.querySelectorAll('#optionsEl .option').forEach(label=>{
      const letter = label.dataset.letter;
      label.classList.add('disabled');
      label.querySelector('input').disabled = true;
      if(correctSet.has(letter)) label.classList.add('correct');
      else if(pickedSet.has(letter)) label.classList.add('wrong');
    });

    const resultArea = document.getElementById('resultArea');
    if(isReveal){
      resultArea.innerHTML = `<div class="result-banner" style="background:#eef1f8;color:#444">正確答案：${effectiveAnswer}${disputedNote}<div class="result-sub">此題已標記為「跳過」，不計入答對/答錯統計。</div></div>`;
      const cur = progress[q.id] || {};
      if(!cur.status) cur.status = 'skipped';
      progress[q.id] = cur; saveProgress();
    } else {
      resultArea.innerHTML = isCorrect
        ? `<div class="result-banner ok">✅ 答對了！正確答案：${effectiveAnswer}${disputedNote}</div>`
        : `<div class="result-banner bad">❌ 答錯了。正確答案：${effectiveAnswer}<div class="result-sub">你選的是：${[...pickedSet].sort().join('')||'（無）'}</div>${disputedNote}</div>`;
      const cur = progress[q.id] || {};
      cur.status = isCorrect ? 'correct' : 'wrong';
      cur.lastPicked = [...pickedSet];
      progress[q.id] = cur; saveProgress();
    }
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('explainBox')?.style.setProperty('display','block');
    renderStats();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlightKeywords(text, keywords){
    text = text || '';
    if(!keywords || !keywords.length) return escapeHtml(text);
    let ranges = [];
    keywords.forEach(kw=>{
      if(!kw) return;
      let idx = 0;
      while(true){
        const pos = text.indexOf(kw, idx);
        if(pos === -1) break;
        ranges.push([pos, pos+kw.length]);
        idx = pos + kw.length;
      }
    });
    ranges.sort((a,b)=>a[0]-b[0]);
    const merged = [];
    let lastEnd = -1;
    ranges.forEach(([s,e])=>{
      if(s >= lastEnd){ merged.push([s,e]); lastEnd = e; }
    });
    let out = '', cursor = 0;
    merged.forEach(([s,e])=>{
      out += escapeHtml(text.slice(cursor, s));
      out += `<mark class="kw-highlight">${escapeHtml(text.slice(s,e))}</mark>`;
      cursor = e;
    });
    out += escapeHtml(text.slice(cursor));
    return out;
  }

  // keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT' && e.target.type==='text') return;
    if(e.key==='ArrowRight'){ document.getElementById('nextBtn')?.click(); }
    if(e.key==='ArrowLeft'){ document.getElementById('prevBtn')?.click(); }
    if(e.key==='Enter'){ document.getElementById('submitBtn')?.click(); }
    const letters = 'ABCDEFGH';
    const idx = letters.indexOf(e.key.toUpperCase());
    if(idx>=0){
      const label = document.querySelector(`.option[data-letter="${e.key.toUpperCase()}"]`);
      if(label) label.click();
    }
  });

  document.getElementById('quizCard').addEventListener('click', e=>{
    const head = e.target.closest('[data-acc]');
    if(!head) return;
    const body = head.nextElementSibling;
    const collapsing = !head.classList.contains('collapsed');
    head.classList.toggle('collapsed', collapsing);
    body.classList.toggle('collapsed', collapsing);
  });

  let restoredQid = null;
  try { restoredQid = localStorage.getItem(LAST_QID_KEY); } catch(e){}

  rebuildList(true);

  if(restoredQid){
    const idx = state.list.findIndex(q=>q.id===restoredQid);
    if(idx >= 0 && idx !== state.pos){
      state.pos = idx;
      renderStats();
      renderCard();
    }
  }
})();
</script>

<script>
(function(){
  // ---- tab switching ----
  document.querySelectorAll('.app-tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.app-tabs button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('quizPanel').style.display = tab==='quiz' ? 'flex' : 'none';
      document.getElementById('mindmapPanel').style.display = tab==='mindmap' ? 'flex' : 'none';
      if(tab==='mindmap') requestAnimationFrame(renderEdges);
    });
  });

  // ---- mind map ----
  const STORE_KEY_MM = 'gcpPcaMindMap_v1';
  const PALETTE = ['#3b6fd6','#1d9a6c','#b9820a','#d64545','#7c5cd6','#0ea5a5','#c2478a','#6b7280'];
  const PROMPT_TEMPLATE = `請幫我把以下 GCP Professional Cloud Architect 考題重點，整理成心智圖用的 JSON（只要輸出 JSON 本身，不要任何其他說明文字或 markdown 標記）。

請嚴格按照以下格式輸出：
{
  "groups": [
    {
      "id": "g1",
      "name": "分組名稱（例如：運算服務 / 儲存與資料庫 / 網路 / 安全與 IAM / 資料分析 / 成本與治理...）",
      "color": "#3b6fd6",
      "nodes": [
        { "id": "n1", "title": "重點標題（簡短）", "detail": "重點說明，1~3 句話" }
      ]
    }
  ],
  "edges": [
    { "from": "n1", "to": "n2", "label": "關聯說明（選填，可省略這個欄位）" }
  ]
}

規則：
1. 依服務類別或考試主題分組，每組 5~10 個重點即可，太多就再拆分組。
2. title 要短，detail 補充「為什麼／什麼情境用」這種容易忘記的重點，不要整段複製題目。
3. edges 只在「真的有關聯」時才加（例如互相替代的服務、常考的情境組合），完全不相關就不要硬湊關聯。
4. id 用不會重複的短字串（像 g1、n1、n2...）即可，不用是真的 UUID。
5. color 從這幾個挑一個就好：#3b6fd6 #1d9a6c #b9820a #d64545 #7c5cd6 #0ea5a5 #c2478a #6b7280

以下是我要你整理的內容：
（在這裡貼上題目、答案或你自己的筆記）
`;

  function genId(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id'+Math.random().toString(36).slice(2)+Date.now().toString(36)); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function loadMindMap(){
    try{
      const d = JSON.parse(localStorage.getItem(STORE_KEY_MM));
      if(d && Array.isArray(d.groups)) return { groups: d.groups, edges: Array.isArray(d.edges)?d.edges:[] };
    }catch(e){}
    return { groups: [], edges: [] };
  }
  let mindData = loadMindMap();
  function saveMindMap(){ localStorage.setItem(STORE_KEY_MM, JSON.stringify(mindData)); }
  function findNode(nid){
    for(const g of mindData.groups){ const n = g.nodes.find(x=>x.id===nid); if(n) return n; }
    return null;
  }

  const state = { linking: false, linkFrom: null };
  const board = document.getElementById('mmBoard');
  const svg = document.getElementById('mmEdgesSvg');

  function showModal(html){
    const bg = document.createElement('div');
    bg.className = 'mm-modal-bg';
    bg.innerHTML = `<div class="mm-modal">${html}</div>`;
    document.body.appendChild(bg);
    bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
    return bg;
  }

  function openImportModal(){
    const bg = showModal(`
      <h3>匯入心智圖 JSON</h3>
      <div class="hint">貼上 groups（必要）與 edges（選填）結構的 JSON，可直接貼 AI 依範本產生的結果。匯入會覆蓋目前的心智圖。</div>
      <textarea id="mmImportArea" placeholder='{"groups":[{"id":"g1","name":"運算服務","color":"#3b6fd6","nodes":[{"id":"n1","title":"Compute Engine","detail":"..."}]}],"edges":[{"from":"n1","to":"n2","label":"可互相替代"}]}'></textarea>
      <div class="err" id="mmImportErr"></div>
      <div class="row">
        <button class="btn ghost" id="mmImportCancel">取消</button>
        <button class="btn primary" id="mmImportConfirm">匯入（覆蓋目前內容）</button>
      </div>
    `);
    bg.querySelector('#mmImportCancel').onclick = ()=>bg.remove();
    bg.querySelector('#mmImportConfirm').onclick = ()=>{
      const raw = bg.querySelector('#mmImportArea').value;
      try{
        const parsed = JSON.parse(raw);
        if(!parsed || !Array.isArray(parsed.groups)) throw new Error('缺少 groups 陣列');
        parsed.groups.forEach(g=>{
          if(!g.id) g.id = genId();
          if(!g.color) g.color = PALETTE[0];
          if(!Array.isArray(g.nodes)) g.nodes = [];
          g.nodes.forEach(n=>{ if(!n.id) n.id = genId(); if(n.detail==null) n.detail=''; });
        });
        if(!Array.isArray(parsed.edges)) parsed.edges = [];
        mindData = { groups: parsed.groups, edges: parsed.edges };
        saveMindMap();
        renderMindMap();
        bg.remove();
      }catch(err){
        bg.querySelector('#mmImportErr').textContent = 'JSON 格式錯誤：' + err.message;
      }
    };
  }

  function openExportModal(){
    const json = JSON.stringify(mindData, null, 2);
    const bg = showModal(`
      <h3>匯出心智圖 JSON</h3>
      <textarea id="mmExportArea" readonly>${escapeHtml(json)}</textarea>
      <div class="row">
        <button class="btn ghost" id="mmExportClose">關閉</button>
        <button class="btn primary" id="mmExportCopy">複製</button>
      </div>
    `);
    bg.querySelector('#mmExportClose').onclick = ()=>bg.remove();
    bg.querySelector('#mmExportCopy').onclick = (e)=>{
      navigator.clipboard.writeText(json).then(()=>{
        const b = e.currentTarget; const old = b.textContent;
        b.textContent = '已複製 ✓'; setTimeout(()=>b.textContent = old, 1200);
      });
    };
  }

  function addGroup(){
    const g = { id: genId(), name: '新分組', color: PALETTE[mindData.groups.length % PALETTE.length], nodes: [] };
    mindData.groups.push(g);
    saveMindMap();
    renderMindMap();
    const el = document.querySelector(`.mm-group[data-group-id="${g.id}"] .name`);
    if(el){ el.focus(); document.execCommand('selectAll', false, null); }
  }

  function addNodeToGroup(gid){
    const g = mindData.groups.find(x=>x.id===gid); if(!g) return;
    const n = { id: genId(), title: '新重點', detail: '' };
    g.nodes.push(n);
    saveMindMap();
    renderMindMap();
    const el = document.querySelector(`.mm-node[data-node-id="${n.id}"] .title`);
    if(el){ el.focus(); document.execCommand('selectAll', false, null); }
  }

  function deleteGroup(gid){
    const g = mindData.groups.find(x=>x.id===gid); if(!g) return;
    const ids = new Set(g.nodes.map(n=>n.id));
    mindData.edges = mindData.edges.filter(ed=>!ids.has(ed.from) && !ids.has(ed.to));
    mindData.groups = mindData.groups.filter(x=>x.id!==gid);
    saveMindMap();
    renderMindMap();
  }

  function deleteNode(nid){
    for(const g of mindData.groups){
      const i = g.nodes.findIndex(n=>n.id===nid);
      if(i>=0){ g.nodes.splice(i,1); break; }
    }
    mindData.edges = mindData.edges.filter(ed=>ed.from!==nid && ed.to!==nid);
    saveMindMap();
    renderMindMap();
  }

  function cycleGroupColor(gid){
    const g = mindData.groups.find(x=>x.id===gid); if(!g) return;
    const idx = (PALETTE.indexOf(g.color) + 1) % PALETTE.length;
    g.color = PALETTE[idx<0?0:idx];
    saveMindMap();
    renderMindMap();
  }

  function deleteEdge(eid){
    mindData.edges = mindData.edges.filter(ed=>ed.id!==eid);
    saveMindMap();
    renderEdges();
  }

  function editEdgeLabel(eid){
    const ed = mindData.edges.find(x=>x.id===eid); if(!ed) return;
    const val = prompt('編輯關聯說明（留空可清除）：', ed.label||'');
    if(val===null) return;
    ed.label = val;
    saveMindMap();
    renderEdges();
  }

  function handleLinkClick(nodeEl){
    const id = nodeEl.dataset.nodeId;
    if(!state.linkFrom){
      state.linkFrom = id;
      nodeEl.classList.add('linking-from');
      return;
    }
    if(state.linkFrom === id){
      nodeEl.classList.remove('linking-from');
      state.linkFrom = null;
      return;
    }
    const exists = mindData.edges.some(ed=>(ed.from===state.linkFrom && ed.to===id) || (ed.from===id && ed.to===state.linkFrom));
    if(!exists){
      const label = prompt('關聯說明（可留空）：', '') || '';
      mindData.edges.push({ id: genId(), from: state.linkFrom, to: id, label });
      saveMindMap();
    }
    document.querySelector('.mm-node.linking-from')?.classList.remove('linking-from');
    state.linkFrom = null;
    renderEdges();
  }

  function liveUpdateField(field){
    const type = field.dataset.field;
    const text = field.textContent;
    if(type==='name'){
      const gid = field.closest('.mm-group').dataset.groupId;
      const g = mindData.groups.find(x=>x.id===gid); if(g) g.name = text;
    } else if(type==='title' || type==='detail'){
      const nid = field.closest('.mm-node').dataset.nodeId;
      const n = findNode(nid); if(n) n[type] = text;
    }
  }

  let edgeRedrawScheduled = false;
  function scheduleEdgeRedraw(){
    if(edgeRedrawScheduled) return;
    edgeRedrawScheduled = true;
    requestAnimationFrame(()=>{ edgeRedrawScheduled = false; renderEdges(); });
  }

  function renderMindMap(){
    [...board.children].forEach(ch=>{ if(ch.id!=='mmEdgesSvg') ch.remove(); });
    board.querySelectorAll('.mm-edge-del,.mm-edge-label').forEach(el=>el.remove());

    if(mindData.groups.length===0){
      const empty = document.createElement('div');
      empty.className = 'mm-empty';
      empty.innerHTML = `目前還沒有任何分組<br>可以手動新增，或請 AI 依照提示詞範本產生 JSON 後直接匯入。<br><button class="btn primary" id="mmEmptyAdd">＋ 新增第一個分組</button> <button class="btn ghost" id="mmEmptyImport">匯入 JSON</button>`;
      board.appendChild(empty);
      empty.querySelector('#mmEmptyAdd').onclick = addGroup;
      empty.querySelector('#mmEmptyImport').onclick = openImportModal;
    } else {
      mindData.groups.forEach(g=>{
        const col = document.createElement('div');
        col.className = 'mm-group';
        col.dataset.groupId = g.id;
        col.innerHTML = `
          <div class="mm-group-head" style="--grp-color:${g.color}">
            <span class="dot" data-role="colorpick" title="點擊切換顏色"></span>
            <div class="name" contenteditable="true" data-field="name" data-placeholder="分組名稱">${escapeHtml(g.name)}</div>
            <button class="del" data-role="delgroup" title="刪除分組">✕</button>
          </div>
          <div class="mm-group-body">
            ${g.nodes.map(n=>`
              <div class="mm-node" data-node-id="${n.id}">
                <button class="del" data-role="delnode" title="刪除重點">✕</button>
                <div class="title" contenteditable="true" data-field="title" data-placeholder="重點標題">${escapeHtml(n.title)}</div>
                <div class="detail" contenteditable="true" data-field="detail" data-placeholder="補充說明...">${escapeHtml(n.detail||'')}</div>
              </div>`).join('')}
          </div>
          <button class="mm-add-node" data-role="addnode">＋ 新增重點</button>
        `;
        board.appendChild(col);
      });
    }
    requestAnimationFrame(renderEdges);
  }

  function centerOf(el){
    const r = el.getBoundingClientRect();
    const br = board.getBoundingClientRect();
    return { x: r.left - br.left + r.width/2, y: r.top - br.top + r.height/2, w: r.width, h: r.height, left: r.left - br.left, top: r.top - br.top };
  }
  function anchorPoint(c, side){
    switch(side){
      case 'left': return { x: c.left, y: c.y };
      case 'right': return { x: c.left + c.w, y: c.y };
      case 'top': return { x: c.x, y: c.top };
      case 'bottom': return { x: c.x, y: c.top + c.h };
    }
  }

  function renderEdges(){
    svg.innerHTML = `<defs><marker id="mmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b8"/></marker></defs>`;
    board.querySelectorAll('.mm-edge-del,.mm-edge-label').forEach(el=>el.remove());

    const w = board.scrollWidth, h = board.scrollHeight;
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.style.width = w + 'px';
    svg.style.height = h + 'px';

    mindData.edges.forEach(ed=>{
      const fromEl = board.querySelector(`.mm-node[data-node-id="${ed.from}"]`);
      const toEl = board.querySelector(`.mm-node[data-node-id="${ed.to}"]`);
      if(!fromEl || !toEl) return;
      const c1 = centerOf(fromEl), c2 = centerOf(toEl);
      const dx = c2.x - c1.x, dy = c2.y - c1.y;
      let p1, p2, d;
      if(Math.abs(dx) >= Math.abs(dy)){
        p1 = anchorPoint(c1, dx>=0?'right':'left');
        p2 = anchorPoint(c2, dx>=0?'left':'right');
        const midX = (p1.x+p2.x)/2;
        d = `M ${p1.x} ${p1.y} C ${midX} ${p1.y}, ${midX} ${p2.y}, ${p2.x} ${p2.y}`;
      } else {
        p1 = anchorPoint(c1, dy>=0?'bottom':'top');
        p2 = anchorPoint(c2, dy>=0?'top':'bottom');
        const midY = (p1.y+p2.y)/2;
        d = `M ${p1.x} ${p1.y} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`;
      }
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', '#9aa5b8');
      path.setAttribute('stroke-width', '1.6');
      path.setAttribute('fill', 'none');
      path.setAttribute('marker-end', 'url(#mmArrow)');
      svg.appendChild(path);

      const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.setAttribute('d', d);
      hit.setAttribute('stroke', 'transparent');
      hit.setAttribute('stroke-width', '14');
      hit.setAttribute('fill', 'none');
      hit.style.pointerEvents = 'stroke';
      hit.style.cursor = 'pointer';
      hit.addEventListener('click', ()=>{ if(confirm('刪除這條關聯線？')) deleteEdge(ed.id); });
      svg.appendChild(hit);

      const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
      if(ed.label){
        const lbl = document.createElement('div');
        lbl.className = 'mm-edge-label';
        lbl.dataset.edgeId = ed.id;
        lbl.style.left = mx + 'px';
        lbl.style.top = my + 'px';
        lbl.textContent = ed.label;
        lbl.title = '點擊編輯關聯說明';
        lbl.onclick = ()=> editEdgeLabel(ed.id);
        board.appendChild(lbl);
      }
    });
  }

  // ---- event delegation ----
  board.addEventListener('click', e=>{
    if(state.linking){
      const nodeEl = e.target.closest('.mm-node');
      if(nodeEl) handleLinkClick(nodeEl);
      return;
    }
    const delGroup = e.target.closest('[data-role="delgroup"]');
    if(delGroup){ if(confirm('刪除整個分組與其中的重點？')) deleteGroup(delGroup.closest('.mm-group').dataset.groupId); return; }
    const delNode = e.target.closest('[data-role="delnode"]');
    if(delNode){ deleteNode(delNode.closest('.mm-node').dataset.nodeId); return; }
    const addNode = e.target.closest('[data-role="addnode"]');
    if(addNode){ addNodeToGroup(addNode.closest('.mm-group').dataset.groupId); return; }
    const dot = e.target.closest('[data-role="colorpick"]');
    if(dot){ cycleGroupColor(dot.closest('.mm-group').dataset.groupId); return; }
  });
  board.addEventListener('blur', e=>{
    const field = e.target.closest && e.target.closest('[data-field]');
    if(!field) return;
    liveUpdateField(field);
    saveMindMap();
  }, true);
  board.addEventListener('input', e=>{
    const field = e.target.closest('[data-field]');
    if(!field) return;
    liveUpdateField(field);
    scheduleEdgeRedraw();
  });
  board.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.closest('[data-field="title"],[data-field="name"]')){
      e.preventDefault();
      e.target.blur();
    }
  });

  document.getElementById('mmAddGroup').onclick = addGroup;
  document.getElementById('mmImport').onclick = openImportModal;
  document.getElementById('mmExport').onclick = openExportModal;
  document.getElementById('mmClear').onclick = ()=>{
    if(!confirm('確定要清空整個心智圖嗎？此動作無法復原。')) return;
    mindData = { groups: [], edges: [] };
    saveMindMap();
    renderMindMap();
  };
  document.getElementById('mmCopyPrompt').onclick = (e)=>{
    navigator.clipboard.writeText(PROMPT_TEMPLATE).then(()=>{
      const btn = e.currentTarget; const old = btn.textContent;
      btn.textContent = '已複製 ✓'; setTimeout(()=>btn.textContent = old, 1500);
    });
  };
  document.getElementById('mmLinkMode').onclick = (e)=>{
    state.linking = !state.linking;
    board.classList.toggle('mm-linking', state.linking);
    e.currentTarget.classList.toggle('linking', state.linking);
    document.getElementById('mmHint').textContent = state.linking
      ? '連線模式中：依序點兩個重點卡片建立關聯（Esc 取消）'
      : '點兩個重點卡片即可建立關聯線；沒有關聯的重點不用連。';
    if(!state.linking && state.linkFrom){
      document.querySelector('.mm-node.linking-from')?.classList.remove('linking-from');
      state.linkFrom = null;
    }
  };

  window.addEventListener('resize', scheduleEdgeRedraw);
  document.addEventListener('keydown', e=>{
    if(document.getElementById('mindmapPanel').style.display==='none') return;
    if(e.key==='Escape'){
      if(state.linkFrom){
        document.querySelector('.mm-node.linking-from')?.classList.remove('linking-from');
        state.linkFrom = null;
      } else if(state.linking){
        document.getElementById('mmLinkMode').click();
      }
    }
  });

  renderMindMap();
})();
</script>
</body>
</html>
