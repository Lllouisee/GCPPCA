6, "tags": ["Vertex AI/AI-ML", "CI/CD"]}, {"id": "T1-Q246", "topic": 1, "qnum": 246, "question": "Your employer is a financial services company that recently acquired a popular fintech startup. The startup's core application is a monolithic Python application running on a managed instance group of Compute Engine virtual machines with a single, large PostgreSQL database. Your development team struggles with slow deployment cycles, and the monolithic design of the startup's core application makes it difficult to integrate new. ML-powered fraud detection models. You need a long-term strategy that improves developer agility and positions the company to leverage Google Cloud's advanced data and AI capabilities for future innovations. What should you do?", "options": [{"letter": "A", "text": "Deploy the ML fraud detection model to a Vertex AI endpoint. Create a REST API for the model and modify the monolithic Python application to call this endpoint for real-time fraud analysis."}, {"letter": "B", "text": "Containerize the application, deploy it to Google Kubernetes Engine (GKE), and migrate the PostgreSQL database to Cloud SQL for PostgreSQL."}, {"letter": "C", "text": "Propose a phased, event-driven migration to a microservices architecture. Use Pub/Sub for asynchronous communication and deploy the fraud models on Vertex AI endpoints."}, {"letter": "D", "text": "Migrate the PostgreSQL database to Cloud SQL for PostgreSQL. Replicate the data into BigQuery using Datastream, and then train and deploy the fraud detection models directly within BigQuery using BigQuery ML."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383627-exam-professional-cloud-architect-topic-1-question-246/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["容器化", "CI/CD", "Pub/Sub", "Vertex AI/AI-ML"]}, {"id": "T1-Q250", "topic": 1, "qnum": 250, "question": "Your company has hired an external auditing firm to perform a compliance audit. Your company’s governance policy requires that external auditors be managed in a single Google Group that is granted temporary, read-only access to a Cloud Storage bucket named audit-evidence-bucket. Access must be traceable to the individual auditor's identity and be active only for the duration of the audit engagement, which runs the entire month of October. You need a secure access control strategy that avoids administrative overhead and complies with your company's governance policy. What should you do?", "options": [{"letter": "A", "text": "Apply an IAM policy binding that grants the roles/storage.objectViewer role to the Google Group. Configure this binding with a time-based IAM Condition that automatically grants access from October 1 to November 1."}, {"letter": "B", "text": "Create a service account, and grant it the roles/storage.objectViewer role on the bucket. Generate and share Signed URLs for each object in the bucket with an expiration date of November 1."}, {"letter": "C", "text": "Use Cloud Scheduler to run a Cloud Run functions script that adds the IAM binding of roles/storage.objectViewer to the Google Group on October 1 and another that removes the IAM binding on November 1."}, {"letter": "D", "text": "Use Workforce Identity Federation to map the auditors’ group to the Google Group. Bind the roles/storage.objectViewer role to this Google Group. Configure a 1-month session duration on the provider."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383625-exam-professional-cloud-architect-topic-1-question-250/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["IAM", "安全性", "合規性"]}, {"id": "T1-Q251", "topic": 1, "qnum": 251, "question": "You are using a GitHub repository for your application’s source code. You want to set up an efficient and secure continuous deployment process to automatically build and deploy the application to Cloud Run whenever a pull request is merged. What should you do?", "options": [{"letter": "A", "text": "Create a GitHub webhook trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build a container image and save it in Artifact Registry. Use Config Sync to deploy the application to Cloud Run."}, {"letter": "B", "text": "Create a workflow using GitHub Actions to build and deploy the application to Cloud Run once a pull request is merged. The workflow will use a service account key checked in with your source code for deployment permission."}, {"letter": "C", "text": "Create a GitHub Enterprise trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build and deploy the application to Cloud Run. Save the deployment credential to Secret Manager."}, {"letter": "D", "text": "Connect your repository using the Cloud Build GitHub app. Create a trigger in Cloud Build. Once a pull request is merged, trigger Cloud Build to build and deploy the application to Cloud Run."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383602-exam-professional-cloud-architect-topic-1-question-251/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Run/Cloud Functions", "CI/CD"]}, {"id": "T1-Q252", "topic": 1, "qnum": 252, "question": "You are deploying a highly confidential data processing workload on Google Cloud. Your company’s compliance framework mandates that cryptographic keys used for encrypting data at rest must be generated and stored exclusively within a validated Hardware Security Module (HSM). You want to use a fully integrated Google Cloud managed service to handle the lifecycle and usage of these keys. What should you do?", "options": [{"letter": "A", "text": "Use Customer-Supplied Encryption Keys (CSEK) by providing your on-premises generated key with each API request."}, {"letter": "B", "text": "Import your on-premises HSM key material into a Cloud KMS key with the SOFTWARE protection level."}, {"letter": "C", "text": "Create a new key in Cloud Key Management Service (Cloud KMS) with the HSM protection level."}, {"letter": "D", "text": "Configure Cloud External Key Manager (Cloud EKM) to connect to your on-premises HSM."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383612-exam-professional-cloud-architect-topic-1-question-252/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud KMS/加密", "安全性", "合規性"]}, {"id": "T1-Q254", "topic": 1, "qnum": 254, "question": "You are designing a central, automated infrastructure deployment process for your organization using Terraform and Cloud Build. The security team prohibits the use of long-lived, static service account keys in any CI/CD pipeline. Additionally, while developers can propose infrastructure changes for peer review, they must not have permissions to directly apply changes in the production project. You need to design a secure and automated workflow for applying Terraform changes that meets the security team's requirements and ensures proper governance. What should you do?", "options": [{"letter": "A", "text": "Configure the Cloud Build pipeline to use service account impersonation. Set up a trigger that automatically runs terraform apply when a pull request is merged."}, {"letter": "B", "text": "Use service account impersonation in Cloud Build. Configure the pipeline to run terraform plan on pull requests, and require manual approval before running terraform apply."}, {"letter": "C", "text": "Configure the pipeline to only run terraform plan. After a pull request is approved, have an authorized developer run terraform apply from a secured workstation."}, {"letter": "D", "text": "Create a privileged service account and store its JSON key in Secret Manager. Configure the Cloud Build pipeline to fetch this key during execution to authenticate Terraform."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383629-exam-professional-cloud-architect-topic-1-question-254/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Terraform/IaC", "CI/CD", "安全性"]}, {"id": "T1-Q259", "topic": 1, "qnum": 259, "question": "Your company is expanding its AI-powered operations nationwide and has chosen accelerator-based compute for the AI workloads. The batch image processing workloads are not time-sensitive and can tolerate interruptions. You need to rapidly deploy cost-effective accelerator nodes for these batch tasks, ensuring rapid deployment and data persistence when necessary. What should you do?", "options": [{"letter": "A", "text": "Deploy standard VMs with configured accelerators and attached persistent disks."}, {"letter": "B", "text": "Deploy spot VMs with attached persistent disks and implement checkpoint mechanisms."}, {"letter": "C", "text": "Deploy spot VMs with local SSD to reduce time for bursty workloads"}, {"letter": "D", "text": "Deploy Cloud Run functions with ephemeral local SSD."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383596-exam-professional-cloud-architect-topic-1-question-259/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Compute Engine", "成本優化", "Vertex AI/AI-ML"]}, {"id": "T1-Q260", "topic": 1, "qnum": 260, "question": "A large, multinational corporation is migrating to Google Cloud. The company has several distinct business units: Finance, Marketing, and Research and Development (R&D). The central security team has mandated governance requirements for each business unit:• Finance: Must be restricted to deploying resources only in specific, compliant regions (us-central1 and europe-west2). Access to their projects must be tightly controlled by a dedicated finance-admins group.• Marketing: Needs separate environments for production and development, with different teams managing each environment.• R&D: Requires maximum flexibility to experiment with new services but must be completely isolated to prevent any impact on production systems.• Global Auditing: A central compliance team requires read-only access to view all resources across the entire company for auditing purposes.You need to design a resource hierarchy that enforces these security policies at scale according to the Google Cloud Well-Architected Framework while providing the correct level of autonomy for each business unit. What should you do?", "options": [{"letter": "A", "text": "Create a folder for each department under the root Organization node. Apply the resource location Organization Policy on the Finance folder. Within the Marketing folder, create separate projects for mktg-prod and mktg-dev. Grant the compliance team the roles/viewer role at the Organization level."}, {"letter": "B", "text": "Place all projects directly under the Organization node. Use network tags and service accounts to enforce security boundaries between the different department workloads. Apply the resource location Organization Policy on the Finance project."}, {"letter": "C", "text": "Create separate Google Cloud Organizations for each department (Finance, Marketing, and R&D). Grant the compliance team the roles/viewer role for each organization."}, {"letter": "D", "text": "Create a single project for each department. Apply the resource location policy directly to the Finance project. Grant the compliance team the roles/browser role on each project individually."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383628-exam-professional-cloud-architect-topic-1-question-260/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Organization Policy", "IAM", "合規性"]}, {"id": "T1-Q261", "topic": 1, "qnum": 261, "question": "Your organization is going to migrate applications to Kubernetes and use managed cloud services to deploy applications. Your team is new to Kubernetes and wants to quickly onboard engineers. You want to reduce operational overhead, so the engineering team can focus on developing consumer requirements instead of maintaining the infrastructure. What should you do?", "options": [{"letter": "A", "text": "Package your application into a Docker image, and deploy it to Kubernetes on Compute Engine."}, {"letter": "B", "text": "Leverage Cloud Build to create a container image, and deploy it automatically to Kubernetes on Compute Engine."}, {"letter": "C", "text": "Assess application and dependencies for containerization Develop a migration strategy for deployment to GKE in Standard mode."}, {"letter": "D", "text": "Assess application and dependencies for containerization. Develop a migration strategy for deployment to GKE in Autopilot mode."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383618-exam-professional-cloud-architect-topic-1-question-261/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["GKE/Kubernetes", "容器化", "成本優化"]}, {"id": "T1-Q262", "topic": 1, "qnum": 262, "question": "Your company runs a critical, revenue-generating ecommerce application that is served by a regional managed instance group (MIG) behind an external HTTP(S) Load Balancer. The operations team is currently overwhelmed with low-priority notifications and is starting to ignore alerts. Your team's service level objective (SLO) is to maintain 99.9% availability, which is measured by the ratio of successful requests (2xx status codes) to total requests. You want to minimize noise from non-critical events and ensure that the team is only notified of issues that are actionable and threaten the SLO. What should you do?", "options": [{"letter": "A", "text": "Focus on cause-based alerts, creating alerting policies with thresholds for the Compute Engine instances, including CPU utilization, memory usage, disk I/O, and network traffic."}, {"letter": "B", "text": "Create log-based alerts for only the WARN and ERROR log entries generated by the application to ensure that no potential issue is missed."}, {"letter": "C", "text": "Implement an error budget policy based on the availability of the SLO. Create a \"page” alert that triggers only when the rate of burn of the error budget predicts a full exhaustion within the next 24 hours."}, {"letter": "D", "text": "Configure alerts based on predictive metrics. Use the instance count of the MIG as the primary metric to trigger an alert."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383574-exam-professional-cloud-architect-topic-1-question-262/", "postedDate": "2026-02-10", "postedYear": 2026, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性", "高可用性/災難復原"]}, {"id": "T1-Q263", "topic": 1, "qnum": 263, "question": "You manage a highly distributed, hybrid- and multi-cloud IT environment, and your developers rely heavily on Prometheus for their workflows. You need a cloud-based, highly scalable, low-maintenance enterprise solution that supports Prometheus Query Language (PromQL) queries, quick metric viewing, and efficient issue diagnosis. What should you do?", "options": [{"letter": "A", "text": "Deploy a Prometheus operator in your existing Kubernetes and Serverless setup across multi-cloud environments."}, {"letter": "B", "text": "Set up Cloud Monitoring as a single pane of glass across multi-cloud environments."}, {"letter": "C", "text": "Enable Google Cloud Managed Service for Prometheus to monitor and alert on your workloads at scale."}, {"letter": "D", "text": "Build a SaaS-based, Prometheus-compatible solution to display metrics for each cloud in a customizable way."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383601-exam-professional-cloud-architect-topic-1-question-263/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["Cloud Monitoring/Logging", "混合雲", "監控與可觀測性"]}, {"id": "T1-Q264", "topic": 1, "qnum": 264, "question": "Your organization uses Google Kubernetes Engine (GKE) and Amazon Elastic Kubernetes Service (EKS) to manage a complex Kubernetes environment across multiple cloud providers. You need to deploy a solution that streamlines configuration management, enforces security policies, and ensures consistent application deployment across all of the environments. You want to follow Google-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Leverage Argo CD for GitOps-based continuous delivery and Open Policy Agent (OPA) for policy enforcement, and develop a controller for multi-cluster configuration management."}, {"letter": "B", "text": "Deploy Crossplane for managing cloud resources as Kubernetes objects, FluxCD for GitOps-based configuration synchronization, and Kyverno for policy enforcement."}, {"letter": "C", "text": "Deploy Kustomize for configuration customization, Config Sync with multiple Git repositories, and a script to enforce security policies."}, {"letter": "D", "text": "Utilize Config Sync as part of GKE to synchronize configurations from a centralized repository, and utilize Policy Controller to enforce policies using OPA Gatekeeper."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383613-exam-professional-cloud-architect-topic-1-question-264/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["GKE/Kubernetes", "混合雲", "Organization Policy"]}, {"id": "T1-Q265", "topic": 1, "qnum": 265, "question": "Your company is rapidly deploying containerized microservices on Google Kubernetes Engine (GKE) using a robust CI/CD pipeline. Security is a top priority, and you need to implement a comprehensive and efficient strategy to prevent container image vulnerabilities from reaching your GKE production environment. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Review the security reports generated by Artifact Analysis for each container image before deployment to GKE."}, {"letter": "B", "text": "Incorporate vulnerability scanning before building container images, and use Google-maintained base images for your container deployments."}, {"letter": "C", "text": "Enable Artifact Analysis for the container images, and stop deployment if critical vulnerabilities are found."}, {"letter": "D", "text": "Use a custom security policy within your container image that restricts access to specific network ports and resources."}, {"letter": "E", "text": "Enable Shielded GKE Nodes on the production cluster to automatically block the execution of container images with known vulnerabilities."}], "answer": "BC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383575-exam-professional-cloud-architect-topic-1-question-265/", "postedDate": "2026-02-10", "postedYear": 2026, "tags": ["GKE/Kubernetes", "容器化", "安全性", "CI/CD"]}, {"id": "T1-Q266", "topic": 1, "qnum": 266, "question": "Your organization is implementing a new cloud-native application on Google Cloud and needs to ensure compliance with the ISO/IEC 27001 framework. You want to leverage Google Cloud’s security reports and documentation to support your ISO/IEC 27001 audit process. What should you do?", "options": [{"letter": "A", "text": "Engage an independent auditor to conduct an ISO/IEC 27001 audit of your organization's Google Cloud implementation."}, {"letter": "B", "text": "Download the ISO/IEC 27001 report for Google Cloud through internet search."}, {"letter": "C", "text": "Review the Compliance Reports Manager for information about ISO/IEC 27001 compliance and related documentation on obtaining reports through your Google Cloud account."}, {"letter": "D", "text": "Utilize the Cloud Audit Logs service for accessing and requesting the ISO/IEC 27001 reports."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383598-exam-professional-cloud-architect-topic-1-question-266/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["合規性"]}, {"id": "T1-Q267", "topic": 1, "qnum": 267, "question": "You are monitoring Google Kubernetes Engine (GKE) clusters in a Cloud Monitoring workspace. As a Site Reliability Engineer (SRE), you need to triage incidents quickly. What should you do?", "options": [{"letter": "A", "text": "1. Navigate the predefined dashboards in the Cloud Monitoring workspace.2. Add metrics and create alert policies."}, {"letter": "B", "text": "1. Write a shell script that gathers metrics from GKE nodes, and publish these metrics to a Pub/Sub topic.2. Export the data to BigQuery. and make a Data Studio dashboard."}, {"letter": "C", "text": "1. Create a custom dashboard in the Cloud Monitoring workspace for each incident.2. Add metrics and create alert policies."}, {"letter": "D", "text": "1. Navigate the predefined dashboards in the Cloud Monitoring workspace.2. Create custom metrics and install alerting software on a Compute Engine instance."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/383615-exam-professional-cloud-architect-topic-1-question-267/", "postedDate": "2026-02-12", "postedYear": 2026, "tags": ["GKE/Kubernetes", "Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T2-Q1", "topic": 2, "qnum": 1, "question": "The JencoMart security team requires that all Google Cloud Platform infrastructure is deployed using a least privilege model with separation of duties for administration between production and development resources.What Google domain and project structure should you recommend?", "options": [{"letter": "A", "text": "Create two G Suite accounts to manage users: one for development/test/staging and one for production. Each account should contain one project for every application"}, {"letter": "B", "text": "Create two G Suite accounts to manage users: one with a single project for all development applications and one with a single project for all production applications"}, {"letter": "C", "text": "Create a single G Suite account to manage users with each stage of each application in its own project"}, {"letter": "D", "text": "Create a single G Suite account to manage users with one project for the development/test/staging environment and one project for the production environment"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10396-exam-professional-cloud-architect-topic-2-question-1/", "postedDate": "2019-12-15", "postedYear": 2019, "tags": ["IAM", "Organization Policy"]}, {"id": "T2-Q2", "topic": 2, "qnum": 2, "question": "A few days after JencoMart migrates the user credentials database to Google Cloud Platform and shuts down the old server, the new database server stops responding to SSH connections. It is still serving database requests to the application servers correctly.What three steps should you take to diagnose the problem? (Choose three.)", "options": [{"letter": "A", "text": "Delete the virtual machine (VM) and disks and create a new one"}, {"letter": "B", "text": "Delete the instance, attach the disk to a new VM, and investigate"}, {"letter": "C", "text": "Take a snapshot of the disk and connect to a new machine to investigate"}, {"letter": "D", "text": "Check inbound firewall rules for the network the machine is connected to"}, {"letter": "E", "text": "Connect the machine to another network with very simple firewall rules and investigate"}, {"letter": "F", "text": "Print the Serial Console output for the instance for troubleshooting, activate the interactive console, and investigate"}], "answer": "CDF", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11917-exam-professional-cloud-architect-topic-2-question-2/", "postedDate": "2020-01-14", "postedYear": 2020, "tags": ["Compute Engine", "VPC/網路", "監控與可觀測性"]}, {"id": "T2-Q3", "topic": 2, "qnum": 3, "question": "JencoMart has decided to migrate user profile storage to Google Cloud Datastore and the application servers to Google Compute Engine (GCE). During the migration, the existing infrastructure will need access to Datastore to upload the data.What service account key-management strategy should you recommend?", "options": [{"letter": "A", "text": "Provision service account keys for the on-premises infrastructure and for the GCE virtual machines (VMs)"}, {"letter": "B", "text": "Authenticate the on-premises infrastructure with a user account and provision service account keys for the VMs"}, {"letter": "C", "text": "Provision service account keys for the on-premises infrastructure and use Google Cloud Platform (GCP) managed keys for the VMs"}, {"letter": "D", "text": "Deploy a custom authentication service on GCE/Google Kubernetes Engine (GKE) for the on-premises infrastructure and use GCP managed keys for the VMs"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/12793-exam-professional-cloud-architect-topic-2-question-3/", "postedDate": "2020-01-26", "postedYear": 2020, "tags": ["IAM", "資料遷移", "安全性"]}, {"id": "T2-Q4", "topic": 2, "qnum": 4, "question": "JencoMart has built a version of their application on Google Cloud Platform that serves traffic to Asia. You want to measure success against their business and technical goals.Which metrics should you track?", "options": [{"letter": "A", "text": "Error rates for requests from Asia"}, {"letter": "B", "text": "Latency difference between US and Asia"}, {"letter": "C", "text": "Total visits, error rates, and latency from Asia"}, {"letter": "D", "text": "Total visits and average latency for users from Asia"}, {"letter": "E", "text": "The number of character sets present in the database"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/14318-exam-professional-cloud-architect-topic-2-question-4/", "postedDate": "2020-02-17", "postedYear": 2020, "tags": ["監控與可觀測性"]}, {"id": "T2-Q5", "topic": 2, "qnum": 5, "question": "The migration of JencoMart's application to Google Cloud Platform (GCP) is progressing too slowly. The infrastructure is shown in the diagram. You want to maximize throughput.What are three potential bottlenecks? (Choose three.)", "options": [{"letter": "A", "text": "A single VPN tunnel, which limits throughput"}, {"letter": "B", "text": "A tier of Google Cloud Storage that is not suited for this task"}, {"letter": "C", "text": "A copy command that is not suited to operate over long distances"}, {"letter": "D", "text": "Fewer virtual machines (VMs) in GCP than on-premises machines"}, {"letter": "E", "text": "A separate storage layer outside the VMs, which is not suited for this task"}, {"letter": "F", "text": "Complicated internet connectivity between the on-premises infrastructure and GCP"}], "answer": "ACF", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6708-exam-professional-cloud-architect-topic-2-question-5/", "postedDate": "2019-10-17", "postedYear": 2019, "tags": ["Interconnect/VPN", "資料遷移", "效能調校"]}, {"id": "T2-Q6", "topic": 2, "qnum": 6, "question": "JencoMart wants to move their User Profiles database to Google Cloud Platform.Which Google Database should they use?", "options": [{"letter": "A", "text": "Cloud Spanner"}, {"letter": "B", "text": "Google BigQuery"}, {"letter": "C", "text": "Google Cloud SQL"}, {"letter": "D", "text": "Google Cloud Datastore"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8497-exam-professional-cloud-architect-topic-2-question-6/", "postedDate": "2019-11-18", "postedYear": 2019, "tags": ["Datastore/Firestore", "資料庫Schema設計"]}, {"id": "T3-Q1", "topic": 3, "qnum": 1, "question": "Your team is in charge of creating a payment card data vault for card numbers used to bill tens of thousands of viewers, merchandise consumers, and season ticket holders. You need to implement a custom card tokenization service that meets the following requirements:* It must provide low latency at minimal cost.* It must be able to identify duplicate credit cards and must not store plaintext card numbers.* It should support annual key rotation.Which storage approach should you adopt for your tokenization service?", "options": [{"letter": "A", "text": "Store the card data in Secret Manager after running a query to identify duplicates."}, {"letter": "B", "text": "Encrypt the card data with a deterministic algorithm stored in Firestore using Datastore mode."}, {"letter": "C", "text": "Encrypt the card data with a deterministic algorithm and shard it across multiple Memorystore instances."}, {"letter": "D", "text": "Use column-level encryption to store the data in Cloud SQL."}], "answer": "B", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/65937-exam-professional-cloud-architect-topic-3-question-1/", "postedDate": "2021-11-13", "postedYear": 2021, "tags": ["Cloud KMS/加密", "安全性", "案例研究題"]}, {"id": "T3-Q3", "topic": 3, "qnum": 3, "question": "The HRL development team releases a new version of their predictive capability application every Tuesday evening at 3 a.m. UTC to a repository. The security team at HRL has developed an in-house penetration test Cloud Function calledAirwolf. The security team wants to run Airwolf against the predictive capability application as soon as it is released every Tuesday. You need to set up Airwolf to run at the recurring weekly cadence. What should you do?", "options": [{"letter": "A", "text": "Set up Cloud Tasks and a Cloud Storage bucket that triggers a Cloud Function."}, {"letter": "B", "text": "Set up a Cloud Logging sink and a Cloud Storage bucket that triggers a Cloud Function."}, {"letter": "C", "text": "Configure the deployment job to notify a Pub/Sub queue that triggers a Cloud Function."}, {"letter": "D", "text": "Set up Identity and Access Management (IAM) and Confidential Computing to trigger a Cloud Function."}], "answer": "C", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56890-exam-professional-cloud-architect-topic-3-question-3/", "postedDate": "2021-07-02", "postedYear": 2021, "tags": ["Pub/Sub", "Cloud Run/Cloud Functions", "CI/CD", "案例研究題"]}, {"id": "T3-Q4", "topic": 3, "qnum": 4, "question": "HRL wants better prediction accuracy from their ML prediction models. They want you to use Google's AI Platform so HRL can understand and interpret the predictions. What should you do?", "options": [{"letter": "A", "text": "Use Explainable AI."}, {"letter": "B", "text": "Use Vision AI."}, {"letter": "C", "text": "Use Google Cloud's operations suite."}, {"letter": "D", "text": "Use Jupyter Notebooks."}], "answer": "A", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56322-exam-professional-cloud-architect-topic-3-question-4/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Vertex AI/AI-ML", "案例研究題"]}, {"id": "T3-Q5", "topic": 3, "qnum": 5, "question": "HRL is looking for a cost-effective approach for storing their race data such as telemetry. They want to keep all historical records, train models using only the previous season's data, and plan for data growth in terms of volume and information collected. You need to propose a data solution. Considering HRL business requirements and the goals expressed by CEO S. Hawke, what should you do?", "options": [{"letter": "A", "text": "Use Firestore for its scalable and flexible document-based database. Use collections to aggregate race data by season and event."}, {"letter": "B", "text": "Use Cloud Spanner for its scalability and ability to version schemas with zero downtime. Split race data using season as a primary key."}, {"letter": "C", "text": "Use BigQuery for its scalability and ability to add columns to a schema. Partition race data based on season."}, {"letter": "D", "text": "Use Cloud SQL for its ability to automatically manage storage increases and compatibility with MySQL. Use separate database instances for each season."}], "answer": "C", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56326-exam-professional-cloud-architect-topic-3-question-5/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["BigQuery", "成本優化", "資料庫Schema設計", "案例研究題"]}, {"id": "T3-Q6", "topic": 3, "qnum": 6, "question": "A recent finance audit of cloud infrastructure noted an exceptionally high number ofCompute Engine instances are allocated to do video encoding and transcoding. You suspect that these Virtual Machines are zombie machines that were not deleted after their workloads completed. You need to quickly get a list of which VM instances are idle. What should you do?", "options": [{"letter": "A", "text": "Log into each Compute Engine instance and collect disk, CPU, memory, and network usage statistics for analysis."}, {"letter": "B", "text": "Use the gcloud compute instances list to list the virtual machine instances that have the idle: true label set."}, {"letter": "C", "text": "Use the gcloud recommender command to list the idle virtual machine instances."}, {"letter": "D", "text": "From the Google Console, identify which Compute Engine instances in the managed instance groups are no longer responding to health check probes."}], "answer": "C", "caseStudy": "Helicopter Racing League (HRL)", "link": "https://www.examtopics.com/discussions/google/view/56328-exam-professional-cloud-architect-topic-3-question-6/", "postedDate": "2021-06-30", "postedYear": 2021, "tags": ["Compute Engine", "成本優化", "案例研究題"]}, {"id": "T4-Q1", "topic": 4, "qnum": 1, "question": "You are responsible for ensuring that EHR's use of Google Cloud will pass an upcoming privacy compliance audit. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Verify EHR's product usage against the list of compliant products on the Google Cloud compliance page."}, {"letter": "B", "text": "Advise EHR to execute a Business Associate Agreement (BAA) with Google Cloud."}, {"letter": "C", "text": "Use Firebase Authentication for EHR's user facing applications."}, {"letter": "D", "text": "Implement Prometheus to detect and prevent security breaches on EHR's web-based applications."}, {"letter": "E", "text": "Use GKE private clusters for all Kubernetes workloads."}], "answer": "AB", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60388-exam-professional-cloud-architect-topic-4-question-1/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["合規性", "案例研究題"]}, {"id": "T4-Q2", "topic": 4, "qnum": 2, "question": "You need to define the technical architecture for securely deploying workloads to Google Cloud. You also need to ensure that only verified containers are deployed using Google Cloud services. What should you do? (Choose two.)", "options": [{"letter": "A", "text": "Enable Binary Authorization on GKE, and sign containers as part of a CI/CD pipeline."}, {"letter": "B", "text": "Configure Jenkins to utilize Kritis to cryptographically sign a container as part of a CI/CD pipeline."}, {"letter": "C", "text": "Configure Container Registry to only allow trusted service accounts to create and deploy containers from the registry."}, {"letter": "D", "text": "Configure Container Registry to use vulnerability scanning to confirm that there are no vulnerabilities before deploying the workload."}], "answer": "AD", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60423-exam-professional-cloud-architect-topic-4-question-2/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["GKE/Kubernetes", "CI/CD", "安全性", "案例研究題"]}, {"id": "T4-Q3", "topic": 4, "qnum": 3, "question": "You need to upgrade the EHR connection to comply with their requirements. The new connection design must support business-critical needs and meet the same network and security policy requirements. What should you do?", "options": [{"letter": "A", "text": "Add a new Dedicated Interconnect connection."}, {"letter": "B", "text": "Upgrade the bandwidth on the Dedicated Interconnect connection to 100 G."}, {"letter": "C", "text": "Add three new Cloud VPN connections."}, {"letter": "D", "text": "Add a new Carrier Peering connection."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/60403-exam-professional-cloud-architect-topic-4-question-3/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["Interconnect/VPN"]}, {"id": "T4-Q4", "topic": 4, "qnum": 4, "question": "You need to define the technical architecture for hybrid connectivity between EHR's on-premises systems and Google Cloud. You want to follow Google's recommended practices for production-level applications. Considering the EHR Healthcare business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Configure two Partner Interconnect connections in one metro (City), and make sure the Interconnect connections are placed in different metro zones."}, {"letter": "B", "text": "Configure two VPN connections from on-premises to Google Cloud, and make sure the VPN devices on-premises are in separate racks."}, {"letter": "C", "text": "Configure Direct Peering between EHR Healthcare and Google Cloud, and make sure you are peering at least two Google locations."}, {"letter": "D", "text": "Configure two Dedicated Interconnect connections in one metro (City) and two connections in another metro, and make sure the Interconnect connections are placed in different metro zones."}], "answer": "D", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60435-exam-professional-cloud-architect-topic-4-question-4/", "postedDate": "2021-08-24", "postedYear": 2021, "tags": ["Interconnect/VPN", "高可用性/災難復原", "案例研究題"]}, {"id": "T4-Q5", "topic": 4, "qnum": 5, "question": "You are a developer on the EHR customer portal team. Your team recently migrated the customer portal application to Google Cloud. The load has increased on the application servers, and now the application is logging many timeout errors. You recently incorporated Pub/Sub into the application architecture, and the application is not logging any Pub/Sub publishing errors. You want to improve publishing latency.What should you do?", "options": [{"letter": "A", "text": "Increase the Pub/Sub Total Timeout retry value."}, {"letter": "B", "text": "Move from a Pub/Sub subscriber pull model to a push model."}, {"letter": "C", "text": "Turn off Pub/Sub message batching."}, {"letter": "D", "text": "Create a backup Pub/Sub message queue."}], "answer": "C", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60405-exam-professional-cloud-architect-topic-4-question-5/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["Pub/Sub", "效能調校", "案例研究題"]}, {"id": "T4-Q6", "topic": 4, "qnum": 6, "question": "In the past, configuration errors put public IP addresses on backend servers that should not have been accessible from the Internet. You need to ensure that no one can put external IP addresses on backend Compute Engine instances and that external IP addresses can only be configured on frontend Compute Engine instances. What should you do?", "options": [{"letter": "A", "text": "Create an Organizational Policy with a constraint to allow external IP addresses only on the frontend Compute Engine instances."}, {"letter": "B", "text": "Revoke the compute.networkAdmin role from all users in the project with front end instances."}, {"letter": "C", "text": "Create an Identity and Access Management (IAM) policy that maps the IT staff to the compute.networkAdmin role for the organization."}, {"letter": "D", "text": "Create a custom Identity and Access Management (IAM) role named GCE_FRONTEND with the compute.addresses.create permission."}], "answer": "A", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60407-exam-professional-cloud-architect-topic-4-question-6/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["Organization Policy", "VPC/網路", "安全性", "案例研究題"]}, {"id": "T4-Q7", "topic": 4, "qnum": 7, "question": "You are responsible for designing the Google Cloud network architecture for Google KubernetesEngine. You want to follow Google best practices. Considering the EHR Healthcare business and technical requirements, what should you do to reduce the attack surface?", "options": [{"letter": "A", "text": "Use a private cluster with a private endpoint with master authorized networks configured."}, {"letter": "B", "text": "Use a public cluster with firewall rules and Virtual Private Cloud (VPC) routes."}, {"letter": "C", "text": "Use a private cluster with a public endpoint with master authorized networks configured."}, {"letter": "D", "text": "Use a public cluster with master authorized networks enabled and firewall rules."}], "answer": "A", "caseStudy": "EHR Healthcare", "link": "https://www.examtopics.com/discussions/google/view/60409-exam-professional-cloud-architect-topic-4-question-7/", "postedDate": "2021-08-23", "postedYear": 2021, "tags": ["GKE/Kubernetes", "VPC/網路", "安全性", "案例研究題"]}, {"id": "T5-Q1", "topic": 5, "qnum": 1, "question": "Mountkirk Games wants you to design their new testing strategy. How should the test coverage differ from their existing backends on the other platforms?", "options": [{"letter": "A", "text": "Tests should scale well beyond the prior approaches"}, {"letter": "B", "text": "Unit tests are no longer required, only end-to-end tests"}, {"letter": "C", "text": "Tests should be applied after the release is in the production environment"}, {"letter": "D", "text": "Tests should include directly testing the Google Cloud Platform (GCP) infrastructure"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10722-exam-professional-cloud-architect-topic-5-question-1/", "postedDate": "2019-12-20", "postedYear": 2019, "tags": ["CI/CD"]}, {"id": "T5-Q2", "topic": 5, "qnum": 2, "question": "Mountkirk Games has deployed their new backend on Google Cloud Platform (GCP). You want to create a through testing process for new versions of the backend before they are released to the public. You want the testing environment to scale in an economical way. How should you design the process?", "options": [{"letter": "A", "text": "Create a scalable environment in GCP for simulating production load"}, {"letter": "B", "text": "Use the existing infrastructure to test the GCP-based backend at scale"}, {"letter": "C", "text": "Build stress tests into each component of your application using resources internal to GCP to simulate load"}, {"letter": "D", "text": "Create a set of static environments in GCP to test different levels of load ג€\" for example, high, medium, and low"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9190-exam-professional-cloud-architect-topic-5-question-2/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["CI/CD", "成本優化"]}, {"id": "T5-Q3", "topic": 5, "qnum": 3, "question": "Mountkirk Games wants to set up a continuous delivery pipeline. Their architecture includes many small services that they want to be able to update and roll back quickly. Mountkirk Games has the following requirements:✑ Services are deployed redundantly across multiple regions in the US and Europe✑ Only frontend services are exposed on the public internet✑ They can provide a single frontend IP for their fleet of services✑ Deployment artifacts are immutableWhich set of products should they use?", "options": [{"letter": "A", "text": "Google Cloud Storage, Google Cloud Dataflow, Google Compute Engine"}, {"letter": "B", "text": "Google Cloud Storage, Google App Engine, Google Network Load Balancer"}, {"letter": "C", "text": "Google Kubernetes Registry, Google Container Engine, Google HTTP(S) Load Balancer"}, {"letter": "D", "text": "Google Cloud Functions, Google Cloud Pub/Sub, Google Cloud Deployment Manager"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6549-exam-professional-cloud-architect-topic-5-question-3/", "postedDate": "2019-10-14", "postedYear": 2019, "tags": ["GKE/Kubernetes", "Load Balancing", "CI/CD", "多區域架構"]}, {"id": "T5-Q4", "topic": 5, "qnum": 4, "question": "Mountkirk Games' gaming servers are not automatically scaling properly. Last month, they rolled out a new feature, which suddenly became very popular. A record number of users are trying to use the service, but many of them are getting 503 errors and very slow response times. What should they investigate first?", "options": [{"letter": "A", "text": "Verify that the database is online"}, {"letter": "B", "text": "Verify that the project quota hasn't been exceeded"}, {"letter": "C", "text": "Verify that the new feature code did not introduce any performance bugs"}, {"letter": "D", "text": "Verify that the load-testing team is not running their tool against production"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9253-exam-professional-cloud-architect-topic-5-question-4/", "postedDate": "2019-11-28", "postedYear": 2019, "tags": ["自動擴縮", "監控與可觀測性"]}, {"id": "T5-Q5", "topic": 5, "qnum": 5, "question": "Mountkirk Games needs to create a repeatable and configurable mechanism for deploying isolated application environments. Developers and testers can access each other's environments and resources, but they cannot access staging or production resources. The staging environment needs access to some services from production.What should you do to isolate development environments from staging and production?", "options": [{"letter": "A", "text": "Create a project for development and test and another for staging and production"}, {"letter": "B", "text": "Create a network for development and test and another for staging and production"}, {"letter": "C", "text": "Create one subnetwork for development and another for staging and production"}, {"letter": "D", "text": "Create one project for development, a second for staging and a third for production"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9191-exam-professional-cloud-architect-topic-5-question-5/", "postedDate": "2019-11-27", "postedYear": 2019, "tags": ["IAM", "Organization Policy"]}, {"id": "T5-Q6", "topic": 5, "qnum": 6, "question": "Mountkirk Games wants to set up a real-time analytics platform for their new game. The new platform must meet their technical requirements.Which combination of Google technologies will meet all of their requirements?", "options": [{"letter": "A", "text": "Kubernetes Engine, Cloud Pub/Sub, and Cloud SQL"}, {"letter": "B", "text": "Cloud Dataflow, Cloud Storage, Cloud Pub/Sub, and BigQuery"}, {"letter": "C", "text": "Cloud SQL, Cloud Storage, Cloud Pub/Sub, and Cloud Dataflow"}, {"letter": "D", "text": "Cloud Dataproc, Cloud Pub/Sub, Cloud SQL, and Cloud Dataflow"}, {"letter": "E", "text": "Cloud Pub/Sub, Compute Engine, Cloud Storage, and Cloud Dataproc"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11831-exam-professional-cloud-architect-topic-5-question-6/", "postedDate": "2020-01-12", "postedYear": 2020, "tags": ["Dataflow/Dataproc", "Pub/Sub", "BigQuery", "Cloud Storage"]}, {"id": "T6-Q1", "topic": 6, "qnum": 1, "question": "Mountkirk Games wants to migrate from their current analytics and statistics reporting model to one that meets their technical requirements on Google Cloud Platform.Which two steps should be part of their migration plan? (Choose two.)", "options": [{"letter": "A", "text": "Evaluate the impact of migrating their current batch ETL code to Cloud Dataflow."}, {"letter": "B", "text": "Write a schema migration plan to denormalize data for better performance in BigQuery."}, {"letter": "C", "text": "Draw an architecture diagram that shows how to move from a single MySQL database to a MySQL cluster."}, {"letter": "D", "text": "Load 10 TB of analytics data from a previous game into a Cloud SQL instance, and run test queries against the full dataset to confirm that they complete successfully."}, {"letter": "E", "text": "Integrate Cloud Armor to defend against possible SQL injection attacks in analytics files uploaded to Cloud Storage."}], "answer": "AB", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/11888-exam-professional-cloud-architect-topic-6-question-1/", "postedDate": "2020-01-13", "postedYear": 2020, "tags": ["Dataflow/Dataproc", "BigQuery", "資料遷移", "案例研究題"]}, {"id": "T6-Q2", "topic": 6, "qnum": 2, "question": "You need to analyze and define the technical architecture for the compute workloads for your company, Mountkirk Games. Considering the Mountkirk Games business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Create network load balancers. Use preemptible Compute Engine instances."}, {"letter": "B", "text": "Create network load balancers. Use non-preemptible Compute Engine instances."}, {"letter": "C", "text": "Create a global load balancer with managed instance groups and autoscaling policies. Use preemptible Compute Engine instances."}, {"letter": "D", "text": "Create a global load balancer with managed instance groups and autoscaling policies. Use non-preemptible Compute Engine instances."}], "answer": "D", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/8500-exam-professional-cloud-architect-topic-6-question-2/", "postedDate": "2019-11-18", "postedYear": 2019, "tags": ["Load Balancing", "自動擴縮", "Compute Engine", "案例研究題"]}, {"id": "T6-Q3", "topic": 6, "qnum": 3, "question": "Mountkirk Games wants to design their solution for the future in order to take advantage of cloud and technology improvements as they become available. Which two steps should they take? (Choose two.)", "options": [{"letter": "A", "text": "Store as much analytics and game activity data as financially feasible today so it can be used to train machine learning models to predict user behavior in the future."}, {"letter": "B", "text": "Begin packaging their game backend artifacts in container images and running them on Google Kubernetes Engine to improve the ability to scale up or down based on game activity."}, {"letter": "C", "text": "Set up a CI/CD pipeline using Jenkins and Spinnaker to automate canary deployments and improve development velocity."}, {"letter": "D", "text": "Adopt a schema versioning tool to reduce downtime when adding new game features that require storing additional player data in the database."}, {"letter": "E", "text": "Implement a weekly rolling maintenance process for the Linux virtual machines so they can apply critical kernel patches and package updates and reduce the risk of 0-day vulnerabilities."}], "answer": "AB", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/8501-exam-professional-cloud-architect-topic-6-question-3/", "postedDate": "2019-11-18", "postedYear": 2019, "tags": ["GKE/Kubernetes", "容器化", "CI/CD", "案例研究題"]}, {"id": "T6-Q4", "topic": 6, "qnum": 4, "question": "Mountkirk Games wants you to design a way to test the analytics platform's resilience to changes in mobile network latency. What should you do?", "options": [{"letter": "A", "text": "Deploy failure injection software to the game analytics platform that can inject additional latency to mobile client analytics traffic."}, {"letter": "B", "text": "Build a test client that can be run from a mobile phone emulator on a Compute Engine virtual machine, and run multiple copies in Google Cloud Platform regions all over the world to generate realistic traffic."}, {"letter": "C", "text": "Add the ability to introduce a random amount of delay before beginning to process analytics files uploaded from mobile devices."}, {"letter": "D", "text": "Create an opt-in beta of the game that runs on players' mobile devices and collects response times from analytics endpoints running in Google Cloud Platform regions all over the world."}], "answer": "A", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/12204-exam-professional-cloud-architect-topic-6-question-4/", "postedDate": "2020-01-17", "postedYear": 2020, "tags": ["高可用性/災難復原", "多區域架構", "案例研究題"]}, {"id": "T6-Q5", "topic": 6, "qnum": 5, "question": "You need to analyze and define the technical architecture for the database workloads for your company, Mountkirk Games. Considering the business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Use Cloud SQL for time series data, and use Cloud Bigtable for historical data queries."}, {"letter": "B", "text": "Use Cloud SQL to replace MySQL, and use Cloud Spanner for historical data queries."}, {"letter": "C", "text": "Use Cloud Bigtable to replace MySQL, and use BigQuery for historical data queries."}, {"letter": "D", "text": "Use Cloud Bigtable for time series data, use Cloud Spanner for transactional data, and use BigQuery for historical data queries."}], "answer": "D", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/7236-exam-professional-cloud-architect-topic-6-question-5/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Bigtable", "Cloud Spanner", "BigQuery", "資料庫Schema設計", "案例研究題"]}, {"id": "T6-Q6", "topic": 6, "qnum": 6, "question": "Which managed storage option meets Mountkirk's technical requirement for storing game activity in a time series database service?", "options": [{"letter": "A", "text": "Cloud Bigtable"}, {"letter": "B", "text": "Cloud Spanner"}, {"letter": "C", "text": "BigQuery"}, {"letter": "D", "text": "Cloud Datastore"}], "answer": "A", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/7237-exam-professional-cloud-architect-topic-6-question-6/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Bigtable", "資料庫Schema設計", "案例研究題"]}, {"id": "T6-Q7", "topic": 6, "qnum": 7, "question": "You are in charge of the new Game Backend Platform architecture. The game communicates with the backend over a REST API.You want to follow Google-recommended practices. How should you design the backend?", "options": [{"letter": "A", "text": "Create an instance template for the backend. For every region, deploy it on a multi-zone managed instance group. Use an L4 load balancer."}, {"letter": "B", "text": "Create an instance template for the backend. For every region, deploy it on a single-zone managed instance group. Use an L4 load balancer."}, {"letter": "C", "text": "Create an instance template for the backend. For every region, deploy it on a multi-zone managed instance group. Use an L7 load balancer."}, {"letter": "D", "text": "Create an instance template for the backend. For every region, deploy it on a single-zone managed instance group. Use an L7 load balancer."}], "answer": "C", "caseStudy": "Mountkirk Games", "link": "https://www.examtopics.com/discussions/google/view/7238-exam-professional-cloud-architect-topic-6-question-7/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["Load Balancing", "Compute Engine", "高可用性/災難復原", "案例研究題"]}, {"id": "T7-Q1", "topic": 7, "qnum": 1, "question": "You need to optimize batch file transfers into Cloud Storage for Mountkirk Games' new Google Cloud solution. The batch files contain game statistics that need to be staged in Cloud Storage and be processed by an extract transform load (ETL) tool. What should you do?", "options": [{"letter": "A", "text": "Use gsutil to batch move files in sequence."}, {"letter": "B", "text": "Use gsutil to batch copy the files in parallel."}, {"letter": "C", "text": "Use gsutil to extract the files as the first part of ETL."}, {"letter": "D", "text": "Use gsutil to load the files as the last part of ETL."}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56977-exam-professional-cloud-architect-topic-7-question-1/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Cloud Storage", "效能調校"]}, {"id": "T7-Q2", "topic": 7, "qnum": 2, "question": "You are implementing Firestore for Mountkirk Games. Mountkirk Games wants to give a new game programmatic access to a legacy game's Firestore database.Access should be as restricted as possible. What should you do?", "options": [{"letter": "A", "text": "Create a service account (SA) in the legacy game's Google Cloud project, add a second SA in the new game's IAM page, and then give the Organization Admin role to both SAs."}, {"letter": "B", "text": "Create a service account (SA) in the legacy game's Google Cloud project, give the SA the Organization Admin role, and then give it the Firebase Admin role in both projects."}, {"letter": "C", "text": "Create a service account (SA) in the legacy game's Google Cloud project, add this SA in the new game's IAM page, and then give it the Firebase Admin role in both projects."}, {"letter": "D", "text": "Create a service account (SA) in the legacy game's Google Cloud project, give it the Firebase Admin role, and then migrate the new game to the legacy game's project."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56978-exam-professional-cloud-architect-topic-7-question-2/", "postedDate": "2021-07-03", "postedYear": 2021, "tags": ["Datastore/Firestore", "IAM", "安全性"]}, {"id": "T7-Q3", "topic": 7, "qnum": 3, "question": "Mountkirk Games wants to limit the physical location of resources to their operating Google Cloud regions. What should you do?", "options": [{"letter": "A", "text": "Configure an organizational policy which constrains where resources can be deployed."}, {"letter": "B", "text": "Configure IAM conditions to limit what resources can be configured."}, {"letter": "C", "text": "Configure the quotas for resources in the regions not being used to 0."}, {"letter": "D", "text": "Configure a custom alert in Cloud Monitoring so you can disable resources as they are created in other regions."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56732-exam-professional-cloud-architect-topic-7-question-3/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["Organization Policy", "合規性"]}, {"id": "T7-Q4", "topic": 7, "qnum": 4, "question": "You need to implement a network ingress for a new game that meets the defined business and technical requirements. Mountkirk Games wants each regional game instance to be located in multiple Google Cloud regions. What should you do?", "options": [{"letter": "A", "text": "Configure a global load balancer connected to a managed instance group running Compute Engine instances."}, {"letter": "B", "text": "Configure kubemci with a global load balancer and Google Kubernetes Engine."}, {"letter": "C", "text": "Configure a global load balancer with Google Kubernetes Engine."}, {"letter": "D", "text": "Configure Ingress for Anthos with a global load balancer and Google Kubernetes Engine."}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56734-exam-professional-cloud-architect-topic-7-question-4/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "Load Balancing", "多區域架構"]}, {"id": "T7-Q5", "topic": 7, "qnum": 5, "question": "Your development teams release new versions of games running on Google Kubernetes Engine (GKE) daily. You want to create service level indicators (SLIs) to evaluate the quality of the new versions from the user's perspective. What should you do?", "options": [{"letter": "A", "text": "Create CPU Utilization and Request Latency as service level indicators."}, {"letter": "B", "text": "Create GKE CPU Utilization and Memory Utilization as service level indicators."}, {"letter": "C", "text": "Create Request Latency and Error Rate as service level indicators."}, {"letter": "D", "text": "Create Server Uptime and Error Rate as service level indicators."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56735-exam-professional-cloud-architect-topic-7-question-5/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["GKE/Kubernetes", "監控與可觀測性"]}, {"id": "T7-Q6", "topic": 7, "qnum": 6, "question": "Mountkirk Games wants you to secure the connectivity from the new gaming application platform to Google Cloud. You want to streamline the process and followGoogle-recommended practices. What should you do?", "options": [{"letter": "A", "text": "Configure Workload Identity and service accounts to be used by the application platform."}, {"letter": "B", "text": "Use Kubernetes Secrets, which are obfuscated by default. Configure these Secrets to be used by the application platform."}, {"letter": "C", "text": "Configure Kubernetes Secrets to store the secret, enable Application-Layer Secrets Encryption, and use Cloud Key Management Service (Cloud KMS) to manage the encryption keys. Configure these Secrets to be used by the application platform."}, {"letter": "D", "text": "Configure HashiCorp Vault on Compute Engine, and use customer managed encryption keys and Cloud Key Management Service (Cloud KMS) to manage the encryption keys. Configure these Secrets to be used by the application platform."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56645-exam-professional-cloud-architect-topic-7-question-6/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["IAM", "安全性", "GKE/Kubernetes"]}, {"id": "T7-Q7", "topic": 7, "qnum": 7, "question": "Your development team has created a mobile game app. You want to test the new mobile app on Android and iOS devices with a variety of configurations. You need to ensure that testing is efficient and cost-effective. What should you do?", "options": [{"letter": "A", "text": "Upload your mobile app to the Firebase Test Lab, and test the mobile app on Android and iOS devices."}, {"letter": "B", "text": "Create Android and iOS VMs on Google Cloud, install the mobile app on the VMs, and test the mobile app."}, {"letter": "C", "text": "Create Android and iOS containers on Google Kubernetes Engine (GKE), install the mobile app on the containers, and test the mobile app."}, {"letter": "D", "text": "Upload your mobile app with different configurations to Firebase Hosting and test each configuration."}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/56798-exam-professional-cloud-architect-topic-7-question-7/", "postedDate": "2021-07-01", "postedYear": 2021, "tags": ["CI/CD", "成本優化"]}, {"id": "T8-Q2", "topic": 8, "qnum": 2, "question": "The TerramEarth development team wants to create an API to meet the company's business requirements. You want the development team to focus their development effort on business value versus creating a custom framework.Which method should they use?", "options": [{"letter": "A", "text": "Use Google App Engine with Google Cloud Endpoints. Focus on an API for dealers and partners"}, {"letter": "B", "text": "Use Google App Engine with a JAX-RS Jersey Java-based framework. Focus on an API for the public"}, {"letter": "C", "text": "Use Google App Engine with the Swagger (Open API Specification) framework. Focus on an API for the public"}, {"letter": "D", "text": "Use Google Container Engine with a Django Python container. Focus on an API for the public"}, {"letter": "E", "text": "Use Google Container Engine with a Tomcat container with the Swagger (Open API Specification) framework. Focus on an API for dealers and partners"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11085-exam-professional-cloud-architect-topic-8-question-2/", "postedDate": "2019-12-30", "postedYear": 2019, "tags": ["App Engine", "Apigee"]}, {"id": "T8-Q3", "topic": 8, "qnum": 3, "question": "Your development team has created a structured API to retrieve vehicle data. They want to allow third parties to develop tools for dealerships that use this vehicle event data. You want to support delegated authorization against this data.What should you do?", "options": [{"letter": "A", "text": "Build or leverage an OAuth-compatible access control system"}, {"letter": "B", "text": "Build SAML 2.0 SSO compatibility into your authentication system"}, {"letter": "C", "text": "Restrict data access based on the source IP address of the partner systems"}, {"letter": "D", "text": "Create secondary credentials for each dealer that can be given to the trusted third party"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9449-exam-professional-cloud-architect-topic-8-question-3/", "postedDate": "2019-11-30", "postedYear": 2019, "tags": ["安全性", "IAM"]}, {"id": "T8-Q4", "topic": 8, "qnum": 4, "question": "TerramEarth plans to connect all 20 million vehicles in the field to the cloud. This increases the volume to 20 million 600 byte records a second for 40 TB an hour.How should you design the data ingestion?", "options": [{"letter": "A", "text": "Vehicles write data directly to GCS"}, {"letter": "B", "text": "Vehicles write data directly to Google Cloud Pub/Sub"}, {"letter": "C", "text": "Vehicles stream data directly to Google BigQuery"}, {"letter": "D", "text": "Vehicles continue to write data using the existing system (FTP)"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6657-exam-professional-cloud-architect-topic-8-question-4/", "postedDate": "2019-10-16", "postedYear": 2019, "tags": ["Pub/Sub", "效能調校"]}, {"id": "T8-Q5", "topic": 8, "qnum": 5, "question": "You analyzed TerramEarth's business requirement to reduce downtime, and found that they can achieve a majority of time saving by reducing customer's wait time for parts. You decided to focus on reduction of the 3 weeks aggregate reporting time.Which modifications to the company's processes should you recommend?", "options": [{"letter": "A", "text": "Migrate from CSV to binary format, migrate from FTP to SFTP transport, and develop machine learning analysis of metrics"}, {"letter": "B", "text": "Migrate from FTP to streaming transport, migrate from CSV to binary format, and develop machine learning analysis of metrics"}, {"letter": "C", "text": "Increase fleet cellular connectivity to 80%, migrate from FTP to streaming transport, and develop machine learning analysis of metrics"}, {"letter": "D", "text": "Migrate from FTP to SFTP transport, develop machine learning analysis of metrics, and increase dealer local inventory by a fixed factor"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8687-exam-professional-cloud-architect-topic-8-question-5/", "postedDate": "2019-11-20", "postedYear": 2019, "tags": ["Dataflow/Dataproc", "效能調校"]}, {"id": "T8-Q6", "topic": 8, "qnum": 6, "question": "Which of TerramEarth's legacy enterprise processes will experience significant change as a result of increased Google Cloud Platform adoption?", "options": [{"letter": "A", "text": "Opex/capex allocation, LAN changes, capacity planning"}, {"letter": "B", "text": "Capacity planning, TCO calculations, opex/capex allocation"}, {"letter": "C", "text": "Capacity planning, utilization measurement, data center expansion"}, {"letter": "D", "text": "Data Center expansion, TCO calculations, utilization measurement"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/12205-exam-professional-cloud-architect-topic-8-question-6/", "postedDate": "2020-01-17", "postedYear": 2020, "tags": ["成本優化"]}, {"id": "T8-Q7", "topic": 8, "qnum": 7, "question": "To speed up data retrieval, more vehicles will be upgraded to cellular connections and be able to transmit data to the ETL process. The current FTP process is error-prone and restarts the data transfer from the start of the file when connections fail, which happens often. You want to improve the reliability of the solution and minimize data transfer time on the cellular connections.What should you do?", "options": [{"letter": "A", "text": "Use one Google Container Engine cluster of FTP servers. Save the data to a Multi-Regional bucket. Run the ETL process using data in the bucket"}, {"letter": "B", "text": "Use multiple Google Container Engine clusters running FTP servers located in different regions. Save the data to Multi-Regional buckets in US, EU, and Asia. Run the ETL process using the data in the bucket"}, {"letter": "C", "text": "Directly transfer the files to different Google Cloud Multi-Regional Storage bucket locations in US, EU, and Asia using Google APIs over HTTP(S). Run the ETL process using the data in the bucket"}, {"letter": "D", "text": "Directly transfer the files to a different Google Cloud Regional Storage bucket location in US, EU, and Asia using Google APIs over HTTP(S). Run the ETL process to retrieve the data from each Regional bucket"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6485-exam-professional-cloud-architect-topic-8-question-7/", "postedDate": "2019-10-12", "postedYear": 2019, "tags": ["Cloud Storage", "效能調校", "高可用性/災難復原"]}, {"id": "T8-Q8", "topic": 8, "qnum": 8, "question": "TerramEarth's 20 million vehicles are scattered around the world. Based on the vehicle's location, its telemetry data is stored in a Google Cloud Storage (GCS) regional bucket (US, Europe, or Asia). The CTO has asked you to run a report on the raw telemetry data to determine why vehicles are breaking down after 100 K miles. You want to run this job on all the data.What is the most cost-effective way to run this job?", "options": [{"letter": "A", "text": "Move all the data into 1 zone, then launch a Cloud Dataproc cluster to run the job"}, {"letter": "B", "text": "Move all the data into 1 region, then launch a Google Cloud Dataproc cluster to run the job"}, {"letter": "C", "text": "Launch a cluster in each region to preprocess and compress the raw data, then move the data into a multi-region bucket and use a Dataproc cluster to finish the job"}, {"letter": "D", "text": "Launch a cluster in each region to preprocess and compress the raw data, then move the data into a region bucket and use a Cloud Dataproc cluster to finish the job"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8248-exam-professional-cloud-architect-topic-8-question-8/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Dataflow/Dataproc", "Cloud Storage", "成本優化", "多區域架構"]}, {"id": "T8-Q9", "topic": 8, "qnum": 9, "question": "TerramEarth has equipped all connected trucks with servers and sensors to collect telemetry data. Next year they want to use the data to train machine learning models. They want to store this data in the cloud while reducing costs.What should they do?", "options": [{"letter": "A", "text": "Have the vehicle's computer compress the data in hourly snapshots, and store it in a Google Cloud Storage (GCS) Nearline bucket"}, {"letter": "B", "text": "Push the telemetry data in real-time to a streaming dataflow job that compresses the data, and store it in Google BigQuery"}, {"letter": "C", "text": "Push the telemetry data in real-time to a streaming dataflow job that compresses the data, and store it in Cloud Bigtable"}, {"letter": "D", "text": "Have the vehicle's computer compress the data in hourly snapshots, and store it in a GCS Coldline bucket"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8249-exam-professional-cloud-architect-topic-8-question-9/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Cloud Storage", "成本優化"]}, {"id": "T8-Q10", "topic": 8, "qnum": 10, "question": "Your agricultural division is experimenting with fully autonomous vehicles. You want your architecture to promote strong security during vehicle operation.Which two architectures should you consider? (Choose two.)", "options": [{"letter": "A", "text": "Treat every micro service call between modules on the vehicle as untrusted."}, {"letter": "B", "text": "Require IPv6 for connectivity to ensure a secure address space."}, {"letter": "C", "text": "Use a trusted platform module (TPM) and verify firmware and binaries on boot."}, {"letter": "D", "text": "Use a functional programming language to isolate code execution cycles."}, {"letter": "E", "text": "Use multiple connectivity subsystems for redundancy."}, {"letter": "F", "text": "Enclose the vehicle's drive electronics in a Faraday cage to isolate chips."}], "answer": "AC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/12751-exam-professional-cloud-architect-topic-8-question-10/", "postedDate": "2020-01-26", "postedYear": 2020, "tags": ["安全性", "Confidential Computing"]}, {"id": "T8-Q11", "topic": 8, "qnum": 11, "question": "Operational parameters such as oil pressure are adjustable on each of TerramEarth's vehicles to increase their efficiency, depending on their environmental conditions. Your primary goal is to increase the operating efficiency of all 20 million cellular and unconnected vehicles in the field.How can you accomplish this goal?", "options": [{"letter": "A", "text": "Have you engineers inspect the data for patterns, and then create an algorithm with rules that make operational adjustments automatically"}, {"letter": "B", "text": "Capture all operating data, train machine learning models that identify ideal operations, and run locally to make operational adjustments automatically"}, {"letter": "C", "text": "Implement a Google Cloud Dataflow streaming job with a sliding window, and use Google Cloud Messaging (GCM) to make operational adjustments automatically"}, {"letter": "D", "text": "Capture all operating data, train machine learning models that identify ideal operations, and host in Google Cloud Machine Learning (ML) Platform to make operational adjustments automatically"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/8250-exam-professional-cloud-architect-topic-8-question-11/", "postedDate": "2019-11-15", "postedYear": 2019, "tags": ["Vertex AI/AI-ML"]}, {"id": "T9-Q1", "topic": 9, "qnum": 1, "question": "To be compliant with European GDPR regulation, TerramEarth is required to delete data generated from itsEuropean customers after a period of 36 months when it contains personal data. In the new architecture, this data will be stored in both Cloud Storage andBigQuery. What should you do?", "options": [{"letter": "A", "text": "Create a BigQuery table for the European data, and set the table retention period to 36 months. For Cloud Storage, use gsutil to enable lifecycle management using a DELETE action with an Age condition of 36 months."}, {"letter": "B", "text": "Create a BigQuery table for the European data, and set the table retention period to 36 months. For Cloud Storage, use gsutil to create a SetStorageClass to NONE action when with an Age condition of 36 months."}, {"letter": "C", "text": "Create a BigQuery time-partitioned table for the European data, and set the partition expiration period to 36 months. For Cloud Storage, use gsutil to enable lifecycle management using a DELETE action with an Age condition of 36 months."}, {"letter": "D", "text": "Create a BigQuery time-partitioned table for the European data, and set the partition expiration period to 36 months. For Cloud Storage, use gsutil to create a SetStorageClass to NONE action with an Age condition of 36 months."}], "answer": "C", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/6489-exam-professional-cloud-architect-topic-9-question-1/", "postedDate": "2019-10-12", "postedYear": 2019, "tags": ["BigQuery", "Cloud Storage", "合規性", "案例研究題"]}, {"id": "T9-Q2", "topic": 9, "qnum": 2, "question": "TerramEarth has decided to store data files in Cloud Storage. You need to configure Cloud Storage lifecycle rule to store 1 year of data and minimize file storage cost.Which two actions should you take?", "options": [{"letter": "A", "text": "Create a Cloud Storage lifecycle rule with Age: ג€30ג€, Storage Class: ג€Standardג€, and Action: ג€Set to Coldlineג€, and create a second GCS life-cycle rule with Age: ג€365ג€, Storage Class: ג€Coldlineג€, and Action: ג€Deleteג€."}, {"letter": "B", "text": "Create a Cloud Storage lifecycle rule with Age: ג€30ג€, Storage Class: ג€Coldlineג€, and Action: ג€Set to Nearlineג€, and create a second GCS life-cycle rule with Age: ג€91ג€, Storage Class: ג€Coldlineג€, and Action: ג€Set to Nearlineג€."}, {"letter": "C", "text": "Create a Cloud Storage lifecycle rule with Age: ג€90ג€, Storage Class: ג€Standardג€, and Action: ג€Set to Nearlineג€, and create a second GCS life-cycle rule with Age: ג€91ג€, Storage Class: ג€Nearlineג€, and Action: ג€Set to Coldlineג€."}, {"letter": "D", "text": "Create a Cloud Storage lifecycle rule with Age: ג€30ג€, Storage Class: ג€Standardג€, and Action: ג€Set to Coldlineג€, and create a second GCS life-cycle rule with Age: ג€365ג€, Storage Class: ג€Nearlineג€, and Action: ג€Deleteג€."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/57128-exam-professional-cloud-architect-topic-9-question-2/", "postedDate": "2021-07-05", "postedYear": 2021, "tags": ["Cloud Storage", "成本優化", "案例研究題"]}, {"id": "T9-Q3", "topic": 9, "qnum": 3, "question": "You need to implement a reliable, scalable GCP solution for the data warehouse for your company,TerramEarth.Considering the TerramEarth business and technical requirements, what should you do?", "options": [{"letter": "A", "text": "Replace the existing data warehouse with BigQuery. Use table partitioning."}, {"letter": "B", "text": "Replace the existing data warehouse with a Compute Engine instance with 96 CPUs."}, {"letter": "C", "text": "Replace the existing data warehouse with BigQuery. Use federated data sources."}, {"letter": "D", "text": "Replace the existing data warehouse with a Compute Engine instance with 96 CPUs. Add an additional Compute Engine preemptible instance with 32 CPUs."}], "answer": "A", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/7260-exam-professional-cloud-architect-topic-9-question-3/", "postedDate": "2019-10-26", "postedYear": 2019, "tags": ["BigQuery", "資料庫Schema設計", "案例研究題"]}, {"id": "T9-Q4", "topic": 9, "qnum": 4, "question": "A new architecture that writes all incoming data to BigQuery has been introduced. You notice that the data is dirty, and want to ensure data quality on an automated daily basis while managing cost.What should you do?", "options": [{"letter": "A", "text": "Set up a streaming Cloud Dataflow job, receiving data by the ingestion process. Clean the data in a Cloud Dataflow pipeline."}, {"letter": "B", "text": "Create a Cloud Function that reads data from BigQuery and cleans it. Trigger the Cloud Function from a Compute Engine instance."}, {"letter": "C", "text": "Create a SQL statement on the data in BigQuery, and save it as a view. Run the view daily, and save the result to a new table."}, {"letter": "D", "text": "Use Cloud Dataprep and configure the BigQuery tables as the source. Schedule a daily job to clean the data."}], "answer": "D", "caseStudy": "TerramEarth", "link": "https://www.examtopics.com/discussions/google/view/13467-exam-professional-cloud-architect-topic-9-question-4/", "postedDate": "2020-02-05", "postedYear": 2020, "tags": ["Dataflow/Dataproc", "BigQuery", "成本優化", "案例研究題"]}, {"id": "T9-Q5", "topic": 9, "qnum": 5, "question": "Considering the technical requirements, how should you reduce the unplanned vehicle downtime in GCP?", "options": [
