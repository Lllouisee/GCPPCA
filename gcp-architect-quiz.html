<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCP Professional Cloud Architect 刷題筆記</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --border:#e2e6ef; --text:#1f2430; --muted:#6b7280;
    --primary:#3b6fd6; --primary-dark:#2c56ad; --green:#1d9a6c; --green-bg:#e6f7ef;
    --red:#d64545; --red-bg:#fdecec; --amber:#b9820a; --amber-bg:#fff6e0;
    --radius:12px; --shadow:0 2px 10px rgba(20,30,60,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  a{color:var(--primary);}
  code{background:#eef1f8;padding:1px 5px;border-radius:4px;font-size:0.92em;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--border);padding:18px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar h1{font-size:20px;margin:0 0 4px;}
  .sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:18px;}
  .sidebar section{margin-bottom:20px;}
  .sidebar section h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;}
  .search-box{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
  .topic-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .topic-list label{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 4px;border-radius:6px;cursor:pointer;}
  .topic-list label:hover{background:#f0f3fa;}
  .topic-list .count{margin-left:auto;color:var(--muted);font-size:11px;}
  .mini-btn-row{display:flex;gap:6px;margin-bottom:6px;}
  .mini-btn{font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;color:var(--muted);}
  .mini-btn:hover{background:#f0f3fa;}
  .qidx-list{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px;}
  .qidx-empty{padding:8px;font-size:12.5px;color:var(--muted);text-align:center;}
  .qidx-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;border:1px solid transparent;}
  .qidx-item:hover{background:#f0f3fa;}
  .qidx-item.active{background:#eaf0fd;border-color:var(--primary);}
  .qidx-status{width:14px;flex:none;text-align:center;}
  .qidx-status.correct{color:var(--green);}
  .qidx-status.wrong{color:var(--red);}
  .qidx-label{flex:1;color:var(--text);}
  .qidx-star{color:var(--amber);flex:none;}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;padding:7px 4px;font-size:12px;border:none;background:#fff;cursor:pointer;color:var(--muted);}
  .seg button.active{background:var(--primary);color:#fff;}
  .status-opts{display:flex;flex-direction:column;gap:4px;}
  .status-opts label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat-card{background:#f7f9fd;border-radius:8px;padding:8px 10px;}
  .stat-card .num{font-size:21px;font-weight:700;}
  .stat-card .lbl{font-size:11px;color:var(--muted);}
  .stat-card.correct .num{color:var(--green);}
  .stat-card.wrong .num{color:var(--red);}
  .reset-btn{width:100%;margin-top:10px;padding:8px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:8px;cursor:pointer;font-size:12px;}
  .reset-btn:hover{background:var(--red-bg);}
  .incomplete-note{font-size:11px;color:var(--muted);line-height:1.6;}
  .incomplete-note a{display:block;}

  .main{flex:1;padding:28px 36px;max-width:880px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .progress-text{font-size:13px;color:var(--muted);}
  .progress-bar{height:6px;background:#e7ebf4;border-radius:4px;overflow:hidden;margin-top:6px;width:220px;}
  .progress-bar > div{height:100%;background:var(--primary);}

  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;background:#eef1f8;color:var(--muted);font-weight:600;}
  .badge.multi{background:var(--amber-bg);color:var(--amber);}
  .case-badge{font-size:11px;padding:3px 9px;border-radius:999px;background:#eef3ff;color:var(--primary-dark);cursor:pointer;border:1px solid #d7e2fb;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px;}
  .tag-chip{font-size:11px;padding:3px 9px;border-radius:999px;background:#f1eefc;color:#6a3fd1;border:1px solid #ddd3f7;white-space:nowrap;}
  .tag-chip.custom{background:#fef3ec;color:#b9570a;border-color:#fbe0cc;}
  .tag-add{display:inline-flex;align-items:center;gap:4px;}
  .tag-add input{font-size:11px;padding:3px 7px;border:1px dashed var(--border);border-radius:999px;width:84px;background:transparent;}
  .tag-add input:focus{outline:none;border-color:var(--primary);width:120px;}
  .tag-list-pick{display:flex;flex-wrap:wrap;gap:4px;}
  .tag-list-pick .tag-cb-label{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:999px;background:#f3f4f8;cursor:pointer;}
  .tag-list-pick .tag-cb-label .count{color:var(--muted);font-size:10.5px;}
  .star-btn{margin-left:auto;background:none;border:none;font-size:18px;cursor:pointer;color:#d9d9d9;}
  .star-btn.on{color:#eab308;}

  .case-study-box{display:none;background:#f7f9fd;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.7;color:#454c5c;margin-bottom:14px;white-space:pre-wrap;max-height:260px;overflow-y:auto;}
  .case-study-box.open{display:block;}

  .question-text{font-size:18px;line-height:1.75;margin-bottom:18px;white-space:pre-wrap;}
  .kw-highlight{background:var(--amber-bg);color:#8a5c00;padding:0 3px;border-radius:4px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone;}

  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:15px;line-height:1.6;transition:background .12s,border-color .12s;}
  .option:hover{background:#f7f9fd;}
  .option input{margin-top:3px;flex:none;}
  .option .letter{font-weight:700;flex:none;color:var(--muted);}
  .option.selected{border-color:var(--primary);background:#f0f5ff;}
  .option.correct{border-color:var(--green);background:var(--green-bg);}
  .option.wrong{border-color:var(--red);background:var(--red-bg);}
  .option.disabled{cursor:default;}

  .action-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:14px;cursor:pointer;font-weight:600;}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:#fff;color:var(--muted);}
  .btn.ghost:hover{background:#f0f3fa;}

  .result-banner{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;}
  .result-banner.ok{background:var(--green-bg);color:var(--green);}
  .result-banner.bad{background:var(--red-bg);color:var(--red);}
  .result-sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-top:4px;}
  .explain-box{margin-top:14px;padding:12px 14px;border-radius:8px;background:#fff8e6;border:1px solid #f0dca0;font-size:13.5px;line-height:1.75;color:#5c4a1a;white-space:pre-wrap;}
  .explain-box .explain-label{font-weight:700;margin-bottom:4px;color:#8a6d1f;}

  .explain-rich{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
  .acc{border:1px solid #cfe0f7;border-radius:10px;overflow:hidden;background:#fff;}
  .acc-head{background:#eaf2ff;color:#1f4fa8;padding:10px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;}
  .acc-head .tri{display:inline-block;transition:transform .15s;}
  .acc-head.collapsed .tri{transform:rotate(-90deg);}
  .acc-body{padding:14px 16px;}
  .acc-body.collapsed{display:none;}
  .question-zh{background:#f6f7fb;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.7;}
  .question-zh-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .zh-translate{margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.6;}
  .opt-table{width:100%;border-collapse:collapse;font-size:13px;}
  .opt-table th{background:#f3f7fd;color:#1f4fa8;text-align:left;padding:8px 10px;font-size:11.5px;}
  .opt-table td{padding:10px;border-top:1px solid #eef1f8;vertical-align:top;line-height:1.6;}
  .opt-table td.opt-letter{white-space:nowrap;font-weight:700;}
  .opt-table tr.ok{background:#f3fbf7;}
  .opt-table tr.bad{background:#fef6f6;}
  .opt-table tr.ok td.opt-letter{color:#1d9a6c;}
  .opt-table tr.bad td.opt-letter{color:#d64545;}
  .opt-table tr.my-answer{background:#e3f7ec;}
  .opt-table tr.my-answer td.opt-letter{color:#0e8a53;font-weight:800;}
  .opt-table tr.community-answer{background:var(--amber-bg);}
  .opt-table tr.community-answer td.opt-letter{color:var(--amber);}
  .my-answer-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:#0e8a53;color:#fff;font-size:10px;font-weight:700;vertical-align:middle;white-space:nowrap;}
  .community-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber);font-size:10px;font-weight:700;vertical-align:middle;white-space:nowrap;}
  .badge.disputed{background:var(--amber-bg);color:var(--amber);}
  .note-block{margin-bottom:16px;}
  .note-block:last-child{margin-bottom:0;}
  .note-heading{font-weight:700;color:#1f4fa8;margin-bottom:6px;font-size:14px;}
  .note-body{font-size:13.5px;line-height:1.75;color:#333;}
  .note-body p{margin:0 0 8px;}
  .note-body p:last-child{margin-bottom:0;}
  .note-body code{background:#eef1f8;padding:1px 5px;border-radius:4px;}
  .note-diagram{background:#f4f6fb;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.7;color:#333;overflow-x:auto;margin-top:6px;white-space:pre;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .nav-row .mid{display:flex;gap:8px;}
  .source-link{font-size:11.5px;color:var(--muted);margin-top:16px;}

  .empty-state{text-align:center;padding:80px 20px;color:var(--muted);}

  /* ---- top-level tabs ---- */
  .app-tabs{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:50;}
  .app-tabs button{padding:13px 18px;border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .app-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);}
  .app-tabs button:hover{color:var(--primary-dark);}

  /* ---- mind map ---- */
  .mm-wrap{display:flex;flex-direction:column;height:calc(100vh - 46px);}
  .mm-toolbar{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;}
  .mm-toolbar .spacer{flex:1;}
  .mm-toolbar .hint{font-size:12px;color:var(--muted);}
  .mm-toolbar button.linking{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
  .mm-board-outer{flex:1;overflow:auto;position:relative;background:
      linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(0deg, rgba(0,0,0,0.025) 1px, transparent 1px) 0 0/24px 24px, var(--bg);}
  .mm-board{position:relative;display:flex;gap:22px;padding:26px;min-height:100%;min-width:max-content;}
  .mm-edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
  .mm-edge-del{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--red);font-size:12px;line-height:18px;text-align:center;cursor:pointer;box-shadow:var(--shadow);}
  .mm-edge-label{position:absolute;background:#fff;border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer;transform:translate(-50%,-50%);}

  .mm-group{width:260px;flex:none;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;overflow:hidden;}
  .mm-group-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);border-top:4px solid var(--grp-color,var(--primary));}
  .mm-group-head .dot{width:9px;height:9px;border-radius:50%;background:var(--grp-color,var(--primary));flex:none;}
  .mm-group-head .name{font-weight:700;font-size:14px;flex:1;outline:none;cursor:text;min-width:0;overflow-wrap:anywhere;}
  .mm-group-head .del{background:none;border:none;color:#c6cad4;cursor:pointer;font-size:13px;}
  .mm-group-head .del:hover{color:var(--red);}
  .mm-group-body{padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
  .mm-add-node{margin:0 12px 12px;padding:8px;border:1px dashed var(--border);border-radius:8px;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;}
  .mm-add-node:hover{background:#f7f9fd;color:var(--primary);}

  .mm-node{border:1px solid var(--border);border-radius:9px;padding:10px 11px;background:#fff;cursor:pointer;position:relative;}
  .mm-node:hover{box-shadow:0 1px 6px rgba(20,30,60,0.10);}
  .mm-node.linking-from{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-bg);}
  .mm-node.link-target{border-color:var(--primary);box-shadow:0 0 0 2px #e3ecff;}
  .mm-node .title{font-weight:700;font-size:13.5px;outline:none;margin-bottom:3px;overflow-wrap:anywhere;}
  .mm-node .detail{font-size:12px;color:var(--muted);line-height:1.55;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;}
  .mm-node .del{position:absolute;top:4px;right:6px;background:none;border:none;color:#d7dae2;font-size:12px;cursor:pointer;display:none;}
  .mm-node:hover .del{display:block;}
  .mm-node .del:hover{color:var(--red);}

  .mm-empty{margin:auto;text-align:center;color:var(--muted);padding:60px;}
  .mm-empty button{margin-top:14px;}

  .mm-modal-bg{position:fixed;inset:0;background:rgba(20,25,40,0.45);display:flex;align-items:center;justify-content:center;z-index:100;}
  .mm-modal{background:#fff;border-radius:var(--radius);padding:22px 24px;width:560px;max-width:92vw;max-height:84vh;display:flex;flex-direction:column;gap:10px;}
  .mm-modal h3{margin:0;font-size:16px;}
  .mm-modal textarea{width:100%;flex:1;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:10px;border:1px solid var(--border);border-radius:8px;resize:vertical;}
  .mm-modal .row{display:flex;gap:8px;justify-content:flex-end;}
  .mm-modal .err{color:var(--red);font-size:12px;min-height:14px;}
  .mm-modal .hint{font-size:12px;color:var(--muted);line-height:1.6;}

  .mm-group-head .name[contenteditable]:empty:before,
  .mm-node .title[contenteditable]:empty:before,
  .mm-node .detail[contenteditable]:empty:before{content:attr(data-placeholder);color:#c7cbd6;}
  #mmBoard.mm-linking .mm-node{cursor:crosshair;}
  #mmBoard.mm-linking .mm-node .title,
  #mmBoard.mm-linking .mm-node .detail{pointer-events:none;}
  .mm-group-head .name:focus,.mm-node .title:focus,.mm-node .detail:focus{background:#f7f9fd;border-radius:4px;}

  @media (max-width: 860px){
    .layout{flex-direction:column;}
    .sidebar{width:auto;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border);}
    .main{padding:18px;}
    .sidebar-toggle{left:6px !important;}
  }

  .sidebar{transition:width .18s ease, padding .18s ease;}
  body.sidebarCollapsed .sidebar{width:0;padding:0;overflow:hidden;border-right:none;}
  .sidebar-toggle{position:fixed;top:18px;left:266px;z-index:100;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;box-shadow:var(--shadow);cursor:pointer;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:left .18s ease;}
  .sidebar-toggle:hover{background:#f0f3fa;color:var(--text);}
  body.sidebarCollapsed .sidebar-toggle{left:6px;}
</style>
</head>
<body>
<button id="sidebarToggle" class="sidebar-toggle" title="收合/展開側邊欄">◀</button>
<script>
(function(){
  var KEY = 'gcpPcaSidebarCollapsed_v1';
  var btn = document.getElementById('sidebarToggle');
  function apply(collapsed){
    document.body.classList.toggle('sidebarCollapsed', collapsed);
    btn.textContent = collapsed ? '▶' : '◀';
  }
  var saved = false;
  try { saved = localStorage.getItem(KEY) === '1'; } catch(e){}
  apply(saved);
  btn.onclick = function(){
    var collapsed = !document.body.classList.contains('sidebarCollapsed');
    apply(collapsed);
    try { localStorage.setItem(KEY, collapsed ? '1' : '0'); } catch(e){}
  };
})();
</script>
<div class="app-tabs">
  <button data-tab="quiz" class="active">📝 刷題</button>
  <button data-tab="mindmap">🧠 心智圖</button>
</div>

<div id="quizPanel" class="layout">
  <aside class="sidebar">
    <h1>🧭 GCP PCA 刷題筆記</h1>
    <div class="sub">共 <span id="totalCount">0</span> 題 · 資料來源 ExamTopics 社群討論</div>

    <section>
      <h2>搜尋</h2>
      <input id="searchBox" class="search-box" placeholder="輸入關鍵字（題目 / 選項）">
    </section>

    <section>
      <h2>練習模式</h2>
      <div class="seg" id="modeSeg">
        <button data-mode="sequential" class="active">依序</button>
        <button data-mode="shuffle">隨機</button>
      </div>
    </section>

    <section>
      <h2>顯示題目</h2>
      <div class="status-opts" id="statusOpts">
        <label><input type="radio" name="statusFilter" value="all" checked> 全部</label>
        <label><input type="radio" name="statusFilter" value="unanswered"> 尚未作答</label>
        <label><input type="radio" name="statusFilter" value="wrong"> 答錯過</label>
        <label><input type="radio" name="statusFilter" value="correct"> 已答對</label>
        <label><input type="radio" name="statusFilter" value="starred"> ⭐ 已標記</label>
      </div>
    </section>

    <section>
      <h2>Topic 篩選</h2>
      <div class="mini-btn-row">
        <button class="mini-btn" id="selectAllTopics">全選</button>
        <button class="mini-btn" id="clearAllTopics">清空</button>
      </div>
      <div class="topic-list" id="topicList"></div>
    </section>

    <section>
      <h2>年份篩選（ExamTopics 留言時間）</h2>
      <div class="mini-btn-row">
        <button class="mini-btn" id="selectAllYears">全選</button>
        <button class="mini-btn" id="clearAllYears">清空</button>
      </div>
      <div class="topic-list" id="yearList"></div>
    </section>

    <section>
      <h2>Tag 篩選</h2>
      <div class="mini-btn-row">
        <button class="mini-btn" id="selectAllTags">全選</button>
        <button class="mini-btn" id="clearAllTags">清空</button>
      </div>
      <div class="topic-list" id="tagList"></div>
    </section>

    <section>
      <h2>學習進度</h2>
      <div class="stat-grid">
        <div class="stat-card"><div class="num" id="statAnswered">0</div><div class="lbl">已作答</div></div>
        <div class="stat-card"><div class="num" id="statRemaining">0</div><div class="lbl">未作答</div></div>
        <div class="stat-card correct"><div class="num" id="statCorrect">0</div><div class="lbl">答對</div></div>
        <div class="stat-card wrong"><div class="num" id="statWrong">0</div><div class="lbl">答錯</div></div>

<script id="quiz-data" type="application/json">{"questions": [{"id": "T1-Q1", "topic": 1, "qnum": 1, "question": "Your company has decided to make a major revision of their API in order to create better experiences for their developers. They need to keep the old version of the API available and deployable, while allowing new customers and testers to try out the new API. They want to keep the same SSL and DNS records in place to serve both APIs.What should they do?", "options": [{"letter": "A", "text": "Configure a new load balancer for the new version of the API"}, {"letter": "B", "text": "Reconfigure old clients to use a new endpoint for the new API"}, {"letter": "C", "text": "Have the old API forward traffic to the new API based on the path"}, {"letter": "D", "text": "Use separate backend pools for each API path behind the load balancer"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7083-exam-professional-cloud-architect-topic-1-question-1/", "explanation": {"optionTable": [{"letter": "A", "analysis": "另外建一個新的 Load Balancer，代表要用新的外部 IP、可能要重新申請憑證或改 DNS，直接違反「保留同一組 SSL 和 DNS」的要求。"}, {"letter": "B", "analysis": "要求是「新客戶/測試者」試用新版，不是逼所有舊 client 都換，B 會強制既有客戶改動，破壞向下相容。"}, {"letter": "C", "analysis": "讓舊 API 自己做轉發，等於把路由邏輯塞進應用程式層，還讓新版 API 依賴舊版才能被存取，架構上多一層不必要的耦合，也不是 GCP 建議的做法。"}, {"letter": "D", "analysis": "正確：GCP HTTP(S) Load Balancer 支援 **path-based routing**，用同一組外部 IP／SSL／DNS，透過 URL map 依路徑把流量導到不同的 backend service，完全符合三個需求。"}], "notes": [{"heading": "題目在問什麼", "body": "公司要大改版 API，但有三個限制：① 舊版 API 要保留、能持續部署給既有客戶用；② 新客戶或測試者要能試用新版 API；③ 新舊兩版都要共用同一組 SSL 憑證和 DNS 記錄，也就是同一個對外網域/入口，不能讓使用者改連不同網址。這句話其實在考『怎麼在同一個入口下，依條件把流量分流到不同版本的服務』，而不是單純問 API 版本控制的觀念。"}, {"heading": "答案驗證：D 正確（已核對）", "body": "確認過官方文件與架構邏輯，**D 是對的**：GCP HTTP(S) Load Balancer 本身就支援 path-based routing，可以在同一組外部 IP、SSL 憑證、DNS 記錄下，透過 URL map 依路徑把流量導到不同的 backend service（例如 `/v1/*` 給舊版、`/v2/*` 給新版），完全符合題目三個限制，是 Google 官方建議的多版本並存做法。"}, {"heading": "架構示意", "body": "", "diagram": "使用者請求 example.com/v1/*  或  example.com/v2/*\n            |\n   [HTTP(S) Load Balancer]   <- 同一組 外部IP / SSL憑證 / DNS\n            | URL Map 依路徑判斷\n   +-----------------+-----------------+\n[Backend: 舊版 API]         [Backend: 新版 API]"}, {"heading": "記憶重點", "body": "遇到「同一網域/同一組 DNS、SSL 下要跑多版本 API 或做灰度發布」的題目，優先想 Load Balancer 的 **path-based routing**（URL map + 多個 backend service），而不是另建 Load Balancer 或讓應用程式自己做轉發。"}]}, "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["Load Balancing", "VPC/網路"]}, {"id": "T1-Q2", "topic": 1, "qnum": 2, "question": "Your company plans to migrate a multi-petabyte data set to the cloud. The data set must be available 24hrs a day. Your business analysts have experience only with using a SQL interface.How should you store the data to optimize it for ease of analysis?", "options": [{"letter": "A", "text": "Load data into Google BigQuery"}, {"letter": "B", "text": "Insert data into Google Cloud SQL"}, {"letter": "C", "text": "Put flat files into Google Cloud Storage"}, {"letter": "D", "text": "Stream data into Google Cloud Datastore"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7080-exam-professional-cloud-architect-topic-1-question-2/", "explanation": {"optionTable": [{"letter": "A", "analysis": "正確：BigQuery 是全代管、無伺服器的 PB 級資料倉儲，原生支援標準 SQL，儲存空間自動擴展、不用自己管理叢集，完全符合「多 PB 資料」「SQL 介面」「24 小時可用」三個條件。"}, {"letter": "B", "analysis": "Cloud SQL 是關聯式 OLTP 資料庫（給交易型應用用的），單一執行個體的儲存上限遠低於 PB 等級，設計目的也不是做大規模分析查詢，資料量一大查詢效能會明顯下降。"}, {"letter": "C", "analysis": "Cloud Storage 只是物件儲存服務，資料丟進去之後本身沒有 SQL 查詢介面，分析師沒辦法直接用 SQL 查這些 flat files（除非額外接 BigQuery 外部資料表，但選項裡沒有這個步驟），不符合「只熟悉 SQL」的限制。"}, {"letter": "D", "analysis": "Cloud Datastore（現在是 Firestore in Datastore mode）是 NoSQL 文件資料庫，查詢語言不是標準 SQL，設計上也不是給大規模分析用的，同樣不符合分析師只會寫 SQL 的前提。"}], "notes": [{"heading": "題目在問什麼", "body": "情境是要把「多 PB 等級」的資料搬上雲端，有兩個硬性限制：① 服務要 24 小時都能用；② 做分析的業務分析師只會寫 SQL，不會用其他查詢語言或程式介面。題目問的是「該用哪種儲存方式才能讓資料好做分析」，其實就是在考『SQL 介面 + 巨量資料分析』這個情境該選哪個 GCP 資料服務。"}, {"heading": "延伸知識：PB 到底多大（容量單位對照）", "body": "手機儲存容量通常是 **GB～TB** 等級（64GB、128GB、256GB，旗艦機頂規約 1TB）。題目講的「multi-petabyte」是好幾個 PB，換算下來等於上千支 1TB 手機的容量疊在一起，這已經遠超過 Cloud SQL 單一執行個體的儲存上限（約 64TB，大概是 64 支 1TB 手機），所以才會直接排除 Cloud SQL，只有 BigQuery 這種設計給巨量資料用的服務才撐得住。", "diagram": "1 Byte = 一個英文字母\n1 KB   = 1,024 B     例：一封簡短 email\n1 MB   = 1,024 KB    例：一首 MP3 歌曲\n1 GB   = 1,024 MB    例：一部高畫質電影 / 手機容量單位 (64~512GB)\n1 TB   = 1,024 GB    例：一般家用硬碟、高階手機 (1TB)\n1 PB   = 1,024 TB    例：大型企業整個資料中心的儲存量\n1 EB   = 1,024 PB\n1 ZB   = 1,024 EB"}, {"heading": "答案驗證：A 正確（已核對）", "body": "**BigQuery** 本來就是 Google Cloud 的代表性巨量資料分析服務，設計目標就是用標準 SQL 分析 PB 級資料，而且是全代管服務（高可用、不用自己顧機器），完全對應題目的兩個限制，這題答案沒有標錯。"}, {"heading": "四種服務的本質差異", "body": "**BigQuery** = SQL 分析用的資料倉儲（OLAP）。\n**Cloud SQL** = 關聯式交易資料庫（OLTP），有儲存上限。\n**Cloud Storage** = 純物件儲存，沒有查詢引擎。\n**Cloud Datastore/Firestore** = NoSQL 文件資料庫，查詢語言不是 SQL。\n考試常靠「SQL + 大量資料分析」這組關鍵字直接鎖定 BigQuery。"}, {"heading": "記憶重點", "body": "看到題目同時出現「巨量/PB 級資料」＋「SQL 介面做分析」這兩個關鍵字，直接鎖定 **BigQuery**；Cloud SQL 是拿來處理交易型（OLTP）工作負載，不是用來做大規模分析報表的，兩者角色不要搞混。"}]}, "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["BigQuery", "資料庫Schema設計"]}, {"id": "T1-Q3", "topic": 1, "qnum": 3, "question": "The operations manager asks you for a list of recommended practices that she should consider when migrating a J2EE application to the cloud.Which three practices should you recommend? (Choose three.)", "options": [{"letter": "A", "text": "Port the application code to run on Google App Engine"}, {"letter": "B", "text": "Integrate Cloud Dataflow into the application to capture real-time metrics"}, {"letter": "C", "text": "Instrument the application with a monitoring tool like Stackdriver Debugger"}, {"letter": "D", "text": "Select an automation framework to reliably provision the cloud infrastructure"}, {"letter": "E", "text": "Deploy a continuous integration tool with automated testing in a staging environment"}, {"letter": "F", "text": "Migrate from MySQL to a managed NoSQL database like Google Cloud Datastore or Bigtable"}], "answer": "CDE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54378-exam-professional-cloud-architect-topic-1-question-3/", "explanation": {"optionTable": [{"letter": "A", "analysis": "把程式碼整個搬去改用 App Engine，是很激進的「重寫架構」決定，不是通用的遷移最佳實務。J2EE 企業應用通常用 Compute Engine 或 GKE 做 lift-and-shift 會更合理，題目也沒說要重構應用程式，所以不選。"}, {"letter": "B", "analysis": "Cloud Dataflow 是拿來做大量資料的批次/串流『資料處理管線』，不是用來做應用程式的即時監控指標。要做監控應該用 Stackdriver/Cloud Monitoring，用 Dataflow 做這件事是工具用錯地方。"}, {"letter": "C", "analysis": "正確：遷移過程中幫應用程式加上監控/除錯工具（可觀測性），是不管搬到哪個平台都該做的通用最佳實務，能及早發現遷移後的效能或錯誤問題。"}, {"letter": "D", "analysis": "正確：用自動化框架（Infrastructure as Code，例如 Terraform、Deployment Manager）佈建基礎設施，可以確保環境可重複建立、減少人為設定錯誤，是雲端遷移的核心最佳實務之一。"}, {"letter": "E", "analysis": "正確：建立 CI/CD 工具並在 staging 環境做自動化測試，能在正式上線前攔截問題，降低遷移風險，同樣是不分平台都適用的通用實務。"}, {"letter": "F", "analysis": "把 MySQL 直接換成 NoSQL（Datastore/Bigtable），代表要把關聯式資料模型整個改寫成 NoSQL 資料模型，這是巨大的架構變更、應用程式邏輯可能整個要重寫，題目沒有提到效能瓶頸或擴展性需求，不應該無緣無故建議換資料庫技術棧。"}], "notes": [{"heading": "題目在問什麼", "body": "情境是維運主管要在『遷移一個既有的 J2EE（Java EE）應用程式』之前，問你有哪些建議的最佳實務（這題是多選，要選 3 個）。注意題目沒有要求重構應用程式架構、也沒有提到效能或擴展性不足的問題，所以問的其實是『不管搬到什麼平台，遷移時都該做的通用準備工作』，而不是『該把這個應用程式改寫成哪種雲端原生架構』。"}, {"heading": "答案驗證：CDE 正確（已核對）", "body": "C（監控/可觀測性）、D（用自動化框架做基礎設施佈建）、E（CI/CD + staging 自動化測試），這三個都是雲端遷移裡與『平台無關』的通用 DevOps 最佳實務，目的是讓遷移過程可控、可重複、可觀察。A（硬換 App Engine）跟 F（硬換 NoSQL）都是沒有依據的架構重構，B（Dataflow 做監控）則是工具用途錯誤，這題答案沒有標錯。"}, {"heading": "記憶重點", "body": "看到『遷移到雲端的建議實務』這種題目，優先往 **監控/可觀測性、Infrastructure as Code 自動化佈建、CI/CD 自動化測試** 這三個通用 DevOps 方向想；除非題目明確提到效能瓶頸、擴展性不足或成本問題，否則不要自己腦補去選『換成另一種資料庫』或『改寫成另一種運算平台』這類激進的架構變更選項。"}]}, "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["Terraform/IaC", "CI/CD", "Cloud Monitoring/Logging", "資料遷移"]}, {"id": "T1-Q4", "topic": 1, "qnum": 4, "question": "A news feed web service has the following code running on Google App Engine. During peak load, users report that they can see news articles they already viewed.What is the most likely cause of this problem?", "options": [{"letter": "A", "text": "The session variable is local to just a single instance"}, {"letter": "B", "text": "The session variable is being overwritten in Cloud Datastore"}, {"letter": "C", "text": "The URL of the API needs to be modified to prevent caching"}, {"letter": "D", "text": "The HTTP Expires header needs to be set to -1 stop caching"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7085-exam-professional-cloud-architect-topic-1-question-4/", "explanation": {"optionTable": [{"letter": "A", "analysis": "正確：App Engine 預設會把請求分派到多個 instance 做負載平衡。如果把「使用者已讀過哪些文章」這類狀態存在某個 instance 的本地記憶體（session 變數）裡，尖峰時段流量一大、請求被分派到另一台沒有這份記錄的 instance，狀態就像消失了，導致使用者重複看到已讀文章。"}, {"letter": "B", "analysis": "如果 session 真的存在 Cloud Datastore（集中式、跨 instance 共享的儲存），並不會因為多 instance 而互相覆寫導致這個現象，Datastore 本身設計上就是要被多個 instance 同時存取。"}, {"letter": "C", "analysis": "這個症狀是『已讀狀態不同步』，不是 API URL 被快取住舊資料，修改 URL 無法解決跨 instance 狀態遺失的問題。"}, {"letter": "D", "analysis": "設定 HTTP Expires header 是控制瀏覽器/代理伺服器端的快取行為，跟伺服器端 instance 之間的 session 狀態不同步無關。"}], "notes": [{"heading": "題目在問什麼", "body": "App Engine 上的新聞推播服務，尖峰時段使用者回報看到自己已經看過的文章，問最可能的原因。關鍵字是「尖峰時段」——代表流量大、instance 數量多，請求被分散到不同 instance 上處理。"}, {"heading": "答案驗證：A 正確", "body": "A（session 變數只存在單一 instance 的本地記憶體）完全符合『水平擴展的無狀態服務在多 instance 間狀態不一致』的典型症狀。B 假設狀態存在 Datastore 卻被覆寫，但 Datastore 是跨 instance 共享儲存，不會因多 instance 而互相覆寫；C、D 都是在猜快取問題，但症狀是狀態消失/不同步，不是內容被快取住，所以不選。"}, {"heading": "記憶重點", "body": "看到『App Engine／水平擴展服務，跨請求的狀態在多 instance 之間不一致』這種症狀，優先懷疑『把 session/狀態存在本地記憶體（instance-local state）』，解法是把狀態移到共享儲存，例如 Memcache、Cloud Datastore、Redis。"}, {"heading": "為什麼「雲端服務」還會有 local state 問題", "body": "「雲端服務」代表基礎設施是別人幫你管理、可以自動擴展，不代表你的程式碼自動變成分散式、狀態自動同步，這兩件事是分開的。App Engine 幫你做的是自動佈建機器、自動開關 instance、自動負載平衡；它不會幫你的程式碼自動共享記憶體狀態。流量變大時 App Engine 會啟動多個 instance，如果程式把狀態存在一般變數（如 global dict、static 變數），這個變數只存在那一個 instance 的 process 記憶體裡，不會複製到其他 instance，而且同一使用者的連續請求也不保證被導到同一台 instance（沒有強保證的 session affinity）。結論：雲端只解決了基礎設施層面的擴展，應用層的狀態管理仍要工程師自己處理，正確做法是把需要跨請求共享的狀態放到 Memcache、Cloud Datastore 或 Redis 這類集中式儲存。"}, {"heading": "App Engine 在 AWS 的對應", "body": "App Engine 是 PaaS，只要丟程式碼，GCP 幫你處理伺服器佈建、OS 修補、自動擴縮、負載平衡、版本管理。Standard 環境用沙盒 runtime、可縮到 0；Flexible 環境跑在 Docker container（基於 Compute Engine）。AWS 最接近的對應是 **Elastic Beanstalk**（一樣是丟程式碼、AWS 幫你組 EC2 + Auto Scaling + ELB 這堆資源）。其他對照：Compute Engine ↔ EC2、GKE ↔ EKS、Cloud Functions ↔ Lambda。差別是 Elastic Beanstalk 本質是「自動化包裝好的 EC2 資源」，App Engine Standard 則是更徹底的沙盒化 serverless 平台，連底層 VM 都對開發者隱藏。"}, {"heading": "Compute Engine vs GKE 的差別", "body": "Compute Engine 是純 IaaS：給你一台或多台 VM，作業系統、網路、磁碟都自己管，擴縮要自己設 Managed Instance Group。GKE 是託管的 Kubernetes 服務：本質上還是跑在一堆 Compute Engine VM（node）上，但 GCP 幫你管理 Kubernetes control plane，你只要定義要跑幾個 container、怎麼擴縮，Kubernetes 就自動排程、自我修復（container 掛了自動重啟、node 壞了自動把 Pod 搬到別台）。簡言之：Compute Engine 給你「一台可以為所欲為的機器」，GKE 給你「一個自動幫你排程、修復、擴縮一堆 container 的管理系統」，GKE 是蓋在 Compute Engine 之上的更高層抽象。適合 Compute Engine 的情境是需要完全控制 OS、傳統/legacy 單體應用；適合 GKE 的情境是微服務架構、容器化、需要頻繁 CI/CD 部署。"}]}, "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["App Engine", "自動擴縮"]}, {"id": "T1-Q5", "topic": 1, "qnum": 5, "question": "An application development team believes their current logging tool will not meet their needs for their new cloud-based product. They want a better tool to capture errors and help them analyze their historical log data. You want to help them find a solution that meets their needs.What should you do?", "options": [{"letter": "A", "text": "Direct them to download and install the Google StackDriver logging agent"}, {"letter": "B", "text": "Send them a list of online resources about logging best practices"}, {"letter": "C", "text": "Help them define their requirements and assess viable logging tools"}, {"letter": "D", "text": "Help them upgrade their current tool to take advantage of any new features"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6837-exam-professional-cloud-architect-topic-1-question-5/", "explanation": {"optionTable": [{"letter": "A", "analysis": "跳過需求分析，直接叫對方去裝 Stackdriver (Cloud Logging) agent。技術上這個工具確實存在且常用，但題目根本還沒釐清他們需要什麼（是要更好的錯誤分類？歷史查詢效能？跨雲整合？），直接指定產品是倒果為因。"}, {"letter": "B", "analysis": "只是丟一堆 logging best practice 的線上資源連結，沒有實際參與需求釐清或方案評估，等於沒有真正幫忙解決問題，屬於消極應付。"}, {"letter": "C", "analysis": "先幫對方定義清楚需求（要解決什麼問題、有什麼限制），再去評估市面上有哪些工具可行，是顧問/架構師該有的做事順序，技術方案應該是需求分析後的結果，而不是分析前就決定好。"}, {"letter": "D", "analysis": "直接假設『升級現有工具』就能解決問題，但題目已經說現有工具滿足不了需求，跳過需求分析直接選擇升級路徑，邏輯上站不住腳。"}], "notes": [{"heading": "題目在問什麼", "body": "開發團隊覺得現有 logging 工具滿足不了新產品的需求，想要更好的工具捕捉錯誤、分析歷史 log 資料。問身為架構師該怎麼幫他們。這題考的是『做事方法論』，不是具體技術知識。"}, {"heading": "⚠️ 答案可信度提醒（未能完全核對）", "body": "quiz 資料內標記答案是 C，而且 C 在『先定義需求、再評估工具』的顧問式思維上最站得住腳。但實際查證時，原始 ExamTopics 討論頁連結回傳 404（可能被擋或下架），無法直接確認社群投票分佈；另外在網路上找到轉載同一題的網站，標示的建議答案是 B，且有留言主張應選 A，顯示這題在不同轉載來源之間存在分歧，不像 Q3 那樣已核對確認無誤。建議之後有機會拿到原始 ExamTopics 頁面截圖或其他可信來源時再交叉比對一次。"}, {"heading": "記憶重點", "body": "PCA 考試常出現『如何幫助某人解決問題』這類流程題，優先考慮『先釐清需求、評估選項』的做法，而不是直接跳去指定某個具體產品或技術——但遇到答案有爭議的題目，也要保持警覺，不要盲目背答案，應理解每個選項背後的邏輯。"}]}, "postedDate": "2019-10-20", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q6", "topic": 1, "qnum": 6, "question": "You need to reduce the number of unplanned rollbacks of erroneous production deployments in your company's web hosting platform. Improvement to the QA/Test processes accomplished an 80% reduction.Which additional two approaches can you take to further reduce the rollbacks? (Choose two.)", "options": [{"letter": "A", "text": "Introduce a green-blue deployment model"}, {"letter": "B", "text": "Replace the QA environment with canary releases"}, {"letter": "C", "text": "Fragment the monolithic platform into microservices"}, {"letter": "D", "text": "Reduce the platform's dependency on relational database systems"}, {"letter": "E", "text": "Replace the platform's relational database systems with a NoSQL database"}], "answer": "AC", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54383-exam-professional-cloud-architect-topic-1-question-6/", "explanation": {"optionTable": [{"letter": "A", "analysis": "正確：藍綠部署（Blue-Green Deployment）同時維護兩套完全獨立的環境（Blue=舊版正在服務、Green=新版待命），切換流量後如果新版有問題，可以立刻切回舊環境，幾乎零停機時間做 rollback。直接針對『rollback 的恢復成本』做優化。"}, {"letter": "B", "analysis": "用 canary release 取代 QA 環境，等於少了一層上線前的防護網（跳過完整 QA 測試），反而可能讓更多 bug 流到 production，增加 rollback 風險，不是降低，所以不選。"}, {"letter": "C", "analysis": "正確：把單體架構拆成微服務後，每個服務可以獨立部署、獨立 rollback，出錯時只需要回滾單一服務，大幅降低單次部署失敗的影響範圍（blast radius），進而降低整體 rollback 頻率。"}, {"letter": "D", "analysis": "降低對關聯式資料庫的依賴，跟『降低部署 rollback 次數』沒有直接關聯，題目也沒提到資料庫效能或擴展性問題，是不相干的架構改動。"}, {"letter": "E", "analysis": "把關聯式資料庫換成 NoSQL 是巨大的架構變更，跟降低部署 rollback 頻率無關，一樣是不相干的選項。"}], "notes": [{"heading": "題目在問什麼（白話版）", "body": "rollback（回滾）是指：新版本部署上線後發現有問題（bug、當機、效能異常），必須把系統『退回』到上一個還能正常運作的舊版本。『unplanned rollback』強調這不是規劃好的，而是出狀況被迫做的緊急補救。題目情境：公司已經先『改善 QA/測試流程』，讓這種計畫外回滾減少了 80%，現在問還有哪兩個額外做法，能從『架構/部署方式』層面繼續降低 rollback 的發生頻率或影響範圍，而不是繼續在測試面下功夫。"}, {"heading": "答案驗證：AC（已交叉核對兩個來源一致）", "body": "A（藍綠部署）跟 C（拆微服務）都不是靠『測試抓更多 bug』，而是靠改變部署架構本身，讓萬一真的需要 rollback 時恢復更快、影響範圍更小。B 看似跟部署策略有關，但『用 canary 取代 QA』是拿掉一層品管關卡，邏輯是倒退而非進步；D、E 是資料庫層面的改動，跟題目問的部署/rollback 議題無關。"}, {"heading": "記憶重點", "body": "看到『降低 rollback / 降低部署風險』這類題，優先往兩個方向想：(1) 部署策略本身（blue-green、canary、rolling update 用來縮小壞版本的影響範圍或加快回滾速度），(2) 架構解耦（微服務化，縮小單次部署的影響單位）。要小心區分『縮小部署影響範圍』（有效）vs『跳過原本的品管關卡』（這是倒退，不是進步）。"}, {"heading": "什麼是 Canary Release", "body": "Canary Release（金絲雀發布）是漸進式部署策略：新版本上線時不是一次給所有使用者，而是先讓一小部分流量（例如 1%、5%）導到新版本，其餘流量走舊版本，觀察穩定後再逐步擴大比例到 100%。名稱來自礦工帶金絲雀下礦坑偵測毒氣的做法——用少量真實使用者當哨兵，先幫忙偵測新版本有沒有問題。跟藍綠部署的差別：Blue-Green 是兩套環境同時存在、流量一次性全部切換；Canary 是漸進式調整流量比例，比較的是風險曝露的使用者數量慢慢增加。Canary 的本質是『拿一部分正式流量去冒險測試』，是在 QA 測試之後用來做漸進上線的風險控制手段，不能拿來取代 QA（上線前的測試關卡）——這也是 Q6 選項 B 錯誤的原因：拿掉 QA 直接上 canary，等於讓更多沒被完整測試過的程式碼直接碰到真實使用者，風險反而變大。"}]}, "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["CI/CD", "高可用性/災難復原"]}, {"id": "T1-Q7", "topic": 1, "qnum": 7, "question": "To reduce costs, the Director of Engineering has required all developers to move their development infrastructure resources from on-premises virtual machines(VMs) to Google Cloud Platform. These resources go through multiple start/stop events during the day and require state to persist. You have been asked to design the process of running a development environment in Google Cloud while providing cost visibility to the finance department.Which two steps should you take? (Choose two.)", "options": [{"letter": "A", "text": "Use the - -no-auto-delete flag on all persistent disks and stop the VM"}, {"letter": "B", "text": "Use the - -auto-delete flag on all persistent disks and terminate the VM"}, {"letter": "C", "text": "Apply VM CPU utilization label and include it in the BigQuery billing export"}, {"letter": "D", "text": "Use Google BigQuery billing export and labels to associate cost to groups"}, {"letter": "E", "text": "Store all state into local SSD, snapshot the persistent disks, and terminate the VM"}, {"letter": "F", "text": "Store all state in Google Cloud Storage, snapshot the persistent disks, and terminate the VM"}], "answer": "AD", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54304-exam-professional-cloud-architect-topic-1-question-7/", "explanation": {"optionTable": [{"letter": "A", "analysis": "正確：用 --no-auto-delete 讓磁碟不會因 VM 被誤刪而跟著消失，再搭配 Stop（停止，不是刪除）VM——Stop 省運算費用但磁碟資料保留，完全對應『一天開關很多次、但 state 要保留』的需求。"}, {"letter": "B", "analysis": "--auto-delete（預設行為）+ Terminate（刪除 VM）：VM 被刪除時磁碟會跟著自動刪掉，資料全部消失，違反『state 要持久保留』的需求。"}, {"letter": "C", "analysis": "CPU 使用率是效能指標，不是用來做『成本分類』的標籤。財務部門想看的是『哪個團隊/專案花多少錢』，不是『CPU 用了多少』，標籤用途錯誤。"}, {"letter": "D", "analysis": "正確：把帳單明細匯出到 BigQuery，搭配幫資源貼標籤（例如依團隊/專案分類），財務就能清楚看到『哪個團隊/專案花了多少錢』，是 GCP 官方推薦的成本追蹤做法。"}, {"letter": "E", "analysis": "Local SSD 的資料跟著 VM 生命週期走，VM 被 terminate 資料就沒了；而且題目要的是『開開關關』不是『整個刪除重建』，方向錯誤。"}, {"letter": "F", "analysis": "把 state 存到 Cloud Storage 再把 VM 整個 terminate，是『VM 當拋棄式、資料另外搬家』的無狀態架構思路，但題目要的是頻繁開關機、原地保留狀態，不需要這麼複雜；且 Cloud Storage 本身不是拿來當開機磁碟用的物件儲存服務。"}], "notes": [{"heading": "題目在問什麼（白話版）", "body": "工程主管為了省錢，要求開發者把開發環境從地端搬到 GCP。這些機器一天內會被開開關關很多次（不用時關掉省錢），但機器裡的資料/進度（state）必須保留，不能一關機就不見。同時財務部門也要能看到成本流向。問要做哪兩件事。"}, {"heading": "專有名詞解釋（給不熟 GCP 的人看）", "body": "• Persistent Disk（持久性磁碟）：GCE VM 掛載的硬碟，獨立於 VM 之外，VM 關掉或刪掉時磁碟可以設定成不跟著消失。\n• Stop vs Terminate/Delete VM：Stop 是關機，不收運算費但磁碟仍在、資料都還在；Terminate/Delete 是把整台 VM 刪除，若磁碟是預設 auto-delete，會跟著一起被刪掉。\n• --auto-delete / --no-auto-delete flag：建立磁碟時的設定，預設 auto-delete 會在 VM 被刪除時自動刪磁碟；設成 no-auto-delete 則磁碟不會被自動刪除，多一層保護。\n• BigQuery billing export：把詳細帳單明細自動匯出到 BigQuery，之後可以用 SQL 查詢、做成本報表分析。\n• Labels（標籤）：幫資源貼自訂標籤（如 team、env、cost-center），可以跟 billing export 資料結合，讓財務依團隊/專案/環境分組查看花費。\n• Local SSD：焊在實體主機上的高速儲存，生命週期綁定 VM，VM 被刪除或搬遷資料就永久遺失，不像 Persistent Disk 能獨立存活。\n• Cloud Storage：物件儲存服務（存檔案用），不是拿來當 VM 開機磁碟用的儲存類型。"}, {"heading": "答案驗證：AD（推理驗證，未找到可交叉比對的外部來源）", "body": "搜尋沒找到完全對應這題的第三方核對來源，所以這題答案是靠 GCP 實際運作邏輯推導，不是像 Q6 那樣有兩個獨立來源互相佐證，信心程度中高。推理依據：A 對應『頻繁開關機但 state 要保留』→ Stop（不是刪除）+ no-auto-delete 保險；D 對應『財務要有成本可視性』→ BigQuery billing export + labels 分組，是 GCP 官方推薦的成本治理標準做法。"}, {"heading": "記憶重點", "body": "看到『VM 需要頻繁開關機、但狀態要保留』，答案方向是 Stop（不是 Delete/Terminate）+ Persistent Disk 保留；看到『給其他部門（尤其是財務等非技術部門）看成本』，答案方向幾乎都是 BigQuery billing export + Labels 分組，這是 GCP 考試裡『成本治理』類題目的固定套路。"}]}, "postedDate": "2021-06-02", "postedYear": 2021, "tags": ["Compute Engine", "BigQuery", "成本優化"]}, {"id": "T1-Q8", "topic": 1, "qnum": 8, "question": "Your company wants to track whether someone is present in a meeting room reserved for a scheduled meeting. There are 1000 meeting rooms across 5 offices on 3 continents. Each room is equipped with a motion sensor that reports its status every second. The data from the motion detector includes only a sensor ID and several different discrete items of information. Analysts will use this data, together with information about account owners and office locations.Which database type should you use?", "options": [{"letter": "A", "text": "Flat file"}, {"letter": "B", "text": "NoSQL"}, {"letter": "C", "text": "Relational"}, {"letter": "D", "text": "Blobstore"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7126-exam-professional-cloud-architect-topic-1-question-8/", "explanation": {"optionTable": [{"letter": "A", "analysis": "Flat file（平面檔案）是純文字檔或 CSV 這類最陽春的檔案儲存方式，沒有結構化索引、查詢能力極弱。1000 房間每秒回報的資料量很大、還要給分析師查詢分析，完全不適合。"}, {"letter": "B", "analysis": "正確：資料特徵是『高頻寫入（每秒 1000+ 筆）、schema 簡單固定（sensor ID + 幾個離散欄位）、需要水平擴展到多大洲多辦公室』，正是 NoSQL（尤其是 GCP 的 Cloud Bigtable）最擅長的情境，專門設計給時序性、高吞吐的 IoT/感測器資料使用。"}, {"letter": "C", "analysis": "Relational（關聯式資料庫，如 MySQL/Cloud SQL）有固定 schema、支援 JOIN 查詢，但這題是高頻寫入、結構單純的情境，用關聯式資料庫處理這種量級的時序寫入，效率和擴展性都比不上 NoSQL。"}, {"letter": "D", "analysis": "Blobstore 用來存大型二進位物件（圖片、影片、備份檔案這類整包存整包取的資料），不適合存結構化、需要頻繁查詢分析的感測器數據。"}], "notes": [{"heading": "題目在問什麼", "body": "公司想追蹤會議室是否有人使用：1000 間會議室、分布在 3 大洲 5 個辦公室，每個房間的動作感測器每秒回報一次狀態，資料只有 sensor ID 和幾個離散欄位。分析師之後要搭配帳號擁有者和辦公室地點的資訊做分析。問該用哪種資料庫類型。"}, {"heading": "答案驗證：B 正確", "body": "關鍵線索是『1000 房間 × 每秒回報一次 = 每秒上千筆寫入』加上『資料結構單純固定（只有 sensor ID + 幾個欄位）』——這是典型的高吞吐、時序型資料寫入情境，NoSQL（尤其 Cloud Bigtable）正是為這種場景設計的，支援海量寫入和水平擴展。關聯式資料庫（C）在這種寫入量級下容易成為瓶頸；Flat file（A）和 Blobstore（D）都不具備結構化查詢能力，無法支援分析師後續查詢分析的需求。"}, {"heading": "記憶重點", "body": "看到『大量感測器/IoT 裝置、高頻率寫入、資料結構簡單固定』這類題目特徵，優先考慮 NoSQL（特別是 Cloud Bigtable，GCP 官方就是拿它主打時序/IoT 資料場景）；如果題目強調『資料之間有複雜關聯、需要 JOIN、交易一致性（ACID）』，才會考慮關聯式資料庫。"}]}, "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Bigtable", "資料庫Schema設計"]}, {"id": "T1-Q9", "topic": 1, "qnum": 9, "question": "You set up an autoscaling instance group to serve web traffic for an upcoming launch. After configuring the instance group as a backend service to an HTTP(S) load balancer, you notice that virtual machine (VM) instances are being terminated and re-launched every minute. The instances do not have a public IP address.You have verified the appropriate web response is coming from each instance using the curl command. You want to ensure the backend is configured correctly.What should you do?", "options": [{"letter": "A", "text": "Ensure that a firewall rules exists to allow source traffic on HTTP/HTTPS to reach the load balancer."}, {"letter": "B", "text": "Assign a public IP to each instance and configure a firewall rule to allow the load balancer to reach the instance public IP."}, {"letter": "C", "text": "Ensure that a firewall rule exists to allow load balancer health checks to reach the instances in the instance group."}, {"letter": "D", "text": "Create a tag on each instance with the name of the load balancer. Configure a firewall rule with the name of the load balancer as the source and the instance tag as the destination."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7130-exam-professional-cloud-architect-topic-1-question-9/", "explanation": {"optionTable": [{"letter": "A", "analysis": "防火牆允許『使用者的 HTTP/HTTPS 流量』連到 Load Balancer，這是給一般使用者流量用的規則，跟『Load Balancer 內部要去檢查 instance 健康狀態』是兩條不同的流量路徑，不會解決 instance 被 autoheal 刪除的問題。"}, {"letter": "B", "analysis": "給每台 instance 配 public IP 是錯誤方向——GCP Load Balancer 本來就設計成透過內部網路連到沒有 public IP 的 backend instance，額外開 public IP 反而增加攻擊面，也不解決健康檢查的問題。"}, {"letter": "C", "analysis": "正確：instance 每分鐘被終止重啟 = Managed Instance Group 的 autohealing 機制判定 instance 不健康。GCP 健康檢查探測流量來自官方特定 IP 範圍（130.211.0.0/22、35.191.0.0/16），如果防火牆沒放行這兩段 IP，健康檢查包進不去，系統誤判 instance 壞掉，觸發 autohealing 重建迴圈——這跟手動 curl 測試（從別處發出）能連得到是兩回事。"}, {"letter": "D", "analysis": "用『Load Balancer 名稱』當防火牆規則的來源，技術上不成立——GCP 防火牆規則的來源是用 IP 範圍或 network tag 做比對，不是用 Load Balancer 名稱當來源。"}], "notes": [{"heading": "基礎知識鋪墊（給不熟 GCP 的人看）", "body": "① Load Balancer：流量很大時用來分散請求給後面多台伺服器的『交通警察』，這題用的是 HTTP(S) Load Balancer，專門處理網頁流量。\n② Managed Instance Group (MIG)：把一群 VM 當成一組管理，具備 Autoscaling（自動依流量開關 VM）和 Autohealing（自我修復：VM 壞掉自動刪除重建）兩種自動化能力。\n③ Health Check（健康檢查）：Load Balancer/MIG 會定期自動發測試請求問每台 VM『你還好嗎』。沒回應就判定不健康，觸發 autohealing 把它刪掉重建——這題的症狀（每分鐘被終止重啟）就是 autohealing 一直判定 VM 不健康。\n④ Firewall（防火牆規則）：決定『什麼來源的流量可以連到什麼目標的哪個 port』，預設不是什麼流量都放行。GCP 健康檢查探測流量來自官方特定的兩段 IP 範圍（不是使用者流量、也不是你自己電腦發的 curl），如果防火牆沒額外放行這兩段 IP，健康檢查會被擋住。\n⑤ Public IP vs 內部網路：VM 沒有 public IP 是常見的安全做法，所有對外流量只透過 Load Balancer（走 GCP 內部網路）轉進來，VM 本身不需要暴露在公開網路上。"}, {"heading": "題目在問什麼", "body": "設定了 autoscaling instance group 接 HTTP(S) Load Balancer 當 backend，VM 沒有 public IP。發現 VM 每分鐘被終止、重新啟動，但自己手動用 curl 測試過，每台 VM 應用程式本身回應正常。問該怎麼確保 backend 設定正確。"}, {"heading": "答案驗證：C（已查證，推理與外部來源一致）", "body": "搜尋到的相關資料（gcpstudyhub 等）都指向同一個核心邏輯：VM 不斷被終止重建 + 手動測試應用程式本身正常，這個組合幾乎都是『健康檢查探測流量被防火牆擋住』。解法是開防火牆允許 GCP 健康檢查的官方 IP 範圍（130.211.0.0/22、35.191.0.0/16）連進 backend instance，對應答案 C。"}, {"heading": "記憶重點", "body": "看到『instance 不斷被終止重建』+『手動測試應用程式本身是正常的』這個組合，第一個該想到的是『健康檢查探測流量被防火牆擋住』，不是應用程式本身的 bug。解法方向是檢查/新增防火牆規則，放行 GCP 健康檢查專屬 IP 範圍，而不是亂猜去改 public IP 或用不存在的防火牆設定方式（如用 LB 名稱當來源）。"}]}, "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Load Balancing", "VPC/網路"]}, {"id": "T1-Q10", "topic": 1, "qnum": 10, "question": "You write a Python script to connect to Google BigQuery from a Google Compute Engine virtual machine. The script is printing errors that it cannot connect toBigQuery.What should you do to fix the script?", "options": [{"letter": "A", "text": "Install the latest BigQuery API client library for Python"}, {"letter": "B", "text": "Run your script on a new virtual machine with the BigQuery access scope enabled"}, {"letter": "C", "text": "Create a new service account with BigQuery access and execute your script with that user"}, {"letter": "D", "text": "Install the bq component for gcloud with the command gcloud components install bq."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7041-exam-professional-cloud-architect-topic-1-question-10/", "explanation": {"optionTable": [{"letter": "A", "analysis": "假設是 library 版本太舊/沒裝導致連不上，但題目描述的是『連線錯誤（cannot connect）』，不是 library 版本不相容的典型症狀（那通常是 ModuleNotFoundError 或 import 失敗），不是最可能的根因。"}, {"letter": "B", "analysis": "開啟 Access Scope 技術上也能解決問題，但屬於比較舊式的做法。Access Scope 是建立 VM 當下設定『這台 VM 的預設服務帳號被允許呼叫哪些 API』的機器層級粗略開關。Google 現在建議 access scope 設定寬鬆的 cloud-platform，實際權限交給 IAM 角色細緻管理，不是靠 access scope 一個個勾選，且還要換一台新 VM，代價較高，不是官方建議的標準解法。"}, {"letter": "C", "analysis": "正確：Google 官方建議的最佳實務是透過 IAM 角色 + Service Account 管理權限（細緻、可追蹤、可個別撤銷），而不是靠 VM 層級的 access scope。建立專屬 service account、賦予 BigQuery IAM 權限，用這個身分執行腳本，是正規做法。"}, {"letter": "D", "analysis": "bq 是 command-line 工具（終端機操作 BigQuery 用），跟 Python 腳本透過 API/client library 連線是兩回事，裝 bq 元件不會影響 Python 程式呼叫 BigQuery API 的權限或連線行為，答非所問。"}], "notes": [{"heading": "題目在問什麼", "body": "在 Compute Engine VM 上寫 Python 腳本連線 Google BigQuery，腳本印出錯誤說連不上 BigQuery。問該怎麼修。"}, {"heading": "答案驗證：C（推理+部分佐證，社群對 B/C 有討論空間）", "body": "這題的核心是 Access Scope vs IAM 角色 兩種權限機制的取捨。搜尋到的資料證實『VM 的 access scope 會限制住即使 service account 已有 IAM 角色也打不通 API』這個現象確實存在，代表 B 技術上也能解決問題。但 Google 官方建議的標準做法是用 cloud-platform 這種寬鬆 scope 搭配 IAM 角色做細緻管理，而不是靠 access scope 一個個開放特定 API，所以偏好 C 作為『正規最佳實務』的答案。沒有找到直接核對這題確切投票結果的原始 ExamTopics 頁面，信心中等偏高。"}, {"heading": "記憶重點", "body": "看到『Compute Engine VM 呼叫某個 GCP API 連不上』這類題，如果選項同時出現『改 access scope』和『用 IAM 角色 + service account』兩種方向，優先選 IAM + service account 這條路——這是 Google 現在推薦的標準做法，access scope 是比較舊式、該被取代的機制。另外要分清楚：bq 是 CLI 工具，跟 Python 用 client library 連線 API 是不同的東西。"}]}, "postedDate": "2019-10-23", "postedYear": 2019, "tags": ["Compute Engine", "IAM", "BigQuery"]}, {"id": "T1-Q11", "topic": 1, "qnum": 11, "question": "Your customer is moving an existing corporate application to Google Cloud Platform from an on-premises data center. The business owners require minimal user disruption. There are strict security team requirements for storing passwords.What authentication strategy should they use?", "options": [{"letter": "A", "text": "Use G Suite Password Sync to replicate passwords into Google"}, {"letter": "B", "text": "Federate authentication via SAML 2.0 to the existing Identity Provider"}, {"letter": "C", "text": "Provision users in Google using the Google Cloud Directory Sync tool"}, {"letter": "D", "text": "Ask users to set their Google password to match their corporate password"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7133-exam-professional-cloud-architect-topic-1-question-11/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["IAM", "安全性", "混合雲"]}, {"id": "T1-Q12", "topic": 1, "qnum": 12, "question": "Your company has successfully migrated to the cloud and wants to analyze their data stream to optimize operations. They do not have any existing code for this analysis, so they are exploring all their options. These options include a mix of batch and stream processing, as they are running some hourly jobs and live- processing some data as it comes in.Which technology should they use for this?", "options": [{"letter": "A", "text": "Google Cloud Dataproc"}, {"letter": "B", "text": "Google Cloud Dataflow"}, {"letter": "C", "text": "Google Container Engine with Bigtable"}, {"letter": "D", "text": "Google Compute Engine with Google BigQuery"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7134-exam-professional-cloud-architect-topic-1-question-12/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Dataflow/Dataproc"]}, {"id": "T1-Q13", "topic": 1, "qnum": 13, "question": "Your customer is receiving reports that their recently updated Google App Engine application is taking approximately 30 seconds to load for some of their users.This behavior was not reported before the update.What strategy should you take?", "options": [{"letter": "A", "text": "Work with your ISP to diagnose the problem"}, {"letter": "B", "text": "Open a support ticket to ask for network capture and flow data to diagnose the problem, then roll back your application"}, {"letter": "C", "text": "Roll back to an earlier known good release initially, then use Stackdriver Trace and Logging to diagnose the problem in a development/test/staging environment"}, {"letter": "D", "text": "Roll back to an earlier known good release, then push the release again at a quieter period to investigate. Then use Stackdriver Trace and Logging to diagnose the problem"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7137-exam-professional-cloud-architect-topic-1-question-13/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["App Engine", "Cloud Trace/Profiler", "監控與可觀測性"]}, {"id": "T1-Q14", "topic": 1, "qnum": 14, "question": "A production database virtual machine on Google Compute Engine has an ext4-formatted persistent disk for data files. The database is about to run out of storage space.How can you remediate the problem with the least amount of downtime?", "options": [{"letter": "A", "text": "In the Cloud Platform Console, increase the size of the persistent disk and use the resize2fs command in Linux."}, {"letter": "B", "text": "Shut down the virtual machine, use the Cloud Platform Console to increase the persistent disk size, then restart the virtual machine"}, {"letter": "C", "text": "In the Cloud Platform Console, increase the size of the persistent disk and verify the new space is ready to use with the fdisk command in Linux"}, {"letter": "D", "text": "In the Cloud Platform Console, create a new persistent disk attached to the virtual machine, format and mount it, and configure the database service to move the files to the new disk"}, {"letter": "E", "text": "In the Cloud Platform Console, create a snapshot of the persistent disk restore the snapshot to a new larger disk, unmount the old disk, mount the new disk and restart the database service"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7142-exam-professional-cloud-architect-topic-1-question-14/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Compute Engine", "效能調校"]}, {"id": "T1-Q15", "topic": 1, "qnum": 15, "question": "Your application needs to process credit card transactions. You want the smallest scope of Payment Card Industry (PCI) compliance without compromising the ability to analyze transactional data and trends relating to which payment methods are used.How should you design your architecture?", "options": [{"letter": "A", "text": "Create a tokenizer service and store only tokenized data"}, {"letter": "B", "text": "Create separate projects that only process credit card data"}, {"letter": "C", "text": "Create separate subnetworks and isolate the components that process credit card data"}, {"letter": "D", "text": "Streamline the audit discovery phase by labeling all of the virtual machines (VMs) that process PCI data"}, {"letter": "E", "text": "Enable Logging export to Google BigQuery and use ACLs and views to scope the data shared with the auditor"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7147-exam-professional-cloud-architect-topic-1-question-15/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["合規性", "安全性"]}, {"id": "T1-Q16", "topic": 1, "qnum": 16, "question": "You have been asked to select the storage system for the click-data of your company's large portfolio of websites. This data is streamed in from a custom website analytics package at a typical rate of 6,000 clicks per minute. With bursts of up to 8,500 clicks per second. It must have been stored for future analysis by your data science and user experience teams.Which storage infrastructure should you choose?", "options": [{"letter": "A", "text": "Google Cloud SQL"}, {"letter": "B", "text": "Google Cloud Bigtable"}, {"letter": "C", "text": "Google Cloud Storage"}, {"letter": "D", "text": "Google Cloud Datastore"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/20238-exam-professional-cloud-architect-topic-1-question-16/", "postedDate": "2020-05-10", "postedYear": 2020, "tags": ["Bigtable", "資料庫Schema設計"]}, {"id": "T1-Q17", "topic": 1, "qnum": 17, "question": "You are creating a solution to remove backup files older than 90 days from your backup Cloud Storage bucket. You want to optimize ongoing Cloud Storage spend.What should you do?", "options": [{"letter": "A", "text": "Write a lifecycle management rule in XML and push it to the bucket with gsutil"}, {"letter": "B", "text": "Write a lifecycle management rule in JSON and push it to the bucket with gsutil"}, {"letter": "C", "text": "Schedule a cron script using gsutil ls ג€\"lr gs://backups/** to find and remove items older than 90 days"}, {"letter": "D", "text": "Schedule a cron script using gsutil ls ג€\"l gs://backups/** to find and remove items older than 90 days and schedule it with cron"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7150-exam-professional-cloud-architect-topic-1-question-17/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Cloud Storage", "成本優化"]}, {"id": "T1-Q18", "topic": 1, "qnum": 18, "question": "Your company is forecasting a sharp increase in the number and size of Apache Spark and Hadoop jobs being run on your local datacenter. You want to utilize the cloud to help you scale this upcoming demand with the least amount of operations work and code change.Which product should you use?", "options": [{"letter": "A", "text": "Google Cloud Dataflow"}, {"letter": "B", "text": "Google Cloud Dataproc"}, {"letter": "C", "text": "Google Compute Engine"}, {"letter": "D", "text": "Google Kubernetes Engine"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7154-exam-professional-cloud-architect-topic-1-question-18/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Dataflow/Dataproc", "資料遷移"]}, {"id": "T1-Q19", "topic": 1, "qnum": 19, "question": "The database administration team has asked you to help them improve the performance of their new database server running on Google Compute Engine. The database is for importing and normalizing their performance statistics and is built with MySQL running on Debian Linux. They have an n1-standard-8 virtual machine with 80 GB of SSD persistent disk.What should they change to get better performance from this system?", "options": [{"letter": "A", "text": "Increase the virtual machine's memory to 64 GB"}, {"letter": "B", "text": "Create a new virtual machine running PostgreSQL"}, {"letter": "C", "text": "Dynamically resize the SSD persistent disk to 500 GB"}, {"letter": "D", "text": "Migrate their performance metrics warehouse to BigQuery"}, {"letter": "E", "text": "Modify all of their batch jobs to use bulk inserts into the database"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7161-exam-professional-cloud-architect-topic-1-question-19/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Compute Engine", "Cloud SQL", "效能調校"]}, {"id": "T1-Q20", "topic": 1, "qnum": 20, "question": "You want to optimize the performance of an accurate, real-time, weather-charting application. The data comes from 50,000 sensors sending 10 readings a second, in the format of a timestamp and sensor reading.Where should you store the data?", "options": [{"letter": "A", "text": "Google BigQuery"}, {"letter": "B", "text": "Google Cloud SQL"}, {"letter": "C", "text": "Google Cloud Bigtable"}, {"letter": "D", "text": "Google Cloud Storage"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/22386-exam-professional-cloud-architect-topic-1-question-20/", "postedDate": "2020-06-07", "postedYear": 2020, "tags": ["Bigtable", "效能調校"]}, {"id": "T1-Q21", "topic": 1, "qnum": 21, "question": "Your company's user-feedback portal comprises a standard LAMP stack replicated across two zones. It is deployed in the us-central1 region and uses autoscaled managed instance groups on all layers, except the database. Currently, only a small group of select customers have access to the portal. The portal meets a99,99% availability SLA under these conditions. However next quarter, your company will be making the portal available to all users, including unauthenticated users. You need to develop a resiliency testing strategy to ensure the system maintains the SLA once they introduce additional user load.What should you do?", "options": [{"letter": "A", "text": "Capture existing users input, and replay captured user load until autoscale is triggered on all layers. At the same time, terminate all resources in one of the zones"}, {"letter": "B", "text": "Create synthetic random user input, replay synthetic load until autoscale logic is triggered on at least one layer, and introduce ג€chaosג€ to the system by terminating random resources on both zones"}, {"letter": "C", "text": "Expose the new system to a larger group of users, and increase group size each day until autoscale logic is triggered on all layers. At the same time, terminate random resources on both zones"}, {"letter": "D", "text": "Capture existing users input, and replay captured user load until resource utilization crosses 80%. Also, derive estimated number of users based on existing user's usage of the app, and deploy enough resources to handle 200% of expected load"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7128-exam-professional-cloud-architect-topic-1-question-21/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["自動擴縮", "高可用性/災難復原"]}, {"id": "T1-Q22", "topic": 1, "qnum": 22, "question": "One of the developers on your team deployed their application in Google Container Engine with the Dockerfile below. They report that their application deployments are taking too long.You want to optimize this Dockerfile for faster deployment times without adversely affecting the app's functionality.Which two actions should you take? (Choose two.)", "options": [{"letter": "A", "text": "Remove Python after running pip"}, {"letter": "B", "text": "Remove dependencies from requirements.txt"}, {"letter": "C", "text": "Use a slimmed-down base image like Alpine Linux"}, {"letter": "D", "text": "Use larger machine types for your Google Container Engine node pools"}, {"letter": "E", "text": "Copy the source after he package dependencies (Python and pip) are installed"}], "answer": "CE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54406-exam-professional-cloud-architect-topic-1-question-22/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["GKE/Kubernetes", "容器化", "效能調校"]}, {"id": "T1-Q23", "topic": 1, "qnum": 23, "question": "Your solution is producing performance bugs in production that you did not see in staging and test environments. You want to adjust your test and deployment procedures to avoid this problem in the future.What should you do?", "options": [{"letter": "A", "text": "Deploy fewer changes to production"}, {"letter": "B", "text": "Deploy smaller changes to production"}, {"letter": "C", "text": "Increase the load on your test and staging environments"}, {"letter": "D", "text": "Deploy changes to a small subset of users before rolling out to production"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7167-exam-professional-cloud-architect-topic-1-question-23/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["CI/CD"]}, {"id": "T1-Q24", "topic": 1, "qnum": 24, "question": "A small number of API requests to your microservices-based application take a very long time. You know that each request to the API can traverse many services.You want to know which service takes the longest in those cases.What should you do?", "options": [{"letter": "A", "text": "Set timeouts on your application so that you can fail requests faster"}, {"letter": "B", "text": "Send custom metrics for each of your requests to Stackdriver Monitoring"}, {"letter": "C", "text": "Use Stackdriver Monitoring to look for insights that show when your API latencies are high"}, {"letter": "D", "text": "Instrument your application with Stackdriver Trace in order to break down the request latencies at each microservice"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10898-exam-professional-cloud-architect-topic-1-question-24/", "postedDate": "2019-12-25", "postedYear": 2019, "tags": ["Cloud Trace/Profiler", "監控與可觀測性"]}, {"id": "T1-Q25", "topic": 1, "qnum": 25, "question": "During a high traffic portion of the day, one of your relational databases crashes, but the replica is never promoted to a master. You want to avoid this in the future.What should you do?", "options": [{"letter": "A", "text": "Use a different database"}, {"letter": "B", "text": "Choose larger instances for your database"}, {"letter": "C", "text": "Create snapshots of your database more regularly"}, {"letter": "D", "text": "Implement routinely scheduled failovers of your databases"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7118-exam-professional-cloud-architect-topic-1-question-25/", "postedDate": "2019-10-24", "postedYear": 2019, "tags": ["Cloud SQL", "高可用性/災難復原"]}, {"id": "T1-Q26", "topic": 1, "qnum": 26, "question": "Your organization requires that metrics from all applications be retained for 5 years for future analysis in possible legal proceedings.Which approach should you use?", "options": [{"letter": "A", "text": "Grant the security team access to the logs in each Project"}, {"letter": "B", "text": "Configure Stackdriver Monitoring for all Projects, and export to BigQuery"}, {"letter": "C", "text": "Configure Stackdriver Monitoring for all Projects with the default retention policies"}, {"letter": "D", "text": "Configure Stackdriver Monitoring for all Projects, and export to Google Cloud Storage"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7172-exam-professional-cloud-architect-topic-1-question-26/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["Cloud Monitoring/Logging", "Cloud Storage", "合規性"]}, {"id": "T1-Q27", "topic": 1, "qnum": 27, "question": "Your company has decided to build a backup replica of their on-premises user authentication PostgreSQL database on Google Cloud Platform. The database is 4TB, and large updates are frequent. Replication requires private address space communication.Which networking approach should you use?", "options": [{"letter": "A", "text": "Google Cloud Dedicated Interconnect"}, {"letter": "B", "text": "Google Cloud VPN connected to the data center network"}, {"letter": "C", "text": "A NAT and TLS translation gateway installed on-premises"}, {"letter": "D", "text": "A Google Compute Engine instance with a VPN server installed connected to the data center network"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/11781-exam-professional-cloud-architect-topic-1-question-27/", "postedDate": "2020-01-11", "postedYear": 2020, "tags": ["Interconnect/VPN", "Cloud SQL", "高可用性/災難復原"]}, {"id": "T1-Q28", "topic": 1, "qnum": 28, "question": "Auditors visit your teams every 12 months and ask to review all the Google Cloud Identity and Access Management (Cloud IAM) policy changes in the previous 12 months. You want to streamline and expedite the analysis and audit process.What should you do?", "options": [{"letter": "A", "text": "Create custom Google Stackdriver alerts and send them to the auditor"}, {"letter": "B", "text": "Enable Logging export to Google BigQuery and use ACLs and views to scope the data shared with the auditor"}, {"letter": "C", "text": "Use cloud functions to transfer log entries to Google Cloud SQL and use ACLs and views to limit an auditor's view"}, {"letter": "D", "text": "Enable Google Cloud Storage (GCS) log export to audit logs into a GCS bucket and delegate access to the bucket"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6884-exam-professional-cloud-architect-topic-1-question-28/", "postedDate": "2019-10-21", "postedYear": 2019, "tags": ["IAM", "BigQuery", "合規性"]}, {"id": "T1-Q29", "topic": 1, "qnum": 29, "question": "You are designing a large distributed application with 30 microservices. Each of your distributed microservices needs to connect to a database back-end. You want to store the credentials securely.Where should you store the credentials?", "options": [{"letter": "A", "text": "In the source code"}, {"letter": "B", "text": "In an environment variable"}, {"letter": "C", "text": "In a secret management system"}, {"letter": "D", "text": "In a config file that has restricted access through ACLs"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7200-exam-professional-cloud-architect-topic-1-question-29/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["安全性", "IAM"]}, {"id": "T1-Q30", "topic": 1, "qnum": 30, "question": "A lead engineer wrote a custom tool that deploys virtual machines in the legacy data center. He wants to migrate the custom tool to the new cloud environment.You want to advocate for the adoption of Google Cloud Deployment Manager.What are two business risks of migrating to Cloud Deployment Manager? (Choose two.)", "options": [{"letter": "A", "text": "Cloud Deployment Manager uses Python"}, {"letter": "B", "text": "Cloud Deployment Manager APIs could be deprecated in the future"}, {"letter": "C", "text": "Cloud Deployment Manager is unfamiliar to the company's engineers"}, {"letter": "D", "text": "Cloud Deployment Manager requires a Google APIs service account to run"}, {"letter": "E", "text": "Cloud Deployment Manager can be used to permanently delete cloud resources"}, {"letter": "F", "text": "Cloud Deployment Manager only supports automation of Google Cloud resources"}], "answer": "CF", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54125-exam-professional-cloud-architect-topic-1-question-30/", "postedDate": "2021-06-01", "postedYear": 2021, "tags": ["Terraform/IaC"]}, {"id": "T1-Q31", "topic": 1, "qnum": 31, "question": "A development manager is building a new application. He asks you to review his requirements and identify what cloud technologies he can use to meet them. The application must:1. Be based on open-source technology for cloud portability2. Dynamically scale compute capacity based on demand3. Support continuous software delivery4. Run multiple segregated copies of the same application stack5. Deploy application bundles using dynamic templates6. Route network traffic to specific services based on URLWhich combination of technologies will meet all of his requirements?", "options": [{"letter": "A", "text": "Google Kubernetes Engine, Jenkins, and Helm"}, {"letter": "B", "text": "Google Kubernetes Engine and Cloud Load Balancing"}, {"letter": "C", "text": "Google Kubernetes Engine and Cloud Deployment Manager"}, {"letter": "D", "text": "Google Kubernetes Engine, Jenkins, and Cloud Load Balancing"}], "answer": "A", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54389-exam-professional-cloud-architect-topic-1-question-31/", "postedDate": "2021-06-03", "postedYear": 2021, "tags": ["GKE/Kubernetes", "容器化", "CI/CD"]}, {"id": "T1-Q32", "topic": 1, "qnum": 32, "question": "You have created several pre-emptible Linux virtual machine instances using Google Compute Engine. You want to properly shut down your application before the virtual machines are preempted.What should you do?", "options": [{"letter": "A", "text": "Create a shutdown script named k99.shutdown in the /etc/rc.6.d/ directory"}, {"letter": "B", "text": "Create a shutdown script registered as a xinetd service in Linux and configure a Stackdriver endpoint check to call the service"}, {"letter": "C", "text": "Create a shutdown script and use it as the value for a new metadata entry with the key shutdown-script in the Cloud Platform Console when you create the new virtual machine instance"}, {"letter": "D", "text": "Create a shutdown script, registered as a xinetd service in Linux, and use the gcloud compute instances add-metadata command to specify the service URL as the value for a new metadata entry with the key shutdown-script-url"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7202-exam-professional-cloud-architect-topic-1-question-32/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["Compute Engine", "成本優化"]}, {"id": "T1-Q33", "topic": 1, "qnum": 33, "question": "Your organization has a 3-tier web application deployed in the same network on Google Cloud Platform. Each tier (web, API, and database) scales independently of the others. Network traffic should flow through the web to the API tier and then on to the database tier. Traffic should not flow between the web and the database tier.How should you configure the network?", "options": [{"letter": "A", "text": "Add each tier to a different subnetwork"}, {"letter": "B", "text": "Set up software based firewalls on individual VMs"}, {"letter": "C", "text": "Add tags to each tier and set up routes to allow the desired traffic flow"}, {"letter": "D", "text": "Add tags to each tier and set up firewall rules to allow the desired traffic flow"}], "answer": "D", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/9033-exam-professional-cloud-architect-topic-1-question-33/", "postedDate": "2019-11-25", "postedYear": 2019, "tags": ["VPC/網路", "安全性"]}, {"id": "T1-Q34", "topic": 1, "qnum": 34, "question": "Your development team has installed a new Linux kernel module on the batch servers in Google Compute Engine (GCE) virtual machines (VMs) to speed up the nightly batch process. Two days after the installation, 50% of the batch servers failed the nightly batch run. You want to collect details on the failure to pass back to the development team.Which three actions should you take? (Choose three.)", "options": [{"letter": "A", "text": "Use Stackdriver Logging to search for the module log entries"}, {"letter": "B", "text": "Read the debug GCE Activity log using the API or Cloud Console"}, {"letter": "C", "text": "Use gcloud or Cloud Console to connect to the serial console and observe the logs"}, {"letter": "D", "text": "Identify whether a live migration event of the failed server occurred, using in the activity log"}, {"letter": "E", "text": "Adjust the Google Stackdriver timeline to match the failure time, and observe the batch server metrics"}, {"letter": "F", "text": "Export a debug VM into an image, and run the image on a local server where kernel log messages will be displayed on the native screen"}], "answer": "ACE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54535-exam-professional-cloud-architect-topic-1-question-34/", "postedDate": "2021-06-04", "postedYear": 2021, "tags": ["Cloud Monitoring/Logging", "監控與可觀測性"]}, {"id": "T1-Q35", "topic": 1, "qnum": 35, "question": "Your company wants to try out the cloud with low risk. They want to archive approximately 100 TB of their log data to the cloud and test the analytics features available to them there, while also retaining that data as a long-term disaster recovery backup.Which two steps should you take? (Choose two.)", "options": [{"letter": "A", "text": "Load logs into Google BigQuery"}, {"letter": "B", "text": "Load logs into Google Cloud SQL"}, {"letter": "C", "text": "Import logs into Google Stackdriver"}, {"letter": "D", "text": "Insert logs into Google Cloud Bigtable"}, {"letter": "E", "text": "Upload log files into Google Cloud Storage"}], "answer": "AE", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/54534-exam-professional-cloud-architect-topic-1-question-35/", "postedDate": "2021-06-04", "postedYear": 2021, "tags": ["Cloud Storage", "BigQuery", "成本優化"]}, {"id": "T1-Q36", "topic": 1, "qnum": 36, "question": "You created a pipeline that can deploy your source code changes to your infrastructure in instance groups for self-healing. One of the changes negatively affects your key performance indicator. You are not sure how to fix it, and investigation could take up to a week.What should you do?", "options": [{"letter": "A", "text": "Log in to a server, and iterate on the fox locally"}, {"letter": "B", "text": "Revert the source code change, and rerun the deployment pipeline"}, {"letter": "C", "text": "Log into the servers with the bad code change, and swap in the previous code"}, {"letter": "D", "text": "Change the instance group template to the previous one, and delete all instances"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/10522-exam-professional-cloud-architect-topic-1-question-36/", "postedDate": "2019-12-17", "postedYear": 2019, "tags": ["CI/CD"]}, {"id": "T1-Q37", "topic": 1, "qnum": 37, "question": "Your organization wants to control IAM policies for different departments independently, but centrally.Which approach should you take?", "options": [{"letter": "A", "text": "Multiple Organizations with multiple Folders"}, {"letter": "B", "text": "Multiple Organizations, one for each department"}, {"letter": "C", "text": "A single Organization with Folders for each department"}, {"letter": "D", "text": "A single Organization with multiple projects, each with a central owner"}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7208-exam-professional-cloud-architect-topic-1-question-37/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["IAM", "Organization Policy"]}, {"id": "T1-Q38", "topic": 1, "qnum": 38, "question": "You deploy your custom Java application to Google App Engine. It fails to deploy and gives you the following stack trace.What should you do?", "options": [{"letter": "A", "text": "Upload missing JAR files and redeploy your application."}, {"letter": "B", "text": "Digitally sign all of your JAR files and redeploy your application"}, {"letter": "C", "text": "Recompile the CLoakedServlet class using and MD5 hash instead of SHA1"}], "answer": "B", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/7209-exam-professional-cloud-architect-topic-1-question-38/", "postedDate": "2019-10-25", "postedYear": 2019, "tags": ["App Engine"]}, {"id": "T1-Q39", "topic": 1, "qnum": 39, "question": "You are designing a mobile chat application. You want to ensure people cannot spoof chat messages, by providing a message were sent by a specific user.What should you do?", "options": [{"letter": "A", "text": "Tag messages client side with the originating user identifier and the destination user."}, {"letter": "B", "text": "Encrypt the message client side using block-based encryption with a shared key."}, {"letter": "C", "text": "Use public key infrastructure (PKI) to encrypt the message client side using the originating user's private key."}, {"letter": "D", "text": "Use a trusted certificate authority to enable SSL connectivity between the client application and the server."}], "answer": "C", "caseStudy": null, "link": "https://www.examtopics.com/discussions/google/view/6844-exam-professional-cloud-architect-topic-1-question-39/", "postedDate": "2019-10-20", "postedYear": 2019, "tags": ["Cloud KMS/加密", "安全性"]}, {"id": "T1-Q40", "topic": 1, "qnum": 40, "question": "As part of implementing their disaster recovery plan, your company is trying to replicate their production MySQL database from their private data center to theirGCP project using a Google Cloud VPN connection. They are experiencing latency issues and a small amount of packet loss that is disrupting the replication.What should they do?", "options": [{"letter": "A", "text": "Configure their replicatio
